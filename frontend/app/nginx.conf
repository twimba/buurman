# ──────────────────────────────────────────────────────────────────────────────
# Restrict /build-info.json CORS to the backoffice origin only.
# ──────────────────────────────────────────────────────────────────────────────
map $http_origin $backoffice_cors_origin {
    "https://backoffice.buurman.io" "https://backoffice.buurman.io";
    default                         "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers — server-block level ─────────────────────────────────
    # Only apply to locations that define NO add_header of their own.
    # nginx drops ALL parent add_header directives the moment a child location
    # adds any header of its own — so each location block below repeats the
    # full set of headers it needs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://accounts.google.com https://static.cloudflareinsights.com https://eu-assets.i.posthog.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.buurman.io https://*.googleapis.com https://cloudflareinsights.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; frame-src 'self' https://*.buurman.io https://*.your-objectstorage.com; frame-ancestors 'none';" always;

    # ── Runtime config — never cache ──────────────────────────────────────────
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://accounts.google.com https://static.cloudflareinsights.com https://eu-assets.i.posthog.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.buurman.io https://*.googleapis.com https://cloudflareinsights.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; frame-src 'self' https://*.buurman.io https://*.your-objectstorage.com; frame-ancestors 'none';" always;
    }

    # ── Build info — CORS restricted to backoffice origin ─────────────────────
    location = /build-info.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin $backoffice_cors_origin always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://accounts.google.com https://static.cloudflareinsights.com https://eu-assets.i.posthog.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.buurman.io https://*.googleapis.com https://cloudflareinsights.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; frame-src 'self' https://*.buurman.io https://*.your-objectstorage.com; frame-ancestors 'none';" always;
    }

    # ── Silent SSO — must be frameable by keycloak.js same-origin iframe ──────
    # Intentionally overrides frame-ancestors to 'self' so Keycloak can embed
    # this page in an invisible iframe during silent SSO renewal.
    # X-Frame-Options is intentionally omitted: it would block the iframe even
    # when CSP frame-ancestors permits it (CSP wins in modern browsers, but
    # X-Frame-Options is checked first in some older ones).
    location = /silent-check-sso.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-GcBmWy8dVuOpGQHtN8tbqK0FLtD8MUR4qjAqg3cDvMw='; frame-ancestors 'self';" always;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type "text/plain" always;
    }

    # ── Hashed static assets — long-lived immutable cache ─────────────────────
    # Vite adds content hashes to filenames under /assets/, so these can be
    # cached indefinitely. CSP still required — browsers apply it to JS/CSS.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://accounts.google.com https://static.cloudflareinsights.com https://eu-assets.i.posthog.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.buurman.io https://*.googleapis.com https://cloudflareinsights.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; frame-src 'self' https://*.buurman.io https://*.your-objectstorage.com; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    # ── index.html — never cache, full security headers ───────────────────────
    # Exact-match location takes priority over the prefix location / below,
    # so both direct hits and SPA fallback rewrites pick up these headers.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com https://accounts.google.com https://static.cloudflareinsights.com https://eu-assets.i.posthog.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.buurman.io https://*.googleapis.com https://cloudflareinsights.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; frame-src 'self' https://*.buurman.io https://*.your-objectstorage.com; frame-ancestors 'none';" always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # No add_header here — this location serves either a real file (which picks
    # up server-block headers) or falls back to /index.html (which is then
    # handled by the exact-match location above via an internal redirect).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
