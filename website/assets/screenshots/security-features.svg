<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fc"/>

  <!-- Main Card -->
  <g transform="translate(20, 20)">
    <rect width="360" height="260" rx="12" fill="white" filter="url(#shadow)"/>

    <!-- Shield Icon -->
    <g transform="translate(130, 40)">
      <path d="M 50 0 L 80 15 L 80 55 Q 80 75 50 90 Q 20 75 20 55 L 20 15 Z" fill="#5c7cfa" opacity="0.15" stroke="#5c7cfa" stroke-width="3"/>
      <path d="M 50 20 L 65 30 L 65 55 Q 65 65 50 75 Q 35 65 35 55 L 35 30 Z" fill="#5c7cfa"/>
      <circle cx="50" cy="50" r="8" fill="white"/>
      <path d="M 47 50 L 49 52 L 53 48" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Security Features List -->
    <g transform="translate(40, 150)">
      <!-- Feature 1 -->
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="8" y="14" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
      <rect x="25" y="5" width="120" height="10" rx="5" fill="#1a1d2e"/>

      <!-- Feature 2 -->
      <circle cx="10" cy="35" r="6" fill="#10b981"/>
      <text x="8" y="39" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
      <rect x="25" y="30" width="100" height="10" rx="5" fill="#1a1d2e"/>

      <!-- Feature 3 -->
      <circle cx="10" cy="60" r="6" fill="#10b981"/>
      <text x="8" y="64" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
      <rect x="25" y="55" width="110" height="10" rx="5" fill="#1a1d2e"/>
    </g>

    <g transform="translate(210, 150)">
      <!-- Feature 4 -->
      <circle cx="10" cy="10" r="6" fill="#10b981"/>
      <text x="8" y="14" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
      <rect x="25" y="5" width="90" height="10" rx="5" fill="#1a1d2e"/>

      <!-- Feature 5 -->
      <circle cx="10" cy="35" r="6" fill="#10b981"/>
      <text x="8" y="39" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
      <rect x="25" y="30" width="105" height="10" rx="5" fill="#1a1d2e"/>

      <!-- Feature 6 -->
      <circle cx="10" cy="60" r="6" fill="#10b981"/>
      <text x="8" y="64" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
      <rect x="25" y="55" width="85" height="10" rx="5" fill="#1a1d2e"/>
    </g>

    <!-- Lock Icon -->
    <g transform="translate(160, 228)">
      <rect x="15" y="12" width="20" height="18" rx="3" fill="#5c7cfa"/>
      <path d="M 20 12 L 20 8 Q 20 3 25 3 Q 30 3 30 8 L 30 12" stroke="#5c7cfa" stroke-width="3" fill="none"/>
      <circle cx="25" cy="21" r="2.5" fill="white"/>
    </g>
  </g>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
