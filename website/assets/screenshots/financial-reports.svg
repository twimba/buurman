<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fc"/>

  <!-- Main Card -->
  <g transform="translate(20, 20)">
    <rect width="360" height="260" rx="12" fill="white" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="20" y="20" width="120" height="12" rx="6" fill="#1a1d2e"/>
    <rect x="20" y="38" width="80" height="8" rx="4" fill="#6b7194"/>

    <!-- Stats Cards -->
    <g transform="translate(20, 60)">
      <rect width="100" height="60" rx="8" fill="#f1f3f9"/>
      <rect x="10" y="10" width="30" height="10" rx="5" fill="#6b7194"/>
      <rect x="10" y="28" width="60" height="16" rx="8" fill="#10b981"/>
      <text x="12" y="40" font-family="Arial" font-size="14" fill="white" font-weight="bold">+€2.4k</text>
    </g>

    <g transform="translate(135, 60)">
      <rect width="100" height="60" rx="8" fill="#f1f3f9"/>
      <rect x="10" y="10" width="30" height="10" rx="5" fill="#6b7194"/>
      <rect x="10" y="28" width="50" height="16" rx="8" fill="#ef4444"/>
      <text x="12" y="40" font-family="Arial" font-size="14" fill="white" font-weight="bold">-€890</text>
    </g>

    <g transform="translate(250, 60)">
      <rect width="90" height="60" rx="8" fill="#f1f3f9"/>
      <rect x="10" y="10" width="30" height="10" rx="5" fill="#6b7194"/>
      <rect x="10" y="28" width="55" height="16" rx="8" fill="#5c7cfa"/>
      <text x="12" y="40" font-family="Arial" font-size="14" fill="white" font-weight="bold">€1.5k</text>
    </g>

    <!-- Chart -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="320" height="100" rx="8" fill="#f8f9fc"/>
      <!-- Bars -->
      <rect x="15" y="60" width="30" height="30" rx="4" fill="#5c7cfa" opacity="0.8"/>
      <rect x="55" y="40" width="30" height="50" rx="4" fill="#5c7cfa" opacity="0.8"/>
      <rect x="95" y="30" width="30" height="60" rx="4" fill="#5c7cfa"/>
      <rect x="135" y="50" width="30" height="40" rx="4" fill="#5c7cfa" opacity="0.8"/>
      <rect x="175" y="25" width="30" height="65" rx="4" fill="#5c7cfa"/>
      <rect x="215" y="45" width="30" height="45" rx="4" fill="#5c7cfa" opacity="0.8"/>
      <rect x="255" y="35" width="30" height="55" rx="4" fill="#5c7cfa" opacity="0.9"/>
      <!-- Grid lines -->
      <line x1="10" y1="20" x2="310" y2="20" stroke="#e2e6f0" stroke-width="1"/>
      <line x1="10" y1="45" x2="310" y2="45" stroke="#e2e6f0" stroke-width="1"/>
      <line x1="10" y1="70" x2="310" y2="70" stroke="#e2e6f0" stroke-width="1"/>
    </g>
  </g>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
