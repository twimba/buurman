<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fc"/>

  <!-- Main Card -->
  <g transform="translate(20, 20)">
    <rect width="360" height="260" rx="12" fill="white" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="20" y="20" width="110" height="12" rx="6" fill="#1a1d2e"/>
    <rect x="20" y="38" width="70" height="8" rx="4" fill="#78716c"/>

    <!-- Payment Row 1 - Paid -->
    <g transform="translate(20, 65)">
      <rect width="320" height="50" rx="8" fill="#f8f9fc"/>
      <circle cx="25" cy="25" r="18" fill="#10b981" opacity="0.2"/>
      <text x="25" y="31" font-family="Arial" font-size="18" text-anchor="middle">✓</text>
      <rect x="55" y="10" width="80" height="10" rx="5" fill="#1a1d2e"/>
      <rect x="55" y="25" width="60" height="7" rx="3.5" fill="#78716c"/>
      <rect x="230" y="13" width="70" height="24" rx="12" fill="#10b981" opacity="0.15"/>
      <text x="265" y="28" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">PAID</text>
    </g>

    <!-- Payment Row 2 - Paid -->
    <g transform="translate(20, 125)">
      <rect width="320" height="50" rx="8" fill="#f8f9fc"/>
      <circle cx="25" cy="25" r="18" fill="#10b981" opacity="0.2"/>
      <text x="25" y="31" font-family="Arial" font-size="18" text-anchor="middle">✓</text>
      <rect x="55" y="10" width="90" height="10" rx="5" fill="#1a1d2e"/>
      <rect x="55" y="25" width="70" height="7" rx="3.5" fill="#78716c"/>
      <rect x="230" y="13" width="70" height="24" rx="12" fill="#10b981" opacity="0.15"/>
      <text x="265" y="28" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">PAID</text>
    </g>

    <!-- Payment Row 3 - Pending -->
    <g transform="translate(20, 185)">
      <rect width="320" height="50" rx="8" fill="#f8f9fc"/>
      <circle cx="25" cy="25" r="18" fill="#f59e0b" opacity="0.2"/>
      <text x="25" y="30" font-family="Arial" font-size="16" text-anchor="middle">⏱</text>
      <rect x="55" y="10" width="85" height="10" rx="5" fill="#1a1d2e"/>
      <rect x="55" y="25" width="65" height="7" rx="3.5" fill="#78716c"/>
      <rect x="230" y="13" width="70" height="24" rx="12" fill="#f59e0b" opacity="0.15"/>
      <text x="265" y="28" font-family="Arial" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">PENDING</text>
    </g>
  </g>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
