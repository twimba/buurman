<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fc"/>

  <!-- Main Card -->
  <g transform="translate(20, 20)">
    <rect width="360" height="260" rx="12" fill="white" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="20" y="20" width="100" height="12" rx="6" fill="#1a1d2e"/>

    <!-- Folder Structure -->
    <g transform="translate(20, 50)">
      <!-- Folder 1 -->
      <path d="M 0 0 L 30 0 L 35 8 L 150 8 L 150 45 L 0 45 Z" fill="#5c7cfa" opacity="0.15"/>
      <rect x="10" y="15" width="60" height="8" rx="4" fill="#5c7cfa"/>
      <rect x="10" y="28" width="40" height="6" rx="3" fill="#6b7194"/>
    </g>

    <g transform="translate(20, 105)">
      <!-- Folder 2 -->
      <path d="M 0 0 L 30 0 L 35 8 L 150 8 L 150 45 L 0 45 Z" fill="#10b981" opacity="0.15"/>
      <rect x="10" y="15" width="70" height="8" rx="4" fill="#10b981"/>
      <rect x="10" y="28" width="50" height="6" rx="3" fill="#6b7194"/>
    </g>

    <g transform="translate(20, 160)">
      <!-- Folder 3 -->
      <path d="M 0 0 L 30 0 L 35 8 L 150 8 L 150 45 L 0 45 Z" fill="#f59e0b" opacity="0.15"/>
      <rect x="10" y="15" width="80" height="8" rx="4" fill="#f59e0b"/>
      <rect x="10" y="28" width="45" height="6" rx="3" fill="#6b7194"/>
    </g>

    <!-- Document Preview -->
    <g transform="translate(190, 50)">
      <rect width="150" height="155" rx="8" fill="#f8f9fc"/>
      <!-- Document icon -->
      <g transform="translate(20, 20)">
        <rect width="110" height="115" rx="6" fill="white" stroke="#e2e6f0" stroke-width="2"/>
        <rect x="15" y="15" width="80" height="6" rx="3" fill="#e2e6f0"/>
        <rect x="15" y="28" width="80" height="6" rx="3" fill="#e2e6f0"/>
        <rect x="15" y="41" width="60" height="6" rx="3" fill="#e2e6f0"/>
        <rect x="15" y="54" width="70" height="6" rx="3" fill="#e2e6f0"/>
        <rect x="15" y="67" width="80" height="6" rx="3" fill="#e2e6f0"/>
        <rect x="15" y="80" width="50" height="6" rx="3" fill="#e2e6f0"/>
        <!-- PDF badge -->
        <rect x="75" y="90" width="30" height="15" rx="4" fill="#ef4444"/>
        <text x="90" y="100" font-family="Arial" font-size="9" fill="white" text-anchor="middle" font-weight="bold">PDF</text>
      </g>
    </g>
  </g>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
