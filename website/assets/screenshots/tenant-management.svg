<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8f9fc"/>

  <!-- Tenant List -->
  <g transform="translate(20, 20)">
    <rect width="360" height="260" rx="12" fill="white" filter="url(#shadow)"/>

    <!-- Header -->
    <rect x="20" y="20" width="80" height="12" rx="6" fill="#1a1d2e"/>

    <!-- Tenant Row 1 -->
    <g transform="translate(20, 50)">
      <circle cx="20" cy="20" r="20" fill="#5c7cfa"/>
      <text x="20" y="26" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">JS</text>
      <rect x="50" y="10" width="120" height="10" rx="5" fill="#1a1d2e"/>
      <rect x="50" y="25" width="80" height="7" rx="3.5" fill="#6b7194"/>
      <rect x="280" y="12" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <rect x="290" y="18" width="40" height="8" rx="4" fill="#10b981"/>
    </g>

    <!-- Tenant Row 2 -->
    <g transform="translate(20, 110)">
      <circle cx="20" cy="20" r="20" fill="#748ffc"/>
      <text x="20" y="26" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">ML</text>
      <rect x="50" y="10" width="100" height="10" rx="5" fill="#1a1d2e"/>
      <rect x="50" y="25" width="90" height="7" rx="3.5" fill="#6b7194"/>
      <rect x="280" y="12" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <rect x="290" y="18" width="40" height="8" rx="4" fill="#10b981"/>
    </g>

    <!-- Tenant Row 3 -->
    <g transform="translate(20, 170)">
      <circle cx="20" cy="20" r="20" fill="#91a7ff"/>
      <text x="20" y="26" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">TK</text>
      <rect x="50" y="10" width="110" height="10" rx="5" fill="#1a1d2e"/>
      <rect x="50" y="25" width="70" height="7" rx="3.5" fill="#6b7194"/>
      <rect x="280" y="12" width="60" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
      <rect x="290" y="18" width="40" height="8" rx="4" fill="#f59e0b"/>
    </g>
  </g>

  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
