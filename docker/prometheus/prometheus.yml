global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8081"]
        labels:
          environment: "docker"
      - targets: ["host.docker.internal:8081"]
        labels:
          environment: "local"

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "keycloak"
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["keycloak:9000"]
