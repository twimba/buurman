# Routes for local development — workspace 3
# Auto-generated by setup-workspace.sh. Do not edit manually.
# Backend + app running on host machine with workspace port offsets.

http:
  routers:
    backend-local:
      rule: "Host(`w3-api.local.buurman.io`)"
      entryPoints:
        - websecure
      tls: {}
      service: backend-local
      priority: 10

    app-calendar-local:
      rule: "Host(`w3-app.local.buurman.io`) && PathPrefix(`/calendar/`)"
      entryPoints:
        - websecure
      tls: {}
      service: backend-local
      priority: 20

    posthog-ingest-app-local:
      rule: "Host(`w3-app.local.buurman.io`) && PathPrefix(`/ingest`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - posthog-strip-prefix
      service: posthog-cloud
      priority: 30

    posthog-ingest-backoffice-local:
      rule: "Host(`w3-backoffice.local.buurman.io`) && PathPrefix(`/ingest`)"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - posthog-strip-prefix
      service: posthog-cloud
      priority: 30

    app-local:
      rule: "Host(`w3-app.local.buurman.io`)"
      entryPoints:
        - websecure
      tls: {}
      service: app-local
      priority: 10

    backoffice-local:
      rule: "Host(`w3-backoffice.local.buurman.io`)"
      entryPoints:
        - websecure
      tls: {}
      service: backoffice-local
      priority: 10

  middlewares:
    posthog-strip-prefix:
      stripPrefix:
        prefixes:
          - "/ingest"

  services:
    backend-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8381"

    app-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5203"

    backoffice-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5204"

    posthog-cloud:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "https://eu.i.posthog.com"
