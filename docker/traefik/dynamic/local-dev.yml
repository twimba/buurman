# Routes for local development (backend + app running on host machine).
# These have low priority (10) so Docker container labels (priority 100) win
# when running with: docker compose --profile docker up -d

http:
  routers:
    backend-local:
      rule: "Host(`api.local.buurman.io`)"
      entryPoints:
        - websecure
      tls: {}
      service: backend-local
      priority: 10

    app-calendar-local:
      rule: "Host(`app.local.buurman.io`) && PathPrefix(`/calendar`)"
      entryPoints:
        - websecure
      tls: {}
      service: backend-local
      priority: 20

    app-local:
      rule: "Host(`app.local.buurman.io`)"
      entryPoints:
        - websecure
      tls: {}
      service: app-local
      priority: 10

    backoffice-local:
      rule: "Host(`backoffice.local.buurman.io`)"
      entryPoints:
        - websecure
      tls: {}
      service: backoffice-local
      priority: 10

  services:
    backend-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"

    app-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"

    backoffice-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5174"
