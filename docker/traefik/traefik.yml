# Traefik Static Configuration
# Dynamic routing is handled via Docker labels in docker-compose.yml
# TLS certificates are loaded from docker/traefik/dynamic/tls.yml
# Docker network is set via TRAEFIK_PROVIDERS_DOCKER_NETWORK env var in docker-compose.yml

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  postgres:
    address: ":5432"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}

metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
