<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style th:replace="~{_letter-styles :: letter-css}">/* replaced by shared fragment */</style>
</head>
<body>

<div class="letter">
  <!-- Header -->
  <div class="letter-header">
    <div class="letter-date" th:text="${generatedDate}"></div>
    <div class="letter-ref" th:text="#{letter.ref(${extensionIdentifier})}"></div>
  </div>

  <!-- Addressee -->
  <div class="letter-addressee">
    <div th:if="${primaryContactName != null}">
      <div class="addressee-name" th:text="${primaryContactName}"></div>
      <div th:if="${contactAddress != null}">
        <div th:text="${contactAddress.street}"></div>
        <div th:text="${contactAddress.postalCode} + ' ' + ${contactAddress.city}"></div>
        <div th:text="${contactAddress.countryCode}"></div>
      </div>
    </div>
    <div th:unless="${primaryContactName != null}">
      <div class="addressee-name" th:text="#{letter.salutation.default}">Dear Resident,</div>
    </div>
  </div>

  <!-- Subject -->
  <div class="letter-subject" th:text="'Re: ' + #{letter.title}"></div>

  <!-- Body -->
  <div class="letter-body">
    <!-- Salutation -->
    <p th:if="${primaryContactName != null}" th:text="#{letter.salutation(${primaryContactName})}"></p>
    <p th:unless="${primaryContactName != null}" th:text="#{letter.salutation.default}"></p>

    <!-- Paragraph 1: Notification -->
    <p th:utext="#{letter.body.notification(${propertyAddress}, ${previousRent}, ${newRent}, ${rentEffectiveDate})}"></p>

    <!-- Paragraph 2: Adjustment basis -->
    <p th:text="${adjustmentBasis}"></p>

    <!-- Paragraph 3: Extension details -->
    <p th:if="${newEndDate != null}" th:text="#{letter.body.extension(${extensionNumber}, ${newEndDate})}"></p>
    <p th:unless="${newEndDate != null}" th:text="#{letter.body.extension.indefinite(${extensionNumber})}"></p>

    <!-- Country-specific legal clause -->
    <div th:if="${legalClause != null}" class="legal-clause" th:text="${legalClause}"></div>

    <!-- Summary table -->
    <table class="summary-table">
      <tr>
        <td class="st-label" th:text="#{letter.summary.contractRef}">Contract Reference</td>
        <td class="st-value" th:text="${contractIdentifier}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{letter.summary.property}">Property</td>
        <td class="st-value" th:text="${propertyAddress}"></td>
      </tr>
      <tr th:if="${hasMultipleUnits}">
        <td class="st-label" th:text="#{letter.summary.unit}">Unit</td>
        <td class="st-value" th:text="${unitDesignation}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{letter.summary.previousRent}">Previous Rent</td>
        <td class="st-value" th:text="${previousRent}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{letter.summary.newRent}">New Rent</td>
        <td class="st-value"><strong th:text="${newRent}"></strong></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{letter.summary.adjustmentType}">Adjustment Type</td>
        <td class="st-value" th:text="${adjustmentType}"></td>
      </tr>
      <tr th:if="${adjustmentValue != null}">
        <td class="st-label" th:text="#{letter.summary.adjustmentValue}">Adjustment Value</td>
        <td class="st-value" th:text="${adjustmentValue}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{letter.summary.effectiveDate}">Effective Date</td>
        <td class="st-value" th:text="${rentEffectiveDate}"></td>
      </tr>
      <tr th:if="${newEndDate != null}">
        <td class="st-label" th:text="#{letter.summary.newEndDate}">New Lease End Date</td>
        <td class="st-value" th:text="${newEndDate}"></td>
      </tr>
    </table>

    <!-- Closing -->
    <p th:text="#{letter.closing}"></p>
    <p th:text="#{letter.regards}"></p>
  </div>

  <!-- Signature -->
  <div class="letter-signature">
    <div class="sig-line"></div>
    <div class="sig-label" th:text="#{letter.signature}">Landlord / Property Manager</div>
    <div class="sig-date"><span th:text="#{letter.signature.date}">Date:</span> <span class="sig-date-line"></span></div>
  </div>

  <!-- Disclaimer -->
  <div class="letter-disclaimer" th:text="#{letter.disclaimer}"></div>

  <!-- Footer -->
  <div class="letter-footer">
    <span th:text="#{letter.generated(${generatedDate})}"></span>
    <span> &mdash; </span>
    <span th:text="#{letter.footer}"></span>
  </div>
</div>

</body>
</html>
