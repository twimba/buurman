<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style th:replace="~{_letter-styles :: letter-css}">/* replaced by shared fragment */</style>
</head>
<body>

<div class="letter">
  <!-- Header -->
  <div class="letter-header">
    <div class="letter-date" th:text="${generatedDate}"></div>
    <div class="letter-ref" th:text="#{termination.ref(${contractIdentifier})}"></div>
  </div>

  <!-- Addressee -->
  <div class="letter-addressee">
    <div th:if="${primaryContactName != null}">
      <div class="addressee-name" th:text="${primaryContactName}"></div>
      <div th:if="${contactAddress != null}">
        <div th:text="${contactAddress.street}"></div>
        <div th:text="${contactAddress.postalCode} + ' ' + ${contactAddress.city}"></div>
        <div th:text="${contactAddress.countryCode}"></div>
      </div>
    </div>
    <div th:unless="${primaryContactName != null}">
      <div class="addressee-name" th:text="#{termination.salutation.default}">Dear Resident,</div>
    </div>
  </div>

  <!-- Subject -->
  <div class="letter-subject" th:text="'Re: ' + #{termination.title}"></div>

  <!-- Body -->
  <div class="letter-body">
    <!-- Salutation -->
    <p th:if="${primaryContactName != null}" th:text="#{termination.salutation(${primaryContactName})}"></p>
    <p th:unless="${primaryContactName != null}" th:text="#{termination.salutation.default}"></p>

    <!-- Paragraph 1: Notice given -->
    <p th:text="#{termination.body.notice(${givenByLabel}, ${noticeDate}, ${propertyAddress})}"></p>

    <!-- Paragraph 2: Ground (if present) -->
    <p th:if="${groundLabel != null}" th:text="#{termination.body.ground(${groundLabel})}"></p>

    <!-- Paragraph 3: Effective end date -->
    <p th:text="#{termination.body.effectiveEndDate(${effectiveEndDate})}"></p>

    <!-- Paragraph 4: Override reason (if present) -->
    <p th:if="${overrideReason != null}" th:text="#{termination.body.overrideReason(${overrideReason})}"></p>

    <!-- Country-specific legal clause -->
    <div th:if="${legalClauses != null}" th:each="clause : ${legalClauses}" class="legal-clause">
      <div th:if="${clause.get('title') != null}" class="legal-clause-title" th:text="${clause.get('title')}"></div>
      <div th:text="${clause.body}"></div>
    </div>

    <!-- Summary table -->
    <table class="summary-table">
      <tr>
        <td class="st-label" th:text="#{termination.summary.contractRef}">Contract Reference</td>
        <td class="st-value" th:text="${contractIdentifier}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{termination.summary.property}">Property</td>
        <td class="st-value" th:text="${propertyAddress}"></td>
      </tr>
      <tr th:if="${hasMultipleUnits}">
        <td class="st-label" th:text="#{termination.summary.unit}">Unit</td>
        <td class="st-value" th:text="${unitDesignation}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{termination.summary.givenBy}">Given By</td>
        <td class="st-value" th:text="${givenByLabel}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{termination.summary.noticeDate}">Notice Date</td>
        <td class="st-value" th:text="${noticeDate}"></td>
      </tr>
      <tr th:if="${groundLabel != null}">
        <td class="st-label" th:text="#{termination.summary.ground}">Ground</td>
        <td class="st-value" th:text="${groundLabel}"></td>
      </tr>
      <tr>
        <td class="st-label" th:text="#{termination.summary.effectiveEndDate}">Effective End Date</td>
        <td class="st-value"><strong th:text="${effectiveEndDate}"></strong></td>
      </tr>
    </table>

    <!-- Closing -->
    <p th:text="#{termination.closing}"></p>
    <p th:text="#{letter.regards}"></p>
  </div>

  <!-- Signature -->
  <div class="letter-signature">
    <div class="sig-line"></div>
    <div class="sig-label" th:text="#{letter.signature}">Landlord / Property Manager</div>
    <div class="sig-date"><span th:text="#{letter.signature.date}">Date:</span> <span class="sig-date-line"></span></div>
  </div>

  <!-- Disclaimer -->
  <div class="letter-disclaimer" th:text="#{termination.disclaimer}"></div>

  <!-- Footer -->
  <div class="letter-footer">
    <span th:text="#{letter.generated(${generatedDate})}"></span>
    <span> &mdash; </span>
    <span th:text="#{letter.footer}"></span>
  </div>
</div>

</body>
</html>
