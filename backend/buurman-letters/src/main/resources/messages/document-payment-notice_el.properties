notice.body.consequences=Εάν το ποσό δεν ληφθεί εντός της προθεσμίας, επιφυλασσόμαστε να προβούμε σε περαιτέρω ενέργειες βάσει της μίσθωσης και του νόμου, συμπεριλαμβανομένων τόκων υπερημερίας, εξόδων είσπραξης και, όπου επιτρέπεται, καταγγελίας της μίσθωσης.
