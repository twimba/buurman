notice.body.overdue=Σύμφωνα με τα στοιχεία μας, το ενοίκιο ύψους {1} για το ακίνητο στη διεύθυνση {0}, ληξιπρόθεσμο από {2}, δεν έχει ληφθεί. Η καθυστέρηση ανέρχεται σε {3} ημέρα(ες).
