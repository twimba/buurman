notice.legal.NL=Η παρούσα επιστολή συνιστά όχληση (ingebrekestelling) κατά την έννοια του άρθρου 6:82 του ολλανδικού Αστικού Κώδικα.
notice.legal.DE=Η παρούσα επιστολή συνιστά Mahnung κατά την έννοια του § 286 BGB· οι τόκοι υπερημερίας του § 288 BGB τρέχουν από την ημερομηνία λήξης.
notice.legal.FR=Η παρούσα επιστολή συνιστά mise en demeure κατά την έννοια του άρθρου 1344 του γαλλικού Αστικού Κώδικα.
notice.legal.BE=Η παρούσα επιστολή συνιστά επίσημη όχληση (ingebrekestelling / mise en demeure) κατά το βελγικό δίκαιο.
notice.legal.ES=Η παρούσα επιστολή συνιστά επίσημη όχληση πληρωμής (requerimiento de pago) κατά το άρθρο 1100 του ισπανικού Αστικού Κώδικα.
notice.legal.PT=Η παρούσα επιστολή συνιστά επίσημη όχληση πληρωμής (interpelação) κατά το άρθρο 805 του πορτογαλικού Αστικού Κώδικα.
notice.legal.GB=Η παρούσα επιστολή αποτελεί επίσημη όχληση για ληξιπρόθεσμα μισθώματα. Τόκοι μπορούν να χρεωθούν σύμφωνα με τον Tenant Fees Act 2019 μόλις το μίσθωμα καθυστερήσει 14 ημέρες.
notice.legal.IT=Η παρούσα επιστολή συνιστά επίσημη όχληση (costituzione in mora) κατά το άρθρο 1219 του ιταλικού Αστικού Κώδικα.
