lease.at.commercial.maintenance.summary=MRG:n täysimääräisessä soveltamisessa sovelletaan MRG:n 3 §:ää; muuten vuokranantaja pitää kunnossa rakenteet ja yhteiset osat, vuokralainen sisäosat.
lease.at.commercial.alterations.title=Muutostyöt ja varustelu
lease.at.commercial.alterations.summary=Työt ja mainoskyltit vain kirjallisella suostumuksella; poisto sopimuksen päättyessä.
lease.at.commercial.subletting.title=Alivuokraus ja liiketoiminnan luovutus
lease.at.commercial.subletting.summary=Alivuokraus vaatii suostumuksen; lakisääteiset oikeudet liiketoiminnan myynnissä tai vuokrauksessa MRG:n täysimääräisessä soveltamisessa.
lease.at.commercial.insurance.title=Vakuutukset
lease.at.commercial.insurance.summary=Vuokranantaja vakuuttaa rakennuksen; vuokralainen irtaimiston ja toiminnan vastuun.
lease.at.commercial.energy-certificate.title=Energiatodistus
lease.at.commercial.energy-certificate.summary=Vuokranantaja esittää ja luovuttaa energiatodistuksen (EAVG 2012).
lease.at.commercial.contract-fee.title=Sopimusmaksu
lease.at.commercial.contract-fee.summary=Maksu 1 prosentti sopimuksen arvosta maksulain (GebG) mukaan, vuokranantajan laskema ja vuokralaisen maksama.
lease.at.commercial.handover-inspection.title=Luovutus ja palautus
lease.at.commercial.handover-inspection.summary=Luovutus- ja palautuspöytäkirja, tyhjennetyn tilan palautus ja vaatimusten määräajat.
lease.at.commercial.termination.title=Päättyminen
lease.at.commercial.termination.summary=Irtisanominen kalenterineljänneksen loppuun 3 kuukauden irtisanomisajalla; vuokranantajan irtisanomisen rajoitukset MRG:n mukaan.
lease.at.commercial.data-protection.title=Tietosuoja
lease.at.commercial.data-protection.summary=Edustajien ja yhteyshenkilöiden henkilötietojen käsittely tietosuoja-asetuksen mukaisesti.
lease.at.commercial.disputes.title=Riidat
lease.at.commercial.disputes.summary=Itävallan laki; toimivaltainen on tilan sijaintipaikan piirioikeus.
# ===== end AT =====


# ===== BE lease clause titles and summaries (country pack) =====
lease.be.residential.parties.title=Osapuolet
lease.be.residential.parties.summary=Vuokranantajan ja vuokralaisten tiedot, päävakituisen asunnon vuokrasopimus ja sovellettava alueellinen laki (Flanderi, Vallonia tai Bryssel).
lease.be.residential.premises.title=Asunto
lease.be.residential.premises.summary=Osoite, vuokratut tilat, pinta-ala ja mittarit sekä alueelliset terveys-, turvallisuus- ja asuttavuusvaatimukset.
lease.be.residential.term.title=Vuokra-aika
lease.be.residential.term.summary=Vuokrasopimuksen katsotaan olevan 9 vuoden pituinen ja jatkuvan 3 vuodella, enintään 3 vuoden lyhyt sopimus tai pitkä sopimus, alueen mukaan.
lease.be.residential.rent.title=Vuokra
lease.be.residential.rent.summary=Vuokra ilman kuluja, vapaasti sovittu; Brysselissä viitevuokra ja kohtuutonta vuokraa koskevat säännöt.
lease.be.residential.rent-adjustment.title=Indeksikorotus ja tarkistus
lease.be.residential.rent-adjustment.summary=Vuotuinen terveysindeksiin sidottu korotus kirjallisesta pyynnöstä ja tarkistus kunkin 3 vuoden jakson päättyessä, alueen mukaan.
lease.be.residential.service-costs.title=Kulut ja maksut
lease.be.residential.service-costs.summary=Käyttöön liittyvät kulut, kiinteinä tai todellisina erillisellä selvityksellä; kiinteistöveron ennakkoa ei voi periä vuokralaiselta.
lease.be.residential.deposit.title=Vuokravakuus
lease.be.residential.deposit.summary=Vuokravakuus enintään 3 kuukauden vuokra Flanderissa tai 2 kuukauden vuokra Valloniassa ja Brysselissä, laissa säädetyssä muodossa.
lease.be.residential.payment.title=Maksaminen
lease.be.residential.payment.summary=Maksu erissä tilisiirtona sovittuna päivänä; laillinen korko maksukehotuksen jälkeen.
lease.be.residential.use.title=Asunnon käyttö
lease.be.residential.use.summary=Huolellinen käyttö päävakituisena asuntona, häiriötön käyttö ja Brysselissä kotipaikkaa ja lemmikkejä koskevat säännöt.
lease.be.residential.subletting.title=Siirto ja alivuokraus
lease.be.residential.subletting.summary=Siirto vain etukäteen annetulla kirjallisella suostumuksella; osittainen alivuokraus vain suostumuksella, jos asunto pysyy päävakituisena asuntona.
lease.be.residential.maintenance.title=Kunnossapito ja korjaukset
lease.be.residential.maintenance.summary=Vuokranantajan korjaukset, vuokralaisen pienet korjaukset ja kiireelliset korjaukset vuokra-aikana, alueen mukaan.
lease.be.residential.insurance.title=Palovakuutus
lease.be.residential.insurance.summary=Vuokralaisen vastuu tulipalosta (ja vesivahingosta) ja pakollinen vakuutus, alueen mukaan.
lease.be.residential.energy-certificate.title=Energiatodistus
lease.be.residential.energy-certificate.summary=Alueen edellyttämä energiatodistus (EPC/PEB), sen numero, päivämäärä ja luokka.
lease.be.residential.registration.title=Rekisteröinti
lease.be.residential.registration.summary=Vuokranantaja rekisteröi vuokrasopimuksen ja kuntoselvityksen 2 kuukauden kuluessa; rekisteröimättä jättämisen seuraukset alueen mukaan.
lease.be.residential.handover-inspection.title=Kuntoselvitys
lease.be.residential.handover-inspection.summary=Yhteinen yksityiskohtainen muuttotarkastus, liitetty sopimukseen ja rekisteröity, sekä poismuuttotarkastus, alueen mukaan.
lease.be.residential.transfer.title=Asunnon luovutus
lease.be.residential.transfer.summary=Luovutuksensaaja tulee vuokranantajan sijaan; Brysselissä tiedonantovelvollisuus ja vuokralaisen etuosto-oikeus.
lease.be.residential.termination.title=Päättyminen
lease.be.residential.termination.summary=Vuokralaisen irtisanominen ja vuokranantajan lakisääteiset irtisanomisperusteet, korvaukset ja lyhyen sopimuksen säännöt, alueen mukaan.
lease.be.residential.annexes.title=Liitteet
lease.be.residential.annexes.summary=Alueellinen selittävä liite tai ohje ja muuttotarkastus.
lease.be.residential.data-protection.title=Tietosuoja
lease.be.residential.data-protection.summary=Vuokralaisen henkilötietojen käsittely GDPR:n mukaisesti ja alueelliset rajat pyydettäville tiedoille.
lease.be.residential.disputes.title=Riidat
lease.be.residential.disputes.summary=Belgian laki ja asunnon sijaintipaikan rauhantuomari; etukäteen sovitut välityslausekkeet ovat tehottomia.
lease.be.commercial.parties.title=Osapuolet
lease.be.commercial.parties.summary=Yritysten, niiden edustajien ja ALV-numeroiden tiedot sekä Belgian liikehuoneistojen vuokralaki.
lease.be.commercial.premises.title=Vuokrakohde
lease.be.commercial.premises.summary=Osoite, pinta-ala ja kuvaus, myös asuin- tai sivutilat, joihin lakisääteinen vuokra-aika sovelletaan.
lease.be.commercial.permitted-use.title=Käyttötarkoitus
lease.be.commercial.permitted-use.summary=Vähittäiskauppa tai käsityöammatti suorassa yhteydessä yleisöön; lain soveltamisala ja enintään 1 vuoden sopimukset.
lease.be.commercial.term.title=Vuokra-aika
lease.be.commercial.term.summary=Vähintään 9 vuotta; vuokralainen voi irtisanoa kunkin 3 vuoden jakson päättyessä 6 kuukauden irtisanomisajalla, vuokranantaja vain jos niin on sovittu.
lease.be.commercial.rent.title=Vuokra
lease.be.commercial.rent.summary=Vuokra ilman kuluja, maksuja ja veroja, vapaasti sovittu.
lease.be.commercial.rent-adjustment.title=Indeksikorotus ja tarkistus
lease.be.commercial.rent-adjustment.summary=Sovittu terveysindeksiin sidottu korotus 1 kerran vuodessa ja tuomioistuimen tarkistus kunkin 3 vuoden jakson päättyessä vähintään 15 %:n erossa.
lease.be.commercial.service-costs.title=Kulut ja maksut
lease.be.commercial.service-costs.summary=Tyhjentävä luettelo vuokralaisen maksettavista kuluista, maksuista ja veroista, tilitetään vähintään vuosittain.
lease.be.commercial.vat.title=Arvonlisävero
lease.be.commercial.vat.summary=Vuokraus on lähtökohtaisesti arvonlisäverotonta, mutta liikerakennusten vuokrauksessa voidaan valita verollisuus.
lease.be.commercial.deposit.title=Vuokravakuus
lease.be.commercial.deposit.summary=Vuokravakuus sovitun suuruisena ja muotoisena; liikehuoneistoille ei ole lakisääteistä enimmäismäärää.
lease.be.commercial.payment.title=Maksaminen
lease.be.commercial.payment.summary=Maksu erissä tilisiirtona sovittuna päivänä; laillinen korko maksukehotuksen jälkeen.
lease.be.commercial.maintenance.title=Kunnossapito ja korjaukset
lease.be.commercial.maintenance.summary=Vuokranantajan ja vuokralaisen korjaukset Belgian aiemman siviililain mukaan, ellei toisin sovita.
lease.be.commercial.alterations.title=Muutostyöt
lease.be.commercial.alterations.summary=Vuokralaisen oikeus enintään 3 vuoden vuokran arvoisiin muutostöihin ilmoituksen jälkeen, vuokranantajan vastustus 30 päivän kuluessa ja käsittely lopussa.
lease.be.commercial.assignment.title=Siirto ja alivuokraus
lease.be.commercial.assignment.summary=Suostumus vaaditaan, paitsi jos siirto tai alivuokraus tapahtuu liikkeen mukana, vuokranantajan 30 päivän vastustusoikeus huomioiden.
lease.be.commercial.insurance.title=Vakuutus
lease.be.commercial.insurance.summary=Vuokralainen vakuuttaa vastuunsa ja irtaimiston, vuokranantaja vakuuttaa rakennuksen.
lease.be.commercial.energy-certificate.title=Energiatodistus
lease.be.commercial.energy-certificate.summary=Energiatodistus, jos alueelliset säännöt sitä edellyttävät, sen numero, päivämäärä ja luokka.
lease.be.commercial.registration.title=Rekisteröinti
lease.be.commercial.registration.summary=Rekisteröinti verolainsäädännön mukaan, mikä antaa sopimukselle varman päivämäärän; rekisteröintimaksut maksava osapuoli.
lease.be.commercial.handover-inspection.title=Kuntoselvitys
lease.be.commercial.handover-inspection.summary=Yhteinen yksityiskohtainen kuntoselvitys, liitetty ja rekisteröity; palautus vastaanotetussa kunnossa.
lease.be.commercial.renewal.title=Uusiminen
lease.be.commercial.renewal.summary=Oikeus 3 uusimiseen 9 vuodeksi, pyyntö 18-15 kuukautta ennen päättymistä, epäämisperusteet ja häätökorvaus.
lease.be.commercial.transfer.title=Kohteen luovutus
lease.be.commercial.transfer.summary=Luovutuksensaaja voi häätää vuokralaisen vain lakisääteisin perustein 1 vuoden irtisanomisajalla, joka annetaan 3 kuukauden kuluessa.
lease.be.commercial.termination.title=Päättyminen
lease.be.commercial.termination.summary=Päättyminen 3 vuoden jakson lopussa, toistaiseksi voimassa oleva sopimus uusimisoikeuden menettämisen jälkeen, purku tuomioistuimessa sopimusrikkomuksen vuoksi.
lease.be.commercial.data-protection.title=Tietosuoja
lease.be.commercial.data-protection.summary=Osapuolten ja niiden edustajien henkilötietojen käsittely GDPR:n mukaisesti.
lease.be.commercial.disputes.title=Riidat
lease.be.commercial.disputes.summary=Belgian laki ja kohteen sijaintipaikan rauhantuomari; sovintomenettely etukäteen mahdollinen.
