lease.it.commercial.goodwill-compensation.summary=18 kuukauden vuokra (21 hotelleille), kun vuokrasuhde päättyy muusta syystä kuin vuokralaisen sopimusrikkomuksesta, irtisanomisesta, vetäytymisestä tai maksukyvyttömyysmenettelystä; ei tiloille ilman asiakaskontaktia eikä muissa poikkeustapauksissa.
lease.it.commercial.insurance.title=Vakuutus
lease.it.commercial.insurance.summary=Vuokralainen vastaa menetyksistä ja palovahingoista, ellei hän ole syytön; vuokralaisen vastuuvakuutus ja vuokranantajan rakennusvakuutus.
lease.it.commercial.energy-certificate.title=Energiatodistus
lease.it.commercial.energy-certificate.summary=Vuokralainen vahvistaa saaneensa APE-tiedot ja -asiakirjat, kopio liitteenä, kun sitä edellytetään; lakisääteiset sakot laiminlyönnistä.
lease.it.commercial.registration.title=Rekisteröinti ja verot
lease.it.commercial.registration.summary=Rekisteröinti 30 päivän kuluessa, kulut jaetaan tasan; rekisteröintivero 1% tai 2%; cedolare secca ei sovellu.
lease.it.commercial.handover-inspection.title=Luovutus ja palautus
lease.it.commercial.handover-inspection.summary=Luovutuspöytäkirja alussa; palautus samassa kunnossa tavanomaista kulumista lukuun ottamatta; sovittu korvaus maksettava palautukseen asti viivästyksessä.
lease.it.commercial.termination.title=Irtisanoutuminen ja purku
lease.it.commercial.termination.summary=Vuokralainen voi vetäytyä painavista syistä 6 kuukauden irtisanomisajalla ja, jos sovittu, milloin tahansa samalla irtisanomisajalla; vuokranantajan kieltäytyminen vain ensimmäisellä päättymiskerralla; purku sopimusrikkomuksen vuoksi.
lease.it.commercial.notices.title=Ilmoitukset
lease.it.commercial.notices.summary=Kirjattu kirje tai haastemiehen tiedoksianto, kun laki sitä edellyttää; osoitteet ja varmennettu sähköposti.
lease.it.commercial.guarantor.title=Vakuus ja takaus
lease.it.commercial.guarantor.summary=Vapaaehtoinen henkilö-, pankki- tai vakuutustakaus enimmäismäärään asti; ulottaminen ensimmäisen päättymiskerran jälkeiseen aikaan vain, jos siitä sovitaan.
lease.it.commercial.data-protection.title=Tietosuoja
lease.it.commercial.data-protection.summary=Osapuolten puolesta toimivien henkilöiden tietoja käsitellään vain vuokrasuhdetta varten GDPR:n ja Italian tietosuojalain mukaisesti.
