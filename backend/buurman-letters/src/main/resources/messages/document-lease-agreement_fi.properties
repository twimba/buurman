lease.it.residential.use.title=Käyttö
lease.it.residential.use.summary=Käyttö yksinomaan asuntona huolellisesti; vuokranantaja voi vaatia purkua 3 kuukauden kuluessa käyttötarkoituksen muutoksesta tiedon saatuaan.
lease.it.residential.subletting.title=Edelleenvuokraus
lease.it.residential.subletting.summary=Ei koko huoneiston edelleenvuokrausta eikä siirtoa ilman suostumusta; osittainen edelleenvuokraus sallittu kirjatulla kirjeellä ilmoittaen, ellei toisin sovita.
lease.it.residential.maintenance.title=Kunnossapito ja korjaukset
lease.it.residential.maintenance.summary=Vuokranantaja tekee tarpeelliset korjaukset, vuokralainen pienet kunnossapitotyöt; kiireelliset korjaukset, vuokranalennus pitkistä töistä; käyttäjä vastaa lämmitysjärjestelmästä.
lease.it.residential.energy-certificate.title=Energiatodistus
lease.it.residential.energy-certificate.summary=Vuokralainen vahvistaa saaneensa APE-tiedot ja -asiakirjat; todistuksen tunnus ja luokka; lakisääteiset sakot laiminlyönnistä.
lease.it.residential.registration.title=Rekisteröinti ja verot
lease.it.residential.registration.summary=Vuokranantaja rekisteröi sopimuksen 30 päivän kuluessa ja ilmoittaa vuokralaiselle ja isännöitsijälle; kulut jaetaan tasan; vapaaehtoinen cedolare secca.
lease.it.residential.succession.title=Sopimukseen tuleminen
lease.it.residential.succession.summary=Puoliso, perilliset, yhdessä asuvat sukulaiset ja kumppanit voivat tulla sopimukseen vuokralaisen kuollessa; säännöt asumuserossa ja avioerossa.
lease.it.residential.handover-inspection.title=Luovutus ja palautus
lease.it.residential.handover-inspection.summary=Luovutuspöytäkirja alussa; palautus samassa kunnossa tavanomaista kulumista lukuun ottamatta; sovittu korvaus maksettava palautukseen asti viivästyksessä.
lease.it.residential.termination.title=Irtisanoutuminen ja jatkamisesta kieltäytyminen
lease.it.residential.termination.summary=Vuokralainen voi vetäytyä sopimuksesta painavista syistä 6 kuukauden irtisanomisajalla; vuokranantaja voi kieltäytyä jatkamisesta ensimmäisellä päättymiskerralla vain laissa säädetyin perustein.
lease.it.residential.notices.title=Ilmoitukset
lease.it.residential.notices.summary=Kirjattu kirje, kun laki sitä edellyttää; osoitteet ja varmennetut sähköpostiosoitteet ilmoituksia varten.
lease.it.residential.guarantor.title=Takaaja
lease.it.residential.guarantor.summary=Vapaaehtoinen takaus enimmäismäärään asti, yhteisvastuullinen; ulottaminen ensimmäisen päättymiskerran jälkeiseen aikaan vain, jos siitä sovitaan.
lease.it.residential.data-protection.title=Tietosuoja
lease.it.residential.data-protection.summary=Henkilötietoja käsitellään vain vuokrasuhdetta ja lakisääteisiä velvoitteita varten GDPR:n ja Italian tietosuojalain mukaisesti.
lease.it.residential.disputes.title=Riidat
lease.it.residential.disputes.summary=Italian laki; kiinteistön sijaintipaikan tuomioistuin; sovittelu pakollinen ennen useimpia vuokrakanteita.
lease.it.commercial.parties.title=Osapuolet
lease.it.commercial.parties.summary=Yksilöi vuokranantajan ja vuokralaisen yritys-, vero- ja arvonlisäverotietoineen, kaupparekisterinumeroineen ja laillisine edustajineen.
lease.it.commercial.premises.title=Huoneisto
lease.it.commercial.premises.summary=Kuvaa tilan kiinteistörekisteritietoineen ja ilmoitettuine käyttötarkoituksineen; ei asunnoille eikä kausivuokrauksille.
lease.it.commercial.permitted-use.title=Sallittu käyttö
lease.it.commercial.permitted-use.summary=Harjoitettava toiminta ja tieto suorasta asiakaskontaktista; luvat vuokralaisen kustannuksella; säännöt käyttötarkoituksen muutoksesta.
lease.it.commercial.term.title=Vuokra-aika ja uusiminen
lease.it.commercial.term.summary=Vähintään 6 vuotta (9 hotelleille ja teattereille) hiljaisella uusimisella; vuokranantaja voi kieltäytyä uusimisesta vain ensimmäisellä päättymiskerralla laissa säädetyin perustein, 12 tai 18 kuukautta etukäteen.
lease.it.commercial.rent.title=Vuokra
lease.it.commercial.rent.summary=Osapuolten sopima vuokra; ehdot, jotka antavat vuokranantajalle lain 392/1978 vastaisia etuja, ovat mitättömiä.
