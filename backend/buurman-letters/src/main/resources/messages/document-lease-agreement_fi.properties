# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Osapuolet
lease.it.residential.parties.summary=Yksilöi vuokranantajan ja vuokralaisen tai vuokralaiset verotunnisteineen ja henkilötietoineen; vuokralaiset vastaavat yhteisvastuullisesti; kirjallinen muoto on pakollinen.
lease.it.residential.premises.title=Huoneisto
lease.it.residential.premises.summary=Kuvaa asunnon kiinteistörekisteritietoineen ja lisätiloineen; malli vapaasti sovitulle vuokralle (4 + 4 vuotta), ei sovitun vuokran, tilapäisille tai opiskelijasopimuksille.
