# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Osapuolet
lease.at.residential.parties.summary=Yksilöi vuokranantajan ja vuokralaisen tai vuokralaiset, jotka vastaavat yhteisvastuullisesti; vuokranantaja merkitsee, onko se elinkeinonharjoittaja.
lease.at.residential.premises.title=Vuokrakohde
lease.at.residential.premises.summary=Kuvaa asunnon ja kirjaa sovellettavan MRG-järjestelmän: täysi soveltaminen, osittainen soveltaminen tai täysi poikkeus.
lease.at.residential.term.title=Vuokra-aika
lease.at.residential.term.summary=Toistaiseksi tai määräajaksi; MRG:n mukaan kirjallisesti ja vähintään 5 vuodeksi (3 vuodeksi, jos vuokranantaja ei ole elinkeinonharjoittaja).
lease.at.residential.rent.title=Vuokra
lease.at.residential.rent.summary=Perusvuokra ja MRG:n täysimääräisessä soveltamisessa lakisääteiset vuokrarajat (ohjearvo, luokkakohtaiset määrät).
lease.at.residential.rent-adjustment.title=Indeksikorotus
lease.at.residential.rent-adjustment.summary=Vuosittainen indeksitarkistus 1. huhtikuuta MieWeG:n mukaan; 3 prosentin ylittävä inflaatio otetaan huomioon vain puoliksi.
lease.at.residential.service-costs.title=Käyttökustannukset
lease.at.residential.service-costs.summary=Osuus käyttökustannuksista ja julkisista maksuista kuukausierinä; tilitys 30. kesäkuuta mennessä MRG:n täysimääräisessä soveltamisessa.
lease.at.residential.deposit.title=Vakuus
lease.at.residential.deposit.summary=Vakuus ilman lakisääteistä ylärajaa, talletettuna säästökirjalle ja palautettava korkoineen viipymättä.
lease.at.residential.payment.title=Maksaminen
lease.at.residential.payment.summary=Vuokra maksetaan kuukausittain etukäteen viimeistään 5. päivänä; lakisääteinen viivästyskorko 4 prosenttia vuodessa.
lease.at.residential.use.title=Käyttö
lease.at.residential.use.summary=Vain asumiskäyttö, pääsy painavista syistä ja olennaisten muutosten ilmoitusmenettely.
lease.at.residential.subletting.title=Alivuokraus
lease.at.residential.subletting.summary=Alivuokraus vain suostumuksella; MRG:n täysimääräisessä soveltamisessa kieltäytyminen vain painavasta syystä.
lease.at.residential.maintenance.title=Kunnossapito ja puutteet
lease.at.residential.maintenance.summary=Vuokranantaja pitää asunnon käyttökelpoisena; vuokravapautus käyttökelvottomuuden ajalta; vuokralainen ilmoittaa puutteista viipymättä.
lease.at.residential.energy-certificate.title=Energiatodistus
lease.at.residential.energy-certificate.summary=Vuokranantaja esittää ja luovuttaa energiatodistuksen (EAVG 2012).
lease.at.residential.registration.title=Asukasrekisteröinti
lease.at.residential.registration.summary=Vuokralainen ilmoittautuu rekisteriviranomaiselle 3 päivän kuluessa muutosta.
lease.at.residential.handover-inspection.title=Luovutus ja palautus
lease.at.residential.handover-inspection.summary=Luovutus- ja palautuspöytäkirja, palautus vastaanotetussa kunnossa ja vaatimusten määräajat.
lease.at.residential.termination.title=Päättyminen
lease.at.residential.termination.summary=MRG:n mukaan vuokranantaja irtisanoo vain tuomioistuimen kautta ja painavasta syystä; irtisanomisajat ja ennenaikainen purku.
lease.at.residential.data-protection.title=Tietosuoja
