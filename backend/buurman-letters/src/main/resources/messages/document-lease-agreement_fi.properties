lease.it.commercial.pre-emption.summary=Vuokralaisen etuosto- ja lunastusoikeus myynnin ja uuden vuokrauksen yhteydessä, paitsi tiloissa ilman asiakaskontaktia ja muissa poikkeustapauksissa.
