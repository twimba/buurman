lease.it.commercial.deposit.summary=Vapaaehtoinen vakuus enintään 3 kuukauden vuokra, jolle maksetaan vuosittain laillinen korko; palautetaan lopussa erääntyneet saatavat vähentäen.
lease.it.commercial.payment.title=Maksaminen
lease.it.commercial.payment.summary=Säännöllinen maksu tilisiirtona sovittuna päivänä; kuitti tai lasku; purku vain, jos rikkomus ei ole vähäinen.
lease.it.commercial.maintenance.title=Kunnossapito ja korjaukset
lease.it.commercial.maintenance.summary=Vuokranantaja tekee tarpeelliset korjaukset, vuokralainen pienet kunnossapitotyöt, ellei toisin sovita; kiireelliset korjaukset, vuokranalennus pitkistä töistä.
lease.it.commercial.alterations.title=Muutostyöt ja varustelu
lease.it.commercial.alterations.summary=Työt vain vuokranantajan kirjallisella suostumuksella; lakisääteiset säännöt parannusten korvaamisesta ja lisäysten poistamisesta.
lease.it.commercial.assignment.title=Edelleenvuokraus ja siirto
lease.it.commercial.assignment.summary=Edelleenvuokraus tai siirto ilman suostumusta yhdessä liiketoiminnan kanssa, vuokranantajan vastustusoikeus painavasta syystä 30 päivän kuluessa; muuten suostumus vaaditaan.
