# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Osapuolet
lease.gb.residential.parties.summary=Yksilöi vuokranantajan ja vuokralaisen tai vuokralaiset; useat vuokralaiset vastaavat yhteisvastuullisesti; Walesissa vuokralainen on contract-holder.
lease.gb.residential.premises.title=Vuokrakohde
lease.gb.residential.premises.summary=Kuvaa vuokratun asunnon ja Yhdistyneen kuningaskunnan osan järjestelmän: assured tenancy (Englanti), standard occupation contract (Wales), private residential tenancy (Skotlanti) tai private tenancy (Pohjois-Irlanti).
lease.gb.residential.term.title=Vuokra-aika
lease.gb.residential.term.summary=Alkamispäivä; toistaiseksi voimassa oleva jaksoittainen vuokrasuhde ilman määräaikaa Englannissa ja Skotlannissa, jaksoittainen tai määräaikainen Walesissa ja Pohjois-Irlannissa.
lease.gb.residential.rent.title=Vuokra
lease.gb.residential.rent.summary=Vuokra ja vuokrakausi; Englannissa vuokrakausi saa olla enintään 1 kuukausi.
lease.gb.residential.rent-adjustment.title=Vuokrankorotukset
lease.gb.residential.rent-adjustment.summary=Korotus vain lain sallimissa tapauksissa: Englannissa section 13 -ilmoituksella tai tuomioistuimen päätöksellä; 2 kuukautta Englannissa ja Walesissa, 3 kuukautta Skotlannissa ja Pohjois-Irlannissa, enintään 1 korotus vuodessa.
lease.gb.residential.service-costs.title=Kulutusmaksut ja kunnallisvero
lease.gb.residential.service-costs.summary=Vuokralaisen maksamat kulutusmaksut ja council tax tai domestic rates sekä mahdolliset vuokranantajalle maksettavat kulut.
lease.gb.residential.deposit.title=Vakuus
lease.gb.residential.deposit.summary=Vakuus suojataan hyväksytyssä järjestelmässä; enintään 5 tai 6 viikon vuokra Englannissa, 2 kuukauden vuokra Skotlannissa ja 1 kuukauden vuokra Pohjois-Irlannissa.
lease.gb.residential.payment.title=Maksaminen
lease.gb.residential.payment.summary=Maksupäivä ja maksutapa; Englannissa vuokraa ei makseta ennen vuokrakautta ja viivästyskorko on enintään 3 % yli ohjauskoron.
lease.gb.residential.fees.title=Maksut ja sallitut suoritukset
lease.gb.residential.fees.summary=Vain sallittuja maksuja voidaan periä: Tenant Fees Act 2019 Englannissa, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 Walesissa.
lease.gb.residential.use.title=Käyttö ja lemmikit
lease.gb.residential.use.summary=Käyttö asuntona ilman häiritsevää käyttäytymistä; lemmikit vuokranantajan suostumuksella, jota ei evätä ilman kohtuullista syytä.
lease.gb.residential.subletting.title=Edelleenvuokraus ja siirto
lease.gb.residential.subletting.summary=Siirto, edelleenvuokraus ja alivuokralaiset vain vuokranantajan suostumuksella.
lease.gb.residential.maintenance.title=Kunnossapito ja asuttavuus
lease.gb.residential.maintenance.summary=Vuokranantajan lakisääteiset kunnossapito- ja asuttavuusvelvollisuudet kussakin Yhdistyneen kuningaskunnan osassa; vuokralainen ilmoittaa vioista ja päästää sisään 24 tunnin ilmoituksella.
lease.gb.residential.safety.title=Turvallisuus
lease.gb.residential.safety.summary=Kaasuturvallisuustarkastus 12 kuukauden välein, sähkötarkastus vähintään 5 vuoden välein, savu- ja häkävaroittimet.
lease.gb.residential.energy-certificate.title=Energiatodistus
lease.gb.residential.energy-certificate.summary=Vuokranantaja antaa voimassa olevan energiatodistuksen; Englannissa ja Walesissa asunnon on oltava vähintään luokkaa E.
lease.gb.residential.registration.title=Rekisteröinti ja luvat
lease.gb.residential.registration.summary=Vuokranantajan rekisteröinti Walesissa, Skotlannissa ja Pohjois-Irlannissa sekä paikallisviranomaisen mahdollisesti edellyttämä lupa.
lease.gb.residential.right-to-rent.title=Oikeus vuokrata
lease.gb.residential.right-to-rent.summary=Aikuisten asukkaiden oleskeluoikeuden tarkistus (right to rent), jota sovelletaan vain Englannissa.
lease.gb.residential.statutory-information.title=Lakisääteiset tiedot
lease.gb.residential.statutory-information.summary=Kirjallinen selvitys, ehdot tai tiedot, jotka vuokranantajan on annettava kunkin Yhdistyneen kuningaskunnan osan lain mukaan, sekä osoite ilmoituksia varten.
lease.gb.residential.handover-inspection.title=Irtaimistoluettelo ja palautus
lease.gb.residential.handover-inspection.summary=Irtaimistoluettelo ja kuntoraportti alussa; asunnon palautus lopussa tavanomaista kulumista lukuun ottamatta.
lease.gb.residential.termination.title=Päättyminen
lease.gb.residential.termination.summary=Vuokralaisen irtisanominen sekä vuokranantajan lakisääteiset perusteet ja ilmoitukset kussakin Yhdistyneen kuningaskunnan osassa; Englannissa ei häätöä section 21 -menettelyllä.
lease.gb.residential.notices.title=Ilmoitukset
lease.gb.residential.notices.summary=Kirjalliset ilmoitukset lähetin välityksellä, postitse tai, jos se on sallittua, sähköpostitse.
lease.gb.residential.data-protection.title=Tietosuoja
lease.gb.residential.data-protection.summary=Vuokralaisen henkilötietojen käsittely UK GDPR:n ja Data Protection Act 2018:n mukaisesti.
lease.gb.residential.disputes.title=Sovellettava laki ja riidat
lease.gb.residential.disputes.summary=Sen Yhdistyneen kuningaskunnan osan laki ja tuomioistuimet tai lautakunnat, jossa asunto sijaitsee.
lease.gb.commercial.parties.title=Osapuolet
lease.gb.commercial.parties.summary=Yksilöi vuokranantajan ja vuokralaisen yritystunnuksen, kotipaikan ja ALV-numeron kanssa.
lease.gb.commercial.premises.title=Vuokrakohde
lease.gb.commercial.premises.summary=Kuvaa liiketilan, sen pinta-alan ja annetut oikeudet.
lease.gb.commercial.permitted-use.title=Sallittu käyttö
lease.gb.commercial.permitted-use.summary=Sallittu liiketoiminnan käyttö; vuokralainen hankkii rakennusluvat ja muut luvat.
lease.gb.commercial.term.title=Vuokra-aika
lease.gb.commercial.term.summary=Alkamispäivä, määräaikainen tai jaksoittainen vuokrasuhde; yli 7 vuoden vuokrasopimusten rekisteröinti ja kiinteistökauppojen vero.
lease.gb.commercial.security-of-tenure.title=Hallintasuoja
lease.gb.commercial.security-of-tenure.summary=Uusimisoikeus Landlord and Tenant Act 1954 -lain (Englanti ja Wales) tai vuoden 1996 Orderin (Pohjois-Irlanti) mukaan, sen poissulkeminen ja hiljainen jatkuminen (tacit relocation) Skotlannissa.
lease.gb.commercial.rent.title=Vuokra
lease.gb.commercial.rent.summary=Vuokra ilman arvonlisäveroa, palvelumaksuja ja vakuutusmaksua.
lease.gb.commercial.rent-adjustment.title=Vuokrantarkistus
lease.gb.commercial.rent-adjustment.summary=Tarkistus markkinavuokraan tai indeksin mukaan, ylös tai alas, riippumattoman asiantuntijan vahvistamana.
lease.gb.commercial.service-costs.title=Palvelumaksut
lease.gb.commercial.service-costs.summary=Kohtuullinen osuus rakennuksen palvelukustannuksista talousarvion ja vuosittaisen tilityksen kera.
lease.gb.commercial.vat.title=Arvonlisävero
lease.gb.commercial.vat.summary=Kaikki summat ovat ilman arvonlisäveroa; arvonlisävero maksetaan, jos vuokranantaja on hakeutunut verovelvolliseksi.
lease.gb.commercial.deposit.title=Vuokravakuus
lease.gb.commercial.deposit.summary=Vakuus erillisellä korkoa kasvavalla tilillä, täydentämistä ja palauttamista koskevin säännöin.
lease.gb.commercial.payment.title=Maksaminen
lease.gb.commercial.payment.summary=Vuokra etukäteen ilman kuittausta, viivästyskorko ja liikevuokrarästien perintämenettely Englannissa ja Walesissa.
lease.gb.commercial.maintenance.title=Kunnossapito
lease.gb.commercial.maintenance.summary=Täysi tai sisätilojen kunnossapitovelvollisuus, jota mahdollinen kuntoraportti rajoittaa.
lease.gb.commercial.alterations.title=Muutostyöt
lease.gb.commercial.alterations.summary=Ei rakenteellisia muutoksia; muut muutokset suostumuksella; ennalleen saattaminen vuokrasuhteen päättyessä.
lease.gb.commercial.assignment.title=Siirto ja edelleenvuokraus
lease.gb.commercial.assignment.summary=Siirto ja edelleenvuokraus suostumuksella, jota ei evätä ilman kohtuullista syytä; vapautusta ja takausta koskevat säännöt Englannissa ja Walesissa.
lease.gb.commercial.insurance.title=Vakuutus
lease.gb.commercial.insurance.summary=Vuokranantaja vakuuttaa rakennuksen ja perii vakuutusmaksun; vuokralainen vakuuttaa irtaimiston ja vastuun; vuokranmaksu keskeytyy vakuutetun vahingon jälkeen.
lease.gb.commercial.energy-certificate.title=Energiatehokkuus
lease.gb.commercial.energy-certificate.summary=Vuokrakohteen energiatodistus; liiketiloilla vähintään luokka E Englannissa ja Walesissa.
lease.gb.commercial.break-option.title=Ennenaikainen päättämisoikeus
lease.gb.commercial.break-option.summary=Oikeus päättää vuokrasopimus ennenaikaisesti sovittuna päivänä ilmoitusajalla ja ehdoin.
lease.gb.commercial.handover-inspection.title=Kunto ja palautus
lease.gb.commercial.handover-inspection.summary=Kuntoraportti, palautus tyhjänä ja vahingonkorvauksen rajoitus laiminlyödystä kunnossapidosta.
lease.gb.commercial.termination.title=Päättyminen ja menettäminen
lease.gb.commercial.termination.summary=Vuokraoikeuden menettäminen (forfeiture tai irritancy) maksun laiminlyönnin, sopimusrikkomuksen tai maksukyvyttömyyden vuoksi, lakisääteisin ilmoituksin ja oikeussuojin.
lease.gb.commercial.notices.title=Ilmoitukset
lease.gb.commercial.notices.summary=Kirjalliset ilmoitukset lähetin välityksellä tai kirjattuna kirjeenä rekisteröityyn kotipaikkaan.
lease.gb.commercial.guarantor.title=Takaaja
lease.gb.commercial.guarantor.summary=Takaajan antama takaus vuokralaisen velvoitteista.
lease.gb.commercial.data-protection.title=Tietosuoja
lease.gb.commercial.data-protection.summary=Osapuolten edustajien henkilötietojen käsittely UK GDPR:n mukaisesti.
lease.gb.commercial.disputes.title=Sovellettava laki ja riidat
lease.gb.commercial.disputes.summary=Sen lainkäyttöalueen laki ja tuomioistuimet, jossa vuokrakohde sijaitsee; pätemättömät ehdot eivät vaikuta muihin.
