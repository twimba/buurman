# ===== LU lease clause titles and summaries (country pack) =====
lease.lu.residential.parties.title=Osapuolet
lease.lu.residential.parties.summary=Vuokranantajan ja jokaisen vuokralaisen täydelliset tiedot; sopimus on tehtävä kirjallisesti, muuten se on mitätön.
lease.lu.residential.premises.title=Huoneisto
lease.lu.residential.premises.summary=Asunnon kuvaus kiinteistötunnuksineen sekä kaikki vuokratut huoneet ja osat.
lease.lu.residential.term.title=Vuokrasuhteen kesto
lease.lu.residential.term.summary=Määräaikainen tai toistaiseksi voimassa; päättyessään sopimus jatkuu toistaiseksi lakisääteisiä poikkeuksia lukuun ottamatta.
lease.lu.residential.rent.title=Vuokra
lease.lu.residential.rent.summary=Vuokra ilman sivukuluja, enintään 5 % vuodessa sijoitetusta pääomasta; välityspalkkio jaetaan puoliksi.
lease.lu.residential.rent-adjustment.title=Vuokran tarkistus
lease.lu.residential.rent-adjustment.summary=Vuokraa tarkistetaan enintään 2 vuoden välein; korotus on enintään 10 %.
lease.lu.residential.service-costs.title=Sivukulut
lease.lu.residential.service-costs.summary=Veloitettavat kulut, ennakkomaksut tai kiinteä maksu ja niiden vuosittainen jako.
lease.lu.residential.deposit.title=Vuokravakuus
lease.lu.residential.deposit.summary=Vakuus enintään 2 kuukauden vuokra, palautetaan 2 vaiheessa vuokrasuhteen päätyttyä.
lease.lu.residential.payment.title=Maksaminen
lease.lu.residential.payment.summary=Maksu etukäteen, eräpäivä ja laillinen korko viivästyksestä.
lease.lu.residential.use.title=Käyttö
lease.lu.residential.use.summary=Huolellinen asuinkäyttö, muutostyöt ja pääsy asuntoon.
lease.lu.residential.subletting.title=Siirto ja alivuokraus
lease.lu.residential.subletting.summary=Siirto on sallittu, ellei sitä ole nimenomaisesti kielletty; alivuokraus vaatii suostumuksen.
lease.lu.residential.shared-tenancy.title=Yhteisvuokraus
lease.lu.residential.shared-tenancy.summary=Valinnainen yhteisvuokrausjärjestely, jossa sopimus, yhteisvastuu ja omat irtisanomissäännöt.
lease.lu.residential.maintenance.title=Kunnossapito
lease.lu.residential.maintenance.summary=Korjausten jako vuokranantajan ja vuokralaisen kesken, asumisvaatimukset ja palovaroittimet.
lease.lu.residential.energy-certificate.title=Energiatodistus
lease.lu.residential.energy-certificate.summary=Oikeaksi todistettu jäljennös energiatehokkuustodistuksesta vuokralaiselle.
lease.lu.residential.pre-emption.title=Etuosto-oikeus
lease.lu.residential.pre-emption.summary=Vuokralaisen etuosto-oikeus vähintään 18 vuotta kestäneen vuokrasuhteen jälkeen.
lease.lu.residential.succession.title=Vuokrasuhteen jatkuminen
lease.lu.residential.succession.summary=Jatkuminen puolison, kumppanin tai perheenjäsenten hyväksi vuokralaisen muuttaessa tai kuollessa.
lease.lu.residential.handover-inspection.title=Tarkastus
lease.lu.residential.handover-inspection.summary=Yhteiset sisään- ja poismuuttotarkastukset, pakollisia jos vakuudesta on sovittu.
lease.lu.residential.termination.title=Irtisanominen
lease.lu.residential.termination.summary=Vuokralaisen irtisanomisaika 3 kuukautta toistaiseksi voimassa olevassa sopimuksessa; vuokranantaja vain laissa säädetyin perustein, omaan käyttöön 6 kuukautta.
lease.lu.residential.data-protection.title=Tietosuoja
lease.lu.residential.data-protection.summary=Vuokralaisen henkilötietojen käsittely tietosuoja-asetuksen mukaisesti.
lease.lu.residential.disputes.title=Riidat
lease.lu.residential.disputes.summary=Vuokralautakunta vuokraa koskevissa riidoissa, rauhantuomari muissa riidoissa.
lease.lu.commercial.parties.title=Osapuolet
lease.lu.commercial.parties.summary=Vuokranantajan ja vuokralaisen tiedot, RCS-numero, ALV-numero, toimilupa ja edustajat.
lease.lu.commercial.premises.title=Liiketila
lease.lu.commercial.premises.summary=Liiketilan kuvaus ja liikehuoneistojen vuokrasääntöjen soveltamisala.
lease.lu.commercial.permitted-use.title=Käyttötarkoitus
lease.lu.commercial.permitted-use.summary=Tilassa sallittu toiminta ja vuokralaisen luvat.
lease.lu.commercial.term.title=Vuokrasuhteen kesto
lease.lu.commercial.term.summary=Määräaikainen tai toistaiseksi voimassa, sitoo ostajaa, jatkuu hiljaisesti toistaiseksi.
lease.lu.commercial.rent.title=Vuokra
lease.lu.commercial.rent.summary=Vapaasti sovittu vuokra; sopimuksen tekemisestä maksettu lisämaksu on mitätön.
lease.lu.commercial.rent-adjustment.title=Indeksisidonnaisuus
lease.lu.commercial.rent-adjustment.summary=Vuosittainen sidonta kansalliseen kuluttajahintaindeksiin (STATEC).
lease.lu.commercial.service-costs.title=Sivukulut
lease.lu.commercial.service-costs.summary=Vuokralaisen maksamat kulut ja verot ennakkomaksuin ja vuosittaisella tasauksella.
lease.lu.commercial.vat.title=Arvonlisävero
lease.lu.commercial.vat.summary=Verovapaa vuokraus, jossa vuokranantaja voi hakeutua arvonlisäverovelvolliseksi.
lease.lu.commercial.deposit.title=Vuokravakuus
lease.lu.commercial.deposit.summary=Vakuus enintään 6 kuukauden vuokra; ensimmäisestä vaatimuksesta maksettavaa pankkitakausta ei voi torjua.
lease.lu.commercial.payment.title=Maksaminen
lease.lu.commercial.payment.summary=Maksu etukäteen, eräpäivä ja laillinen korko viivästyksestä.
lease.lu.commercial.maintenance.title=Kunnossapito
lease.lu.commercial.maintenance.summary=Korjausten jako vuokranantajan ja vuokralaisen kesken.
lease.lu.commercial.alterations.title=Muutostyöt
lease.lu.commercial.alterations.summary=Työt vain vuokranantajan suostumuksella ja muutosten kohtalo vuokrasuhteen päättyessä.
lease.lu.commercial.assignment.title=Siirto ja alivuokraus
lease.lu.commercial.assignment.summary=Siirtoa tai alivuokrausta yhdessä liiketoiminnan kanssa ei voi kieltää, jos sama toiminta jatkuu; ilmoitus ja hyväksyntä.
lease.lu.commercial.insurance.title=Vakuutus
lease.lu.commercial.insurance.summary=Vuokralaisen vastuu- ja toimintavakuutus.
lease.lu.commercial.energy-certificate.title=Energiatodistus
lease.lu.commercial.energy-certificate.summary=Jäljennös energiatehokkuustodistuksesta, kun säännökset sitä edellyttävät.
lease.lu.commercial.handover-inspection.title=Tarkastus
lease.lu.commercial.handover-inspection.summary=Yhteiset sisään- ja poismuuttotarkastukset.
lease.lu.commercial.renewal.title=Uusiminen
lease.lu.commercial.renewal.summary=Vuokralainen voi pyytää uusimista vähintään 6 kuukautta ennen päättymistä; 9 vuoden jälkeen vuokranantaja voi päättää sopimuksen häätökorvausta vastaan.
lease.lu.commercial.pre-emption.title=Etuosto-oikeus
lease.lu.commercial.pre-emption.summary=Vuokralaisen etuosto-oikeus vähintään 18 vuotta kestäneen vuokrasuhteen jälkeen.
lease.lu.commercial.termination.title=Irtisanominen
lease.lu.commercial.termination.summary=Vähintään 6 kuukauden irtisanomisaika kirjattuna kirjeenä; vuokranantajan perusteet ja häädön lykkäys.
lease.lu.commercial.data-protection.title=Tietosuoja
lease.lu.commercial.data-protection.summary=Osapuolten henkilötietojen käsittely tietosuoja-asetuksen mukaisesti.
lease.lu.commercial.disputes.title=Riidat
lease.lu.commercial.disputes.summary=Luxemburgin laki ja liiketilan sijaintipaikan rauhantuomari.
