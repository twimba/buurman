lease.it.commercial.rent-adjustment.summary=Vapaaehtoinen vuotuinen tarkistus vuokranantajan pyynnöstä; korotukset enintään 75% ISTAT-indeksin muutoksesta sopimuksissa, jotka eivät ylitä lakisääteistä kestoa.
lease.it.commercial.service-costs.title=Sivukulut
lease.it.commercial.service-costs.summary=Sivukulujen lakisääteinen jako, ellei toisin sovita; maksu 2 kuukauden kuluessa pyynnöstä, oikeus erittelyyn ja tositteisiin.
