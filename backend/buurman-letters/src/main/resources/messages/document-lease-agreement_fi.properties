lease.it.residential.term.summary=Vähintään 4 vuotta (tai sovittu pidempi aika), jatkuu 4 vuodella, ellei vuokranantaja kieltäydy laissa säädetyin perustein; toisella päättymiskerralla uusimismenettely kirjattuna kirjeenä vähintään 6 kuukautta etukäteen.
lease.it.residential.rent.title=Vuokra
lease.it.residential.rent.summary=Osapuolten sopima vuokra; kirjallisen ja rekisteröidyn sopimuksen vuokraa korkeampi vuokraehto on mitätön.
lease.it.residential.rent-adjustment.title=Vuokrantarkistus
lease.it.residential.rent-adjustment.summary=Vapaaehtoinen vuotuinen tarkistus sovitulla osuudella ISTAT-indeksin muutoksesta; keskeytyy, jos vuokranantaja valitsee cedolare secca -verotuksen.
lease.it.residential.service-costs.title=Sivukulut
lease.it.residential.service-costs.summary=Sivukulujen lakisääteinen jako vuokralaisen maksettavaksi, ellei toisin sovita; maksu 2 kuukauden kuluessa pyynnöstä, oikeus erittelyyn ja tositteisiin.
lease.it.residential.deposit.title=Vakuus
lease.it.residential.deposit.summary=Vapaaehtoinen vakuus enintään 3 kuukauden vuokra, jolle maksetaan vuosittain laillinen korko; palautetaan lopussa erääntyneet saatavat vähentäen.
lease.it.residential.payment.title=Maksaminen
