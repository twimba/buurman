lease.at.commercial.vat.summary=Hyresvärden väljer moms på hyran; hyresgästen använder lokalen nästan uteslutande för momspliktig verksamhet.
lease.at.commercial.deposit.title=Deposition
lease.at.commercial.deposit.summary=Kontant deposition eller bankgaranti utan lagstadgat tak, återlämnas efter hyresavtalets slut.
lease.at.commercial.payment.title=Betalning
lease.at.commercial.payment.summary=Hyran betalas månadsvis i förskott; dröjsmålsränta mellan näringsidkare på 9,2 procentenheter över basräntan.
lease.at.commercial.maintenance.title=Underhåll
lease.at.commercial.maintenance.summary=Vid full tillämpning av MRG gäller § 3 MRG; annars underhåller hyresvärden stommen och gemensamma delar, hyresgästen det inre.
lease.at.commercial.alterations.title=Ändringar och inredning
lease.at.commercial.alterations.summary=Arbeten och skyltar endast med skriftligt samtycke; borttagande vid hyresavtalets slut.
