lease.at.commercial.subletting.summary=Andrahandsuthyrning kräver samtycke; lagstadgade rättigheter vid försäljning eller utarrendering av rörelsen vid full tillämpning av MRG.
lease.at.commercial.insurance.title=Försäkringar
lease.at.commercial.insurance.summary=Hyresvärden försäkrar byggnaden; hyresgästen inredning och verksamhetsansvar.
lease.at.commercial.energy-certificate.title=Energicertifikat
lease.at.commercial.energy-certificate.summary=Hyresvärden visar och överlämnar energicertifikatet (EAVG 2012).
