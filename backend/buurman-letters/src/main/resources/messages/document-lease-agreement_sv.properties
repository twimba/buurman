# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Parter
lease.at.residential.parties.summary=Anger hyresvärd och hyresgäst(er); medhyresgäster ansvarar solidariskt; hyresvärden kryssar i om den är näringsidkare.
lease.at.residential.premises.title=Hyresobjekt
lease.at.residential.premises.summary=Beskriver bostaden och anger vilken MRG-ordning som gäller: full tillämpning, delvis tillämpning eller helt undantag.
lease.at.residential.term.title=Hyrestid
lease.at.residential.term.summary=Obestämd eller bestämd tid; enligt MRG skriftligen och minst 5 år (3 år om hyresvärden inte är näringsidkare).
lease.at.residential.rent.title=Hyra
lease.at.residential.rent.summary=Grundhyran och vid full tillämpning av MRG de lagstadgade hyrestaken (riktvärde, kategoribelopp).
lease.at.residential.rent-adjustment.title=Indexering
lease.at.residential.rent-adjustment.summary=Årlig indexering den 1 april enligt MieWeG; inflation över 3 procent räknas bara till hälften.
lease.at.residential.service-costs.title=Driftskostnader
lease.at.residential.service-costs.summary=Andel av driftskostnader och offentliga avgifter i månatliga delbelopp; avräkning senast 30 juni vid full tillämpning av MRG.
lease.at.residential.deposit.title=Deposition
lease.at.residential.deposit.summary=Deposition utan lagstadgat tak, placerad på sparbok och återbetald med ränta utan dröjsmål.
lease.at.residential.payment.title=Betalning
lease.at.residential.payment.summary=Hyran betalas månadsvis i förskott senast den 5:e; lagstadgad dröjsmålsränta på 4 procent per år.
lease.at.residential.use.title=Användning
lease.at.residential.use.summary=Endast bostadsändamål, tillträde av viktiga skäl och anmälningsförfarandet för väsentliga ändringar.
lease.at.residential.subletting.title=Andrahandsuthyrning
lease.at.residential.subletting.summary=Andrahandsuthyrning endast med samtycke; vid full tillämpning av MRG får vägran ske endast av viktigt skäl.
lease.at.residential.maintenance.title=Underhåll och brister
lease.at.residential.maintenance.summary=Hyresvärden håller bostaden brukbar; hyresbefrielse vid obrukbarhet; hyresgästen anmäler brister utan dröjsmål.
lease.at.residential.energy-certificate.title=Energicertifikat
lease.at.residential.energy-certificate.summary=Hyresvärden visar och överlämnar energicertifikatet (EAVG 2012).
lease.at.residential.registration.title=Folkbokföring
lease.at.residential.registration.summary=Hyresgästen anmäler sig hos registreringsmyndigheten inom 3 dagar efter inflyttningen.
lease.at.residential.handover-inspection.title=Tillträde och återlämnande
lease.at.residential.handover-inspection.summary=Protokoll vid tillträde och återlämnande, återlämnande i mottaget skick och frister för anspråk.
lease.at.residential.termination.title=Uppsägning
lease.at.residential.termination.summary=Enligt MRG säger hyresvärden upp endast genom domstol och av viktiga skäl; uppsägningstider och förtida hävning.
