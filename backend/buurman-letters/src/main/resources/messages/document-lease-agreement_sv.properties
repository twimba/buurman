lease.at.commercial.rent.summary=Grundhyran; vid full tillämpning av MRG begränsad till skäligt belopp, som en hyresgäst som är näringsidkare kan åberopa endast efter invändning i tid.
lease.at.commercial.rent-adjustment.title=Indexering
lease.at.commercial.rent-adjustment.summary=Indexering enligt konsumentprisindex 2020 med en tröskel som fylls i, uppåt och nedåt.
lease.at.commercial.service-costs.title=Driftskostnader
lease.at.commercial.service-costs.summary=Andel av driftskostnader och offentliga avgifter i månatliga delbelopp med årlig avräkning.
