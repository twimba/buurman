lease.at.residential.data-protection.summary=Behandling av hyresgästens personuppgifter enligt GDPR.
lease.at.residential.disputes.title=Tvister och slutbestämmelser
lease.at.residential.disputes.summary=Österrikisk rätt; distriktsdomstolen på bostadens ort; hyresavtal för bostäder är befriade från avtalsavgift.
