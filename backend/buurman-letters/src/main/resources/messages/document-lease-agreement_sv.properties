lease.at.commercial.permitted-use.summary=Den avtalade verksamheten; ändring endast med samtycke; utebliven användning kan vara uppsägningsgrund.
lease.at.commercial.term.title=Hyrestid
lease.at.commercial.term.summary=Bestämd eller obestämd tid; enligt MRG krävs ett skriftligt avtal om att hyresavtalet upphör vid tidens utgång.
