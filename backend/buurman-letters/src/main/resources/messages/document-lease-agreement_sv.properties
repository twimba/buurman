lease.it.residential.notices.title=Meddelanden
lease.it.residential.notices.summary=Rekommenderat brev där lagen kräver det; adresser och certifierade e-postadresser för meddelanden.
lease.it.residential.guarantor.title=Borgensman
lease.it.residential.guarantor.summary=Frivillig borgen upp till ett högsta belopp, solidariskt ansvar; utsträckning efter första utgången endast om det avtalats.
