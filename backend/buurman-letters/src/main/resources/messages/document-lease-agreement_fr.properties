lease.cz.commercial.subletting.title=Sous-location
lease.cz.commercial.subletting.summary=Sous-location uniquement avec l'accord écrit du bailleur ; une sous-location non autorisée est un manquement grave.
lease.cz.commercial.assignment.title=Cession du bail
lease.cz.commercial.assignment.summary=Cession du bail avec l'activité professionnelle, avec l'accord écrit préalable du bailleur.
lease.cz.commercial.insurance.title=Assurance
lease.cz.commercial.insurance.summary=Assurance de l'immeuble par le bailleur ; le preneur assure ses aménagements et son stock et souscrit une assurance de responsabilité.
lease.cz.commercial.energy-certificate.title=Certificat de performance énergétique
lease.cz.commercial.energy-certificate.summary=Certificat de performance énergétique présenté avant la signature et remis au plus tard à la signature.
lease.cz.commercial.goodwill-compensation.title=Indemnité pour la clientèle
lease.cz.commercial.goodwill-compensation.summary=Indemnité pour la clientèle reprise en cas de congé donné par le bailleur, sauf après un manquement grave.
lease.cz.commercial.handover-inspection.title=Remise et restitution
lease.cz.commercial.handover-inspection.summary=Procès-verbal de remise au début et restitution des locaux libérés dans l'état reçu.
lease.cz.commercial.termination.title=Fin du bail
lease.cz.commercial.termination.summary=Motifs légaux et préavis de 3 mois pour une durée déterminée, 6 ou 3 mois pour une durée indéterminée, objections et contrôle judiciaire.
lease.cz.commercial.notices.title=Notifications
lease.cz.commercial.notices.summary=Notifications écrites aux sièges sociaux ou par boîtes de données (datové schránky).
lease.cz.commercial.data-protection.title=Protection des données
lease.cz.commercial.data-protection.summary=Traitement des données personnelles des représentants et des personnes de contact selon le RGPD.
lease.cz.commercial.disputes.title=Droit applicable et litiges
lease.cz.commercial.disputes.summary=Droit tchèque et juridictions tchèques.
# ===== end CZ =====


# ===== DK lease clause titles and summaries (country pack) =====
lease.dk.residential.parties.title=Parties
lease.dk.residential.parties.summary=Identifie le bailleur et le ou les locataires ; les colocataires sont solidairement responsables.
lease.dk.residential.premises.title=Lieux loués
lease.dk.residential.premises.summary=Le logement loué, l'application de la loi danoise sur les baux et la mention qu'il ne s'agit pas du formulaire type agréé (typeformular A).
lease.dk.residential.term.title=Durée
lease.dk.residential.term.summary=Date de prise d'effet ; bail à durée indéterminée, ou à durée déterminée prenant fin sans congé et justifié par la situation du bailleur.
lease.dk.residential.rent.title=Loyer
lease.dk.residential.rent.summary=Le loyer et les règles applicables (loyer fondé sur les coûts, valeur locative ou loyer librement convenu).
lease.dk.residential.rent-adjustment.title=Révision du loyer
lease.dk.residential.rent-adjustment.summary=Indexation annuelle sur l'indice des prix nets lorsque la loi le permet, et hausses de loyer légales.
lease.dk.residential.service-costs.title=Frais de consommation
lease.dk.residential.service-costs.summary=Provisions pour le chauffage, l'eau et les autres consommations fournies par le bailleur, avec un décompte annuel.
lease.dk.residential.deposit.title=Dépôt de garantie et loyer payé d'avance
lease.dk.residential.deposit.summary=Dépôt d'au plus 3 mois de loyer et loyer payé d'avance d'au plus 3 mois, ajustés en cas de modification du loyer.
lease.dk.residential.payment.title=Paiement
lease.dk.residential.payment.summary=Loyer payable mensuellement d'avance sur le compte bancaire du bailleur ; jamais plus de 3 mois à la fois.
lease.dk.residential.use.title=Usage des lieux
lease.dk.residential.use.summary=Usage d'habitation exclusivement, utilisation soigneuse du logement et respect du règlement de l'immeuble.
lease.dk.residential.subletting.title=Sous-location
lease.dk.residential.subletting.summary=Usage par des tiers uniquement avec accord ; droit légal du locataire de sous-louer une partie du logement, ou tout le logement pendant 2 ans au plus.
lease.dk.residential.maintenance.title=Entretien
lease.dk.residential.maintenance.summary=Le bailleur entretient l'immeuble et le logement ; le locataire entretient serrures et clés et signale les dommages.
lease.dk.residential.energy-label.title=Étiquette énergétique
lease.dk.residential.energy-label.summary=Le bailleur remet l'étiquette énergétique avant la conclusion du bail, sauf exemption.
lease.dk.residential.handover-inspection.title=Entrée et sortie
lease.dk.residential.handover-inspection.summary=État à la remise, visites d'entrée et de sortie avec rapports, délais de réclamation et restitution du logement.
lease.dk.residential.termination.title=Congé et résiliation
lease.dk.residential.termination.summary=Congé du locataire avec préavis de 3 mois, congé du bailleur pour motifs légaux uniquement, et résiliation après mise en demeure écrite.
lease.dk.residential.data-protection.title=Protection des données
lease.dk.residential.data-protection.summary=Traitement des données personnelles du locataire conformément au RGPD.
lease.dk.residential.disputes.title=Droit applicable et litiges
lease.dk.residential.disputes.summary=Droit danois ; la commission des loyers et le tribunal du logement tranchent les litiges.
lease.dk.commercial.parties.title=Parties
lease.dk.commercial.parties.summary=Identifie le bailleur et le preneur avec leurs numéros d'entreprise (CVR) et leurs représentants.
lease.dk.commercial.premises.title=Locaux loués
lease.dk.commercial.premises.summary=Les locaux professionnels loués, leur surface et l'application de la loi danoise sur les baux professionnels.
lease.dk.commercial.permitted-use.title=Destination des lieux
lease.dk.commercial.permitted-use.summary=L'activité convenue, les autorisations, l'enseigne et l'obligation de maintenir un commerce ouvert.
lease.dk.commercial.term.title=Durée
lease.dk.commercial.term.summary=Date de prise d'effet ; bail à durée indéterminée avec d'éventuelles périodes de non-résiliation, ou à durée déterminée.
lease.dk.commercial.rent.title=Loyer
lease.dk.commercial.rent.summary=Le loyer librement convenu et la date de référence pour les ajustements ultérieurs liés aux impôts et taxes.
lease.dk.commercial.rent-adjustment.title=Révision du loyer
lease.dk.commercial.rent-adjustment.summary=Indexation annuelle sur l'indice des prix nets, hausses liées aux impôts et taxes et révision à la valeur locative de marché.
lease.dk.commercial.service-costs.title=Charges et frais de consommation
lease.dk.commercial.service-costs.summary=Catégories de charges payables en sus du loyer avec leurs montants estimés, et le décompte de consommation.
lease.dk.commercial.vat.title=TVA
lease.dk.commercial.vat.summary=La location est exonérée de TVA ; la TVA s'ajoute si le bailleur est volontairement immatriculé pour la location.
lease.dk.commercial.deposit.title=Dépôt de garantie et loyer payé d'avance
lease.dk.commercial.deposit.summary=Dépôt et loyer payé d'avance librement convenus ; opposables aux tiers sans inscription jusqu'à ½ année de loyer.
lease.dk.commercial.payment.title=Paiement
lease.dk.commercial.payment.summary=Loyer payable d'avance ; le paiement est à temps jusqu'au 3e jour ouvrable suivant l'échéance.
lease.dk.commercial.maintenance.title=Entretien
lease.dk.commercial.maintenance.summary=Les obligations d'entretien du bailleur, la répartition convenue de l'entretien intérieur et l'accès pour travaux.
lease.dk.commercial.alterations.title=Travaux et installations
lease.dk.commercial.alterations.summary=Droit légal du preneur aux installations et transformations usuelles, garantie et remise en état.
lease.dk.commercial.assignment.title=Cession du bail
lease.dk.commercial.assignment.summary=Droit légal du preneur de céder le bail dans la même branche d'activité, sauf exclusion contractuelle.
lease.dk.commercial.subletting.title=Sous-location
lease.dk.commercial.subletting.summary=Usage par des tiers uniquement avec l'accord du bailleur ou un droit de sous-location convenu.
lease.dk.commercial.energy-label.title=Étiquette énergétique
lease.dk.commercial.energy-label.summary=Le bailleur remet l'étiquette énergétique avant la conclusion du bail, sauf exemption.
lease.dk.commercial.handover-inspection.title=Remise et restitution
lease.dk.commercial.handover-inspection.summary=Visite commune à la remise, signalement des défauts sous 2 semaines, restitution et délai de 4 semaines pour les réclamations.
lease.dk.commercial.termination.title=Congé et résiliation
lease.dk.commercial.termination.summary=Préavis de 3 mois, congé du bailleur pour motifs légaux uniquement et contre indemnité, et résiliation après mise en demeure.
lease.dk.commercial.data-protection.title=Protection des données
lease.dk.commercial.data-protection.summary=Traitement des données personnelles des personnes agissant pour les parties conformément au RGPD.
lease.dk.commercial.disputes.title=Droit applicable et litiges
lease.dk.commercial.disputes.summary=Droit danois ; le tribunal du logement ou l'arbitrage convenu tranche les litiges.
# ===== end DK =====


# ===== FI lease clause titles and summaries (country pack) =====
lease.fi.residential.parties.title=Parties
lease.fi.residential.parties.summary=Identifie le bailleur et le locataire ; les colocataires et les conjoints vivant ensemble sont tenus solidairement.
lease.fi.residential.premises.title=Logement
lease.fi.residential.premises.summary=Décrit le logement et le droit du bailleur de le louer ; la loi finlandaise sur les baux d'habitation s'applique, sauf à Åland.
lease.fi.residential.term.title=Durée
lease.fi.residential.term.summary=Durée déterminée ou indéterminée, par écrit ; des durées courtes répétées deviennent à durée indéterminée.
lease.fi.residential.rent.title=Loyer
lease.fi.residential.rent.summary=Le loyer convenu ; chaque partie peut faire examiner son caractère raisonnable par le juge.
lease.fi.residential.rent-adjustment.title=Révision du loyer
lease.fi.residential.rent-adjustment.summary=Base de révision convenue ; notification écrite, effet au plus tôt 1 mois après le début de la période de paiement suivante.
lease.fi.residential.service-costs.title=Charges d'utilisation
lease.fi.residential.service-costs.summary=Charges d'eau, d'électricité et autres avec données de consommation ; eau facturée selon la consommation mesurée.
lease.fi.residential.deposit.title=Garantie
lease.fi.residential.deposit.summary=Garantie d'au plus 3 mois de loyer, restituée ou retenue notifiée dans les 14 jours suivant la fin.
lease.fi.residential.payment.title=Paiement
lease.fi.residential.payment.summary=Loyer dû au jour convenu ou le 2e jour de chaque période par voie bancaire ; avance limitée à 3 mois.
lease.fi.residential.use.title=Usage du logement
lease.fi.residential.use.summary=Usage d'habitation uniquement, déclaration des autres occupants, entretien soigneux et interdiction légale de fumer.
lease.fi.residential.subletting.title=Sous-location et cession
lease.fi.residential.subletting.summary=Sous-location jusqu'à la moitié du logement, mise à disposition temporaire jusqu'à 2 ans, cession seulement avec accord, sauf à un membre de la famille aux conditions légales.
lease.fi.residential.maintenance.title=État et entretien
lease.fi.residential.maintenance.summary=État exigé, signalement des défauts, réduction du loyer, travaux et accès du bailleur.
lease.fi.residential.energy-certificate.title=Certificat énergétique
lease.fi.residential.energy-certificate.summary=Le certificat de performance énergétique est présenté à la visite et remis, sauf exceptions légales.
lease.fi.residential.handover-inspection.title=Remise des lieux et jour du déménagement
lease.fi.residential.handover-inspection.summary=État des lieux conjoint ; le jour du déménagement est le jour de fin du bail ; biens laissés sur place.
lease.fi.residential.termination.title=Congé et résolution
lease.fi.residential.termination.summary=Préavis du bailleur de 4 ou 3 mois, du locataire de 1 mois, congé écrit notifié de manière probante, résolution.
lease.fi.residential.notices.title=Notifications
lease.fi.residential.notices.summary=Notifications par voie postale ou par un canal électronique convenu ; congés notifiés de manière probante.
lease.fi.residential.data-protection.title=Protection des données
lease.fi.residential.data-protection.summary=Traitement des données personnelles conformément au RGPD et à la loi finlandaise sur la protection des données.
lease.fi.residential.disputes.title=Litiges
lease.fi.residential.disputes.summary=Droit finlandais, commission finlandaise des litiges de consommation, tribunal de district et procédure des petits litiges.
lease.fi.commercial.parties.title=Parties
lease.fi.commercial.parties.summary=Identifie le bailleur et le preneur avec leur identifiant d'entreprise, numéro de TVA et représentants.
lease.fi.commercial.premises.title=Locaux
lease.fi.commercial.premises.summary=Décrit les locaux commerciaux et le droit du bailleur de les louer ; la loi finlandaise sur les baux de locaux commerciaux s'applique.
lease.fi.commercial.permitted-use.title=Destination
lease.fi.commercial.permitted-use.summary=Usage convenu des locaux ; tout changement exige l'accord du bailleur ; le preneur obtient les autorisations.
lease.fi.commercial.term.title=Durée
lease.fi.commercial.term.summary=Durée déterminée ou indéterminée, par écrit ; un bail à durée déterminée ne peut en principe pas être résilié par congé.
lease.fi.commercial.rent.title=Loyer
lease.fi.commercial.rent.summary=Le loyer convenu, majoré de la TVA et des charges d'utilisation si convenu.
lease.fi.commercial.rent-adjustment.title=Révision du loyer
lease.fi.commercial.rent-adjustment.summary=Base de révision annuelle convenue, notifiée par écrit avant sa prise d'effet.
lease.fi.commercial.service-costs.title=Charges d'utilisation
lease.fi.commercial.service-costs.summary=Eau, électricité, chauffage et autres charges facturées selon des bases convenues.
lease.fi.commercial.vat.title=TVA
lease.fi.commercial.vat.summary=La location est exonérée de TVA sauf option du bailleur pour l'assujettissement ; obligations d'usage et d'information du preneur.
lease.fi.commercial.deposit.title=Garantie
lease.fi.commercial.deposit.summary=Garantie raisonnable sans plafond légal, restituée après le bail sous déduction des sommes exigibles.
lease.fi.commercial.payment.title=Paiement
lease.fi.commercial.payment.summary=Loyer dû au jour convenu ou le 2e jour de chaque période ; loyer d'avance et intérêts de retard.
lease.fi.commercial.maintenance.title=Entretien
lease.fi.commercial.maintenance.summary=Répartition convenue des responsabilités, état, signalement des défauts, travaux et accès du bailleur.
lease.fi.commercial.alterations.title=Travaux du preneur
lease.fi.commercial.alterations.summary=Travaux du preneur seulement avec autorisation écrite ; indemnité pour les travaux ayant accru la valeur à la fin.
lease.fi.commercial.assignment.title=Cession
lease.fi.commercial.assignment.summary=Cession soumise à accord sauf en cas de cession du fonds, à moins d'exclusion ; notification 2 mois avant.
lease.fi.commercial.subletting.title=Sous-location
lease.fi.commercial.subletting.summary=Jusqu'à la moitié des locaux peut être sous-louée sauf convention contraire ; le preneur reste responsable.
lease.fi.commercial.insurance.title=Assurance
lease.fi.commercial.insurance.summary=Assurance responsabilité civile et dommages du preneur ; le bailleur assure le bâtiment.
lease.fi.commercial.energy-certificate.title=Certificat énergétique
lease.fi.commercial.energy-certificate.summary=Le certificat de performance énergétique est présenté à la visite et remis, sauf exceptions légales.
lease.fi.commercial.handover-inspection.title=Remise des lieux et jour du déménagement
lease.fi.commercial.handover-inspection.summary=État des lieux conjoint ; le jour du déménagement est le jour ouvrable suivant la fin du bail ; report d'au plus 6 mois.
lease.fi.commercial.termination.title=Congé et résolution
lease.fi.commercial.termination.summary=Préavis de 3 mois (bailleur) et 1 mois (preneur) sauf convention ; protection, indemnités et résolution.
lease.fi.commercial.notices.title=Notifications
lease.fi.commercial.notices.summary=Notifications par voie postale ou par un canal électronique convenu ou habituel ; congés notifiés de manière probante.
lease.fi.commercial.data-protection.title=Protection des données
lease.fi.commercial.data-protection.summary=Traitement des données personnelles des représentants et contacts conformément au RGPD.
lease.fi.commercial.disputes.title=Litiges
lease.fi.commercial.disputes.summary=Droit finlandais et tribunal de district compétent.
# ===== end FI =====


# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Parties
lease.gb.residential.parties.summary=Identifie le bailleur et le ou les locataires ; les colocataires sont solidairement responsables ; au pays de Galles, le locataire est le contract-holder.
lease.gb.residential.premises.title=Locaux loués
lease.gb.residential.premises.summary=Décrit le logement loué et le régime de la nation : assured tenancy (Angleterre), standard occupation contract (pays de Galles), private residential tenancy (Écosse) ou private tenancy (Irlande du Nord).
lease.gb.residential.term.title=Durée
lease.gb.residential.term.summary=Date de prise d'effet ; location périodique sans durée déterminée en Angleterre et en Écosse, périodique ou à durée déterminée au pays de Galles et en Irlande du Nord.
lease.gb.residential.rent.title=Loyer
lease.gb.residential.rent.summary=Le loyer et la période de loyer ; en Angleterre, la période de loyer ne peut excéder 1 mois.
lease.gb.residential.rent-adjustment.title=Augmentations de loyer
lease.gb.residential.rent-adjustment.summary=Augmentation uniquement dans les cas prévus par la loi : en Angleterre par avis au titre de la section 13 ou décision du tribunal ; 2 mois en Angleterre et au pays de Galles, 3 mois en Écosse et en Irlande du Nord, au plus 1 augmentation par an.
lease.gb.residential.service-costs.title=Fournitures et taxe locale
lease.gb.residential.service-costs.summary=Fournitures et council tax ou domestic rates à la charge du locataire, et les éventuels frais payables au bailleur.
lease.gb.residential.deposit.title=Dépôt de garantie
lease.gb.residential.deposit.summary=Dépôt protégé dans un dispositif agréé ; plafonné à 5 ou 6 semaines de loyer en Angleterre, 2 mois de loyer en Écosse et 1 mois de loyer en Irlande du Nord.
lease.gb.residential.payment.title=Paiement
lease.gb.residential.payment.summary=Date et mode de paiement ; en Angleterre, aucun loyer avant la période de loyer et intérêts de retard plafonnés à 3 % au-dessus du taux de base.
lease.gb.residential.fees.title=Frais et paiements autorisés
lease.gb.residential.fees.summary=Seuls les paiements autorisés peuvent être exigés : Tenant Fees Act 2019 en Angleterre, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 au pays de Galles.
lease.gb.residential.use.title=Usage et animaux
lease.gb.residential.use.summary=Usage d'habitation sans comportement antisocial ; animaux avec l'accord du bailleur, qui ne peut être refusé sans motif raisonnable.
lease.gb.residential.subletting.title=Sous-location et cession
lease.gb.residential.subletting.summary=Cession, sous-location et hébergement d'un pensionnaire uniquement avec l'accord du bailleur.
lease.gb.residential.maintenance.title=Réparations et habitabilité
lease.gb.residential.maintenance.summary=Les obligations légales de réparation et d'habitabilité du bailleur dans chaque nation ; le locataire signale les défauts et donne accès avec un préavis de 24 heures.
lease.gb.residential.safety.title=Sécurité
lease.gb.residential.safety.summary=Contrôle de sécurité gaz tous les 12 mois, contrôle électrique au moins tous les 5 ans, détecteurs de fumée et de monoxyde de carbone.
lease.gb.residential.energy-certificate.title=Certificat de performance énergétique
lease.gb.residential.energy-certificate.summary=Le bailleur fournit un certificat de performance énergétique valable ; en Angleterre et au pays de Galles, le logement doit atteindre au moins la classe E.
lease.gb.residential.registration.title=Enregistrement et licences
lease.gb.residential.registration.summary=Enregistrement du bailleur au pays de Galles, en Écosse et en Irlande du Nord et toute licence exigée par l'autorité locale.
lease.gb.residential.right-to-rent.title=Droit de louer
lease.gb.residential.right-to-rent.summary=Vérification du droit au séjour (right to rent) des occupants majeurs, applicable uniquement en Angleterre.
lease.gb.residential.statutory-information.title=Informations légales
lease.gb.residential.statutory-information.summary=La déclaration écrite, les conditions ou les informations que le bailleur doit fournir selon le droit de chaque nation, et une adresse pour les notifications.
lease.gb.residential.handover-inspection.title=Inventaire et restitution
lease.gb.residential.handover-inspection.summary=Inventaire et état des lieux au début ; restitution du logement à la fin, usure normale exceptée.
lease.gb.residential.termination.title=Fin du bail
lease.gb.residential.termination.summary=Le préavis du locataire et les motifs et avis légaux du bailleur dans chaque nation ; pas d'expulsion au titre de la section 21 en Angleterre.
lease.gb.residential.notices.title=Notifications
lease.gb.residential.notices.summary=Notifications écrites remises en main propre, par la poste ou, lorsque c'est permis, par courrier électronique.
lease.gb.residential.data-protection.title=Protection des données
lease.gb.residential.data-protection.summary=Traitement des données personnelles du locataire selon le UK GDPR et le Data Protection Act 2018.
lease.gb.residential.disputes.title=Droit applicable et litiges
lease.gb.residential.disputes.summary=Le droit et les juridictions ou tribunaux de la nation où se situe le logement.
lease.gb.commercial.parties.title=Parties
lease.gb.commercial.parties.summary=Identifie le bailleur et le preneur avec numéro d'immatriculation, siège social et numéro de TVA.
lease.gb.commercial.premises.title=Locaux loués
lease.gb.commercial.premises.summary=Décrit les locaux professionnels, leur surface et les droits accordés.
lease.gb.commercial.permitted-use.title=Destination
lease.gb.commercial.permitted-use.summary=L'usage professionnel autorisé ; le preneur obtient le permis d'urbanisme et les autres autorisations.
lease.gb.commercial.term.title=Durée
lease.gb.commercial.term.summary=Date de prise d'effet, durée déterminée ou location périodique ; inscription des baux de plus de 7 ans et taxe sur les transactions immobilières.
lease.gb.commercial.security-of-tenure.title=Droit au maintien dans les lieux
lease.gb.commercial.security-of-tenure.summary=Droits au renouvellement selon le Landlord and Tenant Act 1954 (Angleterre et pays de Galles) ou l'Order de 1996 (Irlande du Nord), leur exclusion, et la tacite reconduction (tacit relocation) en Écosse.
lease.gb.commercial.rent.title=Loyer
lease.gb.commercial.rent.summary=Le loyer, hors TVA, charges de service et prime d'assurance.
lease.gb.commercial.rent-adjustment.title=Révision du loyer
lease.gb.commercial.rent-adjustment.summary=Révision à la valeur locative de marché ou selon un indice, à la hausse ou à la baisse, avec fixation par un expert indépendant.
lease.gb.commercial.service-costs.title=Charges de service
lease.gb.commercial.service-costs.summary=Une quote-part équitable des charges de service de l'immeuble, avec budget et décompte annuel.
lease.gb.commercial.vat.title=TVA
lease.gb.commercial.vat.summary=Toutes les sommes s'entendent hors TVA ; la TVA est due si le bailleur a opté pour la taxation.
lease.gb.commercial.deposit.title=Dépôt de garantie
lease.gb.commercial.deposit.summary=Dépôt détenu sur un compte séparé rémunéré, avec des règles de reconstitution et de restitution.
lease.gb.commercial.payment.title=Paiement
lease.gb.commercial.payment.summary=Loyer payable d'avance sans compensation, intérêts de retard et procédure de recouvrement des arriérés de loyers commerciaux en Angleterre et au pays de Galles.
lease.gb.commercial.maintenance.title=Entretien et réparations
lease.gb.commercial.maintenance.summary=Obligation de réparation totale ou intérieure, limitée par un éventuel état des lieux.
lease.gb.commercial.alterations.title=Travaux
lease.gb.commercial.alterations.summary=Aucuns travaux sur la structure ; autres travaux avec accord ; remise en état à la fin du bail.
lease.gb.commercial.assignment.title=Cession et sous-location
lease.gb.commercial.assignment.summary=Cession et sous-location avec un accord qui ne peut être refusé sans motif raisonnable ; règles de libération et de garantie en Angleterre et au pays de Galles.
lease.gb.commercial.insurance.title=Assurance
lease.gb.commercial.insurance.summary=Le bailleur assure l'immeuble et récupère la prime ; le preneur assure son contenu et sa responsabilité ; suspension du loyer après un sinistre assuré.
lease.gb.commercial.energy-certificate.title=Performance énergétique
lease.gb.commercial.energy-certificate.summary=Certificat de performance énergétique des locaux ; classe E minimale pour les locaux non résidentiels en Angleterre et au pays de Galles.
lease.gb.commercial.break-option.title=Faculté de résiliation anticipée
lease.gb.commercial.break-option.summary=Faculté de mettre fin au bail de manière anticipée à une date déterminée, avec préavis et conditions.
lease.gb.commercial.handover-inspection.title=État des lieux et restitution
lease.gb.commercial.handover-inspection.summary=État des lieux, restitution des locaux libres de toute occupation et limitation des dommages-intérêts pour défaut d'entretien.
lease.gb.commercial.termination.title=Résiliation et déchéance
lease.gb.commercial.termination.summary=Résiliation (forfeiture ou irritancy) pour non-paiement, manquement ou insolvabilité, sous réserve des avis légaux et de la protection judiciaire.
lease.gb.commercial.notices.title=Notifications
lease.gb.commercial.notices.summary=Notifications écrites remises en main propre ou par envoi recommandé au siège social.
lease.gb.commercial.guarantor.title=Garant
lease.gb.commercial.guarantor.summary=Garantie des obligations du preneur par un garant.
lease.gb.commercial.data-protection.title=Protection des données
lease.gb.commercial.data-protection.summary=Traitement des données personnelles des représentants des parties selon le UK GDPR.
lease.gb.commercial.disputes.title=Droit applicable et litiges
lease.gb.commercial.disputes.summary=Le droit et les juridictions du territoire où se situent les locaux ; divisibilité des clauses.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Parties
lease.gr.residential.parties.summary=Identifie le bailleur et le locataire avec numéro fiscal et données d’identité ; les colocataires sont solidairement responsables.
lease.gr.residential.premises.title=Locaux loués
lease.gr.residential.premises.summary=Décrit le logement loué comme résidence principale du locataire, ses dépendances et le code cadastral.
lease.gr.residential.term.title=Durée
lease.gr.residential.term.summary=Durée déterminée ou indéterminée ; durée minimale légale de 3 ans pour une résidence principale, réductible seulement par accord notarié ultérieur.
lease.gr.residential.rent.title=Loyer
lease.gr.residential.rent.summary=Loyer librement convenu ; aucune dispense de loyer pour des raisons tenant au locataire.
lease.gr.residential.rent-adjustment.title=Révision du loyer
lease.gr.residential.rent-adjustment.summary=Révision librement convenue ; règle légale de 75 % de l’indice du coût de la vie pour une durée inférieure à 3 ans sans clause de révision.
lease.gr.residential.service-costs.title=Consommations et charges communes
lease.gr.residential.service-costs.summary=Consommations et charges communes d’usage à la charge du locataire ; impôts et dépenses extraordinaires de l’immeuble à la charge du bailleur.
lease.gr.residential.deposit.title=Dépôt de garantie
lease.gr.residential.deposit.summary=Dépôt facultatif, non imputable sur le loyer, restitué en fin de bail déduction faite des sommes dues.
lease.gr.residential.payment.title=Paiement
lease.gr.residential.payment.summary=Date de paiement et virement bancaire ; à compter de la date prévue, paiement sur un compte du bailleur déclaré à l’AADE.
lease.gr.residential.use.title=Usage
lease.gr.residential.use.summary=Usage soigneux comme résidence principale, règlement de l’immeuble et visites du bailleur jusqu’à 1 fois tous les 3 mois.
lease.gr.residential.subletting.title=Sous-location
lease.gr.residential.subletting.summary=Sous-location et location de courte durée seulement avec l’accord écrit du bailleur ; responsabilité pour le tiers.
lease.gr.residential.maintenance.title=Entretien et vices
lease.gr.residential.maintenance.summary=Le bailleur maintient les lieux en état de servir ; réduction du loyer pour vices, dépenses et devoir d’information du locataire.
lease.gr.residential.energy-certificate.title=Certificat de performance énergétique
lease.gr.residential.energy-certificate.summary=Certificat obligatoire présenté et remis au nouveau locataire, dont le numéro figure dans la déclaration du bail.
lease.gr.residential.registration.title=Déclaration du bail à l’AADE
lease.gr.residential.registration.summary=Déclaration électronique du bail à l’administration fiscale et acceptation par le locataire dans un délai de 30 jours.
lease.gr.residential.sale-of-premises.title=Vente des locaux
lease.gr.residential.sale-of-premises.summary=Situation du nouveau propriétaire en cas de bail à date certaine et son droit de résiliation dans les autres cas.
lease.gr.residential.handover-inspection.title=Remise et restitution
lease.gr.residential.handover-inspection.summary=État des lieux, restitution dans l’état reçu, maintien dans les lieux et délais de prescription de 6 mois.
lease.gr.residential.termination.title=Résiliation
lease.gr.residential.termination.summary=Durée minimale, congé pour les baux à durée indéterminée, résiliation pour impayés, motifs du locataire, logement familial et ordonnance d’expulsion.
lease.gr.residential.data-protection.title=Protection des données
lease.gr.residential.data-protection.summary=Traitement des données personnelles du locataire selon le RGPD et la loi 4624/2019.
lease.gr.residential.disputes.title=Droit applicable et litiges
lease.gr.residential.disputes.summary=Droit grec et tribunal du lieu de l’immeuble selon la procédure spéciale des litiges locatifs.
lease.gr.commercial.parties.title=Parties
lease.gr.commercial.parties.summary=Identifie le bailleur et le locataire avec numéro fiscal, numéro au registre du commerce et représentants légaux.
lease.gr.commercial.premises.title=Locaux loués
lease.gr.commercial.premises.summary=Décrit les locaux professionnels, leurs dépendances et leur aptitude à l’usage convenu.
lease.gr.commercial.permitted-use.title=Destination des lieux
lease.gr.commercial.permitted-use.summary=Activité du locataire, champ d’application du décret présidentiel 34/1995, autorisations et usage soigneux.
lease.gr.commercial.term.title=Durée
lease.gr.commercial.term.summary=Durée déterminée ou indéterminée ; durée minimale de 3 ans pour les baux relevant du décret présidentiel 34/1995 et aucune indemnité légale de clientèle.
lease.gr.commercial.rent.title=Loyer
lease.gr.commercial.rent.summary=Loyer fixé librement par les parties, majoré de la taxe sur le loyer.
lease.gr.commercial.rent-adjustment.title=Révision du loyer
lease.gr.commercial.rent-adjustment.summary=Révision convenue, règles légales supplétives et plafond de 3 % pour les révisions en 2026.
lease.gr.commercial.service-costs.title=Consommations et charges communes
lease.gr.commercial.service-costs.summary=Consommations et charges communes à la charge du locataire ; impôts sur les locaux à la charge du bailleur sauf convention contraire.
lease.gr.commercial.vat.title=TVA et taxe numérique sur les transactions
lease.gr.commercial.vat.summary=TVA en cas d’option, à défaut la taxe numérique sur les transactions de 3,60 %, déclarée par le bailleur ou, dans les cas prévus par la loi, par le locataire.
lease.gr.commercial.deposit.title=Dépôt de garantie
lease.gr.commercial.deposit.summary=Dépôt en espèces ou garantie bancaire facultatifs, complétés lors des révisions du loyer et restitués en fin de bail.
lease.gr.commercial.payment.title=Paiement
lease.gr.commercial.payment.summary=Date de paiement, virement bancaire et pièces fiscales ; paiement sur un compte du bailleur déclaré à l’AADE lorsque le loyer n’est pas une charge professionnelle.
lease.gr.commercial.maintenance.title=Entretien et vices
lease.gr.commercial.maintenance.summary=Le bailleur maintient les lieux en état de servir ; répartition de l’entretien courant et des réparations du gros œuvre.
lease.gr.commercial.alterations.title=Aménagements et transformations
lease.gr.commercial.alterations.summary=Travaux d’aménagement aux frais du locataire avec accord écrit ; dépenses et sort des travaux en fin de bail.
lease.gr.commercial.assignment.title=Cession et sous-location
lease.gr.commercial.assignment.summary=Cession de l’usage seulement dans les cas permis par la loi ou avec accord ; exception pour les sociétés après 3 ans et transmission en cas de maladie ou de décès.
lease.gr.commercial.insurance.title=Assurance
lease.gr.commercial.insurance.summary=Assurance de l’immeuble par le bailleur ; assurance des équipements, marchandises et responsabilité civile par le locataire.
lease.gr.commercial.energy-certificate.title=Certificat de performance énergétique
lease.gr.commercial.energy-certificate.summary=Certificat obligatoire présenté et remis au nouveau locataire, dont le numéro figure dans la déclaration du bail.
lease.gr.commercial.registration.title=Déclaration du bail à l’AADE
lease.gr.commercial.registration.summary=Déclaration électronique du bail à l’administration fiscale et acceptation par le locataire dans un délai de 30 jours.
lease.gr.commercial.sale-of-premises.title=Vente des locaux
lease.gr.commercial.sale-of-premises.summary=Situation du nouveau propriétaire en cas de bail à date certaine et son droit de résiliation dans les autres cas.
lease.gr.commercial.handover-inspection.title=Remise et restitution
lease.gr.commercial.handover-inspection.summary=État des lieux, restitution dans l’état reçu, maintien dans les lieux, délais de prescription et visites.
lease.gr.commercial.termination.title=Résiliation
lease.gr.commercial.termination.summary=Règles de congé, résiliation pour impayés, motifs du locataire et ordonnance d’expulsion ; résiliation anticipée seulement si convenue.
lease.gr.commercial.data-protection.title=Protection des données
lease.gr.commercial.data-protection.summary=Traitement des données personnelles des personnes agissant pour les parties selon le RGPD.
lease.gr.commercial.disputes.title=Droit applicable et litiges
lease.gr.commercial.disputes.summary=Droit grec, tribunal du lieu de l’immeuble et nullité des renonciations selon le décret présidentiel 34/1995.
# ===== end GR =====


# ===== IE lease clause titles and summaries (country pack) =====
lease.ie.residential.parties.title=Parties
lease.ie.residential.parties.summary=Bailleur et locataire, solidarité des colocataires, mandataire et coordonnées du bailleur.
lease.ie.residential.premises.title=Logement
lease.ie.residential.premises.summary=Le logement loué et l'application du Residential Tenancies Act 2004 aux baux conclus à compter du 1er mars 2026.
lease.ie.residential.term.title=Durée et maintien dans les lieux
lease.ie.residential.term.summary=Date de prise d'effet, durée déterminée ou périodique, bail Part 4 après 6 mois et périodes minimales de 6 ans.
lease.ie.residential.rent.title=Loyer
lease.ie.residential.rent.summary=Montant du loyer, plafond du loyer de marché et limite nationale de 2 % par an ou de la hausse du CPI si elle est inférieure.
lease.ie.residential.rent-information.title=Informations sur le loyer au début
lease.ie.residential.rent-information.summary=Loyer précédent et 3 loyers comparables, communiqués au locataire au début du bail et au RTB dans le délai de 1 mois.
lease.ie.residential.rent-adjustment.title=Révision du loyer
lease.ie.residential.rent-adjustment.summary=Révision au plus 1 fois par période de 12 mois, pas pendant les 12 premiers mois, avec un préavis de 90 jours sur le formulaire prescrit.
lease.ie.residential.service-costs.title=Fournitures et charges
lease.ie.residential.service-costs.summary=Fournitures et autres charges du locataire ; les charges de la société de gestion incombent au bailleur sauf accord contraire.
lease.ie.residential.deposit.title=Dépôt de garantie
lease.ie.residential.deposit.summary=Dépôt de garantie de 1 mois de loyer au plus, restitué promptement en fin de bail déduction faite des arriérés ou des frais de dégâts.
lease.ie.residential.payment.title=Paiement
lease.ie.residential.payment.summary=Paiement du loyer à l'échéance par virement, avance de loyer limitée à 1 mois, et carnet de loyers.
lease.ie.residential.use.title=Usage du logement
lease.ie.residential.use.summary=Usage exclusif d'habitation, pas de comportement antisocial, déclaration des occupants et animaux seulement avec accord.
lease.ie.residential.subletting.title=Cession et sous-location
lease.ie.residential.subletting.summary=Cession ou sous-location seulement avec accord écrit ; en cas de refus, le locataire peut résilier.
lease.ie.residential.maintenance.title=Réparations et entretien
lease.ie.residential.maintenance.summary=Le bailleur répare la structure et l'intérieur et respecte les normes des logements loués ; le locataire signale les défauts et donne accès.
lease.ie.residential.energy-certificate.title=Performance énergétique (BER)
lease.ie.residential.energy-certificate.summary=Certificat BER du logement mis à la disposition du locataire lorsqu'il est exigé.
lease.ie.residential.registration.title=Enregistrement auprès du RTB
lease.ie.residential.registration.summary=Enregistrement du bail auprès du RTB dans le mois suivant le début et chaque anniversaire.
lease.ie.residential.insurance.title=Assurance
lease.ie.residential.insurance.summary=Assurance de la structure par le bailleur avec couverture responsabilité d'au moins 250 000 EUR ; le locataire ne doit pas la compromettre.
lease.ie.residential.handover-inspection.title=Inventaire et restitution
lease.ie.residential.handover-inspection.summary=Inventaire signé au début et restitution du logement à la fin, compte non tenu de l'usure normale.
lease.ie.residential.termination.title=Résiliation
lease.ie.residential.termination.summary=Avis de résiliation, préavis légaux et motifs limités de fin d'un bail Part 4.
lease.ie.residential.notices.title=Notifications
lease.ie.residential.notices.summary=Notifications écrites, signification selon la loi y compris par courriel, et adresses de notification.
lease.ie.residential.data-protection.title=Protection des données
lease.ie.residential.data-protection.summary=Traitement des données personnelles conformément au RGPD et au Data Protection Act 2018.
lease.ie.residential.disputes.title=Litiges
lease.ie.residential.disputes.summary=Droit irlandais ; les litiges relevant de la loi sont soumis au RTB, les autres aux juridictions irlandaises.
lease.ie.commercial.parties.title=Parties
lease.ie.commercial.parties.summary=Bailleur et preneur avec numéro d'immatriculation, siège social, numéro de TVA et représentant.
lease.ie.commercial.premises.title=Locaux
lease.ie.commercial.premises.summary=Les locaux professionnels loués, leur surface et leurs droits ; le Residential Tenancies Act 2004 ne s'applique pas.
lease.ie.commercial.permitted-use.title=Destination
lease.ie.commercial.permitted-use.summary=Activité autorisée ; accord pour un changement de destination non refusé sans motif raisonnable ; autorisations aux risques du preneur.
lease.ie.commercial.term.title=Durée
lease.ie.commercial.term.summary=Date de prise d'effet et durée déterminée, ou location périodique prenant fin par congé.
lease.ie.commercial.renewal.title=Droit au renouvellement
lease.ie.commercial.renewal.summary=Droit légal à un nouveau bail après 5 ans d'exploitation et possibilité d'y renoncer après conseil juridique.
lease.ie.commercial.rent.title=Loyer
lease.ie.commercial.rent.summary=Montant du loyer hors TVA, charges et assurance, et éventuelle mesure d'accompagnement convenue.
lease.ie.commercial.rent-adjustment.title=Révision du loyer
lease.ie.commercial.rent-adjustment.summary=Révision à la valeur locative de marché ; pour les baux depuis le 28 février 2010, le loyer révisé peut aussi baisser.
lease.ie.commercial.service-costs.title=Charges et impositions
lease.ie.commercial.service-costs.summary=Charges au prorata avec régularisation annuelle ; le preneur paie les taxes locales (rates) et les fournitures.
lease.ie.commercial.vat.title=TVA
lease.ie.commercial.vat.summary=Les locations sont exonérées de TVA, sauf option du bailleur pour la taxation.
lease.ie.commercial.deposit.title=Dépôt de garantie
lease.ie.commercial.deposit.summary=Dépôt de garantie sans plafond légal, détenu sur un compte désigné et restitué dans les 30 jours.
lease.ie.commercial.payment.title=Paiement
lease.ie.commercial.payment.summary=Paiement du loyer sans compensation par virement, avec intérêts en cas de retard.
lease.ie.commercial.maintenance.title=Réparations
lease.ie.commercial.maintenance.summary=Obligation de réparation totale ou intérieure et limite légale des dommages-intérêts pour défaut d'entretien.
lease.ie.commercial.alterations.title=Travaux et aménagements
lease.ie.commercial.alterations.summary=Travaux seulement avec accord, non refusé sans motif raisonnable pour les améliorations, et remise en état en fin de bail.
lease.ie.commercial.assignment.title=Cession et sous-location
lease.ie.commercial.assignment.summary=Cession ou sous-location avec l'accord du bailleur, qui ne peut être refusé sans motif raisonnable.
lease.ie.commercial.insurance.title=Assurance
lease.ie.commercial.insurance.summary=Le bailleur assure l'immeuble aux frais du preneur ; le preneur assure son contenu et sa responsabilité ; suspension du loyer après sinistre.
lease.ie.commercial.energy-certificate.title=Performance énergétique (BER)
lease.ie.commercial.energy-certificate.summary=Certificat BER des locaux mis à la disposition du preneur lorsqu'il est exigé.
lease.ie.commercial.registration.title=Droit de timbre et registre des baux
lease.ie.commercial.registration.summary=Droit de timbre sur le bail et déclarations du bail, de chaque révision du loyer et du départ du preneur à la Commercial Leases Database de la PSRA.
lease.ie.commercial.break-option.title=Faculté de résiliation anticipée
lease.ie.commercial.break-option.summary=Dates de résiliation anticipée, préavis et conditions ; une résiliation par le preneur peut faire perdre le droit au renouvellement.
lease.ie.commercial.handover-inspection.title=État des lieux et restitution
lease.ie.commercial.handover-inspection.summary=État des lieux au début et restitution des locaux libres à la fin.
lease.ie.commercial.termination.title=Résiliation pour manquement et fin du bail
lease.ie.commercial.termination.summary=Reprise des lieux pour loyers impayés ou manquement, mise en demeure préalable et protection judiciaire, et autres causes de fin du bail.
lease.ie.commercial.notices.title=Notifications
lease.ie.commercial.notices.summary=Notifications écrites remises en main propre ou par lettre recommandée, et adresses de notification.
lease.ie.commercial.guarantor.title=Garant
lease.ie.commercial.guarantor.summary=Garantie des obligations du preneur par un garant en qualité de débiteur principal.
lease.ie.commercial.data-protection.title=Protection des données
lease.ie.commercial.data-protection.summary=Traitement des données personnelles des interlocuteurs et garants conformément au RGPD.
lease.ie.commercial.disputes.title=Litiges
lease.ie.commercial.disputes.summary=Droit irlandais et juridictions irlandaises ; demandes de nouveau bail devant le tribunal selon la loi de 1980.
# ===== end IE =====


# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Parties
lease.it.residential.parties.summary=Identifie le bailleur et le ou les locataires avec code fiscal et état civil ; les colocataires sont solidairement tenus ; la forme écrite est obligatoire.
lease.it.residential.premises.title=Logement
lease.it.residential.premises.summary=Décrit le logement avec les données cadastrales et les dépendances ; modèle à loyer libre (4 + 4 ans), non pour les baux à loyer convenu, transitoires ou étudiants.
lease.it.residential.term.title=Durée
lease.it.residential.term.summary=Au moins 4 ans (ou une durée plus longue convenue), renouvelés pour 4 ans sauf refus du bailleur pour les motifs légaux ; à la deuxième échéance, procédure de renouvellement par lettre recommandée au moins 6 mois avant.
lease.it.residential.rent.title=Loyer
lease.it.residential.rent.summary=Loyer convenu par les parties ; toute clause fixant un loyer supérieur à celui du contrat écrit et enregistré est nulle.
lease.it.residential.rent-adjustment.title=Révision du loyer
lease.it.residential.rent-adjustment.summary=Révision annuelle facultative d'une part convenue de la variation de l'indice ISTAT ; suspendue si le bailleur opte pour la cedolare secca.
lease.it.residential.service-costs.title=Charges
lease.it.residential.service-costs.summary=Répartition légale des charges à la charge du locataire sauf convention contraire ; paiement dans les 2 mois de la demande, avec droit au décompte et aux justificatifs.
lease.it.residential.deposit.title=Dépôt de garantie
lease.it.residential.deposit.summary=Dépôt facultatif d'au plus 3 mois de loyer, productif d'intérêts légaux versés chaque année ; restitué à la fin déduction faite des sommes dues.
lease.it.residential.payment.title=Paiement
lease.it.residential.payment.summary=Paiement périodique par virement au jour convenu ; sous réserve du délai de régularisation judiciaire de l'article 55, le loyer impayé 20 jours après l'échéance est un motif de résiliation.
lease.it.residential.use.title=Usage
lease.it.residential.use.summary=Usage exclusif d'habitation avec diligence ; le bailleur peut demander la résiliation dans les 3 mois de la connaissance d'un changement d'usage.
lease.it.residential.subletting.title=Sous-location
lease.it.residential.subletting.summary=Ni sous-location totale ni cession sans accord ; sous-location partielle permise après lettre recommandée, sauf convention contraire.
lease.it.residential.maintenance.title=Entretien et réparations
lease.it.residential.maintenance.summary=Le bailleur exécute les réparations nécessaires, le locataire le menu entretien ; réparations urgentes, réduction du loyer pour travaux prolongés ; l'occupant est responsable de l'installation de chauffage.
lease.it.residential.energy-certificate.title=Certificat de performance énergétique
lease.it.residential.energy-certificate.summary=Le locataire déclare avoir reçu les informations et documents relatifs à l'APE ; code et classe du certificat ; amendes légales en cas d'omission.
lease.it.residential.registration.title=Enregistrement et impôts
lease.it.residential.registration.summary=Le bailleur enregistre le bail dans les 30 jours et en informe le locataire et le syndic ; frais partagés par moitié ; cedolare secca facultative.
lease.it.residential.succession.title=Transmission du bail
lease.it.residential.succession.summary=Le conjoint, les héritiers, les proches et les partenaires cohabitants peuvent succéder au décès du locataire ; règles en cas de séparation et de divorce.
lease.it.residential.handover-inspection.title=Remise des clés et restitution
lease.it.residential.handover-inspection.summary=Procès-verbal de remise au début ; restitution dans le même état sauf usure normale ; indemnité convenue due jusqu'à la restitution en cas de retard.
lease.it.residential.termination.title=Résiliation et refus de renouvellement
lease.it.residential.termination.summary=Le locataire peut se retirer pour motifs graves avec un préavis de 6 mois ; le bailleur ne peut refuser le renouvellement à la première échéance que pour les motifs légaux.
lease.it.residential.notices.title=Notifications
lease.it.residential.notices.summary=Lettre recommandée lorsque la loi l'exige ; adresses et adresses de courrier électronique certifié pour les notifications.
lease.it.residential.guarantor.title=Caution
lease.it.residential.guarantor.summary=Cautionnement facultatif jusqu'à un montant maximal, solidaire ; extension au-delà de la première échéance seulement si convenue.
lease.it.residential.data-protection.title=Protection des données
lease.it.residential.data-protection.summary=Données personnelles traitées uniquement pour le bail et les obligations légales, selon le RGPD et le code italien de la protection des données.
lease.it.residential.disputes.title=Litiges
lease.it.residential.disputes.summary=Droit italien ; tribunal du lieu du bien ; médiation obligatoire avant la plupart des actions en matière de bail.
lease.it.commercial.parties.title=Parties
lease.it.commercial.parties.summary=Identifie le bailleur et le preneur avec les données de la société, code fiscal, numéro de TVA, immatriculation au registre des entreprises et représentant légal.
lease.it.commercial.premises.title=Locaux
lease.it.commercial.premises.summary=Décrit les locaux avec les données cadastrales et la destination déclarée ; non pour les logements ni les baux saisonniers.
lease.it.commercial.permitted-use.title=Destination
lease.it.commercial.permitted-use.summary=Activité exercée et indication d'un contact direct avec le public ; autorisations à la charge du preneur ; règles en cas de changement d'usage.
lease.it.commercial.term.title=Durée et renouvellement
lease.it.commercial.term.summary=Au moins 6 ans (9 pour les hôtels et théâtres) avec renouvellement tacite ; refus du bailleur seulement à la première échéance pour les motifs légaux, 12 ou 18 mois avant.
lease.it.commercial.rent.title=Loyer
lease.it.commercial.rent.summary=Loyer convenu par les parties ; les clauses accordant au bailleur des avantages contraires à la loi 392/1978 sont nulles.
lease.it.commercial.rent-adjustment.title=Révision du loyer
lease.it.commercial.rent-adjustment.summary=Révision annuelle facultative à la demande du bailleur ; hausses limitées à 75% de la variation de l'indice ISTAT pour les baux ne dépassant pas la durée légale.
lease.it.commercial.service-costs.title=Charges
lease.it.commercial.service-costs.summary=Répartition légale des charges sauf convention contraire ; paiement dans les 2 mois de la demande, avec droit au décompte et aux justificatifs.
lease.it.commercial.vat.title=TVA
lease.it.commercial.vat.summary=Location exonérée de TVA sauf option du bailleur pour la taxation des locaux professionnels ; option et taux indiqués.
lease.it.commercial.deposit.title=Dépôt de garantie
lease.it.commercial.deposit.summary=Dépôt facultatif d'au plus 3 mois de loyer, productif d'intérêts légaux versés chaque année ; restitué à la fin déduction faite des sommes dues.
lease.it.commercial.payment.title=Paiement
lease.it.commercial.payment.summary=Paiement périodique par virement au jour convenu ; quittance ou facture ; résiliation seulement pour un manquement qui n'est pas de faible importance.
lease.it.commercial.maintenance.title=Entretien et réparations
lease.it.commercial.maintenance.summary=Le bailleur exécute les réparations nécessaires, le preneur le menu entretien sauf convention contraire ; réparations urgentes, réduction du loyer pour travaux prolongés.
lease.it.commercial.alterations.title=Travaux et aménagements
lease.it.commercial.alterations.summary=Travaux uniquement avec l'accord écrit du bailleur ; règles légales sur l'indemnité pour améliorations et l'enlèvement des adjonctions.
lease.it.commercial.assignment.title=Sous-location et cession
lease.it.commercial.assignment.summary=Sous-location ou cession sans accord avec le fonds de commerce, sous réserve de l'opposition du bailleur pour motifs graves dans les 30 jours ; sinon accord requis.
lease.it.commercial.pre-emption.title=Droit de préemption
lease.it.commercial.pre-emption.summary=Droit de préemption et de rachat du preneur en cas de vente et de nouvelle location, sauf locaux sans contact avec le public et autres cas exclus.
lease.it.commercial.goodwill-compensation.title=Indemnité pour perte de clientèle
lease.it.commercial.goodwill-compensation.summary=18 mois de loyer (21 pour les hôtels) lorsque le bail prend fin autrement que par manquement, congé, retrait ou procédure collective du preneur ; non pour les locaux sans contact avec le public et autres cas exclus.
lease.it.commercial.insurance.title=Assurance
lease.it.commercial.insurance.summary=Le preneur répond de la perte et des dommages d'incendie sauf cause non imputable ; assurance responsabilité du preneur et assurance de l'immeuble par le bailleur.
lease.it.commercial.energy-certificate.title=Certificat de performance énergétique
lease.it.commercial.energy-certificate.summary=Le preneur déclare avoir reçu les informations et documents relatifs à l'APE, avec copie annexée si requis ; amendes légales en cas d'omission.
lease.it.commercial.registration.title=Enregistrement et impôts
lease.it.commercial.registration.summary=Enregistrement dans les 30 jours, frais partagés par moitié ; droit d'enregistrement de 1% ou 2% ; la cedolare secca ne s'applique pas.
lease.it.commercial.handover-inspection.title=Remise des clés et restitution
lease.it.commercial.handover-inspection.summary=Procès-verbal de remise au début ; restitution dans le même état sauf usure normale ; indemnité convenue due jusqu'à la restitution en cas de retard.
lease.it.commercial.termination.title=Résiliation
lease.it.commercial.termination.summary=Le preneur peut se retirer pour motifs graves avec un préavis de 6 mois et, si convenu, à tout moment avec le même préavis ; refus du bailleur seulement à la première échéance ; résiliation pour manquement.
lease.it.commercial.notices.title=Notifications
lease.it.commercial.notices.summary=Lettre recommandée ou signification par huissier lorsque la loi l'exige ; adresses et courrier électronique certifié.
lease.it.commercial.guarantor.title=Garantie
lease.it.commercial.guarantor.summary=Garantie personnelle, bancaire ou d'assurance facultative jusqu'à un montant maximal ; extension au-delà de la première échéance seulement si convenue.
lease.it.commercial.data-protection.title=Protection des données
lease.it.commercial.data-protection.summary=Données personnelles des personnes agissant pour les parties traitées uniquement pour le bail, selon le RGPD et le code italien de la protection des données.
lease.it.commercial.disputes.title=Litiges
lease.it.commercial.disputes.summary=Droit italien ; tribunal du lieu du bien ; médiation obligatoire avant la plupart des actions en matière de bail.
# ===== end IT =====


