lease.rentComponent.UTILITIES_ADVANCE=Provision pour charges
lease.rentComponent.SERVICE_COSTS=Frais de service
lease.rentComponent.HOA_FEES=Charges de copropriété
lease.rentComponent.FURNITURE_RENTAL=Location de mobilier
lease.rentComponent.PARKING=Stationnement
lease.rentComponent.STORAGE=Stockage
lease.rentComponent.GARBAGE_COLLECTION=Collecte des déchets
