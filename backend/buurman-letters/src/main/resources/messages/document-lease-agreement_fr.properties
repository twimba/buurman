lease.nl.residential.disputes.title=Litiges
lease.nl.residential.disputes.summary=Le droit néerlandais s'applique ; litiges devant la commission des loyers ou le juge.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Parties
lease.de.residential.parties.summary=Identifie le bailleur et le ou les locataires ; les colocataires sont tenus solidairement.
lease.de.residential.premises.title=Locaux loués
lease.de.residential.premises.summary=Décrit le logement loué et soumet le bail au droit allemand du bail d'habitation (BGB).
lease.de.residential.term.title=Durée
lease.de.residential.term.summary=Date de prise d'effet ; durée indéterminée, ou déterminée seulement pour un motif légal indiqué par écrit.
lease.de.residential.rent.title=Loyer
lease.de.residential.rent.summary=Le loyer hors charges et le plafonnement du loyer initial dans les zones tendues.
lease.de.residential.rent-adjustment.title=Augmentation du loyer
lease.de.residential.rent-adjustment.summary=Augmentations légales jusqu'au loyer de référence local, dans la limite du plafond.
lease.de.residential.service-costs.title=Charges
lease.de.residential.service-costs.summary=Provisions sur charges avec un décompte annuel dans le délai légal.
lease.de.residential.deposit.title=Dépôt de garantie
lease.de.residential.deposit.summary=Dépôt de garantie d'au plus 3 mois de loyer hors charges, payable par fractions et placé séparément.
lease.de.residential.payment.title=Paiement
lease.de.residential.payment.summary=Le loyer est payé d'avance, au plus tard le 3e jour ouvrable de chaque période.
lease.de.residential.use.title=Usage
lease.de.residential.use.summary=Usage d'habitation uniquement, usage soigneux, et travaux seulement avec l'accord du bailleur.
lease.de.residential.subletting.title=Sous-location
lease.de.residential.subletting.summary=Usage par des tiers seulement avec autorisation ; droit légal du locataire de sous-louer une partie du logement.
lease.de.residential.maintenance.title=Entretien et défauts
lease.de.residential.maintenance.summary=Le bailleur entretient le logement ; réduction de loyer en cas de défaut ; pas de travaux de rafraîchissement à charge du locataire.
lease.de.residential.minor-repairs.title=Menues réparations
lease.de.residential.minor-repairs.summary=Le locataire supporte le coût des menues réparations jusqu'à un montant par intervention et par an à compléter.
lease.de.residential.energy-certificate.title=Certificat de performance énergétique
lease.de.residential.energy-certificate.summary=Le bailleur présente et remet le certificat de performance énergétique (GModG).
lease.de.residential.registration.title=Attestation d'emménagement
lease.de.residential.registration.summary=Le bailleur atteste l'emménagement afin que le locataire puisse se déclarer auprès de l'administration.
lease.de.residential.handover-inspection.title=Remise et restitution
lease.de.residential.handover-inspection.summary=États des lieux d'entrée et de sortie, restitution du logement et prescription de 6 mois.
lease.de.residential.termination.title=Résiliation
lease.de.residential.termination.summary=Congé écrit, délais de préavis légaux et intérêt légitime requis du bailleur.
lease.de.residential.data-protection.title=Protection des données
lease.de.residential.data-protection.summary=Traitement des données personnelles du locataire conformément au RGPD.
lease.de.residential.disputes.title=Litiges
lease.de.residential.disputes.summary=Le droit allemand s'applique ; le tribunal local (Amtsgericht) du lieu du logement est seul compétent.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Parties
lease.de.commercial.parties.summary=Identifie le bailleur et le preneur avec numéro d'immatriculation, numéro de TVA et représentants.
lease.de.commercial.premises.title=Locaux loués
lease.de.commercial.premises.summary=Décrit les locaux professionnels et applique les règles du BGB sur le bail de locaux professionnels.
lease.de.commercial.permitted-use.title=Destination
lease.de.commercial.permitted-use.summary=L'activité convenue ; tout changement requiert l'accord du bailleur ; le preneur obtient les autorisations.
lease.de.commercial.term.title=Durée
lease.de.commercial.term.summary=Durée déterminée ou indéterminée ; au-delà de 1 an, forme textuelle requise, sinon durée indéterminée.
lease.de.commercial.rent.title=Loyer
lease.de.commercial.rent.summary=Le loyer hors charges librement convenu, plus la TVA et les provisions si convenu.
lease.de.commercial.rent-adjustment.title=Indexation
lease.de.commercial.rent-adjustment.summary=Clause d'indexation sur l'indice des prix à la consommation, admise seulement pour les baux de longue durée (PrKG).
lease.de.commercial.service-costs.title=Charges
lease.de.commercial.service-costs.summary=Charges selon la BetrKV et postes supplémentaires énumérés, avec provisions et décompte annuel.
lease.de.commercial.vat.title=Option pour la TVA
lease.de.commercial.vat.summary=Le bailleur opte pour la TVA sur le loyer ; le preneur affecte les locaux à des opérations ouvrant droit à déduction.
lease.de.commercial.deposit.title=Garantie locative
lease.de.commercial.deposit.summary=Dépôt en espèces ou garantie bancaire, sans plafond légal pour les locaux professionnels.
lease.de.commercial.payment.title=Paiement
lease.de.commercial.payment.summary=Loyer payable d'avance au plus tard le 3e jour ouvrable ; limitation de la compensation et intérêts de retard commerciaux.
lease.de.commercial.maintenance.title=Entretien et réparations
lease.de.commercial.maintenance.summary=Le bailleur entretient le gros oeuvre et les parties communes ; le preneur entretient l'intérieur.
lease.de.commercial.alterations.title=Travaux et aménagements
lease.de.commercial.alterations.summary=Travaux et enseignes du preneur seulement avec accord sous forme textuelle ; enlèvement en fin de bail.
lease.de.commercial.subletting.title=Sous-location
lease.de.commercial.subletting.summary=Usage par des tiers seulement avec autorisation ; droit de résiliation spécial en cas de refus.
lease.de.commercial.competition.title=Protection contre la concurrence
lease.de.commercial.competition.summary=Le bailleur ne loue pas à un concurrent ayant le même assortiment principal.
lease.de.commercial.insurance.title=Assurances
lease.de.commercial.insurance.summary=Le bailleur assure l'immeuble ; le preneur assure ses biens et souscrit une responsabilité civile professionnelle.
lease.de.commercial.energy-certificate.title=Certificat de performance énergétique
lease.de.commercial.energy-certificate.summary=Le bailleur présente et remet le certificat de performance énergétique (GModG).
lease.de.commercial.handover-inspection.title=Remise et restitution
lease.de.commercial.handover-inspection.summary=États des lieux d'entrée et de sortie, restitution des locaux libérés et prescription de 6 mois.
lease.de.commercial.termination.title=Résiliation
lease.de.commercial.termination.summary=Congé au plus tard le 3e jour ouvrable d'un trimestre pour la fin du trimestre suivant ; résiliation extraordinaire.
lease.de.commercial.data-protection.title=Protection des données
lease.de.commercial.data-protection.summary=Traitement des données personnelles des représentants et interlocuteurs conformément au RGPD.
lease.de.commercial.disputes.title=Litiges
lease.de.commercial.disputes.summary=Le droit allemand s'applique ; le tribunal du lieu de situation des locaux est seul compétent.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Parties
lease.fr.residential.parties.summary=Identifie le bailleur et le ou les locataires ; solidarité des colocataires dans les limites légales.
lease.fr.residential.premises.title=Désignation du logement
lease.fr.residential.premises.summary=Décrit le logement nu loué à titre de résidence principale selon la loi du 6 juillet 1989 et le contrat type.
lease.fr.residential.term.title=Durée
lease.fr.residential.term.summary=Date de prise d'effet, durée minimale de 3 ou 6 ans selon le bailleur et reconduction tacite.
lease.fr.residential.rent.title=Loyer
lease.fr.residential.rent.summary=Le loyer hors charges et les plafonds applicables en zone tendue et en zone d'encadrement des loyers.
