lease.ch.commercial.parties.title=Parties
lease.ch.commercial.parties.summary=Identifie le bailleur et le locataire avec numéro IDE, numéro TVA et représentants ; responsabilité solidaire.
lease.ch.commercial.premises.title=Objet loué
lease.ch.commercial.premises.summary=Décrit les locaux commerciaux et leurs annexes ; la protection contre les loyers abusifs et contre les congés s'applique aussi.
lease.ch.commercial.permitted-use.title=Destination
lease.ch.commercial.permitted-use.summary=Destination commerciale convenue, changements uniquement avec consentement écrit, répartition des autorisations administratives.
lease.ch.commercial.term.title=Durée
lease.ch.commercial.term.summary=Début du bail ; bail de durée indéterminée ou de durée déterminée prenant fin sans congé, et option de prolongation éventuelle du locataire.
lease.ch.commercial.rent.title=Loyer
lease.ch.commercial.rent.summary=Loyer net et ses bases, contestation du loyer initial dans les 30 jours et éventuelle formule officielle cantonale.
