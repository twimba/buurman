lease.be.commercial.term.title=Durée
lease.be.commercial.term.summary=Au moins 9 ans ; le preneur peut mettre fin au bail à chaque triennat avec un préavis de 6 mois, le bailleur seulement si cela est stipulé.
lease.be.commercial.rent.title=Loyer
lease.be.commercial.rent.summary=Loyer hors frais, charges et impôts, fixé librement.
lease.be.commercial.rent-adjustment.title=Indexation et révision
lease.be.commercial.rent-adjustment.summary=Indexation convenue sur la base de l'indice santé 1 fois par an et révision judiciaire à chaque triennat en cas d'écart d'au moins 15 %.
lease.be.commercial.service-costs.title=Frais et charges
lease.be.commercial.service-costs.summary=Liste limitative des frais, charges et impôts à charge du preneur, faisant l'objet d'un décompte au moins annuel.
lease.be.commercial.vat.title=TVA
lease.be.commercial.vat.summary=Location en principe exemptée de TVA, avec possibilité d'une location de bâtiments professionnels soumise à la TVA.
lease.be.commercial.deposit.title=Garantie locative
lease.be.commercial.deposit.summary=Garantie locative du montant et sous la forme convenus ; pas de plafond légal pour le bail commercial.
lease.be.commercial.payment.title=Paiement
lease.be.commercial.payment.summary=Paiement par terme par virement au jour convenu ; intérêts au taux légal après mise en demeure.
lease.be.commercial.maintenance.title=Entretien et réparations
lease.be.commercial.maintenance.summary=Réparations à charge du bailleur et réparations locatives selon l'ancien Code civil, sauf convention contraire.
lease.be.commercial.alterations.title=Transformations
lease.be.commercial.alterations.summary=Droit du preneur aux transformations jusqu'à 3 années de loyer après avis, opposition du bailleur dans les 30 jours et sort à la fin du bail.
lease.be.commercial.assignment.title=Cession et sous-location
lease.be.commercial.assignment.summary=Accord requis, sauf cession ou sous-location avec le fonds de commerce, sous réserve de l'opposition du bailleur dans les 30 jours.
lease.be.commercial.insurance.title=Assurance
lease.be.commercial.insurance.summary=Le preneur assure sa responsabilité et le contenu, le bailleur assure le bâtiment.
lease.be.commercial.energy-certificate.title=Certificat de performance énergétique
lease.be.commercial.energy-certificate.summary=Certificat de performance énergétique lorsque les règles régionales l'exigent, avec numéro, date et classe.
lease.be.commercial.registration.title=Enregistrement
lease.be.commercial.registration.summary=Enregistrement selon la législation fiscale, qui confère date certaine au bail ; partie qui supporte les droits.
lease.be.commercial.handover-inspection.title=État des lieux
lease.be.commercial.handover-inspection.summary=État des lieux détaillé et contradictoire, annexé et enregistré ; restitution du bien dans l'état reçu.
lease.be.commercial.renewal.title=Renouvellement
lease.be.commercial.renewal.summary=Droit à 3 renouvellements de 9 ans, demande 18 à 15 mois avant l'expiration, motifs de refus et indemnité d'éviction.
lease.be.commercial.transfer.title=Aliénation du bien
lease.be.commercial.transfer.summary=L'acquéreur ne peut expulser le preneur que pour des motifs légaux, moyennant un congé de 1 an donné dans les 3 mois.
lease.be.commercial.termination.title=Fin du bail
lease.be.commercial.termination.summary=Fin à l'expiration d'un triennat, bail à durée indéterminée après déchéance du droit au renouvellement, résolution judiciaire pour manquement.
lease.be.commercial.data-protection.title=Protection des données
lease.be.commercial.data-protection.summary=Traitement des données personnelles des parties et de leurs représentants selon le RGPD.
lease.be.commercial.disputes.title=Litiges
lease.be.commercial.disputes.summary=Droit belge et juge de paix du lieu du bien ; conciliation préalable possible.
# ===== end BE =====


