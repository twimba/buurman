# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Parties
lease.at.residential.parties.summary=Identifie le bailleur et le ou les locataires, tenus solidairement ; le bailleur indique s'il est professionnel.
lease.at.residential.premises.title=Locaux loués
lease.at.residential.premises.summary=Décrit le logement et indique le régime MRG applicable : application intégrale, application partielle ou exclusion totale.
lease.at.residential.term.title=Durée
lease.at.residential.term.summary=Durée indéterminée ou déterminée ; sous la MRG, par écrit et pour au moins 5 ans (3 ans si le bailleur n'est pas professionnel).
lease.at.residential.rent.title=Loyer
lease.at.residential.rent.summary=Le loyer principal et, en application intégrale de la MRG, les plafonds légaux (valeur de référence, montants par catégorie).
lease.at.residential.rent-adjustment.title=Indexation
lease.at.residential.rent-adjustment.summary=Indexation annuelle au 1er avril selon la MieWeG ; l'inflation au-delà de 3 pour cent ne compte que pour moitié.
lease.at.residential.service-costs.title=Charges
lease.at.residential.service-costs.summary=Quote-part des charges d'exploitation et taxes publiques par acomptes mensuels ; décompte au 30 juin en application intégrale de la MRG.
lease.at.residential.deposit.title=Dépôt de garantie
lease.at.residential.deposit.summary=Dépôt sans plafond légal, placé sur un livret d'épargne et restitué avec les intérêts sans délai.
lease.at.residential.payment.title=Paiement
lease.at.residential.payment.summary=Loyer payable mensuellement d'avance au plus tard le 5 ; intérêts légaux de retard de 4 pour cent par an.
lease.at.residential.use.title=Usage
lease.at.residential.use.summary=Usage exclusif d'habitation, accès pour motifs importants et procédure de notification des modifications substantielles.
lease.at.residential.subletting.title=Sous-location
lease.at.residential.subletting.summary=Sous-location uniquement avec accord ; en application intégrale de la MRG, refus seulement pour motif important.
lease.at.residential.maintenance.title=Entretien et défauts
lease.at.residential.maintenance.summary=Le bailleur maintient le logement en état d'usage ; exonération du loyer en cas d'inaptitude ; le locataire signale les défauts sans délai.
lease.at.residential.energy-certificate.title=Certificat de performance énergétique
lease.at.residential.energy-certificate.summary=Le bailleur présente et remet le certificat de performance énergétique (EAVG 2012).
lease.at.residential.registration.title=Déclaration de domicile
lease.at.residential.registration.summary=Le locataire se déclare auprès de l'autorité compétente dans les 3 jours suivant son emménagement.
lease.at.residential.handover-inspection.title=Remise et restitution
lease.at.residential.handover-inspection.summary=États des lieux d'entrée et de sortie, restitution dans l'état reçu et délais des réclamations.
lease.at.residential.termination.title=Résiliation
lease.at.residential.termination.summary=Sous la MRG, le bailleur ne donne congé qu'en justice et pour motif important ; délais de préavis et résiliation anticipée.
lease.at.residential.data-protection.title=Protection des données
lease.at.residential.data-protection.summary=Traitement des données personnelles du locataire conformément au RGPD.
lease.at.residential.disputes.title=Litiges et dispositions finales
lease.at.residential.disputes.summary=Droit autrichien ; tribunal de district du lieu du logement ; les baux d'habitation sont exonérés du droit de bail.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Parties
lease.at.commercial.parties.summary=Identifie le bailleur et le preneur avec numéro au registre des sociétés, numéro de TVA et représentants.
lease.at.commercial.premises.title=Locaux loués
lease.at.commercial.premises.summary=Décrit les locaux commerciaux et indique le régime MRG applicable.
lease.at.commercial.permitted-use.title=Destination
lease.at.commercial.permitted-use.summary=L'activité convenue ; changement uniquement avec accord ; le défaut d'exploitation peut justifier un congé.
lease.at.commercial.term.title=Durée
lease.at.commercial.term.summary=Durée déterminée ou indéterminée ; sous la MRG, une durée déterminée exige une clause d'expiration écrite.
lease.at.commercial.rent.title=Loyer
lease.at.commercial.rent.summary=Le loyer principal ; en application intégrale de la MRG, plafonné au montant approprié, que le preneur professionnel ne peut invoquer que s'il a contesté à temps.
lease.at.commercial.rent-adjustment.title=Indexation
lease.at.commercial.rent-adjustment.summary=Indexation sur l'indice des prix à la consommation 2020 avec un seuil à compléter, à la hausse comme à la baisse.
lease.at.commercial.service-costs.title=Charges
lease.at.commercial.service-costs.summary=Quote-part des charges d'exploitation et taxes publiques par acomptes mensuels avec décompte annuel.
lease.at.commercial.vat.title=Option TVA
lease.at.commercial.vat.summary=Le bailleur opte pour la TVA sur le loyer ; le preneur utilise les locaux presque exclusivement pour des activités taxables.
lease.at.commercial.deposit.title=Dépôt de garantie
lease.at.commercial.deposit.summary=Dépôt en espèces ou garantie bancaire sans plafond légal, restitué après la fin du bail.
lease.at.commercial.payment.title=Paiement
lease.at.commercial.payment.summary=Loyer payable mensuellement d'avance ; intérêts de retard entre professionnels de 9,2 points au-dessus du taux de base.
lease.at.commercial.maintenance.title=Entretien
lease.at.commercial.maintenance.summary=En application intégrale de la MRG, le § 3 MRG s'applique ; sinon le bailleur entretient le gros oeuvre et les parties communes, le preneur l'intérieur.
lease.at.commercial.alterations.title=Travaux et aménagements
lease.at.commercial.alterations.summary=Travaux et enseignes uniquement avec accord écrit ; enlèvement en fin de bail.
lease.at.commercial.subletting.title=Sous-location et cession du fonds
lease.at.commercial.subletting.summary=Sous-location soumise à accord ; droits légaux en cas de cession ou de location-gérance du fonds en application intégrale de la MRG.
lease.at.commercial.insurance.title=Assurances
lease.at.commercial.insurance.summary=Le bailleur assure l'immeuble ; le preneur ses aménagements et sa responsabilité civile professionnelle.
lease.at.commercial.energy-certificate.title=Certificat de performance énergétique
lease.at.commercial.energy-certificate.summary=Le bailleur présente et remet le certificat de performance énergétique (EAVG 2012).
lease.at.commercial.contract-fee.title=Droit de bail
lease.at.commercial.contract-fee.summary=Droit de 1 pour cent de la valeur du bail selon la loi sur les droits (GebG), calculé par le bailleur et supporté par le preneur.
lease.at.commercial.handover-inspection.title=Remise et restitution
lease.at.commercial.handover-inspection.summary=États des lieux d'entrée et de sortie, restitution des locaux libérés et délais des réclamations.
lease.at.commercial.termination.title=Résiliation
lease.at.commercial.termination.summary=Congé pour la fin d'un trimestre civil avec 3 mois de préavis ; limites du congé donné par le bailleur sous la MRG.
lease.at.commercial.data-protection.title=Protection des données
lease.at.commercial.data-protection.summary=Traitement des données personnelles des représentants et interlocuteurs conformément au RGPD.
lease.at.commercial.disputes.title=Litiges
lease.at.commercial.disputes.summary=Droit autrichien ; compétence du tribunal de district du lieu des locaux.
# ===== end AT =====


