# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Parties
lease.gb.residential.parties.summary=Identifie le bailleur et le ou les locataires ; les colocataires sont solidairement responsables ; au pays de Galles, le locataire est le contract-holder.
lease.gb.residential.premises.title=Locaux loués
lease.gb.residential.premises.summary=Décrit le logement loué et le régime de la nation : assured tenancy (Angleterre), standard occupation contract (pays de Galles), private residential tenancy (Écosse) ou private tenancy (Irlande du Nord).
lease.gb.residential.term.title=Durée
lease.gb.residential.term.summary=Date de prise d'effet ; location périodique sans durée déterminée en Angleterre et en Écosse, périodique ou à durée déterminée au pays de Galles et en Irlande du Nord.
lease.gb.residential.rent.title=Loyer
lease.gb.residential.rent.summary=Le loyer et la période de loyer ; en Angleterre, la période de loyer ne peut excéder 1 mois.
lease.gb.residential.rent-adjustment.title=Augmentations de loyer
lease.gb.residential.rent-adjustment.summary=Augmentation uniquement dans les cas prévus par la loi : en Angleterre par avis au titre de la section 13 ou décision du tribunal ; 2 mois en Angleterre et au pays de Galles, 3 mois en Écosse et en Irlande du Nord, au plus 1 augmentation par an.
lease.gb.residential.service-costs.title=Fournitures et taxe locale
lease.gb.residential.service-costs.summary=Fournitures et council tax ou domestic rates à la charge du locataire, et les éventuels frais payables au bailleur.
lease.gb.residential.deposit.title=Dépôt de garantie
lease.gb.residential.deposit.summary=Dépôt protégé dans un dispositif agréé ; plafonné à 5 ou 6 semaines de loyer en Angleterre, 2 mois de loyer en Écosse et 1 mois de loyer en Irlande du Nord.
lease.gb.residential.payment.title=Paiement
lease.gb.residential.payment.summary=Date et mode de paiement ; en Angleterre, aucun loyer avant la période de loyer et intérêts de retard plafonnés à 3 % au-dessus du taux de base.
lease.gb.residential.fees.title=Frais et paiements autorisés
lease.gb.residential.fees.summary=Seuls les paiements autorisés peuvent être exigés : Tenant Fees Act 2019 en Angleterre, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 au pays de Galles.
lease.gb.residential.use.title=Usage et animaux
lease.gb.residential.use.summary=Usage d'habitation sans comportement antisocial ; animaux avec l'accord du bailleur, qui ne peut être refusé sans motif raisonnable.
lease.gb.residential.subletting.title=Sous-location et cession
lease.gb.residential.subletting.summary=Cession, sous-location et hébergement d'un pensionnaire uniquement avec l'accord du bailleur.
lease.gb.residential.maintenance.title=Réparations et habitabilité
lease.gb.residential.maintenance.summary=Les obligations légales de réparation et d'habitabilité du bailleur dans chaque nation ; le locataire signale les défauts et donne accès avec un préavis de 24 heures.
lease.gb.residential.safety.title=Sécurité
lease.gb.residential.safety.summary=Contrôle de sécurité gaz tous les 12 mois, contrôle électrique au moins tous les 5 ans, détecteurs de fumée et de monoxyde de carbone.
lease.gb.residential.energy-certificate.title=Certificat de performance énergétique
lease.gb.residential.energy-certificate.summary=Le bailleur fournit un certificat de performance énergétique valable ; en Angleterre et au pays de Galles, le logement doit atteindre au moins la classe E.
lease.gb.residential.registration.title=Enregistrement et licences
lease.gb.residential.registration.summary=Enregistrement du bailleur au pays de Galles, en Écosse et en Irlande du Nord et toute licence exigée par l'autorité locale.
lease.gb.residential.right-to-rent.title=Droit de louer
lease.gb.residential.right-to-rent.summary=Vérification du droit au séjour (right to rent) des occupants majeurs, applicable uniquement en Angleterre.
lease.gb.residential.statutory-information.title=Informations légales
lease.gb.residential.statutory-information.summary=La déclaration écrite, les conditions ou les informations que le bailleur doit fournir selon le droit de chaque nation, et une adresse pour les notifications.
lease.gb.residential.handover-inspection.title=Inventaire et restitution
lease.gb.residential.handover-inspection.summary=Inventaire et état des lieux au début ; restitution du logement à la fin, usure normale exceptée.
lease.gb.residential.termination.title=Fin du bail
lease.gb.residential.termination.summary=Le préavis du locataire et les motifs et avis légaux du bailleur dans chaque nation ; pas d'expulsion au titre de la section 21 en Angleterre.
lease.gb.residential.notices.title=Notifications
lease.gb.residential.notices.summary=Notifications écrites remises en main propre, par la poste ou, lorsque c'est permis, par courrier électronique.
lease.gb.residential.data-protection.title=Protection des données
lease.gb.residential.data-protection.summary=Traitement des données personnelles du locataire selon le UK GDPR et le Data Protection Act 2018.
lease.gb.residential.disputes.title=Droit applicable et litiges
lease.gb.residential.disputes.summary=Le droit et les juridictions ou tribunaux de la nation où se situe le logement.
lease.gb.commercial.parties.title=Parties
lease.gb.commercial.parties.summary=Identifie le bailleur et le preneur avec numéro d'immatriculation, siège social et numéro de TVA.
lease.gb.commercial.premises.title=Locaux loués
lease.gb.commercial.premises.summary=Décrit les locaux professionnels, leur surface et les droits accordés.
lease.gb.commercial.permitted-use.title=Destination
lease.gb.commercial.permitted-use.summary=L'usage professionnel autorisé ; le preneur obtient le permis d'urbanisme et les autres autorisations.
lease.gb.commercial.term.title=Durée
lease.gb.commercial.term.summary=Date de prise d'effet, durée déterminée ou location périodique ; inscription des baux de plus de 7 ans et taxe sur les transactions immobilières.
lease.gb.commercial.security-of-tenure.title=Droit au maintien dans les lieux
lease.gb.commercial.security-of-tenure.summary=Droits au renouvellement selon le Landlord and Tenant Act 1954 (Angleterre et pays de Galles) ou l'Order de 1996 (Irlande du Nord), leur exclusion, et la tacite reconduction (tacit relocation) en Écosse.
lease.gb.commercial.rent.title=Loyer
lease.gb.commercial.rent.summary=Le loyer, hors TVA, charges de service et prime d'assurance.
lease.gb.commercial.rent-adjustment.title=Révision du loyer
lease.gb.commercial.rent-adjustment.summary=Révision à la valeur locative de marché ou selon un indice, à la hausse ou à la baisse, avec fixation par un expert indépendant.
lease.gb.commercial.service-costs.title=Charges de service
lease.gb.commercial.service-costs.summary=Une quote-part équitable des charges de service de l'immeuble, avec budget et décompte annuel.
lease.gb.commercial.vat.title=TVA
lease.gb.commercial.vat.summary=Toutes les sommes s'entendent hors TVA ; la TVA est due si le bailleur a opté pour la taxation.
lease.gb.commercial.deposit.title=Dépôt de garantie
lease.gb.commercial.deposit.summary=Dépôt détenu sur un compte séparé rémunéré, avec des règles de reconstitution et de restitution.
lease.gb.commercial.payment.title=Paiement
lease.gb.commercial.payment.summary=Loyer payable d'avance sans compensation, intérêts de retard et procédure de recouvrement des arriérés de loyers commerciaux en Angleterre et au pays de Galles.
lease.gb.commercial.maintenance.title=Entretien et réparations
lease.gb.commercial.maintenance.summary=Obligation de réparation totale ou intérieure, limitée par un éventuel état des lieux.
lease.gb.commercial.alterations.title=Travaux
lease.gb.commercial.alterations.summary=Aucuns travaux sur la structure ; autres travaux avec accord ; remise en état à la fin du bail.
lease.gb.commercial.assignment.title=Cession et sous-location
lease.gb.commercial.assignment.summary=Cession et sous-location avec un accord qui ne peut être refusé sans motif raisonnable ; règles de libération et de garantie en Angleterre et au pays de Galles.
lease.gb.commercial.insurance.title=Assurance
lease.gb.commercial.insurance.summary=Le bailleur assure l'immeuble et récupère la prime ; le preneur assure son contenu et sa responsabilité ; suspension du loyer après un sinistre assuré.
lease.gb.commercial.energy-certificate.title=Performance énergétique
lease.gb.commercial.energy-certificate.summary=Certificat de performance énergétique des locaux ; classe E minimale pour les locaux non résidentiels en Angleterre et au pays de Galles.
lease.gb.commercial.break-option.title=Faculté de résiliation anticipée
lease.gb.commercial.break-option.summary=Faculté de mettre fin au bail de manière anticipée à une date déterminée, avec préavis et conditions.
lease.gb.commercial.handover-inspection.title=État des lieux et restitution
lease.gb.commercial.handover-inspection.summary=État des lieux, restitution des locaux libres de toute occupation et limitation des dommages-intérêts pour défaut d'entretien.
lease.gb.commercial.termination.title=Résiliation et déchéance
lease.gb.commercial.termination.summary=Résiliation (forfeiture ou irritancy) pour non-paiement, manquement ou insolvabilité, sous réserve des avis légaux et de la protection judiciaire.
lease.gb.commercial.notices.title=Notifications
lease.gb.commercial.notices.summary=Notifications écrites remises en main propre ou par envoi recommandé au siège social.
lease.gb.commercial.guarantor.title=Garant
lease.gb.commercial.guarantor.summary=Garantie des obligations du preneur par un garant.
lease.gb.commercial.data-protection.title=Protection des données
lease.gb.commercial.data-protection.summary=Traitement des données personnelles des représentants des parties selon le UK GDPR.
lease.gb.commercial.disputes.title=Droit applicable et litiges
lease.gb.commercial.disputes.summary=Le droit et les juridictions du territoire où se situent les locaux ; divisibilité des clauses.
