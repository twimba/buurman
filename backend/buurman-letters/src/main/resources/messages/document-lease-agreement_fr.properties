# ===== SE lease clause titles and summaries (country pack) =====
lease.se.residential.parties.title=Parties
lease.se.residential.parties.summary=Identifie le bailleur et le locataire, la solidarité entre colocataires et l'obligation du bailleur d'afficher son nom et son adresse.
lease.se.residential.premises.title=Lieux loués
lease.se.residential.premises.summary=Décrit le logement loué selon le chapitre 12 du jordabalken, avec la déclaration obligatoire du bailleur que la location ne relève pas de la privatuthyrningslag.
lease.se.residential.term.title=Durée
lease.se.residential.term.summary=Date de prise d'effet, durée indéterminée ou déterminée, congé requis après plus de 9 mois de location et prorogation présumée.
lease.se.residential.rent.title=Loyer
lease.se.residential.rent.summary=Loyer en montant fixe, loyer raisonnable apprécié par comparaison de la valeur d'usage (bruksvärde) et interdiction des pas-de-porte.
lease.se.residential.rent-adjustment.title=Modification du loyer
lease.se.residential.rent-adjustment.summary=Modification du loyer par accord ou, après avis écrit, sur demande à la commission régionale des loyers (hyresnämnden) ; pas de clause d'indexation.
lease.se.residential.service-costs.title=Chauffage, électricité et eau
lease.se.residential.service-costs.summary=Ce que comprend le loyer et quand le chauffage, l'eau chaude, l'électricité et l'eau peuvent être facturés en sus du loyer fixe.
lease.se.residential.deposit.title=Dépôt de garantie
lease.se.residential.deposit.summary=Dépôt de garantie facultatif convenu entre les parties, conditions de restitution et droit du constituant du gage ou de la caution de mettre fin à son engagement.
lease.se.residential.payment.title=Paiement
lease.se.residential.payment.summary=Échéance, règles légales sur la date de paiement du loyer, paiement par une banque et intérêts de retard.
lease.se.residential.use.title=Usage et entretien
lease.se.residential.use.summary=Usage d'habitation, devoir de soin, bonne conduite sans troubles, personnes hébergées et droit du locataire de peindre.
lease.se.residential.subletting.title=Sous-location et cession
lease.se.residential.subletting.summary=Sous-location et cession du bail uniquement avec l'accord du bailleur ou l'autorisation de la commission régionale des loyers, sauf exceptions légales.
lease.se.residential.maintenance.title=Entretien
lease.se.residential.maintenance.summary=État du logement, obligation d'entretien du bailleur, droits en cas de défauts, signalement des dommages et accès du bailleur.
lease.se.residential.energy-certificate.title=Diagnostic de performance énergétique
lease.se.residential.energy-certificate.summary=Présentation au locataire du certificat de performance énergétique du bâtiment et remise d'une copie.
lease.se.residential.handover-inspection.title=Remise des lieux et état des lieux
lease.se.residential.handover-inspection.summary=Inspection conjointe à l'entrée et à la sortie et libération du logement au plus tard à 12 heures le lendemain de la fin du bail.
lease.se.residential.termination.title=Fin du bail et droit au maintien
lease.se.residential.termination.summary=Délais de préavis, congé écrit, droit du locataire à la prolongation, déchéance et rétablissement du bail après un retard de paiement.
lease.se.residential.notices.title=Notifications
lease.se.residential.notices.summary=Adresses pour les notifications et notifications légales réputées faites dès leur envoi par lettre recommandée.
lease.se.residential.data-protection.title=Protection des données
lease.se.residential.data-protection.summary=Traitement des données personnelles du locataire selon le RGPD et droit de réclamation auprès de l'autorité suédoise de protection des données (IMY).
lease.se.residential.disputes.title=Litiges
lease.se.residential.disputes.summary=Droit suédois, commission régionale des loyers (hyresnämnden), recours devant la Svea hovrätt et délai de 2 ans pour les créances.
lease.se.commercial.parties.title=Parties
lease.se.commercial.parties.summary=Identifie le bailleur et le preneur avec leur numéro d'immatriculation, leur numéro de TVA et leurs représentants.
lease.se.commercial.premises.title=Locaux loués
lease.se.commercial.premises.summary=Décrit les locaux commerciaux (lokal) loués selon le chapitre 12 du jordabalken.
lease.se.commercial.permitted-use.title=Destination
lease.se.commercial.permitted-use.summary=L'activité du preneur et l'autorisation de la commission régionale des loyers pour un changement d'usage.
lease.se.commercial.term.title=Durée
lease.se.commercial.term.summary=Date de prise d'effet, durée indéterminée ou déterminée, période de reconduction convenue et prorogation présumée.
lease.se.commercial.rent.title=Loyer
lease.se.commercial.rent.summary=Loyer de base hors TVA en montant fixe, ou loyer sur chiffre d'affaires.
lease.se.commercial.rent-adjustment.title=Clause d'indexation
lease.se.commercial.rent-adjustment.summary=Indexation annuelle sur l'indice des prix à la consommation, valable seulement pour une durée déterminée d'au moins 3 ans.
lease.se.commercial.service-costs.title=Suppléments
lease.se.commercial.service-costs.summary=Suppléments pour chauffage, refroidissement, eau chaude, électricité et eau, et leur calcul selon la consommation mesurée.
lease.se.commercial.vat.title=TVA
lease.se.commercial.vat.summary=Exonération de TVA de la location et option pour la taxation lorsque l'activité du preneur le permet.
lease.se.commercial.deposit.title=Garantie
lease.se.commercial.deposit.summary=Dépôt, garantie bancaire ou cautionnement facultatifs, et nouvelle garantie si la garantie se détériore.
lease.se.commercial.payment.title=Paiement
lease.se.commercial.payment.summary=Paiement d'avance, intérêts de retard, déchéance après un retard de plus de 2 jours ouvrables et délai de 2 semaines pour régulariser.
lease.se.commercial.maintenance.title=Entretien
lease.se.commercial.maintenance.summary=État des locaux, répartition convenue de l'entretien et responsabilité étendue du preneur.
lease.se.commercial.alterations.title=Travaux et aménagements
lease.se.commercial.alterations.summary=Travaux uniquement avec l'accord du bailleur, remise en état en fin de bail et incidence sur l'indemnité.
lease.se.commercial.assignment.title=Cession du bail
lease.se.commercial.assignment.summary=Cession avec l'accord du bailleur ou, en cas de cession du fonds, avec l'autorisation de la commission régionale des loyers.
lease.se.commercial.subletting.title=Sous-location
lease.se.commercial.subletting.summary=Sous-location avec accord ou autorisation, et déchéance pour sous-location non autorisée non régularisée sans délai.
lease.se.commercial.insurance.title=Assurance
lease.se.commercial.insurance.summary=Assurance professionnelle et responsabilité civile du preneur et assurance de l'immeuble par le bailleur.
lease.se.commercial.energy-certificate.title=Diagnostic de performance énergétique
lease.se.commercial.energy-certificate.summary=Présentation au locataire du certificat de performance énergétique du bâtiment et remise d'une copie.
lease.se.commercial.handover-inspection.title=Remise des lieux et état des lieux
lease.se.commercial.handover-inspection.summary=Inspection conjointe à l'entrée et à la sortie et libération des locaux au plus tard à 12 heures le lendemain de la fin du bail.
lease.se.commercial.renewal.title=Droit au maintien
lease.se.commercial.renewal.summary=Protection indirecte du preneur : indemnité d'au moins le loyer annuel, délai pour quitter les lieux et accords de renonciation à la protection.
lease.se.commercial.termination.title=Fin du bail
lease.se.commercial.termination.summary=Délais de préavis, congé écrit et signifié, exigences du congé du bailleur et médiation dans un délai de 2 mois.
lease.se.commercial.notices.title=Notifications
lease.se.commercial.notices.summary=Adresses pour les notifications et notifications légales réputées faites dès leur envoi par lettre recommandée.
lease.se.commercial.data-protection.title=Protection des données
lease.se.commercial.data-protection.summary=Traitement des données personnelles des représentants et contacts des parties selon le RGPD.
lease.se.commercial.disputes.title=Litiges
lease.se.commercial.disputes.summary=Droit suédois, commission régionale des loyers (hyresnämnden), juridictions ordinaires et délai de 2 ans pour les créances.
