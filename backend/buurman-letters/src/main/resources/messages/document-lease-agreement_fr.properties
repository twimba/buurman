lease.cz.residential.parties.title=Parties
lease.cz.residential.parties.summary=Bailleur et locataire, les dispositions tchèques sur le bail d'habitation, la forme écrite, le texte uniquement anglais et la version qui prévaut si une version tchèque est aussi signée.
lease.cz.residential.premises.title=Logement loué
lease.cz.residential.premises.summary=Le logement loué pour les besoins de logement du locataire, ses références au cadastre et les pièces et équipements loués avec lui.
lease.cz.residential.term.title=Durée
lease.cz.residential.term.summary=Durée déterminée ou indéterminée et reconduction d'une durée déterminée si le locataire reste 3 mois sans demande écrite de quitter les lieux.
lease.cz.residential.rent.title=Loyer
lease.cz.residential.rent.summary=Loyer mensuel fixé en montant fixe, distinct des paiements pour les services.
lease.cz.residential.rent-adjustment.title=Révision du loyer
lease.cz.residential.rent-adjustment.summary=Augmentation annuelle convenue, ou proposition légale jusqu'au loyer usuel comparable, plafonnée à 20 % sur 3 ans.
lease.cz.residential.service-costs.title=Services
lease.cz.residential.service-costs.summary=Services fournis par le bailleur, provisions mensuelles et décompte annuel selon la loi n° 67/2013 Sb.
lease.cz.residential.deposit.title=Dépôt de garantie
lease.cz.residential.deposit.summary=Dépôt facultatif qui, avec les éventuelles pénalités contractuelles, ne peut dépasser 3 fois le loyer mensuel ; restitué avec intérêts.
lease.cz.residential.payment.title=Paiement
lease.cz.residential.payment.summary=Loyer et provisions payés mensuellement d'avance, au plus tard le 5e jour sauf jour ultérieur convenu, et intérêts de retard.
lease.cz.residential.use.title=Usage du logement
lease.cz.residential.use.summary=Usage normal, travail dans le logement, animaux, nouveaux membres du ménage et avis des absences prolongées.
lease.cz.residential.subletting.title=Sous-location
lease.cz.residential.subletting.summary=Sous-location d'une partie du logement si le locataire y habite ; sinon uniquement avec l'accord écrit du bailleur, réputé donné après 1 mois sans réponse.
lease.cz.residential.maintenance.title=Entretien et réparations
lease.cz.residential.maintenance.summary=Le bailleur maintient le logement en état d'usage ; le locataire paie l'entretien courant et les menues réparations dans les limites légales.
lease.cz.residential.energy-certificate.title=Certificat de performance énergétique
lease.cz.residential.energy-certificate.summary=Certificat de performance énergétique présenté avant la signature et remis au plus tard à la signature.
lease.cz.residential.handover-inspection.title=Remise et restitution
lease.cz.residential.handover-inspection.summary=Procès-verbal de remise au début et restitution du logement dans l'état reçu, compte tenu de l'usure normale.
lease.cz.residential.succession.title=Décès du locataire
lease.cz.residential.succession.summary=Transmission du bail aux membres du ménage ou aux héritiers au décès du locataire, avec ses limites légales.
lease.cz.residential.termination.title=Fin du bail
lease.cz.residential.termination.summary=Congé écrit, préavis de 3 mois du locataire pour une durée indéterminée, motifs légaux du bailleur et contrôle judiciaire du congé.
lease.cz.residential.notices.title=Notifications
lease.cz.residential.notices.summary=Notifications écrites aux adresses indiquées et remise facultative par boîtes de données (datové schránky).
lease.cz.residential.data-protection.title=Protection des données
lease.cz.residential.data-protection.summary=Traitement des données personnelles selon le RGPD et la loi tchèque sur la protection des données.
lease.cz.residential.disputes.title=Droit applicable et litiges
lease.cz.residential.disputes.summary=Droit tchèque et juridictions tchèques.
lease.cz.commercial.parties.title=Parties
lease.cz.commercial.parties.summary=Bailleur et preneur avec leurs numéros d'identification, les dispositions sur les locaux professionnels, le texte uniquement anglais et la version qui prévaut si une version tchèque est aussi signée.
lease.cz.commercial.premises.title=Locaux loués
lease.cz.commercial.premises.summary=Les locaux affectés à l'activité professionnelle, leurs références au cadastre et les droits loués avec eux.
lease.cz.commercial.permitted-use.title=Destination
lease.cz.commercial.permitted-use.summary=L'activité convenue, les limites à sa modification et les enseignes sur l'immeuble.
lease.cz.commercial.term.title=Durée
lease.cz.commercial.term.summary=Durée déterminée ou indéterminée et reconduction d'une durée déterminée si le preneur reste dans les lieux, sauf exclusion.
lease.cz.commercial.rent.title=Loyer
lease.cz.commercial.rent.summary=Loyer mensuel, distinct des paiements pour les services.
lease.cz.commercial.rent-adjustment.title=Révision du loyer
lease.cz.commercial.rent-adjustment.summary=Indexation annuelle selon l'indice des prix à la consommation ou un autre mécanisme convenu ; les règles des logements ne s'appliquent pas.
lease.cz.commercial.service-costs.title=Services
lease.cz.commercial.service-costs.summary=Services fournis par le bailleur, provisions mensuelles et leur décompte.
lease.cz.commercial.vat.title=TVA
lease.cz.commercial.vat.summary=La location est exonérée de TVA, sauf option du bailleur pour la taxation en cas de location à un autre assujetti.
lease.cz.commercial.deposit.title=Dépôt de garantie
lease.cz.commercial.deposit.summary=Dépôt ou garantie bancaire du montant convenu, sans plafond légal, restitué à la fin déduction faite des sommes dues.
lease.cz.commercial.payment.title=Paiement
lease.cz.commercial.payment.summary=Loyer et provisions payés mensuellement d'avance, et intérêts de retard.
lease.cz.commercial.maintenance.title=Entretien et réparations
lease.cz.commercial.maintenance.summary=Entretien courant par le preneur, autre entretien et réparations nécessaires par le bailleur, défauts et accès.
lease.cz.commercial.alterations.title=Travaux et aménagements
lease.cz.commercial.alterations.summary=Travaux uniquement avec l'accord écrit préalable du bailleur, règlement de la plus-value et remise en état.
lease.cz.commercial.subletting.title=Sous-location
lease.cz.commercial.subletting.summary=Sous-location uniquement avec l'accord écrit du bailleur ; une sous-location non autorisée est un manquement grave.
lease.cz.commercial.assignment.title=Cession du bail
lease.cz.commercial.assignment.summary=Cession du bail avec l'activité professionnelle, avec l'accord écrit préalable du bailleur.
lease.cz.commercial.insurance.title=Assurance
lease.cz.commercial.insurance.summary=Assurance de l'immeuble par le bailleur ; le preneur assure ses aménagements et son stock et souscrit une assurance de responsabilité.
lease.cz.commercial.energy-certificate.title=Certificat de performance énergétique
lease.cz.commercial.energy-certificate.summary=Certificat de performance énergétique présenté avant la signature et remis au plus tard à la signature.
lease.cz.commercial.goodwill-compensation.title=Indemnité pour la clientèle
lease.cz.commercial.goodwill-compensation.summary=Indemnité pour la clientèle reprise en cas de congé donné par le bailleur, sauf après un manquement grave.
lease.cz.commercial.handover-inspection.title=Remise et restitution
lease.cz.commercial.handover-inspection.summary=Procès-verbal de remise au début et restitution des locaux libérés dans l'état reçu.
lease.cz.commercial.termination.title=Fin du bail
lease.cz.commercial.termination.summary=Motifs légaux et préavis de 3 mois pour une durée déterminée, 6 ou 3 mois pour une durée indéterminée, objections et contrôle judiciaire.
