lease.ch.residential.service-costs.title=Frais accessoires
lease.ch.residential.service-costs.summary=Frais accessoires seulement s'ils sont convenus spécialement, acomptes avec décompte annuel ou forfait, consultation des pièces justificatives.
lease.ch.residential.deposit.title=Garantie de loyer
lease.ch.residential.deposit.summary=Sûretés de 3 mois de loyer au plus sur un compte bancaire au nom du locataire, restituées avec l'accord des deux parties, sur décision exécutoire ou après 1 an.
lease.ch.residential.payment.title=Paiement
lease.ch.residential.payment.summary=Loyer payable au terme convenu, intérêt moratoire de 5 pour cent, délai de paiement de 30 jours au moins avant une résiliation pour demeure.
lease.ch.residential.use.title=Usage
lease.ch.residential.use.summary=Usage d'habitation uniquement, diligence et égards envers les voisins, règlement de maison et inspections annoncées à temps.
lease.ch.residential.subletting.title=Sous-location
lease.ch.residential.subletting.summary=Sous-location avec le consentement du bailleur, qui ne peut le refuser que pour les motifs légaux.
lease.ch.residential.maintenance.title=Entretien et défauts
lease.ch.residential.maintenance.summary=Le bailleur entretient le logement, le locataire effectue les menus travaux de nettoyage et de réparation ; réduction et consignation du loyer en cas de défaut.
lease.ch.residential.handover-inspection.title=Remise et restitution
lease.ch.residential.handover-inspection.summary=État des lieux, défauts signalés dans les 14 jours, restitution dans l'état résultant d'un usage conforme et avis immédiat des défauts par le bailleur.
