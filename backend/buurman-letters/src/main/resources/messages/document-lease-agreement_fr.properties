lease.fr.residential.rent-adjustment.summary=Révision annuelle plafonnée par l'indice de référence des loyers (IRL) ; aucune révision en classe F ou G.
lease.fr.residential.service-costs.title=Charges
lease.fr.residential.service-costs.summary=Charges récupérables payées par provisions avec régularisation annuelle et pièces justificatives.
lease.fr.residential.deposit.title=Dépôt de garantie
lease.fr.residential.deposit.summary=Dépôt de garantie d'au plus 1 mois de loyer hors charges, restitué sous 1 ou 2 mois.
lease.fr.residential.payment.title=Paiement
lease.fr.residential.payment.summary=Modalités de paiement du loyer ; paiement mensuel sur demande, quittance gratuite et aucune pénalité.
lease.fr.residential.use.title=Usage
lease.fr.residential.use.summary=Usage paisible à titre de résidence principale ; transformations seulement avec l'accord écrit du bailleur.
lease.fr.residential.subletting.title=Sous-location
lease.fr.residential.subletting.summary=Cession et sous-location seulement avec l'accord écrit du bailleur, y compris sur le loyer.
lease.fr.residential.maintenance.title=Entretien et réparations
lease.fr.residential.maintenance.summary=Obligations de décence et de réparation du bailleur, entretien courant du locataire et accès pour travaux.
lease.fr.residential.works.title=Travaux
lease.fr.residential.works.summary=Travaux réalisés depuis le dernier bail et travaux d'amélioration convenus avec l'éventuelle majoration de loyer.
lease.fr.residential.diagnostics.title=Diagnostics techniques
lease.fr.residential.diagnostics.summary=Dossier de diagnostic technique annexé au bail, classe énergétique et performance énergétique minimale.
lease.fr.residential.insurance.title=Assurance
lease.fr.residential.insurance.summary=Le locataire assure les risques locatifs et en justifie chaque année sur demande.
lease.fr.residential.handover-inspection.title=État des lieux
lease.fr.residential.handover-inspection.summary=États des lieux d'entrée et de sortie établis contradictoirement ou par commissaire de justice.
lease.fr.residential.termination.title=Congé et résiliation
lease.fr.residential.termination.summary=Congé du locataire (3 ou 1 mois) et du bailleur (6 mois, motifs légaux) ; clause résolutoire.
lease.fr.residential.annexes.title=Annexes
lease.fr.residential.annexes.summary=Annexes obligatoires : notice d'information, dossier de diagnostic technique, état des lieux et extraits du règlement de copropriété.
lease.fr.residential.data-protection.title=Protection des données
lease.fr.residential.data-protection.summary=Traitement des données personnelles du locataire conformément au RGPD.
lease.fr.residential.disputes.title=Litiges
lease.fr.residential.disputes.summary=Droit français applicable ; commission départementale de conciliation et juge des contentieux de la protection.
