# ===== DK lease clause titles and summaries (country pack) =====
lease.dk.residential.parties.title=Parties
lease.dk.residential.parties.summary=Identifie le bailleur et le ou les locataires ; les colocataires sont solidairement responsables.
lease.dk.residential.premises.title=Lieux loués
lease.dk.residential.premises.summary=Le logement loué, l'application de la loi danoise sur les baux et la mention qu'il ne s'agit pas du formulaire type agréé (typeformular A).
lease.dk.residential.term.title=Durée
lease.dk.residential.term.summary=Date de prise d'effet ; bail à durée indéterminée, ou à durée déterminée prenant fin sans congé et justifié par la situation du bailleur.
lease.dk.residential.rent.title=Loyer
lease.dk.residential.rent.summary=Le loyer et les règles applicables (loyer fondé sur les coûts, valeur locative ou loyer librement convenu).
lease.dk.residential.rent-adjustment.title=Révision du loyer
lease.dk.residential.rent-adjustment.summary=Indexation annuelle sur l'indice des prix nets lorsque la loi le permet, et hausses de loyer légales.
lease.dk.residential.service-costs.title=Frais de consommation
lease.dk.residential.service-costs.summary=Provisions pour le chauffage, l'eau et les autres consommations fournies par le bailleur, avec un décompte annuel.
lease.dk.residential.deposit.title=Dépôt de garantie et loyer payé d'avance
lease.dk.residential.deposit.summary=Dépôt d'au plus 3 mois de loyer et loyer payé d'avance d'au plus 3 mois, ajustés en cas de modification du loyer.
lease.dk.residential.payment.title=Paiement
lease.dk.residential.payment.summary=Loyer payable mensuellement d'avance sur le compte bancaire du bailleur ; jamais plus de 3 mois à la fois.
lease.dk.residential.use.title=Usage des lieux
lease.dk.residential.use.summary=Usage d'habitation exclusivement, utilisation soigneuse du logement et respect du règlement de l'immeuble.
lease.dk.residential.subletting.title=Sous-location
lease.dk.residential.subletting.summary=Usage par des tiers uniquement avec accord ; droit légal du locataire de sous-louer une partie du logement, ou tout le logement pendant 2 ans au plus.
lease.dk.residential.maintenance.title=Entretien
lease.dk.residential.maintenance.summary=Le bailleur entretient l'immeuble et le logement ; le locataire entretient serrures et clés et signale les dommages.
lease.dk.residential.energy-label.title=Étiquette énergétique
lease.dk.residential.energy-label.summary=Le bailleur remet l'étiquette énergétique avant la conclusion du bail, sauf exemption.
lease.dk.residential.handover-inspection.title=Entrée et sortie
lease.dk.residential.handover-inspection.summary=État à la remise, visites d'entrée et de sortie avec rapports, délais de réclamation et restitution du logement.
lease.dk.residential.termination.title=Congé et résiliation
lease.dk.residential.termination.summary=Congé du locataire avec préavis de 3 mois, congé du bailleur pour motifs légaux uniquement, et résiliation après mise en demeure écrite.
lease.dk.residential.data-protection.title=Protection des données
lease.dk.residential.data-protection.summary=Traitement des données personnelles du locataire conformément au RGPD.
lease.dk.residential.disputes.title=Droit applicable et litiges
lease.dk.residential.disputes.summary=Droit danois ; la commission des loyers et le tribunal du logement tranchent les litiges.
lease.dk.commercial.parties.title=Parties
lease.dk.commercial.parties.summary=Identifie le bailleur et le preneur avec leurs numéros d'entreprise (CVR) et leurs représentants.
lease.dk.commercial.premises.title=Locaux loués
lease.dk.commercial.premises.summary=Les locaux professionnels loués, leur surface et l'application de la loi danoise sur les baux professionnels.
lease.dk.commercial.permitted-use.title=Destination des lieux
lease.dk.commercial.permitted-use.summary=L'activité convenue, les autorisations, l'enseigne et l'obligation de maintenir un commerce ouvert.
lease.dk.commercial.term.title=Durée
lease.dk.commercial.term.summary=Date de prise d'effet ; bail à durée indéterminée avec d'éventuelles périodes de non-résiliation, ou à durée déterminée.
lease.dk.commercial.rent.title=Loyer
lease.dk.commercial.rent.summary=Le loyer librement convenu et la date de référence pour les ajustements ultérieurs liés aux impôts et taxes.
lease.dk.commercial.rent-adjustment.title=Révision du loyer
lease.dk.commercial.rent-adjustment.summary=Indexation annuelle sur l'indice des prix nets, hausses liées aux impôts et taxes et révision à la valeur locative de marché.
lease.dk.commercial.service-costs.title=Charges et frais de consommation
lease.dk.commercial.service-costs.summary=Catégories de charges payables en sus du loyer avec leurs montants estimés, et le décompte de consommation.
lease.dk.commercial.vat.title=TVA
lease.dk.commercial.vat.summary=La location est exonérée de TVA ; la TVA s'ajoute si le bailleur est volontairement immatriculé pour la location.
lease.dk.commercial.deposit.title=Dépôt de garantie et loyer payé d'avance
lease.dk.commercial.deposit.summary=Dépôt et loyer payé d'avance librement convenus ; opposables aux tiers sans inscription jusqu'à ½ année de loyer.
lease.dk.commercial.payment.title=Paiement
lease.dk.commercial.payment.summary=Loyer payable d'avance ; le paiement est à temps jusqu'au 3e jour ouvrable suivant l'échéance.
lease.dk.commercial.maintenance.title=Entretien
lease.dk.commercial.maintenance.summary=Les obligations d'entretien du bailleur, la répartition convenue de l'entretien intérieur et l'accès pour travaux.
lease.dk.commercial.alterations.title=Travaux et installations
lease.dk.commercial.alterations.summary=Droit légal du preneur aux installations et transformations usuelles, garantie et remise en état.
lease.dk.commercial.assignment.title=Cession du bail
lease.dk.commercial.assignment.summary=Droit légal du preneur de céder le bail dans la même branche d'activité, sauf exclusion contractuelle.
lease.dk.commercial.subletting.title=Sous-location
lease.dk.commercial.subletting.summary=Usage par des tiers uniquement avec l'accord du bailleur ou un droit de sous-location convenu.
lease.dk.commercial.energy-label.title=Étiquette énergétique
lease.dk.commercial.energy-label.summary=Le bailleur remet l'étiquette énergétique avant la conclusion du bail, sauf exemption.
lease.dk.commercial.handover-inspection.title=Remise et restitution
lease.dk.commercial.handover-inspection.summary=Visite commune à la remise, signalement des défauts sous 2 semaines, restitution et délai de 4 semaines pour les réclamations.
lease.dk.commercial.termination.title=Congé et résiliation
lease.dk.commercial.termination.summary=Préavis de 3 mois, congé du bailleur pour motifs légaux uniquement et contre indemnité, et résiliation après mise en demeure.
lease.dk.commercial.data-protection.title=Protection des données
lease.dk.commercial.data-protection.summary=Traitement des données personnelles des personnes agissant pour les parties conformément au RGPD.
lease.dk.commercial.disputes.title=Droit applicable et litiges
lease.dk.commercial.disputes.summary=Droit danois ; le tribunal du logement ou l'arbitrage convenu tranche les litiges.
