lease.pl.residential.service-costs.summary=Outre le loyer, uniquement les charges d'énergie, de gaz, d'eau, d'eaux usées et de déchets, et seulement si le locataire n'a pas de contrat de fourniture direct.
lease.pl.residential.deposit.title=Dépôt de garantie
lease.pl.residential.deposit.summary=Dépôt facultatif d'au plus 12 fois le loyer mensuel, restitué revalorisé dans 1 mois après la libération du logement.
lease.pl.residential.payment.title=Paiement
lease.pl.residential.payment.summary=Paiement d'avance au jour convenu, intérêts légaux de retard et responsabilité solidaire des membres majeurs du ménage.
lease.pl.residential.use.title=Usage
lease.pl.residential.use.summary=Usage d'habitation, règlement intérieur, aucune modification contraire au contrat et installation d'équipements.
lease.pl.residential.subletting.title=Sous-location
lease.pl.residential.subletting.summary=Sous-location ou prêt à usage seulement avec l'accord écrit du bailleur ; résiliation en cas de sous-location sans accord.
lease.pl.residential.maintenance.title=Entretien et réparations
lease.pl.residential.maintenance.summary=Répartition légale des réparations entre bailleur et locataire, menues dépenses, améliorations et accès pour les inspections.
lease.pl.residential.energy-certificate.title=Certificat de performance énergétique
lease.pl.residential.energy-certificate.summary=Une copie du certificat de performance énergétique est remise à la conclusion ; le locataire ne peut y renoncer.
lease.pl.residential.handover-inspection.title=Remise et restitution
lease.pl.residential.handover-inspection.summary=Procès-verbal d'état et d'usure, restitution sans détérioration et remise en état à la fin du bail.
lease.pl.residential.succession.title=Décès du locataire
lease.pl.residential.succession.summary=Le conjoint, les enfants, les personnes à charge et le partenaire qui vivaient en permanence avec le locataire succèdent au bail.
lease.pl.residential.termination.title=Résiliation
lease.pl.residential.termination.summary=Résiliation par le bailleur uniquement pour des motifs légaux et par écrit, délais de préavis du locataire et résiliation sans préavis pour vices graves.
lease.pl.residential.notices.title=Notifications
lease.pl.residential.notices.summary=Forme écrite des résiliations, adresses de notification et obligation de signaler un changement d'adresse.
lease.pl.residential.data-protection.title=Protection des données
lease.pl.residential.data-protection.summary=Traitement des données personnelles conformément au RGPD et droits des personnes concernées.
lease.pl.residential.disputes.title=Droit applicable et litiges
lease.pl.residential.disputes.summary=Droit polonais, tribunal de droit commun compétent et nullité des clauses contraires à la loi.
lease.pl.commercial.parties.title=Parties
lease.pl.commercial.parties.summary=Identifie le bailleur et le preneur avec leurs numéros d'immatriculation (KRS ou CEIDG, NIP, REGON) et leurs représentants.
lease.pl.commercial.premises.title=Locaux loués
lease.pl.commercial.premises.summary=Décrit les locaux commerciaux, leur surface, les parties communes et le titre du bailleur.
lease.pl.commercial.permitted-use.title=Destination
lease.pl.commercial.permitted-use.summary=Activité exercée dans les locaux ; autorisations et inscriptions aux frais du preneur.
lease.pl.commercial.term.title=Durée
lease.pl.commercial.term.summary=Durée déterminée ou indéterminée, limite de 30 ans entre entrepreneurs et effet d'une vente des locaux sur le bail.
lease.pl.commercial.rent.title=Loyer
lease.pl.commercial.rent.summary=Loyer convenu par les parties et sa périodicité de paiement.
lease.pl.commercial.rent-adjustment.title=Indexation du loyer
lease.pl.commercial.rent-adjustment.summary=Indexation annuelle selon l'indice des prix à la consommation ou un autre indice, et augmentation par résiliation selon le Code civil.
lease.pl.commercial.service-costs.title=Charges
lease.pl.commercial.service-costs.summary=Fluides et quote-part des charges communes supportés par le preneur, et leur régularisation.
lease.pl.commercial.vat.title=TVA
lease.pl.commercial.vat.summary=Le loyer et les charges sont hors taxes, majorés de la TVA au taux normal de 23 %, sauf si le bailleur est exonéré.
lease.pl.commercial.deposit.title=Dépôt de garantie
lease.pl.commercial.deposit.summary=Dépôt facultatif ou autre garantie librement convenus par les parties, avec règles de reconstitution et de restitution.
lease.pl.commercial.payment.title=Paiement
lease.pl.commercial.payment.summary=Paiement d'avance au jour convenu par virement ; intérêts légaux de retard ou intérêts selon la loi sur les transactions commerciales.
lease.pl.commercial.maintenance.title=Entretien et réparations
lease.pl.commercial.maintenance.summary=Le bailleur maintient les locaux en état de servir ; les menues dépenses sont à la charge du preneur.
lease.pl.commercial.alterations.title=Aménagements et améliorations
lease.pl.commercial.alterations.summary=Travaux seulement avec accord écrit ; règlement des améliorations en fin de bail.
lease.pl.commercial.subletting.title=Sous-location et cession
lease.pl.commercial.subletting.summary=Sous-location et cession du bail seulement avec l'accord écrit du bailleur.
lease.pl.commercial.insurance.title=Assurance
lease.pl.commercial.insurance.summary=Assurance de l'immeuble par le bailleur, assurance responsabilité civile et des biens par le preneur.
lease.pl.commercial.energy-certificate.title=Certificat de performance énergétique
lease.pl.commercial.energy-certificate.summary=Une copie du certificat de performance énergétique est remise à la conclusion ; le preneur ne peut y renoncer.
lease.pl.commercial.enforcement-submission.title=Soumission à l'exécution forcée
lease.pl.commercial.enforcement-submission.summary=Acte notarié par lequel le preneur se soumet à l'exécution forcée pour le paiement et la restitution des locaux.
lease.pl.commercial.handover-inspection.title=Remise et restitution
lease.pl.commercial.handover-inspection.summary=Procès-verbal de remise et restitution des locaux sans détérioration.
lease.pl.commercial.termination.title=Résiliation
lease.pl.commercial.termination.summary=Délais de préavis et résiliation sans préavis pour arriérés de loyer après avertissement écrit, usage abusif ou vices graves.
lease.pl.commercial.notices.title=Notifications
lease.pl.commercial.notices.summary=Forme écrite des déclarations et adresses de notification.
lease.pl.commercial.data-protection.title=Protection des données
lease.pl.commercial.data-protection.summary=Traitement des données personnelles des représentants et contacts conformément au RGPD.
lease.pl.commercial.disputes.title=Droit applicable et litiges
lease.pl.commercial.disputes.summary=Droit polonais, tribunal de droit commun compétent et nullité des clauses contraires à la loi.
