# ===== CH lease clause titles and summaries (country pack) =====
lease.ch.residential.parties.title=Parties
lease.ch.residential.parties.summary=Identifie le bailleur et le ou les locataires, leur responsabilité solidaire et si le logement est le logement de la famille.
lease.ch.residential.premises.title=Objet loué
lease.ch.residential.premises.summary=Décrit le logement et ses annexes ; le CO et l'OBLF s'appliquent, avec les exceptions pour les logements de luxe et les appartements de vacances.
lease.ch.residential.term.title=Durée
lease.ch.residential.term.summary=Début du bail ; bail de durée indéterminée ou de durée déterminée prenant fin sans congé et devenant indéterminé en cas de reconduction tacite.
lease.ch.residential.rent.title=Loyer
lease.ch.residential.rent.summary=Loyer net et ses bases (taux de référence, indice des prix), contestation du loyer initial dans les 30 jours et formule officielle cantonale.
