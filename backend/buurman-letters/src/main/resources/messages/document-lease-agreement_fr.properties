lease.ch.commercial.rent-adjustment.summary=Loyer indexé (bail d'au moins 5 ans, indice des prix à la consommation) ou échelonné, sinon majorations sur formule cantonale motivée.
lease.ch.commercial.service-costs.title=Frais accessoires
lease.ch.commercial.service-costs.summary=Frais accessoires seulement s'ils sont convenus spécialement, acomptes avec décompte annuel ou forfait, consultation des pièces justificatives.
lease.ch.commercial.vat.title=TVA
lease.ch.commercial.vat.summary=La location est exclue du champ de la TVA, sous réserve d'exceptions légales comme les places de parc louées séparément ; le bailleur peut opter pour l'imposition, sauf usage exclusivement d'habitation.
lease.ch.commercial.deposit.title=Garantie de loyer
lease.ch.commercial.deposit.summary=Sûretés sans montant maximal légal, déposées sur un compte bancaire au nom du locataire ou remplacées par une garantie bancaire.
lease.ch.commercial.payment.title=Paiement
lease.ch.commercial.payment.summary=Loyer payable au terme convenu, intérêt moratoire de 5 pour cent, délai de paiement de 30 jours au moins avant une résiliation pour demeure.
lease.ch.commercial.maintenance.title=Entretien et défauts
lease.ch.commercial.maintenance.summary=Le bailleur entretient l'objet loué, le locataire effectue les menus travaux de nettoyage et de réparation ; droits en cas de défauts, travaux et inspections.
lease.ch.commercial.alterations.title=Modifications par le locataire
lease.ch.commercial.alterations.summary=Modifications et enseignes uniquement avec consentement écrit ; remise en état seulement si convenue par écrit ; indemnité pour plus-value considérable.
lease.ch.commercial.subletting.title=Sous-location
lease.ch.commercial.subletting.summary=Sous-location avec le consentement du bailleur, qui ne peut le refuser que pour les motifs légaux.
lease.ch.commercial.assignment.title=Transfert du bail
lease.ch.commercial.assignment.summary=Transfert à un tiers avec consentement écrit, refusé seulement pour de justes motifs ; responsabilité solidaire pendant 2 ans au plus.
lease.ch.commercial.retention-right.title=Droit de rétention du bailleur
lease.ch.commercial.retention-right.summary=Droit de rétention sur les meubles se trouvant dans les locaux pour le loyer de l'année écoulée et du semestre courant.
lease.ch.commercial.insurance.title=Assurances
lease.ch.commercial.insurance.summary=Le bailleur assure le bâtiment ; le locataire assure ses installations et marchandises et conclut une assurance responsabilité civile d'entreprise.
lease.ch.commercial.handover-inspection.title=Remise et restitution
lease.ch.commercial.handover-inspection.summary=État des lieux, restitution libre de tout objet et dans l'état résultant d'un usage conforme, avis immédiat des défauts par le bailleur.
lease.ch.commercial.termination.title=Résiliation
lease.ch.commercial.termination.summary=Congé écrit, par le bailleur sur formule cantonale, 6 mois pour les termes convenus ou usuels ; contestation et prolongation jusqu'à 6 ans.
lease.ch.commercial.data-protection.title=Protection des données
