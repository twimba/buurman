lease.ch.residential.data-protection.title=Protection des données
lease.ch.residential.data-protection.summary=Traitement des données personnelles du locataire selon la loi fédérale sur la protection des données (LPD) et droits du locataire.
lease.ch.residential.disputes.title=Litiges
