lease.dk.residential.term.summary=Ημερομηνία έναρξης· μίσθωση αορίστου χρόνου ή ορισμένου χρόνου που λήγει χωρίς καταγγελία και πρέπει να δικαιολογείται από την κατάσταση του εκμισθωτή.
lease.dk.residential.rent.title=Μίσθωμα
lease.dk.residential.rent.summary=Το μίσθωμα και οι κανόνες που εφαρμόζονται (μίσθωμα βάσει κόστους, μισθωτική αξία του μισθίου ή ελεύθερα συμφωνημένο μίσθωμα).
