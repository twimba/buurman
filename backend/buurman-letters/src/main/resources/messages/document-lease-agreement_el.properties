lease.dk.residential.rent-adjustment.summary=Ετήσια αναπροσαρμογή βάσει του δείκτη καθαρών τιμών όπου το επιτρέπει ο νόμος, και νόμιμες αυξήσεις μισθώματος.
lease.dk.residential.service-costs.title=Δαπάνες κατανάλωσης
lease.dk.residential.service-costs.summary=Προκαταβολές για θέρμανση, νερό και λοιπή κατανάλωση που παρέχει ο εκμισθωτής, με ετήσια εκκαθάριση κατανάλωσης.
lease.dk.residential.deposit.title=Εγγύηση και προκαταβληθέν μίσθωμα
lease.dk.residential.deposit.summary=Εγγύηση έως 3 μισθώματα και προκαταβληθέν μίσθωμα έως 3 μηνών, με αναπροσαρμογή όταν μεταβάλλεται το μίσθωμα.
lease.dk.residential.payment.title=Πληρωμή
lease.dk.residential.payment.summary=Το μίσθωμα καταβάλλεται μηνιαίως προκαταβολικά στον τραπεζικό λογαριασμό του εκμισθωτή· ποτέ για περισσότερους από 3 μήνες κάθε φορά.
lease.dk.residential.use.title=Χρήση του μισθίου
