lease.de.commercial.data-protection.summary=Επεξεργασία προσωπικών δεδομένων εκπροσώπων και υπευθύνων επικοινωνίας σύμφωνα με τον ΓΚΠΔ.
lease.de.commercial.disputes.title=Διαφορές
lease.de.commercial.disputes.summary=Εφαρμόζεται το γερμανικό δίκαιο· αποκλειστικά αρμόδιο είναι το δικαστήριο της τοποθεσίας του μισθίου.
