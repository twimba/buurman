lease.fr.commercial.premises.title=Μίσθιο
lease.fr.commercial.premises.summary=Περιγράφει το μίσθιο και εφαρμόζει το νόμιμο καθεστώς των εμπορικών μισθώσεων.
lease.fr.commercial.permitted-use.title=Χρήση μισθίου
lease.fr.commercial.permitted-use.summary=Η επιτρεπόμενη δραστηριότητα στο μίσθιο και το δικαίωμα του μισθωτή να προσθέσει συναφείς δραστηριότητες.
lease.fr.commercial.term.title=Διάρκεια
lease.fr.commercial.term.summary=Ελάχιστη διάρκεια 9 ετών με δικαίωμα του μισθωτή να καταγγείλει στο τέλος κάθε περιόδου 3 ετών.
lease.fr.commercial.rent.title=Μίσθωμα
lease.fr.commercial.rent.summary=Το αρχικό μίσθωμα και το ανώτατο όριο του μισθώματος κατά την ανανέωση.
lease.fr.commercial.rent-adjustment.title=Τιμαριθμική αναπροσαρμογή
lease.fr.commercial.rent-adjustment.summary=Ετήσια αναπροσαρμογή βάσει του δείκτη ILC ή ILAT και νόμιμη αναθεώρηση του μισθώματος.
lease.fr.commercial.service-costs.title=Δαπάνες και φόροι
lease.fr.commercial.service-costs.summary=Περιοριστικός κατάλογος δαπανών και φόρων, μη μετακυλιόμενες δαπάνες και ετήσια κατάσταση.
lease.fr.commercial.vat.title=ΦΠΑ
lease.fr.commercial.vat.summary=Απαλλαγή από ΦΠΑ των κενών χώρων και επιλογή του εκμισθωτή για υπαγωγή στον ΦΠΑ.
lease.fr.commercial.deposit.title=Εγγύηση
lease.fr.commercial.deposit.summary=Εγγύηση έως 1 τρίμηνο μισθώματος για εμπορικά και βιοτεχνικά μίσθια, που επιστρέφεται εντός 3 μηνών.
lease.fr.commercial.payment.title=Πληρωμή
lease.fr.commercial.payment.summary=Προκαταβολή του μισθώματος και δικαίωμα μηνιαίας καταβολής για εμπορικά και βιοτεχνικά μίσθια.
lease.fr.commercial.maintenance.title=Συντήρηση και επισκευές
lease.fr.commercial.maintenance.summary=Υποχρεώσεις επισκευής του εκμισθωτή, μεγάλες επισκευές όχι σε βάρος του μισθωτή, τρέχουσα συντήρηση.
lease.fr.commercial.alterations.title=Εργασίες και διαμόρφωση
lease.fr.commercial.alterations.summary=Εργασίες και διαμορφώσεις μόνο με προηγούμενη έγγραφη συναίνεση του εκμισθωτή.
lease.fr.commercial.assignment.title=Εκχώρηση
lease.fr.commercial.assignment.summary=Εκχώρηση της μίσθωσης με την πώληση της επιχείρησης και όριο 3 ετών για την εγγύηση του εκχωρητή.
lease.fr.commercial.subletting.title=Υπεκμίσθωση
lease.fr.commercial.subletting.summary=Υπεκμίσθωση μόνο εφόσον την επιτρέπει η σύμβαση ή ο εκμισθωτής, ο οποίος καλείται στην πράξη.
lease.fr.commercial.insurance.title=Ασφάλιση
lease.fr.commercial.insurance.summary=Ασφάλιση του κτιρίου από τον εκμισθωτή και της επιχείρησης και της ευθύνης από τον μισθωτή.
lease.fr.commercial.diagnostics.title=Διαγνώσεις
lease.fr.commercial.diagnostics.summary=Διάγνωση ενεργειακής απόδοσης, δήλωση κινδύνων, πληροφορίες για αμίαντο και περιβαλλοντικό παράρτημα.
lease.fr.commercial.handover-inspection.title=Πρακτικό κατάστασης
lease.fr.commercial.handover-inspection.summary=Πρακτικά κατάστασης κατά την παράδοση, τις εκχωρήσεις και την επιστροφή του μισθίου.
lease.fr.commercial.renewal.title=Ανανέωση
lease.fr.commercial.renewal.summary=Δικαίωμα ανανέωσης του μισθωτή, αποζημίωση αποβολής και καταγγελία με εξώδικη πράξη.
lease.fr.commercial.pre-emption.title=Δικαίωμα προτίμησης
lease.fr.commercial.pre-emption.summary=Δικαίωμα προτίμησης του μισθωτή σε περίπτωση πώλησης εμπορικών ή βιοτεχνικών χώρων.
lease.fr.commercial.termination.title=Λύση
lease.fr.commercial.termination.summary=Λήξη της μίσθωσης και διαλυτικός όρος 1 μήνα μετά από άκαρπη επιταγή.
lease.fr.commercial.data-protection.title=Προστασία δεδομένων
lease.fr.commercial.data-protection.summary=Επεξεργασία προσωπικών δεδομένων των μερών και των εκπροσώπων τους σύμφωνα με τον ΓΚΠΔ.
lease.fr.commercial.disputes.title=Διαφορές
lease.fr.commercial.disputes.summary=Εφαρμόζεται το γαλλικό δίκαιο· επιτροπή συμβιβασμού και το δικαστήριο του τόπου του ακινήτου.
lease.rentComponent.BASE_RENT=Βασικό μίσθωμα
lease.rentComponent.UTILITIES_ADVANCE=Προκαταβολή κοινής ωφέλειας
lease.rentComponent.SERVICE_COSTS=Έξοδα υπηρεσιών
lease.rentComponent.HOA_FEES=Κοινόχρηστα
lease.rentComponent.FURNITURE_RENTAL=Μίσθωση επίπλων
lease.rentComponent.PARKING=Στάθμευση
lease.rentComponent.STORAGE=Αποθήκη
lease.rentComponent.GARBAGE_COLLECTION=Αποκομιδή απορριμμάτων
lease.rentComponent.OTHER=Άλλο
