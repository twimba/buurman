lease.se.commercial.rent.title=Μίσθωμα
lease.se.commercial.rent.summary=Βασικό μίσθωμα χωρίς ΦΠΑ σε σταθερό ποσό ή μίσθωμα επί του κύκλου εργασιών.
lease.se.commercial.rent-adjustment.title=Ρήτρα αναπροσαρμογής
lease.se.commercial.rent-adjustment.summary=Ετήσια αναπροσαρμογή με βάση τον δείκτη τιμών καταναλωτή, ισχύει μόνο για ορισμένη διάρκεια τουλάχιστον 3 ετών.
lease.se.commercial.service-costs.title=Πρόσθετες επιβαρύνσεις
lease.se.commercial.service-costs.summary=Επιβαρύνσεις για θέρμανση, ψύξη, ζεστό νερό, ηλεκτρισμό και νερό και ο υπολογισμός τους με βάση τη μετρημένη κατανάλωση.
lease.se.commercial.vat.title=ΦΠΑ
lease.se.commercial.vat.summary=Απαλλαγή της μίσθωσης από ΦΠΑ και προαιρετική φορολόγηση όταν η δραστηριότητα του μισθωτή πληροί τις προϋποθέσεις.
lease.se.commercial.deposit.title=Εγγύηση
lease.se.commercial.deposit.summary=Προαιρετική εγγύηση, τραπεζική εγγυητική επιστολή ή εγγυοδοσία και νέα εγγύηση αν η εγγύηση χειροτερεύσει.
lease.se.commercial.payment.title=Καταβολή
lease.se.commercial.payment.summary=Προκαταβολή, τόκοι υπερημερίας, έκπτωση μετά από καθυστέρηση άνω των 2 εργάσιμων ημερών και προθεσμία 2 εβδομάδων για αποκατάσταση.
lease.se.commercial.maintenance.title=Συντήρηση
lease.se.commercial.maintenance.summary=Κατάσταση του χώρου, συμφωνημένη κατανομή της συντήρησης και διευρυμένη ευθύνη του μισθωτή.
lease.se.commercial.alterations.title=Μετατροπές
lease.se.commercial.alterations.summary=Μετατροπές μόνο με συναίνεση του εκμισθωτή, επαναφορά στη λήξη και επίδραση στην αποζημίωση.
lease.se.commercial.assignment.title=Εκχώρηση
lease.se.commercial.assignment.summary=Εκχώρηση με συναίνεση του εκμισθωτή ή, σε μεταβίβαση της επιχείρησης, με άδεια της περιφερειακής επιτροπής μισθώσεων.
lease.se.commercial.subletting.title=Υπεκμίσθωση
lease.se.commercial.subletting.summary=Υπεκμίσθωση με συναίνεση ή άδεια και έκπτωση για μη επιτρεπόμενη υπεκμίσθωση που δεν αποκαθίσταται αμελλητί.
lease.se.commercial.insurance.title=Ασφάλιση
lease.se.commercial.insurance.summary=Επιχειρηματική ασφάλιση και ασφάλιση αστικής ευθύνης του μισθωτή και ασφάλιση του ακινήτου από τον εκμισθωτή.
lease.se.commercial.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.se.commercial.energy-certificate.summary=Επίδειξη του πιστοποιητικού ενεργειακής απόδοσης του κτιρίου στον μισθωτή και παράδοση αντιγράφου.
lease.se.commercial.handover-inspection.title=Παράδοση και επιθεώρηση
lease.se.commercial.handover-inspection.summary=Κοινή επιθεώρηση κατά την είσοδο και την έξοδο και απόδοση του χώρου έως τις 12 την επομένη της λήξης της μίσθωσης.
lease.se.commercial.renewal.title=Προστασία μισθωτή
lease.se.commercial.renewal.summary=Έμμεση προστασία του μισθωτή: αποζημίωση τουλάχιστον ίση με το ετήσιο μίσθωμα, αναβολή αποχώρησης και συμφωνίες παραίτησης από την προστασία.
lease.se.commercial.termination.title=Λύση
lease.se.commercial.termination.summary=Προθεσμίες καταγγελίας, έγγραφη και επιδοθείσα καταγγελία, απαιτήσεις της καταγγελίας του εκμισθωτή και διαμεσολάβηση εντός 2 μηνών.
lease.se.commercial.notices.title=Κοινοποιήσεις
lease.se.commercial.notices.summary=Διευθύνσεις για κοινοποιήσεις και νόμιμες ειδοποιήσεις που θεωρούνται ότι έγιναν με την αποστολή συστημένης επιστολής.
lease.se.commercial.data-protection.title=Προστασία δεδομένων
lease.se.commercial.data-protection.summary=Επεξεργασία προσωπικών δεδομένων των εκπροσώπων και των υπευθύνων επικοινωνίας των μερών κατά τον ΓΚΠΔ.
lease.se.commercial.disputes.title=Διαφορές
lease.se.commercial.disputes.summary=Σουηδικό δίκαιο, περιφερειακή επιτροπή μισθώσεων (hyresnämnden), τακτικά δικαστήρια και προθεσμία 2 ετών για αξιώσεις.
