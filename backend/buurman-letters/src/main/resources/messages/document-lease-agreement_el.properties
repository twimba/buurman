lease.title=Σύμβαση μίσθωσης
lease.parties.title=Μέρη
lease.parties.body=Η παρούσα σύμβαση συνάπτεται μεταξύ του ιδιοκτήτη και του μισθωτή που αναφέρονται παραπάνω.
lease.premises.title=Μίσθιο
lease.premises.body=Ο ιδιοκτήτης εκμισθώνει στον μισθωτή το μίσθιο που περιγράφεται παραπάνω.
lease.rent.title=Μίσθωμα
lease.rent.body=Ο μισθωτής καταβάλλει το μίσθωμα που ορίζεται στην παρούσα σύμβαση.
lease.duration.title=Διάρκεια
lease.duration.body=Η παρούσα σύμβαση ισχύει για τη διάρκεια που ορίζεται σε αυτήν.
lease.deposit.title=Εγγύηση
lease.deposit.body=Ενδέχεται να απαιτείται εγγύηση όπως ορίζεται στην παρούσα σύμβαση.
lease.maintenance.title=Συντήρηση
lease.maintenance.body=Οι υποχρεώσεις συντήρησης κάθε μέρους ορίζονται στην παρούσα σύμβαση.
lease.termination-reference.title=Λύση
lease.termination-reference.body=Η παρούσα σύμβαση μπορεί να λυθεί σύμφωνα με την ισχύουσα νομοθεσία και τους όρους λύσης της παρούσας σύμβασης.
