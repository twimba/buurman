lease.ie.residential.term.summary=Έναρξη, ορισμένη ή περιοδική διάρκεια, μίσθωση Part 4 μετά από 6 μήνες και ελάχιστες περίοδοι 6 ετών.
lease.ie.residential.rent.title=Μίσθωμα
lease.ie.residential.rent.summary=Ύψος μισθώματος, ανώτατο όριο το μίσθωμα αγοράς και εθνικό όριο 2% ετησίως ή της αύξησης του CPI, αν είναι μικρότερη.
lease.ie.residential.rent-information.title=Πληροφορίες μισθώματος στην έναρξη
lease.ie.residential.rent-information.summary=Προηγούμενο μίσθωμα και 3 συγκρίσιμα μισθώματα, που γνωστοποιούνται στον μισθωτή στην έναρξη και στο RTB εντός 1 μηνός.
lease.ie.residential.rent-adjustment.title=Αναθεώρηση μισθώματος
lease.ie.residential.rent-adjustment.summary=Αναθεώρηση το πολύ 1 φορά ανά 12 μήνες, όχι τους πρώτους 12 μήνες, με ειδοποίηση 90 ημερών στο προβλεπόμενο έντυπο.
lease.ie.residential.service-costs.title=Παροχές και επιβαρύνσεις
lease.ie.residential.service-costs.summary=Παροχές και λοιπές επιβαρύνσεις του μισθωτή· τα έξοδα της εταιρείας διαχείρισης βαρύνουν τον εκμισθωτή, εκτός αν συμφωνηθεί άλλως.
lease.ie.residential.deposit.title=Εγγύηση
lease.ie.residential.deposit.summary=Εγγύηση έως 1 μίσθωμα, που επιστρέφεται αμέσως στο τέλος αφού αφαιρεθούν οφειλόμενα μισθώματα ή κόστος ζημιών.
lease.ie.residential.payment.title=Πληρωμή
lease.ie.residential.payment.summary=Πληρωμή του μισθώματος στη λήξη με τραπεζική μεταφορά, προκαταβολή έως 1 μήνα και βιβλιάριο μισθωμάτων.
lease.ie.residential.use.title=Χρήση της κατοικίας
lease.ie.residential.use.summary=Χρήση μόνο ως κατοικία, χωρίς αντικοινωνική συμπεριφορά, γνωστοποίηση ενοίκων και κατοικίδια μόνο με συναίνεση.
lease.ie.residential.subletting.title=Εκχώρηση και υπεκμίσθωση
lease.ie.residential.subletting.summary=Εκχώρηση ή υπεκμίσθωση μόνο με έγγραφη συναίνεση· σε περίπτωση άρνησης ο μισθωτής μπορεί να καταγγείλει.
lease.ie.residential.maintenance.title=Επισκευές και συντήρηση
lease.ie.residential.maintenance.summary=Ο εκμισθωτής επισκευάζει τον φέροντα οργανισμό και το εσωτερικό και τηρεί τα πρότυπα μισθωμένων κατοικιών· ο μισθωτής αναφέρει βλάβες και επιτρέπει την πρόσβαση.
lease.ie.residential.energy-certificate.title=Ενεργειακή κατάταξη (BER)
lease.ie.residential.energy-certificate.summary=Πιστοποιητικό BER της κατοικίας που τίθεται στη διάθεση του μισθωτή όταν απαιτείται.
lease.ie.residential.registration.title=Καταχώριση στο RTB
lease.ie.residential.registration.summary=Καταχώριση της μίσθωσης στο RTB εντός 1 μηνός από την έναρξη και από κάθε επέτειο.
lease.ie.residential.insurance.title=Ασφάλιση
lease.ie.residential.insurance.summary=Ασφάλιση του κτιρίου από τον εκμισθωτή με κάλυψη αστικής ευθύνης τουλάχιστον 250.000 EUR· ο μισθωτής δεν πρέπει να την ακυρώσει.
lease.ie.residential.handover-inspection.title=Απογραφή και παράδοση
lease.ie.residential.handover-inspection.summary=Υπογεγραμμένη απογραφή στην έναρξη και απόδοση της κατοικίας στο τέλος, πλην της συνήθους φθοράς.
lease.ie.residential.termination.title=Λύση
lease.ie.residential.termination.summary=Ειδοποιήσεις λύσης, νόμιμες προθεσμίες και οι περιορισμένοι λόγοι λύσης μίσθωσης Part 4.
lease.ie.residential.notices.title=Κοινοποιήσεις
lease.ie.residential.notices.summary=Έγγραφες ειδοποιήσεις, επίδοση κατά τον νόμο και με ηλεκτρονικό ταχυδρομείο, και διευθύνσεις επίδοσης.
lease.ie.residential.data-protection.title=Προστασία δεδομένων
lease.ie.residential.data-protection.summary=Επεξεργασία προσωπικών δεδομένων σύμφωνα με τον ΓΚΠΔ και τον Data Protection Act 2018.
lease.ie.residential.disputes.title=Διαφορές
lease.ie.residential.disputes.summary=Ιρλανδικό δίκαιο· οι διαφορές βάσει του νόμου παραπέμπονται στο RTB, οι λοιπές στα ιρλανδικά δικαστήρια.
lease.ie.commercial.parties.title=Συμβαλλόμενοι
lease.ie.commercial.parties.summary=Εκμισθωτής και μισθωτής με αριθμό μητρώου, έδρα, ΑΦΜ για ΦΠΑ και εκπρόσωπο.
lease.ie.commercial.premises.title=Μίσθιο
lease.ie.commercial.premises.summary=Ο μισθωμένος επαγγελματικός χώρος, το εμβαδόν και τα δικαιώματα· ο Residential Tenancies Act 2004 δεν εφαρμόζεται.
lease.ie.commercial.permitted-use.title=Χρήση μισθίου
lease.ie.commercial.permitted-use.summary=Επιτρεπόμενη επαγγελματική χρήση· η συναίνεση σε αλλαγή χρήσης δεν αρνείται αδικαιολόγητα· άδειες με κίνδυνο του μισθωτή.
lease.ie.commercial.term.title=Διάρκεια
lease.ie.commercial.term.summary=Έναρξη και ορισμένη διάρκεια ή περιοδική μίσθωση που λύεται με καταγγελία.
lease.ie.commercial.renewal.title=Δικαίωμα ανανέωσης
lease.ie.commercial.renewal.summary=Νόμιμο δικαίωμα νέας μίσθωσης μετά από 5 έτη επαγγελματικής χρήσης και δυνατότητα παραίτησης μετά από νομική συμβουλή.
lease.ie.commercial.rent.title=Μίσθωμα
lease.ie.commercial.rent.summary=Ύψος μισθώματος χωρίς ΦΠΑ, κοινόχρηστα και ασφάλιση, και τυχόν συμφωνημένα κίνητρα.
lease.ie.commercial.rent-adjustment.title=Αναθεώρηση μισθώματος
lease.ie.commercial.rent-adjustment.summary=Αναθεώρηση στο μίσθωμα αγοράς· για μισθώσεις από 28 Φεβρουαρίου 2010 το μίσθωμα μπορεί και να μειωθεί.
lease.ie.commercial.service-costs.title=Κοινόχρηστα και επιβαρύνσεις
lease.ie.commercial.service-costs.summary=Κοινόχρηστα κατά ποσοστό με ετήσια εκκαθάριση· ο μισθωτής πληρώνει τοπικά τέλη (rates) και παροχές.
lease.ie.commercial.vat.title=ΦΠΑ
lease.ie.commercial.vat.summary=Οι μισθώσεις απαλλάσσονται από ΦΠΑ, εκτός αν ο εκμισθωτής επιλέξει τη φορολόγηση.
lease.ie.commercial.deposit.title=Εγγύηση
lease.ie.commercial.deposit.summary=Εγγύηση χωρίς νόμιμο ανώτατο όριο, σε καθορισμένο λογαριασμό, επιστρεφόμενη εντός 30 ημερών.
lease.ie.commercial.payment.title=Πληρωμή
lease.ie.commercial.payment.summary=Πληρωμή του μισθώματος χωρίς συμψηφισμό με τραπεζική μεταφορά, με τόκους σε περίπτωση καθυστέρησης.
lease.ie.commercial.maintenance.title=Επισκευές
lease.ie.commercial.maintenance.summary=Πλήρης ή εσωτερική υποχρέωση επισκευής και το νόμιμο όριο αποζημίωσης για πλημμελή συντήρηση.
lease.ie.commercial.alterations.title=Μεταβολές
lease.ie.commercial.alterations.summary=Μεταβολές μόνο με συναίνεση, που δεν αρνείται αδικαιολόγητα για βελτιώσεις, και αποκατάσταση στο τέλος.
lease.ie.commercial.assignment.title=Εκχώρηση και υπεκμίσθωση
lease.ie.commercial.assignment.summary=Εκχώρηση ή υπεκμίσθωση με συναίνεση του εκμισθωτή, που δεν μπορεί να αρνηθεί αδικαιολόγητα.
lease.ie.commercial.insurance.title=Ασφάλιση
lease.ie.commercial.insurance.summary=Ο εκμισθωτής ασφαλίζει το κτίριο με δαπάνη του μισθωτή· ο μισθωτής ασφαλίζει περιεχόμενο και ευθύνη· αναστολή μισθώματος μετά από ζημία.
lease.ie.commercial.energy-certificate.title=Ενεργειακή κατάταξη (BER)
lease.ie.commercial.energy-certificate.summary=Πιστοποιητικό BER του μισθίου που τίθεται στη διάθεση του μισθωτή όταν απαιτείται.
lease.ie.commercial.registration.title=Τέλος χαρτοσήμου και μητρώο
lease.ie.commercial.registration.summary=Τέλος χαρτοσήμου επί της μίσθωσης και γνωστοποιήσεις της μίσθωσης, κάθε αναθεώρησης μισθώματος και της αποχώρησης του μισθωτή στην Commercial Leases Database της PSRA.
lease.ie.commercial.break-option.title=Πρόωρη λύση
lease.ie.commercial.break-option.summary=Προαιρετικές ημερομηνίες πρόωρης λύσης, προειδοποίηση και όροι· η λύση από τον μισθωτή μπορεί να αποσβέσει το δικαίωμα ανανέωσης.
lease.ie.commercial.handover-inspection.title=Κατάσταση μισθίου και απόδοση
lease.ie.commercial.handover-inspection.summary=Πρωτόκολλο κατάστασης στην έναρξη και απόδοση του μισθίου κενού στο τέλος.
lease.ie.commercial.termination.title=Έκπτωση και λύση
lease.ie.commercial.termination.summary=Ανάκτηση του μισθίου για απλήρωτα μισθώματα ή παράβαση, προηγούμενη ειδοποίηση και δικαστική προστασία, και οι λοιποί τρόποι λύσης.
lease.ie.commercial.notices.title=Κοινοποιήσεις
lease.ie.commercial.notices.summary=Έγγραφες ειδοποιήσεις ιδιοχείρως ή με συστημένη επιστολή και διευθύνσεις επίδοσης.
lease.ie.commercial.guarantor.title=Εγγυητής
lease.ie.commercial.guarantor.summary=Εγγύηση των υποχρεώσεων του μισθωτή από εγγυητή ως αυτοφειλέτη.
lease.ie.commercial.data-protection.title=Προστασία δεδομένων
lease.ie.commercial.data-protection.summary=Επεξεργασία προσωπικών δεδομένων υπευθύνων επικοινωνίας και εγγυητών σύμφωνα με τον ΓΚΠΔ.
lease.ie.commercial.disputes.title=Διαφορές
lease.ie.commercial.disputes.summary=Ιρλανδικό δίκαιο και ιρλανδικά δικαστήρια· αιτήσεις νέας μίσθωσης στο δικαστήριο βάσει του νόμου του 1980.
# ===== end IE =====


# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Συμβαλλόμενοι
lease.it.residential.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή ή τους μισθωτές με φορολογικό κωδικό και στοιχεία ταυτότητας· οι συμμισθωτές ευθύνονται εις ολόκληρον· απαιτείται έγγραφος τύπος.
lease.it.residential.premises.title=Μίσθιο
lease.it.residential.premises.summary=Περιγράφει την κατοικία με τα κτηματολογικά στοιχεία και τα παραρτήματα· υπόδειγμα για ελεύθερα συμφωνημένο μίσθωμα (4 + 4 έτη), όχι για συμβάσεις συμφωνημένου μισθώματος, προσωρινές ή φοιτητικές.
lease.it.residential.term.title=Διάρκεια
lease.it.residential.term.summary=Τουλάχιστον 4 έτη (ή μεγαλύτερη συμφωνημένη διάρκεια), ανανεώνεται για άλλα 4 εκτός αν ο εκμισθωτής αρνηθεί για τους νόμιμους λόγους· στη δεύτερη λήξη διαδικασία ανανέωσης με συστημένη επιστολή τουλάχιστον 6 μήνες πριν.
lease.it.residential.rent.title=Μίσθωμα
lease.it.residential.rent.summary=Μίσθωμα που συμφωνούν τα μέρη· κάθε συμφωνία για μίσθωμα ανώτερο από εκείνο της έγγραφης και καταχωρισμένης σύμβασης είναι άκυρη.
lease.it.residential.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.it.residential.rent-adjustment.summary=Προαιρετική ετήσια αναπροσαρμογή κατά συμφωνημένο ποσοστό της μεταβολής του δείκτη ISTAT· αναστέλλεται αν ο εκμισθωτής επιλέξει τη cedolare secca.
lease.it.residential.service-costs.title=Κοινόχρηστες δαπάνες
lease.it.residential.service-costs.summary=Νόμιμη κατανομή των δαπανών σε βάρος του μισθωτή εκτός αντίθετης συμφωνίας· πληρωμή εντός 2 μηνών από την αίτηση, με δικαίωμα ανάλυσης και δικαιολογητικών.
lease.it.residential.deposit.title=Εγγύηση
lease.it.residential.deposit.summary=Προαιρετική εγγύηση έως 3 μηνιαία μισθώματα, με νόμιμους τόκους καταβαλλόμενους ετησίως· επιστρέφεται στο τέλος μετά την αφαίρεση των οφειλών.
lease.it.residential.payment.title=Πληρωμή
lease.it.residential.payment.summary=Περιοδική πληρωμή με τραπεζική μεταφορά τη συμφωνημένη ημέρα· με την επιφύλαξη της δικαστικής προθεσμίας εξόφλησης του άρθρου 55, μίσθωμα απλήρωτο 20 ημέρες μετά τη λήξη αποτελεί λόγο λύσης.
lease.it.residential.use.title=Χρήση
lease.it.residential.use.summary=Χρήση αποκλειστικά ως κατοικία με την απαιτούμενη επιμέλεια· ο εκμισθωτής μπορεί να ζητήσει τη λύση εντός 3 μηνών από τη γνώση αλλαγής χρήσης.
lease.it.residential.subletting.title=Υπεκμίσθωση
lease.it.residential.subletting.summary=Όχι ολική υπεκμίσθωση ή εκχώρηση χωρίς συναίνεση· μερική υπεκμίσθωση επιτρέπεται μετά από συστημένη επιστολή, εκτός αντίθετης συμφωνίας.
lease.it.residential.maintenance.title=Συντήρηση και επισκευές
lease.it.residential.maintenance.summary=Ο εκμισθωτής εκτελεί τις αναγκαίες επισκευές, ο μισθωτής τη μικροσυντήρηση· επείγουσες επισκευές, μείωση μισθώματος για μακροχρόνιες εργασίες· ο χρήστης ευθύνεται για την εγκατάσταση θέρμανσης.
lease.it.residential.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.it.residential.energy-certificate.summary=Ο μισθωτής δηλώνει ότι έλαβε τις πληροφορίες και τα έγγραφα για το APE· κωδικός και κατηγορία του πιστοποιητικού· νόμιμα πρόστιμα σε περίπτωση παράλειψης.
lease.it.residential.registration.title=Καταχώριση και φόροι
lease.it.residential.registration.summary=Ο εκμισθωτής καταχωρίζει τη σύμβαση εντός 30 ημερών και ενημερώνει τον μισθωτή και τον διαχειριστή· δαπάνες κατά το ήμισυ· προαιρετική cedolare secca.
lease.it.residential.succession.title=Διαδοχή
lease.it.residential.succession.summary=Σύζυγος, κληρονόμοι, συγκατοικούντες συγγενείς και σύντροφοι μπορούν να υπεισέλθουν σε περίπτωση θανάτου του μισθωτή· κανόνες για διάσταση και διαζύγιο.
lease.it.residential.handover-inspection.title=Παράδοση και απόδοση
lease.it.residential.handover-inspection.summary=Πρωτόκολλο παράδοσης στην αρχή· απόδοση στην ίδια κατάσταση εκτός της συνήθους φθοράς· το συμφωνημένο αντάλλαγμα οφείλεται έως την απόδοση σε περίπτωση υπερημερίας.
lease.it.residential.termination.title=Αποχώρηση και άρνηση ανανέωσης
lease.it.residential.termination.summary=Ο μισθωτής μπορεί να αποχωρήσει για σοβαρούς λόγους με προειδοποίηση 6 μηνών· ο εκμισθωτής μπορεί να αρνηθεί την ανανέωση στην πρώτη λήξη μόνο για τους νόμιμους λόγους.
lease.it.residential.notices.title=Κοινοποιήσεις
lease.it.residential.notices.summary=Συστημένη επιστολή όπου το απαιτεί ο νόμος· διευθύνσεις και πιστοποιημένα ηλεκτρονικά ταχυδρομεία για τις κοινοποιήσεις.
lease.it.residential.guarantor.title=Εγγυητής
lease.it.residential.guarantor.summary=Προαιρετική εγγύηση έως ανώτατο ποσό, εις ολόκληρον· επέκταση πέραν της πρώτης λήξης μόνο αν συμφωνηθεί.
lease.it.residential.data-protection.title=Προστασία δεδομένων
lease.it.residential.data-protection.summary=Τα προσωπικά δεδομένα υποβάλλονται σε επεξεργασία μόνο για τη μίσθωση και τις νόμιμες υποχρεώσεις, σύμφωνα με τον ΓΚΠΔ και τον ιταλικό κώδικα προστασίας δεδομένων.
lease.it.residential.disputes.title=Διαφορές
lease.it.residential.disputes.summary=Ιταλικό δίκαιο· δικαστήριο του τόπου του ακινήτου· υποχρεωτική διαμεσολάβηση πριν από τις περισσότερες μισθωτικές αγωγές.
lease.it.commercial.parties.title=Συμβαλλόμενοι
lease.it.commercial.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή με εταιρικά, φορολογικά στοιχεία και ΑΦΜ ΦΠΑ, αριθμό μητρώου επιχειρήσεων και νόμιμο εκπρόσωπο.
lease.it.commercial.premises.title=Μίσθιο
lease.it.commercial.premises.summary=Περιγράφει τον χώρο με τα κτηματολογικά στοιχεία και τη δηλωμένη χρήση· όχι για κατοικίες ή εποχικές μισθώσεις.
lease.it.commercial.permitted-use.title=Επιτρεπόμενη χρήση
lease.it.commercial.permitted-use.summary=Ασκούμενη δραστηριότητα και ένδειξη άμεσης επαφής με το κοινό· άδειες με δαπάνη του μισθωτή· κανόνες για αλλαγή χρήσης.
lease.it.commercial.term.title=Διάρκεια και ανανέωση
lease.it.commercial.term.summary=Τουλάχιστον 6 έτη (9 για ξενοδοχεία και θέατρα) με σιωπηρή ανανέωση· άρνηση του εκμισθωτή μόνο στην πρώτη λήξη για τους νόμιμους λόγους, 12 ή 18 μήνες πριν.
lease.it.commercial.rent.title=Μίσθωμα
lease.it.commercial.rent.summary=Μίσθωμα που συμφωνούν τα μέρη· άκυρες οι συμφωνίες που παρέχουν στον εκμισθωτή πλεονεκτήματα αντίθετα στον νόμο 392/1978.
lease.it.commercial.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.it.commercial.rent-adjustment.summary=Προαιρετική ετήσια αναπροσαρμογή κατόπιν αιτήματος του εκμισθωτή· αυξήσεις έως 75% της μεταβολής του δείκτη ISTAT για συμβάσεις που δεν υπερβαίνουν τη νόμιμη διάρκεια.
lease.it.commercial.service-costs.title=Κοινόχρηστες δαπάνες
lease.it.commercial.service-costs.summary=Νόμιμη κατανομή των δαπανών εκτός αντίθετης συμφωνίας· πληρωμή εντός 2 μηνών από την αίτηση, με δικαίωμα ανάλυσης και δικαιολογητικών.
lease.it.commercial.vat.title=ΦΠΑ
lease.it.commercial.vat.summary=Η μίσθωση απαλλάσσεται από ΦΠΑ εκτός αν ο εκμισθωτής επιλέξει τη φορολόγηση για επαγγελματικά ακίνητα· αναγράφονται η επιλογή και ο συντελεστής.
lease.it.commercial.deposit.title=Εγγύηση
lease.it.commercial.deposit.summary=Προαιρετική εγγύηση έως 3 μηνιαία μισθώματα, με νόμιμους τόκους καταβαλλόμενους ετησίως· επιστρέφεται στο τέλος μετά την αφαίρεση των οφειλών.
lease.it.commercial.payment.title=Πληρωμή
lease.it.commercial.payment.summary=Περιοδική πληρωμή με τραπεζική μεταφορά τη συμφωνημένη ημέρα· απόδειξη ή τιμολόγιο· λύση μόνο για αθέτηση που δεν είναι ήσσονος σημασίας.
lease.it.commercial.maintenance.title=Συντήρηση και επισκευές
lease.it.commercial.maintenance.summary=Ο εκμισθωτής εκτελεί τις αναγκαίες επισκευές, ο μισθωτής τη μικροσυντήρηση εκτός αντίθετης συμφωνίας· επείγουσες επισκευές, μείωση μισθώματος για μακροχρόνιες εργασίες.
lease.it.commercial.alterations.title=Εργασίες και διαμόρφωση
lease.it.commercial.alterations.summary=Εργασίες μόνο με έγγραφη συναίνεση του εκμισθωτή· νόμιμοι κανόνες για αποζημίωση βελτιώσεων και αφαίρεση προσθηκών.
lease.it.commercial.assignment.title=Υπεκμίσθωση και εκχώρηση
lease.it.commercial.assignment.summary=Υπεκμίσθωση ή εκχώρηση χωρίς συναίνεση μαζί με την επιχείρηση, με δικαίωμα αντίθεσης του εκμισθωτή για σοβαρούς λόγους εντός 30 ημερών· αλλιώς απαιτείται συναίνεση.
lease.it.commercial.pre-emption.title=Δικαίωμα προτίμησης
lease.it.commercial.pre-emption.summary=Δικαίωμα προτίμησης και εξαγοράς του μισθωτή σε πώληση και σε νέα μίσθωση, εκτός από χώρους χωρίς επαφή με το κοινό και άλλες εξαιρούμενες περιπτώσεις.
lease.it.commercial.goodwill-compensation.title=Αποζημίωση για απώλεια πελατείας
lease.it.commercial.goodwill-compensation.summary=18 μηνιαία μισθώματα (21 για ξενοδοχεία) όταν η μίσθωση λήγει για λόγο άλλο από αθέτηση, καταγγελία, αποχώρηση ή διαδικασία αφερεγγυότητας του μισθωτή· όχι για χώρους χωρίς επαφή με το κοινό και άλλες εξαιρούμενες περιπτώσεις.
lease.it.commercial.insurance.title=Ασφάλιση
lease.it.commercial.insurance.summary=Ο μισθωτής ευθύνεται για απώλεια και ζημίες από πυρκαγιά εκτός αν δεν βαρύνεται με υπαιτιότητα· ασφάλιση αστικής ευθύνης του μισθωτή και ασφάλιση του κτιρίου από τον εκμισθωτή.
lease.it.commercial.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.it.commercial.energy-certificate.summary=Ο μισθωτής δηλώνει ότι έλαβε τις πληροφορίες και τα έγγραφα για το APE, με αντίγραφο συνημμένο όπου απαιτείται· νόμιμα πρόστιμα σε περίπτωση παράλειψης.
lease.it.commercial.registration.title=Καταχώριση και φόροι
lease.it.commercial.registration.summary=Καταχώριση εντός 30 ημερών, δαπάνες κατά το ήμισυ· φόρος καταχώρισης 1% ή 2%· η cedolare secca δεν εφαρμόζεται.
lease.it.commercial.handover-inspection.title=Παράδοση και απόδοση
lease.it.commercial.handover-inspection.summary=Πρωτόκολλο παράδοσης στην αρχή· απόδοση στην ίδια κατάσταση εκτός της συνήθους φθοράς· το συμφωνημένο αντάλλαγμα οφείλεται έως την απόδοση σε περίπτωση υπερημερίας.
lease.it.commercial.termination.title=Αποχώρηση και λύση
lease.it.commercial.termination.summary=Ο μισθωτής μπορεί να αποχωρήσει για σοβαρούς λόγους με προειδοποίηση 6 μηνών και, αν συμφωνηθεί, οποτεδήποτε με την ίδια προειδοποίηση· άρνηση του εκμισθωτή μόνο στην πρώτη λήξη· λύση λόγω αθέτησης.
lease.it.commercial.notices.title=Κοινοποιήσεις
lease.it.commercial.notices.summary=Συστημένη επιστολή ή επίδοση με δικαστικό επιμελητή όπου το απαιτεί ο νόμος· διευθύνσεις και πιστοποιημένο ηλεκτρονικό ταχυδρομείο.
lease.it.commercial.guarantor.title=Εγγυοδοσία
lease.it.commercial.guarantor.summary=Προαιρετική προσωπική, τραπεζική ή ασφαλιστική εγγύηση έως ανώτατο ποσό· επέκταση πέραν της πρώτης λήξης μόνο αν συμφωνηθεί.
lease.it.commercial.data-protection.title=Προστασία δεδομένων
lease.it.commercial.data-protection.summary=Τα δεδομένα των προσώπων που ενεργούν για τα μέρη υποβάλλονται σε επεξεργασία μόνο για τη μίσθωση, σύμφωνα με τον ΓΚΠΔ και τον ιταλικό κώδικα προστασίας δεδομένων.
lease.it.commercial.disputes.title=Διαφορές
lease.it.commercial.disputes.summary=Ιταλικό δίκαιο· δικαστήριο του τόπου του ακινήτου· υποχρεωτική διαμεσολάβηση πριν από τις περισσότερες μισθωτικές αγωγές.
