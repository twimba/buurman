lease.dk.residential.parties.title=Συμβαλλόμενα μέρη
lease.dk.residential.parties.summary=Προσδιορίζει τον εκμισθωτή και τον ή τους μισθωτές· οι συμμισθωτές ευθύνονται εις ολόκληρον.
lease.dk.residential.premises.title=Μίσθιο
lease.dk.residential.premises.summary=Η μισθωμένη κατοικία, η εφαρμογή του δανικού νόμου για τις μισθώσεις και η επισήμανση ότι δεν πρόκειται για το εγκεκριμένο τυποποιημένο έντυπο (typeformular A).
