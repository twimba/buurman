lease.gb.residential.parties.title=Συμβαλλόμενοι
lease.gb.residential.parties.summary=Προσδιορίζει τον εκμισθωτή και τον ή τους μισθωτές· οι συμμισθωτές ευθύνονται εις ολόκληρον· στην Ουαλία ο μισθωτής είναι ο contract-holder.
lease.gb.residential.premises.title=Μίσθιο
lease.gb.residential.premises.summary=Περιγράφει την εκμισθούμενη κατοικία και το καθεστώς του έθνους: assured tenancy (Αγγλία), standard occupation contract (Ουαλία), private residential tenancy (Σκωτία) ή private tenancy (Βόρεια Ιρλανδία).
lease.gb.residential.term.title=Διάρκεια
lease.gb.residential.term.summary=Ημερομηνία έναρξης· περιοδική μίσθωση χωρίς ορισμένη διάρκεια στην Αγγλία και τη Σκωτία, περιοδική ή ορισμένου χρόνου στην Ουαλία και τη Βόρεια Ιρλανδία.
lease.gb.residential.rent.title=Μίσθωμα
lease.gb.residential.rent.summary=Το μίσθωμα και η περίοδος μισθώματος· στην Αγγλία η περίοδος μισθώματος δεν μπορεί να υπερβαίνει τον 1 μήνα.
lease.gb.residential.rent-adjustment.title=Αυξήσεις μισθώματος
lease.gb.residential.rent-adjustment.summary=Αύξηση μόνο στις περιπτώσεις που επιτρέπει ο νόμος: στην Αγγλία με ειδοποίηση κατά τη section 13 ή απόφαση του δικαιοδοτικού οργάνου· 2 μήνες στην Αγγλία και την Ουαλία, 3 μήνες στη Σκωτία και τη Βόρεια Ιρλανδία, το πολύ 1 αύξηση ανά έτος.
lease.gb.residential.service-costs.title=Λογαριασμοί και δημοτικός φόρος
lease.gb.residential.service-costs.summary=Λογαριασμοί κοινής ωφέλειας και council tax ή domestic rates που βαρύνουν τον μισθωτή, και τυχόν έξοδα που καταβάλλονται στον εκμισθωτή.
lease.gb.residential.deposit.title=Εγγύηση
lease.gb.residential.deposit.summary=Εγγύηση προστατευμένη σε εγκεκριμένο σύστημα· έως 5 ή 6 εβδομάδες μισθώματος στην Αγγλία, 2 μήνες μισθώματος στη Σκωτία και 1 μήνα μισθώματος στη Βόρεια Ιρλανδία.
lease.gb.residential.payment.title=Πληρωμή
lease.gb.residential.payment.summary=Ημερομηνία και τρόπος πληρωμής· στην Αγγλία κανένα μίσθωμα πριν από την περίοδο μισθώματος και τόκοι υπερημερίας έως 3% πάνω από το βασικό επιτόκιο.
lease.gb.residential.fees.title=Χρεώσεις και επιτρεπόμενες πληρωμές
lease.gb.residential.fees.summary=Μπορούν να ζητηθούν μόνο επιτρεπόμενες πληρωμές: Tenant Fees Act 2019 στην Αγγλία, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 στην Ουαλία.
lease.gb.residential.use.title=Χρήση και κατοικίδια
lease.gb.residential.use.summary=Χρήση ως κατοικία χωρίς αντικοινωνική συμπεριφορά· κατοικίδια με τη συναίνεση του εκμισθωτή, η οποία δεν αρνείται χωρίς εύλογο λόγο.
lease.gb.residential.subletting.title=Υπεκμίσθωση και εκχώρηση
lease.gb.residential.subletting.summary=Εκχώρηση, υπεκμίσθωση και φιλοξενούμενοι ενοικιαστές μόνο με τη συναίνεση του εκμισθωτή.
lease.gb.residential.maintenance.title=Επισκευές και καταλληλότητα
lease.gb.residential.maintenance.summary=Οι νόμιμες υποχρεώσεις επισκευής και καταλληλότητας του εκμισθωτή σε κάθε έθνος· ο μισθωτής αναφέρει τις βλάβες και επιτρέπει την πρόσβαση με ειδοποίηση 24 ωρών.
lease.gb.residential.safety.title=Ασφάλεια
lease.gb.residential.safety.summary=Έλεγχος ασφάλειας αερίου κάθε 12 μήνες, ηλεκτρολογικός έλεγχος τουλάχιστον κάθε 5 έτη, ανιχνευτές καπνού και μονοξειδίου του άνθρακα.
lease.gb.residential.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.gb.residential.energy-certificate.summary=Ο εκμισθωτής παρέχει έγκυρο πιστοποιητικό ενεργειακής απόδοσης· στην Αγγλία και την Ουαλία η κατοικία πρέπει να είναι τουλάχιστον κατηγορίας E.
lease.gb.residential.registration.title=Εγγραφή και άδειες
lease.gb.residential.registration.summary=Εγγραφή του εκμισθωτή στην Ουαλία, τη Σκωτία και τη Βόρεια Ιρλανδία και τυχόν άδεια που απαιτεί η τοπική αρχή.
lease.gb.residential.right-to-rent.title=Δικαίωμα μίσθωσης
lease.gb.residential.right-to-rent.summary=Έλεγχος του δικαιώματος διαμονής (right to rent) των ενήλικων ενοίκων, που ισχύει μόνο στην Αγγλία.
lease.gb.residential.statutory-information.title=Υποχρεωτικές πληροφορίες
lease.gb.residential.statutory-information.summary=Η γραπτή δήλωση, οι όροι ή οι πληροφορίες που οφείλει να παράσχει ο εκμισθωτής κατά το δίκαιο κάθε έθνους, και διεύθυνση για ειδοποιήσεις.
lease.gb.residential.handover-inspection.title=Απογραφή και απόδοση
lease.gb.residential.handover-inspection.summary=Απογραφή και καταγραφή της κατάστασης κατά την έναρξη· απόδοση της κατοικίας στο τέλος, εξαιρουμένης της συνήθους φθοράς.
lease.gb.residential.termination.title=Λήξη
lease.gb.residential.termination.summary=Η καταγγελία του μισθωτή και οι νόμιμοι λόγοι και ειδοποιήσεις του εκμισθωτή σε κάθε έθνος· καμία έξωση βάσει της section 21 στην Αγγλία.
lease.gb.residential.notices.title=Ειδοποιήσεις
lease.gb.residential.notices.summary=Γραπτές ειδοποιήσεις με επίδοση ιδιοχείρως, ταχυδρομικώς ή, όπου επιτρέπεται, με ηλεκτρονικό ταχυδρομείο.
lease.gb.residential.data-protection.title=Προστασία δεδομένων
lease.gb.residential.data-protection.summary=Επεξεργασία των προσωπικών δεδομένων του μισθωτή σύμφωνα με τον UK GDPR και τον Data Protection Act 2018.
lease.gb.residential.disputes.title=Εφαρμοστέο δίκαιο και διαφορές
lease.gb.residential.disputes.summary=Το δίκαιο και τα δικαστήρια ή διοικητικά δικαιοδοτικά όργανα του έθνους όπου βρίσκεται η κατοικία.
lease.gb.commercial.parties.title=Συμβαλλόμενοι
lease.gb.commercial.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή με αριθμό μητρώου εταιρείας, καταστατική έδρα και αριθμό ΦΠΑ.
lease.gb.commercial.premises.title=Μίσθιο
lease.gb.commercial.premises.summary=Περιγράφει τον επαγγελματικό χώρο, το εμβαδόν του και τα παρεχόμενα δικαιώματα.
lease.gb.commercial.permitted-use.title=Επιτρεπόμενη χρήση
lease.gb.commercial.permitted-use.summary=Η επιτρεπόμενη επαγγελματική χρήση· ο μισθωτής λαμβάνει πολεοδομικές και λοιπές άδειες.
lease.gb.commercial.term.title=Διάρκεια
lease.gb.commercial.term.summary=Ημερομηνία έναρξης, ορισμένος χρόνος ή περιοδική μίσθωση· εγγραφή μισθώσεων άνω των 7 ετών και φόρος συναλλαγών ακινήτων.
lease.gb.commercial.security-of-tenure.title=Προστασία παραμονής
lease.gb.commercial.security-of-tenure.summary=Δικαιώματα ανανέωσης κατά τον Landlord and Tenant Act 1954 (Αγγλία και Ουαλία) ή την Order του 1996 (Βόρεια Ιρλανδία), ο αποκλεισμός τους και η σιωπηρή παράταση (tacit relocation) στη Σκωτία.
lease.gb.commercial.rent.title=Μίσθωμα
lease.gb.commercial.rent.summary=Το μίσθωμα χωρίς ΦΠΑ, κοινόχρηστες δαπάνες και ασφάλιστρο.
lease.gb.commercial.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.gb.commercial.rent-adjustment.summary=Αναπροσαρμογή στο μίσθωμα της αγοράς ή βάσει δείκτη, προς τα πάνω ή προς τα κάτω, με καθορισμό από ανεξάρτητο εμπειρογνώμονα.
lease.gb.commercial.service-costs.title=Κοινόχρηστες δαπάνες
lease.gb.commercial.service-costs.summary=Εύλογο μερίδιο των δαπανών υπηρεσιών του κτιρίου, με προϋπολογισμό και ετήσια εκκαθάριση.
lease.gb.commercial.vat.title=ΦΠΑ
lease.gb.commercial.vat.summary=Όλα τα ποσά νοούνται χωρίς ΦΠΑ· ο ΦΠΑ οφείλεται εφόσον ο εκμισθωτής έχει επιλέξει τη φορολόγηση.
lease.gb.commercial.deposit.title=Εγγύηση μισθώματος
lease.gb.commercial.deposit.summary=Εγγύηση σε χωριστό έντοκο λογαριασμό, με κανόνες συμπλήρωσης και επιστροφής.
lease.gb.commercial.payment.title=Πληρωμή
lease.gb.commercial.payment.summary=Μίσθωμα προκαταβολικά χωρίς συμψηφισμό, τόκοι υπερημερίας και διαδικασία είσπραξης καθυστερούμενων εμπορικών μισθωμάτων στην Αγγλία και την Ουαλία.
lease.gb.commercial.maintenance.title=Επισκευές
lease.gb.commercial.maintenance.summary=Πλήρης ή εσωτερική υποχρέωση επισκευής, περιοριζόμενη από τυχόν καταγραφή της κατάστασης.
lease.gb.commercial.alterations.title=Μετατροπές
lease.gb.commercial.alterations.summary=Καμία δομική μετατροπή· λοιπές μετατροπές με συναίνεση· αποκατάσταση στη λήξη της μίσθωσης.
lease.gb.commercial.assignment.title=Εκχώρηση και υπεκμίσθωση
lease.gb.commercial.assignment.summary=Εκχώρηση και υπεκμίσθωση με συναίνεση που δεν αρνείται χωρίς εύλογο λόγο· κανόνες απαλλαγής και εγγύησης στην Αγγλία και την Ουαλία.
lease.gb.commercial.insurance.title=Ασφάλιση
lease.gb.commercial.insurance.summary=Ο εκμισθωτής ασφαλίζει το κτίριο και ανακτά το ασφάλιστρο· ο μισθωτής ασφαλίζει το περιεχόμενο και την αστική ευθύνη· αναστολή του μισθώματος μετά από ασφαλισμένη ζημία.
lease.gb.commercial.energy-certificate.title=Ενεργειακή απόδοση
lease.gb.commercial.energy-certificate.summary=Πιστοποιητικό ενεργειακής απόδοσης του μισθίου· ελάχιστη κατηγορία E για μη οικιακές μισθώσεις στην Αγγλία και την Ουαλία.
lease.gb.commercial.break-option.title=Δικαίωμα πρόωρης λύσης
lease.gb.commercial.break-option.summary=Δικαίωμα πρόωρης λύσης της μίσθωσης σε ορισμένη ημερομηνία, με προειδοποίηση και όρους.
lease.gb.commercial.handover-inspection.title=Κατάσταση και απόδοση
lease.gb.commercial.handover-inspection.summary=Καταγραφή της κατάστασης, απόδοση ελεύθερου μισθίου και όριο αποζημίωσης για έλλειψη επισκευών.
lease.gb.commercial.termination.title=Λήξη και έκπτωση
lease.gb.commercial.termination.summary=Έκπτωση (forfeiture ή irritancy) λόγω μη πληρωμής, παράβασης ή αφερεγγυότητας, υπό την επιφύλαξη νόμιμης ειδοποίησης και δικαστικής προστασίας.
lease.gb.commercial.notices.title=Ειδοποιήσεις
lease.gb.commercial.notices.summary=Γραπτές ειδοποιήσεις με επίδοση ιδιοχείρως ή με συστημένη επιστολή στην καταστατική έδρα.
lease.gb.commercial.guarantor.title=Εγγυητής
lease.gb.commercial.guarantor.summary=Εγγύηση των υποχρεώσεων του μισθωτή από εγγυητή.
lease.gb.commercial.data-protection.title=Προστασία δεδομένων
lease.gb.commercial.data-protection.summary=Επεξεργασία των προσωπικών δεδομένων των εκπροσώπων των μερών σύμφωνα με τον UK GDPR.
lease.gb.commercial.disputes.title=Εφαρμοστέο δίκαιο και διαφορές
lease.gb.commercial.disputes.summary=Το δίκαιο και τα δικαστήρια της δικαιοδοσίας όπου βρίσκεται το μίσθιο· διαιρετότητα των όρων.
