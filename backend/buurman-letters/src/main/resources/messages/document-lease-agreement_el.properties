lease.de.commercial.alterations.summary=Εργασίες και επιγραφές του μισθωτή μόνο με συναίνεση σε κειμενικό τύπο· αφαίρεση στη λήξη.
lease.de.commercial.subletting.title=Υπεκμίσθωση
lease.de.commercial.subletting.summary=Παραχώρηση σε τρίτους μόνο με άδεια· ειδικό δικαίωμα καταγγελίας σε περίπτωση άρνησης.
lease.de.commercial.competition.title=Προστασία από ανταγωνισμό
lease.de.commercial.competition.summary=Ο εκμισθωτής δεν εκμισθώνει σε ανταγωνιστή με την ίδια κύρια γκάμα.
lease.de.commercial.insurance.title=Ασφαλίσεις
lease.de.commercial.insurance.summary=Ο εκμισθωτής ασφαλίζει το κτίριο· ο μισθωτής τον εξοπλισμό του και την επαγγελματική αστική ευθύνη.
lease.de.commercial.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.de.commercial.energy-certificate.summary=Ο εκμισθωτής επιδεικνύει και παραδίδει το πιστοποιητικό ενεργειακής απόδοσης (GEG).
lease.de.commercial.handover-inspection.title=Παράδοση και απόδοση
lease.de.commercial.handover-inspection.summary=Πρωτόκολλα παράδοσης και απόδοσης, απόδοση εκκενωμένου μισθίου και παραγραφή 6 μηνών.
lease.de.commercial.termination.title=Καταγγελία
lease.de.commercial.termination.summary=Καταγγελία έως την 3η εργάσιμη ημέρα ενός τριμήνου για το τέλος του επόμενου τριμήνου· έκτακτη καταγγελία.
