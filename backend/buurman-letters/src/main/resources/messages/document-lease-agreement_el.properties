lease.cz.residential.maintenance.summary=Ο εκμισθωτής διατηρεί την κατοικία κατάλληλη για χρήση· ο μισθωτής καταβάλλει την τρέχουσα συντήρηση και τις μικροεπισκευές εντός των νόμιμων ορίων.
lease.cz.residential.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.cz.residential.energy-certificate.summary=Πιστοποιητικό ενεργειακής απόδοσης που επιδεικνύεται πριν από την υπογραφή και παραδίδεται το αργότερο κατά την υπογραφή.
lease.cz.residential.handover-inspection.title=Παράδοση και απόδοση
lease.cz.residential.handover-inspection.summary=Πρωτόκολλο παράδοσης στην αρχή και απόδοση της κατοικίας στην κατάσταση που παραλήφθηκε, λαμβανομένης υπόψη της συνήθους φθοράς.
lease.cz.residential.succession.title=Θάνατος του μισθωτή
lease.cz.residential.succession.summary=Μετάβαση της μίσθωσης σε μέλη του νοικοκυριού ή κληρονόμους με τον θάνατο του μισθωτή, με τα νόμιμα όριά της.
lease.cz.residential.termination.title=Λήξη
lease.cz.residential.termination.summary=Έγγραφη καταγγελία, προθεσμία 3 μηνών για τον μισθωτή στη μίσθωση αόριστης διάρκειας, νόμιμοι λόγοι του εκμισθωτή και δικαστικός έλεγχος της καταγγελίας.
lease.cz.residential.notices.title=Κοινοποιήσεις
lease.cz.residential.notices.summary=Έγγραφες κοινοποιήσεις στις αναφερόμενες διευθύνσεις και προαιρετική επίδοση μέσω θυρίδων δεδομένων (datové schránky).
lease.cz.residential.data-protection.title=Προστασία δεδομένων
lease.cz.residential.data-protection.summary=Επεξεργασία προσωπικών δεδομένων σύμφωνα με τον ΓΚΠΔ και τον τσεχικό νόμο για την προστασία δεδομένων.
lease.cz.residential.disputes.title=Εφαρμοστέο δίκαιο και διαφορές
lease.cz.residential.disputes.summary=Τσεχικό δίκαιο και τσεχικά δικαστήρια.
lease.cz.commercial.parties.title=Συμβαλλόμενοι
lease.cz.commercial.parties.summary=Εκμισθωτής και μισθωτής με αριθμούς ταυτοποίησης, οι διατάξεις για επαγγελματικούς χώρους, το κείμενο μόνο στα αγγλικά και η επικρατούσα εκδοχή αν υπογραφεί και τσεχική εκδοχή.
lease.cz.commercial.premises.title=Μίσθιο
lease.cz.commercial.premises.summary=Ο χώρος που εξυπηρετεί την επιχείρηση, τα κτηματολογικά του στοιχεία και τα δικαιώματα που περιλαμβάνονται.
lease.cz.commercial.permitted-use.title=Χρήση του μισθίου
lease.cz.commercial.permitted-use.summary=Η συμφωνημένη επιχειρηματική δραστηριότητα, τα όρια μεταβολής της και οι πινακίδες στο κτίριο.
lease.cz.commercial.term.title=Διάρκεια
lease.cz.commercial.term.summary=Ορισμένη ή αόριστη διάρκεια και ανανέωση της ορισμένης διάρκειας αν ο μισθωτής παραμείνει, εκτός αν αποκλειστεί.
lease.cz.commercial.rent.title=Μίσθωμα
lease.cz.commercial.rent.summary=Μηνιαίο μίσθωμα, χωριστά από τις πληρωμές για υπηρεσίες.
lease.cz.commercial.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.cz.commercial.rent-adjustment.summary=Ετήσια τιμαριθμική αναπροσαρμογή βάσει του δείκτη τιμών καταναλωτή ή άλλου συμφωνημένου μηχανισμού· οι κανόνες για κατοικίες δεν εφαρμόζονται.
lease.cz.commercial.service-costs.title=Υπηρεσίες
lease.cz.commercial.service-costs.summary=Υπηρεσίες του εκμισθωτή, μηνιαίες προκαταβολές και η εκκαθάρισή τους.
lease.cz.commercial.vat.title=ΦΠΑ
lease.cz.commercial.vat.summary=Η μίσθωση απαλλάσσεται από ΦΠΑ, εκτός αν ο εκμισθωτής επιλέξει τη φορολόγηση όταν εκμισθώνει σε άλλο υποκείμενο στον φόρο.
lease.cz.commercial.deposit.title=Εγγύηση
lease.cz.commercial.deposit.summary=Εγγύηση ή τραπεζική εγγυητική επιστολή στο συμφωνημένο ποσό, χωρίς νόμιμο όριο, που επιστρέφεται στο τέλος μετά την αφαίρεση των οφειλών.
lease.cz.commercial.payment.title=Πληρωμή
lease.cz.commercial.payment.summary=Μίσθωμα και προκαταβολές καταβάλλονται μηνιαίως προκαταβολικά, και τόκοι υπερημερίας.
lease.cz.commercial.maintenance.title=Συντήρηση και επισκευές
lease.cz.commercial.maintenance.summary=Τρέχουσα συντήρηση από τον μισθωτή, λοιπή συντήρηση και αναγκαίες επισκευές από τον εκμισθωτή, ελαττώματα και πρόσβαση.
lease.cz.commercial.alterations.title=Μεταβολές και διαμόρφωση
lease.cz.commercial.alterations.summary=Μεταβολές μόνο με προηγούμενη έγγραφη συναίνεση του εκμισθωτή, εκκαθάριση της υπεραξίας και αποκατάσταση.
lease.cz.commercial.subletting.title=Υπεκμίσθωση
lease.cz.commercial.subletting.summary=Υπεκμίσθωση μόνο με έγγραφη συναίνεση του εκμισθωτή· η μη εγκεκριμένη υπεκμίσθωση αποτελεί βαριά παράβαση.
lease.cz.commercial.assignment.title=Μεταβίβαση της μίσθωσης
lease.cz.commercial.assignment.summary=Μεταβίβαση της μίσθωσης μαζί με την επιχειρηματική δραστηριότητα, με προηγούμενη έγγραφη συναίνεση του εκμισθωτή.
lease.cz.commercial.insurance.title=Ασφάλιση
lease.cz.commercial.insurance.summary=Ασφάλιση του κτιρίου από τον εκμισθωτή· ο μισθωτής ασφαλίζει τη διαμόρφωση και τα εμπορεύματα και διαθέτει ασφάλιση αστικής ευθύνης.
lease.cz.commercial.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.cz.commercial.energy-certificate.summary=Πιστοποιητικό ενεργειακής απόδοσης που επιδεικνύεται πριν από την υπογραφή και παραδίδεται το αργότερο κατά την υπογραφή.
lease.cz.commercial.goodwill-compensation.title=Αποζημίωση για την πελατεία
lease.cz.commercial.goodwill-compensation.summary=Αποζημίωση για την πελατεία που αναλαμβάνεται όταν ο εκμισθωτής καταγγέλλει, εκτός μετά από βαριά παράβαση.
lease.cz.commercial.handover-inspection.title=Παράδοση και απόδοση
lease.cz.commercial.handover-inspection.summary=Πρωτόκολλο παράδοσης στην αρχή και απόδοση του εκκενωμένου χώρου στην κατάσταση που παραλήφθηκε.
lease.cz.commercial.termination.title=Λήξη
lease.cz.commercial.termination.summary=Νόμιμοι λόγοι και προθεσμία 3 μηνών στην ορισμένη διάρκεια, 6 ή 3 μήνες στην αόριστη, αντιρρήσεις και δικαστικός έλεγχος.
lease.cz.commercial.notices.title=Κοινοποιήσεις
lease.cz.commercial.notices.summary=Έγγραφες κοινοποιήσεις στις έδρες ή μέσω θυρίδων δεδομένων (datové schránky).
lease.cz.commercial.data-protection.title=Προστασία δεδομένων
lease.cz.commercial.data-protection.summary=Επεξεργασία προσωπικών δεδομένων εκπροσώπων και προσώπων επικοινωνίας σύμφωνα με τον ΓΚΠΔ.
lease.cz.commercial.disputes.title=Εφαρμοστέο δίκαιο και διαφορές
lease.cz.commercial.disputes.summary=Τσεχικό δίκαιο και τσεχικά δικαστήρια.
