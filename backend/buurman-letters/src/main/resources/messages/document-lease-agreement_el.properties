lease.de.commercial.term.summary=Ορισμένου ή αορίστου χρόνου· άνω του 1 έτους απαιτείται κειμενικός τύπος, αλλιώς ισχύει αορίστου χρόνου.
lease.de.commercial.rent.title=Μίσθωμα
lease.de.commercial.rent.summary=Το ελεύθερα συμφωνημένο καθαρό μίσθωμα, πλέον ΦΠΑ και προκαταβολών όπου έχει συμφωνηθεί.
