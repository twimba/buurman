# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Συμβαλλόμενοι
lease.nl.residential.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή· οι συμμισθωτές ευθύνονται εις ολόκληρον.
lease.nl.residential.premises.title=Μίσθιο
lease.nl.residential.premises.summary=Περιγράφει τη μισθωμένη κατοικία και εφαρμόζει το ολλανδικό δίκαιο μίσθωσης κατοικίας.
lease.nl.residential.term.title=Διάρκεια
lease.nl.residential.term.summary=Ημερομηνία έναρξης και αν η μίσθωση είναι αορίστου ή ορισμένου χρόνου.
lease.nl.residential.rent.title=Μίσθωμα
lease.nl.residential.rent.summary=Το βασικό μίσθωμα και το δικαίωμα του μισθωτή για έλεγχο από την επιτροπή μισθωμάτων.
lease.nl.residential.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.nl.residential.rent-adjustment.summary=Ετήσια αναπροσαρμογή, ποτέ πάνω από τη νόμιμη μέγιστη αύξηση.
lease.nl.residential.service-costs.title=Κοινόχρηστα
lease.nl.residential.service-costs.summary=Προκαταβολές για παροχές και υπηρεσίες με ετήσια εκκαθάριση.
lease.nl.residential.deposit.title=Εγγύηση
lease.nl.residential.deposit.summary=Εγγύηση έως δύο βασικά μισθώματα, επιστρέφεται εντός της νόμιμης προθεσμίας.
lease.nl.residential.payment.title=Πληρωμή
lease.nl.residential.payment.summary=Πότε και πώς καταβάλλεται το μίσθωμα, προκαταβολικά ανά περίοδο.
lease.nl.residential.use.title=Χρήση
lease.nl.residential.use.summary=Χρήση μόνο ως κατοικία, ως καλός μισθωτής, και μεταβολές στο μίσθιο.
lease.nl.residential.subletting.title=Υπεκμίσθωση
lease.nl.residential.subletting.summary=Υπεκμίσθωση μόνο με έγγραφη συναίνεση του εκμισθωτή, με την επιφύλαξη νόμιμων δικαιωμάτων.
lease.nl.residential.maintenance.title=Συντήρηση και επισκευές
lease.nl.residential.maintenance.summary=Ο εκμισθωτής αποκαθιστά ελαττώματα· ο μισθωτής κάνει τις μικρές επισκευές.
lease.nl.residential.energy-label.title=Ενεργειακή σήμανση
lease.nl.residential.energy-label.summary=Ο εκμισθωτής παραδίδει αντίγραφο της ισχύουσας ενεργειακής σήμανσης της κατοικίας.
lease.nl.residential.handover-inspection.title=Επιθεώρηση και παράδοση
lease.nl.residential.handover-inspection.summary=Πρακτικό κατάστασης στην έναρξη, προεπιθεώρηση και τελική επιθεώρηση στην παράδοση.
lease.nl.residential.termination.title=Λήξη
lease.nl.residential.termination.summary=Προθεσμίες καταγγελίας και οι νόμιμοι λόγοι καταγγελίας από τον εκμισθωτή.
lease.nl.residential.data-protection.title=Προστασία δεδομένων
lease.nl.residential.data-protection.summary=Επεξεργασία προσωπικών δεδομένων του μισθωτή σύμφωνα με τον ΓΚΠΔ.
lease.nl.residential.disputes.title=Διαφορές
lease.nl.residential.disputes.summary=Εφαρμόζεται το ολλανδικό δίκαιο· οι διαφορές πηγαίνουν στην επιτροπή μισθωμάτων ή στο δικαστήριο.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Συμβαλλόμενοι
lease.de.residential.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή· οι συμμισθωτές ευθύνονται εις ολόκληρον.
lease.de.residential.premises.title=Μίσθιο
lease.de.residential.premises.summary=Περιγράφει τη μισθωμένη κατοικία και εφαρμόζει το γερμανικό δίκαιο μίσθωσης κατοικίας (BGB).
lease.de.residential.term.title=Διάρκεια
lease.de.residential.term.summary=Ημερομηνία έναρξης· αορίστου χρόνου, ή ορισμένου χρόνου μόνο με νόμιμο λόγο που γνωστοποιείται εγγράφως.
lease.de.residential.rent.title=Μίσθωμα
lease.de.residential.rent.summary=Το καθαρό μίσθωμα και το ανώτατο όριο του αρχικού μισθώματος σε περιοχές με πιεσμένη αγορά κατοικίας.
lease.de.residential.rent-adjustment.title=Αύξηση μισθώματος
lease.de.residential.rent-adjustment.summary=Νόμιμες αυξήσεις έως το τοπικό συγκριτικό μίσθωμα, εντός του ανώτατου ορίου.
lease.de.residential.service-costs.title=Λειτουργικά έξοδα
lease.de.residential.service-costs.summary=Προκαταβολές για τα λειτουργικά έξοδα με ετήσια εκκαθάριση εντός της νόμιμης προθεσμίας.
lease.de.residential.deposit.title=Εγγύηση
lease.de.residential.deposit.summary=Εγγύηση έως 3 μηνιαία καθαρά μισθώματα, καταβλητέα σε δόσεις και κατατεθειμένη χωριστά.
lease.de.residential.payment.title=Πληρωμή
lease.de.residential.payment.summary=Το μίσθωμα καταβάλλεται προκαταβολικά, το αργότερο την 3η εργάσιμη ημέρα κάθε περιόδου.
lease.de.residential.use.title=Χρήση
lease.de.residential.use.summary=Χρήση μόνο ως κατοικία, επιμελής χρήση και μεταβολές μόνο με τη συναίνεση του εκμισθωτή.
lease.de.residential.subletting.title=Υπεκμίσθωση
lease.de.residential.subletting.summary=Παραχώρηση σε τρίτους μόνο με άδεια· νόμιμο δικαίωμα του μισθωτή να υπεκμισθώσει μέρος της κατοικίας.
lease.de.residential.maintenance.title=Συντήρηση και ελαττώματα
lease.de.residential.maintenance.summary=Ο εκμισθωτής συντηρεί την κατοικία· μείωση μισθώματος λόγω ελαττωμάτων· όχι αισθητικές επισκευές για τον μισθωτή.
lease.de.residential.minor-repairs.title=Μικροεπισκευές
lease.de.residential.minor-repairs.summary=Ο μισθωτής βαρύνεται με το κόστος μικροεπισκευών έως ποσό ανά περίπτωση και ανά έτος που συμπληρώνεται.
lease.de.residential.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.de.residential.energy-certificate.summary=Ο εκμισθωτής επιδεικνύει και παραδίδει το πιστοποιητικό ενεργειακής απόδοσης (GEG).
lease.de.residential.registration.title=Βεβαίωση εγκατάστασης
lease.de.residential.registration.summary=Ο εκμισθωτής βεβαιώνει την εγκατάσταση ώστε ο μισθωτής να δηλωθεί στην αρμόδια αρχή.
lease.de.residential.handover-inspection.title=Παράδοση και απόδοση
lease.de.residential.handover-inspection.summary=Πρωτόκολλα παράδοσης και απόδοσης, απόδοση της κατοικίας και παραγραφή 6 μηνών.
lease.de.residential.termination.title=Καταγγελία
lease.de.residential.termination.summary=Έγγραφη καταγγελία, νόμιμες προθεσμίες και το απαιτούμενο έννομο συμφέρον του εκμισθωτή.
lease.de.residential.data-protection.title=Προστασία δεδομένων
lease.de.residential.data-protection.summary=Επεξεργασία των προσωπικών δεδομένων του μισθωτή σύμφωνα με τον ΓΚΠΔ.
lease.de.residential.disputes.title=Διαφορές
lease.de.residential.disputes.summary=Εφαρμόζεται το γερμανικό δίκαιο· αποκλειστικά αρμόδιο είναι το τοπικό δικαστήριο (Amtsgericht) της τοποθεσίας της κατοικίας.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Συμβαλλόμενοι
lease.de.commercial.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή με αριθμό μητρώου, ΑΦΜ ΦΠΑ και εκπροσώπους.
