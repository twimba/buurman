# ===== NL-COMMERCIAL lease clause titles and summaries (country pack) =====
lease.nl.commercial.parties.title=Συμβαλλόμενοι
lease.nl.commercial.parties.summary=Προσδιορίζει τον εκμισθωτή και τον μισθωτή με αριθμό Εμπορικού Επιμελητηρίου, ΑΦΜ για ΦΠΑ και εκπροσώπους.
lease.nl.commercial.premises.title=Μίσθιο
lease.nl.commercial.premises.summary=Περιγράφει το επαγγελματικό ακίνητο και καταγράφει αν εφαρμόζεται το άρθρο 7:290 BW ή το άρθρο 7:230a BW.
lease.nl.commercial.permitted-use.title=Χρήση
lease.nl.commercial.permitted-use.summary=Η συμφωνημένη χρήση του μισθίου και οι άδειες για την επιχείρηση του μισθωτή, συμπεριλαμβανομένης της πυρασφάλειας.
lease.nl.commercial.term.title=Διάρκεια
lease.nl.commercial.term.summary=Έναρξη και διάρκεια: εκ του νόμου 5 συν 5 έτη για χώρους του άρθρου 7:290, ελεύθερα συμφωνημένη για άλλους επαγγελματικούς χώρους.
lease.nl.commercial.rent.title=Μίσθωμα
lease.nl.commercial.rent.summary=Ελεύθερα συμφωνημένο μίσθωμα χωρίς ΦΠΑ· για επαγγελματικούς χώρους δεν ισχύει νόμιμο ανώτατο μίσθωμα.
lease.nl.commercial.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.nl.commercial.rent-adjustment.summary=Ετήσια τιμαριθμική αναπροσαρμογή με βάση τον δείκτη τιμών καταναλωτή και, για χώρους του άρθρου 7:290, δικαστικός καθορισμός κατά το άρθρο 7:303 BW.
lease.nl.commercial.service-costs.title=Κοινόχρηστες δαπάνες
lease.nl.commercial.service-costs.summary=Προκαταβολές για τις δαπάνες υπηρεσιών και ετήσια εκκαθάριση των πραγματικών δαπανών.
lease.nl.commercial.vat.title=ΦΠΑ
lease.nl.commercial.vat.summary=Επιλογή μίσθωσης με ΦΠΑ, εφόσον ο μισθωτής έχει πλήρες ή σχεδόν πλήρες δικαίωμα έκπτωσης.
lease.nl.commercial.deposit.title=Εγγύηση
lease.nl.commercial.deposit.summary=Χρηματική εγγύηση ή τραπεζική εγγυητική επιστολή χωρίς νόμιμο ανώτατο όριο, που επιστρέφεται μετά την παράδοση.
lease.nl.commercial.payment.title=Πληρωμή
lease.nl.commercial.payment.summary=Ημέρα πληρωμής, χωρίς συμψηφισμό πλην της νόμιμης έκπτωσης δαπανών επισκευής, νόμιμοι τόκοι και έξοδα είσπραξης.
lease.nl.commercial.maintenance.title=Συντήρηση και επισκευές
lease.nl.commercial.maintenance.summary=Μεγάλη συντήρηση από τον εκμισθωτή, μικρές επισκευές και εσωτερική συντήρηση από τον μισθωτή, επείγουσες εργασίες.
lease.nl.commercial.alterations.title=Μετατροπές
lease.nl.commercial.alterations.summary=Μετατροπές του μισθίου μόνο με έγγραφη συναίνεση ή δικαστική άδεια, και αφαίρεσή τους στο τέλος.
lease.nl.commercial.subletting.title=Υπεκμίσθωση και μεταβίβαση
lease.nl.commercial.subletting.summary=Υπεκμίσθωση μόνο με συναίνεση· υποκατάσταση του αποκτώντος την επιχείρηση με δικαστική άδεια για χώρους του άρθρου 7:290.
lease.nl.commercial.insurance.title=Ασφάλιση και ευθύνη
lease.nl.commercial.insurance.summary=Ασφάλιση του κτιρίου από τον εκμισθωτή, ασφάλιση περιεχομένου και αστικής ευθύνης από τον μισθωτή, ευθύνη για ζημίες.
lease.nl.commercial.energy-label.title=Ενεργειακή σήμανση
lease.nl.commercial.energy-label.summary=Έγκυρη ενεργειακή σήμανση κατά τη μίσθωση και ελάχιστη ενεργειακή κατηγορία C για γραφεία, με την επιφύλαξη των νόμιμων εξαιρέσεων.
lease.nl.commercial.handover-inspection.title=Παράδοση
lease.nl.commercial.handover-inspection.summary=Πρωτόκολλο παράδοσης κατά την έναρξη και απόδοση του μισθίου στο τέλος της μίσθωσης.
lease.nl.commercial.termination.title=Λήξη
lease.nl.commercial.termination.summary=Καταγγελία με επίδοση δικαστικού επιμελητή ή συστημένη επιστολή, προστασία από την καταγγελία (άρθρο 7:290 BW) ή αναβολή της αποβολής (άρθρο 7:230a BW), πτώχευση.
lease.nl.commercial.data-protection.title=Προστασία δεδομένων
lease.nl.commercial.data-protection.summary=Επεξεργασία προσωπικών δεδομένων των μερών και των εκπροσώπων τους σύμφωνα με τον ΓΚΠΔ.
lease.nl.commercial.disputes.title=Εφαρμοστέο δίκαιο και διαφορές
lease.nl.commercial.disputes.summary=Ολλανδικό δίκαιο, ο ειρηνοδίκης (kantonrechter) και το δικαστήριο του τόπου όπου βρίσκεται το μίσθιο.
