lease.cz.residential.parties.title=Συμβαλλόμενοι
lease.cz.residential.parties.summary=Εκμισθωτής και μισθωτής, οι τσεχικές διατάξεις για τη μίσθωση κατοικίας, ο έγγραφος τύπος, το κείμενο μόνο στα αγγλικά και η επικρατούσα εκδοχή αν υπογραφεί και τσεχική εκδοχή.
lease.cz.residential.premises.title=Μίσθιο
lease.cz.residential.premises.summary=Η κατοικία που εκμισθώνεται για τις στεγαστικές ανάγκες του μισθωτή, τα κτηματολογικά της στοιχεία και οι χώροι και ο εξοπλισμός που περιλαμβάνονται.
lease.cz.residential.term.title=Διάρκεια
lease.cz.residential.term.summary=Ορισμένη ή αόριστη διάρκεια και ανανέωση της ορισμένης διάρκειας αν ο μισθωτής παραμείνει 3 μήνες χωρίς έγγραφη πρόσκληση αποχώρησης.
lease.cz.residential.rent.title=Μίσθωμα
lease.cz.residential.rent.summary=Μηνιαίο μίσθωμα ως σταθερό ποσό, χωριστά από τις πληρωμές για υπηρεσίες.
lease.cz.residential.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.cz.residential.rent-adjustment.summary=Συμφωνημένη ετήσια αύξηση ή η νόμιμη πρόταση έως το συγκρίσιμο συνήθες μίσθωμα, με ανώτατο όριο 20 % σε 3 έτη.
lease.cz.residential.service-costs.title=Υπηρεσίες
lease.cz.residential.service-costs.summary=Υπηρεσίες του εκμισθωτή, μηνιαίες προκαταβολές και η ετήσια εκκαθάριση κατά τον νόμο αριθ. 67/2013 Sb.
lease.cz.residential.deposit.title=Εγγύηση
lease.cz.residential.deposit.summary=Προαιρετική εγγύηση που μαζί με τυχόν ποινικές ρήτρες δεν μπορεί να υπερβαίνει 3 φορές το μηνιαίο μίσθωμα· επιστρέφεται με τόκους.
lease.cz.residential.payment.title=Πληρωμή
lease.cz.residential.payment.summary=Μίσθωμα και προκαταβολές καταβάλλονται μηνιαίως προκαταβολικά, έως την 5η ημέρα εκτός αν συμφωνηθεί μεταγενέστερη, και τόκοι υπερημερίας.
lease.cz.residential.use.title=Χρήση της κατοικίας
lease.cz.residential.use.summary=Προσήκουσα χρήση, εργασία στην κατοικία, κατοικίδια, νέα μέλη του νοικοκυριού και ειδοποίηση για μακρά απουσία.
