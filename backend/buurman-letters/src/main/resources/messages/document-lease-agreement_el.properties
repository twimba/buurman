lease.de.commercial.deposit.title=Εγγύηση
lease.de.commercial.deposit.summary=Χρηματική εγγύηση ή τραπεζική εγγυητική, χωρίς νόμιμο ανώτατο όριο για επαγγελματικούς χώρους.
lease.de.commercial.payment.title=Πληρωμή
lease.de.commercial.payment.summary=Προκαταβολική καταβολή έως την 3η εργάσιμη ημέρα· περιορισμός συμψηφισμού και εμπορικοί τόκοι υπερημερίας.
