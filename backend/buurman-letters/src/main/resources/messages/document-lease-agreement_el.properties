lease.be.residential.transfer.title=Μεταβίβαση της κατοικίας
lease.be.residential.transfer.summary=Ο αποκτών υπεισέρχεται στα δικαιώματα του εκμισθωτή· στις Βρυξέλλες η υποχρέωση ενημέρωσης και το δικαίωμα προτίμησης του μισθωτή.
lease.be.residential.termination.title=Λύση της μίσθωσης
lease.be.residential.termination.summary=Καταγγελία από τον μισθωτή και νόμιμοι λόγοι καταγγελίας του εκμισθωτή, αποζημιώσεις και κανόνες βραχυχρόνιας μίσθωσης, ανάλογα με την περιφέρεια.
lease.be.residential.annexes.title=Παραρτήματα
lease.be.residential.annexes.summary=Το περιφερειακό επεξηγηματικό παράρτημα ή σημείωμα και η καταγραφή κατά την είσοδο.
lease.be.residential.data-protection.title=Προστασία δεδομένων
lease.be.residential.data-protection.summary=Επεξεργασία των προσωπικών δεδομένων του μισθωτή σύμφωνα με τον ΓΚΠΔ και περιφερειακά όρια στα ζητούμενα στοιχεία.
lease.be.residential.disputes.title=Διαφορές
lease.be.residential.disputes.summary=Βελγικό δίκαιο και ειρηνοδίκης του τόπου της κατοικίας· οι ρήτρες διαιτησίας που συμφωνούνται εκ των προτέρων δεν έχουν αποτέλεσμα.
lease.be.commercial.parties.title=Συμβαλλόμενα μέρη
lease.be.commercial.parties.summary=Στοιχεία των επιχειρήσεων, των εκπροσώπων τους και των ΑΦΜ ΦΠΑ, και ο βελγικός νόμος για τις εμπορικές μισθώσεις.
lease.be.commercial.premises.title=Μίσθιο
lease.be.commercial.premises.summary=Διεύθυνση, εμβαδόν και περιγραφή, συμπεριλαμβανομένων χώρων κατοικίας ή βοηθητικών χώρων που υπάγονται στη νόμιμη διάρκεια.
lease.be.commercial.permitted-use.title=Χρήση
lease.be.commercial.permitted-use.summary=Λιανικό εμπόριο ή βιοτεχνία σε άμεση επαφή με το κοινό· πεδίο εφαρμογής του νόμου και μισθώσεις έως 1 έτος.
lease.be.commercial.term.title=Διάρκεια
lease.be.commercial.term.summary=Τουλάχιστον 9 έτη· ο μισθωτής μπορεί να καταγγείλει σε κάθε τριετία με προειδοποίηση 6 μηνών, ο εκμισθωτής μόνο αν έχει συμφωνηθεί.
lease.be.commercial.rent.title=Μίσθωμα
lease.be.commercial.rent.summary=Μίσθωμα χωρίς δαπάνες, επιβαρύνσεις και φόρους, ελεύθερα καθοριζόμενο.
lease.be.commercial.rent-adjustment.title=Τιμαριθμική αναπροσαρμογή και αναθεώρηση
lease.be.commercial.rent-adjustment.summary=Συμφωνημένη αναπροσαρμογή με βάση τον δείκτη υγείας 1 φορά τον χρόνο και δικαστική αναθεώρηση σε κάθε τριετία αν η αξία διαφέρει τουλάχιστον 15 %.
lease.be.commercial.service-costs.title=Δαπάνες και επιβαρύνσεις
lease.be.commercial.service-costs.summary=Περιοριστικός κατάλογος δαπανών, επιβαρύνσεων και φόρων που βαρύνουν τον μισθωτή, με εκκαθάριση τουλάχιστον ετησίως.
lease.be.commercial.vat.title=ΦΠΑ
lease.be.commercial.vat.summary=Μίσθωση κατ' αρχήν απαλλασσόμενη από ΦΠΑ, με δυνατότητα επιλογής μίσθωσης επαγγελματικών κτιρίων με ΦΠΑ.
lease.be.commercial.deposit.title=Εγγύηση μίσθωσης
lease.be.commercial.deposit.summary=Εγγύηση στο συμφωνημένο ποσό και μορφή· δεν υπάρχει νόμιμο ανώτατο όριο για τις εμπορικές μισθώσεις.
lease.be.commercial.payment.title=Πληρωμή
lease.be.commercial.payment.summary=Πληρωμή ανά δόση με τραπεζική μεταφορά τη συμφωνημένη ημέρα· νόμιμος τόκος μετά από όχληση.
lease.be.commercial.maintenance.title=Συντήρηση και επισκευές
lease.be.commercial.maintenance.summary=Επισκευές του εκμισθωτή και του μισθωτή κατά τον προηγούμενο βελγικό Αστικό Κώδικα, εκτός αν συμφωνηθεί διαφορετικά.
lease.be.commercial.alterations.title=Μετατροπές
lease.be.commercial.alterations.summary=Δικαίωμα του μισθωτή σε μετατροπές έως 3 ετήσια μισθώματα μετά από ειδοποίηση, αντίρρηση του εκμισθωτή εντός 30 ημερών και τύχη τους στη λήξη.
lease.be.commercial.assignment.title=Εκχώρηση και υπεκμίσθωση
lease.be.commercial.assignment.summary=Απαιτείται συναίνεση, εκτός από εκχώρηση ή υπεκμίσθωση μαζί με την επιχείρηση, με την επιφύλαξη αντίρρησης εντός 30 ημερών.
lease.be.commercial.insurance.title=Ασφάλιση
lease.be.commercial.insurance.summary=Ο μισθωτής ασφαλίζει την ευθύνη του και το περιεχόμενο, ο εκμισθωτής ασφαλίζει το κτίριο.
lease.be.commercial.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.be.commercial.energy-certificate.summary=Πιστοποιητικό ενεργειακής απόδοσης όταν το απαιτούν οι περιφερειακοί κανόνες, με αριθμό, ημερομηνία και κατηγορία.
lease.be.commercial.registration.title=Καταχώριση
lease.be.commercial.registration.summary=Καταχώριση κατά τη φορολογική νομοθεσία, που προσδίδει βέβαιη χρονολογία στη μίσθωση· μέρος που βαρύνεται με τα τέλη.
lease.be.commercial.handover-inspection.title=Κατάσταση του ακινήτου
lease.be.commercial.handover-inspection.summary=Κοινή λεπτομερής καταγραφή, προσαρτημένη και καταχωρισμένη· απόδοση στην κατάσταση που παραλήφθηκε.
lease.be.commercial.renewal.title=Ανανέωση
lease.be.commercial.renewal.summary=Δικαίωμα σε 3 ανανεώσεις 9 ετών, αίτηση 18 έως 15 μήνες πριν από τη λήξη, λόγοι άρνησης και αποζημίωση αποβολής.
lease.be.commercial.transfer.title=Μεταβίβαση του μισθίου
lease.be.commercial.transfer.summary=Ο αποκτών μπορεί να αποβάλει τον μισθωτή μόνο για νόμιμους λόγους, με προειδοποίηση 1 έτους εντός 3 μηνών.
lease.be.commercial.termination.title=Λύση της μίσθωσης
lease.be.commercial.termination.summary=Λήξη σε τριετία, μίσθωση αορίστου χρόνου μετά την απώλεια του δικαιώματος ανανέωσης, δικαστική λύση λόγω παράβασης.
lease.be.commercial.data-protection.title=Προστασία δεδομένων
lease.be.commercial.data-protection.summary=Επεξεργασία των προσωπικών δεδομένων των μερών και των εκπροσώπων τους σύμφωνα με τον ΓΚΠΔ.
lease.be.commercial.disputes.title=Διαφορές
lease.be.commercial.disputes.summary=Βελγικό δίκαιο και ειρηνοδίκης του τόπου του μισθίου· δυνατή η προηγούμενη συμβιβαστική επίλυση.
