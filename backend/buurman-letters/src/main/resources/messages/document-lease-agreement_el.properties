lease.pt.commercial.premises.summary=Περιγράφει το μίσθιο για χρήση άλλη από κατοικία, την κτηματολογική εγγραφή και την άδεια χρήσης.
lease.pt.commercial.permitted-use.title=Επιτρεπόμενη χρήση
lease.pt.commercial.permitted-use.summary=Δραστηριότητα του μισθωτή, πραγματική χρήση του μισθίου και άδειες που απαιτούνται για τη δραστηριότητα.
lease.pt.commercial.term.title=Διάρκεια
lease.pt.commercial.term.summary=Ελεύθερα συμφωνημένη διάρκεια και ανανέωση· συμπληρωματικοί κανόνες του νόμου και αδυναμία εναντίωσης του εκμισθωτή στην ανανέωση τα πρώτα 5 έτη.
lease.pt.commercial.rent.title=Μίσθωμα
lease.pt.commercial.rent.summary=Ελεύθερα συμφωνημένο μίσθωμα, πλέον ΦΠΑ σε περίπτωση παραίτησης από την απαλλαγή.
lease.pt.commercial.rent-adjustment.title=Αναπροσαρμογή μισθώματος
lease.pt.commercial.rent-adjustment.summary=Ετήσια αναπροσαρμογή όπως συμφωνήθηκε εγγράφως ή, ελλείψει συμφωνίας, βάσει του επίσημου συντελεστή αναπροσαρμογής.
lease.pt.commercial.service-costs.title=Βάρη και δαπάνες
lease.pt.commercial.service-costs.summary=Βάρη και δαπάνες όπως συμφωνήθηκαν εγγράφως· άλλως οι παροχές βαρύνουν τον μισθωτή και τα κοινόχρηστα τον εκμισθωτή.
lease.pt.commercial.vat.title=ΦΠΑ και παρακράτηση
lease.pt.commercial.vat.summary=Απαλλαγή από ΦΠΑ με δυνατότητα παραίτησης και παρακράτηση φόρου από μισθωτές με οργανωμένα λογιστικά βιβλία.
lease.pt.commercial.deposit.title=Εγγύηση
lease.pt.commercial.deposit.summary=Προαιρετική εγγύηση έως 2 μισθώματα, που επιστρέφεται στο τέλος αφού αφαιρεθούν τα οφειλόμενα ποσά.
lease.pt.commercial.payment.title=Καταβολή
lease.pt.commercial.payment.summary=Καταβολή με τραπεζική μεταφορά, προκαταβολή έως 2 μηνών και αποζημίωση 20 % σε περίπτωση καθυστέρησης.
lease.pt.commercial.maintenance.title=Συντήρηση
lease.pt.commercial.maintenance.summary=Εργασίες συντήρησης κατ' ελεύθερη συμφωνία, άλλως από τον εκμισθωτή.
lease.pt.commercial.alterations.title=Μετατροπές
lease.pt.commercial.alterations.summary=Εργασίες διαμόρφωσης του μισθωτή μόνο με έγγραφη άδεια· αποζημίωση στο τέλος της μίσθωσης.
lease.pt.commercial.assignment.title=Εκχώρηση και μεταβίβαση επιχείρησης
lease.pt.commercial.assignment.summary=Μεταβίβαση της μίσθωσης μαζί με την επιχείρηση χωρίς συναίνεση, προτίμηση του εκμισθωτή, υπομίσθωση και θάνατος του μισθωτή.
lease.pt.commercial.pre-emption.title=Δικαίωμα προτίμησης
lease.pt.commercial.pre-emption.summary=Δικαίωμα προτίμησης του μισθωτή σε πώληση μετά από 2 έτη μίσθωσης και θέση του αποκτώντος.
lease.pt.commercial.insurance.title=Ασφάλιση
lease.pt.commercial.insurance.summary=Ασφάλιση αστικής ευθύνης και περιεχομένου του μισθωτή· ασφάλιση του κτιρίου από τον εκμισθωτή.
lease.pt.commercial.energy-certificate.title=Πιστοποιητικό ενεργειακής απόδοσης
lease.pt.commercial.energy-certificate.summary=Πιστοποιητικό ενεργειακής απόδοσης που παραδόθηκε πριν από τη σύναψη της σύμβασης, με αριθμό και ενεργειακή κατηγορία.
lease.pt.commercial.registration.title=Δήλωση στη φορολογική αρχή και τέλος χαρτοσήμου
lease.pt.commercial.registration.summary=Δήλωση της μίσθωσης στη φορολογική αρχή και τέλος χαρτοσήμου που βαρύνει τον εκμισθωτή.
lease.pt.commercial.handover-inspection.title=Παράδοση και απόδοση
lease.pt.commercial.handover-inspection.summary=Περιγραφή της κατάστασης του μισθίου, απόδοση στο τέλος, επισκέψεις και καθυστερημένη απόδοση.
lease.pt.commercial.termination.title=Λήξη
lease.pt.commercial.termination.summary=Καταγγελία, περιορισμένοι λόγοι και αποζημίωση σε καταγγελία από τον εκμισθωτή, λύση λόγω αθέτησης.
lease.pt.commercial.notices.title=Κοινοποιήσεις
lease.pt.commercial.notices.summary=Κοινοποιήσεις με συστημένη επιστολή με απόδειξη παραλαβής και οι συμφωνημένες διευθύνσεις.
lease.pt.commercial.guarantor.title=Εγγυητής
lease.pt.commercial.guarantor.summary=Εγγυητής των υποχρεώσεων του μισθωτή και υποχρέωση του εκμισθωτή να ενημερώσει τον εγγυητή για την υπερημερία.
lease.pt.commercial.data-protection.title=Προστασία δεδομένων
lease.pt.commercial.data-protection.summary=Επεξεργασία των προσωπικών δεδομένων των προσώπων που ενεργούν για τους συμβαλλομένους σύμφωνα με τον ΓΚΠΔ.
lease.pt.commercial.disputes.title=Εφαρμοστέο δίκαιο και διαφορές
lease.pt.commercial.disputes.summary=Πορτογαλικό δίκαιο, δικαστήριο του τόπου του μισθίου και ειδική διαδικασία αποβολής.
lease.rentComponent.BASE_RENT=Βασικό μίσθωμα
lease.rentComponent.UTILITIES_ADVANCE=Προκαταβολή κοινής ωφέλειας
lease.rentComponent.SERVICE_COSTS=Έξοδα υπηρεσιών
lease.rentComponent.HOA_FEES=Κοινόχρηστα
lease.rentComponent.FURNITURE_RENTAL=Μίσθωση επίπλων
lease.rentComponent.PARKING=Στάθμευση
lease.rentComponent.STORAGE=Αποθήκη
lease.rentComponent.GARBAGE_COLLECTION=Αποκομιδή απορριμμάτων
lease.rentComponent.OTHER=Άλλο


