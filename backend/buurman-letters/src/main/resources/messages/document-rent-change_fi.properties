rentchange.legal.NL=Tähän vuokrantarkistukseen sovelletaan Alankomaiden vuokralainsäädäntöä (art. 7:252-253 BW). Riidat voidaan saattaa Huurcommissie-lautakunnan käsiteltäväksi.
rentchange.legal.DE=Tämä vuokrantarkistus tehdään BGB:n §558 mukaisesti (Mieterhöhung bis zur ortsüblichen Vergleichsmiete). Kappungsgrenze (20 %:n/15 %:n katto kolmen vuoden aikana) voi tulla sovellettavaksi.
rentchange.legal.FR=Tähän vuokrantarkistukseen sovelletaan IRL-indeksiä (Indice de Référence des Loyers). Vuokrasääntelymääräyksiä (décret encadrement) voidaan soveltaa säännellyillä alueilla.
rentchange.legal.BE=Tämä vuokrantarkistus noudattaa kyseisen alueen Gezondheidsindex-indeksiä (terveysindeksi). Alueellisia asumissäännöksiä sovelletaan.
rentchange.legal.ES=Tähän vuokrantarkistukseen sovelletaan LAU:n art. 18 (actualización de renta). Väliaikaisia vuokrankorotuskattoja voidaan soveltaa.
rentchange.legal.PT=Tämä vuokrantarkistus noudattaa INE coeficiente de atualização -kerrointa. Sovelletaan NRAU:n art. 24 säännöksiä.
rentchange.legal.AT=Tähän vuokrantarkistukseen sovelletaan MRG:n §16 (angemessener Mietzins). Sovelletaan Richtwertmietzins-järjestelmää tai VPI/CPI-viitettä.
rentchange.legal.GB=Tähän vuokrantarkistukseen sovelletaan Housing Act 1988 -lain Section 13:n ilmoitusvaatimuksia. Sovelletaan vertailua markkinavuokraan.
rentchange.legal.IT=Tämä vuokrantarkistus noudattaa ISTAT FOI -indeksiä. Sovelletaan Legge 392/1978:n tai 431/1998:n säännöksiä.
rentchange.legal.SE=Tämä vuokrantarkistus noudattaa bruksvärdessystemet-järjestelmää (käyttöarvojärjestelmä). Sovelletaan Hyresgästföreningen-neuvotteluvaatimuksia.
rentchange.legal.DK=Tähän vuokrantarkistukseen sovelletaan Lejeloven-lakia. Kustannusperusteisia tai markkinaperusteisia sääntöjä sovelletaan rakennuksen luokituksen mukaan.
rentchange.legal.IE=Tähän vuokrantarkistukseen sovelletaan Residential Tenancies Act 2004 -lakia. RPZ:n 2 prosentin vuotuinen katto voi tulla sovellettavaksi.
rentchange.legal.PL=Tähän vuokrantarkistukseen sovelletaan siviililain art. 6851. Vaaditaan kirjallinen ilmoitus kolme kuukautta etukäteen.
rentchange.legal.FI=Tähän vuokrantarkistukseen sovelletaan asuinhuoneiston vuokrauksesta annettua lakia (481/1995). Tarkistukset määräytyvät sopimusehtojen mukaan.
rentchange.legal.NO=Tämä vuokrantarkistus noudattaa Husleieloven §4-2/§4-3. Sovelletaan kuluttajahintaindeksin mukaisia tarkistussääntöjä.
rentchange.legal.US=Tähän vuokrantarkistukseen sovelletaan sovellettavia osavaltion ja paikallisia määräyksiä. Vuokrasääntely voi tulla sovellettavaksi tietyillä lainkäyttöalueilla.
rentchange.legal.CA=Tämä vuokrantarkistus noudattaa sovellettavaa provinssin vuokralainsäädäntöä. Vuosittaisia ohjeellisia korotusrajoja voidaan soveltaa.
rentchange.legal.HU=Tämä vuokrantarkistus noudattaa Unkarin siviililain vuokrasäännöksiä. Tarkistukset määräytyvät sopimusehtojen mukaan.
rentchange.legal.CZ=Tähän vuokrantarkistukseen sovelletaan siviililain §2249. Korotukset vertailukelpoiseen vuokraan on rajoitettu 20 prosenttiin kolmen vuoden aikana.
rentchange.legal.CH=Tähän vuokrantarkistukseen sovelletaan Obligationenrecht art. 269a. Tarkistukset on sidottu viitekorkoon (Referenzzinssatz).
