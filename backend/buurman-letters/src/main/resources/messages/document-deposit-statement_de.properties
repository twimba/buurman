deposit.disclaimer=Diese Abrechnung erfolgt auf Grundlage des Mietvertrags. Gesetzliche Fristen und Streitverfahren zu Kautionen sind je nach Rechtsordnung unterschiedlich und bleiben unberührt.
deposit.legal.NL=Nach niederländischem Recht ist die Kaution innerhalb einer angemessenen Frist nach Mietende zurückzuzahlen; über streitige Abzüge können die Huurcommissie oder die Gerichte entscheiden.
deposit.legal.DE=Nach § 551 BGB ist die Kaution getrennt vom Vermögen des Vermieters anzulegen und innerhalb angemessener Frist (in der Regel bis zu sechs Monate) nach Mietende abzurechnen.
deposit.legal.FR=Nach Artikel 22 des Gesetzes 89-462 ist die Kaution innerhalb eines Monats (zwei Monate bei Abzügen) nach Rückgabe der Schlüssel zurückzuzahlen; bei verspäteter Rückzahlung fallen 10 % der Monatsmiete je Verzugsmonat an.
deposit.legal.BE=Die Kaution wurde gemäß dem regionalen Wohnraummietdekret auf einem gesperrten Konto auf den Namen des Mieters hinterlegt; die Freigabe erfordert die Zustimmung beider Parteien oder eine gerichtliche Entscheidung.
deposit.legal.ES=Nach Artikel 36 LAU ist die Kaution innerhalb eines Monats nach Rückgabe der Schlüssel zurückzuzahlen; danach fallen gesetzliche Zinsen an.
deposit.legal.PT=Nach dem portugiesischen Zivilgesetzbuch ist die Kaution (caução) am Ende des Mietverhältnisses nach Verrechnung etwaiger offener Beträge zurückzuzahlen.
deposit.legal.GB=Kautionen bei einer Assured Shorthold Tenancy in England und Wales müssen in einem staatlich anerkannten System geschützt werden; Streitigkeiten können dem kostenlosen Schlichtungsdienst dieses Systems vorgelegt werden.
deposit.legal.IT=Nach Artikel 11 des Gesetzes 392/1978 darf die Kaution (deposito cauzionale) drei Monatsmieten nicht übersteigen und ist jährlich mit gesetzlichen Zinsen an den Mieter zu verzinsen.
