# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Parties
lease.it.residential.parties.summary=Identifies the landlord and the tenant or tenants with tax code and personal details; co-tenants are jointly and severally liable; written form is required.
lease.it.residential.premises.title=Premises
lease.it.residential.premises.summary=Describes the dwelling with land register data and appurtenances; model for freely agreed rent (4 + 4 years), not for agreed-rent, transitory or student leases.
lease.it.residential.term.title=Term
lease.it.residential.term.summary=At least 4 years (or a longer agreed term), renewed for 4 more unless the landlord refuses on the statutory grounds; at the second expiry, renewal procedure by registered letter at least 6 months ahead.
lease.it.residential.rent.title=Rent
lease.it.residential.rent.summary=Rent agreed by the parties; any agreement for a rent above that of the written and registered agreement is void.
lease.it.residential.rent-adjustment.title=Rent update
lease.it.residential.rent-adjustment.summary=Optional annual update by an agreed share of the ISTAT index change; suspended if the landlord opts for the cedolare secca.
lease.it.residential.service-costs.title=Ancillary charges
lease.it.residential.service-costs.summary=Statutory allocation of service charges to the tenant unless otherwise agreed; payment within 2 months of the request with a right to a statement and documents.
lease.it.residential.deposit.title=Security deposit
lease.it.residential.deposit.summary=Optional deposit of at most 3 months' rent, bearing statutory interest paid yearly; returned at the end less sums owed.
lease.it.residential.payment.title=Payment
lease.it.residential.payment.summary=Periodic payment by bank transfer on the agreed day; subject to the court grace period of article 55, rent unpaid 20 days after the due date is a ground for termination.
lease.it.residential.use.title=Use
lease.it.residential.use.summary=Use exclusively as a dwelling with due diligence; the landlord may claim termination within 3 months of learning of a change of use.
lease.it.residential.subletting.title=Subletting
lease.it.residential.subletting.summary=No full subletting or assignment without consent; partial subletting allowed after notice by registered letter unless agreed otherwise.
lease.it.residential.maintenance.title=Maintenance and repairs
lease.it.residential.maintenance.summary=The landlord carries out necessary repairs, the tenant minor maintenance; urgent repairs, rent reduction for lengthy works; the occupant is responsible for the heating system.
lease.it.residential.energy-certificate.title=Energy performance certificate
lease.it.residential.energy-certificate.summary=The tenant confirms receipt of the APE information and documentation; certificate code and class; statutory fines if omitted.
lease.it.residential.registration.title=Registration and taxes
lease.it.residential.registration.summary=The landlord registers the lease within 30 days and informs the tenant and the condominium administrator; costs shared equally; optional cedolare secca.
lease.it.residential.succession.title=Succession
lease.it.residential.succession.summary=Spouse, heirs, cohabiting relatives and partners may succeed on the tenant's death; rules for separation and divorce.
lease.it.residential.handover-inspection.title=Handover and return
lease.it.residential.handover-inspection.summary=Handover report at the start; return in the same condition save normal wear; agreed rent due until return if in default.
lease.it.residential.termination.title=Withdrawal and refusal of renewal
lease.it.residential.termination.summary=The tenant may withdraw for serious reasons with 6 months' notice; the landlord may refuse renewal at the first expiry only on the statutory grounds.
lease.it.residential.notices.title=Notices
lease.it.residential.notices.summary=Registered letter where the law requires it; addresses and certified e-mail addresses for notices.
lease.it.residential.guarantor.title=Guarantor
lease.it.residential.guarantor.summary=Optional personal guarantee up to a maximum amount, jointly and severally liable; extension beyond the first expiry only if agreed.
lease.it.residential.data-protection.title=Data protection
lease.it.residential.data-protection.summary=Personal data processed only for the lease and legal obligations, under the GDPR and the Italian data protection code.
lease.it.residential.disputes.title=Disputes
lease.it.residential.disputes.summary=Italian law; court of the place of the property; mediation required before most lease actions.
lease.it.commercial.parties.title=Parties
lease.it.commercial.parties.summary=Identifies the landlord and the tenant with company, tax and VAT data, companies register number and legal representative.
lease.it.commercial.premises.title=Premises
lease.it.commercial.premises.summary=Describes the premises with land register data and the declared planning use; not for dwellings or seasonal leases.
lease.it.commercial.permitted-use.title=Permitted use
lease.it.commercial.permitted-use.summary=Activity carried on and whether it involves direct contact with the public; licences at the tenant's expense; rules on change of use.
lease.it.commercial.term.title=Term and renewal
lease.it.commercial.term.summary=At least 6 years (9 for hotels and theatres) with tacit renewal; the landlord may refuse renewal at the first expiry only on the statutory grounds, 12 or 18 months ahead.
lease.it.commercial.rent.title=Rent
lease.it.commercial.rent.summary=Rent agreed by the parties; agreements granting the landlord advantages contrary to Law 392/1978 are void.
lease.it.commercial.rent-adjustment.title=Rent update
lease.it.commercial.rent-adjustment.summary=Optional annual update at the landlord's request; increases limited to 75% of the ISTAT index change for leases not exceeding the statutory duration.
lease.it.commercial.service-costs.title=Ancillary charges
lease.it.commercial.service-costs.summary=Statutory allocation of service charges unless otherwise agreed; payment within 2 months of the request with a right to a statement and documents.
lease.it.commercial.vat.title=VAT
lease.it.commercial.vat.summary=The lease is exempt from VAT unless the landlord opts for taxation for business premises; option and rate stated.
lease.it.commercial.deposit.title=Security deposit
lease.it.commercial.deposit.summary=Optional deposit of at most 3 months' rent, bearing statutory interest paid yearly; returned at the end less sums owed.
lease.it.commercial.payment.title=Payment
lease.it.commercial.payment.summary=Periodic payment by bank transfer on the agreed day; receipt or invoice; termination only for breach that is not of minor importance.
lease.it.commercial.maintenance.title=Maintenance and repairs
lease.it.commercial.maintenance.summary=The landlord carries out necessary repairs, the tenant minor maintenance unless otherwise agreed; urgent repairs, rent reduction for lengthy works.
lease.it.commercial.alterations.title=Alterations and fit-out
lease.it.commercial.alterations.summary=Works only with the landlord's written consent; statutory rules on indemnity for improvements and removal of additions.
lease.it.commercial.assignment.title=Subletting and assignment
lease.it.commercial.assignment.summary=Sublease or assignment without consent together with the business, subject to the landlord's objection for serious reasons within 30 days; otherwise consent required.
lease.it.commercial.pre-emption.title=Pre-emption
lease.it.commercial.pre-emption.summary=Tenant's right of pre-emption and redemption on sale and on re-letting, except for premises without contact with the public and other excluded cases.
lease.it.commercial.goodwill-compensation.title=Indemnity for loss of goodwill
lease.it.commercial.goodwill-compensation.summary=18 months' rent (21 for hotels) when the lease ends other than by the tenant's breach, notice, withdrawal or insolvency proceedings; not for premises without public contact and other excluded cases.
lease.it.commercial.insurance.title=Insurance
lease.it.commercial.insurance.summary=The tenant is liable for loss and fire damage unless not at fault; tenant's liability insurance and landlord's building insurance.
lease.it.commercial.energy-certificate.title=Energy performance certificate
lease.it.commercial.energy-certificate.summary=The tenant confirms receipt of the APE information and documentation, with a copy annexed where required; statutory fines if omitted.
lease.it.commercial.registration.title=Registration and taxes
lease.it.commercial.registration.summary=Registration within 30 days, costs shared equally; registration tax of 1% or 2%; the cedolare secca does not apply.
lease.it.commercial.handover-inspection.title=Handover and return
