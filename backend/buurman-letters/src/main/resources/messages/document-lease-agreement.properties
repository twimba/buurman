lease.fr.residential.payment.summary=When and how the rent is paid; monthly payment on request, free receipts and no penalties.
lease.fr.residential.use.title=Use
lease.fr.residential.use.summary=Peaceful use as a main residence; alterations only with the landlord's written consent.
lease.fr.residential.subletting.title=Subletting
lease.fr.residential.subletting.summary=Assignment and subletting only with the landlord's written consent, including on the rent.
lease.fr.residential.maintenance.title=Maintenance and repairs
lease.fr.residential.maintenance.summary=Landlord's decency and repair duties, tenant's routine maintenance and access for works.
lease.fr.residential.works.title=Works
lease.fr.residential.works.summary=Works carried out since the last lease and agreed improvement works with any rent increase.
lease.fr.residential.diagnostics.title=Technical diagnostics
lease.fr.residential.diagnostics.summary=Technical diagnostics file annexed to the lease, energy class and minimum energy performance.
lease.fr.residential.insurance.title=Insurance
lease.fr.residential.insurance.summary=The tenant insures the rental risks and provides proof each year on request.
lease.fr.residential.handover-inspection.title=Inventory of condition
lease.fr.residential.handover-inspection.summary=Check-in and check-out inventories drawn up jointly, or by a judicial officer.
lease.fr.residential.termination.title=Termination
lease.fr.residential.termination.summary=Notice by the tenant (3 or 1 month) and by the landlord (6 months, statutory grounds); automatic termination clause.
lease.fr.residential.annexes.title=Annexes
lease.fr.residential.annexes.summary=Mandatory annexes: information notice, diagnostics file, inventory and co-ownership extracts.
lease.fr.residential.data-protection.title=Data protection
lease.fr.residential.data-protection.summary=Processing of the tenant's personal data in accordance with the GDPR.
lease.fr.residential.disputes.title=Disputes
lease.fr.residential.disputes.summary=French law applies; conciliation commission and the judge for protection litigation.
