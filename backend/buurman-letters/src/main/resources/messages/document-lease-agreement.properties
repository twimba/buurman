# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Parties
lease.at.residential.parties.summary=Identifies the landlord and the tenant(s); co-tenants are jointly and severally liable; the landlord ticks whether it is a trader.
lease.at.residential.premises.title=Premises
lease.at.residential.premises.summary=Describes the dwelling and records which MRG regime applies: full application, partial application or full exemption.
lease.at.residential.term.title=Term
lease.at.residential.term.summary=Indefinite or fixed term; under the MRG a fixed term must be agreed in writing for at least 5 years (3 years for non-trader landlords).
lease.at.residential.rent.title=Rent
lease.at.residential.rent.summary=The main rent and, under full application of the MRG, the statutory rent limits (reference value, category amounts).
lease.at.residential.rent-adjustment.title=Indexation
lease.at.residential.rent-adjustment.summary=Annual indexation on 1 April under the Rents Value Protection Act (MieWeG); inflation above 3 percent counts only by half.
lease.at.residential.service-costs.title=Operating costs
lease.at.residential.service-costs.summary=Share of operating costs and public charges in monthly instalments; annual statement by 30 June under full application of the MRG.
lease.at.residential.deposit.title=Deposit
lease.at.residential.deposit.summary=Deposit without statutory cap, invested in a savings book and returned with interest without undue delay.
lease.at.residential.payment.title=Payment
lease.at.residential.payment.summary=Rent paid monthly in advance by the 5th; statutory default interest of 4 percent per year.
lease.at.residential.use.title=Use
lease.at.residential.use.summary=Residential use only, access for important reasons, and the notification procedure for material alterations.
lease.at.residential.subletting.title=Subletting
lease.at.residential.subletting.summary=Subletting requires consent; under full application of the MRG the landlord may refuse only for an important reason.
lease.at.residential.maintenance.title=Maintenance and defects
lease.at.residential.maintenance.summary=The landlord keeps the dwelling usable; rent release for unfitness; the tenant reports defects without delay.
lease.at.residential.energy-certificate.title=Energy performance certificate
lease.at.residential.energy-certificate.summary=The landlord presents and hands over the energy performance certificate (EAVG 2012).
lease.at.residential.registration.title=Registration
lease.at.residential.registration.summary=The tenant registers with the registration authority within 3 days of moving in.
lease.at.residential.handover-inspection.title=Handover and return
lease.at.residential.handover-inspection.summary=Handover and return reports, return in the condition received, and the deadlines for claims.
lease.at.residential.termination.title=Termination
lease.at.residential.termination.summary=Under the MRG the landlord gives notice only through the court and for important reasons; notice periods and early cancellation.
lease.at.residential.data-protection.title=Data protection
lease.at.residential.data-protection.summary=Processing of the personal data of the tenant in accordance with the GDPR.
lease.at.residential.disputes.title=Disputes and final provisions
lease.at.residential.disputes.summary=Austrian law; the district court where the dwelling is located; leases of dwellings are exempt from the lease fee.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Parties
lease.at.commercial.parties.summary=Identifies the landlord and the tenant with company register number, VAT number and representatives.
lease.at.commercial.premises.title=Premises
lease.at.commercial.premises.summary=Describes the business premises and records which MRG regime applies.
lease.at.commercial.permitted-use.title=Permitted use
lease.at.commercial.permitted-use.summary=The agreed business purpose; changes need consent; non-use can be a ground for termination.
lease.at.commercial.term.title=Term
lease.at.commercial.term.summary=Fixed or indefinite term; under the MRG a fixed term needs a written expiry agreement.
lease.at.commercial.rent.title=Rent
lease.at.commercial.rent.summary=The main rent; under full application of the MRG capped at the reasonable amount, which a trader tenant can rely on only if it objected in time.
lease.at.commercial.rent-adjustment.title=Indexation
lease.at.commercial.rent-adjustment.summary=Indexation on the consumer price index 2020 with a threshold to be filled in, upwards and downwards.
lease.at.commercial.service-costs.title=Operating costs
lease.at.commercial.service-costs.summary=Share of operating costs and public charges in monthly instalments with an annual statement.
lease.at.commercial.vat.title=VAT option
lease.at.commercial.vat.summary=The landlord opts for VAT on the rent; the tenant uses the premises almost exclusively for VAT-able business.
lease.at.commercial.deposit.title=Deposit
lease.at.commercial.deposit.summary=Cash deposit or bank guarantee without statutory cap, returned after the end of the lease.
lease.at.commercial.payment.title=Payment
lease.at.commercial.payment.summary=Rent paid monthly in advance; default interest between traders of 9.2 percentage points above the base rate.
lease.at.commercial.maintenance.title=Maintenance and repairs
lease.at.commercial.maintenance.summary=Under full application of the MRG § 3 MRG governs; otherwise the landlord maintains structure and common parts, the tenant the interior.
lease.at.commercial.alterations.title=Alterations and fit-out
lease.at.commercial.alterations.summary=Tenant works and signage only with written consent; removal at the end of the lease.
lease.at.commercial.subletting.title=Subletting and sale of business
lease.at.commercial.subletting.summary=Subletting needs consent; statutory rights on the sale or lease of the business under full application of the MRG.
lease.at.commercial.insurance.title=Insurance
lease.at.commercial.insurance.summary=The landlord insures the building; the tenant insures fittings and business liability.
lease.at.commercial.energy-certificate.title=Energy performance certificate
lease.at.commercial.energy-certificate.summary=The landlord presents and hands over the energy performance certificate (EAVG 2012).
lease.at.commercial.contract-fee.title=Lease fee
lease.at.commercial.contract-fee.summary=Fee of 1 percent of the lease value under the Fees Act, calculated by the landlord and borne by the tenant.
lease.at.commercial.handover-inspection.title=Handover and return
lease.at.commercial.handover-inspection.summary=Handover and return reports, return of the vacated premises, and the deadlines for claims.
lease.at.commercial.termination.title=Termination
lease.at.commercial.termination.summary=Notice for the end of a calendar quarter with 3 months; restrictions on notice by the landlord under the MRG.
lease.at.commercial.data-protection.title=Data protection
lease.at.commercial.data-protection.summary=Processing of the personal data of representatives and contact persons in accordance with the GDPR.
lease.at.commercial.disputes.title=Disputes
lease.at.commercial.disputes.summary=Austrian law; the district court where the premises are located has jurisdiction.
# ===== end AT =====


