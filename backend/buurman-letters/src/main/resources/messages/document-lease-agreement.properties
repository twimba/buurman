lease.gb.commercial.service-costs.title=Service charge
lease.gb.commercial.service-costs.summary=A fair proportion of the building's service costs, with a budget and an annual statement.
lease.gb.commercial.vat.title=VAT
lease.gb.commercial.vat.summary=All sums are exclusive of VAT; VAT is payable where the landlord has opted to tax.
lease.gb.commercial.deposit.title=Rent deposit
