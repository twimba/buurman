lease.pt.residential.notices.title=Notices
lease.pt.residential.notices.summary=Notices by registered letter with acknowledgement of receipt and the agreed addresses.
lease.pt.residential.guarantor.title=Guarantor
lease.pt.residential.guarantor.summary=Guarantor of the tenant's obligations and the landlord's duty to notify the guarantor of a default.
lease.pt.residential.data-protection.title=Data protection
lease.pt.residential.data-protection.summary=Processing of the tenant's personal data under the GDPR and the Portuguese data protection act.
lease.pt.residential.disputes.title=Applicable law and disputes
lease.pt.residential.disputes.summary=Portuguese law, court of the place of the premises and the special eviction procedure.
lease.pt.commercial.parties.title=Parties
lease.pt.commercial.parties.summary=Identifies the landlord and the tenant with tax number, commercial registration and representatives.
lease.pt.commercial.premises.title=Leased premises
lease.pt.commercial.premises.summary=Describes the premises let for non-housing purposes, the tax register entry and the licence of use.
lease.pt.commercial.permitted-use.title=Permitted use
lease.pt.commercial.permitted-use.summary=The tenant's activity, actual use of the premises and the licences required for the activity.
lease.pt.commercial.term.title=Term
lease.pt.commercial.term.summary=Freely agreed term and renewal; statutory default rules and no opposition to renewal by the landlord in the first 5 years.
lease.pt.commercial.rent.title=Rent
lease.pt.commercial.rent.summary=Freely agreed rent, plus VAT where the exemption is waived.
lease.pt.commercial.rent-adjustment.title=Rent update
lease.pt.commercial.rent-adjustment.summary=Annual update as agreed in writing or, failing that, by the official update coefficient.
lease.pt.commercial.service-costs.title=Charges and expenses
lease.pt.commercial.service-costs.summary=Charges and expenses as agreed in writing; by default supplies borne by the tenant and common parts by the landlord.
lease.pt.commercial.vat.title=VAT and withholding
lease.pt.commercial.vat.summary=VAT exemption with possible waiver and withholding tax by tenants with organised accounts.
lease.pt.commercial.deposit.title=Security deposit
lease.pt.commercial.deposit.summary=Optional security deposit of at most 2 months' rent, returned at the end less the sums owed.
lease.pt.commercial.payment.title=Payment
lease.pt.commercial.payment.summary=Payment by bank transfer, advance payment of at most 2 months and 20 % compensation for late payment.
lease.pt.commercial.maintenance.title=Maintenance
lease.pt.commercial.maintenance.summary=Upkeep works as freely agreed by the parties, by default by the landlord.
lease.pt.commercial.alterations.title=Alterations
lease.pt.commercial.alterations.summary=Fit-out works by the tenant only with written authorisation; compensation at the end of the lease.
lease.pt.commercial.assignment.title=Assignment and transfer of the business
lease.pt.commercial.assignment.summary=Transfer of the lease with the business without consent, landlord's pre-emption right, subletting and death of the tenant.
lease.pt.commercial.pre-emption.title=Pre-emption right
lease.pt.commercial.pre-emption.summary=Tenant's right of first refusal on a sale after 2 years of lease and position of the acquirer.
lease.pt.commercial.insurance.title=Insurance
lease.pt.commercial.insurance.summary=Tenant's liability and contents insurance; landlord's building insurance.
lease.pt.commercial.energy-certificate.title=Energy certificate
lease.pt.commercial.energy-certificate.summary=Energy certificate handed over before the lease is concluded, with its number and energy class.
lease.pt.commercial.registration.title=Tax notification and stamp duty
lease.pt.commercial.registration.summary=Notification of the lease to the tax authority and stamp duty borne by the landlord.
lease.pt.commercial.handover-inspection.title=Handover and return
lease.pt.commercial.handover-inspection.summary=Record of the condition of the premises, return at the end, viewings and late return.
lease.pt.commercial.termination.title=Termination
lease.pt.commercial.termination.summary=Notice of termination, limited grounds and compensation for notice by the landlord, termination for breach.
lease.pt.commercial.notices.title=Notices
lease.pt.commercial.notices.summary=Notices by registered letter with acknowledgement of receipt and the agreed addresses.
lease.pt.commercial.guarantor.title=Guarantor
lease.pt.commercial.guarantor.summary=Guarantor of the tenant's obligations and the landlord's duty to notify the guarantor of a default.
lease.pt.commercial.data-protection.title=Data protection
lease.pt.commercial.data-protection.summary=Processing of the personal data of the persons acting for the parties under the GDPR.
lease.pt.commercial.disputes.title=Applicable law and disputes
lease.pt.commercial.disputes.summary=Portuguese law, court of the place of the premises and the special eviction procedure.
