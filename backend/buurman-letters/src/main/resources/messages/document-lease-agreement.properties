# Clause titles and summaries live here; the legal text of each clause lives in the per-language
# documents under templates/documents/lease-agreement/{COUNTRY}/{kind}/{lang}.html.
# lease.disclaimer marks every generated agreement as a draft needing legal review.
lease.title=Lease Agreement
lease.parties.title=Parties
lease.parties.body=This agreement is between the landlord and tenant named above.
lease.premises.title=Premises
lease.premises.body=The landlord lets to the tenant the premises described above.
lease.rent.title=Rent
lease.rent.body=The tenant shall pay the rent set out in this agreement.
lease.duration.title=Duration
lease.duration.body=This agreement runs for the term set out in this agreement.
lease.deposit.title=Deposit
lease.deposit.body=A security deposit may be required as set out in this agreement.
lease.maintenance.title=Maintenance
lease.maintenance.body=Each party's maintenance obligations are as set out in this agreement.
lease.termination-reference.title=Termination
lease.termination-reference.body=This agreement may be terminated as provided by applicable law and this agreement's termination terms.
lease.ref=Ref.: {0}
lease.premises=The landlord lets to the tenant the premises located at {0}.
lease.article.ref=Article {0}
lease.notice.courtesy=This is a courtesy translation. Only the version in the national language of the country is legally authoritative.
lease.notice.fallback=Requested language ({0}) is not available for this agreement; it was generated in another language.
lease.disclaimer=Draft document, not legal advice: have it reviewed by qualified legal counsel before signing.
lease.disclaimer.legacy=This document was generated from example clause text and has not been reviewed by qualified legal counsel.
lease.contractType.FIXED_TERM=Fixed term
lease.contractType.INDEFINITE=Indefinite term
lease.paymentFrequency.MONTHLY=monthly
lease.paymentFrequency.QUARTERLY=quarterly
lease.paymentFrequency.ANNUALLY=annually
# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Parties
lease.nl.residential.parties.summary=Identifies the landlord and the tenant(s); co-tenants are jointly and severally liable.
lease.nl.residential.premises.title=Premises
lease.nl.residential.premises.summary=Describes the let dwelling and applies Dutch residential tenancy law.
lease.nl.residential.term.title=Term
lease.nl.residential.term.summary=Start date and whether the lease is for an indefinite or a fixed term.
lease.nl.residential.rent.title=Rent
lease.nl.residential.rent.summary=The basic rent and the tenant's right to have it reviewed by the Rent Tribunal.
lease.nl.residential.rent-adjustment.title=Rent adjustment
lease.nl.residential.rent-adjustment.summary=Annual rent adjustment, never above the statutory maximum increase.
lease.nl.residential.service-costs.title=Service costs
lease.nl.residential.service-costs.summary=Advance payments for utilities and services with a yearly statement.
lease.nl.residential.deposit.title=Deposit
lease.nl.residential.deposit.summary=Security deposit of at most twice the basic rent, refunded within the statutory term.
lease.nl.residential.payment.title=Payment
lease.nl.residential.payment.summary=When and how the rent is paid, in advance per payment period.
lease.nl.residential.use.title=Use
lease.nl.residential.use.summary=Use as a dwelling only, as a good tenant, and alterations to the premises.
lease.nl.residential.subletting.title=Subletting
lease.nl.residential.subletting.summary=Subletting only with the landlord's written consent, subject to statutory rights.
lease.nl.residential.maintenance.title=Maintenance and repairs
lease.nl.residential.maintenance.summary=Landlord remedies defects; tenant carries out minor repairs.
lease.nl.residential.energy-label.title=Energy label
lease.nl.residential.energy-label.summary=The landlord provides a copy of the valid energy label of the dwelling.
lease.nl.residential.handover-inspection.title=Inspection and handover
lease.nl.residential.handover-inspection.summary=Condition report at the start, pre-inspection and final handover inspection.
lease.nl.residential.termination.title=Termination
lease.nl.residential.termination.summary=Notice periods and the statutory grounds on which the landlord may terminate.
lease.nl.residential.data-protection.title=Data protection
lease.nl.residential.data-protection.summary=Processing of the tenant's personal data in accordance with the GDPR.
lease.nl.residential.disputes.title=Disputes
lease.nl.residential.disputes.summary=Dutch law applies; disputes go to the Rent Tribunal or the competent court.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Parties
lease.de.residential.parties.summary=Identifies the landlord and the tenant(s); co-tenants are jointly and severally liable.
lease.de.residential.premises.title=Premises
lease.de.residential.premises.summary=Describes the let dwelling and applies German residential tenancy law (BGB).
lease.de.residential.term.title=Term
lease.de.residential.term.summary=Start date; indefinite term, or a fixed term only with a statutory reason stated in writing.
lease.de.residential.rent.title=Rent
lease.de.residential.rent.summary=The net rent and the limit on the initial rent in areas with a tight housing market.
lease.de.residential.rent-adjustment.title=Rent increases
lease.de.residential.rent-adjustment.summary=Statutory rent increases up to the local comparative rent, within the capping limit.
lease.de.residential.service-costs.title=Operating costs
lease.de.residential.service-costs.summary=Advance payments on operating costs with an annual statement within the statutory period.
lease.de.residential.deposit.title=Deposit
lease.de.residential.deposit.summary=Rent deposit of at most 3 months' net rent, payable in instalments and held separately.
lease.de.residential.payment.title=Payment
lease.de.residential.payment.summary=Rent is paid in advance, no later than the 3rd working day of each payment period.
lease.de.residential.use.title=Use
lease.de.residential.use.summary=Residential use only, considerate use, and alterations only with the landlord's consent.
lease.de.residential.subletting.title=Subletting
lease.de.residential.subletting.summary=Use by third parties only with permission; the tenant's statutory right to sublet part of the dwelling.
lease.de.residential.maintenance.title=Maintenance and defects
lease.de.residential.maintenance.summary=Landlord maintains the dwelling; rent reduction for defects; no cosmetic repairs for the tenant.
lease.de.residential.minor-repairs.title=Minor repairs
lease.de.residential.minor-repairs.summary=Tenant bears the cost of minor repairs up to an amount per job and per year to be filled in.
lease.de.residential.energy-certificate.title=Energy performance certificate
lease.de.residential.energy-certificate.summary=The landlord presents and hands over the energy performance certificate (GModG).
lease.de.residential.registration.title=Registration confirmation
lease.de.residential.registration.summary=The landlord confirms the move-in so the tenant can register with the authority.
lease.de.residential.handover-inspection.title=Handover and return
lease.de.residential.handover-inspection.summary=Handover and return reports, return of the dwelling and the 6-month limitation period.
lease.de.residential.termination.title=Termination
lease.de.residential.termination.summary=Written notice, statutory notice periods and the landlord's need for a legitimate interest.
lease.de.residential.data-protection.title=Data protection
lease.de.residential.data-protection.summary=Processing of the tenant's personal data in accordance with the GDPR.
lease.de.residential.disputes.title=Disputes
lease.de.residential.disputes.summary=German law applies; the local court where the dwelling is located has exclusive jurisdiction.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Parties
lease.de.commercial.parties.summary=Identifies the landlord and the tenant with register number, VAT number and representatives.
lease.de.commercial.premises.title=Premises
lease.de.commercial.premises.summary=Describes the business premises and applies the BGB rules on leases of business premises.
lease.de.commercial.permitted-use.title=Permitted use
lease.de.commercial.permitted-use.summary=The agreed business use; changes need consent; the tenant obtains business permits.
lease.de.commercial.term.title=Term
lease.de.commercial.term.summary=Fixed or indefinite term; a lease over 1 year must be in text form or becomes indefinite.
lease.de.commercial.rent.title=Rent
lease.de.commercial.rent.summary=The freely agreed net rent, plus VAT and operating cost advances where agreed.
lease.de.commercial.rent-adjustment.title=Indexation
lease.de.commercial.rent-adjustment.summary=Consumer price index clause permitted only for long-term leases under the Price Clauses Act.
lease.de.commercial.service-costs.title=Operating costs
lease.de.commercial.service-costs.summary=Operating costs per the BetrKV and listed extra items, with advances and an annual statement.
lease.de.commercial.vat.title=VAT option
lease.de.commercial.vat.summary=The landlord opts for VAT on the rent; the tenant uses the premises for VAT-able business only.
lease.de.commercial.deposit.title=Rent security
lease.de.commercial.deposit.summary=Cash deposit or bank guarantee, without a statutory cap for business premises.
lease.de.commercial.payment.title=Payment
lease.de.commercial.payment.summary=Rent paid in advance by the 3rd working day; set-off limits and commercial default interest.
lease.de.commercial.maintenance.title=Maintenance and repairs
lease.de.commercial.maintenance.summary=Landlord maintains structure and common parts; tenant maintains the interior.
lease.de.commercial.alterations.title=Alterations and fit-out
lease.de.commercial.alterations.summary=Tenant works and signage only with consent in text form; removal at the end of the lease.
lease.de.commercial.subletting.title=Subletting
lease.de.commercial.subletting.summary=Use by third parties only with permission; special termination right if permission is refused.
lease.de.commercial.competition.title=Protection against competition
lease.de.commercial.competition.summary=The landlord does not let to a competitor with the same main product range.
lease.de.commercial.insurance.title=Insurance
lease.de.commercial.insurance.summary=Landlord insures the building; tenant insures its contents and holds business liability insurance.
lease.de.commercial.energy-certificate.title=Energy performance certificate
lease.de.commercial.energy-certificate.summary=The landlord presents and hands over the energy performance certificate (GModG).
lease.de.commercial.handover-inspection.title=Handover and return
lease.de.commercial.handover-inspection.summary=Handover and return reports, return of the premises vacated and the 6-month limitation period.
lease.de.commercial.termination.title=Termination
lease.de.commercial.termination.summary=Notice by the 3rd working day of a quarter to the end of the next quarter; extraordinary termination.
lease.de.commercial.data-protection.title=Data protection
lease.de.commercial.data-protection.summary=Processing of personal data of the parties' representatives and contacts under the GDPR.
lease.de.commercial.disputes.title=Disputes
lease.de.commercial.disputes.summary=German law applies; the court where the premises are located has exclusive jurisdiction.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Parties
lease.fr.residential.parties.summary=Identifies the landlord and the tenant(s); co-tenants are jointly and severally liable within the statutory limits.
lease.fr.residential.premises.title=Premises
lease.fr.residential.premises.summary=Describes the unfurnished dwelling let as a main residence under the Law of 6 July 1989 and the standard lease.
lease.fr.residential.term.title=Term
lease.fr.residential.term.summary=Start date, minimum term of 3 or 6 years depending on the landlord, and tacit renewal.
lease.fr.residential.rent.title=Rent
lease.fr.residential.rent.summary=The rent excluding charges and the rent limits in high-demand and rent-controlled areas.
lease.fr.residential.rent-adjustment.title=Rent review
lease.fr.residential.rent-adjustment.summary=Annual review capped by the rent reference index (IRL); no review for energy classes F and G.
lease.fr.residential.service-costs.title=Charges
lease.fr.residential.service-costs.summary=Recoverable charges paid by advance payments with an annual adjustment and supporting documents.
lease.fr.residential.deposit.title=Security deposit
lease.fr.residential.deposit.summary=Security deposit of at most 1 month's rent excluding charges, returned within 1 or 2 months.
lease.fr.residential.payment.title=Payment
lease.fr.residential.payment.summary=When and how the rent is paid; monthly payment on request, free receipts and no penalties.
lease.fr.residential.use.title=Use
lease.fr.residential.use.summary=Peaceful use as a main residence; alterations only with the landlord's written consent.
lease.fr.residential.subletting.title=Subletting
lease.fr.residential.subletting.summary=Assignment and subletting only with the landlord's written consent, including on the rent.
lease.fr.residential.maintenance.title=Maintenance and repairs
lease.fr.residential.maintenance.summary=Landlord's decency and repair duties, tenant's routine maintenance and access for works.
lease.fr.residential.works.title=Works
lease.fr.residential.works.summary=Works carried out since the last lease and agreed improvement works with any rent increase.
lease.fr.residential.diagnostics.title=Technical diagnostics
lease.fr.residential.diagnostics.summary=Technical diagnostics file annexed to the lease, energy class and minimum energy performance.
lease.fr.residential.insurance.title=Insurance
lease.fr.residential.insurance.summary=The tenant insures the rental risks and provides proof each year on request.
lease.fr.residential.handover-inspection.title=Inventory of condition
lease.fr.residential.handover-inspection.summary=Check-in and check-out inventories drawn up jointly, or by a judicial officer.
lease.fr.residential.termination.title=Termination
lease.fr.residential.termination.summary=Notice by the tenant (3 or 1 month) and by the landlord (6 months, statutory grounds); automatic termination clause.
lease.fr.residential.annexes.title=Annexes
lease.fr.residential.annexes.summary=Mandatory annexes: information notice, diagnostics file, inventory and co-ownership extracts.
lease.fr.residential.data-protection.title=Data protection
lease.fr.residential.data-protection.summary=Processing of the tenant's personal data in accordance with the GDPR.
lease.fr.residential.disputes.title=Disputes
lease.fr.residential.disputes.summary=French law applies; conciliation commission and the judge for protection litigation.
# FR commercial (bail commercial) clauses: title and one-line summary for the clause toggle UI.
lease.fr.commercial.parties.title=Parties
lease.fr.commercial.parties.summary=Identifies the landlord and the tenant with registration number, VAT number and representatives.
lease.fr.commercial.premises.title=Premises
lease.fr.commercial.premises.summary=Describes the let premises and applies the statutory regime of commercial leases.
lease.fr.commercial.permitted-use.title=Permitted use
lease.fr.commercial.permitted-use.summary=The activity permitted in the premises and the tenant's right to add related activities.
lease.fr.commercial.term.title=Term
lease.fr.commercial.term.summary=Minimum term of 9 years with the tenant's right to terminate at the end of each 3-year period.
lease.fr.commercial.rent.title=Rent
lease.fr.commercial.rent.summary=The initial rent and the cap on the rent at renewal.
lease.fr.commercial.rent-adjustment.title=Indexation
lease.fr.commercial.rent-adjustment.summary=Annual indexation on the ILC or ILAT index and the statutory rent review.
lease.fr.commercial.service-costs.title=Charges and taxes
lease.fr.commercial.service-costs.summary=Exhaustive inventory of charges and taxes, costs that cannot be charged, and the annual statement.
lease.fr.commercial.vat.title=VAT
lease.fr.commercial.vat.summary=VAT exemption of bare premises and the landlord's option to charge VAT.
lease.fr.commercial.deposit.title=Security deposit
lease.fr.commercial.deposit.summary=Security deposit, capped at 1 quarter's rent for retail and artisanal premises, returned within 3 months.
lease.fr.commercial.payment.title=Payment
lease.fr.commercial.payment.summary=Payment of the rent in advance and the right to monthly payment for retail and artisanal tenants.
lease.fr.commercial.maintenance.title=Maintenance and repairs
lease.fr.commercial.maintenance.summary=Landlord's repair duties, major repairs not chargeable to the tenant, routine maintenance.
lease.fr.commercial.alterations.title=Alterations
lease.fr.commercial.alterations.summary=Works and fit-out only with the landlord's prior written consent.
lease.fr.commercial.assignment.title=Assignment
lease.fr.commercial.assignment.summary=Assignment of the lease with the sale of the business and the 3-year limit on the assignor's guarantee.
lease.fr.commercial.subletting.title=Subletting
lease.fr.commercial.subletting.summary=Subletting only if permitted by the lease or by the landlord, who takes part in the deed.
lease.fr.commercial.insurance.title=Insurance
lease.fr.commercial.insurance.summary=Insurance of the building by the landlord and of the business and liability by the tenant.
lease.fr.commercial.diagnostics.title=Diagnostics
lease.fr.commercial.diagnostics.summary=Energy performance diagnosis, risk statement, asbestos information and environmental annex.
lease.fr.commercial.handover-inspection.title=Inventory of condition
lease.fr.commercial.handover-inspection.summary=Inventories of condition on taking possession, on assignment and on return of the premises.
lease.fr.commercial.renewal.title=Renewal
lease.fr.commercial.renewal.summary=The tenant's right to renewal, the eviction indemnity and notice by bailiff's writ.
lease.fr.commercial.pre-emption.title=Right of first refusal
lease.fr.commercial.pre-emption.summary=The tenant's right of first refusal if retail or artisanal premises are sold.
lease.fr.commercial.termination.title=Termination
lease.fr.commercial.termination.summary=End of the lease and the automatic termination clause 1 month after an unsuccessful demand.
lease.fr.commercial.data-protection.title=Data protection
lease.fr.commercial.data-protection.summary=Processing of personal data of the parties and their contacts in accordance with the GDPR.
lease.fr.commercial.disputes.title=Disputes
lease.fr.commercial.disputes.summary=French law applies; conciliation commission and the judicial court where the building is located.
