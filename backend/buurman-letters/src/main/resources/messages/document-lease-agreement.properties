lease.ie.residential.termination.title=Termination
lease.ie.residential.termination.summary=Notices of termination, statutory notice periods and the restricted grounds for ending a Part 4 tenancy.
lease.ie.residential.notices.title=Notices
lease.ie.residential.notices.summary=Written notices, service under the Act including by email, and addresses for service.
lease.ie.residential.data-protection.title=Data protection
lease.ie.residential.data-protection.summary=Processing of personal data under the GDPR and the Data Protection Act 2018.
lease.ie.residential.disputes.title=Disputes
lease.ie.residential.disputes.summary=Irish law; disputes under the Act are referred to the RTB, other disputes to the Irish courts.
lease.ie.commercial.parties.title=Parties
lease.ie.commercial.parties.summary=Landlord and tenant with company registration number, registered office, VAT number and representative.
lease.ie.commercial.premises.title=Premises
lease.ie.commercial.premises.summary=The let business premises, their area and rights; the Residential Tenancies Act 2004 does not apply.
lease.ie.commercial.permitted-use.title=Permitted use
lease.ie.commercial.permitted-use.summary=Permitted business use; consent to a change of use not unreasonably withheld; permits at the tenant's risk.
lease.ie.commercial.term.title=Term
lease.ie.commercial.term.summary=Start date and fixed term, or a periodic tenancy ended by notice to quit.
lease.ie.commercial.renewal.title=Renewal rights
lease.ie.commercial.renewal.summary=Statutory right to a new tenancy after 5 years' business use and the option of a renunciation after legal advice.
lease.ie.commercial.rent.title=Rent
lease.ie.commercial.rent.summary=Rent amount exclusive of VAT, service charge and insurance, and any agreed incentive.
lease.ie.commercial.rent-adjustment.title=Rent review
lease.ie.commercial.rent-adjustment.summary=Open market rent review; for leases since 28 February 2010 the reviewed rent may also be lower.
lease.ie.commercial.service-costs.title=Service charge and outgoings
lease.ie.commercial.service-costs.summary=Service charge by proportion with annual reconciliation; the tenant pays rates and utilities.
lease.ie.commercial.vat.title=VAT
lease.ie.commercial.vat.summary=Lettings are exempt from VAT unless the landlord opts to tax the letting.
lease.ie.commercial.deposit.title=Rent deposit
lease.ie.commercial.deposit.summary=Rent deposit with no statutory cap, held in a designated account and repaid within 30 days.
lease.ie.commercial.payment.title=Payment
lease.ie.commercial.payment.summary=Payment of the rent without set-off by bank transfer, with interest on late payment.
lease.ie.commercial.maintenance.title=Repairs
lease.ie.commercial.maintenance.summary=Full or internal repairing obligation and the statutory limit on damages for disrepair.
lease.ie.commercial.alterations.title=Alterations
lease.ie.commercial.alterations.summary=Alterations only with consent, not unreasonably withheld for improvements, and reinstatement at the end.
lease.ie.commercial.assignment.title=Assignment and subletting
lease.ie.commercial.assignment.summary=Assignment or subletting with the landlord's consent, which may not be unreasonably withheld.
lease.ie.commercial.insurance.title=Insurance
lease.ie.commercial.insurance.summary=Landlord insures the building at the tenant's cost; the tenant insures contents and liability; rent suspension after damage.
lease.ie.commercial.energy-certificate.title=Building Energy Rating
lease.ie.commercial.energy-certificate.summary=BER certificate of the premises made available to the tenant where required.
lease.ie.commercial.registration.title=Stamp duty and lease register
lease.ie.commercial.registration.summary=Stamp duty on the lease and notices of the lease, of each rent review and of the tenant's exit to the PSRA Commercial Leases Database.
lease.ie.commercial.break-option.title=Break option
lease.ie.commercial.break-option.summary=Optional break dates, notice and conditions; a tenant's break may end renewal rights.
lease.ie.commercial.handover-inspection.title=Schedule of condition and yield-up
lease.ie.commercial.handover-inspection.summary=Schedule of condition at the start and vacant possession at the end.
lease.ie.commercial.termination.title=Forfeiture and termination
lease.ie.commercial.termination.summary=Re-entry for unpaid rent or breach, notice before forfeiture and relief, and the other ways the lease ends.
lease.ie.commercial.notices.title=Notices
lease.ie.commercial.notices.summary=Written notices by hand or registered post and addresses for notices.
lease.ie.commercial.guarantor.title=Guarantor
lease.ie.commercial.guarantor.summary=Guarantee of the tenant's obligations by a guarantor as principal debtor.
lease.ie.commercial.data-protection.title=Data protection
lease.ie.commercial.data-protection.summary=Processing of the personal data of contact persons and guarantors under the GDPR.
lease.ie.commercial.disputes.title=Disputes
lease.ie.commercial.disputes.summary=Irish law and the Irish courts; claims for a new tenancy before the court under the 1980 Act.
