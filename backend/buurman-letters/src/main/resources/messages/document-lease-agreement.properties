# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Parties
lease.gr.residential.parties.summary=Identifies the landlord and the tenant with tax number and identity details; co-tenants are jointly and severally liable.
lease.gr.residential.premises.title=Leased premises
lease.gr.residential.premises.summary=Describes the dwelling let as the tenant's main residence, its appurtenances and the cadastre code.
lease.gr.residential.term.title=Term
lease.gr.residential.term.summary=Fixed or indefinite term; statutory minimum of 3 years for a main residence, shortened only by a later notarial agreement.
lease.gr.residential.rent.title=Rent
lease.gr.residential.rent.summary=Freely agreed rent; no release from the rent for reasons concerning the tenant.
lease.gr.residential.rent-adjustment.title=Rent adjustment
lease.gr.residential.rent-adjustment.summary=Freely agreed adjustment; statutory default of 75% of the cost-of-living index for terms under 3 years without an adjustment clause.
lease.gr.residential.service-costs.title=Utilities and common charges
lease.gr.residential.service-costs.summary=Utilities and common charges of use borne by the tenant; taxes and extraordinary building costs borne by the landlord.
lease.gr.residential.deposit.title=Security deposit
lease.gr.residential.deposit.summary=Optional deposit, not set off against rent, returned at the end less the sums owed.
lease.gr.residential.payment.title=Payment
lease.gr.residential.payment.summary=Payment date and bank transfer; from its start date, payment into a landlord bank account notified to the AADE.
lease.gr.residential.use.title=Use
lease.gr.residential.use.summary=Careful use as a main residence, house rules and landlord visits up to 1 time every 3 months.
lease.gr.residential.subletting.title=Subletting
lease.gr.residential.subletting.summary=Subletting and short-term rental only with the landlord's written consent; liability for the third party.
lease.gr.residential.maintenance.title=Maintenance and defects
lease.gr.residential.maintenance.summary=The landlord keeps the premises fit for use; rent reduction for defects, expenses and the tenant's duty to report.
lease.gr.residential.energy-certificate.title=Energy performance certificate
lease.gr.residential.energy-certificate.summary=Mandatory certificate shown and handed over to a new tenant, with its number entered in the lease declaration.
lease.gr.residential.registration.title=AADE lease declaration
lease.gr.residential.registration.summary=Electronic declaration of the lease to the tax authority and acceptance by the tenant within 30 days.
lease.gr.residential.sale-of-premises.title=Sale of the premises
lease.gr.residential.sale-of-premises.summary=Position of the new owner under a lease of certain date and the new owner's notice rights otherwise.
lease.gr.residential.handover-inspection.title=Handover and return
lease.gr.residential.handover-inspection.summary=Handover report, return in the condition received, holding over and 6-month limitation periods.
lease.gr.residential.termination.title=Termination
lease.gr.residential.termination.summary=Minimum term, notice for indefinite leases, termination for arrears, tenant grounds, family home and order for possession.
lease.gr.residential.data-protection.title=Data protection
lease.gr.residential.data-protection.summary=Processing of the tenant's personal data under the GDPR and Law 4624/2019.
lease.gr.residential.disputes.title=Applicable law and disputes
lease.gr.residential.disputes.summary=Greek law and the court of the place of the property under the special procedure for lease disputes.
lease.gr.commercial.parties.title=Parties
lease.gr.commercial.parties.summary=Identifies the landlord and the tenant with tax number, commercial register number and legal representatives.
lease.gr.commercial.premises.title=Leased premises
lease.gr.commercial.premises.summary=Describes the business premises, their appurtenances and their suitability for the agreed use.
lease.gr.commercial.permitted-use.title=Permitted use
lease.gr.commercial.permitted-use.summary=The tenant's activity, the scope of Presidential Decree 34/1995, licences and careful use.
lease.gr.commercial.term.title=Term
lease.gr.commercial.term.summary=Fixed or indefinite term; 3-year minimum for leases under Presidential Decree 34/1995 and no statutory goodwill compensation.
lease.gr.commercial.rent.title=Rent
lease.gr.commercial.rent.summary=Rent freely set by the parties, plus the tax levied on the rent.
lease.gr.commercial.rent-adjustment.title=Rent adjustment
lease.gr.commercial.rent-adjustment.summary=Agreed adjustment, statutory default rules and the 3% cap on adjustments in 2026.
lease.gr.commercial.service-costs.title=Utilities and common charges
lease.gr.commercial.service-costs.summary=Utilities and common charges borne by the tenant; taxes on the premises borne by the landlord unless agreed otherwise.
lease.gr.commercial.vat.title=VAT and digital transaction duty
lease.gr.commercial.vat.summary=VAT where opted for, otherwise the 3.60% digital transaction duty, declared by the landlord or in the cases provided by law by the tenant.
lease.gr.commercial.deposit.title=Security deposit
lease.gr.commercial.deposit.summary=Optional cash deposit or bank guarantee, topped up with rent adjustments and returned at the end.
lease.gr.commercial.payment.title=Payment
lease.gr.commercial.payment.summary=Payment date, bank transfer and tax documents; payment into a landlord account notified to the AADE where the rent is not a business expense.
lease.gr.commercial.maintenance.title=Maintenance and defects
lease.gr.commercial.maintenance.summary=The landlord keeps the premises fit for use; split of ordinary upkeep and structural repairs.
lease.gr.commercial.alterations.title=Fit-out and alterations
lease.gr.commercial.alterations.summary=Fit-out works at the tenant's expense with written consent; expenses and what happens to the works at the end.
lease.gr.commercial.assignment.title=Assignment and subletting
lease.gr.commercial.assignment.summary=Transfer of use only as permitted by law or with consent; company exception after 3 years and transfer on illness or death.
lease.gr.commercial.insurance.title=Insurance
lease.gr.commercial.insurance.summary=Building insurance by the landlord; equipment, goods and liability insurance by the tenant.
lease.gr.commercial.energy-certificate.title=Energy performance certificate
lease.gr.commercial.energy-certificate.summary=Mandatory certificate shown and handed over to a new tenant, with its number entered in the lease declaration.
lease.gr.commercial.registration.title=AADE lease declaration
lease.gr.commercial.registration.summary=Electronic declaration of the lease to the tax authority and acceptance by the tenant within 30 days.
lease.gr.commercial.sale-of-premises.title=Sale of the premises
lease.gr.commercial.sale-of-premises.summary=Position of the new owner under a lease of certain date and the new owner's notice rights otherwise.
lease.gr.commercial.handover-inspection.title=Handover and return
lease.gr.commercial.handover-inspection.summary=Handover report, return in the condition received, holding over, limitation periods and viewings.
lease.gr.commercial.termination.title=Termination
lease.gr.commercial.termination.summary=Notice rules, termination for arrears, tenant grounds and order for possession; early termination only if agreed.
lease.gr.commercial.data-protection.title=Data protection
lease.gr.commercial.data-protection.summary=Processing of the personal data of the persons acting for the parties under the GDPR.
lease.gr.commercial.disputes.title=Applicable law and disputes
lease.gr.commercial.disputes.summary=Greek law, the court of the place of the property and nullity of waivers under Presidential Decree 34/1995.
