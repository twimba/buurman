lease.fi.residential.maintenance.summary=Required condition, notice of defects, rent reduction, repair works and landlord access.
lease.fi.residential.energy-certificate.title=Energy certificate
lease.fi.residential.energy-certificate.summary=The energy performance certificate is shown at the viewing and handed over, with statutory exceptions.
lease.fi.residential.handover-inspection.title=Handover and moving day
lease.fi.residential.handover-inspection.summary=Joint inspection report; the moving day is the day the lease ends; property left behind.
lease.fi.residential.termination.title=Termination and rescission
lease.fi.residential.termination.summary=Landlord notice of 4 or 3 months, tenant notice of 1 month, written notice served verifiably, rescission.
lease.fi.residential.notices.title=Notices
lease.fi.residential.notices.summary=Notices by post or an agreed electronic channel; termination notices served verifiably.
lease.fi.residential.data-protection.title=Data protection
lease.fi.residential.data-protection.summary=Personal data processed in accordance with the GDPR and the Finnish Data Protection Act.
lease.fi.residential.disputes.title=Disputes
lease.fi.residential.disputes.summary=Finnish law, the Consumer Disputes Board, the district court and the small-claims procedure.
lease.fi.commercial.parties.title=Parties
lease.fi.commercial.parties.summary=Identifies the landlord and the tenant with business ID, VAT number and representatives.
lease.fi.commercial.premises.title=Premises
lease.fi.commercial.premises.summary=Describes the business premises and the landlord's right to let them; the Commercial Leases Act applies.
lease.fi.commercial.permitted-use.title=Permitted use
lease.fi.commercial.permitted-use.summary=The agreed use of the premises; changes need consent; the tenant obtains business permits.
lease.fi.commercial.term.title=Term
lease.fi.commercial.term.summary=Fixed or indefinite term in writing; a fixed-term lease cannot normally be terminated by notice.
lease.fi.commercial.rent.title=Rent
lease.fi.commercial.rent.summary=The agreed rent, plus VAT and usage charges where agreed.
lease.fi.commercial.rent-adjustment.title=Rent review
lease.fi.commercial.rent-adjustment.summary=Agreed annual review basis, notified in writing before it takes effect.
lease.fi.commercial.service-costs.title=Usage charges
lease.fi.commercial.service-costs.summary=Water, electricity, heating and other charges invoiced on agreed bases.
lease.fi.commercial.vat.title=VAT
lease.fi.commercial.vat.summary=Letting is exempt from VAT unless the landlord opts for tax liability; the tenant's use and notice duties.
lease.fi.commercial.deposit.title=Security
lease.fi.commercial.deposit.summary=Reasonable security without a statutory cap, returned after the tenancy less claims due.
lease.fi.commercial.payment.title=Payment
lease.fi.commercial.payment.summary=Rent due on the agreed day or day 2 of each period; advance rent and default interest.
lease.fi.commercial.maintenance.title=Maintenance
lease.fi.commercial.maintenance.summary=Agreed split of responsibilities, condition, notice of defects, works and landlord access.
lease.fi.commercial.alterations.title=Alterations
lease.fi.commercial.alterations.summary=Tenant works only with written permission; compensation for value-increasing works at the end.
lease.fi.commercial.assignment.title=Assignment
lease.fi.commercial.assignment.summary=Assignment needs consent except on a business transfer unless excluded; notice 2 months before.
lease.fi.commercial.subletting.title=Subletting
lease.fi.commercial.subletting.summary=Up to half of the premises may be sublet unless otherwise agreed; the tenant remains liable.
lease.fi.commercial.insurance.title=Insurance
lease.fi.commercial.insurance.summary=The tenant's liability and property insurance; the landlord insures the building.
lease.fi.commercial.energy-certificate.title=Energy certificate
lease.fi.commercial.energy-certificate.summary=The energy performance certificate is shown at the viewing and handed over, with statutory exceptions.
lease.fi.commercial.handover-inspection.title=Handover and moving day
lease.fi.commercial.handover-inspection.summary=Joint inspection; the moving day is the working day after the lease ends; postponement by up to 6 months.
lease.fi.commercial.termination.title=Termination and rescission
lease.fi.commercial.termination.summary=Notice of 3 months (landlord) and 1 month (tenant) unless agreed; protection, compensation, rescission.
lease.fi.commercial.notices.title=Notices
lease.fi.commercial.notices.summary=Notices by post or an agreed or established electronic channel; termination notices served verifiably.
lease.fi.commercial.data-protection.title=Data protection
lease.fi.commercial.data-protection.summary=Personal data of representatives and contact persons processed in accordance with the GDPR.
lease.fi.commercial.disputes.title=Disputes
lease.fi.commercial.disputes.summary=Finnish law and the competent district court.
# ===== end FI =====


# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Parties
lease.gb.residential.parties.summary=Identifies the landlord and the tenant(s); joint tenants are jointly and severally liable; in Wales the tenant is the contract-holder.
lease.gb.residential.premises.title=Premises
lease.gb.residential.premises.summary=Describes the let dwelling and the regime of the nation: assured tenancy (England), standard occupation contract (Wales), private residential tenancy (Scotland) or private tenancy (Northern Ireland).
lease.gb.residential.term.title=Term
lease.gb.residential.term.summary=Start date; periodic tenancy without a fixed term in England and Scotland, periodic or fixed term in Wales and Northern Ireland.
lease.gb.residential.rent.title=Rent
lease.gb.residential.rent.summary=The rent and the rent period; in England the rent period may not exceed 1 month.
lease.gb.residential.rent-adjustment.title=Rent increases
lease.gb.residential.rent-adjustment.summary=Rent increases only as the law allows: in England by a section 13 notice or a tribunal determination; 2 months' notice in England and Wales, 3 months in Scotland and Northern Ireland, at most 1 increase per year.
lease.gb.residential.service-costs.title=Bills and council tax
lease.gb.residential.service-costs.summary=Utilities and council tax or domestic rates paid by the tenant, and any bills payable to the landlord.
lease.gb.residential.deposit.title=Deposit
lease.gb.residential.deposit.summary=Deposit protected in an approved scheme; capped at 5 or 6 weeks' rent in England, 2 months' rent in Scotland and 1 month's rent in Northern Ireland.
lease.gb.residential.payment.title=Payment
lease.gb.residential.payment.summary=Payment date and method; in England no rent before the rent period and late-payment interest capped at 3% above base rate.
lease.gb.residential.fees.title=Fees and permitted payments
lease.gb.residential.fees.summary=Only permitted payments may be charged: Tenant Fees Act 2019 in England, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 in Wales.
lease.gb.residential.use.title=Use and pets
lease.gb.residential.use.summary=Use as a private home without anti-social behaviour; pets with the landlord's consent, which is not unreasonably refused.
lease.gb.residential.subletting.title=Subletting and assignment
lease.gb.residential.subletting.summary=Assignment, subletting and lodgers only with the landlord's consent.
lease.gb.residential.maintenance.title=Repairs and fitness
lease.gb.residential.maintenance.summary=The landlord's statutory repairing and fitness duties in each nation; the tenant reports defects and gives access on 24 hours' notice.
lease.gb.residential.safety.title=Safety
lease.gb.residential.safety.summary=Gas safety check every 12 months, electrical inspection at least every 5 years, smoke and carbon monoxide alarms.
lease.gb.residential.energy-certificate.title=Energy performance certificate
lease.gb.residential.energy-certificate.summary=The landlord provides a valid energy performance certificate; in England and Wales the dwelling must be rated at least band E.
lease.gb.residential.registration.title=Registration and licensing
lease.gb.residential.registration.summary=Landlord registration in Wales, Scotland and Northern Ireland and any licence required by the local authority.
lease.gb.residential.right-to-rent.title=Right to rent
lease.gb.residential.right-to-rent.summary=Right to rent immigration checks of adult occupiers, which apply only in England.
lease.gb.residential.statutory-information.title=Statutory information
lease.gb.residential.statutory-information.summary=The written statement, terms or tenancy information the landlord must give under the law of each nation, and an address for notices.
lease.gb.residential.handover-inspection.title=Inventory and return
lease.gb.residential.handover-inspection.summary=Inventory and condition record at the start; return of the dwelling at the end, fair wear and tear excepted.
lease.gb.residential.termination.title=Termination
lease.gb.residential.termination.summary=The tenant's notice and the landlord's statutory grounds and notices in each nation; no section 21 eviction in England.
lease.gb.residential.notices.title=Notices
lease.gb.residential.notices.summary=Written notices by hand, by post or, where permitted, by email.
lease.gb.residential.data-protection.title=Data protection
lease.gb.residential.data-protection.summary=Processing of the tenant's personal data under the UK GDPR and the Data Protection Act 2018.
lease.gb.residential.disputes.title=Governing law and disputes
lease.gb.residential.disputes.summary=The law and the courts or tribunals of the nation in which the dwelling is located.
lease.gb.commercial.parties.title=Parties
lease.gb.commercial.parties.summary=Identifies the landlord and the tenant with company number, registered office and VAT number.
lease.gb.commercial.premises.title=Premises
lease.gb.commercial.premises.summary=Describes the business premises, their area and the rights granted.
lease.gb.commercial.permitted-use.title=Permitted use
lease.gb.commercial.permitted-use.summary=The permitted business use; the tenant obtains planning permission and other consents.
lease.gb.commercial.term.title=Term
lease.gb.commercial.term.summary=Start date, fixed term or periodic tenancy; registration of leases of more than 7 years and land transaction tax.
lease.gb.commercial.security-of-tenure.title=Security of tenure
lease.gb.commercial.security-of-tenure.summary=Renewal rights under the Landlord and Tenant Act 1954 (England and Wales) or the 1996 Order (Northern Ireland), contracting out, and tacit relocation in Scotland.
lease.gb.commercial.rent.title=Rent
lease.gb.commercial.rent.summary=The rent, exclusive of VAT, service charge and insurance rent.
lease.gb.commercial.rent-adjustment.title=Rent review
lease.gb.commercial.rent-adjustment.summary=Review to open market rent or by index, upwards or downwards, with determination by an independent expert.
lease.gb.commercial.service-costs.title=Service charge
lease.gb.commercial.service-costs.summary=A fair proportion of the building's service costs, with a budget and an annual statement.
lease.gb.commercial.vat.title=VAT
lease.gb.commercial.vat.summary=All sums are exclusive of VAT; VAT is payable where the landlord has opted to tax.
lease.gb.commercial.deposit.title=Rent deposit
lease.gb.commercial.deposit.summary=Rent deposit held in a separate interest-bearing account, with top-up and repayment rules.
lease.gb.commercial.payment.title=Payment
lease.gb.commercial.payment.summary=Rent paid in advance without set-off, interest on late payment and commercial rent arrears recovery in England and Wales.
lease.gb.commercial.maintenance.title=Repairs
lease.gb.commercial.maintenance.summary=Full or internal repairing obligation, limited by any schedule of condition.
lease.gb.commercial.alterations.title=Alterations
lease.gb.commercial.alterations.summary=No structural alterations; other alterations with consent; reinstatement at the end of the lease.
lease.gb.commercial.assignment.title=Assignment and subletting
lease.gb.commercial.assignment.summary=Assignment and underletting with consent not unreasonably withheld; release and guarantee rules in England and Wales.
lease.gb.commercial.insurance.title=Insurance
lease.gb.commercial.insurance.summary=The landlord insures the building and recovers the premium; the tenant insures contents and liability; rent suspension after insured damage.
lease.gb.commercial.energy-certificate.title=Energy performance
lease.gb.commercial.energy-certificate.summary=Energy performance certificate for the premises; minimum band E for non-domestic lettings in England and Wales.
lease.gb.commercial.break-option.title=Break option
lease.gb.commercial.break-option.summary=Option to end the lease early on a break date, with notice and conditions.
lease.gb.commercial.handover-inspection.title=Condition and yielding up
lease.gb.commercial.handover-inspection.summary=Schedule of condition, return with vacant possession and the limit on damages for disrepair.
lease.gb.commercial.termination.title=Termination and forfeiture
lease.gb.commercial.termination.summary=Forfeiture or irritancy for non-payment, breach or insolvency, subject to statutory notice and relief.
lease.gb.commercial.notices.title=Notices
lease.gb.commercial.notices.summary=Written notices by hand or by recorded delivery to the registered office.
lease.gb.commercial.guarantor.title=Guarantor
lease.gb.commercial.guarantor.summary=Guarantee of the tenant's obligations by a guarantor.
lease.gb.commercial.data-protection.title=Data protection
lease.gb.commercial.data-protection.summary=Processing of the personal data of the parties' representatives under the UK GDPR.
lease.gb.commercial.disputes.title=Governing law and disputes
lease.gb.commercial.disputes.summary=The law and the courts of the jurisdiction in which the premises are located; severability.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Parties
lease.gr.residential.parties.summary=Identifies the landlord and the tenant with tax number and identity details; co-tenants are jointly and severally liable.
lease.gr.residential.premises.title=Leased premises
lease.gr.residential.premises.summary=Describes the dwelling let as the tenant's main residence, its appurtenances and the cadastre code.
lease.gr.residential.term.title=Term
lease.gr.residential.term.summary=Fixed or indefinite term; statutory minimum of 3 years for a main residence, shortened only by a later notarial agreement.
lease.gr.residential.rent.title=Rent
lease.gr.residential.rent.summary=Freely agreed rent; no release from the rent for reasons concerning the tenant.
lease.gr.residential.rent-adjustment.title=Rent adjustment
lease.gr.residential.rent-adjustment.summary=Freely agreed adjustment; statutory default of 75% of the cost-of-living index for terms under 3 years without an adjustment clause.
lease.gr.residential.service-costs.title=Utilities and common charges
lease.gr.residential.service-costs.summary=Utilities and common charges of use borne by the tenant; taxes and extraordinary building costs borne by the landlord.
lease.gr.residential.deposit.title=Security deposit
lease.gr.residential.deposit.summary=Optional deposit, not set off against rent, returned at the end less the sums owed.
lease.gr.residential.payment.title=Payment
lease.gr.residential.payment.summary=Payment date and bank transfer; from its start date, payment into a landlord bank account notified to the AADE.
lease.gr.residential.use.title=Use
lease.gr.residential.use.summary=Careful use as a main residence, house rules and landlord visits up to 1 time every 3 months.
lease.gr.residential.subletting.title=Subletting
lease.gr.residential.subletting.summary=Subletting and short-term rental only with the landlord's written consent; liability for the third party.
lease.gr.residential.maintenance.title=Maintenance and defects
lease.gr.residential.maintenance.summary=The landlord keeps the premises fit for use; rent reduction for defects, expenses and the tenant's duty to report.
lease.gr.residential.energy-certificate.title=Energy performance certificate
lease.gr.residential.energy-certificate.summary=Mandatory certificate shown and handed over to a new tenant, with its number entered in the lease declaration.
lease.gr.residential.registration.title=AADE lease declaration
lease.gr.residential.registration.summary=Electronic declaration of the lease to the tax authority and acceptance by the tenant within 30 days.
lease.gr.residential.sale-of-premises.title=Sale of the premises
lease.gr.residential.sale-of-premises.summary=Position of the new owner under a lease of certain date and the new owner's notice rights otherwise.
lease.gr.residential.handover-inspection.title=Handover and return
lease.gr.residential.handover-inspection.summary=Handover report, return in the condition received, holding over and 6-month limitation periods.
lease.gr.residential.termination.title=Termination
lease.gr.residential.termination.summary=Minimum term, notice for indefinite leases, termination for arrears, tenant grounds, family home and order for possession.
lease.gr.residential.data-protection.title=Data protection
lease.gr.residential.data-protection.summary=Processing of the tenant's personal data under the GDPR and Law 4624/2019.
lease.gr.residential.disputes.title=Applicable law and disputes
lease.gr.residential.disputes.summary=Greek law and the court of the place of the property under the special procedure for lease disputes.
lease.gr.commercial.parties.title=Parties
lease.gr.commercial.parties.summary=Identifies the landlord and the tenant with tax number, commercial register number and legal representatives.
lease.gr.commercial.premises.title=Leased premises
lease.gr.commercial.premises.summary=Describes the business premises, their appurtenances and their suitability for the agreed use.
lease.gr.commercial.permitted-use.title=Permitted use
lease.gr.commercial.permitted-use.summary=The tenant's activity, the scope of Presidential Decree 34/1995, licences and careful use.
lease.gr.commercial.term.title=Term
lease.gr.commercial.term.summary=Fixed or indefinite term; 3-year minimum for leases under Presidential Decree 34/1995 and no statutory goodwill compensation.
lease.gr.commercial.rent.title=Rent
lease.gr.commercial.rent.summary=Rent freely set by the parties, plus the tax levied on the rent.
lease.gr.commercial.rent-adjustment.title=Rent adjustment
lease.gr.commercial.rent-adjustment.summary=Agreed adjustment, statutory default rules and the 3% cap on adjustments in 2026.
lease.gr.commercial.service-costs.title=Utilities and common charges
lease.gr.commercial.service-costs.summary=Utilities and common charges borne by the tenant; taxes on the premises borne by the landlord unless agreed otherwise.
lease.gr.commercial.vat.title=VAT and digital transaction duty
lease.gr.commercial.vat.summary=VAT where opted for, otherwise the 3.60% digital transaction duty, declared by the landlord or in the cases provided by law by the tenant.
lease.gr.commercial.deposit.title=Security deposit
lease.gr.commercial.deposit.summary=Optional cash deposit or bank guarantee, topped up with rent adjustments and returned at the end.
lease.gr.commercial.payment.title=Payment
lease.gr.commercial.payment.summary=Payment date, bank transfer and tax documents; payment into a landlord account notified to the AADE where the rent is not a business expense.
lease.gr.commercial.maintenance.title=Maintenance and defects
lease.gr.commercial.maintenance.summary=The landlord keeps the premises fit for use; split of ordinary upkeep and structural repairs.
lease.gr.commercial.alterations.title=Fit-out and alterations
lease.gr.commercial.alterations.summary=Fit-out works at the tenant's expense with written consent; expenses and what happens to the works at the end.
lease.gr.commercial.assignment.title=Assignment and subletting
lease.gr.commercial.assignment.summary=Transfer of use only as permitted by law or with consent; company exception after 3 years and transfer on illness or death.
lease.gr.commercial.insurance.title=Insurance
lease.gr.commercial.insurance.summary=Building insurance by the landlord; equipment, goods and liability insurance by the tenant.
lease.gr.commercial.energy-certificate.title=Energy performance certificate
lease.gr.commercial.energy-certificate.summary=Mandatory certificate shown and handed over to a new tenant, with its number entered in the lease declaration.
lease.gr.commercial.registration.title=AADE lease declaration
lease.gr.commercial.registration.summary=Electronic declaration of the lease to the tax authority and acceptance by the tenant within 30 days.
lease.gr.commercial.sale-of-premises.title=Sale of the premises
lease.gr.commercial.sale-of-premises.summary=Position of the new owner under a lease of certain date and the new owner's notice rights otherwise.
lease.gr.commercial.handover-inspection.title=Handover and return
lease.gr.commercial.handover-inspection.summary=Handover report, return in the condition received, holding over, limitation periods and viewings.
lease.gr.commercial.termination.title=Termination
lease.gr.commercial.termination.summary=Notice rules, termination for arrears, tenant grounds and order for possession; early termination only if agreed.
lease.gr.commercial.data-protection.title=Data protection
lease.gr.commercial.data-protection.summary=Processing of the personal data of the persons acting for the parties under the GDPR.
lease.gr.commercial.disputes.title=Applicable law and disputes
lease.gr.commercial.disputes.summary=Greek law, the court of the place of the property and nullity of waivers under Presidential Decree 34/1995.
