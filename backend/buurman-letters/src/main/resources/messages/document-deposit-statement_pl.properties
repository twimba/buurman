deposit.disclaimer=Rozliczenie wydano na podstawie umowy najmu. Ustawowe terminy i procedury sporne dotyczące kaucji różnią się w zależności od jurysdykcji i nie są zmieniane tym dokumentem.
deposit.legal.NL=Zgodnie z prawem niderlandzkim kaucja musi zostać zwrócona w rozsądnym terminie po zakończeniu najmu; sporne potrącenia mogą zostać poddane ocenie Huurcommissie lub sądu.
deposit.legal.DE=Zgodnie z § 551 BGB kaucja musi być przechowywana odrębnie od majątku wynajmującego i rozliczona w rozsądnym terminie (zwykle do sześciu miesięcy) po zakończeniu najmu.
deposit.legal.FR=Zgodnie z artykułem 22 ustawy 89-462 kaucja musi zostać zwrócona w terminie jednego miesiąca (dwóch miesięcy w przypadku potrąceń) od zwrotu kluczy; zwłoka powoduje naliczenie 10% miesięcznego czynszu za każdy miesiąc opóźnienia.
deposit.legal.BE=Kaucja została złożona na rachunku zablokowanym na nazwisko najemcy, zgodnie z regionalnym dekretem o najmie mieszkaniowym; jej zwolnienie wymaga zgody obu stron lub orzeczenia sądu.
deposit.legal.ES=Zgodnie z artykułem 36 LAU kaucja musi zostać zwrócona w terminie jednego miesiąca od zwrotu kluczy; po tym terminie od kwoty naliczane są odsetki ustawowe.
deposit.legal.PT=Zgodnie z portugalskim Kodeksem cywilnym kaucja (caução) musi zostać zwrócona po zakończeniu najmu, po rozliczeniu ewentualnych należnych kwot.
deposit.legal.GB=Kaucje w ramach assured shorthold tenancy w Anglii i Walii muszą być chronione w systemie zatwierdzonym przez państwo; spory mogą zostać skierowane do bezpłatnej usługi rozstrzygania sporów tego systemu.
deposit.legal.IT=Zgodnie z artykułem 11 ustawy 392/1978 kaucja (deposito cauzionale) nie może przekraczać trzymiesięcznego czynszu i jest oprocentowana według odsetek ustawowych płatnych najemcy corocznie.
