deposit.legal.NL=Nos termos do direito neerlandês, a caução deve ser devolvida num prazo razoável após o fim do arrendamento; as deduções contestadas podem ser submetidas à Huurcommissie ou aos tribunais.
deposit.legal.DE=Nos termos do § 551 BGB, a caução deve ser mantida separada do património do senhorio e acertada num prazo razoável (em regra até seis meses) após o fim do arrendamento.
deposit.legal.FR=Nos termos do artigo 22.º da Lei 89-462, a caução deve ser devolvida no prazo de um mês (dois meses havendo deduções) após a entrega das chaves; o atraso vence 10% da renda mensal por cada mês de mora.
deposit.legal.BE=A caução foi depositada em conta bloqueada em nome do arrendatário, conforme exigido pelo decreto regional do arrendamento habitacional; o seu levantamento exige o acordo de ambas as partes ou decisão judicial.
deposit.legal.ES=Nos termos do artigo 36.º da LAU, a caução deve ser devolvida no prazo de um mês após a entrega das chaves; findo esse prazo, vencem juros legais.
deposit.legal.PT=Nos termos do Código Civil, a caução deve ser restituída no fim do arrendamento após acerto dos montantes devidos.
deposit.legal.GB=As cauções de assured shorthold tenancy em Inglaterra e no País de Gales devem ser protegidas num regime aprovado pelo Estado; os litígios podem ser submetidos ao serviço gratuito de resolução de litígios desse regime.
deposit.legal.IT=Nos termos do artigo 11.º da Lei 392/1978, a caução (deposito cauzionale) não pode exceder três meses de renda e vence juros legais a pagar anualmente ao arrendatário.
