legal.NL=Tähän jatkoon sovelletaan Alankomaiden vuokralainsäädäntöä (huurrecht). Osapuolet voivat saattaa riidat Huurcommissie-lautakunnan käsiteltäväksi.
legal.DE=Tämä jatkosopimus tehdään BGB:n §557 mukaisesti (Mietverhöhungsvereinbarung). Sovellettavat vuokrasääntelymääräykset (Mietpreisbremse) voivat tulla sovellettaviksi.
legal.FR=Tähän jatkoon sovelletaan Ranskan vuokralainsäädäntöä. Loi ALUR -säännöksiä voidaan soveltaa säännellyillä alueilla (zones tendues). Vuokrantarkistukset noudattavat IRL-indeksiä.
legal.BE=Tähän jatkoon sovelletaan alueellista asuntolainsäädäntöä. Vuokran indeksointi perustuu Gezondheidsindex-indeksiin (terveysindeksi).
legal.ES=Tähän jatkoon sovelletaan LAU:ta (Ley de Arrendamientos Urbanos). Art. 9-10:n vähimmäisvuokrakautta koskevia säännöksiä voidaan soveltaa.
legal.PT=Tähän jatkoon sovelletaan NRAU:ta (Novo Regime do Arrendamento Urbano). Vuokrankorotukset noudattavat INE-kerrointa.
legal.AT=Tähän jatkoon sovelletaan Itävallan vuokralainsäädäntöä (MRG). Richtwertmietzins-järjestelmää voidaan soveltaa.
legal.GB=Tähän jatkoon sovelletaan Housing Act 1988 -lakia (muutoksineen). Section 13:n ilmoitusvaatimuksia voidaan soveltaa vuokrankorotuksiin.
legal.IT=Tähän jatkoon sovelletaan Italian vuokralainsäädäntöä (Legge 431/1998). ISTAT FOI -indeksin mukaisia tarkistuksia voidaan soveltaa.
legal.SE=Tähän jatkoon sovelletaan Hyreslagen-lakia. Vuokrataso määräytyy bruksvärdessystemet-järjestelmän (käyttöarvojärjestelmä) mukaan.
legal.DK=Tähän jatkoon sovelletaan Lejeloven-lakia. Vuokrasääntely riippuu rakennuksen iästä ja vuokrasuhteen tyypistä.
legal.IE=Tähän jatkoon sovelletaan Residential Tenancies Act 2004 -lakia. Rent Pressure Zone (RPZ) -rajoituksia voidaan soveltaa.
legal.PL=Tähän jatkoon sovelletaan Puolan siviililain art. 6851-6852. Vuokrankorotuksiin sovelletaan kirjallisen ilmoituksen vaatimusta.
legal.FI=Tähän jatkoon sovelletaan asuinhuoneiston vuokrauksesta annettua lakia (481/1995). Vuokrantarkistukset noudattavat sopimusehtoja.
legal.NO=Tähän jatkoon sovelletaan Husleieloven-lakia. Kuluttajahintaindeksiin perustuvat tarkistukset määräytyvät §4-2/§4-3 mukaan.
legal.US=Tähän jatkoon sovelletaan sovellettavaa osavaltion ja paikallista vuokralainsäädäntöä. Vuokrasääntely voi tulla sovellettavaksi tietyillä lainkäyttöalueilla.
legal.CA=Tähän jatkoon sovelletaan sovellettavaa provinssin vuokralainsäädäntöä. Vuosittaisia ohjeellisia vuokrankorotuksia voidaan soveltaa.
legal.HU=Tähän jatkoon sovelletaan Unkarin siviililakia. Vuokrantarkistuksen ehdot määräytyvät vuokrasopimuksen mukaan.
legal.CZ=Tähän jatkoon sovelletaan Tšekin siviililain §2249. Korotukset vertailukelpoiseen markkinavuokraan on rajoitettu 20 prosenttiin kolmen vuoden aikana.
legal.CH=Tähän jatkoon sovelletaan Sveitsin vuokralainsäädäntöä (Obligationenrecht art. 269-270). Tarkistukset on sidottu viitekorkoon (Referenzzinssatz).

