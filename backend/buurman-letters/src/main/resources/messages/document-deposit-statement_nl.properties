deposit.legal.NL=Naar Nederlands recht moet de waarborgsom binnen een redelijke termijn na het einde van de huur worden terugbetaald; over betwiste inhoudingen kan de Huurcommissie of de rechter oordelen.
deposit.legal.DE=Op grond van § 551 BGB moet de waarborgsom gescheiden van het vermogen van de verhuurder worden aangehouden en binnen een redelijke termijn (doorgaans tot zes maanden) na het einde van de huur worden afgerekend.
deposit.legal.FR=Op grond van artikel 22 van wet 89-462 moet de waarborgsom binnen één maand (twee maanden bij inhoudingen) na teruggave van de sleutels worden terugbetaald; bij te late terugbetaling is 10% van de maandhuur per maand vertraging verschuldigd.
deposit.legal.BE=De waarborgsom is op een geblokkeerde rekening op naam van de huurder geplaatst, zoals vereist door het gewestelijke woninghuurdecreet; vrijgave vereist de instemming van beide partijen of een rechterlijke beslissing.
deposit.legal.ES=Op grond van artikel 36 LAU moet de waarborgsom binnen één maand na teruggave van de sleutels worden terugbetaald; daarna is wettelijke rente verschuldigd.
deposit.legal.PT=Op grond van het Portugese Burgerlijk Wetboek moet de waarborgsom (caução) bij het einde van de huur worden terugbetaald na verrekening van eventuele verschuldigde bedragen.
deposit.legal.GB=Waarborgsommen bij een assured shorthold tenancy in Engeland en Wales moeten in een door de overheid goedgekeurde regeling worden beschermd; geschillen kunnen worden voorgelegd aan de kosteloze geschillenregeling van die regeling.
deposit.legal.IT=Op grond van artikel 11 van wet 392/1978 mag de waarborgsom (deposito cauzionale) niet meer dan drie maanden huur bedragen en is daarover jaarlijks wettelijke rente aan de huurder verschuldigd.
