lease.be.commercial.parties.title=Parter
lease.be.commercial.parties.summary=Opplysninger om foretakene, deres representanter og mva-numre samt den belgiske loven om næringsleie.
lease.be.commercial.premises.title=Leieobjektet
lease.be.commercial.premises.summary=Adresse, areal og beskrivelse, inkludert bolig- eller tilleggsarealer som omfattes av den lovbestemte leietiden.
lease.be.commercial.permitted-use.title=Bruksformål
lease.be.commercial.permitted-use.summary=Detaljhandel eller håndverk i direkte kontakt med publikum; lovens virkeområde og avtaler på høyst 1 år.
lease.be.commercial.term.title=Leietid
lease.be.commercial.term.summary=Minst 9 år; leietakeren kan si opp ved hver 3-årsperiode med 6 måneders varsel, utleier bare dersom det er avtalt.
lease.be.commercial.rent.title=Leie
lease.be.commercial.rent.summary=Leie uten kostnader, avgifter og skatter, fritt fastsatt.
lease.be.commercial.rent-adjustment.title=Indeksering og regulering
lease.be.commercial.rent-adjustment.summary=Avtalt indeksering etter helseindeksen 1 gang per år og rettslig regulering ved hver 3-årsperiode ved en forskjell på minst 15 %.
lease.be.commercial.service-costs.title=Kostnader og avgifter
lease.be.commercial.service-costs.summary=Uttømmende liste over kostnader, avgifter og skatter som leietakeren betaler, avregnet minst årlig.
lease.be.commercial.vat.title=Merverdiavgift
lease.be.commercial.vat.summary=Utleie i utgangspunktet unntatt fra merverdiavgift, med mulighet for avgiftspliktig utleie av næringsbygg.
lease.be.commercial.deposit.title=Leiegaranti
lease.be.commercial.deposit.summary=Leiegaranti med avtalt beløp og form; ikke noe lovbestemt tak for næringsleie.
lease.be.commercial.payment.title=Betaling
lease.be.commercial.payment.summary=Betaling per termin ved overføring på avtalt dag; lovbestemt rente etter påkrav.
lease.be.commercial.maintenance.title=Vedlikehold og reparasjoner
lease.be.commercial.maintenance.summary=Utleiers og leietakers reparasjoner etter den tidligere belgiske sivillovboken, med mindre annet er avtalt.
lease.be.commercial.alterations.title=Ombygginger
lease.be.commercial.alterations.summary=Leietakers rett til ombygginger opp til 3 års leie etter varsel, utleiers innsigelse innen 30 dager og håndtering ved leieforholdets slutt.
lease.be.commercial.assignment.title=Overdragelse og fremleie
lease.be.commercial.assignment.summary=Samtykke kreves, unntatt ved overdragelse eller fremleie sammen med virksomheten, med forbehold om innsigelse innen 30 dager.
lease.be.commercial.insurance.title=Forsikring
lease.be.commercial.insurance.summary=Leietakeren forsikrer sitt ansvar og innboet, utleier forsikrer bygningen.
lease.be.commercial.energy-certificate.title=Energiattest
lease.be.commercial.energy-certificate.summary=Energiattest når de regionale reglene krever det, med nummer, dato og klasse.
lease.be.commercial.registration.title=Registrering
lease.be.commercial.registration.summary=Registrering etter skattelovgivningen, som gir avtalen en sikker dato; part som betaler registreringsavgiftene.
lease.be.commercial.handover-inspection.title=Overtakelsesprotokoll
lease.be.commercial.handover-inspection.summary=Felles detaljert protokoll, vedlagt og registrert; tilbakelevering i mottatt stand.
lease.be.commercial.renewal.title=Fornyelse
lease.be.commercial.renewal.summary=Rett til 3 fornyelser på 9 år, anmodning 18 til 15 måneder før utløp, avslagsgrunner og fraflyttingserstatning.
lease.be.commercial.transfer.title=Avhending av leieobjektet
lease.be.commercial.transfer.summary=Erververen kan bare kaste ut leietakeren på lovbestemte grunnlag med 1 års varsel gitt innen 3 måneder.
lease.be.commercial.termination.title=Opphør
lease.be.commercial.termination.summary=Opphør ved en 3-årsperiode, tidsubestemt leieforhold etter tapt fornyelsesrett, rettslig heving ved mislighold.
lease.be.commercial.data-protection.title=Personvern
lease.be.commercial.data-protection.summary=Behandling av personopplysninger om partene og deres representanter etter GDPR.
lease.be.commercial.disputes.title=Tvister
lease.be.commercial.disputes.summary=Belgisk rett og fredsdommeren på leieobjektets sted; forutgående forliksforsøk mulig.
