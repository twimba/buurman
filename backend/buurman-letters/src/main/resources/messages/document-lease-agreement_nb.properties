# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Parter
lease.fr.residential.parties.summary=Angir utleier og leietaker eller leietakere; medleietakere hefter solidarisk innenfor de lovbestemte grensene.
lease.fr.residential.premises.title=Leieobjektet
lease.fr.residential.premises.summary=Beskriver den umøblerte boligen som leies ut som hovedbolig etter loven av 6. juli 1989 og standardkontrakten.
lease.fr.residential.term.title=Leietid
lease.fr.residential.term.summary=Startdato, minste leietid på 3 eller 6 år avhengig av utleier og stilltiende fornyelse.
