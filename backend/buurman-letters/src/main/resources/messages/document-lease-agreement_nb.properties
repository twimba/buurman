lease.fr.residential.rent-adjustment.summary=Årlig regulering begrenset av leiereferanseindeksen (IRL); ingen regulering i energiklasse F og G.
lease.fr.residential.service-costs.title=Felleskostnader
lease.fr.residential.service-costs.summary=Kostnader som kan kreves dekket, betales a konto med årlig avregning og bilag.
lease.fr.residential.deposit.title=Depositum
lease.fr.residential.deposit.summary=Depositum på høyst 1 måneds husleie uten felleskostnader, tilbakebetales innen 1 eller 2 måneder.
lease.fr.residential.payment.title=Betaling
lease.fr.residential.payment.summary=Når og hvordan leien betales; månedlig betaling på forespørsel, gratis kvitteringer og ingen bøter.
lease.fr.residential.use.title=Bruk
lease.fr.residential.use.summary=Fredelig bruk som hovedbolig; endringer bare med utleiers skriftlige samtykke.
lease.fr.residential.subletting.title=Fremleie
lease.fr.residential.subletting.summary=Overdragelse og fremleie bare med utleiers skriftlige samtykke, også om leien.
lease.fr.residential.maintenance.title=Vedlikehold og reparasjoner
lease.fr.residential.maintenance.summary=Utleiers plikter om forsvarlig standard og reparasjoner, leietakers løpende vedlikehold og adgang for arbeider.
lease.fr.residential.works.title=Arbeider
lease.fr.residential.works.summary=Arbeider utført siden forrige leieavtale og avtalte forbedringsarbeider med eventuell leieøkning.
lease.fr.residential.diagnostics.title=Tekniske undersøkelser
lease.fr.residential.diagnostics.summary=Tekniske undersøkelsesrapporter som vedlegg, energiklasse og minste energiytelse.
lease.fr.residential.insurance.title=Forsikring
lease.fr.residential.insurance.summary=Leietaker forsikrer leietakers risiko og dokumenterer det hvert år på forespørsel.
lease.fr.residential.handover-inspection.title=Overtakelsesprotokoll
lease.fr.residential.handover-inspection.summary=Inn- og utflyttingsprotokoll, utarbeidet i fellesskap eller av en namsmann.
lease.fr.residential.termination.title=Oppsigelse
lease.fr.residential.termination.summary=Oppsigelse fra leietaker (3 eller 1 måned) og utleier (6 måneder, lovbestemte grunner); hevingsklausul.
lease.fr.residential.annexes.title=Vedlegg
lease.fr.residential.annexes.summary=Obligatoriske vedlegg: informasjonsskriv, undersøkelsesrapporter, overtakelsesprotokoll og utdrag av sameiets vedtekter.
lease.fr.residential.data-protection.title=Personvern
lease.fr.residential.data-protection.summary=Behandling av leietakers personopplysninger i samsvar med GDPR.
lease.fr.residential.disputes.title=Tvister
lease.fr.residential.disputes.summary=Fransk rett gjelder; forliksnemnd og dommer for vernesaker.
