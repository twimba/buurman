# ===== CH lease clause titles and summaries (country pack) =====
lease.ch.residential.parties.title=Parter
lease.ch.residential.parties.summary=Angir utleieren og leietakeren eller leietakerne, deres solidariske ansvar og om boligen er familiens bolig.
lease.ch.residential.premises.title=Leid bolig
lease.ch.residential.premises.summary=Beskriver boligen og biromene; sveitsisk husleierett (OR, VMWG) gjelder, med unntakene for luksusboliger og ferieleiligheter.
lease.ch.residential.term.title=Leietid
lease.ch.residential.term.summary=Startdato; tidsubestemt leie eller tidsbestemt leie som opphører uten oppsigelse og blir tidsubestemt ved stilltiende fortsettelse.
lease.ch.residential.rent.title=Leie
lease.ch.residential.rent.summary=Nettoleie og grunnlaget for den (referanserente, konsumprisindeks), angrep på startleien innen 30 dager og det kantonale skjemaet.
lease.ch.residential.rent-adjustment.title=Leiejusteringer
lease.ch.residential.rent-adjustment.summary=Økninger bare på begrunnet kantonalt skjema, angrep innen 30 dager, krav om nedsettelse, indeksert og trappeleie.
lease.ch.residential.service-costs.title=Felleskostnader
lease.ch.residential.service-costs.summary=Felleskostnader bare hvis de er særskilt avtalt, akontobetalinger med årlig oppgjør eller fast beløp, rett til innsyn i bilagene.
lease.ch.residential.deposit.title=Depositum
lease.ch.residential.deposit.summary=Sikkerhet på høyst 3 måneders leie på en bankkonto i leietakerens navn, frigis med begge parters samtykke, etter rettskraftig avgjørelse eller etter 1 år.
lease.ch.residential.payment.title=Betaling
lease.ch.residential.payment.summary=Leien betales på avtalt dag, forsinkelsesrente på 5 prosent, betalingsfrist på minst 30 dager før oppsigelse på grunn av restanse.
lease.ch.residential.use.title=Bruk
lease.ch.residential.use.summary=Bare til bolig, aktsomhet og hensyn til naboer, husordensregler og visninger varslet i god tid.
lease.ch.residential.subletting.title=Fremleie
lease.ch.residential.subletting.summary=Fremleie med utleierens samtykke, som bare kan nektes på de lovbestemte grunnene.
lease.ch.residential.maintenance.title=Vedlikehold og mangler
lease.ch.residential.maintenance.summary=Utleieren vedlikeholder boligen, leietakeren utfører mindre rengjøring og reparasjoner; leienedsettelse og deponering av leien ved mangler.
lease.ch.residential.handover-inspection.title=Overtakelse og tilbakelevering
lease.ch.residential.handover-inspection.summary=Overtakelsesprotokoll, mangler meldes innen 14 dager, tilbakelevering i kontraktsmessig stand og straks melding om mangler fra utleieren.
lease.ch.residential.termination.title=Oppsigelse
lease.ch.residential.termination.summary=Skriftlig oppsigelse, fra utleieren på kantonalt skjema, 3 måneder til avtalte eller stedvanlige terminer; angrep og forlengelse inntil 4 år.
lease.ch.residential.data-protection.title=Personvern
lease.ch.residential.data-protection.summary=Behandling av leietakerens personopplysninger etter den sveitsiske føderale personvernloven og leietakerens rettigheter.
lease.ch.residential.disputes.title=Tvister
lease.ch.residential.disputes.summary=Sveitsisk rett, forliksmyndighet før rettssaken, domstolen på stedet der eiendommen ligger.
lease.ch.commercial.parties.title=Parter
lease.ch.commercial.parties.summary=Angir utleieren og leietakeren med foretaksnummer (UID), mva-nummer og representanter; solidarisk ansvar.
lease.ch.commercial.premises.title=Leid lokale
lease.ch.commercial.premises.summary=Beskriver forretningslokalet og biarealene; vernet mot urimelig leie og mot oppsigelse gjelder også her.
lease.ch.commercial.permitted-use.title=Bruksformål
lease.ch.commercial.permitted-use.summary=Avtalt virksomhetsformål, endringer bare med skriftlig samtykke, fordeling av offentlige tillatelser.
lease.ch.commercial.term.title=Leietid
lease.ch.commercial.term.summary=Startdato; tidsubestemt eller tidsbestemt leie som opphører uten oppsigelse, og en eventuell forlengelsesopsjon for leietakeren.
lease.ch.commercial.rent.title=Leie
lease.ch.commercial.rent.summary=Nettoleie og grunnlaget for den, angrep på startleien innen 30 dager og et eventuelt kantonalt skjema.
lease.ch.commercial.rent-adjustment.title=Leiejusteringer
lease.ch.commercial.rent-adjustment.summary=Indeksert leie (avtale på minst 5 år, konsumprisindeks) eller trappeleie, ellers økninger på begrunnet kantonalt skjema.
lease.ch.commercial.service-costs.title=Felleskostnader
lease.ch.commercial.service-costs.summary=Felleskostnader bare hvis de er særskilt avtalt, akontobetalinger med årlig oppgjør eller fast beløp, rett til innsyn i bilagene.
lease.ch.commercial.vat.title=Merverdiavgift
lease.ch.commercial.vat.summary=Utleie er unntatt fra merverdiavgift, med lovbestemte unntak som separat utleide parkeringsplasser; utleieren kan velge avgiftsplikt, unntatt ved bruk utelukkende til boligformål.
lease.ch.commercial.deposit.title=Depositum
lease.ch.commercial.deposit.summary=Sikkerhet uten lovbestemt maksimum, deponert på en bankkonto i leietakerens navn eller erstattet av en bankgaranti.
lease.ch.commercial.payment.title=Betaling
lease.ch.commercial.payment.summary=Leien betales på avtalt dag, forsinkelsesrente på 5 prosent, betalingsfrist på minst 30 dager før oppsigelse på grunn av restanse.
lease.ch.commercial.maintenance.title=Vedlikehold og mangler
lease.ch.commercial.maintenance.summary=Utleieren vedlikeholder lokalet, leietakeren utfører mindre rengjøring og reparasjoner; rettigheter ved mangler, arbeider og visninger.
lease.ch.commercial.alterations.title=Leietakerens endringer
lease.ch.commercial.alterations.summary=Endringer og skilt bare med skriftlig samtykke; tilbakeføring bare hvis avtalt skriftlig; godtgjørelse for betydelig verdiøkning.
lease.ch.commercial.subletting.title=Fremleie
lease.ch.commercial.subletting.summary=Fremleie med utleierens samtykke, som bare kan nektes på de lovbestemte grunnene.
lease.ch.commercial.assignment.title=Overdragelse av leieforholdet
lease.ch.commercial.assignment.summary=Overdragelse til tredjemann med skriftlig samtykke, som bare kan nektes av viktig grunn; solidarisk ansvar i høyst 2 år.
lease.ch.commercial.retention-right.title=Utleierens tilbakeholdsrett
lease.ch.commercial.retention-right.summary=Tilbakeholdsrett i løsøre i lokalet for en forfalt årsleie og den løpende halvårsleien.
lease.ch.commercial.insurance.title=Forsikring
lease.ch.commercial.insurance.summary=Utleieren forsikrer bygningen; leietakeren forsikrer inventar og varer og har en ansvarsforsikring for virksomheten.
lease.ch.commercial.handover-inspection.title=Overtakelse og tilbakelevering
lease.ch.commercial.handover-inspection.summary=Overtakelsesprotokoll, tilbakelevering ryddet og i kontraktsmessig stand, straks melding om mangler fra utleieren.
lease.ch.commercial.termination.title=Oppsigelse
lease.ch.commercial.termination.summary=Skriftlig oppsigelse, fra utleieren på kantonalt skjema, 6 måneder til avtalte eller stedvanlige terminer; angrep og forlengelse inntil 6 år.
lease.ch.commercial.data-protection.title=Personvern
lease.ch.commercial.data-protection.summary=Behandling av personopplysninger om partene og deres representanter etter den sveitsiske føderale personvernloven.
lease.ch.commercial.disputes.title=Tvister
lease.ch.commercial.disputes.summary=Sveitsisk rett, forliksmyndighet før rettssaken, domstolen på stedet der eiendommen ligger.
