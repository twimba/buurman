lease.it.residential.handover-inspection.summary=Overtakelsesprotokoll ved start; tilbakelevering i samme stand bortsett fra normal slitasje; avtalt vederlag skyldes frem til tilbakelevering ved forsinkelse.
lease.it.residential.termination.title=Fratredelse og nektet fornyelse
lease.it.residential.termination.summary=Leietaker kan fratre av alvorlige grunner med 6 måneders varsel; utleier kan nekte fornyelse ved første utløp bare av lovbestemte grunner.
lease.it.residential.notices.title=Meldinger
lease.it.residential.notices.summary=Rekommandert brev der loven krever det; adresser og sertifiserte e-postadresser for meldinger.
lease.it.residential.guarantor.title=Kausjonist
lease.it.residential.guarantor.summary=Frivillig kausjon opp til et maksimumsbeløp, solidarisk ansvar; utvidelse etter første utløp bare etter avtale.
lease.it.residential.data-protection.title=Personvern
lease.it.residential.data-protection.summary=Personopplysninger behandles bare for leieforholdet og rettslige forpliktelser i samsvar med GDPR og den italienske personvernloven.
lease.it.residential.disputes.title=Tvister
lease.it.residential.disputes.summary=Italiensk rett; domstolen på eiendommens sted; mekling påkrevd før de fleste leiesaker.
lease.it.commercial.parties.title=Parter
lease.it.commercial.parties.summary=Angir utleier og leietaker med selskaps-, skatte- og mva-opplysninger, registreringsnummer i foretaksregisteret og juridisk representant.
lease.it.commercial.premises.title=Leieobjektet
lease.it.commercial.premises.summary=Beskriver lokalet med matrikkelopplysninger og oppgitt bruksformål; ikke for boliger eller sesongutleie.
lease.it.commercial.permitted-use.title=Tillatt bruk
lease.it.commercial.permitted-use.summary=Virksomhet som drives og angivelse av direkte kundekontakt; tillatelser for leietakers regning; regler om endret bruk.
lease.it.commercial.term.title=Leietid og fornyelse
lease.it.commercial.term.summary=Minst 6 år (9 for hoteller og teatre) med stilltiende fornyelse; utleiers nektelse bare ved første utløp av lovbestemte grunner, 12 eller 18 måneder i forveien.
lease.it.commercial.rent.title=Leie
lease.it.commercial.rent.summary=Leie avtalt av partene; avtaler som gir utleier fordeler i strid med lov 392/1978, er ugyldige.
lease.it.commercial.rent-adjustment.title=Leieregulering
lease.it.commercial.rent-adjustment.summary=Frivillig årlig regulering på utleiers anmodning; økninger begrenset til 75% av endringen i ISTAT-indeksen for avtaler som ikke overstiger den lovbestemte varigheten.
lease.it.commercial.service-costs.title=Tilleggskostnader
lease.it.commercial.service-costs.summary=Lovbestemt fordeling av driftskostnader med mindre annet er avtalt; betaling innen 2 måneder etter anmodning, med rett til spesifikasjon og bilag.
lease.it.commercial.vat.title=Merverdiavgift
lease.it.commercial.vat.summary=Utleien er fritatt for merverdiavgift med mindre utleier velger avgiftsplikt for næringsbygg; valg og sats angis.
lease.it.commercial.deposit.title=Depositum
lease.it.commercial.deposit.summary=Frivillig depositum på høyst 3 måneders leie, med lovbestemt rente utbetalt årlig; tilbakebetales ved opphør med fradrag for skyldige beløp.
lease.it.commercial.payment.title=Betaling
lease.it.commercial.payment.summary=Periodisk betaling ved bankoverføring på avtalt dag; kvittering eller faktura; heving bare ved mislighold som ikke er uvesentlig.
lease.it.commercial.maintenance.title=Vedlikehold og reparasjoner
lease.it.commercial.maintenance.summary=Utleier utfører nødvendige reparasjoner, leietaker mindre vedlikehold med mindre annet er avtalt; hastereparasjoner, leiereduksjon ved langvarige arbeider.
lease.it.commercial.alterations.title=Ombygging og innredning
lease.it.commercial.alterations.summary=Arbeider bare med utleiers skriftlige samtykke; lovbestemte regler om godtgjørelse for forbedringer og fjerning av tilføyelser.
lease.it.commercial.assignment.title=Fremleie og overdragelse
lease.it.commercial.assignment.summary=Fremleie eller overdragelse uten samtykke sammen med virksomheten, med utleiers rett til innsigelse av alvorlige grunner innen 30 dager; ellers kreves samtykke.
lease.it.commercial.pre-emption.title=Forkjøpsrett
lease.it.commercial.pre-emption.summary=Leietakers forkjøps- og innløsningsrett ved salg og ny utleie, unntatt for lokaler uten kundekontakt og andre unntatte tilfeller.
lease.it.commercial.goodwill-compensation.title=Godtgjørelse for tap av kundekrets
lease.it.commercial.goodwill-compensation.summary=18 måneders leie (21 for hoteller) når leieforholdet opphører av annen grunn enn leietakers mislighold, oppsigelse, fratredelse eller insolvensbehandling; ikke for lokaler uten kundekontakt og andre unntatte tilfeller.
lease.it.commercial.insurance.title=Forsikring
lease.it.commercial.insurance.summary=Leietaker er ansvarlig for tap og brannskade med mindre leietaker er uten skyld; leietakers ansvarsforsikring og utleiers bygningsforsikring.
lease.it.commercial.energy-certificate.title=Energiattest
lease.it.commercial.energy-certificate.summary=Leietaker bekrefter mottak av informasjon og dokumentasjon om APE, med vedlagt kopi der det kreves; lovbestemte bøter ved unnlatelse.
lease.it.commercial.registration.title=Registrering og skatter
lease.it.commercial.registration.summary=Registrering innen 30 dager, kostnader deles likt; registreringsavgift på 1% eller 2%; cedolare secca gjelder ikke.
lease.it.commercial.handover-inspection.title=Overtakelse og tilbakelevering
lease.it.commercial.handover-inspection.summary=Overtakelsesprotokoll ved start; tilbakelevering i samme stand bortsett fra normal slitasje; avtalt vederlag skyldes frem til tilbakelevering ved forsinkelse.
lease.it.commercial.termination.title=Fratredelse og heving
lease.it.commercial.termination.summary=Leietaker kan fratre av alvorlige grunner med 6 måneders varsel og, hvis avtalt, når som helst med samme varsel; utleiers nektelse bare ved første utløp; heving ved mislighold.
lease.it.commercial.notices.title=Meldinger
lease.it.commercial.notices.summary=Rekommandert brev eller forkynnelse ved stevnevitne der loven krever det; adresser og sertifisert e-post.
lease.it.commercial.guarantor.title=Sikkerhet
lease.it.commercial.guarantor.summary=Frivillig personlig kausjon, bank- eller forsikringsgaranti opp til et maksimumsbeløp; utvidelse etter første utløp bare etter avtale.
lease.it.commercial.data-protection.title=Personvern
lease.it.commercial.data-protection.summary=Personopplysninger om personene som handler for partene, behandles bare for leieforholdet i samsvar med GDPR og den italienske personvernloven.
lease.it.commercial.disputes.title=Tvister
lease.it.commercial.disputes.summary=Italiensk rett; domstolen på eiendommens sted; mekling påkrevd før de fleste leiesaker.
# ===== end IT =====


