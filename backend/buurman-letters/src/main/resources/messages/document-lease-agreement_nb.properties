lease.gb.commercial.parties.summary=Angir utleier og leietaker med organisasjonsnummer, forretningsadresse og mva-nummer.
lease.gb.commercial.premises.title=Leieobjekt
lease.gb.commercial.premises.summary=Beskriver næringslokalet, arealet og rettighetene som gis.
lease.gb.commercial.permitted-use.title=Tillatt bruk
lease.gb.commercial.permitted-use.summary=Den tillatte næringsvirksomheten; leietakeren innhenter byggetillatelse og andre tillatelser.
lease.gb.commercial.term.title=Leietid
lease.gb.commercial.term.summary=Overtakelsesdato, tidsbestemt eller periodisk leieforhold; registrering av leieavtaler på mer enn 7 år og skatt ved eiendomstransaksjoner.
lease.gb.commercial.security-of-tenure.title=Oppsigelsesvern
lease.gb.commercial.security-of-tenure.summary=Fornyelsesrett etter Landlord and Tenant Act 1954 (England og Wales) eller Order av 1996 (Nord-Irland), avtale om unntak, og stilltiende forlengelse (tacit relocation) i Skottland.
lease.gb.commercial.rent.title=Leie
lease.gb.commercial.rent.summary=Leien eksklusive mva, felleskostnader og forsikringspremie.
lease.gb.commercial.rent-adjustment.title=Leieregulering
lease.gb.commercial.rent-adjustment.summary=Regulering til markedsleie eller etter en indeks, opp eller ned, med fastsettelse av en uavhengig sakkyndig.
lease.gb.commercial.service-costs.title=Felleskostnader
lease.gb.commercial.service-costs.summary=En rimelig andel av byggets felleskostnader, med budsjett og årlig avregning.
lease.gb.commercial.vat.title=Merverdiavgift
lease.gb.commercial.vat.summary=Alle beløp er eksklusive mva; mva betales dersom utleier har valgt frivillig registrering.
lease.gb.commercial.deposit.title=Leiedepositum
lease.gb.commercial.deposit.summary=Depositum på en egen rentebærende konto, med regler om påfylling og tilbakebetaling.
lease.gb.commercial.payment.title=Betaling
lease.gb.commercial.payment.summary=Leie forskuddsvis uten motregning, forsinkelsesrente og ordningen for inndriving av næringsleierestanser i England og Wales.
lease.gb.commercial.maintenance.title=Vedlikehold
lease.gb.commercial.maintenance.summary=Fullt eller innvendig vedlikeholdsansvar, begrenset av en eventuell tilstandsrapport.
lease.gb.commercial.alterations.title=Endringer
lease.gb.commercial.alterations.summary=Ingen konstruktive endringer; andre endringer med samtykke; tilbakeføring ved leieforholdets slutt.
lease.gb.commercial.assignment.title=Overdragelse og fremleie
lease.gb.commercial.assignment.summary=Overdragelse og fremleie med samtykke som ikke nektes uten rimelig grunn; regler om frigjøring og garanti i England og Wales.
lease.gb.commercial.insurance.title=Forsikring
lease.gb.commercial.insurance.summary=Utleier forsikrer bygget og krever inn premien; leietakeren forsikrer innbo og ansvar; leien bortfaller etter forsikret skade.
lease.gb.commercial.energy-certificate.title=Energiytelse
lease.gb.commercial.energy-certificate.summary=Energiattest for leieobjektet; minst klasse E for næringslokaler i England og Wales.
lease.gb.commercial.break-option.title=Rett til tidlig oppsigelse
lease.gb.commercial.break-option.summary=Rett til å avslutte leieavtalen før tiden på en fastsatt dato, med varsel og vilkår.
lease.gb.commercial.handover-inspection.title=Tilstand og tilbakelevering
lease.gb.commercial.handover-inspection.summary=Tilstandsrapport, tilbakelevering i ryddet stand og begrensningen av erstatning for manglende vedlikehold.
lease.gb.commercial.termination.title=Opphør og bortfall
lease.gb.commercial.termination.summary=Bortfall av leieretten (forfeiture eller irritancy) ved manglende betaling, mislighold eller insolvens, med lovbestemt varsel og rettsvern.
lease.gb.commercial.notices.title=Meldinger
lease.gb.commercial.notices.summary=Skriftlige meldinger ved bud eller rekommandert brev til forretningsadressen.
lease.gb.commercial.guarantor.title=Kausjonist
lease.gb.commercial.guarantor.summary=Garanti for leietakerens forpliktelser fra en kausjonist.
lease.gb.commercial.data-protection.title=Personvern
lease.gb.commercial.data-protection.summary=Behandling av personopplysninger om partenes representanter etter UK GDPR.
lease.gb.commercial.disputes.title=Lovvalg og tvister
lease.gb.commercial.disputes.summary=Loven og domstolene i jurisdiksjonen der leieobjektet ligger; ugyldige bestemmelser berører ikke de øvrige.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Parter
lease.gr.residential.parties.summary=Angir utleier og leietaker med skattenummer og identitetsopplysninger; medleietakere hefter solidarisk.
lease.gr.residential.premises.title=Leieobjektet
lease.gr.residential.premises.summary=Beskriver boligen som leies ut som leietakers hovedbolig, tilbehør og matrikkelkoden.
lease.gr.residential.term.title=Leietid
lease.gr.residential.term.summary=Tidsbestemt eller tidsubestemt; lovbestemt minstetid på 3 år for en hovedbolig, som bare kan forkortes ved senere notarialavtale.
lease.gr.residential.rent.title=Leie
lease.gr.residential.rent.summary=Fritt avtalt leie; ingen fritak fra leien av grunner som gjelder leietakeren.
lease.gr.residential.rent-adjustment.title=Leieregulering
lease.gr.residential.rent-adjustment.summary=Fritt avtalt regulering; lovbestemt regel om 75% av levekostnadsindeksen ved leietid under 3 år uten reguleringsklausul.
lease.gr.residential.service-costs.title=Forbruk og fellesutgifter
lease.gr.residential.service-costs.summary=Forbruk og fellesutgifter til bruk betales av leietakeren; skatter og ekstraordinære bygningsutgifter av utleieren.
lease.gr.residential.deposit.title=Depositum
lease.gr.residential.deposit.summary=Frivillig depositum, som ikke motregnes i leien og tilbakebetales ved opphør med fradrag for skyldige beløp.
lease.gr.residential.payment.title=Betaling
lease.gr.residential.payment.summary=Betalingsdag og bankoverføring; fra startdatoen betaling til en bankkonto tilhørende utleieren som er meldt til AADE.
lease.gr.residential.use.title=Bruk
lease.gr.residential.use.summary=Aktsom bruk som hovedbolig, husordensregler og utleiers besøk inntil 1 gang hver 3. måned.
lease.gr.residential.subletting.title=Fremleie
lease.gr.residential.subletting.summary=Fremleie og korttidsutleie bare med utleiers skriftlige samtykke; ansvar for tredjepersonen.
lease.gr.residential.maintenance.title=Vedlikehold og mangler
lease.gr.residential.maintenance.summary=Utleieren holder leieobjektet i brukbar stand; leieavslag ved mangler, utgifter og leietakers plikt til å varsle.
lease.gr.residential.energy-certificate.title=Energiattest
lease.gr.residential.energy-certificate.summary=Obligatorisk attest som vises og overleveres til en ny leietaker, med nummeret oppgitt i leieerklæringen.
lease.gr.residential.registration.title=Leieerklæring til AADE
lease.gr.residential.registration.summary=Elektronisk erklæring av leieavtalen til skattemyndigheten og leietakers godkjenning innen 30 dager.
lease.gr.residential.sale-of-premises.title=Salg av leieobjektet
lease.gr.residential.sale-of-premises.summary=Den nye eierens stilling ved en leieavtale med sikker dato og den nye eierens oppsigelsesrett i andre tilfeller.
lease.gr.residential.handover-inspection.title=Overtakelse og tilbakelevering
lease.gr.residential.handover-inspection.summary=Overtakelsesprotokoll, tilbakelevering i mottatt stand, urettmessig bruk etter opphør og foreldelsesfrister på 6 måneder.
lease.gr.residential.termination.title=Opphør
lease.gr.residential.termination.summary=Minstetid, oppsigelse av tidsubestemte avtaler, oppsigelse ved leierestanse, leietakers grunner, familiebolig og utkastelsesbeslutning.
lease.gr.residential.data-protection.title=Personvern
lease.gr.residential.data-protection.summary=Behandling av leietakers personopplysninger etter personvernforordningen og lov 4624/2019.
lease.gr.residential.disputes.title=Lovvalg og tvister
lease.gr.residential.disputes.summary=Gresk rett og domstolen der eiendommen ligger, etter den særlige prosedyren for leietvister.
lease.gr.commercial.parties.title=Parter
lease.gr.commercial.parties.summary=Angir utleier og leietaker med skattenummer, foretaksregisternummer og lovlige representanter.
lease.gr.commercial.premises.title=Leieobjektet
lease.gr.commercial.premises.summary=Beskriver næringslokalet, tilbehør og egnethet for den avtalte bruken.
lease.gr.commercial.permitted-use.title=Formål
lease.gr.commercial.permitted-use.summary=Leietakers virksomhet, virkeområdet for presidentdekret 34/1995, tillatelser og aktsom bruk.
lease.gr.commercial.term.title=Leietid
lease.gr.commercial.term.summary=Tidsbestemt eller tidsubestemt; minst 3 år for leieavtaler etter presidentdekret 34/1995 og ingen lovbestemt goodwillkompensasjon.
lease.gr.commercial.rent.title=Leie
lease.gr.commercial.rent.summary=Leie fastsatt fritt av partene, med tillegg av avgiften på leien.
lease.gr.commercial.rent-adjustment.title=Leieregulering
lease.gr.commercial.rent-adjustment.summary=Avtalt regulering, lovbestemte deklaratoriske regler og taket på 3% for reguleringer i 2026.
lease.gr.commercial.service-costs.title=Forbruk og fellesutgifter
lease.gr.commercial.service-costs.summary=Forbruk og fellesutgifter betales av leietakeren; skatter på leieobjektet av utleieren med mindre annet er avtalt.
lease.gr.commercial.vat.title=Merverdiavgift og digital transaksjonsavgift
lease.gr.commercial.vat.summary=Merverdiavgift ved frivillig registrering, ellers den digitale transaksjonsavgiften på 3,60%, som innberettes av utleieren eller i lovens tilfeller av leietakeren.
lease.gr.commercial.deposit.title=Depositum
lease.gr.commercial.deposit.summary=Frivillig kontantdepositum eller bankgaranti, som økes ved leieregulering og tilbakebetales ved opphør.
lease.gr.commercial.payment.title=Betaling
lease.gr.commercial.payment.summary=Betalingsdag, bankoverføring og skattedokumenter; betaling til en konto tilhørende utleieren, meldt til AADE, når leien ikke er en næringskostnad.
lease.gr.commercial.maintenance.title=Vedlikehold og mangler
lease.gr.commercial.maintenance.summary=Utleieren holder leieobjektet i brukbar stand; fordeling av løpende vedlikehold og reparasjoner av bærende konstruksjoner.
lease.gr.commercial.alterations.title=Innredning og endringer
lease.gr.commercial.alterations.summary=Innredningsarbeider for leietakers regning med skriftlig samtykke; utgifter og hva som skjer med arbeidene ved opphør.
lease.gr.commercial.assignment.title=Overdragelse og fremleie
lease.gr.commercial.assignment.summary=Overlatelse av bruken bare der loven tillater det eller med samtykke; unntak for selskaper etter 3 år og overdragelse ved sykdom eller død.
lease.gr.commercial.insurance.title=Forsikring
lease.gr.commercial.insurance.summary=Bygningsforsikring ved utleieren; forsikring av inventar, varer og ansvar ved leietakeren.
lease.gr.commercial.energy-certificate.title=Energiattest
lease.gr.commercial.energy-certificate.summary=Obligatorisk attest som vises og overleveres til en ny leietaker, med nummeret oppgitt i leieerklæringen.
lease.gr.commercial.registration.title=Leieerklæring til AADE
lease.gr.commercial.registration.summary=Elektronisk erklæring av leieavtalen til skattemyndigheten og leietakers godkjenning innen 30 dager.
lease.gr.commercial.sale-of-premises.title=Salg av leieobjektet
lease.gr.commercial.sale-of-premises.summary=Den nye eierens stilling ved en leieavtale med sikker dato og den nye eierens oppsigelsesrett i andre tilfeller.
lease.gr.commercial.handover-inspection.title=Overtakelse og tilbakelevering
lease.gr.commercial.handover-inspection.summary=Overtakelsesprotokoll, tilbakelevering i mottatt stand, urettmessig bruk etter opphør, foreldelsesfrister og visninger.
lease.gr.commercial.termination.title=Opphør
lease.gr.commercial.termination.summary=Oppsigelsesregler, oppsigelse ved leierestanse, leietakers grunner og utkastelsesbeslutning; førtidig oppsigelse bare etter avtale.
lease.gr.commercial.data-protection.title=Personvern
lease.gr.commercial.data-protection.summary=Behandling av personopplysninger om personene som opptrer for partene etter personvernforordningen.
lease.gr.commercial.disputes.title=Lovvalg og tvister
lease.gr.commercial.disputes.summary=Gresk rett, domstolen der eiendommen ligger og ugyldighet av avkall etter presidentdekret 34/1995.
