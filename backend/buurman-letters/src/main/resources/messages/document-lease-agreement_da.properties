lease.gb.residential.parties.title=Parter
lease.gb.residential.parties.summary=Angiver udlejer og lejer eller lejere; flere lejere hæfter solidarisk; i Wales er lejeren contract-holder.
lease.gb.residential.premises.title=Det lejede
lease.gb.residential.premises.summary=Beskriver den udlejede bolig og den ordning, der gælder i landsdelen: assured tenancy (England), standard occupation contract (Wales), private residential tenancy (Skotland) eller private tenancy (Nordirland).
lease.gb.residential.term.title=Lejeperiode
lease.gb.residential.term.summary=Overtagelsesdag; periodisk lejeforhold uden tidsbegrænsning i England og Skotland, periodisk eller tidsbegrænset i Wales og Nordirland.
lease.gb.residential.rent.title=Leje
lease.gb.residential.rent.summary=Lejen og lejeperioden; i England må lejeperioden ikke overstige 1 måned.
lease.gb.residential.rent-adjustment.title=Lejeforhøjelser
lease.gb.residential.rent-adjustment.summary=Lejeforhøjelse kun i det omfang loven tillader: i England ved varsel efter section 13 eller afgørelse fra tribunalet; 2 måneder i England og Wales, 3 måneder i Skotland og Nordirland, højst 1 forhøjelse om året.
lease.gb.residential.service-costs.title=Forbrug og kommuneskat
lease.gb.residential.service-costs.summary=Forbrug og council tax eller domestic rates, som lejeren betaler, samt eventuelle udgifter, der betales til udlejer.
lease.gb.residential.deposit.title=Depositum
lease.gb.residential.deposit.summary=Depositum beskyttet i en godkendt ordning; højst 5 eller 6 ugers leje i England, 2 måneders leje i Skotland og 1 måneds leje i Nordirland.
lease.gb.residential.payment.title=Betaling
lease.gb.residential.payment.summary=Betalingsdag og betalingsmåde; i England ingen leje før lejeperioden og morarenter højst 3 % over basisrenten.
lease.gb.residential.fees.title=Gebyrer og tilladte betalinger
lease.gb.residential.fees.summary=Kun tilladte betalinger må opkræves: Tenant Fees Act 2019 i England, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 i Wales.
lease.gb.residential.use.title=Brug og husdyr
lease.gb.residential.use.summary=Brug som bolig uden chikanerende adfærd; husdyr med udlejers samtykke, som ikke nægtes uden rimelig grund.
lease.gb.residential.subletting.title=Fremleje og overdragelse
lease.gb.residential.subletting.summary=Overdragelse, fremleje og logerende kun med udlejers samtykke.
lease.gb.residential.maintenance.title=Vedligeholdelse og beboelighed
lease.gb.residential.maintenance.summary=Udlejers lovbestemte pligter til vedligeholdelse og beboelighed i hver landsdel; lejeren anmelder mangler og giver adgang efter 24 timers varsel.
lease.gb.residential.safety.title=Sikkerhed
lease.gb.residential.safety.summary=Gassikkerhedseftersyn hver 12. måned, eleftersyn mindst hvert 5. år, røg- og kulilte-alarmer.
lease.gb.residential.energy-certificate.title=Energimærke
lease.gb.residential.energy-certificate.summary=Udlejer stiller en gyldig energimærkning til rådighed; i England og Wales skal boligen mindst have klasse E.
lease.gb.residential.registration.title=Registrering og tilladelser
lease.gb.residential.registration.summary=Registrering af udlejer i Wales, Skotland og Nordirland samt eventuel tilladelse fra den lokale myndighed.
lease.gb.residential.right-to-rent.title=Ret til at leje
lease.gb.residential.right-to-rent.summary=Kontrol af voksne beboeres opholdsret (right to rent), som kun gælder i England.
lease.gb.residential.statutory-information.title=Lovpligtige oplysninger
lease.gb.residential.statutory-information.summary=Den skriftlige erklæring, de vilkår eller de oplysninger, som udlejer skal give efter loven i hver landsdel, samt en adresse til meddelelser.
lease.gb.residential.handover-inspection.title=Inventarliste og fraflytning
lease.gb.residential.handover-inspection.summary=Inventarliste og tilstandsrapport ved indflytning; tilbagelevering af boligen ved ophør, bortset fra almindeligt slid.
lease.gb.residential.termination.title=Ophør
lease.gb.residential.termination.summary=Lejerens opsigelse samt udlejers lovbestemte grunde og varsler i hver landsdel; ingen udsættelse efter section 21 i England.
lease.gb.residential.notices.title=Meddelelser
lease.gb.residential.notices.summary=Skriftlige meddelelser ved bud, med post eller, hvor det er tilladt, med e-mail.
lease.gb.residential.data-protection.title=Databeskyttelse
lease.gb.residential.data-protection.summary=Behandling af lejerens personoplysninger efter UK GDPR og Data Protection Act 2018.
lease.gb.residential.disputes.title=Lovvalg og tvister
lease.gb.residential.disputes.summary=Loven og domstolene eller nævnene i den landsdel, hvor boligen ligger.
lease.gb.commercial.parties.title=Parter
lease.gb.commercial.parties.summary=Angiver udlejer og lejer med registreringsnummer, hjemsted og momsnummer.
lease.gb.commercial.premises.title=Det lejede
lease.gb.commercial.premises.summary=Beskriver erhvervslokalet, dets areal og de rettigheder, der gives.
lease.gb.commercial.permitted-use.title=Tilladt anvendelse
lease.gb.commercial.permitted-use.summary=Den tilladte erhvervsmæssige anvendelse; lejeren indhenter byggetilladelse og andre tilladelser.
lease.gb.commercial.term.title=Lejeperiode
lease.gb.commercial.term.summary=Overtagelsesdag, tidsbegrænset eller periodisk lejeforhold; registrering af lejekontrakter på mere end 7 år og skat ved ejendomstransaktioner.
lease.gb.commercial.security-of-tenure.title=Beskyttelse mod opsigelse
lease.gb.commercial.security-of-tenure.summary=Fornyelsesret efter Landlord and Tenant Act 1954 (England og Wales) eller Order fra 1996 (Nordirland), aftale om fravigelse og stiltiende forlængelse (tacit relocation) i Skotland.
lease.gb.commercial.rent.title=Leje
lease.gb.commercial.rent.summary=Lejen eksklusive moms, serviceudgifter og forsikringspræmie.
lease.gb.commercial.rent-adjustment.title=Lejeregulering
lease.gb.commercial.rent-adjustment.summary=Regulering til markedslejen eller efter et indeks, op eller ned, med fastsættelse ved en uafhængig sagkyndig.
lease.gb.commercial.service-costs.title=Serviceudgifter
lease.gb.commercial.service-costs.summary=En rimelig andel af bygningens serviceudgifter med budget og årligt regnskab.
lease.gb.commercial.vat.title=Moms
lease.gb.commercial.vat.summary=Alle beløb er eksklusive moms; moms betales, hvis udlejer har valgt momspligt.
lease.gb.commercial.deposit.title=Lejedepositum
lease.gb.commercial.deposit.summary=Depositum indsat på en særskilt forrentet konto med regler om genopfyldning og tilbagebetaling.
lease.gb.commercial.payment.title=Betaling
lease.gb.commercial.payment.summary=Leje forud uden modregning, morarenter og proceduren for inddrivelse af erhvervslejerestancer i England og Wales.
lease.gb.commercial.maintenance.title=Vedligeholdelse
lease.gb.commercial.maintenance.summary=Fuld eller indvendig vedligeholdelsespligt, begrænset af en eventuel tilstandsrapport.
lease.gb.commercial.alterations.title=Ændringer
lease.gb.commercial.alterations.summary=Ingen konstruktive ændringer; andre ændringer med samtykke; reetablering ved lejemålets ophør.
lease.gb.commercial.assignment.title=Overdragelse og fremleje
lease.gb.commercial.assignment.summary=Overdragelse og fremleje med samtykke, som ikke nægtes uden rimelig grund; regler om frigørelse og garanti i England og Wales.
lease.gb.commercial.insurance.title=Forsikring
lease.gb.commercial.insurance.summary=Udlejer forsikrer bygningen og opkræver præmien; lejeren forsikrer indbo og ansvar; lejen bortfalder efter forsikret skade.
lease.gb.commercial.energy-certificate.title=Energiydeevne
lease.gb.commercial.energy-certificate.summary=Energimærkning af lejemålet; mindst klasse E for erhvervslejemål i England og Wales.
