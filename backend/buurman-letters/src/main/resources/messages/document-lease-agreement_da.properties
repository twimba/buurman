# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Parter
lease.de.residential.parties.summary=Angiver udlejer og lejer(e); medlejere hæfter solidarisk.
lease.de.residential.premises.title=Det lejede
lease.de.residential.premises.summary=Beskriver den udlejede bolig og anvender tysk boliglejeret (BGB).
lease.de.residential.term.title=Lejeperiode
lease.de.residential.term.summary=Startdato; tidsubestemt, eller tidsbestemt kun med en skriftligt oplyst lovbestemt grund.
lease.de.residential.rent.title=Leje
lease.de.residential.rent.summary=Nettolejen og loftet over startlejen i områder med et presset boligmarked.
