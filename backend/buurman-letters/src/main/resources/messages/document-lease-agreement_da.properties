lease.ch.commercial.payment.title=Betaling
lease.ch.commercial.payment.summary=Lejen betales på den aftalte dag, morarente på 5 procent, betalingsfrist på mindst 30 dage før opsigelse på grund af restance.
lease.ch.commercial.maintenance.title=Vedligeholdelse og mangler
lease.ch.commercial.maintenance.summary=Udlejeren vedligeholder lokalet, lejeren udfører mindre rengøring og reparationer; rettigheder ved mangler, arbejder og eftersyn.
lease.ch.commercial.alterations.title=Lejerens ændringer
lease.ch.commercial.alterations.summary=Ændringer og skilte kun med skriftligt samtykke; retablering kun hvis aftalt skriftligt; godtgørelse for betydelig værdiforøgelse.
lease.ch.commercial.subletting.title=Fremleje
lease.ch.commercial.subletting.summary=Fremleje med udlejerens samtykke, som kun kan nægtes af de lovbestemte grunde.
