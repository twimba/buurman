lease.lu.residential.succession.title=Lejemålets fortsættelse
lease.lu.residential.succession.summary=Fortsættelse for ægtefælle, partner eller husstandsmedlemmer, hvis lejeren fraflytter eller dør.
lease.lu.residential.handover-inspection.title=Ind- og fraflytningssyn
lease.lu.residential.handover-inspection.summary=Fælles ind- og fraflytningsrapporter, obligatoriske når der er aftalt lejegaranti.
