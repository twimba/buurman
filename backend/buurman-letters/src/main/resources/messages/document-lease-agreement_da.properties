lease.lu.commercial.premises.title=Det lejede
lease.lu.commercial.premises.summary=Beskrivelse af lejemålet og anvendelsesområdet for reglerne om erhvervslejemål.
lease.lu.commercial.permitted-use.title=Anvendelse
lease.lu.commercial.permitted-use.summary=Den virksomhed, der er tilladt i lejemålet, og lejerens tilladelser.
lease.lu.commercial.term.title=Lejeperiode
lease.lu.commercial.term.summary=Tidsbegrænset eller tidsubegrænset, bindende for en køber, stiltiende forlængelse på ubestemt tid.
lease.lu.commercial.rent.title=Husleje
lease.lu.commercial.rent.summary=Frit aftalt husleje; ethvert tillæg betalt for at indgå lejekontrakten er ugyldigt.
lease.lu.commercial.rent-adjustment.title=Indeksregulering
lease.lu.commercial.rent-adjustment.summary=Årlig regulering efter det nationale forbrugerprisindeks (STATEC).
lease.lu.commercial.service-costs.title=Driftsudgifter
lease.lu.commercial.service-costs.summary=Udgifter og afgifter, som lejeren betaler, med acontobetalinger og årlig afregning.
lease.lu.commercial.vat.title=Moms
lease.lu.commercial.vat.summary=Momsfri udlejning med udlejers mulighed for at vælge moms.
lease.lu.commercial.deposit.title=Lejegaranti
lease.lu.commercial.deposit.summary=Garanti på højst 6 måneders husleje; en anfordringsgaranti fra en bank kan ikke afvises.
lease.lu.commercial.payment.title=Betaling
lease.lu.commercial.payment.summary=Betaling forud, forfaldsdag og lovbestemt rente ved for sen betaling.
lease.lu.commercial.maintenance.title=Vedligeholdelse
lease.lu.commercial.maintenance.summary=Fordeling af reparationer mellem udlejer og lejer.
lease.lu.commercial.alterations.title=Ændringer
lease.lu.commercial.alterations.summary=Arbejder kun med udlejers samtykke og indretningens skæbne ved lejemålets ophør.
lease.lu.commercial.assignment.title=Overdragelse og fremleje
lease.lu.commercial.assignment.summary=Overdragelse eller fremleje sammen med virksomheden kan ikke forbydes, hvis samme virksomhed fortsætter; meddelelse og godkendelse.
lease.lu.commercial.insurance.title=Forsikring
lease.lu.commercial.insurance.summary=Lejerens ansvars- og erhvervsforsikring.
lease.lu.commercial.energy-certificate.title=Energimærke
