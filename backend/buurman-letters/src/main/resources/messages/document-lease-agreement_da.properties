# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Parter
lease.de.residential.parties.summary=Angiver udlejer og lejer(e); medlejere hæfter solidarisk.
lease.de.residential.premises.title=Det lejede
lease.de.residential.premises.summary=Beskriver den udlejede bolig og anvender tysk boliglejeret (BGB).
lease.de.residential.term.title=Lejeperiode
lease.de.residential.term.summary=Startdato; tidsubestemt, eller tidsbestemt kun med en skriftligt oplyst lovbestemt grund.
lease.de.residential.rent.title=Leje
lease.de.residential.rent.summary=Nettolejen og loftet over startlejen i områder med et presset boligmarked.
lease.de.residential.rent-adjustment.title=Lejeforhøjelse
lease.de.residential.rent-adjustment.summary=Lovbestemte lejeforhøjelser op til den lokale sammenligningsleje inden for loftet.
lease.de.residential.service-costs.title=Driftsudgifter
lease.de.residential.service-costs.summary=Acontobetalinger på driftsudgifterne med en årlig afregning inden for den lovbestemte frist.
lease.de.residential.deposit.title=Depositum
lease.de.residential.deposit.summary=Depositum på højst 3 måneders nettoleje, betales i rater og anbringes særskilt.
lease.de.residential.payment.title=Betaling
lease.de.residential.payment.summary=Lejen betales forud, senest den 3. hverdag i hver betalingsperiode.
lease.de.residential.use.title=Brug
lease.de.residential.use.summary=Kun til beboelse, forsvarlig brug og ændringer kun med udlejers samtykke.
lease.de.residential.subletting.title=Fremleje
lease.de.residential.subletting.summary=Overladelse til tredjemand kun med tilladelse; lejerens lovbestemte ret til at fremleje en del af boligen.
lease.de.residential.maintenance.title=Vedligeholdelse og mangler
lease.de.residential.maintenance.summary=Udlejer vedligeholder boligen; lejenedsættelse ved mangler; ingen istandsættelse for lejeren.
lease.de.residential.minor-repairs.title=Mindre reparationer
lease.de.residential.minor-repairs.summary=Lejeren betaler mindre reparationer op til et beløb pr. reparation og pr. år, der udfyldes.
lease.de.residential.energy-certificate.title=Energimærke
lease.de.residential.energy-certificate.summary=Udlejer fremviser og udleverer energimærket (GModG).
lease.de.residential.registration.title=Bekræftelse af tilflytning
lease.de.residential.registration.summary=Udlejer bekræfter indflytningen, så lejeren kan melde flytning til myndigheden.
lease.de.residential.handover-inspection.title=Overtagelse og aflevering
lease.de.residential.handover-inspection.summary=Overtagelses- og afleveringsrapport, aflevering af boligen og forældelse efter 6 måneder.
lease.de.residential.termination.title=Opsigelse
lease.de.residential.termination.summary=Skriftlig opsigelse, lovbestemte opsigelsesfrister og udlejers krav om berettiget interesse.
lease.de.residential.data-protection.title=Databeskyttelse
lease.de.residential.data-protection.summary=Behandling af lejerens personoplysninger i overensstemmelse med GDPR.
lease.de.residential.disputes.title=Tvister
lease.de.residential.disputes.summary=Tysk ret finder anvendelse; den lokale ret (Amtsgericht), hvor boligen ligger, har eksklusiv kompetence.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Parter
lease.de.commercial.parties.summary=Angiver udlejer og lejer med registreringsnummer, momsnummer og repræsentanter.
lease.de.commercial.premises.title=Det lejede
lease.de.commercial.premises.summary=Beskriver erhvervslokalet og anvender BGB-reglerne om leje af erhvervslokaler.
lease.de.commercial.permitted-use.title=Anvendelse
lease.de.commercial.permitted-use.summary=Den aftalte erhvervsmæssige anvendelse; ændringer kræver samtykke; lejeren indhenter tilladelser.
lease.de.commercial.term.title=Lejeperiode
lease.de.commercial.term.summary=Tidsbestemt eller tidsubestemt; over 1 år kræves tekstform, ellers gælder aftalen tidsubestemt.
lease.de.commercial.rent.title=Leje
lease.de.commercial.rent.summary=Den frit aftalte nettoleje med tillæg af moms og aconto, hvor det er aftalt.
lease.de.commercial.rent-adjustment.title=Indeksregulering
lease.de.commercial.rent-adjustment.summary=Indeksklausul efter forbrugerprisindekset, kun tilladt ved langvarige aftaler (PrKG).
lease.de.commercial.service-costs.title=Driftsudgifter
lease.de.commercial.service-costs.summary=Driftsudgifter efter BetrKV og opregnede ekstra poster med aconto og årlig afregning.
lease.de.commercial.vat.title=Frivillig moms
lease.de.commercial.vat.summary=Udlejer vælger moms på lejen; lejeren bruger lokalet kun til momspligtig virksomhed.
lease.de.commercial.deposit.title=Sikkerhedsstillelse
lease.de.commercial.deposit.summary=Kontant depositum eller bankgaranti uden lovbestemt loft for erhvervslokaler.
lease.de.commercial.payment.title=Betaling
lease.de.commercial.payment.summary=Lejen betales forud senest den 3. hverdag; begrænset modregning og erhvervsmæssig morarente.
lease.de.commercial.maintenance.title=Vedligeholdelse og reparationer
lease.de.commercial.maintenance.summary=Udlejer vedligeholder klimaskærm og fællesarealer; lejeren lokalets indre.
lease.de.commercial.alterations.title=Ændringer og indretning
lease.de.commercial.alterations.summary=Lejerens arbejder og skilte kun med samtykke i tekstform; fjernelse ved lejeforholdets ophør.
lease.de.commercial.subletting.title=Fremleje
lease.de.commercial.subletting.summary=Overladelse til tredjemand kun med tilladelse; særlig opsigelsesret ved afslag.
lease.de.commercial.competition.title=Konkurrencebeskyttelse
lease.de.commercial.competition.summary=Udlejer udlejer ikke til en konkurrent med samme hovedsortiment.
lease.de.commercial.insurance.title=Forsikring
lease.de.commercial.insurance.summary=Udlejer forsikrer bygningen; lejeren forsikrer sit indbo og har erhvervsansvarsforsikring.
lease.de.commercial.energy-certificate.title=Energimærke
lease.de.commercial.energy-certificate.summary=Udlejer fremviser og udleverer energimærket (GModG).
lease.de.commercial.handover-inspection.title=Overtagelse og aflevering
lease.de.commercial.handover-inspection.summary=Overtagelses- og afleveringsrapport, aflevering af ryddet lokale og forældelse efter 6 måneder.
lease.de.commercial.termination.title=Opsigelse
lease.de.commercial.termination.summary=Opsigelse senest den 3. hverdag i et kvartal til udgangen af næste kvartal; ekstraordinær opsigelse.
lease.de.commercial.data-protection.title=Databeskyttelse
lease.de.commercial.data-protection.summary=Behandling af personoplysninger om repræsentanter og kontaktpersoner i overensstemmelse med GDPR.
lease.de.commercial.disputes.title=Tvister
lease.de.commercial.disputes.summary=Tysk ret finder anvendelse; retten, hvor lokalet ligger, har eksklusiv kompetence.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Parter
lease.fr.residential.parties.summary=Angiver udlejer og lejer eller lejere; medlejere hæfter solidarisk inden for de lovbestemte grænser.
lease.fr.residential.premises.title=Lejemålet
lease.fr.residential.premises.summary=Beskriver den umøblerede bolig, der udlejes som helårsbolig efter loven af 6. juli 1989 og standardkontrakten.
lease.fr.residential.term.title=Lejeperiode
lease.fr.residential.term.summary=Startdato, mindste lejeperiode på 3 eller 6 år afhængigt af udlejer og stiltiende forlængelse.
lease.fr.residential.rent.title=Husleje
lease.fr.residential.rent.summary=Huslejen uden forbrugsudgifter og lejegrænserne i områder med boligmangel og huslejeregulering.
lease.fr.residential.rent-adjustment.title=Lejeregulering
lease.fr.residential.rent-adjustment.summary=Årlig regulering begrænset af lejereferenceindekset (IRL); ingen regulering i energiklasse F og G.
lease.fr.residential.service-costs.title=Forbrugsudgifter
lease.fr.residential.service-costs.summary=Udgifter, der kan opkræves, betales som acontobeløb med årlig afregning og bilag.
lease.fr.residential.deposit.title=Depositum
lease.fr.residential.deposit.summary=Depositum på højst 1 måneds husleje uden forbrugsudgifter, tilbagebetales inden for 1 eller 2 måneder.
lease.fr.residential.payment.title=Betaling
lease.fr.residential.payment.summary=Hvornår og hvordan lejen betales; månedlig betaling efter anmodning, gratis kvitteringer og ingen bøder.
lease.fr.residential.use.title=Brug
lease.fr.residential.use.summary=Fredelig brug som helårsbolig; ændringer kun med udlejers skriftlige samtykke.
lease.fr.residential.subletting.title=Fremleje
lease.fr.residential.subletting.summary=Overdragelse og fremleje kun med udlejers skriftlige samtykke, også om lejen.
lease.fr.residential.maintenance.title=Vedligeholdelse og reparationer
lease.fr.residential.maintenance.summary=Udlejers pligter vedrørende forsvarlig standard og reparationer, lejers løbende vedligeholdelse og adgang til arbejder.
lease.fr.residential.works.title=Arbejder
lease.fr.residential.works.summary=Arbejder udført siden det seneste lejemål og aftalte forbedringsarbejder med eventuel lejeforhøjelse.
lease.fr.residential.diagnostics.title=Tekniske undersøgelser
lease.fr.residential.diagnostics.summary=Tekniske undersøgelsesrapporter som bilag, energiklasse og mindste energimæssige ydeevne.
lease.fr.residential.insurance.title=Forsikring
lease.fr.residential.insurance.summary=Lejer forsikrer lejerens risici og dokumenterer det hvert år efter anmodning.
lease.fr.residential.handover-inspection.title=Synsrapport
lease.fr.residential.handover-inspection.summary=Ind- og fraflytningssyn, udarbejdet i fællesskab eller af en stævningsmand.
lease.fr.residential.termination.title=Opsigelse
lease.fr.residential.termination.summary=Opsigelse fra lejer (3 eller 1 måned) og udlejer (6 måneder, lovbestemte grunde); ophævelsesklausul.
lease.fr.residential.annexes.title=Bilag
lease.fr.residential.annexes.summary=Obligatoriske bilag: informationsark, undersøgelsesrapporter, synsrapport og uddrag af ejerforeningens vedtægter.
lease.fr.residential.data-protection.title=Databeskyttelse
lease.fr.residential.data-protection.summary=Behandling af lejers personoplysninger i overensstemmelse med GDPR.
lease.fr.residential.disputes.title=Tvister
lease.fr.residential.disputes.summary=Fransk ret finder anvendelse; forligskommission og dommer for beskyttelsessager.
