lease.ch.commercial.permitted-use.summary=Aftalt erhvervsformål, ændringer kun med skriftligt samtykke, fordeling af myndighedstilladelser.
lease.ch.commercial.term.title=Lejeperiode
lease.ch.commercial.term.summary=Startdato; tidsubestemt eller tidsbestemt leje, der ophører uden opsigelse, og en eventuel forlængelsesoption for lejeren.
