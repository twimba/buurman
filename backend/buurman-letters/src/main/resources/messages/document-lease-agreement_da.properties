# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Parter
lease.at.residential.parties.summary=Angiver udlejer og lejer(e); medlejere hæfter solidarisk; udlejer krydser af, om udlejer er erhvervsdrivende.
lease.at.residential.premises.title=Lejemål
lease.at.residential.premises.summary=Beskriver boligen og fastslår, hvilken MRG-ordning der gælder: fuld anvendelse, delvis anvendelse eller fuld undtagelse.
lease.at.residential.term.title=Lejeperiode
lease.at.residential.term.summary=Tidsubestemt eller tidsbestemt; efter MRG skriftligt og mindst 5 år (3 år, hvis udlejer ikke er erhvervsdrivende).
lease.at.residential.rent.title=Leje
lease.at.residential.rent.summary=Grundlejen og ved fuld anvendelse af MRG de lovbestemte lejegrænser (referenceværdi, kategoribeløb).
lease.at.residential.rent-adjustment.title=Indeksregulering
lease.at.residential.rent-adjustment.summary=Årlig regulering den 1. april efter MieWeG; inflation over 3 procent tæller kun med halvdelen.
lease.at.residential.service-costs.title=Driftsudgifter
lease.at.residential.service-costs.summary=Andel af driftsudgifter og offentlige afgifter i månedlige rater; afregning senest 30. juni ved fuld anvendelse af MRG.
lease.at.residential.deposit.title=Depositum
lease.at.residential.deposit.summary=Depositum uden lovbestemt loft, anbragt på en sparekonto og tilbagebetalt med renter uden ugrundet ophold.
lease.at.residential.payment.title=Betaling
lease.at.residential.payment.summary=Lejen betales månedligt forud senest den 5.; lovbestemt morarente på 4 procent om året.
lease.at.residential.use.title=Brug
lease.at.residential.use.summary=Kun beboelse, adgang af vigtige grunde og anmeldelsesproceduren for væsentlige ændringer.
lease.at.residential.subletting.title=Fremleje
lease.at.residential.subletting.summary=Fremleje kun med samtykke; ved fuld anvendelse af MRG kun afslag af en vigtig grund.
lease.at.residential.maintenance.title=Vedligeholdelse og mangler
lease.at.residential.maintenance.summary=Udlejer holder boligen brugbar; lejefritagelse ved ubrugelighed; lejer anmelder mangler uden ophold.
lease.at.residential.energy-certificate.title=Energimærke
lease.at.residential.energy-certificate.summary=Udlejer forevister og udleverer energimærket (EAVG 2012).
lease.at.residential.registration.title=Folkeregistrering
lease.at.residential.registration.summary=Lejer melder sig til registreringsmyndigheden inden 3 dage efter indflytning.
lease.at.residential.handover-inspection.title=Overtagelse og tilbagelevering
lease.at.residential.handover-inspection.summary=Protokoller ved overtagelse og tilbagelevering, tilbagelevering i modtaget stand og frister for krav.
lease.at.residential.termination.title=Ophør
lease.at.residential.termination.summary=Efter MRG opsiger udlejer kun gennem retten og af vigtige grunde; opsigelsesfrister og førtidig ophævelse.
lease.at.residential.data-protection.title=Databeskyttelse
lease.at.residential.data-protection.summary=Behandling af lejers personoplysninger i overensstemmelse med GDPR.
lease.at.residential.disputes.title=Tvister og afsluttende bestemmelser
lease.at.residential.disputes.summary=Østrigsk ret; distriktsretten på boligens beliggenhedssted; lejeaftaler om boliger er fritaget for lejeafgift.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Parter
lease.at.commercial.parties.summary=Angiver udlejer og lejer med registreringsnummer, momsnummer og repræsentanter.
lease.at.commercial.premises.title=Lejemål
lease.at.commercial.premises.summary=Beskriver erhvervslokalet og fastslår, hvilken MRG-ordning der gælder.
lease.at.commercial.permitted-use.title=Anvendelse
lease.at.commercial.permitted-use.summary=Den aftalte virksomhed; ændringer kun med samtykke; manglende brug kan være opsigelsesgrund.
lease.at.commercial.term.title=Lejeperiode
lease.at.commercial.term.summary=Tidsbestemt eller tidsubestemt; efter MRG kræver en tidsbegrænsning en skriftlig aftale om ophør.
lease.at.commercial.rent.title=Leje
lease.at.commercial.rent.summary=Grundlejen; ved fuld anvendelse af MRG begrænset til det rimelige beløb, som en erhvervsdrivende lejer kun kan påberåbe sig efter rettidig indsigelse.
lease.at.commercial.rent-adjustment.title=Indeksregulering
lease.at.commercial.rent-adjustment.summary=Regulering efter forbrugerprisindekset 2020 med en tærskel, der udfyldes, op og ned.
lease.at.commercial.service-costs.title=Driftsudgifter
lease.at.commercial.service-costs.summary=Andel af driftsudgifter og offentlige afgifter i månedlige rater med årlig afregning.
lease.at.commercial.vat.title=Momsvalg
lease.at.commercial.vat.summary=Udlejer vælger moms på lejen; hvor begrænsningen fra 2012 gælder efter sin overgangsordning, bruger lejer lokalet næsten udelukkende til momspligtig virksomhed.
lease.at.commercial.deposit.title=Depositum
lease.at.commercial.deposit.summary=Kontant depositum eller bankgaranti uden lovbestemt loft, tilbagebetales efter lejemålets ophør.
lease.at.commercial.payment.title=Betaling
lease.at.commercial.payment.summary=Lejen betales månedligt forud; morarente mellem erhvervsdrivende på 9,2 procentpoint over basisrenten.
lease.at.commercial.maintenance.title=Vedligeholdelse
lease.at.commercial.maintenance.summary=Ved fuld anvendelse af MRG gælder § 3 MRG; ellers vedligeholder udlejer bygningskonstruktion og fællesarealer, lejer det indre.
lease.at.commercial.alterations.title=Ændringer og indretning
lease.at.commercial.alterations.summary=Arbejder og skilte kun med skriftligt samtykke; fjernelse ved lejemålets ophør.
lease.at.commercial.subletting.title=Fremleje og overdragelse af virksomhed
lease.at.commercial.subletting.summary=Fremleje kræver samtykke; lovbestemte rettigheder ved salg eller bortforpagtning af virksomheden ved fuld anvendelse af MRG.
lease.at.commercial.insurance.title=Forsikringer
lease.at.commercial.insurance.summary=Udlejer forsikrer bygningen; lejer inventar og erhvervsansvar.
lease.at.commercial.energy-certificate.title=Energimærke
lease.at.commercial.energy-certificate.summary=Udlejer forevister og udleverer energimærket (EAVG 2012).
lease.at.commercial.contract-fee.title=Lejeafgift
lease.at.commercial.contract-fee.summary=Afgift på 1 procent af lejeaftalens værdi efter afgiftsloven (GebG), beregnet af udlejer og betalt af lejer.
lease.at.commercial.handover-inspection.title=Overtagelse og tilbagelevering
lease.at.commercial.handover-inspection.summary=Protokoller ved overtagelse og tilbagelevering, tilbagelevering af ryddet lokale og frister for krav.
lease.at.commercial.termination.title=Ophør
lease.at.commercial.termination.summary=Opsigelse til udgangen af et kalenderkvartal med 3 måneders varsel; begrænsninger for udlejers opsigelse efter MRG.
lease.at.commercial.data-protection.title=Databeskyttelse
lease.at.commercial.data-protection.summary=Behandling af personoplysninger om repræsentanter og kontaktpersoner i overensstemmelse med GDPR.
lease.at.commercial.disputes.title=Tvister
lease.at.commercial.disputes.summary=Østrigsk ret; kompetent er distriktsretten på lokalets beliggenhedssted.
