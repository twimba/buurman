lease.de.residential.registration.summary=Udlejer bekræfter indflytningen, så lejeren kan melde flytning til myndigheden.
lease.de.residential.handover-inspection.title=Overtagelse og aflevering
lease.de.residential.handover-inspection.summary=Overtagelses- og afleveringsrapport, aflevering af boligen og forældelse efter 6 måneder.
lease.de.residential.termination.title=Opsigelse
lease.de.residential.termination.summary=Skriftlig opsigelse, lovbestemte opsigelsesfrister og udlejers krav om berettiget interesse.
lease.de.residential.data-protection.title=Databeskyttelse
lease.de.residential.data-protection.summary=Behandling af lejerens personoplysninger i overensstemmelse med GDPR.
lease.de.residential.disputes.title=Tvister
lease.de.residential.disputes.summary=Tysk ret finder anvendelse; den lokale ret (Amtsgericht), hvor boligen ligger, har eksklusiv kompetence.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
