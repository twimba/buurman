lease.de.commercial.data-protection.summary=Behandling af personoplysninger om repræsentanter og kontaktpersoner i overensstemmelse med GDPR.
lease.de.commercial.disputes.title=Tvister
lease.de.commercial.disputes.summary=Tysk ret finder anvendelse; retten, hvor lokalet ligger, har eksklusiv kompetence.
