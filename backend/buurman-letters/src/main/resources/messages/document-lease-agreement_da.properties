lease.fr.residential.payment.summary=Hvornår og hvordan lejen betales; månedlig betaling efter anmodning, gratis kvitteringer og ingen bøder.
lease.fr.residential.use.title=Brug
lease.fr.residential.use.summary=Fredelig brug som helårsbolig; ændringer kun med udlejers skriftlige samtykke.
lease.fr.residential.subletting.title=Fremleje
lease.fr.residential.subletting.summary=Overdragelse og fremleje kun med udlejers skriftlige samtykke, også om lejen.
lease.fr.residential.maintenance.title=Vedligeholdelse og reparationer
lease.fr.residential.maintenance.summary=Udlejers pligter vedrørende forsvarlig standard og reparationer, lejers løbende vedligeholdelse og adgang til arbejder.
lease.fr.residential.works.title=Arbejder
lease.fr.residential.works.summary=Arbejder udført siden det seneste lejemål og aftalte forbedringsarbejder med eventuel lejeforhøjelse.
