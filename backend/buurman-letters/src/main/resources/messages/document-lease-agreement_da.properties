lease.gb.commercial.termination.summary=Fortabelse (forfeiture eller irritancy) ved manglende betaling, misligholdelse eller insolvens, med lovpligtigt varsel og retsbeskyttelse.
lease.gb.commercial.notices.title=Meddelelser
lease.gb.commercial.notices.summary=Skriftlige meddelelser ved bud eller anbefalet brev til hjemstedet.
lease.gb.commercial.guarantor.title=Kautionist
lease.gb.commercial.guarantor.summary=Garanti for lejerens forpligtelser ved en kautionist.
lease.gb.commercial.data-protection.title=Databeskyttelse
lease.gb.commercial.data-protection.summary=Behandling af personoplysninger om parternes repræsentanter efter UK GDPR.
lease.gb.commercial.disputes.title=Lovvalg og tvister
lease.gb.commercial.disputes.summary=Loven og domstolene i den jurisdiktion, hvor lejemålet ligger; ugyldige bestemmelser berører ikke de øvrige.
