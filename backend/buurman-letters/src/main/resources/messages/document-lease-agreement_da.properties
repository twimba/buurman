lease.nl.commercial.alterations.title=Ændringer
lease.nl.commercial.alterations.summary=Ændringer af lokalet kun med skriftligt samtykke eller rettens tilladelse og deres fjernelse ved lejemålets ophør.
lease.nl.commercial.subletting.title=Fremleje og overdragelse
lease.nl.commercial.subletting.summary=Fremleje kun med samtykke; retsgodkendt indtræden af erhververen af virksomheden for lokaler efter artikel 7:290.
lease.nl.commercial.insurance.title=Forsikring og ansvar
lease.nl.commercial.insurance.summary=Bygningsforsikring ved udlejer, løsøre- og ansvarsforsikring ved lejer, ansvar for skader.
lease.nl.commercial.energy-label.title=Energimærke
lease.nl.commercial.energy-label.summary=Gyldigt energimærke ved udlejning og for kontorer mindst energimærke C eller højst 225 kWh/m² pr. år fossil primærenergi, med forbehold for de lovbestemte undtagelser.
lease.nl.commercial.handover-inspection.title=Overtagelse og aflevering
lease.nl.commercial.handover-inspection.summary=Overtagelsesrapport ved lejemålets begyndelse og aflevering af lokalet ved lejemålets ophør.
lease.nl.commercial.termination.title=Opsigelse
lease.nl.commercial.termination.summary=Opsigelse ved stævningsmand eller anbefalet brev, opsigelsesbeskyttelse (artikel 7:290 BW) eller udsættelse af fraflytning (artikel 7:230a BW), konkurs.
lease.nl.commercial.data-protection.title=Databeskyttelse
lease.nl.commercial.data-protection.summary=Behandling af personoplysninger om parterne og deres repræsentanter efter GDPR.
lease.nl.commercial.disputes.title=Lovvalg og tvister
lease.nl.commercial.disputes.summary=Nederlandsk ret, kantonretten (kantonrechter) og retten på det sted, hvor lokalet ligger.
