lease.ch.commercial.handover-inspection.summary=Overtagelsesrapport, aflevering ryddet og i aftalemæssig stand, straks underretning om mangler fra udlejeren.
lease.ch.commercial.termination.title=Opsigelse
lease.ch.commercial.termination.summary=Skriftlig opsigelse, fra udlejeren på kantonal blanket, 6 måneder til aftalte eller sædvanlige terminer; anfægtelse og forlængelse op til 6 år.
