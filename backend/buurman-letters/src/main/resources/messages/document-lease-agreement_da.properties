lease.it.residential.rent.summary=Leje aftalt af parterne; enhver aftale om højere leje end i den skriftlige og registrerede aftale er ugyldig.
lease.it.residential.rent-adjustment.title=Lejeregulering
lease.it.residential.rent-adjustment.summary=Frivillig årlig regulering med en aftalt andel af ændringen i ISTAT-indekset; suspenderet, hvis udlejer vælger cedolare secca.
lease.it.residential.service-costs.title=Tillægsudgifter
lease.it.residential.service-costs.summary=Lovbestemt fordeling af driftsudgifter på lejeren, medmindre andet er aftalt; betaling inden 2 måneder efter anmodning, med ret til specifikation og bilag.
lease.it.residential.deposit.title=Depositum
lease.it.residential.deposit.summary=Frivilligt depositum på højst 3 måneders leje, med lovbestemt rente udbetalt årligt; tilbagebetales ved ophør med fradrag af skyldige beløb.
lease.it.residential.payment.title=Betaling
lease.it.residential.payment.summary=Periodisk betaling ved bankoverførsel på den aftalte dag; med forbehold for rettens frist til berigtigelse efter artikel 55 er leje, der er ubetalt 20 dage efter forfald, grund til ophævelse.
lease.it.residential.use.title=Brug
lease.it.residential.use.summary=Brug udelukkende som bolig med fornøden omhu; udlejer kan kræve ophævelse inden 3 måneder efter at have fået kendskab til ændret brug.
lease.it.residential.subletting.title=Fremleje
lease.it.residential.subletting.summary=Ingen fuld fremleje eller overdragelse uden samtykke; delvis fremleje tilladt efter anbefalet brev, medmindre andet er aftalt.
lease.it.residential.maintenance.title=Vedligeholdelse og reparationer
lease.it.residential.maintenance.summary=Udlejer udfører nødvendige reparationer, lejeren mindre vedligeholdelse; hasteistandsættelser, lejenedsættelse ved langvarige arbejder; brugeren er ansvarlig for varmeanlægget.
lease.it.residential.energy-certificate.title=Energimærke
lease.it.residential.energy-certificate.summary=Lejeren bekræfter modtagelse af oplysninger og dokumentation om APE; mærkets kode og klasse; lovbestemte bøder ved undladelse.
lease.it.residential.registration.title=Registrering og skatter
lease.it.residential.registration.summary=Udlejer registrerer aftalen inden 30 dage og underretter lejeren og administrator; udgifter deles ligeligt; valgfri cedolare secca.
lease.it.residential.succession.title=Indtræden
lease.it.residential.succession.summary=Ægtefælle, arvinger, samboende slægtninge og partnere kan indtræde ved lejerens død; regler ved separation og skilsmisse.
lease.it.residential.handover-inspection.title=Overtagelse og aflevering
lease.it.residential.handover-inspection.summary=Overtagelsesrapport ved start; aflevering i samme stand bortset fra normalt slid; aftalt vederlag skyldes indtil aflevering ved forsinkelse.
lease.it.residential.termination.title=Fratræden og nægtet fornyelse
lease.it.residential.termination.summary=Lejeren kan fratræde af alvorlige grunde med 6 måneders varsel; udlejer kan nægte fornyelse ved første udløb kun af lovbestemte grunde.
lease.it.residential.notices.title=Meddelelser
lease.it.residential.notices.summary=Anbefalet brev, hvor loven kræver det; adresser og certificerede e-mailadresser til meddelelser.
lease.it.residential.guarantor.title=Kautionist
lease.it.residential.guarantor.summary=Frivillig kaution op til et maksimumsbeløb, solidarisk hæftelse; udstrækning efter første udløb kun efter aftale.
lease.it.residential.data-protection.title=Databeskyttelse
lease.it.residential.data-protection.summary=Personoplysninger behandles kun til lejeforholdet og retlige forpligtelser i henhold til GDPR og den italienske databeskyttelseslov.
lease.it.residential.disputes.title=Tvister
lease.it.residential.disputes.summary=Italiensk ret; retten på ejendommens sted; mægling påkrævet før de fleste lejesager.
lease.it.commercial.parties.title=Parter
lease.it.commercial.parties.summary=Angiver udlejer og lejer med selskabs-, skatte- og momsoplysninger, registreringsnummer i virksomhedsregistret og juridisk repræsentant.
lease.it.commercial.premises.title=Lejemålet
lease.it.commercial.premises.summary=Beskriver lokalet med matrikeloplysninger og den oplyste anvendelse; ikke for boliger eller sæsonudlejning.
lease.it.commercial.permitted-use.title=Tilladt anvendelse
lease.it.commercial.permitted-use.summary=Udøvet virksomhed og angivelse af direkte kundekontakt; tilladelser for lejerens regning; regler om ændret anvendelse.
lease.it.commercial.term.title=Lejeperiode og fornyelse
lease.it.commercial.term.summary=Mindst 6 år (9 for hoteller og teatre) med stiltiende fornyelse; udlejers nægtelse kun ved første udløb af lovbestemte grunde, 12 eller 18 måneder forud.
lease.it.commercial.rent.title=Leje
lease.it.commercial.rent.summary=Leje aftalt af parterne; aftaler, der giver udlejer fordele i strid med lov 392/1978, er ugyldige.
lease.it.commercial.rent-adjustment.title=Lejeregulering
lease.it.commercial.rent-adjustment.summary=Frivillig årlig regulering på udlejers anmodning; stigninger begrænset til 75% af ændringen i ISTAT-indekset for aftaler, der ikke overstiger den lovbestemte varighed.
lease.it.commercial.service-costs.title=Tillægsudgifter
lease.it.commercial.service-costs.summary=Lovbestemt fordeling af driftsudgifter, medmindre andet er aftalt; betaling inden 2 måneder efter anmodning, med ret til specifikation og bilag.
lease.it.commercial.vat.title=Moms
lease.it.commercial.vat.summary=Udlejningen er momsfritaget, medmindre udlejer vælger beskatning for erhvervsejendomme; valg og sats angives.
lease.it.commercial.deposit.title=Depositum
lease.it.commercial.deposit.summary=Frivilligt depositum på højst 3 måneders leje, med lovbestemt rente udbetalt årligt; tilbagebetales ved ophør med fradrag af skyldige beløb.
lease.it.commercial.payment.title=Betaling
lease.it.commercial.payment.summary=Periodisk betaling ved bankoverførsel på den aftalte dag; kvittering eller faktura; ophævelse kun ved misligholdelse, der ikke er uvæsentlig.
lease.it.commercial.maintenance.title=Vedligeholdelse og reparationer
lease.it.commercial.maintenance.summary=Udlejer udfører nødvendige reparationer, lejeren mindre vedligeholdelse, medmindre andet er aftalt; hasteistandsættelser, lejenedsættelse ved langvarige arbejder.
lease.it.commercial.alterations.title=Ombygning og indretning
lease.it.commercial.alterations.summary=Arbejder kun med udlejers skriftlige samtykke; lovbestemte regler om godtgørelse for forbedringer og fjernelse af tilføjelser.
lease.it.commercial.assignment.title=Fremleje og overdragelse
lease.it.commercial.assignment.summary=Fremleje eller overdragelse uden samtykke sammen med virksomheden, med udlejers ret til indsigelse af alvorlige grunde inden 30 dage; ellers kræves samtykke.
lease.it.commercial.pre-emption.title=Forkøbsret
lease.it.commercial.pre-emption.summary=Lejerens forkøbs- og indløsningsret ved salg og genudlejning, undtagen for lokaler uden kundekontakt og andre undtagne tilfælde.
lease.it.commercial.goodwill-compensation.title=Godtgørelse for tab af kundekreds
lease.it.commercial.goodwill-compensation.summary=18 måneders leje (21 for hoteller), når lejeforholdet ophører af anden grund end lejerens misligholdelse, opsigelse, fratræden eller insolvensbehandling; ikke for lokaler uden kundekontakt og andre undtagne tilfælde.
lease.it.commercial.insurance.title=Forsikring
lease.it.commercial.insurance.summary=Lejeren hæfter for tab og brandskade, medmindre lejeren er uden skyld; lejerens ansvarsforsikring og udlejers bygningsforsikring.
lease.it.commercial.energy-certificate.title=Energimærke
lease.it.commercial.energy-certificate.summary=Lejeren bekræfter modtagelse af oplysninger og dokumentation om APE, med vedlagt kopi, hvor det kræves; lovbestemte bøder ved undladelse.
lease.it.commercial.registration.title=Registrering og skatter
lease.it.commercial.registration.summary=Registrering inden 30 dage, udgifter deles ligeligt; registreringsafgift på 1% eller 2%; cedolare secca finder ikke anvendelse.
lease.it.commercial.handover-inspection.title=Overtagelse og aflevering
lease.it.commercial.handover-inspection.summary=Overtagelsesrapport ved start; aflevering i samme stand bortset fra normalt slid; aftalt vederlag skyldes indtil aflevering ved forsinkelse.
lease.it.commercial.termination.title=Fratræden og ophævelse
lease.it.commercial.termination.summary=Lejeren kan fratræde af alvorlige grunde med 6 måneders varsel og, hvis aftalt, når som helst med samme varsel; udlejers nægtelse kun ved første udløb; ophævelse ved misligholdelse.
lease.it.commercial.notices.title=Meddelelser
lease.it.commercial.notices.summary=Anbefalet brev eller forkyndelse ved stævningsmand, hvor loven kræver det; adresser og certificeret e-mail.
lease.it.commercial.guarantor.title=Sikkerhed
lease.it.commercial.guarantor.summary=Frivillig personlig kaution, bank- eller forsikringsgaranti op til et maksimumsbeløb; udstrækning efter første udløb kun efter aftale.
lease.it.commercial.data-protection.title=Databeskyttelse
lease.it.commercial.data-protection.summary=Personoplysninger om de personer, der handler for parterne, behandles kun til lejeforholdet i henhold til GDPR og den italienske databeskyttelseslov.
lease.it.commercial.disputes.title=Tvister
lease.it.commercial.disputes.summary=Italiensk ret; retten på ejendommens sted; mægling påkrævet før de fleste lejesager.
# ===== end IT =====


