lease.nl.commercial.deposit.title=Sikkerhed
lease.nl.commercial.deposit.summary=Depositum eller bankgaranti uden lovbestemt loft, som tilbagegives efter aflevering af lokalet.
lease.nl.commercial.payment.title=Betaling
