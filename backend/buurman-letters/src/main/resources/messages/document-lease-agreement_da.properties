lease.lu.commercial.renewal.title=Fornyelse
lease.lu.commercial.renewal.summary=Lejeren kan kræve fornyelse mindst 6 måneder før udløb; efter 9 år kan udlejer bringe lejemålet til ophør mod fraflytningsgodtgørelse.
lease.lu.commercial.pre-emption.title=Forkøbsret
