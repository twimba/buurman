lease.be.commercial.alterations.title=Obras
lease.be.commercial.alterations.summary=Derecho del arrendatario a obras de hasta 3 años de renta previo aviso, oposición del arrendador en 30 días y su destino al final.
lease.be.commercial.assignment.title=Cesión y subarriendo
lease.be.commercial.assignment.summary=Se requiere consentimiento, salvo cesión o subarriendo junto con el negocio, sin perjuicio de la oposición del arrendador en 30 días.
lease.be.commercial.insurance.title=Seguro
lease.be.commercial.insurance.summary=El arrendatario asegura su responsabilidad y el contenido, el arrendador asegura el edificio.
