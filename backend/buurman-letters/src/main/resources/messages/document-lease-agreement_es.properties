# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Partes
lease.nl.residential.parties.summary=Identifica al arrendador y al arrendatario o arrendatarios; los coarrendatarios responden solidariamente.
lease.nl.residential.premises.title=Inmueble arrendado
lease.nl.residential.premises.summary=Describe la vivienda arrendada y aplica el derecho neerlandés de arrendamiento de vivienda.
lease.nl.residential.term.title=Duración
lease.nl.residential.term.summary=Fecha de inicio y si el contrato es por tiempo indefinido o determinado.
lease.nl.residential.rent.title=Renta
lease.nl.residential.rent.summary=La renta base y el derecho del arrendatario a su revisión por la comisión de alquileres.
lease.nl.residential.rent-adjustment.title=Actualización de la renta
lease.nl.residential.rent-adjustment.summary=Actualización anual de la renta, nunca superior al aumento máximo legal.
lease.nl.residential.service-costs.title=Gastos de servicios
lease.nl.residential.service-costs.summary=Pagos anticipados de suministros y servicios con una liquidación anual.
lease.nl.residential.deposit.title=Fianza
lease.nl.residential.deposit.summary=Fianza de como máximo dos rentas base, devuelta dentro del plazo legal.
lease.nl.residential.payment.title=Pago
lease.nl.residential.payment.summary=Cuándo y cómo se paga la renta, por adelantado en cada periodo.
lease.nl.residential.use.title=Uso
lease.nl.residential.use.summary=Uso exclusivo como vivienda, como buen arrendatario, y modificaciones del inmueble.
lease.nl.residential.subletting.title=Subarriendo
lease.nl.residential.subletting.summary=Subarriendo solo con consentimiento escrito del arrendador, salvo derechos legales.
lease.nl.residential.maintenance.title=Mantenimiento y reparaciones
lease.nl.residential.maintenance.summary=El arrendador subsana defectos; el arrendatario hace las pequeñas reparaciones.
lease.nl.residential.energy-label.title=Etiqueta energética
lease.nl.residential.energy-label.summary=El arrendador entrega una copia de la etiqueta energética válida de la vivienda.
lease.nl.residential.handover-inspection.title=Inspección y entrega
lease.nl.residential.handover-inspection.summary=Acta de estado inicial, preinspección e inspección final en la entrega.
lease.nl.residential.termination.title=Terminación
lease.nl.residential.termination.summary=Plazos de preaviso y causas legales por las que el arrendador puede resolver.
lease.nl.residential.data-protection.title=Protección de datos
lease.nl.residential.data-protection.summary=Tratamiento de los datos personales del arrendatario conforme al RGPD.
lease.nl.residential.disputes.title=Controversias
lease.nl.residential.disputes.summary=Se aplica el derecho neerlandés; las controversias van a la comisión de alquileres o al juez.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Partes
lease.de.residential.parties.summary=Identifica al arrendador y al arrendatario o arrendatarios; los coarrendatarios responden solidariamente.
lease.de.residential.premises.title=Inmueble arrendado
lease.de.residential.premises.summary=Describe la vivienda arrendada y aplica el derecho alemán de arrendamiento de vivienda (BGB).
lease.de.residential.term.title=Duración
lease.de.residential.term.summary=Fecha de inicio; duración indefinida, o determinada solo con una causa legal comunicada por escrito.
lease.de.residential.rent.title=Renta
lease.de.residential.rent.summary=La renta sin gastos y el límite de la renta inicial en zonas de mercado tensionado.
lease.de.residential.rent-adjustment.title=Incremento de la renta
lease.de.residential.rent-adjustment.summary=Incrementos legales hasta la renta comparativa local, dentro del límite máximo.
lease.de.residential.service-costs.title=Gastos de explotación
lease.de.residential.service-costs.summary=Pagos a cuenta de los gastos con liquidación anual dentro del plazo legal.
lease.de.residential.deposit.title=Fianza
lease.de.residential.deposit.summary=Fianza de como máximo 3 mensualidades de renta sin gastos, pagadera a plazos y depositada por separado.
lease.de.residential.payment.title=Pago
lease.de.residential.payment.summary=La renta se paga por adelantado, a más tardar el 3.er día hábil de cada período.
lease.de.residential.use.title=Uso
lease.de.residential.use.summary=Uso exclusivo como vivienda, uso cuidadoso y obras solo con el consentimiento del arrendador.
lease.de.residential.subletting.title=Subarriendo
lease.de.residential.subletting.summary=Uso por terceros solo con permiso; derecho legal del arrendatario a subarrendar parte de la vivienda.
lease.de.residential.maintenance.title=Conservación y defectos
lease.de.residential.maintenance.summary=El arrendador conserva la vivienda; reducción de la renta por defectos; sin reparaciones estéticas a cargo del arrendatario.
lease.de.residential.minor-repairs.title=Pequeñas reparaciones
lease.de.residential.minor-repairs.summary=El arrendatario asume el coste de pequeñas reparaciones hasta un importe por caso y por año a completar.
lease.de.residential.energy-certificate.title=Certificado energético
lease.de.residential.energy-certificate.summary=El arrendador exhibe y entrega el certificado de eficiencia energética (GEG).
lease.de.residential.registration.title=Confirmación de empadronamiento
lease.de.residential.registration.summary=El arrendador confirma la entrada para que el arrendatario pueda empadronarse.
lease.de.residential.handover-inspection.title=Entrega y devolución
lease.de.residential.handover-inspection.summary=Actas de entrega y devolución, restitución de la vivienda y prescripción de 6 meses.
lease.de.residential.termination.title=Resolución
lease.de.residential.termination.summary=Preaviso por escrito, plazos legales de preaviso e interés legítimo exigido al arrendador.
lease.de.residential.data-protection.title=Protección de datos
lease.de.residential.data-protection.summary=Tratamiento de los datos personales del arrendatario conforme al RGPD.
lease.de.residential.disputes.title=Litigios
lease.de.residential.disputes.summary=Se aplica el derecho alemán; el tribunal local (Amtsgericht) del lugar de la vivienda es el único competente.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Partes
lease.de.commercial.parties.summary=Identifica al arrendador y al arrendatario con número de registro, número de IVA y representantes.
lease.de.commercial.premises.title=Local arrendado
lease.de.commercial.premises.summary=Describe el local de negocio y aplica las normas del BGB sobre arrendamiento de locales.
lease.de.commercial.permitted-use.title=Destino
lease.de.commercial.permitted-use.summary=La actividad pactada; los cambios requieren consentimiento; el arrendatario obtiene las licencias.
lease.de.commercial.term.title=Duración
lease.de.commercial.term.summary=Plazo determinado o indefinido; más de 1 año requiere forma de texto, si no rige por tiempo indefinido.
lease.de.commercial.rent.title=Renta
lease.de.commercial.rent.summary=La renta sin gastos libremente pactada, más IVA y pagos a cuenta cuando se haya pactado.
lease.de.commercial.rent-adjustment.title=Actualización de la renta
lease.de.commercial.rent-adjustment.summary=Cláusula de indexación al índice de precios de consumo, admitida solo en contratos de larga duración (PrKG).
lease.de.commercial.service-costs.title=Gastos de explotación
lease.de.commercial.service-costs.summary=Gastos según la BetrKV y partidas adicionales enumeradas, con pagos a cuenta y liquidación anual.
lease.de.commercial.vat.title=Opción por el IVA
lease.de.commercial.vat.summary=El arrendador opta por el IVA sobre la renta; el arrendatario usa el local solo para operaciones con derecho a deducción.
lease.de.commercial.deposit.title=Garantía
lease.de.commercial.deposit.summary=Depósito en efectivo o aval bancario, sin límite legal para locales de negocio.
lease.de.commercial.payment.title=Pago
lease.de.commercial.payment.summary=Renta pagadera por adelantado hasta el 3.er día hábil; límites a la compensación e intereses de demora mercantiles.
lease.de.commercial.maintenance.title=Conservación y reparaciones
lease.de.commercial.maintenance.summary=El arrendador conserva la estructura y las zonas comunes; el arrendatario conserva el interior.
lease.de.commercial.alterations.title=Obras y acondicionamiento
lease.de.commercial.alterations.summary=Obras y rótulos del arrendatario solo con consentimiento en forma de texto; retirada al final.
lease.de.commercial.subletting.title=Subarriendo
lease.de.commercial.subletting.summary=Uso por terceros solo con permiso; derecho especial de resolución en caso de negativa.
lease.de.commercial.competition.title=Protección frente a la competencia
lease.de.commercial.competition.summary=El arrendador no arrienda a un competidor con la misma gama principal.
lease.de.commercial.insurance.title=Seguros
lease.de.commercial.insurance.summary=El arrendador asegura el edificio; el arrendatario asegura su contenido y tiene seguro de responsabilidad civil.
lease.de.commercial.energy-certificate.title=Certificado energético
lease.de.commercial.energy-certificate.summary=El arrendador exhibe y entrega el certificado de eficiencia energética (GEG).
lease.de.commercial.handover-inspection.title=Entrega y devolución
lease.de.commercial.handover-inspection.summary=Actas de entrega y devolución, restitución del local desalojado y prescripción de 6 meses.
lease.de.commercial.termination.title=Resolución
lease.de.commercial.termination.summary=Preaviso hasta el 3.er día hábil de un trimestre para el final del trimestre siguiente; resolución extraordinaria.
lease.de.commercial.data-protection.title=Protección de datos
lease.de.commercial.data-protection.summary=Tratamiento de los datos personales de representantes y personas de contacto conforme al RGPD.
lease.de.commercial.disputes.title=Litigios
lease.de.commercial.disputes.summary=Se aplica el derecho alemán; el tribunal del lugar del local es el único competente.
