lease.fr.residential.annexes.summary=Anexos obligatorios: nota informativa, expediente de diagnóstico, inventario y extractos del reglamento de la comunidad.
lease.fr.residential.data-protection.title=Protección de datos
lease.fr.residential.data-protection.summary=Tratamiento de los datos personales del arrendatario conforme al RGPD.
lease.fr.residential.disputes.title=Litigios
lease.fr.residential.disputes.summary=Se aplica el derecho francés; comisión de conciliación y juez de lo contencioso de protección.
