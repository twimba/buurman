lease.fr.residential.maintenance.summary=Obligaciones del arrendador sobre habitabilidad y reparaciones, mantenimiento ordinario del arrendatario y acceso para obras.
lease.fr.residential.works.title=Obras
lease.fr.residential.works.summary=Obras realizadas desde el último contrato y obras de mejora pactadas con el posible aumento de la renta.
