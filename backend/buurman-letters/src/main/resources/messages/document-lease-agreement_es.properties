# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Partes
lease.at.residential.parties.summary=Identifica al arrendador y al arrendatario o arrendatarios, responsables solidarios; el arrendador indica si es empresario.
lease.at.residential.premises.title=Inmueble arrendado
lease.at.residential.premises.summary=Describe la vivienda y deja constancia del régimen de la MRG aplicable: aplicación plena, aplicación parcial o exclusión total.
lease.at.residential.term.title=Duración
lease.at.residential.term.summary=Plazo indefinido o determinado; según la MRG, por escrito y de al menos 5 años (3 años si el arrendador no es empresario).
lease.at.residential.rent.title=Renta
lease.at.residential.rent.summary=La renta principal y, en aplicación plena de la MRG, los límites legales (valor de referencia, importes por categoría).
lease.at.residential.rent-adjustment.title=Actualización
lease.at.residential.rent-adjustment.summary=Actualización anual el 1 de abril según la MieWeG; la inflación superior al 3 por ciento solo cuenta por la mitad.
lease.at.residential.service-costs.title=Gastos
lease.at.residential.service-costs.summary=Cuota de gastos de explotación y tributos públicos en pagos mensuales; liquidación hasta el 30 de junio en aplicación plena de la MRG.
lease.at.residential.deposit.title=Fianza
lease.at.residential.deposit.summary=Fianza sin límite legal, depositada en una libreta de ahorro y devuelta con intereses sin demora.
lease.at.residential.payment.title=Pago
lease.at.residential.payment.summary=Renta pagadera mensualmente por anticipado a más tardar el día 5; interés legal de demora del 4 por ciento anual.
lease.at.residential.use.title=Uso
lease.at.residential.use.summary=Uso exclusivo de vivienda, acceso por motivos importantes y procedimiento de comunicación de modificaciones sustanciales.
lease.at.residential.subletting.title=Subarriendo
lease.at.residential.subletting.summary=Subarriendo solo con consentimiento; en aplicación plena de la MRG, negativa solo por motivo importante.
lease.at.residential.maintenance.title=Conservación y defectos
lease.at.residential.maintenance.summary=El arrendador mantiene la vivienda en condiciones de uso; exención de renta por inhabitabilidad; el arrendatario comunica los defectos sin demora.
lease.at.residential.energy-certificate.title=Certificado de eficiencia energética
lease.at.residential.energy-certificate.summary=El arrendador exhibe y entrega el certificado de eficiencia energética (EAVG 2012).
lease.at.residential.registration.title=Empadronamiento
lease.at.residential.registration.summary=El arrendatario se inscribe ante la autoridad de registro en el plazo de 3 días desde la entrada.
lease.at.residential.handover-inspection.title=Entrega y devolución
lease.at.residential.handover-inspection.summary=Actas de entrega y devolución, devolución en el estado recibido y plazos de las reclamaciones.
lease.at.residential.termination.title=Extinción
lease.at.residential.termination.summary=Según la MRG, el arrendador solo desahucia por vía judicial y por motivo importante; plazos de preaviso y resolución anticipada.
lease.at.residential.data-protection.title=Protección de datos
lease.at.residential.data-protection.summary=Tratamiento de los datos personales del arrendatario conforme al RGPD.
lease.at.residential.disputes.title=Litigios y disposiciones finales
lease.at.residential.disputes.summary=Derecho austriaco; juzgado de distrito del lugar de la vivienda; los arrendamientos de vivienda están exentos de la tasa de arrendamiento.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Partes
lease.at.commercial.parties.summary=Identifica al arrendador y al arrendatario con número de registro mercantil, número de IVA y representantes.
lease.at.commercial.premises.title=Inmueble arrendado
lease.at.commercial.premises.summary=Describe el local de negocio y deja constancia del régimen de la MRG aplicable.
lease.at.commercial.permitted-use.title=Destino
lease.at.commercial.permitted-use.summary=La actividad pactada; cambios solo con consentimiento; la falta de uso puede ser causa de desahucio.
lease.at.commercial.term.title=Duración
lease.at.commercial.term.summary=Plazo determinado o indefinido; según la MRG, el plazo determinado exige un pacto escrito de extinción.
lease.at.commercial.rent.title=Renta
lease.at.commercial.rent.summary=La renta principal; en aplicación plena de la MRG, limitada al importe adecuado, que el arrendatario empresario solo puede invocar si reclamó a tiempo.
lease.at.commercial.rent-adjustment.title=Actualización
lease.at.commercial.rent-adjustment.summary=Actualización según el índice de precios de consumo 2020 con un umbral a completar, al alza y a la baja.
lease.at.commercial.service-costs.title=Gastos
lease.at.commercial.service-costs.summary=Cuota de gastos de explotación y tributos públicos en pagos mensuales con liquidación anual.
lease.at.commercial.vat.title=Opción por el IVA
lease.at.commercial.vat.summary=El arrendador opta por el IVA sobre la renta; el arrendatario usa el local casi exclusivamente para operaciones sujetas.
lease.at.commercial.deposit.title=Fianza
lease.at.commercial.deposit.summary=Fianza en efectivo o garantía bancaria sin límite legal, devuelta tras el fin del contrato.
lease.at.commercial.payment.title=Pago
lease.at.commercial.payment.summary=Renta pagadera mensualmente por anticipado; interés de demora entre empresarios de 9,2 puntos sobre el tipo básico.
lease.at.commercial.maintenance.title=Conservación
lease.at.commercial.maintenance.summary=En aplicación plena de la MRG rige el § 3 MRG; en otro caso, el arrendador conserva la estructura y los elementos comunes y el arrendatario el interior.
lease.at.commercial.alterations.title=Obras y acondicionamiento
lease.at.commercial.alterations.summary=Obras y rótulos solo con consentimiento escrito; retirada al final del contrato.
lease.at.commercial.subletting.title=Subarriendo y traspaso
lease.at.commercial.subletting.summary=Subarriendo sujeto a consentimiento; derechos legales en la venta o arrendamiento de la empresa en aplicación plena de la MRG.
lease.at.commercial.insurance.title=Seguros
lease.at.commercial.insurance.summary=El arrendador asegura el edificio; el arrendatario las instalaciones y la responsabilidad civil de la actividad.
lease.at.commercial.energy-certificate.title=Certificado de eficiencia energética
lease.at.commercial.energy-certificate.summary=El arrendador exhibe y entrega el certificado de eficiencia energética (EAVG 2012).
lease.at.commercial.contract-fee.title=Tasa de arrendamiento
lease.at.commercial.contract-fee.summary=Tasa del 1 por ciento del valor del contrato según la ley de tasas (GebG), calculada por el arrendador y a cargo del arrendatario.
lease.at.commercial.handover-inspection.title=Entrega y devolución
lease.at.commercial.handover-inspection.summary=Actas de entrega y devolución, devolución del local desalojado y plazos de las reclamaciones.
lease.at.commercial.termination.title=Extinción
lease.at.commercial.termination.summary=Desahucio para el final de un trimestre natural con 3 meses de preaviso; límites al desahucio por el arrendador según la MRG.
lease.at.commercial.data-protection.title=Protección de datos
lease.at.commercial.data-protection.summary=Tratamiento de los datos personales de representantes y personas de contacto conforme al RGPD.
lease.at.commercial.disputes.title=Litigios
lease.at.commercial.disputes.summary=Derecho austriaco; es competente el juzgado de distrito del lugar del local.
