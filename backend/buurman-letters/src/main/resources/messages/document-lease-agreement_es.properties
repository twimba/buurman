lease.ch.residential.term.summary=Fecha de inicio; arrendamiento por tiempo indefinido o de duración determinada que termina sin preaviso y pasa a indefinido si se prorroga tácitamente.
lease.ch.residential.rent.title=Renta
lease.ch.residential.rent.summary=Renta neta y su base (tipo de referencia, índice de precios), impugnación de la renta inicial en 30 días y formulario cantonal.
lease.ch.residential.rent-adjustment.title=Actualización de la renta
lease.ch.residential.rent-adjustment.summary=Aumentos solo con formulario cantonal motivado, impugnación en 30 días, solicitudes de reducción, rentas indexadas y escalonadas.
lease.ch.residential.service-costs.title=Gastos accesorios
lease.ch.residential.service-costs.summary=Gastos accesorios solo si se pactan expresamente, anticipos con liquidación anual o importe fijo, consulta de los justificantes.
