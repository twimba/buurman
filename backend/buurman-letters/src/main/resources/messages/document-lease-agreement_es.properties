# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Partes
lease.de.residential.parties.summary=Identifica al arrendador y al arrendatario o arrendatarios; los coarrendatarios responden solidariamente.
lease.de.residential.premises.title=Inmueble arrendado
lease.de.residential.premises.summary=Describe la vivienda arrendada y aplica el derecho alemán de arrendamiento de vivienda (BGB).
lease.de.residential.term.title=Duración
lease.de.residential.term.summary=Fecha de inicio; duración indefinida, o determinada solo con una causa legal comunicada por escrito.
lease.de.residential.rent.title=Renta
lease.de.residential.rent.summary=La renta sin gastos y el límite de la renta inicial en zonas de mercado tensionado.
lease.de.residential.rent-adjustment.title=Incremento de la renta
lease.de.residential.rent-adjustment.summary=Incrementos legales hasta la renta comparativa local, dentro del límite máximo.
lease.de.residential.service-costs.title=Gastos de explotación
lease.de.residential.service-costs.summary=Pagos a cuenta de los gastos con liquidación anual dentro del plazo legal.
lease.de.residential.deposit.title=Fianza
lease.de.residential.deposit.summary=Fianza de como máximo 3 mensualidades de renta sin gastos, pagadera a plazos y depositada por separado.
lease.de.residential.payment.title=Pago
lease.de.residential.payment.summary=La renta se paga por adelantado, a más tardar el 3.er día hábil de cada período.
lease.de.residential.use.title=Uso
lease.de.residential.use.summary=Uso exclusivo como vivienda, uso cuidadoso y obras solo con el consentimiento del arrendador.
lease.de.residential.subletting.title=Subarriendo
lease.de.residential.subletting.summary=Uso por terceros solo con permiso; derecho legal del arrendatario a subarrendar parte de la vivienda.
lease.de.residential.maintenance.title=Conservación y defectos
lease.de.residential.maintenance.summary=El arrendador conserva la vivienda; reducción de la renta por defectos; sin reparaciones estéticas a cargo del arrendatario.
lease.de.residential.minor-repairs.title=Pequeñas reparaciones
lease.de.residential.minor-repairs.summary=El arrendatario asume el coste de pequeñas reparaciones hasta un importe por caso y por año a completar.
lease.de.residential.energy-certificate.title=Certificado energético
lease.de.residential.energy-certificate.summary=El arrendador exhibe y entrega el certificado de eficiencia energética (GModG).
lease.de.residential.registration.title=Confirmación de empadronamiento
lease.de.residential.registration.summary=El arrendador confirma la entrada para que el arrendatario pueda empadronarse.
lease.de.residential.handover-inspection.title=Entrega y devolución
lease.de.residential.handover-inspection.summary=Actas de entrega y devolución, restitución de la vivienda y prescripción de 6 meses.
lease.de.residential.termination.title=Resolución
lease.de.residential.termination.summary=Preaviso por escrito, plazos legales de preaviso e interés legítimo exigido al arrendador.
lease.de.residential.data-protection.title=Protección de datos
lease.de.residential.data-protection.summary=Tratamiento de los datos personales del arrendatario conforme al RGPD.
lease.de.residential.disputes.title=Litigios
lease.de.residential.disputes.summary=Se aplica el derecho alemán; el tribunal local (Amtsgericht) del lugar de la vivienda es el único competente.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Partes
lease.de.commercial.parties.summary=Identifica al arrendador y al arrendatario con número de registro, número de IVA y representantes.
