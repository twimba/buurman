lease.ch.commercial.rent-adjustment.summary=Renta indexada (contrato de al menos 5 años, índice de precios al consumo) o escalonada; en otro caso aumentos con formulario cantonal motivado.
lease.ch.commercial.service-costs.title=Gastos accesorios
lease.ch.commercial.service-costs.summary=Gastos accesorios solo si se pactan expresamente, anticipos con liquidación anual o importe fijo, consulta de los justificantes.
lease.ch.commercial.vat.title=IVA
lease.ch.commercial.vat.summary=El arrendamiento está excluido del IVA, con excepciones legales como las plazas de aparcamiento arrendadas por separado; el arrendador puede optar por la tributación, salvo uso exclusivamente residencial.
lease.ch.commercial.deposit.title=Fianza
lease.ch.commercial.deposit.summary=Garantía sin importe máximo legal, depositada en una cuenta bancaria a nombre del arrendatario o sustituida por una garantía bancaria.
lease.ch.commercial.payment.title=Pago
lease.ch.commercial.payment.summary=Renta pagadera en la fecha pactada, interés de demora del 5 por ciento, plazo de pago de al menos 30 días antes de resolver por impago.
lease.ch.commercial.maintenance.title=Mantenimiento y defectos
lease.ch.commercial.maintenance.summary=El arrendador mantiene el local, el arrendatario realiza pequeñas limpiezas y reparaciones; derechos por defectos, obras y visitas.
lease.ch.commercial.alterations.title=Obras del arrendatario
lease.ch.commercial.alterations.summary=Obras y rótulos solo con consentimiento escrito; reposición solo si se pacta por escrito; indemnización por plusvalía considerable.
lease.ch.commercial.subletting.title=Subarriendo
lease.ch.commercial.subletting.summary=Subarriendo con el consentimiento del arrendador, que solo puede denegarse por los motivos legales.
lease.ch.commercial.assignment.title=Cesión del arrendamiento
lease.ch.commercial.assignment.summary=Cesión a un tercero con consentimiento escrito, denegable solo por causa grave; responsabilidad solidaria durante 2 años como máximo.
lease.ch.commercial.retention-right.title=Derecho de retención del arrendador
lease.ch.commercial.retention-right.summary=Derecho de retención sobre los bienes muebles del local por la renta anual vencida y la del semestre en curso.
lease.ch.commercial.insurance.title=Seguros
lease.ch.commercial.insurance.summary=El arrendador asegura el edificio; el arrendatario asegura equipos y mercancías y mantiene un seguro de responsabilidad civil empresarial.
lease.ch.commercial.handover-inspection.title=Entrega y devolución
lease.ch.commercial.handover-inspection.summary=Acta de entrega, devolución desalojada y en el estado del uso conforme, aviso inmediato de defectos por el arrendador.
lease.ch.commercial.termination.title=Extinción
lease.ch.commercial.termination.summary=Preaviso escrito, del arrendador con formulario cantonal, 6 meses para las fechas pactadas o usuales; impugnación y prórroga de hasta 6 años.
lease.ch.commercial.data-protection.title=Protección de datos
lease.ch.commercial.data-protection.summary=Tratamiento de los datos personales de las partes y sus representantes según la ley federal suiza de protección de datos.
lease.ch.commercial.disputes.title=Litigios
lease.ch.commercial.disputes.summary=Derecho suizo, autoridad de conciliación antes del proceso judicial, tribunal del lugar del inmueble.
