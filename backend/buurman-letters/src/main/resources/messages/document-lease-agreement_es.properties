lease.gb.commercial.service-costs.summary=Una parte equitativa de los costes de servicios del edificio, con presupuesto y liquidación anual.
lease.gb.commercial.vat.title=IVA
lease.gb.commercial.vat.summary=Todas las cantidades excluyen el IVA; el IVA se devenga si el arrendador ha optado por la tributación.
lease.gb.commercial.deposit.title=Fianza
lease.gb.commercial.deposit.summary=Fianza depositada en una cuenta separada remunerada, con reglas de reposición y devolución.
lease.gb.commercial.payment.title=Pago
lease.gb.commercial.payment.summary=Renta pagada por adelantado sin compensación, intereses de demora y procedimiento de cobro de rentas comerciales atrasadas en Inglaterra y Gales.
lease.gb.commercial.maintenance.title=Reparaciones
lease.gb.commercial.maintenance.summary=Obligación de reparación total o interior, limitada por una eventual constancia del estado del local.
lease.gb.commercial.alterations.title=Obras
lease.gb.commercial.alterations.summary=Ninguna obra estructural; otras obras con consentimiento; reposición al final del arrendamiento.
lease.gb.commercial.assignment.title=Cesión y subarriendo
lease.gb.commercial.assignment.summary=Cesión y subarriendo con un consentimiento que no puede denegarse sin motivo razonable; reglas de liberación y garantía en Inglaterra y Gales.
lease.gb.commercial.insurance.title=Seguro
lease.gb.commercial.insurance.summary=El arrendador asegura el edificio y repercute la prima; el arrendatario asegura el contenido y la responsabilidad; suspensión de la renta tras un siniestro asegurado.
lease.gb.commercial.energy-certificate.title=Eficiencia energética
lease.gb.commercial.energy-certificate.summary=Certificado de eficiencia energética del local; clase E mínima para arrendamientos no residenciales en Inglaterra y Gales.
lease.gb.commercial.break-option.title=Facultad de desistimiento
lease.gb.commercial.break-option.summary=Facultad de poner fin anticipadamente al arrendamiento en una fecha fijada, con preaviso y condiciones.
lease.gb.commercial.handover-inspection.title=Estado y devolución
lease.gb.commercial.handover-inspection.summary=Constancia del estado, devolución del local libre y vacío y límite de la indemnización por falta de reparación.
lease.gb.commercial.termination.title=Extinción y resolución
lease.gb.commercial.termination.summary=Resolución (forfeiture o irritancy) por impago, incumplimiento o insolvencia, sujeta a aviso legal y protección judicial.
lease.gb.commercial.notices.title=Notificaciones
lease.gb.commercial.notices.summary=Notificaciones por escrito entregadas en mano o por correo certificado en el domicilio social.
lease.gb.commercial.guarantor.title=Avalista
lease.gb.commercial.guarantor.summary=Garantía de las obligaciones del arrendatario por un avalista.
lease.gb.commercial.data-protection.title=Protección de datos
lease.gb.commercial.data-protection.summary=Tratamiento de los datos personales de los representantes de las partes conforme al UK GDPR.
lease.gb.commercial.disputes.title=Ley aplicable y litigios
lease.gb.commercial.disputes.summary=La ley y los tribunales de la jurisdicción donde se encuentra el local; divisibilidad de las cláusulas.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Partes
lease.gr.residential.parties.summary=Identifica al arrendador y al arrendatario con número fiscal y datos de identidad; los coarrendatarios responden solidariamente.
lease.gr.residential.premises.title=Inmueble arrendado
lease.gr.residential.premises.summary=Describe la vivienda arrendada como residencia principal del arrendatario, sus anexos y el código catastral.
lease.gr.residential.term.title=Duración
lease.gr.residential.term.summary=Plazo determinado o indefinido; duración mínima legal de 3 años para la residencia principal, reducible solo por acuerdo notarial posterior.
lease.gr.residential.rent.title=Renta
lease.gr.residential.rent.summary=Renta libremente pactada; sin exoneración de la renta por causas relativas al arrendatario.
lease.gr.residential.rent-adjustment.title=Actualización de la renta
lease.gr.residential.rent-adjustment.summary=Actualización libremente pactada; regla legal del 75% del índice del coste de la vida para plazos inferiores a 3 años sin cláusula de actualización.
lease.gr.residential.service-costs.title=Suministros y gastos comunes
lease.gr.residential.service-costs.summary=Suministros y gastos comunes de uso a cargo del arrendatario; impuestos y gastos extraordinarios del edificio a cargo del arrendador.
lease.gr.residential.deposit.title=Fianza
lease.gr.residential.deposit.summary=Garantía facultativa, no compensable con la renta, devuelta al final previa deducción de las cantidades adeudadas.
lease.gr.residential.payment.title=Pago
lease.gr.residential.payment.summary=Fecha de pago y transferencia bancaria; desde la fecha prevista, pago en una cuenta del arrendador comunicada a la AADE.
lease.gr.residential.use.title=Uso
lease.gr.residential.use.summary=Uso diligente como residencia principal, normas del edificio y visitas del arrendador hasta 1 vez cada 3 meses.
lease.gr.residential.subletting.title=Subarriendo
lease.gr.residential.subletting.summary=Subarriendo y alquiler de corta duración solo con consentimiento escrito del arrendador; responsabilidad por el tercero.
lease.gr.residential.maintenance.title=Conservación y vicios
lease.gr.residential.maintenance.summary=El arrendador mantiene el inmueble apto para el uso; reducción de la renta por vicios, gastos y deber de aviso del arrendatario.
lease.gr.residential.energy-certificate.title=Certificado de eficiencia energética
lease.gr.residential.energy-certificate.summary=Certificado obligatorio mostrado y entregado al nuevo arrendatario, con su número inscrito en la declaración del arrendamiento.
lease.gr.residential.registration.title=Declaración del arrendamiento a la AADE
lease.gr.residential.registration.summary=Declaración electrónica del arrendamiento a la administración tributaria y aceptación por el arrendatario en el plazo de 30 días.
lease.gr.residential.sale-of-premises.title=Venta del inmueble
lease.gr.residential.sale-of-premises.summary=Posición del nuevo propietario en un arrendamiento de fecha cierta y su derecho de resolución en los demás casos.
lease.gr.residential.handover-inspection.title=Entrega y devolución
lease.gr.residential.handover-inspection.summary=Acta de entrega, devolución en el estado recibido, retención del inmueble y plazos de prescripción de 6 meses.
lease.gr.residential.termination.title=Extinción
lease.gr.residential.termination.summary=Duración mínima, preaviso en los contratos indefinidos, resolución por impago, causas del arrendatario, vivienda familiar y orden de desalojo.
lease.gr.residential.data-protection.title=Protección de datos
lease.gr.residential.data-protection.summary=Tratamiento de los datos personales del arrendatario conforme al RGPD y la Ley 4624/2019.
lease.gr.residential.disputes.title=Ley aplicable y controversias
lease.gr.residential.disputes.summary=Ley griega y tribunal del lugar del inmueble según el procedimiento especial de litigios arrendaticios.
lease.gr.commercial.parties.title=Partes
lease.gr.commercial.parties.summary=Identifica al arrendador y al arrendatario con número fiscal, número del registro mercantil y representantes legales.
lease.gr.commercial.premises.title=Inmueble arrendado
lease.gr.commercial.premises.summary=Describe el local de negocio, sus anexos y su idoneidad para el uso pactado.
lease.gr.commercial.permitted-use.title=Destino del local
lease.gr.commercial.permitted-use.summary=Actividad del arrendatario, ámbito del Decreto Presidencial 34/1995, licencias y uso diligente.
lease.gr.commercial.term.title=Duración
lease.gr.commercial.term.summary=Plazo determinado o indefinido; duración mínima de 3 años en los arrendamientos sujetos al Decreto Presidencial 34/1995 y sin indemnización legal por clientela.
lease.gr.commercial.rent.title=Renta
lease.gr.commercial.rent.summary=Renta fijada libremente por las partes, más el impuesto sobre la renta arrendaticia.
lease.gr.commercial.rent-adjustment.title=Actualización de la renta
lease.gr.commercial.rent-adjustment.summary=Actualización pactada, reglas legales supletorias y límite del 3% para las actualizaciones en 2026.
lease.gr.commercial.service-costs.title=Suministros y gastos comunes
lease.gr.commercial.service-costs.summary=Suministros y gastos comunes a cargo del arrendatario; impuestos sobre el inmueble a cargo del arrendador salvo pacto en contrario.
lease.gr.commercial.vat.title=IVA y tasa digital sobre transacciones
lease.gr.commercial.vat.summary=IVA cuando se opta por él; en otro caso, la tasa digital sobre transacciones del 3,60%, declarada por el arrendador o, en los casos legales, por el arrendatario.
lease.gr.commercial.deposit.title=Fianza
lease.gr.commercial.deposit.summary=Fianza en efectivo o aval bancario facultativos, completados con las actualizaciones de la renta y devueltos al final.
lease.gr.commercial.payment.title=Pago
lease.gr.commercial.payment.summary=Fecha de pago, transferencia bancaria y documentos fiscales; pago en una cuenta del arrendador comunicada a la AADE cuando la renta no es gasto empresarial.
lease.gr.commercial.maintenance.title=Conservación y vicios
lease.gr.commercial.maintenance.summary=El arrendador mantiene el inmueble apto para el uso; reparto del mantenimiento ordinario y de las reparaciones estructurales.
lease.gr.commercial.alterations.title=Obras de adecuación y modificaciones
lease.gr.commercial.alterations.summary=Obras de adecuación a cargo del arrendatario con consentimiento escrito; gastos y destino de las obras al final.
lease.gr.commercial.assignment.title=Cesión y subarriendo
lease.gr.commercial.assignment.summary=Cesión del uso solo en los casos que permite la ley o con consentimiento; excepción para sociedades tras 3 años y transmisión por enfermedad o fallecimiento.
lease.gr.commercial.insurance.title=Seguros
lease.gr.commercial.insurance.summary=Seguro del edificio por el arrendador; seguro de equipos, mercancías y responsabilidad civil por el arrendatario.
lease.gr.commercial.energy-certificate.title=Certificado de eficiencia energética
lease.gr.commercial.energy-certificate.summary=Certificado obligatorio mostrado y entregado al nuevo arrendatario, con su número inscrito en la declaración del arrendamiento.
lease.gr.commercial.registration.title=Declaración del arrendamiento a la AADE
lease.gr.commercial.registration.summary=Declaración electrónica del arrendamiento a la administración tributaria y aceptación por el arrendatario en el plazo de 30 días.
lease.gr.commercial.sale-of-premises.title=Venta del inmueble
lease.gr.commercial.sale-of-premises.summary=Posición del nuevo propietario en un arrendamiento de fecha cierta y su derecho de resolución en los demás casos.
lease.gr.commercial.handover-inspection.title=Entrega y devolución
lease.gr.commercial.handover-inspection.summary=Acta de entrega, devolución en el estado recibido, retención del inmueble, plazos de prescripción y visitas.
lease.gr.commercial.termination.title=Extinción
lease.gr.commercial.termination.summary=Reglas de preaviso, resolución por impago, causas del arrendatario y orden de desalojo; desistimiento anticipado solo si se pacta.
lease.gr.commercial.data-protection.title=Protección de datos
lease.gr.commercial.data-protection.summary=Tratamiento de los datos personales de las personas que actúan por las partes conforme al RGPD.
lease.gr.commercial.disputes.title=Ley aplicable y controversias
lease.gr.commercial.disputes.summary=Ley griega, tribunal del lugar del inmueble y nulidad de las renuncias según el Decreto Presidencial 34/1995.
