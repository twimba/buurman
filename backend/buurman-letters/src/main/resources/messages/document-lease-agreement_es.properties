# ===== IE lease clause titles and summaries (country pack) =====
lease.ie.residential.parties.title=Partes
lease.ie.residential.parties.summary=Arrendador y arrendatario, responsabilidad solidaria de los coarrendatarios, representante y datos de contacto del arrendador.
lease.ie.residential.premises.title=Vivienda
lease.ie.residential.premises.summary=La vivienda arrendada y la aplicación de la Residential Tenancies Act 2004 a los arrendamientos celebrados desde el 1 de marzo de 2026.
lease.ie.residential.term.title=Duración y estabilidad
lease.ie.residential.term.summary=Fecha de inicio, duración determinada o periódica, arrendamiento Part 4 tras 6 meses y periodos mínimos de 6 años.
lease.ie.residential.rent.title=Renta
lease.ie.residential.rent.summary=Importe de la renta, tope de la renta de mercado y límite nacional del 2 % anual o del aumento del CPI si es menor.
lease.ie.residential.rent-information.title=Información sobre la renta al inicio
lease.ie.residential.rent-information.summary=Renta anterior y 3 rentas comparables, comunicadas al arrendatario al inicio y al RTB en el plazo de 1 mes.
lease.ie.residential.rent-adjustment.title=Revisión de la renta
lease.ie.residential.rent-adjustment.summary=Revisión como máximo 1 vez cada 12 meses, no en los primeros 12 meses, con preaviso de 90 días en el formulario prescrito.
lease.ie.residential.service-costs.title=Suministros y gastos
lease.ie.residential.service-costs.summary=Suministros y otros gastos a cargo del arrendatario; los gastos de la sociedad gestora corresponden al arrendador salvo pacto en contrario.
lease.ie.residential.deposit.title=Fianza
lease.ie.residential.deposit.summary=Fianza de como máximo 1 mes de renta, devuelta sin demora al final, descontados los atrasos o el coste de los daños.
lease.ie.residential.payment.title=Pago
lease.ie.residential.payment.summary=Pago de la renta a su vencimiento por transferencia, renta anticipada limitada a 1 mes y libro de rentas.
lease.ie.residential.use.title=Uso de la vivienda
lease.ie.residential.use.summary=Uso exclusivo como vivienda, sin conductas antisociales, comunicación de los ocupantes y animales solo con consentimiento.
lease.ie.residential.subletting.title=Cesión y subarriendo
lease.ie.residential.subletting.summary=Cesión o subarriendo solo con consentimiento escrito; si se deniega, el arrendatario puede resolver.
lease.ie.residential.maintenance.title=Reparaciones y mantenimiento
lease.ie.residential.maintenance.summary=El arrendador repara la estructura y el interior y cumple las normas de viviendas arrendadas; el arrendatario comunica defectos y permite el acceso.
lease.ie.residential.energy-certificate.title=Certificado energético (BER)
lease.ie.residential.energy-certificate.summary=Certificado BER de la vivienda puesto a disposición del arrendatario cuando sea obligatorio.
lease.ie.residential.registration.title=Registro en el RTB
lease.ie.residential.registration.summary=Registro del arrendamiento en el RTB dentro de 1 mes desde el inicio y desde cada aniversario.
lease.ie.residential.insurance.title=Seguro
lease.ie.residential.insurance.summary=Seguro de la estructura a cargo del arrendador con cobertura de responsabilidad de al menos 250.000 EUR; el arrendatario no debe invalidarlo.
lease.ie.residential.handover-inspection.title=Inventario y entrega
lease.ie.residential.handover-inspection.summary=Inventario firmado al inicio y devolución de la vivienda al final, sin tener en cuenta el desgaste normal.
lease.ie.residential.termination.title=Terminación
lease.ie.residential.termination.summary=Notificaciones de terminación, plazos legales de preaviso y causas restringidas para extinguir un arrendamiento Part 4.
lease.ie.residential.notices.title=Notificaciones
lease.ie.residential.notices.summary=Notificaciones por escrito, entrega conforme a la ley incluso por correo electrónico y direcciones para notificaciones.
lease.ie.residential.data-protection.title=Protección de datos
lease.ie.residential.data-protection.summary=Tratamiento de datos personales conforme al RGPD y a la Data Protection Act 2018.
lease.ie.residential.disputes.title=Controversias
lease.ie.residential.disputes.summary=Derecho irlandés; las controversias regidas por la ley se someten al RTB y las demás a los tribunales irlandeses.
lease.ie.commercial.parties.title=Partes
lease.ie.commercial.parties.summary=Arrendador y arrendatario con número de registro, domicilio social, número de IVA y representante.
lease.ie.commercial.premises.title=Local
lease.ie.commercial.premises.summary=El local de negocio arrendado, su superficie y derechos; la Residential Tenancies Act 2004 no se aplica.
lease.ie.commercial.permitted-use.title=Destino
lease.ie.commercial.permitted-use.summary=Actividad permitida; el consentimiento para cambiar el uso no se deniega sin motivo razonable; licencias a riesgo del arrendatario.
lease.ie.commercial.term.title=Duración
lease.ie.commercial.term.summary=Fecha de inicio y plazo determinado, o arrendamiento periódico que termina por preaviso.
lease.ie.commercial.renewal.title=Derecho de renovación
lease.ie.commercial.renewal.summary=Derecho legal a un nuevo arrendamiento tras 5 años de uso empresarial y posibilidad de renuncia previo asesoramiento jurídico.
lease.ie.commercial.rent.title=Renta
lease.ie.commercial.rent.summary=Importe de la renta sin IVA, gastos de servicios ni seguro, y cualquier incentivo pactado.
lease.ie.commercial.rent-adjustment.title=Revisión de la renta
lease.ie.commercial.rent-adjustment.summary=Revisión a renta de mercado; en los arrendamientos desde el 28 de febrero de 2010 la renta revisada también puede bajar.
lease.ie.commercial.service-costs.title=Gastos de servicios y tributos
lease.ie.commercial.service-costs.summary=Gastos de servicios por cuota con liquidación anual; el arrendatario paga los tributos locales (rates) y los suministros.
lease.ie.commercial.vat.title=IVA
lease.ie.commercial.vat.summary=Los arrendamientos están exentos de IVA salvo que el arrendador opte por la tributación.
lease.ie.commercial.deposit.title=Garantía
lease.ie.commercial.deposit.summary=Garantía sin límite legal, depositada en una cuenta designada y devuelta en 30 días.
lease.ie.commercial.payment.title=Pago
lease.ie.commercial.payment.summary=Pago de la renta sin compensación por transferencia, con intereses en caso de retraso.
lease.ie.commercial.maintenance.title=Reparaciones
lease.ie.commercial.maintenance.summary=Obligación de reparación total o interior y límite legal de la indemnización por falta de conservación.
lease.ie.commercial.alterations.title=Obras
lease.ie.commercial.alterations.summary=Obras solo con consentimiento, que no se deniega sin motivo razonable para mejoras, y reposición al final.
lease.ie.commercial.assignment.title=Cesión y subarriendo
lease.ie.commercial.assignment.summary=Cesión o subarriendo con consentimiento del arrendador, que no puede denegarse sin motivo razonable.
lease.ie.commercial.insurance.title=Seguro
lease.ie.commercial.insurance.summary=El arrendador asegura el edificio a cargo del arrendatario; el arrendatario asegura contenido y responsabilidad; suspensión de la renta tras siniestro.
lease.ie.commercial.energy-certificate.title=Certificado energético (BER)
lease.ie.commercial.energy-certificate.summary=Certificado BER del local puesto a disposición del arrendatario cuando sea obligatorio.
lease.ie.commercial.registration.title=Impuesto de timbre y registro
lease.ie.commercial.registration.summary=Impuesto de timbre sobre el contrato y comunicaciones del arrendamiento, de cada revisión de la renta y de la salida del arrendatario a la Commercial Leases Database de la PSRA.
lease.ie.commercial.break-option.title=Desistimiento anticipado
lease.ie.commercial.break-option.summary=Fechas opcionales de desistimiento, preaviso y condiciones; el desistimiento del arrendatario puede extinguir el derecho de renovación.
lease.ie.commercial.handover-inspection.title=Estado del local y entrega
lease.ie.commercial.handover-inspection.summary=Acta del estado del local al inicio y entrega libre de ocupantes al final.
lease.ie.commercial.termination.title=Resolución y terminación
lease.ie.commercial.termination.summary=Recuperación del local por impago o incumplimiento, requerimiento previo y protección judicial, y demás causas de terminación.
lease.ie.commercial.notices.title=Notificaciones
lease.ie.commercial.notices.summary=Notificaciones por escrito en mano o por correo certificado y direcciones para notificaciones.
lease.ie.commercial.guarantor.title=Fiador
lease.ie.commercial.guarantor.summary=Garantía de las obligaciones del arrendatario por un fiador como deudor principal.
lease.ie.commercial.data-protection.title=Protección de datos
lease.ie.commercial.data-protection.summary=Tratamiento de los datos personales de interlocutores y fiadores conforme al RGPD.
