lease.it.commercial.rent-adjustment.summary=Actualización anual facultativa a petición del arrendador; aumentos limitados al 75% de la variación del índice ISTAT para contratos que no superen la duración legal.
lease.it.commercial.service-costs.title=Gastos accesorios
lease.it.commercial.service-costs.summary=Reparto legal de los gastos salvo pacto en contrario; pago en 2 meses desde la solicitud, con derecho a desglose y justificantes.
lease.it.commercial.vat.title=IVA
lease.it.commercial.vat.summary=Arrendamiento exento de IVA salvo opción del arrendador por la tributación de inmuebles afectos a actividad; opción y tipo indicados.
lease.it.commercial.deposit.title=Fianza
lease.it.commercial.deposit.summary=Depósito facultativo de como máximo 3 mensualidades, con intereses legales abonados cada año; devuelto al final descontadas las cantidades debidas.
lease.it.commercial.payment.title=Pago
lease.it.commercial.payment.summary=Pago periódico por transferencia bancaria el día pactado; recibo o factura; resolución solo por incumplimiento que no sea de escasa importancia.
lease.it.commercial.maintenance.title=Conservación y reparaciones
lease.it.commercial.maintenance.summary=El arrendador realiza las reparaciones necesarias, el arrendatario las pequeñas salvo pacto en contrario; reparaciones urgentes, reducción de la renta por obras prolongadas.
lease.it.commercial.alterations.title=Obras y acondicionamiento
lease.it.commercial.alterations.summary=Obras solo con el consentimiento escrito del arrendador; reglas legales sobre indemnización por mejoras y retirada de añadidos.
lease.it.commercial.assignment.title=Subarriendo y cesión
lease.it.commercial.assignment.summary=Subarriendo o cesión sin consentimiento junto con la empresa, salvo oposición del arrendador por motivos graves en 30 días; en otro caso se requiere consentimiento.
lease.it.commercial.pre-emption.title=Derecho de adquisición preferente
lease.it.commercial.pre-emption.summary=Derecho de tanteo y retracto del arrendatario en la venta y en el nuevo arrendamiento, salvo locales sin contacto con el público y otros casos excluidos.
lease.it.commercial.goodwill-compensation.title=Indemnización por pérdida de clientela
lease.it.commercial.goodwill-compensation.summary=18 mensualidades (21 para hoteles) cuando el arrendamiento cesa por causa distinta del incumplimiento, la denuncia, el desistimiento o un procedimiento concursal del arrendatario; no para locales sin contacto con el público y otros casos excluidos.
lease.it.commercial.insurance.title=Seguro
lease.it.commercial.insurance.summary=El arrendatario responde de la pérdida y de los daños por incendio salvo causa no imputable; seguro de responsabilidad del arrendatario y seguro del edificio por el arrendador.
lease.it.commercial.energy-certificate.title=Certificado de eficiencia energética
lease.it.commercial.energy-certificate.summary=El arrendatario declara haber recibido la información y la documentación sobre el APE, con copia anexa cuando se exija; sanciones legales en caso de omisión.
lease.it.commercial.registration.title=Registro e impuestos
lease.it.commercial.registration.summary=Registro en 30 días, gastos a partes iguales; impuesto de registro del 1% o del 2%; la cedolare secca no se aplica.
lease.it.commercial.handover-inspection.title=Entrega y devolución
lease.it.commercial.handover-inspection.summary=Acta de entrega al inicio; devolución en el mismo estado salvo el desgaste normal; contraprestación pactada debida hasta la devolución en caso de mora.
lease.it.commercial.termination.title=Desistimiento y resolución
lease.it.commercial.termination.summary=El arrendatario puede desistir por motivos graves con 6 meses de preaviso y, si se pacta, en cualquier momento con el mismo preaviso; negativa del arrendador solo al primer vencimiento; resolución por incumplimiento.
lease.it.commercial.notices.title=Notificaciones
lease.it.commercial.notices.summary=Carta certificada o notificación por oficial judicial cuando la ley lo exige; direcciones y correo electrónico certificado.
lease.it.commercial.guarantor.title=Garantía
lease.it.commercial.guarantor.summary=Garantía personal, bancaria o de seguro facultativa hasta un importe máximo; extensión más allá del primer vencimiento solo si se pacta.
lease.it.commercial.data-protection.title=Protección de datos
lease.it.commercial.data-protection.summary=Datos personales de las personas que actúan por las partes tratados solo para el arrendamiento, conforme al RGPD y al código italiano de protección de datos.
lease.it.commercial.disputes.title=Controversias
lease.it.commercial.disputes.summary=Ley italiana; juzgado del lugar del inmueble; mediación obligatoria antes de la mayoría de las acciones arrendaticias.
# ===== end IT =====


