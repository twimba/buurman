lease.be.commercial.deposit.summary=Garantía en el importe y la forma pactados; sin límite legal para los arrendamientos comerciales.
lease.be.commercial.payment.title=Pago
lease.be.commercial.payment.summary=Pago por plazos mediante transferencia el día convenido; interés legal tras requerimiento.
lease.be.commercial.maintenance.title=Mantenimiento y reparaciones
lease.be.commercial.maintenance.summary=Reparaciones del arrendador y del arrendatario según el antiguo Código Civil belga, salvo pacto en contrario.
lease.be.commercial.alterations.title=Obras
lease.be.commercial.alterations.summary=Derecho del arrendatario a obras de hasta 3 años de renta previo aviso, oposición del arrendador en 30 días y su destino al final.
lease.be.commercial.assignment.title=Cesión y subarriendo
lease.be.commercial.assignment.summary=Se requiere consentimiento, salvo cesión o subarriendo junto con el negocio, sin perjuicio de la oposición del arrendador en 30 días.
lease.be.commercial.insurance.title=Seguro
lease.be.commercial.insurance.summary=El arrendatario asegura su responsabilidad y el contenido, el arrendador asegura el edificio.
lease.be.commercial.energy-certificate.title=Certificado de eficiencia energética
lease.be.commercial.energy-certificate.summary=Certificado de eficiencia energética cuando lo exijan las normas regionales, con número, fecha y clase.
lease.be.commercial.registration.title=Registro
lease.be.commercial.registration.summary=Registro conforme a la legislación fiscal, que da fecha cierta al contrato; parte que soporta los derechos.
lease.be.commercial.handover-inspection.title=Estado del inmueble
lease.be.commercial.handover-inspection.summary=Estado detallado contradictorio, anexado y registrado; devolución del inmueble en el estado recibido.
lease.be.commercial.renewal.title=Renovación
lease.be.commercial.renewal.summary=Derecho a 3 renovaciones de 9 años, solicitud entre 18 y 15 meses antes del vencimiento, causas de denegación e indemnización por desalojo.
lease.be.commercial.transfer.title=Enajenación del inmueble
lease.be.commercial.transfer.summary=El adquirente solo puede desalojar al arrendatario por causas legales, con preaviso de 1 año dado en 3 meses.
lease.be.commercial.termination.title=Extinción
lease.be.commercial.termination.summary=Fin en un trienio, arrendamiento indefinido tras la pérdida del derecho de renovación, resolución judicial por incumplimiento.
lease.be.commercial.data-protection.title=Protección de datos
lease.be.commercial.data-protection.summary=Tratamiento de los datos personales de las partes y de sus representantes conforme al RGPD.
lease.be.commercial.disputes.title=Litigios
lease.be.commercial.disputes.summary=Derecho belga y juez de paz del lugar del inmueble; conciliación previa posible.
