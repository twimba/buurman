# ===== CH lease clause titles and summaries (country pack) =====
lease.ch.residential.parties.title=Partes
lease.ch.residential.parties.summary=Identifica al arrendador y al arrendatario o arrendatarios, su responsabilidad solidaria y si la vivienda es la vivienda familiar.
lease.ch.residential.premises.title=Vivienda arrendada
