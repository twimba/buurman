lease.de.commercial.insurance.summary=El arrendador asegura el edificio; el arrendatario asegura su contenido y tiene seguro de responsabilidad civil.
lease.de.commercial.energy-certificate.title=Certificado energético
lease.de.commercial.energy-certificate.summary=El arrendador exhibe y entrega el certificado de eficiencia energética (GModG).
