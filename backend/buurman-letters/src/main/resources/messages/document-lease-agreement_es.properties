# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Partes
lease.it.residential.parties.summary=Identifica al arrendador y al arrendatario o arrendatarios con código fiscal y datos personales; los coarrendatarios responden solidariamente; forma escrita obligatoria.
lease.it.residential.premises.title=Vivienda
lease.it.residential.premises.summary=Describe la vivienda con los datos catastrales y los anexos; modelo de renta libre (4 + 4 años), no para contratos de renta concertada, transitorios o de estudiantes.
lease.it.residential.term.title=Duración
lease.it.residential.term.summary=Al menos 4 años (o una duración mayor pactada), renovados por otros 4 salvo negativa del arrendador por los motivos legales; al segundo vencimiento, procedimiento de renovación por carta certificada con al menos 6 meses de antelación.
lease.it.residential.rent.title=Renta
lease.it.residential.rent.summary=Renta pactada por las partes; es nulo todo pacto de una renta superior a la del contrato escrito y registrado.
lease.it.residential.rent-adjustment.title=Actualización de la renta
lease.it.residential.rent-adjustment.summary=Actualización anual facultativa en una parte pactada de la variación del índice ISTAT; suspendida si el arrendador opta por la cedolare secca.
lease.it.residential.service-costs.title=Gastos accesorios
lease.it.residential.service-costs.summary=Reparto legal de los gastos a cargo del arrendatario salvo pacto en contrario; pago en 2 meses desde la solicitud, con derecho a desglose y justificantes.
lease.it.residential.deposit.title=Fianza
lease.it.residential.deposit.summary=Depósito facultativo de como máximo 3 mensualidades, con intereses legales abonados cada año; devuelto al final descontadas las cantidades debidas.
lease.it.residential.payment.title=Pago
lease.it.residential.payment.summary=Pago periódico por transferencia bancaria el día pactado; sin perjuicio de la enervación judicial del artículo 55, la renta impagada 20 días después del vencimiento es causa de resolución.
lease.it.residential.use.title=Uso
lease.it.residential.use.summary=Uso exclusivo como vivienda con la debida diligencia; el arrendador puede pedir la resolución en los 3 meses siguientes a conocer el cambio de uso.
lease.it.residential.subletting.title=Subarriendo
lease.it.residential.subletting.summary=Prohibidos el subarriendo total y la cesión sin consentimiento; subarriendo parcial permitido previa carta certificada, salvo pacto en contrario.
lease.it.residential.maintenance.title=Conservación y reparaciones
lease.it.residential.maintenance.summary=El arrendador realiza las reparaciones necesarias, el arrendatario las pequeñas; reparaciones urgentes, reducción de la renta por obras prolongadas; el ocupante es responsable de la instalación de calefacción.
lease.it.residential.energy-certificate.title=Certificado de eficiencia energética
lease.it.residential.energy-certificate.summary=El arrendatario declara haber recibido la información y la documentación sobre el APE; código y clase del certificado; sanciones legales en caso de omisión.
lease.it.residential.registration.title=Registro e impuestos
lease.it.residential.registration.summary=El arrendador registra el contrato en 30 días e informa al arrendatario y al administrador; gastos a partes iguales; cedolare secca facultativa.
lease.it.residential.succession.title=Subrogación
lease.it.residential.succession.summary=Cónyuge, herederos, parientes y parejas convivientes pueden subrogarse a la muerte del arrendatario; reglas para separación y divorcio.
lease.it.residential.handover-inspection.title=Entrega y devolución
lease.it.residential.handover-inspection.summary=Acta de entrega al inicio; devolución en el mismo estado salvo el desgaste normal; contraprestación pactada debida hasta la devolución en caso de mora.
lease.it.residential.termination.title=Desistimiento y negativa a renovar
lease.it.residential.termination.summary=El arrendatario puede desistir por motivos graves con 6 meses de preaviso; el arrendador solo puede negar la renovación al primer vencimiento por los motivos legales.
lease.it.residential.notices.title=Notificaciones
lease.it.residential.notices.summary=Carta certificada cuando la ley la exige; direcciones y direcciones de correo electrónico certificado para notificaciones.
lease.it.residential.guarantor.title=Fiador
lease.it.residential.guarantor.summary=Fianza facultativa hasta un importe máximo, con responsabilidad solidaria; extensión más allá del primer vencimiento solo si se pacta.
lease.it.residential.data-protection.title=Protección de datos
lease.it.residential.data-protection.summary=Datos personales tratados solo para el arrendamiento y las obligaciones legales, conforme al RGPD y al código italiano de protección de datos.
lease.it.residential.disputes.title=Controversias
lease.it.residential.disputes.summary=Ley italiana; juzgado del lugar del inmueble; mediación obligatoria antes de la mayoría de las acciones arrendaticias.
lease.it.commercial.parties.title=Partes
lease.it.commercial.parties.summary=Identifica al arrendador y al arrendatario con los datos de la sociedad, código fiscal, número de IVA, inscripción en el registro de empresas y representante legal.
lease.it.commercial.premises.title=Local
lease.it.commercial.premises.summary=Describe el local con los datos catastrales y el uso declarado; no para viviendas ni arrendamientos de temporada.
lease.it.commercial.permitted-use.title=Destino
lease.it.commercial.permitted-use.summary=Actividad ejercida e indicación de contacto directo con el público; licencias a cargo del arrendatario; reglas sobre el cambio de uso.
lease.it.commercial.term.title=Duración y renovación
lease.it.commercial.term.summary=Al menos 6 años (9 para hoteles y teatros) con renovación tácita; negativa del arrendador solo al primer vencimiento por los motivos legales, con 12 o 18 meses de antelación.
lease.it.commercial.rent.title=Renta
lease.it.commercial.rent.summary=Renta pactada por las partes; son nulos los pactos que atribuyan al arrendador ventajas contrarias a la ley 392/1978.
