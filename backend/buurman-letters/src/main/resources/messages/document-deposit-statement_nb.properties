deposit.legal.FR=Etter artikkel 22 i lov 89-462 skal depositumet tilbakebetales innen én måned (to måneder ved fradrag) etter nøkkeloverlevering; forsinket tilbakebetaling utløser 10 % av månedsleien per forsinkelsesmåned.
deposit.legal.BE=Depositumet er satt inn på en sperret konto i leietakerens navn slik det regionale boligleiedekretet krever; frigivelse krever samtykke fra begge parter eller en rettsavgjørelse.
deposit.legal.ES=Etter artikkel 36 LAU skal depositumet tilbakebetales innen én måned etter nøkkeloverlevering; deretter løper lovbestemt rente på beløpet.
deposit.legal.PT=Etter den portugisiske sivillovboken skal depositumet (caução) tilbakebetales ved leieforholdets slutt etter oppgjør av eventuelle skyldige beløp.
deposit.legal.GB=Depositum ved assured shorthold tenancy i England og Wales må sikres i en statlig godkjent ordning; tvister kan bringes inn for ordningens gratis tvisteløsningstjeneste.
deposit.legal.IT=Etter artikkel 11 i lov 392/1978 kan depositumet (deposito cauzionale) ikke overstige tre måneders leie og forrentes med lovbestemt rente som utbetales til leietakeren årlig.
