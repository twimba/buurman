rentchange.body.adjustment.fixedAmount=Η αναπροσαρμογή βασίζεται σε σταθερή αύξηση {0}.
rentchange.body.adjustment.manual=Το ενοίκιο έχει αναπροσαρμοστεί χειροκίνητα στο πλαίσιο περιοδικής αναθεώρησης.
rentchange.body.adjustment.standalone=Η παρούσα αναπροσαρμογή ενοικίου βασίζεται σε περιοδική αναθεώρηση σύμφωνα με τους όρους της μισθωτικής σύμβασης.
rentchange.body.adjustment.none=Η παρούσα αναπροσαρμογή ενοικίου βασίζεται σε περιοδική αναθεώρηση σύμφωνα με τους όρους της μισθωτικής σύμβασης.
rentchange.body.extension=Η αναπροσαρμογή αυτή σχετίζεται με την παράταση σύμβασης #{0}, η οποία παρατείνει τη μίσθωσή σας έως {1}.
rentchange.body.extension.indefinite=Η αναπροσαρμογή αυτή σχετίζεται με την παράταση σύμβασης #{0}, για αόριστη διάρκεια.
rentchange.body.change=Αυτό αντιπροσωπεύει μεταβολή {0}% σε σχέση με το προηγούμενο ενοίκιο.
rentchange.body.decrease=Αυτό αντιπροσωπεύει μείωση {0}% σε σχέση με το προηγούμενο ενοίκιο.
