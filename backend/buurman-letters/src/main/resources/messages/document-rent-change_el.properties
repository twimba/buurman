rentchange.disclaimer=Το παρόν έγγραφο είναι ενημερωτικό και δεν αποτελεί νομικά δεσμευτική συμφωνία. Η αναπροσαρμογή ενοικίου υπόκειται στους όρους και τις προϋποθέσεις της υπάρχουσας μισθωτικής σύμβασης και της ισχύουσας τοπικής νομοθεσίας.
