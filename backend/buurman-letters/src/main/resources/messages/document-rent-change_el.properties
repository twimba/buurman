rentchange.body.notification.initial=Η παρούσα επιστολή επιβεβαιώνει ότι το αρχικό μηνιαίο ενοίκιο για το ακίνητο στη διεύθυνση {0} έχει οριστεί στο {1}, με ισχύ από {2}.
