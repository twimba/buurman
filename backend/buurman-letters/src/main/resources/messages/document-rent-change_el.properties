rentchange.legal.NL=Η παρούσα αναπροσαρμογή μισθώματος διέπεται από το ολλανδικό μισθωτικό δίκαιο (άρθρα 7:252-253 BW). Οι διαφορές μπορούν να παραπεμφθούν στην Huurcommissie.
rentchange.legal.DE=Η παρούσα αναπροσαρμογή μισθώματος γίνεται σύμφωνα με το §558 BGB (Mieterhöhung bis zur ortsüblichen Vergleichsmiete). Ενδέχεται να ισχύει το Kappungsgrenze (ανώτατο όριο 20%/15% σε 3 έτη).
rentchange.legal.FR=Η παρούσα αναπροσαρμογή μισθώματος υπόκειται στον IRL (Indice de Référence des Loyers). Σε ρυθμιζόμενες ζώνες ενδέχεται να ισχύουν ρυθμίσεις ελέγχου μισθωμάτων (décret encadrement).
rentchange.legal.BE=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί τον Gezondheidsindex (Δείκτη Υγείας) της εκάστοτε περιφέρειας. Ισχύουν οι διατάξεις του περιφερειακού στεγαστικού κώδικα.
rentchange.legal.ES=Η παρούσα αναπροσαρμογή μισθώματος διέπεται από το άρθρο 18 LAU (actualización de renta). Ενδέχεται να ισχύουν προσωρινά ανώτατα όρια αύξησης μισθώματος.
rentchange.legal.PT=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί τον INE coeficiente de atualização. Ισχύουν οι διατάξεις του άρθρου 24 NRAU.
rentchange.legal.AT=Η παρούσα αναπροσαρμογή μισθώματος διέπεται από το §16 MRG (angemessener Mietzins). Ισχύει το Richtwertmietzins ή η αναφορά VPI/CPI.
rentchange.legal.GB=Η παρούσα αναπροσαρμογή μισθώματος υπόκειται στις απαιτήσεις κοινοποίησης του Section 13 του Housing Act 1988. Ισχύει η σύγκριση με το μίσθωμα αγοράς.
rentchange.legal.IT=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί τον δείκτη ISTAT FOI. Ισχύουν οι διατάξεις του Legge 392/1978 ή 431/1998.
rentchange.legal.SE=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί το bruksvärdessystemet (σύστημα αξίας χρήσης). Ισχύουν οι απαιτήσεις διαπραγμάτευσης με τον Hyresgästföreningen.
rentchange.legal.DK=Η παρούσα αναπροσαρμογή μισθώματος υπόκειται στον Lejeloven. Ανάλογα με την κατάταξη του κτιρίου ισχύουν κανόνες κόστους ή αγοράς.
rentchange.legal.IE=Η παρούσα αναπροσαρμογή μισθώματος διέπεται από τον Residential Tenancies Act 2004. Ενδέχεται να ισχύει το ετήσιο όριο RPZ 2%.
rentchange.legal.PL=Η παρούσα αναπροσαρμογή μισθώματος υπόκειται στο άρθρο 6851 του Αστικού Κώδικα. Απαιτείται έγγραφη ειδοποίηση τρεις μήνες νωρίτερα.
rentchange.legal.FI=Η παρούσα αναπροσαρμογή μισθώματος διέπεται από τον νόμο περί μισθώσεων κατοικιών (481/1995). Οι αναπροσαρμογές διέπονται από τους όρους της σύμβασης.
rentchange.legal.NO=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί τον Husleieloven §4-2/§4-3. Ισχύουν οι κανόνες αναπροσαρμογής βάσει ΔΤΚ.
rentchange.legal.US=Η παρούσα αναπροσαρμογή μισθώματος υπόκειται στις εφαρμοστέες πολιτειακές και τοπικές ρυθμίσεις. Σε ορισμένες δικαιοδοσίες ενδέχεται να ισχύει έλεγχος μισθωμάτων.
rentchange.legal.CA=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί την εφαρμοστέα επαρχιακή μισθωτική νομοθεσία. Ενδέχεται να ισχύουν ετήσια καθοδηγητικά όρια αύξησης.
rentchange.legal.HU=Η παρούσα αναπροσαρμογή μισθώματος ακολουθεί τις διατάξεις περί μισθώματος του ουγγρικού Αστικού Κώδικα. Οι αναπροσαρμογές διέπονται από τους όρους της σύμβασης.
rentchange.legal.CZ=Η παρούσα αναπροσαρμογή μισθώματος υπόκειται στο §2249 του Αστικού Κώδικα. Οι αυξήσεις προς συγκρίσιμο μίσθωμα περιορίζονται στο 20% σε 3 έτη.
rentchange.legal.CH=Η παρούσα αναπροσαρμογή μισθώματος διέπεται από το Obligationenrecht άρθρο 269a. Οι αναπροσαρμογές συνδέονται με το επιτόκιο αναφοράς (Referenzzinssatz).
