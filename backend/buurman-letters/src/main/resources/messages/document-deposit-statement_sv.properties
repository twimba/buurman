deposit.disclaimer=Avräkningen upprättas enligt hyresavtalet. Lagstadgade tidsfrister och tvistförfaranden för depositioner varierar mellan länder och påverkas inte av detta dokument.
deposit.legal.NL=Enligt nederländsk rätt ska depositionen återbetalas inom skälig tid efter hyresförhållandets slut; tvistiga avdrag kan prövas av Huurcommissie eller domstol.
deposit.legal.DE=Enligt § 551 BGB ska depositionen hållas avskild från hyresvärdens tillgångar och slutregleras inom skälig tid (normalt upp till sex månader) efter hyresförhållandets slut.
deposit.legal.FR=Enligt artikel 22 i lag 89-462 ska depositionen återbetalas inom en månad (två månader vid avdrag) efter nyckelöverlämningen; försenad återbetalning medför 10 % av månadshyran per förseningsmånad.
deposit.legal.BE=Depositionen har placerats på ett spärrat konto i hyresgästens namn i enlighet med det regionala bostadshyresdekretet; frisläppande kräver båda parters samtycke eller ett domstolsbeslut.
deposit.legal.ES=Enligt artikel 36 LAU ska depositionen återbetalas inom en månad efter nyckelöverlämningen; därefter löper laglig ränta på beloppet.
deposit.legal.PT=Enligt den portugisiska civillagen ska depositionen (caução) återbetalas vid hyresförhållandets slut efter avräkning av eventuella utestående belopp.
deposit.legal.GB=Depositioner vid assured shorthold tenancy i England och Wales måste skyddas i ett statligt godkänt system; tvister kan hänskjutas till systemets kostnadsfria tvistlösningstjänst.
deposit.legal.IT=Enligt artikel 11 i lag 392/1978 får depositionen (deposito cauzionale) inte överstiga tre månadshyror och löper med laglig ränta som ska betalas till hyresgästen årligen.
