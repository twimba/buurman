rentchange.legal.FI=This rent adjustment is governed by the Act on Residential Leases (481/1995). Contract terms govern adjustments.
rentchange.legal.NO=This rent adjustment follows Husleieloven \u00a74-2/\u00a74-3. CPI adjustment rules apply.
