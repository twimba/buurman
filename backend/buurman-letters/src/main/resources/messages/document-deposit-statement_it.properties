deposit.closing=In caso di disaccordo su una trattenuta, La preghiamo di contattarci entro 14 giorni dalla data del presente rendiconto.
deposit.disclaimer=Il presente rendiconto è emesso ai sensi del contratto di locazione. Termini di legge e procedure di contestazione sui depositi variano per giurisdizione e non sono modificati da questo documento.
deposit.legal.NL=Secondo il diritto olandese il deposito cauzionale deve essere restituito entro un termine ragionevole dalla fine della locazione; le trattenute contestate possono essere sottoposte alla Huurcommissie o all'autorità giudiziaria.
deposit.legal.DE=Ai sensi del § 551 BGB il deposito cauzionale deve essere tenuto separato dal patrimonio del locatore e conteggiato entro un termine ragionevole (di norma fino a sei mesi) dalla fine della locazione.
deposit.legal.FR=Ai sensi dell'articolo 22 della legge 89-462 il deposito cauzionale deve essere restituito entro un mese (due mesi in caso di trattenute) dalla riconsegna delle chiavi; il ritardo comporta il 10% del canone mensile per ogni mese di ritardo.
deposit.legal.BE=Il deposito cauzionale è stato costituito su un conto vincolato intestato al conduttore, come richiesto dal decreto regionale sulla locazione abitativa; lo svincolo richiede l'accordo di entrambe le parti o una decisione giudiziaria.
deposit.legal.ES=Ai sensi dell'articolo 36 LAU il deposito cauzionale deve essere restituito entro un mese dalla riconsegna delle chiavi; decorso tale termine maturano interessi legali.
deposit.legal.PT=Ai sensi del Codice civile portoghese il deposito cauzionale (caução) deve essere restituito al termine della locazione previa compensazione degli importi eventualmente dovuti.
deposit.legal.GB=I depositi cauzionali delle assured shorthold tenancies in Inghilterra e Galles devono essere protetti in un sistema approvato dallo Stato; le controversie possono essere sottoposte al servizio gratuito di risoluzione delle controversie di tale sistema.
deposit.legal.IT=Ai sensi dell’art. 11 della legge 392/1978 il deposito cauzionale non può superare tre mensilità ed è produttivo di interessi legali da corrispondere annualmente al conduttore.
