# R\u00e9f\u00e9rences juridiques par pays
legal.NL=Cette prolongation est r\u00e9gie par le droit locatif n\u00e9erlandais (huurrecht). Les parties peuvent soumettre les litiges \u00e0 la Huurcommissie.
legal.DE=Cet avenant de prolongation est \u00e9tabli conform\u00e9ment au \u00a7557 BGB (Mietverh\u00f6hungsvereinbarung). La Mietpreisbremse peut s'appliquer.
legal.FR=Cette prolongation est soumise au droit locatif fran\u00e7ais. Les dispositions de la Loi ALUR peuvent s'appliquer dans les zones tendues. Les ajustements de loyer sont soumis \u00e0 l'indice IRL.
legal.BE=Cette prolongation est r\u00e9gie par la l\u00e9gislation r\u00e9gionale sur le logement. L'indexation des loyers est bas\u00e9e sur le Gezondheidsindex.
legal.ES=Cette prolongation est r\u00e9gie par la LAU (Ley de Arrendamientos Urbanos). Les dispositions des Art. 9-10 peuvent s'appliquer.
legal.PT=Cette prolongation est r\u00e9gie par le NRAU (Novo Regime do Arrendamento Urbano). Les mises \u00e0 jour de loyer suivent le coefficient INE.
legal.AT=Cette prolongation est r\u00e9gie par le droit locatif autrichien (MRG). Le syst\u00e8me Richtwertmietzins peut s'appliquer.
legal.GB=Cette prolongation est soumise au Housing Act 1988. Les exigences de notification de la Section 13 peuvent s'appliquer.
legal.IT=Cette prolongation est r\u00e9gie par le droit locatif italien (Legge 431/1998). Les ajustements ISTAT FOI peuvent s'appliquer.
legal.SE=Cette prolongation est soumise au Hyreslagen. Les niveaux de loyer suivent le bruksv\u00e4rdessystem.
legal.DK=Cette prolongation est soumise au Lejeloven. La r\u00e9glementation d\u00e9pend de l'\u00e2ge du b\u00e2timent.
legal.IE=Cette prolongation est r\u00e9gie par le Residential Tenancies Act 2004. Les restrictions RPZ peuvent s'appliquer.
legal.PL=Cette prolongation est soumise au Code civil polonais Art. 6851-6852.
legal.FI=Cette prolongation est r\u00e9gie par la Loi sur les baux r\u00e9sidentiels (481/1995).
legal.NO=Cette prolongation est soumise au Husleieloven. Les ajustements IPC s'appliquent sous \u00a74-2/\u00a74-3.
legal.US=Cette prolongation est soumise au droit locatif applicable. Le contr\u00f4le des loyers peut s'appliquer dans certaines juridictions.
legal.CA=Cette prolongation est r\u00e9gie par la l\u00e9gislation locative provinciale applicable.
legal.HU=Cette prolongation est r\u00e9gie par le Code civil hongrois.
legal.CZ=Cette prolongation est soumise au Code civil tch\u00e8que \u00a72249. Les augmentations sont limit\u00e9es \u00e0 20% sur 3 ans.
legal.CH=Cette prolongation est r\u00e9gie par le droit locatif suisse (Code des obligations Art. 269-270). Les ajustements sont li\u00e9s au Referenzzinssatz.

