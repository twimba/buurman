# L\u00e4nderspezifische rechtliche Hinweise (Miet\u00e4nderung)
rentchange.legal.NL=Diese Mietanpassung unterliegt dem niederl\u00e4ndischen Mietrecht (Art. 7:252-253 BW). Streitigkeiten k\u00f6nnen an die Huurcommissie verwiesen werden.
rentchange.legal.DE=Diese Mietanpassung erfolgt gem\u00e4\u00df \u00a7558 BGB (Mieterh\u00f6hung bis zur orts\u00fcblichen Vergleichsmiete). Die Kappungsgrenze (20%/15% Obergrenze \u00fcber 3 Jahre) kann gelten.
rentchange.legal.FR=Diese Mietanpassung unterliegt dem IRL (Indice de R\u00e9f\u00e9rence des Loyers). Mietpreisregulierungen (d\u00e9cret encadrement) k\u00f6nnen in regulierten Zonen gelten.
rentchange.legal.BE=Diese Mietanpassung folgt dem Gezondheidsindex (Gesundheitsindex) f\u00fcr die anwendbare Region. Regionale Wohnungscodbestimmungen gelten.
rentchange.legal.ES=Diese Mietanpassung unterliegt LAU Art. 18 (actualizaci\u00f3n de renta). Tempor\u00e4re Mieterh\u00f6hungsobergrenzen k\u00f6nnen gelten.
rentchange.legal.PT=Diese Mietanpassung folgt dem INE coeficiente de atualiza\u00e7\u00e3o. NRAU Art. 24 Bestimmungen gelten.
rentchange.legal.AT=Diese Mietanpassung unterliegt MRG \u00a716 (angemessener Mietzins). Der Richtwertmietzins oder VPI/CPI-Referenz gilt.
rentchange.legal.GB=Diese Mietanpassung unterliegt den Mitteilungspflichten nach Section 13 Housing Act 1988. Marktmietvergleich gilt.
rentchange.legal.IT=Diese Mietanpassung folgt dem ISTAT FOI-Index. Legge 392/1978 oder 431/1998 Bestimmungen gelten.
rentchange.legal.SE=Diese Mietanpassung folgt dem Bruksv\u00e4rdessystem (Gebrauchswertsystem). Hyresg\u00e4stf\u00f6reningen-Verhandlungspflichten gelten.
rentchange.legal.DK=Diese Mietanpassung unterliegt dem Lejeloven. Kostenbasierte oder marktbasierte Regeln gelten je nach Geb\u00e4udeklassifizierung.
rentchange.legal.IE=Diese Mietanpassung unterliegt dem Residential Tenancies Act 2004. Die j\u00e4hrliche RPZ-Obergrenze von 2% kann gelten.
rentchange.legal.PL=Diese Mietanpassung unterliegt dem Zivilgesetzbuch Art. 6851. Eine schriftliche Mitteilung mit 3 Monaten Vorlauf ist erforderlich.
rentchange.legal.FI=Diese Mietanpassung unterliegt dem Gesetz \u00fcber Wohnraummietverh\u00e4ltnisse (481/1995). Vertragsbedingungen bestimmen die Anpassungen.
rentchange.legal.NO=Diese Mietanpassung folgt dem Husleieloven \u00a74-2/\u00a74-3. CPI-Anpassungsregeln gelten.
rentchange.legal.US=Diese Mietanpassung unterliegt den geltenden bundesstaatlichen und lokalen Vorschriften. Mietpreisregulierung kann in bestimmten Rechtsgebieten gelten.
rentchange.legal.CA=Diese Mietanpassung folgt der geltenden provinziellen Mietgesetzgebung. J\u00e4hrliche Richtlinien-Erh\u00f6hungsgrenzen k\u00f6nnen gelten.
rentchange.legal.HU=Diese Mietanpassung folgt den Mietbestimmungen des ungarischen B\u00fcrgerlichen Gesetzbuchs. Vertragsbedingungen bestimmen die Anpassungen.
rentchange.legal.CZ=Diese Mietanpassung unterliegt dem B\u00fcrgerlichen Gesetzbuch \u00a72249. Erh\u00f6hungen auf vergleichbare Miete sind auf 20% \u00fcber 3 Jahre begrenzt.
rentchange.legal.CH=Diese Mietanpassung unterliegt dem Obligationenrecht Art. 269a. Anpassungen sind an den Referenzzinssatz gekoppelt.
