rentchange.legal.NL=Denne lejeregulering er underlagt nederlandsk lejeret (art. 7:252-253 BW). Tvister kan indbringes for Huurcommissie.
rentchange.legal.DE=Denne lejeregulering sker i henhold til §558 BGB (Mieterhöhung bis zur ortsüblichen Vergleichsmiete). Kappungsgrenze (loft på 20%/15% over 3 år) kan finde anvendelse.
rentchange.legal.FR=Denne lejeregulering er underlagt IRL (Indice de Référence des Loyers). Regler om huslejeregulering (décret encadrement) kan finde anvendelse i regulerede områder.
rentchange.legal.BE=Denne lejeregulering følger Gezondheidsindex (sundhedsindekset) for den pågældende region. Regionale boligregler finder anvendelse.
rentchange.legal.ES=Denne lejeregulering er underlagt LAU art. 18 (actualización de renta). Midlertidige lofter over lejeforhøjelser kan finde anvendelse.
rentchange.legal.PT=Denne lejeregulering følger INE coeficiente de atualização. Bestemmelserne i NRAU art. 24 finder anvendelse.
rentchange.legal.AT=Denne lejeregulering er underlagt MRG §16 (angemessener Mietzins). Richtwertmietzins eller VPI/CPI-referencen finder anvendelse.
rentchange.legal.GB=Denne lejeregulering er underlagt varslingskravene i Section 13 i Housing Act 1988. Sammenligning med markedsleje finder anvendelse.
rentchange.legal.IT=Denne lejeregulering følger ISTAT FOI-indekset. Bestemmelserne i Legge 392/1978 eller 431/1998 finder anvendelse.
rentchange.legal.SE=Denne lejeregulering følger bruksvärdessystemet (brugsværdisystemet). Kravene om forhandling med Hyresgästföreningen finder anvendelse.
rentchange.legal.DK=Denne lejeregulering er underlagt lejeloven. Omkostningsbestemte eller markedsbestemte regler gælder afhængigt af ejendommens klassificering.
rentchange.legal.IE=Denne lejeregulering er underlagt Residential Tenancies Act 2004. RPZ-loftet på 2% årligt kan finde anvendelse.
rentchange.legal.PL=Denne lejeregulering er underlagt den polske civillovbogs art. 6851. Der kræves skriftligt varsel med 3 måneders frist.
rentchange.legal.FI=Denne lejeregulering er underlagt loven om boliglejemål (481/1995). Kontraktens vilkår er afgørende for reguleringen.
rentchange.legal.NO=Denne lejeregulering følger Husleieloven §4-2/§4-3. Reglerne om KPI-regulering finder anvendelse.
rentchange.legal.US=Denne lejeregulering er underlagt gældende delstatslige og lokale regler. Huslejeregulering kan finde anvendelse i visse jurisdiktioner.
rentchange.legal.CA=Denne lejeregulering følger gældende provinsiel lejelovgivning. Årlige vejledende lofter over forhøjelser kan finde anvendelse.
rentchange.legal.HU=Denne lejeregulering følger den ungarske civillovbogs bestemmelser om leje. Kontraktens vilkår er afgørende for reguleringen.
rentchange.legal.CZ=Denne lejeregulering er underlagt civillovbogens §2249. Forhøjelser til sammenligneligt leje er begrænset til 20% over 3 år.
rentchange.legal.CH=Denne lejeregulering er underlagt Obligationenrecht art. 269a. Reguleringer er knyttet til referencerenten (Referenzzinssatz).
