deposit.disclaimer=Η εκκαθάριση εκδίδεται βάσει της μίσθωσης. Οι νόμιμες προθεσμίες και διαδικασίες αμφισβήτησης για εγγυήσεις διαφέρουν ανά δικαιοδοσία και δεν επηρεάζονται από το παρόν.
deposit.legal.NL=Κατά το ολλανδικό δίκαιο, η εγγύηση πρέπει να επιστρέφεται εντός εύλογου χρόνου μετά τη λήξη της μίσθωσης· για αμφισβητούμενες παρακρατήσεις μπορεί να αποφανθεί η Huurcommissie ή τα δικαστήρια.
deposit.legal.DE=Κατά το § 551 BGB, η εγγύηση πρέπει να τηρείται χωριστά από την περιουσία του εκμισθωτή και να εκκαθαρίζεται εντός εύλογου χρόνου (συνήθως έως έξι μήνες) μετά τη λήξη της μίσθωσης.
deposit.legal.FR=Κατά το άρθρο 22 του νόμου 89-462, η εγγύηση πρέπει να επιστρέφεται εντός ενός μηνός (δύο μηνών σε περίπτωση παρακρατήσεων) από την παράδοση των κλειδιών· η καθυστέρηση επιβαρύνεται με 10% του μηνιαίου μισθώματος ανά μήνα καθυστέρησης.
deposit.legal.BE=Η εγγύηση κατατέθηκε σε δεσμευμένο λογαριασμό στο όνομα του μισθωτή, όπως απαιτεί το περιφερειακό διάταγμα μίσθωσης κατοικίας· η αποδέσμευση απαιτεί τη συμφωνία και των δύο μερών ή δικαστική απόφαση.
deposit.legal.ES=Κατά το άρθρο 36 LAU, η εγγύηση πρέπει να επιστρέφεται εντός ενός μηνός από την παράδοση των κλειδιών· μετά την προθεσμία αυτή το ποσό τοκοφορεί με το νόμιμο επιτόκιο.
deposit.legal.PT=Κατά τον πορτογαλικό Αστικό Κώδικα, η εγγύηση (caução) πρέπει να επιστρέφεται στη λήξη της μίσθωσης μετά τον συμψηφισμό τυχόν οφειλόμενων ποσών.
deposit.legal.GB=Οι εγγυήσεις assured shorthold tenancy σε Αγγλία και Ουαλία πρέπει να προστατεύονται σε κρατικά εγκεκριμένο σύστημα· οι διαφορές μπορούν να παραπεμφθούν στη δωρεάν υπηρεσία επίλυσης διαφορών του συστήματος.
deposit.legal.IT=Κατά το άρθρο 11 του νόμου 392/1978, η εγγύηση (deposito cauzionale) δεν μπορεί να υπερβαίνει τρία μηνιαία μισθώματα και τοκοφορεί με το νόμιμο επιτόκιο, καταβλητέο ετησίως στον μισθωτή.
