lease.it.residential.parties.title=Partijen
lease.it.residential.parties.summary=Vermeldt de verhuurder en de huurder of huurders met fiscale code en persoonsgegevens; medehuurders zijn hoofdelijk aansprakelijk; schriftelijke vorm verplicht.
