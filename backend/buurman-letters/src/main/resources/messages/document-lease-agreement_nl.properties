# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Partijen
lease.gb.residential.parties.summary=Vermeldt de verhuurder en de huurder(s); medehuurders zijn hoofdelijk aansprakelijk; in Wales is de huurder de contract-holder.
lease.gb.residential.premises.title=Het gehuurde
lease.gb.residential.premises.summary=Beschrijft de verhuurde woning en het stelsel van het landsdeel: assured tenancy (Engeland), standard occupation contract (Wales), private residential tenancy (Schotland) of private tenancy (Noord-Ierland).
lease.gb.residential.term.title=Duur
lease.gb.residential.term.summary=Ingangsdatum; huur voor onbepaalde tijd per periode zonder vaste termijn in Engeland en Schotland, periodiek of voor bepaalde tijd in Wales en Noord-Ierland.
lease.gb.residential.rent.title=Huurprijs
lease.gb.residential.rent.summary=De huurprijs en de huurperiode; in Engeland mag de huurperiode niet langer zijn dan 1 maand.
lease.gb.residential.rent-adjustment.title=Huurverhoging
lease.gb.residential.rent-adjustment.summary=Huurverhoging alleen voor zover de wet dat toestaat: in Engeland met een kennisgeving op grond van section 13 of een beslissing van het tribunaal; 2 maanden in Engeland en Wales, 3 maanden in Schotland en Noord-Ierland, ten hoogste 1 verhoging per jaar.
lease.gb.residential.service-costs.title=Nutsvoorzieningen en gemeentebelasting
lease.gb.residential.service-costs.summary=Nutsvoorzieningen en council tax of domestic rates ten laste van de huurder, en eventuele kosten die aan de verhuurder worden betaald.
lease.gb.residential.deposit.title=Waarborgsom
lease.gb.residential.deposit.summary=Waarborgsom beschermd in een erkende regeling; ten hoogste 5 of 6 weken huur in Engeland, 2 maanden huur in Schotland en 1 maand huur in Noord-Ierland.
lease.gb.residential.payment.title=Betaling
lease.gb.residential.payment.summary=Betaaldatum en betaalwijze; in Engeland geen huur vóór de huurperiode en rente bij te late betaling ten hoogste 3% boven de basisrente.
lease.gb.residential.fees.title=Kosten en toegestane betalingen
lease.gb.residential.fees.summary=Alleen toegestane betalingen mogen worden gevraagd: Tenant Fees Act 2019 in Engeland, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 in Wales.
lease.gb.residential.use.title=Gebruik en huisdieren
lease.gb.residential.use.summary=Gebruik als woning zonder overlast; huisdieren met toestemming van de verhuurder, die niet zonder redelijke grond wordt geweigerd.
lease.gb.residential.subletting.title=Onderverhuur en overdracht
lease.gb.residential.subletting.summary=Overdracht, onderverhuur en kostgangers alleen met toestemming van de verhuurder.
lease.gb.residential.maintenance.title=Onderhoud en bewoonbaarheid
lease.gb.residential.maintenance.summary=De wettelijke onderhouds- en bewoonbaarheidsplichten van de verhuurder per landsdeel; de huurder meldt gebreken en verleent toegang na 24 uur aankondiging.
lease.gb.residential.safety.title=Veiligheid
lease.gb.residential.safety.summary=Gasveiligheidskeuring elke 12 maanden, elektrische keuring ten minste elke 5 jaar, rook- en koolmonoxidemelders.
lease.gb.residential.energy-certificate.title=Energieprestatiecertificaat
lease.gb.residential.energy-certificate.summary=De verhuurder verstrekt een geldig energieprestatiecertificaat; in Engeland en Wales moet de woning ten minste klasse E hebben.
lease.gb.residential.registration.title=Registratie en vergunningen
lease.gb.residential.registration.summary=Registratie van de verhuurder in Wales, Schotland en Noord-Ierland en een eventuele vergunning van de lokale overheid.
lease.gb.residential.right-to-rent.title=Recht om te huren
lease.gb.residential.right-to-rent.summary=Controle van het verblijfsrecht (right to rent) van volwassen bewoners, die alleen in Engeland geldt.
lease.gb.residential.statutory-information.title=Wettelijke informatie
lease.gb.residential.statutory-information.summary=De schriftelijke verklaring, voorwaarden of huurinformatie die de verhuurder volgens het recht van elk landsdeel moet verstrekken, en een adres voor kennisgevingen.
lease.gb.residential.handover-inspection.title=Inventaris en oplevering
lease.gb.residential.handover-inspection.summary=Inventaris en beschrijving van de staat bij aanvang; oplevering van de woning aan het einde, normale slijtage uitgezonderd.
lease.gb.residential.termination.title=Beëindiging
lease.gb.residential.termination.summary=De opzegging door de huurder en de wettelijke gronden en kennisgevingen van de verhuurder per landsdeel; geen ontruiming op grond van section 21 in Engeland.
lease.gb.residential.notices.title=Kennisgevingen
lease.gb.residential.notices.summary=Schriftelijke kennisgevingen per bode, per post of, waar toegestaan, per e-mail.
lease.gb.residential.data-protection.title=Gegevensbescherming
lease.gb.residential.data-protection.summary=Verwerking van persoonsgegevens van de huurder volgens de UK GDPR en de Data Protection Act 2018.
lease.gb.residential.disputes.title=Toepasselijk recht en geschillen
lease.gb.residential.disputes.summary=Het recht en de rechtbanken of tribunalen van het landsdeel waar de woning ligt.
lease.gb.commercial.parties.title=Partijen
lease.gb.commercial.parties.summary=Vermeldt de verhuurder en de huurder met ondernemingsnummer, statutaire zetel en btw-nummer.
lease.gb.commercial.premises.title=Het gehuurde
lease.gb.commercial.premises.summary=Beschrijft de bedrijfsruimte, de oppervlakte en de verleende rechten.
lease.gb.commercial.permitted-use.title=Toegestaan gebruik
lease.gb.commercial.permitted-use.summary=Het toegestane bedrijfsmatige gebruik; de huurder verkrijgt bouw- en andere vergunningen.
lease.gb.commercial.term.title=Duur
lease.gb.commercial.term.summary=Ingangsdatum, bepaalde tijd of periodieke huur; inschrijving van huurovereenkomsten van meer dan 7 jaar en overdrachtsbelasting.
lease.gb.commercial.security-of-tenure.title=Huurbescherming
lease.gb.commercial.security-of-tenure.summary=Verlengingsrechten onder de Landlord and Tenant Act 1954 (Engeland en Wales) of de Order van 1996 (Noord-Ierland), uitsluiting daarvan, en tacit relocation in Schotland.
lease.gb.commercial.rent.title=Huurprijs
lease.gb.commercial.rent.summary=De huurprijs, exclusief btw, servicekosten en verzekeringspremie.
lease.gb.commercial.rent-adjustment.title=Huurherziening
lease.gb.commercial.rent-adjustment.summary=Herziening naar de markthuur of volgens een index, naar boven of naar beneden, met vaststelling door een onafhankelijke deskundige.
lease.gb.commercial.service-costs.title=Servicekosten
lease.gb.commercial.service-costs.summary=Een redelijk aandeel in de servicekosten van het gebouw, met begroting en jaarafrekening.
lease.gb.commercial.vat.title=Btw
lease.gb.commercial.vat.summary=Alle bedragen zijn exclusief btw; btw is verschuldigd als de verhuurder voor belaste verhuur heeft gekozen.
lease.gb.commercial.deposit.title=Huurwaarborg
lease.gb.commercial.deposit.summary=Huurwaarborg op een afzonderlijke rentedragende rekening, met regels voor aanvulling en terugbetaling.
lease.gb.commercial.payment.title=Betaling
lease.gb.commercial.payment.summary=Huur vooruit zonder verrekening, rente bij te late betaling en invordering van achterstallige huur in Engeland en Wales.
lease.gb.commercial.maintenance.title=Onderhoud
lease.gb.commercial.maintenance.summary=Volledige of inwendige onderhoudsplicht, beperkt door een eventuele staat van het gehuurde.
lease.gb.commercial.alterations.title=Veranderingen
lease.gb.commercial.alterations.summary=Geen constructieve veranderingen; andere veranderingen met toestemming; herstel in oorspronkelijke staat aan het einde.
lease.gb.commercial.assignment.title=Overdracht en onderverhuur
lease.gb.commercial.assignment.summary=Overdracht en onderverhuur met toestemming die niet zonder redelijke grond wordt geweigerd; regels over ontslag en garantie in Engeland en Wales.
lease.gb.commercial.insurance.title=Verzekering
lease.gb.commercial.insurance.summary=De verhuurder verzekert het gebouw en rekent de premie door; de huurder verzekert inboedel en aansprakelijkheid; opschorting van de huur na verzekerde schade.
lease.gb.commercial.energy-certificate.title=Energieprestatie
lease.gb.commercial.energy-certificate.summary=Energieprestatiecertificaat voor het gehuurde; minimaal klasse E voor niet-woningen in Engeland en Wales.
lease.gb.commercial.break-option.title=Tussentijdse opzegging
lease.gb.commercial.break-option.summary=Mogelijkheid de huur op een opzegdatum vroegtijdig te beëindigen, met opzegtermijn en voorwaarden.
lease.gb.commercial.handover-inspection.title=Staat en oplevering
lease.gb.commercial.handover-inspection.summary=Staat van het gehuurde, oplevering leeg en ontruimd, en de beperking van schadevergoeding wegens achterstallig onderhoud.
lease.gb.commercial.termination.title=Beëindiging en ontbinding
lease.gb.commercial.termination.summary=Ontbinding (forfeiture of irritancy) wegens wanbetaling, tekortkoming of insolventie, met wettelijke kennisgeving en rechtsbescherming.
lease.gb.commercial.notices.title=Kennisgevingen
lease.gb.commercial.notices.summary=Schriftelijke kennisgevingen per bode of aangetekend aan de statutaire zetel.
lease.gb.commercial.guarantor.title=Borg
lease.gb.commercial.guarantor.summary=Garantie van de verplichtingen van de huurder door een borg.
lease.gb.commercial.data-protection.title=Gegevensbescherming
lease.gb.commercial.data-protection.summary=Verwerking van persoonsgegevens van de vertegenwoordigers van partijen volgens de UK GDPR.
lease.gb.commercial.disputes.title=Toepasselijk recht en geschillen
lease.gb.commercial.disputes.summary=Het recht en de rechtbanken van het rechtsgebied waar het gehuurde ligt; scheidbaarheid.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Partijen
lease.gr.residential.parties.summary=Vermeldt verhuurder en huurder met fiscaal nummer en identiteitsgegevens; medehuurders zijn hoofdelijk aansprakelijk.
lease.gr.residential.premises.title=Gehuurde
lease.gr.residential.premises.summary=Beschrijft de woning die als hoofdverblijf van de huurder wordt verhuurd, de aanhorigheden en de kadastercode.
lease.gr.residential.term.title=Duur
lease.gr.residential.term.summary=Bepaalde of onbepaalde tijd; wettelijke minimumduur van 3 jaar voor een hoofdverblijf, alleen te verkorten bij latere notariële overeenkomst.
lease.gr.residential.rent.title=Huurprijs
lease.gr.residential.rent.summary=Vrij overeengekomen huurprijs; geen ontheffing van de huur om redenen die de huurder betreffen.
lease.gr.residential.rent-adjustment.title=Huuraanpassing
lease.gr.residential.rent-adjustment.summary=Vrij overeengekomen aanpassing; wettelijke regel van 75% van de kosten-van-levensonderhoudindex bij een duur korter dan 3 jaar zonder aanpassingsbeding.
lease.gr.residential.service-costs.title=Nutsvoorzieningen en gemeenschappelijke kosten
lease.gr.residential.service-costs.summary=Verbruik en gemeenschappelijke gebruikskosten voor de huurder; belastingen en buitengewone gebouwkosten voor de verhuurder.
lease.gr.residential.deposit.title=Waarborgsom
lease.gr.residential.deposit.summary=Facultatieve waarborgsom, niet verrekenbaar met de huur, aan het einde terugbetaald na aftrek van verschuldigde bedragen.
lease.gr.residential.payment.title=Betaling
lease.gr.residential.payment.summary=Betaaldatum en bankoverschrijving; vanaf de ingangsdatum betaling op een bij de AADE gemelde bankrekening van de verhuurder.
lease.gr.residential.use.title=Gebruik
lease.gr.residential.use.summary=Zorgvuldig gebruik als hoofdverblijf, huisregels en bezoeken van de verhuurder tot 1 keer per 3 maanden.
lease.gr.residential.subletting.title=Onderverhuur
lease.gr.residential.subletting.summary=Onderverhuur en kortetermijnverhuur alleen met schriftelijke toestemming van de verhuurder; aansprakelijkheid voor de derde.
lease.gr.residential.maintenance.title=Onderhoud en gebreken
lease.gr.residential.maintenance.summary=De verhuurder houdt het gehuurde geschikt voor gebruik; huurvermindering bij gebreken, kosten en meldplicht van de huurder.
lease.gr.residential.energy-certificate.title=Energieprestatiecertificaat
lease.gr.residential.energy-certificate.summary=Verplicht certificaat dat aan een nieuwe huurder wordt getoond en overhandigd, met het nummer in de huuraangifte.
lease.gr.residential.registration.title=Huuraangifte bij de AADE
lease.gr.residential.registration.summary=Elektronische aangifte van de huur bij de belastingdienst en aanvaarding door de huurder binnen 30 dagen.
lease.gr.residential.sale-of-premises.title=Verkoop van het gehuurde
lease.gr.residential.sale-of-premises.summary=Positie van de nieuwe eigenaar bij een huur met vaste dagtekening en zijn opzeggingsrecht in andere gevallen.
lease.gr.residential.handover-inspection.title=Oplevering en teruggave
lease.gr.residential.handover-inspection.summary=Opleveringsrapport, teruggave in de ontvangen staat, voortgezet gebruik en verjaringstermijnen van 6 maanden.
lease.gr.residential.termination.title=Beëindiging
lease.gr.residential.termination.summary=Minimumduur, opzegging bij onbepaalde tijd, opzegging wegens achterstand, gronden voor de huurder, gezinswoning en ontruimingsbevel.
lease.gr.residential.data-protection.title=Gegevensbescherming
lease.gr.residential.data-protection.summary=Verwerking van de persoonsgegevens van de huurder volgens de AVG en Wet 4624/2019.
lease.gr.residential.disputes.title=Toepasselijk recht en geschillen
lease.gr.residential.disputes.summary=Grieks recht en de rechter van de plaats van het goed volgens de bijzondere procedure voor huurgeschillen.
lease.gr.commercial.parties.title=Partijen
lease.gr.commercial.parties.summary=Vermeldt verhuurder en huurder met fiscaal nummer, handelsregisternummer en wettelijke vertegenwoordigers.
lease.gr.commercial.premises.title=Gehuurde
lease.gr.commercial.premises.summary=Beschrijft de bedrijfsruimte, de aanhorigheden en de geschiktheid voor het overeengekomen gebruik.
lease.gr.commercial.permitted-use.title=Toegestaan gebruik
lease.gr.commercial.permitted-use.summary=De activiteit van de huurder, het toepassingsgebied van Presidentieel Besluit 34/1995, vergunningen en zorgvuldig gebruik.
lease.gr.commercial.term.title=Duur
lease.gr.commercial.term.summary=Bepaalde of onbepaalde tijd; minimumduur van 3 jaar bij huur onder Presidentieel Besluit 34/1995 en geen wettelijke goodwillvergoeding.
lease.gr.commercial.rent.title=Huurprijs
lease.gr.commercial.rent.summary=Door partijen vrij vastgestelde huurprijs, vermeerderd met de belasting op de huur.
lease.gr.commercial.rent-adjustment.title=Huuraanpassing
lease.gr.commercial.rent-adjustment.summary=Overeengekomen aanpassing, wettelijke aanvullende regels en het plafond van 3% voor aanpassingen in 2026.
lease.gr.commercial.service-costs.title=Nutsvoorzieningen en gemeenschappelijke kosten
lease.gr.commercial.service-costs.summary=Verbruik en gemeenschappelijke kosten voor de huurder; belastingen op het gehuurde voor de verhuurder, tenzij anders overeengekomen.
lease.gr.commercial.vat.title=Btw en digitale transactieheffing
lease.gr.commercial.vat.summary=Btw bij keuze daarvoor, anders de digitale transactieheffing van 3,60%, aangegeven door de verhuurder of in de wettelijke gevallen door de huurder.
lease.gr.commercial.deposit.title=Waarborgsom
lease.gr.commercial.deposit.summary=Facultatieve waarborgsom of bankgarantie, aangevuld bij huuraanpassingen en aan het einde terugbetaald.
lease.gr.commercial.payment.title=Betaling
lease.gr.commercial.payment.summary=Betaaldatum, bankoverschrijving en fiscale documenten; betaling op een bij de AADE gemelde rekening van de verhuurder als de huur geen bedrijfskosten is.
lease.gr.commercial.maintenance.title=Onderhoud en gebreken
lease.gr.commercial.maintenance.summary=De verhuurder houdt het gehuurde geschikt voor gebruik; verdeling van gewoon onderhoud en structurele herstellingen.
lease.gr.commercial.alterations.title=Inrichting en veranderingen
lease.gr.commercial.alterations.summary=Inrichtingswerken voor rekening van de huurder met schriftelijke toestemming; kosten en lot van de werken aan het einde.
lease.gr.commercial.assignment.title=Overdracht en onderverhuur
lease.gr.commercial.assignment.summary=Overdracht van gebruik alleen zoals de wet toelaat of met toestemming; uitzondering voor vennootschappen na 3 jaar en overdracht bij ziekte of overlijden.
lease.gr.commercial.insurance.title=Verzekering
lease.gr.commercial.insurance.summary=Opstalverzekering door de verhuurder; verzekering van inrichting, goederen en aansprakelijkheid door de huurder.
lease.gr.commercial.energy-certificate.title=Energieprestatiecertificaat
lease.gr.commercial.energy-certificate.summary=Verplicht certificaat dat aan een nieuwe huurder wordt getoond en overhandigd, met het nummer in de huuraangifte.
lease.gr.commercial.registration.title=Huuraangifte bij de AADE
lease.gr.commercial.registration.summary=Elektronische aangifte van de huur bij de belastingdienst en aanvaarding door de huurder binnen 30 dagen.
lease.gr.commercial.sale-of-premises.title=Verkoop van het gehuurde
lease.gr.commercial.sale-of-premises.summary=Positie van de nieuwe eigenaar bij een huur met vaste dagtekening en zijn opzeggingsrecht in andere gevallen.
lease.gr.commercial.handover-inspection.title=Oplevering en teruggave
lease.gr.commercial.handover-inspection.summary=Opleveringsrapport, teruggave in de ontvangen staat, voortgezet gebruik, verjaringstermijnen en bezichtigingen.
lease.gr.commercial.termination.title=Beëindiging
lease.gr.commercial.termination.summary=Opzeggingsregels, opzegging wegens achterstand, gronden voor de huurder en ontruimingsbevel; vroegtijdige opzegging alleen indien overeengekomen.
lease.gr.commercial.data-protection.title=Gegevensbescherming
lease.gr.commercial.data-protection.summary=Verwerking van de persoonsgegevens van de personen die voor de partijen optreden volgens de AVG.
lease.gr.commercial.disputes.title=Toepasselijk recht en geschillen
lease.gr.commercial.disputes.summary=Grieks recht, de rechter van de plaats van het goed en nietigheid van afstand van rechten onder Presidentieel Besluit 34/1995.
# ===== end GR =====


# ===== IE lease clause titles and summaries (country pack) =====
lease.ie.residential.parties.title=Partijen
lease.ie.residential.parties.summary=Verhuurder en huurder, hoofdelijke aansprakelijkheid van medehuurders, en de gemachtigde en contactgegevens van de verhuurder.
lease.ie.residential.premises.title=Woonruimte
lease.ie.residential.premises.summary=De verhuurde woning en de toepassing van de Residential Tenancies Act 2004 op huurovereenkomsten vanaf 1 maart 2026.
lease.ie.residential.term.title=Duur en huurbescherming
lease.ie.residential.term.summary=Ingangsdatum, bepaalde of onbepaalde duur, Part 4-huur na 6 maanden en minimumtermijnen van 6 jaar.
lease.ie.residential.rent.title=Huurprijs
lease.ie.residential.rent.summary=Huurbedrag, de markthuur als maximum en de landelijke grens van 2% per jaar of de CPI-stijging als die lager is.
lease.ie.residential.rent-information.title=Huurinformatie bij aanvang
lease.ie.residential.rent-information.summary=Vorige huurprijs en 3 vergelijkbare huren, bij aanvang aan de huurder en binnen 1 maand aan de RTB verstrekt.
lease.ie.residential.rent-adjustment.title=Huurherziening
lease.ie.residential.rent-adjustment.summary=Huurherziening ten hoogste 1 keer per 12 maanden, niet in de eerste 12 maanden, met 90 dagen kennisgeving op het voorgeschreven formulier.
lease.ie.residential.service-costs.title=Nutsvoorzieningen en kosten
lease.ie.residential.service-costs.summary=Nutsvoorzieningen en andere kosten voor de huurder; servicekosten van de beheermaatschappij voor de verhuurder, tenzij anders overeengekomen.
lease.ie.residential.deposit.title=Waarborgsom
lease.ie.residential.deposit.summary=Waarborgsom van ten hoogste 1 maand huur, aan het einde onverwijld terugbetaald na aftrek van huurachterstand of schadekosten.
lease.ie.residential.payment.title=Betaling
lease.ie.residential.payment.summary=Betaling van de huur op de vervaldag per bankoverschrijving, vooruitbetaling beperkt tot 1 maand, en een huurboekje.
lease.ie.residential.use.title=Gebruik van de woning
lease.ie.residential.use.summary=Gebruik uitsluitend als woning, geen overlastgevend gedrag, melding van bewoners en huisdieren alleen met toestemming.
lease.ie.residential.subletting.title=Overdracht en onderverhuur
lease.ie.residential.subletting.summary=Overdracht of onderverhuur alleen met schriftelijke toestemming; bij weigering mag de huurder opzeggen.
lease.ie.residential.maintenance.title=Herstel en onderhoud
lease.ie.residential.maintenance.summary=Verhuurder herstelt casco en interieur en voldoet aan de huurwoningnormen; huurder meldt gebreken en verleent toegang.
lease.ie.residential.energy-certificate.title=Energieprestatie (BER)
lease.ie.residential.energy-certificate.summary=BER-certificaat van de woning, ter beschikking gesteld aan de huurder wanneer vereist.
lease.ie.residential.registration.title=Registratie bij de RTB
lease.ie.residential.registration.summary=Registratie van de huurovereenkomst bij de RTB binnen 1 maand na de aanvang en na elke verjaardag daarvan.
lease.ie.residential.insurance.title=Verzekering
lease.ie.residential.insurance.summary=Opstalverzekering van de verhuurder met aansprakelijkheidsdekking van ten minste EUR 250.000; de huurder mag die niet ongeldig maken.
lease.ie.residential.handover-inspection.title=Inventaris en oplevering
lease.ie.residential.handover-inspection.summary=Ondertekende inventaris bij aanvang en teruggave van de woning aan het einde, normale slijtage buiten beschouwing.
lease.ie.residential.termination.title=Beëindiging
lease.ie.residential.termination.summary=Opzeggingen, wettelijke opzegtermijnen en de beperkte gronden om een Part 4-huur te beëindigen.
lease.ie.residential.notices.title=Kennisgevingen
lease.ie.residential.notices.summary=Schriftelijke kennisgevingen, betekening volgens de wet, ook per e-mail, en adressen voor kennisgevingen.
lease.ie.residential.data-protection.title=Gegevensbescherming
lease.ie.residential.data-protection.summary=Verwerking van persoonsgegevens volgens de AVG en de Data Protection Act 2018.
lease.ie.residential.disputes.title=Geschillen
lease.ie.residential.disputes.summary=Iers recht; geschillen onder de wet gaan naar de RTB, andere geschillen naar de Ierse rechter.
lease.ie.commercial.parties.title=Partijen
lease.ie.commercial.parties.summary=Verhuurder en huurder met inschrijvingsnummer, statutaire zetel, btw-nummer en vertegenwoordiger.
lease.ie.commercial.premises.title=Het gehuurde
lease.ie.commercial.premises.summary=De verhuurde bedrijfsruimte, de oppervlakte en de rechten; de Residential Tenancies Act 2004 is niet van toepassing.
lease.ie.commercial.permitted-use.title=Toegestaan gebruik
lease.ie.commercial.permitted-use.summary=Toegestaan bedrijfsmatig gebruik; toestemming voor wijziging niet op onredelijke gronden geweigerd; vergunningen voor risico van de huurder.
lease.ie.commercial.term.title=Duur
lease.ie.commercial.term.summary=Ingangsdatum en bepaalde duur, of een periodieke huur die eindigt door opzegging.
lease.ie.commercial.renewal.title=Recht op een nieuwe huur
lease.ie.commercial.renewal.summary=Wettelijk recht op een nieuwe huur na 5 jaar bedrijfsmatig gebruik en de mogelijkheid van afstand na juridisch advies.
lease.ie.commercial.rent.title=Huurprijs
lease.ie.commercial.rent.summary=Huurbedrag exclusief btw, servicekosten en verzekering, en een eventueel overeengekomen incentive.
lease.ie.commercial.rent-adjustment.title=Huurherziening
