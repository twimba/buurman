# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Partijen
lease.nl.residential.parties.summary=Benoemt de verhuurder en de huurder(s); medehuurders zijn hoofdelijk aansprakelijk.
lease.nl.residential.premises.title=Het gehuurde
lease.nl.residential.premises.summary=Beschrijft de verhuurde woonruimte en verklaart het huurrecht voor woonruimte van toepassing.
lease.nl.residential.term.title=Duur
lease.nl.residential.term.summary=Ingangsdatum en of de huur voor onbepaalde of bepaalde tijd is aangegaan.
lease.nl.residential.rent.title=Huurprijs
lease.nl.residential.rent.summary=De kale huurprijs en het recht van de huurder op toetsing door de huurcommissie.
lease.nl.residential.rent-adjustment.title=Huurprijsaanpassing
lease.nl.residential.rent-adjustment.summary=Jaarlijkse huurprijsaanpassing, nooit hoger dan de wettelijk maximale huurverhoging.
lease.nl.residential.service-costs.title=Servicekosten
lease.nl.residential.service-costs.summary=Voorschotten op nutsvoorzieningen en servicekosten met een jaarlijks overzicht.
lease.nl.residential.deposit.title=Waarborgsom
lease.nl.residential.deposit.summary=Waarborgsom van ten hoogste tweemaal de kale huur, terugbetaald binnen de wettelijke termijn.
lease.nl.residential.payment.title=Betaling
lease.nl.residential.payment.summary=Wanneer en hoe de huur wordt betaald, bij vooruitbetaling per betalingstermijn.
lease.nl.residential.use.title=Gebruik
lease.nl.residential.use.summary=Gebruik uitsluitend als woonruimte, als goed huurder, en veranderingen aan het gehuurde.
lease.nl.residential.subletting.title=Onderverhuur
lease.nl.residential.subletting.summary=Onderverhuur alleen met schriftelijke toestemming, behoudens wettelijke rechten.
lease.nl.residential.maintenance.title=Onderhoud en herstel
lease.nl.residential.maintenance.summary=De verhuurder verhelpt gebreken; de huurder verricht kleine herstellingen.
lease.nl.residential.energy-label.title=Energielabel
lease.nl.residential.energy-label.summary=De verhuurder verstrekt een afschrift van het geldige energielabel van de woning.
lease.nl.residential.handover-inspection.title=Inspectie en oplevering
lease.nl.residential.handover-inspection.summary=Opnamerapport bij aanvang, voorinspectie en eindinspectie bij oplevering.
lease.nl.residential.termination.title=Beëindiging
lease.nl.residential.termination.summary=Opzegtermijnen en de wettelijke gronden waarop de verhuurder kan opzeggen.
lease.nl.residential.data-protection.title=Gegevensbescherming
lease.nl.residential.data-protection.summary=Verwerking van persoonsgegevens van de huurder overeenkomstig de AVG.
lease.nl.residential.disputes.title=Geschillen
lease.nl.residential.disputes.summary=Nederlands recht is van toepassing; geschillen gaan naar de huurcommissie of de rechter.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Partijen
lease.de.residential.parties.summary=Vermeldt verhuurder en huurder(s); medehuurders zijn hoofdelijk aansprakelijk.
lease.de.residential.premises.title=Gehuurde
lease.de.residential.premises.summary=Beschrijft de verhuurde woning en verklaart het Duitse huurrecht voor woonruimte (BGB) van toepassing.
lease.de.residential.term.title=Duur
lease.de.residential.term.summary=Ingangsdatum; onbepaalde tijd, of bepaalde tijd alleen met een schriftelijk vermelde wettelijke grond.
lease.de.residential.rent.title=Huurprijs
lease.de.residential.rent.summary=De kale huur en de begrenzing van de aanvangshuur in gebieden met een krappe woningmarkt.
lease.de.residential.rent-adjustment.title=Huurverhoging
lease.de.residential.rent-adjustment.summary=Wettelijke huurverhoging tot de plaatselijke vergelijkingshuur, binnen de aftoppingsgrens.
lease.de.residential.service-costs.title=Bijkomende kosten
lease.de.residential.service-costs.summary=Voorschotten op de exploitatiekosten met een jaarlijkse afrekening binnen de wettelijke termijn.
lease.de.residential.deposit.title=Waarborgsom
lease.de.residential.deposit.summary=Huurwaarborg van ten hoogste 3 maanden kale huur, in termijnen te betalen en afgescheiden belegd.
lease.de.residential.payment.title=Betaling
lease.de.residential.payment.summary=De huur wordt vooruitbetaald, uiterlijk op de 3e werkdag van elke betalingstermijn.
lease.de.residential.use.title=Gebruik
lease.de.residential.use.summary=Uitsluitend gebruik als woning, zorgvuldig gebruik en veranderingen alleen met toestemming van de verhuurder.
lease.de.residential.subletting.title=Onderverhuur
lease.de.residential.subletting.summary=Gebruik door derden alleen met toestemming; wettelijk recht van de huurder op gedeeltelijke onderverhuur.
lease.de.residential.maintenance.title=Onderhoud en gebreken
lease.de.residential.maintenance.summary=Verhuurder onderhoudt de woning; huurvermindering bij gebreken; geen sierreparaties voor de huurder.
lease.de.residential.minor-repairs.title=Kleine herstellingen
lease.de.residential.minor-repairs.summary=Huurder draagt de kosten van kleine herstellingen tot een in te vullen bedrag per geval en per jaar.
lease.de.residential.energy-certificate.title=Energieprestatiecertificaat
lease.de.residential.energy-certificate.summary=De verhuurder toont en overhandigt het energieprestatiecertificaat (GModG).
lease.de.residential.registration.title=Bevestiging inschrijving
lease.de.residential.registration.summary=De verhuurder bevestigt de intrek zodat de huurder zich kan inschrijven.
lease.de.residential.handover-inspection.title=Oplevering
lease.de.residential.handover-inspection.summary=Proces-verbaal bij oplevering en teruggave, teruggave van de woning en de verjaringstermijn van 6 maanden.
lease.de.residential.termination.title=Opzegging
lease.de.residential.termination.summary=Schriftelijke opzegging, wettelijke opzegtermijnen en het vereiste gerechtvaardigde belang van de verhuurder.
lease.de.residential.data-protection.title=Gegevensbescherming
lease.de.residential.data-protection.summary=Verwerking van persoonsgegevens van de huurder overeenkomstig de AVG.
lease.de.residential.disputes.title=Geschillen
lease.de.residential.disputes.summary=Duits recht is van toepassing; de rechtbank (Amtsgericht) van de ligging van de woning is exclusief bevoegd.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Partijen
lease.de.commercial.parties.summary=Vermeldt verhuurder en huurder met registernummer, btw-nummer en vertegenwoordigers.
lease.de.commercial.premises.title=Gehuurde
lease.de.commercial.premises.summary=Beschrijft de bedrijfsruimte en verklaart de BGB-regels over huur van bedrijfsruimte van toepassing.
lease.de.commercial.permitted-use.title=Bestemming
lease.de.commercial.permitted-use.summary=Het overeengekomen bedrijfsgebruik; wijziging vereist toestemming; de huurder verkrijgt vergunningen.
lease.de.commercial.term.title=Duur
lease.de.commercial.term.summary=Bepaalde of onbepaalde tijd; een huur langer dan 1 jaar moet in tekstvorm, anders geldt onbepaalde tijd.
lease.de.commercial.rent.title=Huurprijs
lease.de.commercial.rent.summary=De vrij overeengekomen kale huur, vermeerderd met btw en voorschotten waar overeengekomen.
lease.de.commercial.rent-adjustment.title=Indexering
lease.de.commercial.rent-adjustment.summary=Indexering aan de consumentenprijsindex alleen bij langlopende huur volgens de Duitse prijsclausulewet.
lease.de.commercial.service-costs.title=Bijkomende kosten
lease.de.commercial.service-costs.summary=Exploitatiekosten volgens de BetrKV en opgesomde extra posten, met voorschotten en jaarafrekening.
lease.de.commercial.vat.title=Btw-optie
lease.de.commercial.vat.summary=De verhuurder opteert voor btw op de huur; de huurder gebruikt het gehuurde alleen voor btw-belaste activiteiten.
lease.de.commercial.deposit.title=Huurzekerheid
lease.de.commercial.deposit.summary=Waarborgsom of bankgarantie, zonder wettelijk maximum voor bedrijfsruimte.
lease.de.commercial.payment.title=Betaling
lease.de.commercial.payment.summary=Huur vooruit te betalen uiterlijk op de 3e werkdag; beperking van verrekening en handelsrente.
lease.de.commercial.maintenance.title=Onderhoud en herstel
lease.de.commercial.maintenance.summary=Verhuurder onderhoudt casco en gemeenschappelijke delen; huurder onderhoudt het interieur.
lease.de.commercial.alterations.title=Veranderingen en inrichting
lease.de.commercial.alterations.summary=Werken en reclame van de huurder alleen met toestemming in tekstvorm; verwijdering bij het einde.
lease.de.commercial.subletting.title=Onderverhuur
lease.de.commercial.subletting.summary=Gebruik door derden alleen met toestemming; bijzonder opzeggingsrecht bij weigering.
lease.de.commercial.competition.title=Concurrentiebeding
lease.de.commercial.competition.summary=De verhuurder verhuurt niet aan een concurrent met hetzelfde hoofdassortiment.
lease.de.commercial.insurance.title=Verzekering
lease.de.commercial.insurance.summary=Verhuurder verzekert het gebouw; huurder verzekert de inventaris en heeft een bedrijfsaansprakelijkheidsverzekering.
lease.de.commercial.energy-certificate.title=Energieprestatiecertificaat
lease.de.commercial.energy-certificate.summary=De verhuurder toont en overhandigt het energieprestatiecertificaat (GModG).
lease.de.commercial.handover-inspection.title=Oplevering
lease.de.commercial.handover-inspection.summary=Proces-verbaal bij oplevering en teruggave, ontruimde teruggave en de verjaringstermijn van 6 maanden.
lease.de.commercial.termination.title=Opzegging
lease.de.commercial.termination.summary=Opzegging uiterlijk op de 3e werkdag van een kwartaal tegen het einde van het volgende kwartaal; buitengewone opzegging.
lease.de.commercial.data-protection.title=Gegevensbescherming
lease.de.commercial.data-protection.summary=Verwerking van persoonsgegevens van vertegenwoordigers en contactpersonen overeenkomstig de AVG.
lease.de.commercial.disputes.title=Geschillen
lease.de.commercial.disputes.summary=Duits recht is van toepassing; de rechter van de ligging van het gehuurde is exclusief bevoegd.
