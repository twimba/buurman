lease.it.commercial.pre-emption.summary=Voorkeurs- en terugkooprecht van de huurder bij verkoop en bij nieuwe verhuur, behalve voor ruimten zonder publiekscontact en andere uitgesloten gevallen.
lease.it.commercial.goodwill-compensation.title=Vergoeding voor verlies van klantenkring
lease.it.commercial.goodwill-compensation.summary=18 maanden huur (21 voor hotels) als de huur eindigt anders dan door tekortkoming, opzegging, beëindiging of insolventieprocedure van de huurder; niet voor ruimten zonder publiekscontact en andere uitgesloten gevallen.
lease.it.commercial.insurance.title=Verzekering
lease.it.commercial.insurance.summary=De huurder is aansprakelijk voor verlies en brandschade tenzij hem niets te verwijten valt; aansprakelijkheidsverzekering van de huurder en opstalverzekering van de verhuurder.
lease.it.commercial.energy-certificate.title=Energieprestatiecertificaat
lease.it.commercial.energy-certificate.summary=De huurder bevestigt ontvangst van de informatie en documentatie over het APE, met bijgevoegde kopie waar vereist; wettelijke boetes bij verzuim.
lease.it.commercial.registration.title=Registratie en belastingen
lease.it.commercial.registration.summary=Registratie binnen 30 dagen, kosten gelijk verdeeld; registratiebelasting van 1% of 2%; de cedolare secca is niet van toepassing.
lease.it.commercial.handover-inspection.title=Oplevering en teruggave
lease.it.commercial.handover-inspection.summary=Opleveringsverslag bij aanvang; teruggave in dezelfde staat behoudens normale slijtage; overeengekomen vergoeding verschuldigd tot teruggave bij verzuim.
lease.it.commercial.termination.title=Opzegging en ontbinding
lease.it.commercial.termination.summary=De huurder kan om ernstige redenen opzeggen met een termijn van 6 maanden en, indien overeengekomen, op elk moment met dezelfde termijn; weigering door de verhuurder alleen bij de eerste vervaldatum; ontbinding wegens tekortkoming.
lease.it.commercial.notices.title=Kennisgevingen
lease.it.commercial.notices.summary=Aangetekende brief of betekening door een gerechtsdeurwaarder waar de wet dit voorschrijft; adressen en gecertificeerde e-mailadressen.
lease.it.commercial.guarantor.title=Zekerheid
lease.it.commercial.guarantor.summary=Facultatieve persoonlijke, bank- of verzekeringsgarantie tot een maximumbedrag; verlenging na de eerste vervaldatum alleen indien overeengekomen.
lease.it.commercial.data-protection.title=Gegevensbescherming
lease.it.commercial.data-protection.summary=Persoonsgegevens van de personen die voor de partijen optreden, alleen verwerkt voor de huur, volgens de AVG en het Italiaanse privacywetboek.
lease.it.commercial.disputes.title=Geschillen
lease.it.commercial.disputes.summary=Italiaans recht; rechter van de plaats van het gehuurde; bemiddeling verplicht vóór de meeste huurvorderingen.
