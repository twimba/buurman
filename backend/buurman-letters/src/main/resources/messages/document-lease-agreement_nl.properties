lease.cz.residential.parties.title=Partijen
lease.cz.residential.parties.summary=Verhuurder en huurder, de Tsjechische bepalingen over de huur van een woning, de schriftelijke vorm, de uitsluitend Engelse tekst en de voorgaande versie als ook een Tsjechische versie wordt ondertekend.
lease.cz.residential.premises.title=Gehuurde
lease.cz.residential.premises.summary=De woning verhuurd voor de woonbehoefte van de huurder, de gegevens uit het kadaster en de meeverhuurde ruimten en inrichting.
lease.cz.residential.term.title=Duur
lease.cz.residential.term.summary=Bepaalde of onbepaalde tijd en de verlenging van een bepaalde duur als de huurder 3 maanden blijft zonder schriftelijk verzoek tot vertrek.
lease.cz.residential.rent.title=Huurprijs
lease.cz.residential.rent.summary=Maandelijkse huurprijs als vast bedrag, los van de betalingen voor diensten.
lease.cz.residential.rent-adjustment.title=Huuraanpassing
lease.cz.residential.rent-adjustment.summary=Overeengekomen jaarlijkse verhoging, of het wettelijke voorstel tot de vergelijkbare gebruikelijke huur, met een maximum van 20 % in 3 jaar.
lease.cz.residential.service-costs.title=Diensten
lease.cz.residential.service-costs.summary=Diensten van de verhuurder, maandelijkse voorschotten en de jaarafrekening volgens wet nr. 67/2013 Sb.
lease.cz.residential.deposit.title=Waarborgsom
lease.cz.residential.deposit.summary=Facultatieve waarborgsom die samen met eventuele contractuele boetes niet meer dan 3 maal de maandhuur mag bedragen; terugbetaald met rente.
lease.cz.residential.payment.title=Betaling
lease.cz.residential.payment.summary=Huur en voorschotten maandelijks vooruit, uiterlijk op de 5e dag tenzij een latere dag is overeengekomen, en vertragingsrente.
lease.cz.residential.use.title=Gebruik van de woning
lease.cz.residential.use.summary=Behoorlijk gebruik, werken in de woning, huisdieren, nieuwe gezinsleden en melding van lange afwezigheid.
lease.cz.residential.subletting.title=Onderverhuur
lease.cz.residential.subletting.summary=Onderverhuur van een deel van de woning als de huurder er woont; anders alleen met schriftelijke toestemming van de verhuurder, die na 1 maand zonder antwoord als gegeven geldt.
lease.cz.residential.maintenance.title=Onderhoud en herstellingen
lease.cz.residential.maintenance.summary=De verhuurder houdt de woning geschikt voor gebruik; de huurder betaalt het gewone onderhoud en kleine herstellingen binnen de wettelijke grenzen.
lease.cz.residential.energy-certificate.title=Energieprestatiecertificaat
lease.cz.residential.energy-certificate.summary=Energieprestatiecertificaat getoond vóór de ondertekening en uiterlijk bij de ondertekening overhandigd.
lease.cz.residential.handover-inspection.title=Oplevering en teruggave
lease.cz.residential.handover-inspection.summary=Proces-verbaal van oplevering bij het begin en teruggave in de ontvangen staat, rekening houdend met normale slijtage.
lease.cz.residential.succession.title=Overlijden van de huurder
lease.cz.residential.succession.summary=Overgang van de huur op gezinsleden of erfgenamen bij overlijden van de huurder, met de wettelijke grenzen.
lease.cz.residential.termination.title=Beëindiging
lease.cz.residential.termination.summary=Schriftelijke opzegging, de opzegtermijn van 3 maanden voor de huurder bij onbepaalde tijd, de wettelijke gronden van de verhuurder en toetsing door de rechter.
lease.cz.residential.notices.title=Kennisgevingen
lease.cz.residential.notices.summary=Schriftelijke kennisgevingen aan de vermelde adressen en facultatieve bezorging via datové schránky (databoxen).
lease.cz.residential.data-protection.title=Gegevensbescherming
lease.cz.residential.data-protection.summary=Verwerking van persoonsgegevens volgens de AVG en de Tsjechische wet op de gegevensbescherming.
lease.cz.residential.disputes.title=Toepasselijk recht en geschillen
lease.cz.residential.disputes.summary=Tsjechisch recht en de Tsjechische rechter.
lease.cz.commercial.parties.title=Partijen
lease.cz.commercial.parties.summary=Verhuurder en huurder met identificatienummers, de bepalingen over bedrijfsruimte, de uitsluitend Engelse tekst en de voorgaande versie als ook een Tsjechische versie wordt ondertekend.
lease.cz.commercial.premises.title=Gehuurde
lease.cz.commercial.premises.summary=De bedrijfsruimte, de gegevens uit het kadaster en de meeverhuurde rechten.
lease.cz.commercial.permitted-use.title=Bestemming
lease.cz.commercial.permitted-use.summary=De overeengekomen bedrijfsactiviteit, de grenzen aan wijziging ervan en uithangborden aan het gebouw.
lease.cz.commercial.term.title=Duur
lease.cz.commercial.term.summary=Bepaalde of onbepaalde tijd en de verlenging van een bepaalde duur als de huurder blijft, tenzij uitgesloten.
lease.cz.commercial.rent.title=Huurprijs
lease.cz.commercial.rent.summary=Maandelijkse huurprijs, los van de betalingen voor diensten.
lease.cz.commercial.rent-adjustment.title=Huuraanpassing
lease.cz.commercial.rent-adjustment.summary=Jaarlijkse indexering volgens de consumentenprijsindex of een ander overeengekomen mechanisme; de regels voor woningen gelden niet.
lease.cz.commercial.service-costs.title=Diensten
lease.cz.commercial.service-costs.summary=Diensten van de verhuurder, maandelijkse voorschotten en hun afrekening.
lease.cz.commercial.vat.title=Btw
lease.cz.commercial.vat.summary=De huur is vrijgesteld van btw, tenzij de verhuurder voor belasting kiest bij verhuur aan een andere btw-plichtige.
lease.cz.commercial.deposit.title=Waarborgsom
lease.cz.commercial.deposit.summary=Waarborgsom of bankgarantie van het overeengekomen bedrag, zonder wettelijk maximum, aan het einde terugbetaald na aftrek van verschuldigde bedragen.
lease.cz.commercial.payment.title=Betaling
lease.cz.commercial.payment.summary=Huur en voorschotten maandelijks vooruit, en vertragingsrente.
lease.cz.commercial.maintenance.title=Onderhoud en herstellingen
lease.cz.commercial.maintenance.summary=Gewoon onderhoud door de huurder, ander onderhoud en noodzakelijke herstellingen door de verhuurder, gebreken en toegang.
lease.cz.commercial.alterations.title=Veranderingen en inrichting
lease.cz.commercial.alterations.summary=Veranderingen alleen met voorafgaande schriftelijke toestemming van de verhuurder, verrekening van waardestijging en herstel.
lease.cz.commercial.subletting.title=Onderverhuur
lease.cz.commercial.subletting.summary=Onderverhuur alleen met schriftelijke toestemming van de verhuurder; onderverhuur zonder toestemming is een grove tekortkoming.
lease.cz.commercial.assignment.title=Overdracht van de huur
lease.cz.commercial.assignment.summary=Overdracht van de huur samen met de bedrijfsactiviteit, met voorafgaande schriftelijke toestemming van de verhuurder.
lease.cz.commercial.insurance.title=Verzekering
lease.cz.commercial.insurance.summary=Opstalverzekering door de verhuurder; de huurder verzekert inrichting en voorraad en heeft een aansprakelijkheidsverzekering.
lease.cz.commercial.energy-certificate.title=Energieprestatiecertificaat
lease.cz.commercial.energy-certificate.summary=Energieprestatiecertificaat getoond vóór de ondertekening en uiterlijk bij de ondertekening overhandigd.
lease.cz.commercial.goodwill-compensation.title=Vergoeding voor het klantenbestand
lease.cz.commercial.goodwill-compensation.summary=Vergoeding voor het overgenomen klantenbestand bij opzegging door de verhuurder, behalve na een grove tekortkoming.
lease.cz.commercial.handover-inspection.title=Oplevering en teruggave
lease.cz.commercial.handover-inspection.summary=Proces-verbaal van oplevering bij het begin en teruggave van de ontruimde ruimte in de ontvangen staat.
lease.cz.commercial.termination.title=Beëindiging
lease.cz.commercial.termination.summary=Wettelijke gronden en opzegtermijn van 3 maanden bij bepaalde duur, 6 of 3 maanden bij onbepaalde duur, bezwaren en rechterlijke toetsing.
lease.cz.commercial.notices.title=Kennisgevingen
lease.cz.commercial.notices.summary=Schriftelijke kennisgevingen aan de statutaire zetels of via datové schránky (databoxen).
lease.cz.commercial.data-protection.title=Gegevensbescherming
lease.cz.commercial.data-protection.summary=Verwerking van persoonsgegevens van vertegenwoordigers en contactpersonen volgens de AVG.
lease.cz.commercial.disputes.title=Toepasselijk recht en geschillen
lease.cz.commercial.disputes.summary=Tsjechisch recht en de Tsjechische rechter.
# ===== end CZ =====


# ===== DK lease clause titles and summaries (country pack) =====
lease.dk.residential.parties.title=Partijen
lease.dk.residential.parties.summary=Vermeldt de verhuurder en de huurder(s); medehuurders zijn hoofdelijk aansprakelijk.
lease.dk.residential.premises.title=Het gehuurde
lease.dk.residential.premises.summary=De verhuurde woning, de toepassing van de Deense huurwet en de vermelding dat dit niet het erkende standaardformulier (typeformular A) is.
lease.dk.residential.term.title=Duur
lease.dk.residential.term.summary=Ingangsdatum; huur voor onbepaalde tijd, of voor bepaalde tijd die zonder opzegging eindigt en door omstandigheden van de verhuurder gerechtvaardigd moet zijn.
lease.dk.residential.rent.title=Huurprijs
lease.dk.residential.rent.summary=De huurprijs en de toepasselijke huurprijsregels (kostprijsgebaseerde huur, waarde van het gehuurde of vrij overeengekomen huur).
lease.dk.residential.rent-adjustment.title=Huuraanpassing
lease.dk.residential.rent-adjustment.summary=Jaarlijkse aanpassing aan het nettoprijsindexcijfer waar de wet dat toestaat, en wettelijke huurverhogingen.
lease.dk.residential.service-costs.title=Verbruikskosten
lease.dk.residential.service-costs.summary=Voorschotten voor verwarming, water en ander door de verhuurder geleverd verbruik, met een jaarlijkse verbruiksafrekening.
lease.dk.residential.deposit.title=Waarborgsom en vooruitbetaalde huur
lease.dk.residential.deposit.summary=Waarborgsom van ten hoogste 3 maanden huur en vooruitbetaalde huur van ten hoogste 3 maanden, aangepast bij huurwijzigingen.
lease.dk.residential.payment.title=Betaling
lease.dk.residential.payment.summary=Huur maandelijks vooruit te betalen op de bankrekening van de verhuurder; nooit meer dan 3 maanden tegelijk.
lease.dk.residential.use.title=Gebruik
lease.dk.residential.use.summary=Uitsluitend gebruik als woning, zorgvuldige behandeling van de woning en naleving van het huishoudelijk reglement.
lease.dk.residential.subletting.title=Onderverhuur
lease.dk.residential.subletting.summary=Gebruik door anderen alleen met toestemming; het wettelijke recht van de huurder om een deel van de woning, of de hele woning tot 2 jaar, onder te verhuren.
lease.dk.residential.maintenance.title=Onderhoud
lease.dk.residential.maintenance.summary=De verhuurder onderhoudt het gebouw en de woning; de huurder onderhoudt sloten en sleutels en meldt schade.
lease.dk.residential.energy-label.title=Energielabel
lease.dk.residential.energy-label.summary=De verhuurder overhandigt het energielabel vóór het sluiten van de overeenkomst, tenzij een uitzondering geldt.
lease.dk.residential.handover-inspection.title=In- en uittrekken
lease.dk.residential.handover-inspection.summary=Staat bij oplevering, inspecties bij in- en uittrekken met rapporten, termijnen voor vorderingen en teruggave van de woning.
lease.dk.residential.termination.title=Opzegging en ontbinding
lease.dk.residential.termination.summary=Opzegging door de huurder met 3 maanden, opzegging door de verhuurder alleen op wettelijke gronden, en ontbinding na schriftelijke aanmaning.
lease.dk.residential.data-protection.title=Gegevensbescherming
lease.dk.residential.data-protection.summary=Verwerking van persoonsgegevens van de huurder overeenkomstig de AVG.
lease.dk.residential.disputes.title=Toepasselijk recht en geschillen
lease.dk.residential.disputes.summary=Deens recht; de huurcommissie en de huurrechter beslechten geschillen.
lease.dk.commercial.parties.title=Partijen
lease.dk.commercial.parties.summary=Vermeldt verhuurder en huurder met hun ondernemingsnummers (CVR) en vertegenwoordigers.
lease.dk.commercial.premises.title=Het gehuurde
lease.dk.commercial.premises.summary=De verhuurde bedrijfsruimte, de oppervlakte en de toepassing van de Deense wet op de huur van bedrijfsruimte.
lease.dk.commercial.permitted-use.title=Bestemming
lease.dk.commercial.permitted-use.summary=Het overeengekomen bedrijfsdoel, vergunningen, reclameborden en de plicht een winkel open te houden.
lease.dk.commercial.term.title=Duur
lease.dk.commercial.term.summary=Ingangsdatum; huur voor onbepaalde tijd met eventuele periodes van onopzegbaarheid, of voor bepaalde tijd.
lease.dk.commercial.rent.title=Huurprijs
lease.dk.commercial.rent.summary=De vrij overeengekomen huurprijs en de basisdatum voor latere aanpassingen voor belastingen en heffingen.
lease.dk.commercial.rent-adjustment.title=Huuraanpassing
lease.dk.commercial.rent-adjustment.summary=Jaarlijkse aanpassing aan het nettoprijsindexcijfer, verhogingen voor belastingen en heffingen en aanpassing aan de markthuur.
lease.dk.commercial.service-costs.title=Exploitatie- en verbruikskosten
lease.dk.commercial.service-costs.summary=Kostensoorten die naast de huur worden betaald, met geraamde bedragen, en de verbruiksafrekening.
lease.dk.commercial.vat.title=Btw
lease.dk.commercial.vat.summary=Verhuur is vrijgesteld van btw; btw wordt toegevoegd als de verhuurder zich vrijwillig voor de verhuur heeft geregistreerd.
lease.dk.commercial.deposit.title=Waarborgsom en vooruitbetaalde huur
lease.dk.commercial.deposit.summary=Vrij overeengekomen waarborgsom en vooruitbetaalde huur; zonder inschrijving beschermd tegen derden tot ½ jaar huur.
lease.dk.commercial.payment.title=Betaling
lease.dk.commercial.payment.summary=Huur vooruit te betalen; betaling is tijdig tot de 3e werkdag na de vervaldag.
lease.dk.commercial.maintenance.title=Onderhoud
lease.dk.commercial.maintenance.summary=De onderhoudsplicht van de verhuurder, de afgesproken verdeling van het binnenonderhoud en toegang voor werkzaamheden.
lease.dk.commercial.alterations.title=Veranderingen en installaties
lease.dk.commercial.alterations.summary=Het wettelijke recht van de huurder op gebruikelijke installaties en verbouwingen, zekerheid en herstel.
lease.dk.commercial.assignment.title=Indeplaatsstelling
lease.dk.commercial.assignment.summary=Het wettelijke recht van de huurder de huur over te dragen binnen dezelfde branche, tenzij bij overeenkomst uitgesloten.
lease.dk.commercial.subletting.title=Onderverhuur
lease.dk.commercial.subletting.summary=Gebruik door anderen alleen met toestemming van de verhuurder of een overeengekomen recht van onderverhuur.
lease.dk.commercial.energy-label.title=Energielabel
lease.dk.commercial.energy-label.summary=De verhuurder overhandigt het energielabel vóór het sluiten van de overeenkomst, tenzij een uitzondering geldt.
lease.dk.commercial.handover-inspection.title=Oplevering en teruggave
lease.dk.commercial.handover-inspection.summary=Gezamenlijke inspectie bij oplevering, melding van gebreken binnen 2 weken, teruggave en een termijn van 4 weken voor vorderingen.
lease.dk.commercial.termination.title=Opzegging en ontbinding
lease.dk.commercial.termination.summary=Opzegging met 3 maanden, opzegging door de verhuurder alleen op wettelijke gronden tegen schadevergoeding, en ontbinding na aanmaning.
lease.dk.commercial.data-protection.title=Gegevensbescherming
lease.dk.commercial.data-protection.summary=Verwerking van persoonsgegevens van de personen die voor de partijen optreden overeenkomstig de AVG.
lease.dk.commercial.disputes.title=Toepasselijk recht en geschillen
lease.dk.commercial.disputes.summary=Deens recht; de huurrechter of overeengekomen arbitrage beslecht geschillen.
