letter.disclaimer=Niniejszy dokument ma charakter informacyjny i nie stanowi prawnie wiążącej umowy. Zmiana czynszu podlega warunkom istniejącej umowy najmu oraz obowiązującym przepisom lokalnym.
legal.NL=Niniejsze przedłużenie podlega niderlandzkiemu prawu najmu (huurrecht). Strony mogą kierować spory do Huurcommissie (komisji czynszowej).
legal.DE=Niniejsza umowa przedłużenia zostaje zawarta zgodnie z §557 BGB (Mietverhöhungsvereinbarung). Zastosowanie mogą mieć obowiązujące przepisy o regulacji czynszu (Mietpreisbremse).
legal.FR=Niniejsze przedłużenie podlega francuskiemu prawu najmu. Przepisy Loi ALUR mogą mieć zastosowanie w strefach regulowanych (zones tendues). Zmiany czynszu podlegają indeksowi IRL.
legal.BE=Niniejsze przedłużenie podlega regionalnym przepisom mieszkaniowym. Indeksacja czynszu opiera się na Gezondheidsindex (indeksie zdrowia).
legal.ES=Niniejsze przedłużenie podlega LAU (Ley de Arrendamientos Urbanos). Zastosowanie mogą mieć przepisy art. 9-10 o minimalnym okresie najmu.
legal.PT=Niniejsze przedłużenie podlega NRAU (Novo Regime do Arrendamento Urbano). Aktualizacje czynszu są zgodne ze współczynnikiem INE.
legal.AT=Niniejsze przedłużenie podlega austriackiemu prawu najmu (MRG). Zastosowanie może mieć system Richtwertmietzins.
legal.GB=Niniejsze przedłużenie podlega Housing Act 1988 (z późniejszymi zmianami). Przy podwyżkach czynszu zastosowanie mogą mieć wymogi zawiadomienia z Section 13.
legal.IT=Niniejsze przedłużenie podlega włoskiemu prawu najmu (Legge 431/1998). Zastosowanie mogą mieć korekty według indeksu ISTAT FOI.
legal.SE=Niniejsze przedłużenie podlega Hyreslagen. Poziomy czynszu wynikają z bruksvärdessystemet (systemu wartości użytkowej).
legal.DK=Niniejsze przedłużenie podlega Lejeloven. Regulacja czynszu zależy od wieku budynku i rodzaju najmu.
legal.IE=Niniejsze przedłużenie podlega Residential Tenancies Act 2004. Zastosowanie mogą mieć ograniczenia Rent Pressure Zone (RPZ).
legal.PL=Niniejsze przedłużenie podlega art. 6851-6852 polskiego Kodeksu cywilnego. Przy podwyżkach czynszu obowiązuje wymóg pisemnego wypowiedzenia.
legal.FI=Niniejsze przedłużenie podlega ustawie o najmie lokali mieszkalnych (481/1995). Zmiany czynszu wynikają z warunków umowy.
legal.NO=Niniejsze przedłużenie podlega Husleieloven. Korekty czynszu oparte na wskaźniku CPI stosuje się zgodnie z §4-2/§4-3.
legal.US=Niniejsze przedłużenie podlega właściwemu stanowemu i lokalnemu prawu najmu. W niektórych jurysdykcjach zastosowanie mogą mieć przepisy o regulacji czynszu.
legal.CA=Niniejsze przedłużenie podlega właściwym prowincjonalnym przepisom najmu. Zastosowanie mogą mieć roczne wytyczne dotyczące podwyżek czynszu.
legal.HU=Niniejsze przedłużenie podlega węgierskiemu Kodeksowi cywilnemu. Warunki zmiany czynszu wynikają z umowy najmu.
legal.CZ=Niniejsze przedłużenie podlega §2249 czeskiego Kodeksu cywilnego. Podwyżki do porównywalnego czynszu rynkowego są ograniczone do 20% w okresie 3 lat.
legal.CH=Niniejsze przedłużenie podlega szwajcarskiemu prawu najmu (Obligationenrecht art. 269-270). Korekty są powiązane z referencyjną stopą procentową (Referenzzinssatz).

