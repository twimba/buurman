deposit.legal.NL=Efter nederlandsk ret skal depositummet tilbagebetales inden for en rimelig frist efter lejemålets ophør; omtvistede fradrag kan indbringes for Huurcommissie eller domstolene.
deposit.legal.DE=Efter § 551 BGB skal depositummet holdes adskilt fra udlejerens formue og afregnes inden for en rimelig frist (normalt op til seks måneder) efter lejemålets ophør.
deposit.legal.FR=Efter artikel 22 i lov 89-462 skal depositummet tilbagebetales inden for én måned (to måneder ved fradrag) efter nøgleaflevering; forsinket tilbagebetaling udløser 10% af månedslejen pr. forsinkelsesmåned.
deposit.legal.BE=Depositummet er indsat på en spærret konto i lejerens navn som krævet efter det regionale boliglejedekret; frigivelse kræver begge parters samtykke eller en retsafgørelse.
deposit.legal.ES=Efter artikel 36 LAU skal depositummet tilbagebetales inden for én måned efter nøgleaflevering; herefter forrentes beløbet med lovens rente.
deposit.legal.PT=Efter den portugisiske civillovbog skal depositummet (caução) tilbagebetales ved lejemålets ophør efter afregning af eventuelle skyldige beløb.
deposit.legal.GB=Depositum ved assured shorthold tenancy i England og Wales skal beskyttes i en statsgodkendt ordning; tvister kan indbringes for ordningens gratis tvistløsningstjeneste.
deposit.legal.IT=Efter artikel 11 i lov 392/1978 må depositummet (deposito cauzionale) ikke overstige tre måneders leje og forrentes med lovens rente, der udbetales årligt til lejeren.
