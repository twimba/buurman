deposit.closing=En cas de désaccord sur une retenue, merci de nous contacter dans les 14 jours suivant la date du présent décompte.
deposit.disclaimer=Ce décompte est établi en application du bail. Les délais légaux et procédures de contestation relatifs aux dépôts de garantie varient selon la juridiction et ne sont pas affectés par ce document.
deposit.legal.NL=En droit néerlandais, le dépôt de garantie doit être restitué dans un délai raisonnable après la fin du bail ; la Huurcommissie ou les tribunaux peuvent être saisis des retenues contestées.
deposit.legal.DE=En vertu du § 551 BGB, le dépôt de garantie doit être détenu séparément du patrimoine du bailleur et soldé dans un délai raisonnable (généralement jusqu'à six mois) après la fin du bail.
deposit.legal.FR=Conformément à l’article 22 de la loi 89-462, le dépôt de garantie est restitué dans un délai d’un mois (deux mois en cas de retenues) à compter de la remise des clés ; tout retard produit une majoration de 10 % du loyer mensuel par mois de retard.
deposit.legal.BE=Le dépôt de garantie a été placé sur un compte bloqué au nom du locataire, conformément au décret régional sur le bail d'habitation ; sa libération requiert l'accord des deux parties ou une décision de justice.
deposit.legal.ES=En vertu de l'article 36 LAU, le dépôt de garantie doit être restitué dans un délai d'un mois après la remise des clés ; au-delà, la somme produit des intérêts légaux.
deposit.legal.PT=En vertu du Code civil portugais, le dépôt de garantie (caução) doit être restitué à la fin du bail après règlement des sommes éventuellement dues.
deposit.legal.GB=Les dépôts de garantie des assured shorthold tenancies en Angleterre et au pays de Galles doivent être protégés dans un dispositif agréé par l'État ; les litiges peuvent être soumis au service gratuit de règlement des différends du dispositif.
deposit.legal.IT=En vertu de l'article 11 de la loi 392/1978, le dépôt de garantie (deposito cauzionale) ne peut excéder trois mois de loyer et produit des intérêts légaux payables annuellement au locataire.
