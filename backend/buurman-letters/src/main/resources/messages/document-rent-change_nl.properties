# Landspecifieke juridische referenties (huurwijziging)
rentchange.legal.NL=Deze huuraanpassing valt onder het Nederlandse huurrecht (Art. 7:252-253 BW). Geschillen kunnen worden voorgelegd aan de Huurcommissie.
rentchange.legal.DE=Deze huuraanpassing is opgesteld conform \u00a7558 BGB (Mieterh\u00f6hung bis zur orts\u00fcblichen Vergleichsmiete). De Kappungsgrenze (20%/15% limiet over 3 jaar) kan van toepassing zijn.
rentchange.legal.FR=Deze huuraanpassing valt onder de IRL (Indice de R\u00e9f\u00e9rence des Loyers). Huurprijsregulering (d\u00e9cret encadrement) kan van toepassing zijn in gereguleerde zones.
rentchange.legal.BE=Deze huuraanpassing volgt de Gezondheidsindex voor de toepasselijke regio. Regionale woningcodebebepalingen zijn van toepassing.
rentchange.legal.ES=Deze huuraanpassing valt onder LAU Art. 18 (actualizaci\u00f3n de renta). Tijdelijke huurverhogingslimieten kunnen van toepassing zijn.
rentchange.legal.PT=Deze huuraanpassing volgt de INE coeficiente de atualiza\u00e7\u00e3o. NRAU Art. 24 bepalingen zijn van toepassing.
rentchange.legal.AT=Deze huuraanpassing valt onder MRG \u00a716 (angemessener Mietzins). De Richtwertmietzins of VPI/CPI referentie is van toepassing.
rentchange.legal.GB=Deze huuraanpassing valt onder de kennisgevingsvereisten van Section 13 Housing Act 1988. Markthuurvergelijking is van toepassing.
rentchange.legal.IT=Deze huuraanpassing volgt de ISTAT FOI-index. Legge 392/1978 of 431/1998 bepalingen zijn van toepassing.
rentchange.legal.SE=Deze huuraanpassing volgt het bruksv\u00e4rdessystem (gebruikswaardensysteem). Hyresg\u00e4stf\u00f6reningen onderhandelingsvereisten zijn van toepassing.
rentchange.legal.DK=Deze huuraanpassing valt onder de Lejeloven. Kostengebaseerde of marktgebaseerde regels gelden afhankelijk van de gebouwclassificatie.
rentchange.legal.IE=Deze huuraanpassing valt onder de Residential Tenancies Act 2004. RPZ 2% jaarlijkse limiet kan van toepassing zijn.
rentchange.legal.PL=Deze huuraanpassing valt onder het Burgerlijk Wetboek Art. 6851. Schriftelijke kennisgeving met 3 maanden vooraf is vereist.
rentchange.legal.FI=Deze huuraanpassing valt onder de Wet op Residenti\u00eble Huurovereenkomsten (481/1995). Contractvoorwaarden bepalen aanpassingen.
rentchange.legal.NO=Deze huuraanpassing volgt de Husleieloven \u00a74-2/\u00a74-3. CPI-aanpassingsregels zijn van toepassing.
rentchange.legal.US=Deze huuraanpassing valt onder toepasselijke staats- en lokale regelgeving. Huurprijsregulering kan van toepassing zijn in bepaalde rechtsgebieden.
rentchange.legal.CA=Deze huuraanpassing volgt toepasselijke provinciale huurwetgeving. Jaarlijkse richtlijnverhogingslimieten kunnen van toepassing zijn.
rentchange.legal.HU=Deze huuraanpassing volgt de huurbepalingen van het Hongaarse Burgerlijk Wetboek. Contractvoorwaarden bepalen aanpassingen.
rentchange.legal.CZ=Deze huuraanpassing valt onder het Burgerlijk Wetboek \u00a72249. Verhogingen tot vergelijkbare huur zijn beperkt tot 20% over 3 jaar.
rentchange.legal.CH=Deze huuraanpassing valt onder het Obligationenrecht Art. 269a. Aanpassingen zijn gekoppeld aan de referentierente (Referenzzinssatz).
