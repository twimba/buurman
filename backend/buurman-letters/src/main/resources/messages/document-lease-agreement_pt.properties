# ===== DK lease clause titles and summaries (country pack) =====
lease.dk.residential.parties.title=Partes
lease.dk.residential.parties.summary=Identifica o senhorio e o(s) arrendatário(s); os coarrendatários respondem solidariamente.
lease.dk.residential.premises.title=Locado
lease.dk.residential.premises.summary=A habitação arrendada, a aplicação da lei dinamarquesa do arrendamento e a indicação de que este não é o formulário-tipo autorizado (typeformular A).
lease.dk.residential.term.title=Duração
lease.dk.residential.term.summary=Data de início; arrendamento sem termo, ou com prazo certo que termina sem denúncia e deve ser justificado pela situação do senhorio.
lease.dk.residential.rent.title=Renda
lease.dk.residential.rent.summary=A renda e as regras aplicáveis (renda baseada nos custos, valor locativo do locado ou renda livremente acordada).
