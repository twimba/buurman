lease.dk.residential.rent-adjustment.summary=Atualização anual pelo índice de preços líquidos quando a lei o permite, e aumentos de renda legais.
lease.dk.residential.service-costs.title=Custos de consumo
lease.dk.residential.service-costs.summary=Pagamentos por conta para aquecimento, água e outros consumos fornecidos pelo senhorio, com acerto anual de consumos.
lease.dk.residential.deposit.title=Caução e renda antecipada
lease.dk.residential.deposit.summary=Caução de no máximo 3 meses de renda e renda antecipada de no máximo 3 meses, ajustadas quando a renda muda.
lease.dk.residential.payment.title=Pagamento
lease.dk.residential.payment.summary=Renda paga mensalmente e antecipadamente na conta bancária do senhorio; nunca mais de 3 meses de cada vez.
lease.dk.residential.use.title=Uso do locado
lease.dk.residential.use.summary=Uso exclusivo para habitação, utilização prudente da habitação e cumprimento das regras do prédio.
lease.dk.residential.subletting.title=Subarrendamento
lease.dk.residential.subletting.summary=Uso por terceiros apenas com consentimento; direito legal do arrendatário de subarrendar parte da habitação, ou toda a habitação até 2 anos.
lease.dk.residential.maintenance.title=Conservação
lease.dk.residential.maintenance.summary=O senhorio conserva o prédio e a habitação; o arrendatário conserva fechaduras e chaves e comunica os danos.
lease.dk.residential.energy-label.title=Certificado energético
lease.dk.residential.energy-label.summary=O senhorio entrega a etiqueta energética antes da celebração do contrato, salvo isenção.
lease.dk.residential.handover-inspection.title=Entrada e saída
lease.dk.residential.handover-inspection.summary=Estado na entrega, vistorias de entrada e de saída com relatórios, prazos para reclamações e restituição da habitação.
lease.dk.residential.termination.title=Denúncia e resolução
lease.dk.residential.termination.summary=Denúncia pelo arrendatário com 3 meses, denúncia pelo senhorio só por fundamentos legais e resolução após interpelação escrita.
lease.dk.residential.data-protection.title=Proteção de dados
lease.dk.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário nos termos do RGPD.
lease.dk.residential.disputes.title=Lei aplicável e litígios
lease.dk.residential.disputes.summary=Lei dinamarquesa; a comissão de rendas e o tribunal da habitação decidem os litígios.
lease.dk.commercial.parties.title=Partes
lease.dk.commercial.parties.summary=Identifica o senhorio e o arrendatário com os números de registo de empresa (CVR) e os representantes.
lease.dk.commercial.premises.title=Locado
lease.dk.commercial.premises.summary=O espaço comercial arrendado, a sua área e a aplicação da lei dinamarquesa do arrendamento comercial.
lease.dk.commercial.permitted-use.title=Fim do arrendamento
lease.dk.commercial.permitted-use.summary=A atividade acordada, as licenças, a sinalética e o dever de manter uma loja aberta.
lease.dk.commercial.term.title=Duração
lease.dk.commercial.term.summary=Data de início; arrendamento sem termo com eventuais períodos sem denúncia, ou com prazo certo.
lease.dk.commercial.rent.title=Renda
lease.dk.commercial.rent.summary=A renda livremente acordada e a data de referência para ajustes posteriores por impostos e taxas.
lease.dk.commercial.rent-adjustment.title=Atualização da renda
lease.dk.commercial.rent-adjustment.summary=Atualização anual pelo índice de preços líquidos, aumentos por impostos e taxas e ajustamento à renda de mercado.
lease.dk.commercial.service-costs.title=Encargos e custos de consumo
lease.dk.commercial.service-costs.summary=Tipos de encargos pagos além da renda com valores estimados, e o acerto de consumos.
lease.dk.commercial.vat.title=IVA
lease.dk.commercial.vat.summary=O arrendamento está isento de IVA; acresce IVA se o senhorio estiver voluntariamente registado para o arrendamento.
lease.dk.commercial.deposit.title=Caução e renda antecipada
lease.dk.commercial.deposit.summary=Caução e renda antecipada livremente acordadas; oponíveis a terceiros sem registo até ½ ano de renda.
lease.dk.commercial.payment.title=Pagamento
lease.dk.commercial.payment.summary=Renda paga antecipadamente; o pagamento é tempestivo até ao 3.º dia útil após o vencimento.
lease.dk.commercial.maintenance.title=Conservação
lease.dk.commercial.maintenance.summary=Os deveres de conservação do senhorio, a repartição acordada da conservação interior e o acesso para obras.
lease.dk.commercial.alterations.title=Obras e instalações
lease.dk.commercial.alterations.summary=Direito legal do arrendatário a instalações e adaptações usuais, garantia e reposição.
lease.dk.commercial.assignment.title=Cessão da posição
lease.dk.commercial.assignment.summary=Direito legal do arrendatário de ceder o arrendamento dentro do mesmo ramo, salvo exclusão por acordo.
lease.dk.commercial.subletting.title=Subarrendamento
lease.dk.commercial.subletting.summary=Uso por terceiros apenas com consentimento do senhorio ou um direito de subarrendar acordado.
lease.dk.commercial.energy-label.title=Certificado energético
lease.dk.commercial.energy-label.summary=O senhorio entrega a etiqueta energética antes da celebração do contrato, salvo isenção.
lease.dk.commercial.handover-inspection.title=Entrega e restituição
lease.dk.commercial.handover-inspection.summary=Vistoria conjunta na entrega, comunicação de defeitos em 2 semanas, restituição e prazo de 4 semanas para reclamações.
lease.dk.commercial.termination.title=Denúncia e resolução
lease.dk.commercial.termination.summary=Pré-aviso de 3 meses, denúncia pelo senhorio só por fundamentos legais e mediante indemnização, e resolução após interpelação.
lease.dk.commercial.data-protection.title=Proteção de dados
lease.dk.commercial.data-protection.summary=Tratamento dos dados pessoais das pessoas que atuam pelas partes nos termos do RGPD.
lease.dk.commercial.disputes.title=Lei aplicável e litígios
lease.dk.commercial.disputes.summary=Lei dinamarquesa; o tribunal da habitação ou a arbitragem acordada decide os litígios.
