lease.pl.residential.rent-adjustment.summary=Aumento por denúncia escrita com antecedência de 3 meses para o fim de um mês, justificação acima de 3 % do valor de reconstrução, direito do arrendatário a recusar ou contestar, no máximo de 6 em 6 meses.
lease.pl.residential.service-costs.title=Encargos independentes do proprietário
lease.pl.residential.service-costs.summary=Além da renda, apenas encargos de energia, gás, água, águas residuais e resíduos, e só quando o arrendatário não tem contrato direto de fornecimento.
lease.pl.residential.deposit.title=Caução
lease.pl.residential.deposit.summary=Caução facultativa de no máximo 12 vezes a renda mensal, restituída atualizada no prazo de 1 mês após a desocupação.
lease.pl.residential.payment.title=Pagamento
lease.pl.residential.payment.summary=Pagamento antecipado no dia acordado, juros legais de mora e responsabilidade solidária dos membros adultos do agregado.
lease.pl.residential.use.title=Uso
lease.pl.residential.use.summary=Uso habitacional, regulamento do prédio, proibição de alterações contrárias ao contrato e instalação de equipamentos.
lease.pl.residential.subletting.title=Subarrendamento
lease.pl.residential.subletting.summary=Subarrendamento ou comodato só com autorização escrita do senhorio; denúncia em caso de subarrendamento não autorizado.
lease.pl.residential.maintenance.title=Conservação e reparações
lease.pl.residential.maintenance.summary=Repartição legal das reparações entre senhorio e arrendatário, pequenas despesas, benfeitorias e acesso para inspeções.
lease.pl.residential.energy-certificate.title=Certificado energético
lease.pl.residential.energy-certificate.summary=É entregue uma cópia do certificado de desempenho energético na celebração; o arrendatário não pode renunciar a ela.
lease.pl.residential.handover-inspection.title=Entrega e restituição
lease.pl.residential.handover-inspection.summary=Auto de estado e desgaste, restituição sem deterioração e renovação do locado no fim do arrendamento.
lease.pl.residential.succession.title=Morte do arrendatário
lease.pl.residential.succession.summary=O cônjuge, os filhos, as pessoas com direito a alimentos e o companheiro que viviam permanentemente com o arrendatário sucedem no arrendamento.
lease.pl.residential.termination.title=Cessação
lease.pl.residential.termination.summary=Denúncia pelo senhorio só por fundamentos legais e por escrito, prazos de pré-aviso do arrendatário e denúncia imediata por defeitos graves.
lease.pl.residential.notices.title=Comunicações
lease.pl.residential.notices.summary=Forma escrita das denúncias, moradas para comunicações e dever de comunicar a mudança de morada.
lease.pl.residential.data-protection.title=Proteção de dados
lease.pl.residential.data-protection.summary=Tratamento de dados pessoais nos termos do RGPD e direitos dos titulares dos dados.
lease.pl.residential.disputes.title=Lei aplicável e litígios
lease.pl.residential.disputes.summary=Lei polaca, tribunal comum competente e nulidade das cláusulas contrárias à lei.
lease.pl.commercial.parties.title=Partes
lease.pl.commercial.parties.summary=Identifica o senhorio e o arrendatário com os números de registo (KRS ou CEIDG, NIP, REGON) e representantes.
lease.pl.commercial.premises.title=Locado
lease.pl.commercial.premises.summary=Descreve o espaço comercial, a área, as partes comuns e o título do senhorio.
lease.pl.commercial.permitted-use.title=Fim do arrendamento
lease.pl.commercial.permitted-use.summary=Atividade exercida no locado; licenças e registos a expensas do arrendatário.
lease.pl.commercial.term.title=Duração
