# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Partes
lease.de.residential.parties.summary=Identifica o senhorio e o ou os arrendatários; os coarrendatários respondem solidariamente.
lease.de.residential.premises.title=Locado
lease.de.residential.premises.summary=Descreve a habitação arrendada e aplica o direito alemão do arrendamento habitacional (BGB).
lease.de.residential.term.title=Duração
lease.de.residential.term.summary=Data de início; prazo indeterminado, ou prazo certo apenas com um fundamento legal comunicado por escrito.
lease.de.residential.rent.title=Renda
lease.de.residential.rent.summary=A renda sem encargos e o limite da renda inicial em zonas de mercado habitacional pressionado.
lease.de.residential.rent-adjustment.title=Aumento da renda
lease.de.residential.rent-adjustment.summary=Aumentos legais até à renda comparativa local, dentro do limite máximo.
lease.de.residential.service-costs.title=Despesas de funcionamento
lease.de.residential.service-costs.summary=Adiantamentos por conta das despesas com acerto anual dentro do prazo legal.
lease.de.residential.deposit.title=Caução
lease.de.residential.deposit.summary=Caução de no máximo 3 meses de renda sem encargos, pagável em prestações e depositada separadamente.
lease.de.residential.payment.title=Pagamento
lease.de.residential.payment.summary=A renda é paga antecipadamente, o mais tardar no 3.º dia útil de cada período.
lease.de.residential.use.title=Uso
lease.de.residential.use.summary=Uso exclusivamente habitacional, uso cuidadoso e alterações apenas com o consentimento do senhorio.
lease.de.residential.subletting.title=Subarrendamento
lease.de.residential.subletting.summary=Uso por terceiros só com autorização; direito legal do arrendatário a subarrendar parte da habitação.
lease.de.residential.maintenance.title=Conservação e defeitos
lease.de.residential.maintenance.summary=O senhorio conserva a habitação; redução da renda por defeitos; sem reparações estéticas a cargo do arrendatário.
lease.de.residential.minor-repairs.title=Pequenas reparações
lease.de.residential.minor-repairs.summary=O arrendatário suporta o custo de pequenas reparações até um montante por caso e por ano a preencher.
lease.de.residential.energy-certificate.title=Certificado energético
lease.de.residential.energy-certificate.summary=O senhorio apresenta e entrega o certificado de desempenho energético (GModG).
lease.de.residential.registration.title=Confirmação de residência
lease.de.residential.registration.summary=O senhorio confirma a entrada para que o arrendatário se possa registar junto da autoridade.
lease.de.residential.handover-inspection.title=Entrega e restituição
lease.de.residential.handover-inspection.summary=Autos de entrega e de restituição, devolução da habitação e prazo de prescrição de 6 meses.
lease.de.residential.termination.title=Denúncia
lease.de.residential.termination.summary=Denúncia por escrito, prazos legais de pré-aviso e interesse legítimo exigido ao senhorio.
lease.de.residential.data-protection.title=Proteção de dados
lease.de.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário em conformidade com o RGPD.
lease.de.residential.disputes.title=Litígios
lease.de.residential.disputes.summary=Aplica-se o direito alemão; o tribunal local (Amtsgericht) da situação da habitação tem competência exclusiva.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Partes
lease.de.commercial.parties.summary=Identifica o senhorio e o arrendatário com número de registo, número de IVA e representantes.
lease.de.commercial.premises.title=Locado
lease.de.commercial.premises.summary=Descreve o espaço comercial e aplica as regras do BGB sobre o arrendamento de espaços comerciais.
lease.de.commercial.permitted-use.title=Fim do arrendamento
lease.de.commercial.permitted-use.summary=A atividade acordada; alterações exigem consentimento; o arrendatário obtém as licenças.
lease.de.commercial.term.title=Duração
lease.de.commercial.term.summary=Prazo certo ou indeterminado; acima de 1 ano exige forma de texto, senão vale por tempo indeterminado.
lease.de.commercial.rent.title=Renda
lease.de.commercial.rent.summary=A renda sem encargos livremente acordada, acrescida de IVA e adiantamentos quando acordado.
lease.de.commercial.rent-adjustment.title=Atualização da renda
lease.de.commercial.rent-adjustment.summary=Cláusula de indexação ao índice de preços no consumidor, admitida só em contratos de longa duração (PrKG).
lease.de.commercial.service-costs.title=Despesas de funcionamento
lease.de.commercial.service-costs.summary=Despesas segundo a BetrKV e rubricas adicionais enumeradas, com adiantamentos e acerto anual.
lease.de.commercial.vat.title=Opção pelo IVA
lease.de.commercial.vat.summary=O senhorio opta pelo IVA sobre a renda; o arrendatário usa o locado só para operações com direito à dedução.
lease.de.commercial.deposit.title=Garantia
lease.de.commercial.deposit.summary=Caução em dinheiro ou garantia bancária, sem limite legal para espaços comerciais.
lease.de.commercial.payment.title=Pagamento
lease.de.commercial.payment.summary=Renda paga antecipadamente até ao 3.º dia útil; limites à compensação e juros de mora comerciais.
lease.de.commercial.maintenance.title=Conservação e reparações
lease.de.commercial.maintenance.summary=O senhorio conserva a estrutura e as partes comuns; o arrendatário conserva o interior.
lease.de.commercial.alterations.title=Obras e adaptações
lease.de.commercial.alterations.summary=Obras e publicidade do arrendatário só com consentimento em forma de texto; remoção no fim do contrato.
lease.de.commercial.subletting.title=Subarrendamento
lease.de.commercial.subletting.summary=Uso por terceiros só com autorização; direito especial de denúncia em caso de recusa.
lease.de.commercial.competition.title=Proteção contra a concorrência
lease.de.commercial.competition.summary=O senhorio não arrenda a um concorrente com a mesma gama principal.
lease.de.commercial.insurance.title=Seguros
lease.de.commercial.insurance.summary=O senhorio segura o edifício; o arrendatário segura o recheio e tem seguro de responsabilidade civil.
lease.de.commercial.energy-certificate.title=Certificado energético
lease.de.commercial.energy-certificate.summary=O senhorio apresenta e entrega o certificado de desempenho energético (GModG).
lease.de.commercial.handover-inspection.title=Entrega e restituição
lease.de.commercial.handover-inspection.summary=Autos de entrega e de restituição, devolução do locado desocupado e prescrição de 6 meses.
lease.de.commercial.termination.title=Denúncia
lease.de.commercial.termination.summary=Denúncia até ao 3.º dia útil de um trimestre para o fim do trimestre seguinte; resolução extraordinária.
lease.de.commercial.data-protection.title=Proteção de dados
lease.de.commercial.data-protection.summary=Tratamento dos dados pessoais dos representantes e contactos em conformidade com o RGPD.
lease.de.commercial.disputes.title=Litígios
lease.de.commercial.disputes.summary=Aplica-se o direito alemão; o tribunal da situação do locado tem competência exclusiva.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Partes
lease.fr.residential.parties.summary=Identifica o senhorio e o(s) arrendatário(s); os coarrendatários respondem solidariamente dentro dos limites legais.
lease.fr.residential.premises.title=Locado
lease.fr.residential.premises.summary=Descreve a habitação não mobilada arrendada como residência principal nos termos da lei de 6 de julho de 1989 e do contrato-tipo.
lease.fr.residential.term.title=Duração
lease.fr.residential.term.summary=Data de início, duração mínima de 3 ou 6 anos conforme o senhorio e renovação tácita.
lease.fr.residential.rent.title=Renda
lease.fr.residential.rent.summary=A renda sem encargos e os limites aplicáveis em zonas de forte procura e de controlo das rendas.
lease.fr.residential.rent-adjustment.title=Atualização da renda
lease.fr.residential.rent-adjustment.summary=Atualização anual limitada pelo índice de referência das rendas (IRL); sem atualização nas classes energéticas F e G.
lease.fr.residential.service-costs.title=Encargos
lease.fr.residential.service-costs.summary=Encargos recuperáveis pagos por provisões com acerto anual e documentos justificativos.
lease.fr.residential.deposit.title=Caução
lease.fr.residential.deposit.summary=Caução de no máximo 1 mês de renda sem encargos, restituída em 1 ou 2 meses.
lease.fr.residential.payment.title=Pagamento
lease.fr.residential.payment.summary=Quando e como a renda é paga; pagamento mensal a pedido, recibos gratuitos e sem penalidades.
lease.fr.residential.use.title=Uso
lease.fr.residential.use.summary=Uso pacífico como residência principal; alterações apenas com o consentimento escrito do senhorio.
lease.fr.residential.subletting.title=Subarrendamento
lease.fr.residential.subletting.summary=Cessão e subarrendamento apenas com o consentimento escrito do senhorio, incluindo quanto à renda.
lease.fr.residential.maintenance.title=Manutenção e reparações
lease.fr.residential.maintenance.summary=Deveres do senhorio quanto à habitabilidade e reparações, manutenção corrente pelo arrendatário e acesso para obras.
lease.fr.residential.works.title=Obras
lease.fr.residential.works.summary=Obras realizadas desde o último contrato e obras de melhoria acordadas com eventual aumento da renda.
lease.fr.residential.diagnostics.title=Diagnósticos técnicos
lease.fr.residential.diagnostics.summary=Dossiê de diagnóstico técnico anexo ao contrato, classe energética e desempenho energético mínimo.
lease.fr.residential.insurance.title=Seguro
lease.fr.residential.insurance.summary=O arrendatário segura os riscos locativos e apresenta prova anualmente, a pedido.
lease.fr.residential.handover-inspection.title=Vistoria
lease.fr.residential.handover-inspection.summary=Autos de vistoria de entrada e de saída elaborados em conjunto ou por agente judicial.
lease.fr.residential.termination.title=Cessação
lease.fr.residential.termination.summary=Denúncia pelo arrendatário (3 ou 1 mês) e pelo senhorio (6 meses, fundamentos legais); cláusula resolutiva.
lease.fr.residential.annexes.title=Anexos
lease.fr.residential.annexes.summary=Anexos obrigatórios: nota informativa, dossiê de diagnóstico, auto de vistoria e extratos do regulamento do condomínio.
lease.fr.residential.data-protection.title=Proteção de dados
lease.fr.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário em conformidade com o RGPD.
lease.fr.residential.disputes.title=Litígios
lease.fr.residential.disputes.summary=Aplica-se o direito francês; comissão de conciliação e juiz do contencioso de proteção.
