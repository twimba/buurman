# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Partes
lease.gb.residential.parties.summary=Identifica o senhorio e o(s) arrendatário(s); os coarrendatários respondem solidariamente; no País de Gales o arrendatário é o contract-holder.
lease.gb.residential.premises.title=Locado
lease.gb.residential.premises.summary=Descreve a habitação arrendada e o regime da nação: assured tenancy (Inglaterra), standard occupation contract (País de Gales), private residential tenancy (Escócia) ou private tenancy (Irlanda do Norte).
lease.gb.residential.term.title=Duração
lease.gb.residential.term.summary=Data de início; arrendamento periódico sem prazo certo em Inglaterra e na Escócia, periódico ou com prazo certo no País de Gales e na Irlanda do Norte.
lease.gb.residential.rent.title=Renda
lease.gb.residential.rent.summary=A renda e o período de renda; em Inglaterra o período de renda não pode exceder 1 mês.
lease.gb.residential.rent-adjustment.title=Aumentos de renda
lease.gb.residential.rent-adjustment.summary=Aumento apenas nos casos previstos na lei: em Inglaterra por aviso ao abrigo da section 13 ou decisão do tribunal; 2 meses em Inglaterra e no País de Gales, 3 meses na Escócia e na Irlanda do Norte, no máximo 1 aumento por ano.
lease.gb.residential.service-costs.title=Consumos e imposto municipal
