lease.gb.residential.deposit.title=Caução
lease.gb.residential.deposit.summary=Caução protegida num sistema aprovado; limitada a 5 ou 6 semanas de renda em Inglaterra, 2 meses de renda na Escócia e 1 mês de renda na Irlanda do Norte.
lease.gb.residential.payment.title=Pagamento
lease.gb.residential.payment.summary=Data e forma de pagamento; em Inglaterra nenhuma renda antes do período de renda e juros de mora limitados a 3% acima da taxa de referência.
lease.gb.residential.fees.title=Taxas e pagamentos permitidos
lease.gb.residential.fees.summary=Só podem ser exigidos pagamentos permitidos: Tenant Fees Act 2019 em Inglaterra, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 no País de Gales.
lease.gb.residential.use.title=Uso e animais
lease.gb.residential.use.summary=Uso como habitação sem comportamento antissocial; animais com o consentimento do senhorio, que não pode ser recusado sem motivo razoável.
lease.gb.residential.subletting.title=Subarrendamento e cessão
lease.gb.residential.subletting.summary=Cessão, subarrendamento e hóspedes apenas com o consentimento do senhorio.
lease.gb.residential.maintenance.title=Reparações e habitabilidade
lease.gb.residential.maintenance.summary=Os deveres legais de reparação e habitabilidade do senhorio em cada nação; o arrendatário comunica defeitos e permite o acesso com aviso de 24 horas.
lease.gb.residential.safety.title=Segurança
lease.gb.residential.safety.summary=Inspeção de segurança do gás a cada 12 meses, inspeção elétrica pelo menos a cada 5 anos, detetores de fumo e de monóxido de carbono.
lease.gb.residential.energy-certificate.title=Certificado energético
lease.gb.residential.energy-certificate.summary=O senhorio fornece um certificado energético válido; em Inglaterra e no País de Gales a habitação deve ter pelo menos a classe E.
lease.gb.residential.registration.title=Registo e licenças
lease.gb.residential.registration.summary=Registo do senhorio no País de Gales, na Escócia e na Irlanda do Norte e qualquer licença exigida pela autoridade local.
lease.gb.residential.right-to-rent.title=Direito de arrendar
lease.gb.residential.right-to-rent.summary=Verificação do direito de residência (right to rent) dos ocupantes adultos, aplicável apenas em Inglaterra.
lease.gb.residential.statutory-information.title=Informação legal
lease.gb.residential.statutory-information.summary=A declaração escrita, as condições ou a informação que o senhorio deve prestar segundo o direito de cada nação, e um endereço para notificações.
lease.gb.residential.handover-inspection.title=Inventário e restituição
lease.gb.residential.handover-inspection.summary=Inventário e registo do estado no início; restituição da habitação no fim, ressalvado o desgaste normal.
lease.gb.residential.termination.title=Cessação
lease.gb.residential.termination.summary=O aviso do arrendatário e os fundamentos e avisos legais do senhorio em cada nação; nenhum despejo ao abrigo da section 21 em Inglaterra.
lease.gb.residential.notices.title=Notificações
lease.gb.residential.notices.summary=Notificações escritas entregues em mão, por correio ou, quando permitido, por correio eletrónico.
lease.gb.residential.data-protection.title=Proteção de dados
lease.gb.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário nos termos do UK GDPR e do Data Protection Act 2018.
lease.gb.residential.disputes.title=Lei aplicável e litígios
lease.gb.residential.disputes.summary=A lei e os tribunais da nação onde a habitação se situa.
lease.gb.commercial.parties.title=Partes
lease.gb.commercial.parties.summary=Identifica o senhorio e o arrendatário com número de registo, sede e número de IVA.
lease.gb.commercial.premises.title=Locado
lease.gb.commercial.premises.summary=Descreve as instalações comerciais, a sua área e os direitos concedidos.
lease.gb.commercial.permitted-use.title=Fim do arrendamento
lease.gb.commercial.permitted-use.summary=O uso comercial permitido; o arrendatário obtém as licenças urbanísticas e outras autorizações.
lease.gb.commercial.term.title=Duração
lease.gb.commercial.term.summary=Data de início, prazo certo ou arrendamento periódico; registo dos arrendamentos de mais de 7 anos e imposto sobre transações imobiliárias.
lease.gb.commercial.security-of-tenure.title=Proteção da ocupação
lease.gb.commercial.security-of-tenure.summary=Direitos de renovação ao abrigo do Landlord and Tenant Act 1954 (Inglaterra e País de Gales) ou da Order de 1996 (Irlanda do Norte), a sua exclusão, e a renovação tácita (tacit relocation) na Escócia.
lease.gb.commercial.rent.title=Renda
lease.gb.commercial.rent.summary=A renda, sem IVA, encargos de serviços e prémio de seguro.
lease.gb.commercial.rent-adjustment.title=Revisão da renda
lease.gb.commercial.rent-adjustment.summary=Revisão para a renda de mercado ou segundo um índice, para cima ou para baixo, com fixação por um perito independente.
lease.gb.commercial.service-costs.title=Encargos de serviços
lease.gb.commercial.service-costs.summary=Uma quota justa dos custos de serviços do edifício, com orçamento e acerto anual.
lease.gb.commercial.vat.title=IVA
lease.gb.commercial.vat.summary=Todas as quantias excluem o IVA; o IVA é devido se o senhorio tiver optado pela tributação.
lease.gb.commercial.deposit.title=Caução
lease.gb.commercial.deposit.summary=Caução depositada numa conta separada remunerada, com regras de reposição e restituição.
lease.gb.commercial.payment.title=Pagamento
lease.gb.commercial.payment.summary=Renda paga antecipadamente sem compensação, juros de mora e procedimento de cobrança de rendas comerciais em atraso em Inglaterra e no País de Gales.
lease.gb.commercial.maintenance.title=Reparações
lease.gb.commercial.maintenance.summary=Obrigação de reparação total ou interior, limitada por um eventual registo do estado do locado.
lease.gb.commercial.alterations.title=Obras
lease.gb.commercial.alterations.summary=Nenhumas obras estruturais; outras obras com consentimento; reposição no fim do arrendamento.
lease.gb.commercial.assignment.title=Cessão e subarrendamento
lease.gb.commercial.assignment.summary=Cessão e subarrendamento com consentimento que não pode ser recusado sem motivo razoável; regras de exoneração e garantia em Inglaterra e no País de Gales.
lease.gb.commercial.insurance.title=Seguro
lease.gb.commercial.insurance.summary=O senhorio segura o edifício e recupera o prémio; o arrendatário segura o recheio e a responsabilidade; suspensão da renda após um sinistro seguro.
lease.gb.commercial.energy-certificate.title=Desempenho energético
lease.gb.commercial.energy-certificate.summary=Certificado energético do locado; classe E mínima para arrendamentos não habitacionais em Inglaterra e no País de Gales.
lease.gb.commercial.break-option.title=Denúncia antecipada
lease.gb.commercial.break-option.summary=Faculdade de pôr termo ao arrendamento antecipadamente numa data fixada, com aviso e condições.
lease.gb.commercial.handover-inspection.title=Estado e restituição
lease.gb.commercial.handover-inspection.summary=Registo do estado, restituição do locado livre e devoluto e limite da indemnização por falta de reparação.
lease.gb.commercial.termination.title=Cessação e resolução
lease.gb.commercial.termination.summary=Resolução (forfeiture ou irritancy) por falta de pagamento, incumprimento ou insolvência, sujeita a aviso legal e proteção judicial.
lease.gb.commercial.notices.title=Notificações
lease.gb.commercial.notices.summary=Notificações escritas entregues em mão ou por correio registado para a sede.
lease.gb.commercial.guarantor.title=Fiador
lease.gb.commercial.guarantor.summary=Garantia das obrigações do arrendatário por um fiador.
lease.gb.commercial.data-protection.title=Proteção de dados
lease.gb.commercial.data-protection.summary=Tratamento dos dados pessoais dos representantes das partes nos termos do UK GDPR.
lease.gb.commercial.disputes.title=Lei aplicável e litígios
lease.gb.commercial.disputes.summary=A lei e os tribunais da jurisdição onde o locado se situa; divisibilidade das cláusulas.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Partes
lease.gr.residential.parties.summary=Identifica o senhorio e o arrendatário com número fiscal e dados de identificação; os coarrendatários respondem solidariamente.
lease.gr.residential.premises.title=Locado
lease.gr.residential.premises.summary=Descreve a habitação arrendada como residência principal do arrendatário, as suas dependências e o código cadastral.
lease.gr.residential.term.title=Duração
lease.gr.residential.term.summary=Prazo certo ou duração indeterminada; duração mínima legal de 3 anos para a residência principal, reduzível só por acordo notarial posterior.
lease.gr.residential.rent.title=Renda
lease.gr.residential.rent.summary=Renda livremente acordada; sem dispensa da renda por motivos relativos ao arrendatário.
lease.gr.residential.rent-adjustment.title=Atualização da renda
lease.gr.residential.rent-adjustment.summary=Atualização livremente acordada; regra legal de 75% do índice do custo de vida para prazos inferiores a 3 anos sem cláusula de atualização.
lease.gr.residential.service-costs.title=Consumos e despesas comuns
lease.gr.residential.service-costs.summary=Consumos e despesas comuns de utilização a cargo do arrendatário; impostos e despesas extraordinárias do edifício a cargo do senhorio.
lease.gr.residential.deposit.title=Caução
lease.gr.residential.deposit.summary=Caução facultativa, não compensável com a renda, restituída no final deduzidas as quantias em dívida.
lease.gr.residential.payment.title=Pagamento
lease.gr.residential.payment.summary=Data de pagamento e transferência bancária; a partir da data prevista, pagamento numa conta do senhorio comunicada à AADE.
lease.gr.residential.use.title=Uso
lease.gr.residential.use.summary=Uso cuidadoso como residência principal, regulamento do edifício e visitas do senhorio até 1 vez em cada 3 meses.
lease.gr.residential.subletting.title=Subarrendamento
lease.gr.residential.subletting.summary=Subarrendamento e arrendamento de curta duração só com consentimento escrito do senhorio; responsabilidade pelo terceiro.
lease.gr.residential.maintenance.title=Conservação e defeitos
lease.gr.residential.maintenance.summary=O senhorio mantém o locado apto para o uso; redução da renda por defeitos, despesas e dever de aviso do arrendatário.
lease.gr.residential.energy-certificate.title=Certificado de desempenho energético
lease.gr.residential.energy-certificate.summary=Certificado obrigatório mostrado e entregue ao novo arrendatário, com o seu número inscrito na declaração do arrendamento.
lease.gr.residential.registration.title=Declaração do arrendamento à AADE
lease.gr.residential.registration.summary=Declaração eletrónica do arrendamento à autoridade tributária e aceitação pelo arrendatário no prazo de 30 dias.
lease.gr.residential.sale-of-premises.title=Venda do locado
lease.gr.residential.sale-of-premises.summary=Posição do novo proprietário num arrendamento com data certa e o seu direito de denúncia nos restantes casos.
lease.gr.residential.handover-inspection.title=Entrega e restituição
lease.gr.residential.handover-inspection.summary=Auto de entrega, restituição no estado recebido, retenção do locado e prazos de prescrição de 6 meses.
lease.gr.residential.termination.title=Cessação
lease.gr.residential.termination.summary=Duração mínima, denúncia dos contratos de duração indeterminada, resolução por falta de pagamento, motivos do arrendatário, casa de morada de família e ordem de entrega.
lease.gr.residential.data-protection.title=Proteção de dados
lease.gr.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário nos termos do RGPD e da Lei 4624/2019.
lease.gr.residential.disputes.title=Lei aplicável e litígios
lease.gr.residential.disputes.summary=Lei grega e tribunal do lugar do imóvel segundo o processo especial dos litígios de arrendamento.
lease.gr.commercial.parties.title=Partes
lease.gr.commercial.parties.summary=Identifica o senhorio e o arrendatário com número fiscal, número de registo comercial e representantes legais.
lease.gr.commercial.premises.title=Locado
lease.gr.commercial.premises.summary=Descreve as instalações comerciais, as suas dependências e a sua aptidão para o uso acordado.
lease.gr.commercial.permitted-use.title=Fim do arrendamento
lease.gr.commercial.permitted-use.summary=Atividade do arrendatário, âmbito do Decreto Presidencial 34/1995, licenças e uso cuidadoso.
lease.gr.commercial.term.title=Duração
lease.gr.commercial.term.summary=Prazo certo ou duração indeterminada; duração mínima de 3 anos nos arrendamentos sujeitos ao Decreto Presidencial 34/1995 e sem indemnização legal de clientela.
lease.gr.commercial.rent.title=Renda
lease.gr.commercial.rent.summary=Renda fixada livremente pelas partes, acrescida do imposto sobre a renda.
lease.gr.commercial.rent-adjustment.title=Atualização da renda
lease.gr.commercial.rent-adjustment.summary=Atualização acordada, regras legais supletivas e limite de 3% para as atualizações em 2026.
lease.gr.commercial.service-costs.title=Consumos e despesas comuns
lease.gr.commercial.service-costs.summary=Consumos e despesas comuns a cargo do arrendatário; impostos sobre o locado a cargo do senhorio, salvo acordo em contrário.
lease.gr.commercial.vat.title=IVA e imposto digital sobre transações
lease.gr.commercial.vat.summary=IVA quando houver opção, caso contrário o imposto digital sobre transações de 3,60%, declarado pelo senhorio ou, nos casos previstos na lei, pelo arrendatário.
lease.gr.commercial.deposit.title=Caução
lease.gr.commercial.deposit.summary=Caução em dinheiro ou garantia bancária facultativa, reforçada nas atualizações da renda e restituída no final.
lease.gr.commercial.payment.title=Pagamento
lease.gr.commercial.payment.summary=Data de pagamento, transferência bancária e documentos fiscais; pagamento numa conta do senhorio comunicada à AADE quando a renda não é despesa empresarial.
lease.gr.commercial.maintenance.title=Conservação e defeitos
lease.gr.commercial.maintenance.summary=O senhorio mantém o locado apto para o uso; repartição da manutenção corrente e das reparações estruturais.
lease.gr.commercial.alterations.title=Obras de adaptação e alterações
lease.gr.commercial.alterations.summary=Obras de adaptação a cargo do arrendatário com consentimento escrito; despesas e destino das obras no final.
lease.gr.commercial.assignment.title=Cessão e subarrendamento
lease.gr.commercial.assignment.summary=Cedência do uso só nos casos permitidos por lei ou com consentimento; exceção para sociedades após 3 anos e transmissão em caso de doença ou morte.
lease.gr.commercial.insurance.title=Seguros
lease.gr.commercial.insurance.summary=Seguro do edifício pelo senhorio; seguro de equipamento, mercadorias e responsabilidade civil pelo arrendatário.
lease.gr.commercial.energy-certificate.title=Certificado de desempenho energético
lease.gr.commercial.energy-certificate.summary=Certificado obrigatório mostrado e entregue ao novo arrendatário, com o seu número inscrito na declaração do arrendamento.
lease.gr.commercial.registration.title=Declaração do arrendamento à AADE
lease.gr.commercial.registration.summary=Declaração eletrónica do arrendamento à autoridade tributária e aceitação pelo arrendatário no prazo de 30 dias.
lease.gr.commercial.sale-of-premises.title=Venda do locado
lease.gr.commercial.sale-of-premises.summary=Posição do novo proprietário num arrendamento com data certa e o seu direito de denúncia nos restantes casos.
lease.gr.commercial.handover-inspection.title=Entrega e restituição
lease.gr.commercial.handover-inspection.summary=Auto de entrega, restituição no estado recebido, retenção do locado, prazos de prescrição e visitas.
lease.gr.commercial.termination.title=Cessação
lease.gr.commercial.termination.summary=Regras de denúncia, resolução por falta de pagamento, motivos do arrendatário e ordem de entrega; denúncia antecipada só se acordada.
lease.gr.commercial.data-protection.title=Proteção de dados
lease.gr.commercial.data-protection.summary=Tratamento dos dados pessoais das pessoas que atuam pelas partes nos termos do RGPD.
lease.gr.commercial.disputes.title=Lei aplicável e litígios
lease.gr.commercial.disputes.summary=Lei grega, tribunal do lugar do imóvel e nulidade das renúncias nos termos do Decreto Presidencial 34/1995.
# ===== end GR =====


# ===== IE lease clause titles and summaries (country pack) =====
lease.ie.residential.parties.title=Partes
lease.ie.residential.parties.summary=Senhorio e arrendatário, responsabilidade solidária dos coarrendatários, mandatário e contactos do senhorio.
lease.ie.residential.premises.title=Habitação
lease.ie.residential.premises.summary=A habitação arrendada e a aplicação do Residential Tenancies Act 2004 aos arrendamentos celebrados a partir de 1 de março de 2026.
lease.ie.residential.term.title=Prazo e estabilidade
lease.ie.residential.term.summary=Data de início, prazo certo ou periódico, arrendamento Part 4 após 6 meses e períodos mínimos de 6 anos.
lease.ie.residential.rent.title=Renda
lease.ie.residential.rent.summary=Valor da renda, limite da renda de mercado e limite nacional de 2% por ano ou do aumento do CPI, se inferior.
lease.ie.residential.rent-information.title=Informação sobre a renda no início
lease.ie.residential.rent-information.summary=Renda anterior e 3 rendas comparáveis, comunicadas ao arrendatário no início e ao RTB no prazo de 1 mês.
lease.ie.residential.rent-adjustment.title=Revisão da renda
lease.ie.residential.rent-adjustment.summary=Revisão no máximo 1 vez em cada 12 meses, não nos primeiros 12 meses, com pré-aviso de 90 dias no formulário prescrito.
lease.ie.residential.service-costs.title=Consumos e encargos
lease.ie.residential.service-costs.summary=Consumos e outros encargos do arrendatário; encargos da empresa de gestão a cargo do senhorio, salvo acordo em contrário.
lease.ie.residential.deposit.title=Caução
lease.ie.residential.deposit.summary=Caução de no máximo 1 mês de renda, restituída prontamente no fim, deduzidas as rendas em atraso ou o custo dos danos.
lease.ie.residential.payment.title=Pagamento
lease.ie.residential.payment.summary=Pagamento da renda no vencimento por transferência, renda antecipada limitada a 1 mês e caderneta de rendas.
lease.ie.residential.use.title=Uso da habitação
lease.ie.residential.use.summary=Uso apenas como habitação, sem comportamento antissocial, comunicação dos ocupantes e animais só com consentimento.
lease.ie.residential.subletting.title=Cessão e subarrendamento
lease.ie.residential.subletting.summary=Cessão ou subarrendamento só com consentimento escrito; em caso de recusa, o arrendatário pode denunciar.
lease.ie.residential.maintenance.title=Reparações e manutenção
lease.ie.residential.maintenance.summary=O senhorio repara a estrutura e o interior e cumpre as normas das habitações arrendadas; o arrendatário comunica defeitos e permite o acesso.
lease.ie.residential.energy-certificate.title=Certificado energético (BER)
lease.ie.residential.energy-certificate.summary=Certificado BER da habitação disponibilizado ao arrendatário quando exigido.
lease.ie.residential.registration.title=Registo no RTB
lease.ie.residential.registration.summary=Registo do arrendamento no RTB no prazo de 1 mês após o início e após cada aniversário.
lease.ie.residential.insurance.title=Seguro
lease.ie.residential.insurance.summary=Seguro da estrutura pelo senhorio com cobertura de responsabilidade de pelo menos 250 000 EUR; o arrendatário não o pode invalidar.
lease.ie.residential.handover-inspection.title=Inventário e entrega
lease.ie.residential.handover-inspection.summary=Inventário assinado no início e restituição da habitação no fim, sem contar o desgaste normal.
lease.ie.residential.termination.title=Cessação
lease.ie.residential.termination.summary=Comunicações de cessação, pré-avisos legais e fundamentos restritos para pôr fim a um arrendamento Part 4.
lease.ie.residential.notices.title=Comunicações
lease.ie.residential.notices.summary=Comunicações escritas, notificação nos termos da lei, também por correio eletrónico, e moradas para notificações.
lease.ie.residential.data-protection.title=Proteção de dados
lease.ie.residential.data-protection.summary=Tratamento de dados pessoais nos termos do RGPD e do Data Protection Act 2018.
lease.ie.residential.disputes.title=Litígios
lease.ie.residential.disputes.summary=Lei irlandesa; os litígios abrangidos pela lei são submetidos ao RTB, os restantes aos tribunais irlandeses.
lease.ie.commercial.parties.title=Partes
lease.ie.commercial.parties.summary=Senhorio e arrendatário com número de registo, sede, número de IVA e representante.
lease.ie.commercial.premises.title=Locado
lease.ie.commercial.premises.summary=O espaço comercial arrendado, a área e os direitos; o Residential Tenancies Act 2004 não se aplica.
lease.ie.commercial.permitted-use.title=Fim do arrendamento
lease.ie.commercial.permitted-use.summary=Atividade permitida; consentimento para alteração do uso não recusado sem razão; licenças por conta e risco do arrendatário.
lease.ie.commercial.term.title=Prazo
lease.ie.commercial.term.summary=Data de início e prazo certo, ou arrendamento periódico que cessa por denúncia.
lease.ie.commercial.renewal.title=Direito a novo arrendamento
lease.ie.commercial.renewal.summary=Direito legal a novo arrendamento após 5 anos de uso comercial e possibilidade de renúncia após aconselhamento jurídico.
lease.ie.commercial.rent.title=Renda
lease.ie.commercial.rent.summary=Valor da renda sem IVA, encargos e seguro, e eventual incentivo acordado.
lease.ie.commercial.rent-adjustment.title=Revisão da renda
lease.ie.commercial.rent-adjustment.summary=Revisão para a renda de mercado; nos arrendamentos desde 28 de fevereiro de 2010 a renda revista também pode baixar.
lease.ie.commercial.service-costs.title=Encargos e impostos
lease.ie.commercial.service-costs.summary=Encargos de serviço por quota com acerto anual; o arrendatário paga as taxas locais (rates) e os consumos.
lease.ie.commercial.vat.title=IVA
lease.ie.commercial.vat.summary=O arrendamento está isento de IVA, salvo opção do senhorio pela tributação.
lease.ie.commercial.deposit.title=Caução
lease.ie.commercial.deposit.summary=Caução sem limite legal, depositada em conta designada e restituída no prazo de 30 dias.
lease.ie.commercial.payment.title=Pagamento
lease.ie.commercial.payment.summary=Pagamento da renda sem compensação por transferência, com juros em caso de atraso.
lease.ie.commercial.maintenance.title=Reparações
lease.ie.commercial.maintenance.summary=Obrigação de reparação total ou interior e limite legal da indemnização por falta de conservação.
lease.ie.commercial.alterations.title=Obras
lease.ie.commercial.alterations.summary=Obras apenas com consentimento, não recusado sem razão para benfeitorias, e reposição no fim.
lease.ie.commercial.assignment.title=Cessão e subarrendamento
lease.ie.commercial.assignment.summary=Cessão ou subarrendamento com consentimento do senhorio, que não pode ser recusado sem razão.
lease.ie.commercial.insurance.title=Seguro
lease.ie.commercial.insurance.summary=O senhorio segura o edifício a expensas do arrendatário; o arrendatário segura o recheio e a responsabilidade; suspensão da renda após sinistro.
lease.ie.commercial.energy-certificate.title=Certificado energético (BER)
lease.ie.commercial.energy-certificate.summary=Certificado BER do locado disponibilizado ao arrendatário quando exigido.
lease.ie.commercial.registration.title=Imposto do selo e registo
lease.ie.commercial.registration.summary=Imposto do selo sobre o contrato e comunicações do arrendamento, de cada revisão da renda e da saída do arrendatário à Commercial Leases Database da PSRA.
lease.ie.commercial.break-option.title=Denúncia antecipada
lease.ie.commercial.break-option.summary=Datas facultativas de denúncia, pré-aviso e condições; a denúncia pelo arrendatário pode extinguir o direito a novo arrendamento.
lease.ie.commercial.handover-inspection.title=Auto de estado e entrega
lease.ie.commercial.handover-inspection.summary=Auto do estado de conservação no início e entrega livre e devoluta no fim.
lease.ie.commercial.termination.title=Resolução e cessação
lease.ie.commercial.termination.summary=Retoma do locado por falta de pagamento ou incumprimento, notificação prévia e proteção judicial, e outras formas de cessação.
lease.ie.commercial.notices.title=Comunicações
lease.ie.commercial.notices.summary=Comunicações escritas entregues em mão ou por correio registado e moradas para notificações.
lease.ie.commercial.guarantor.title=Fiador
lease.ie.commercial.guarantor.summary=Garantia das obrigações do arrendatário por um fiador como principal pagador.
lease.ie.commercial.data-protection.title=Proteção de dados
lease.ie.commercial.data-protection.summary=Tratamento dos dados pessoais de contactos e fiadores nos termos do RGPD.
lease.ie.commercial.disputes.title=Litígios
lease.ie.commercial.disputes.summary=Lei irlandesa e tribunais irlandeses; pedidos de novo arrendamento ao tribunal nos termos da lei de 1980.
# ===== end IE =====


# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Partes
lease.it.residential.parties.summary=Identifica o senhorio e o arrendatário ou arrendatários com código fiscal e dados pessoais; os coarrendatários respondem solidariamente; forma escrita obrigatória.
lease.it.residential.premises.title=Locado
lease.it.residential.premises.summary=Descreve a habitação com os dados cadastrais e as pertenças; modelo de renda livre (4 + 4 anos), não para contratos de renda concertada, transitórios ou de estudantes.
lease.it.residential.term.title=Duração
lease.it.residential.term.summary=Pelo menos 4 anos (ou uma duração superior acordada), renovados por mais 4 salvo recusa do senhorio pelos motivos legais; no segundo termo, procedimento de renovação por carta registada com pelo menos 6 meses de antecedência.
lease.it.residential.rent.title=Renda
lease.it.residential.rent.summary=Renda acordada pelas partes; é nula qualquer estipulação de renda superior à do contrato escrito e registado.
lease.it.residential.rent-adjustment.title=Atualização da renda
lease.it.residential.rent-adjustment.summary=Atualização anual facultativa por uma parte acordada da variação do índice ISTAT; suspensa se o senhorio optar pela cedolare secca.
lease.it.residential.service-costs.title=Encargos
lease.it.residential.service-costs.summary=Repartição legal dos encargos a cargo do arrendatário salvo acordo em contrário; pagamento no prazo de 2 meses após o pedido, com direito a discriminação e documentos.
lease.it.residential.deposit.title=Caução
lease.it.residential.deposit.summary=Caução facultativa de no máximo 3 meses de renda, com juros legais pagos anualmente; restituída no fim deduzidas as quantias devidas.
lease.it.residential.payment.title=Pagamento
lease.it.residential.payment.summary=Pagamento periódico por transferência bancária no dia acordado; sem prejuízo da purgação judicial da mora do artigo 55, a renda não paga 20 dias após o vencimento é fundamento de resolução.
lease.it.residential.use.title=Uso
lease.it.residential.use.summary=Uso exclusivo para habitação com a devida diligência; o senhorio pode pedir a resolução no prazo de 3 meses após conhecer a alteração do uso.
lease.it.residential.subletting.title=Subarrendamento
lease.it.residential.subletting.summary=Sem subarrendamento total nem cessão sem consentimento; subarrendamento parcial permitido após carta registada, salvo acordo em contrário.
lease.it.residential.maintenance.title=Manutenção e reparações
lease.it.residential.maintenance.summary=O senhorio faz as reparações necessárias, o arrendatário a pequena manutenção; reparações urgentes, redução da renda por obras prolongadas; o ocupante é responsável pela instalação de aquecimento.
lease.it.residential.energy-certificate.title=Certificado energético
lease.it.residential.energy-certificate.summary=O arrendatário declara ter recebido as informações e a documentação sobre o APE; código e classe do certificado; coimas legais em caso de omissão.
lease.it.residential.registration.title=Registo e impostos
lease.it.residential.registration.summary=O senhorio regista o contrato no prazo de 30 dias e informa o arrendatário e o administrador do condomínio; custos repartidos em partes iguais; cedolare secca facultativa.
lease.it.residential.succession.title=Transmissão
lease.it.residential.succession.summary=Cônjuge, herdeiros, parentes e companheiros que vivam com o arrendatário podem suceder-lhe por morte; regras em caso de separação e divórcio.
lease.it.residential.handover-inspection.title=Entrega e restituição
lease.it.residential.handover-inspection.summary=Auto de entrega no início; restituição no mesmo estado salvo desgaste normal; contrapartida acordada devida até à restituição em caso de mora.
lease.it.residential.termination.title=Denúncia e recusa de renovação
lease.it.residential.termination.summary=O arrendatário pode denunciar por motivos graves com 6 meses de pré-aviso; o senhorio só pode recusar a renovação no primeiro termo pelos motivos legais.
lease.it.residential.notices.title=Comunicações
lease.it.residential.notices.summary=Carta registada quando a lei a exige; endereços e endereços de correio eletrónico certificado para comunicações.
lease.it.residential.guarantor.title=Fiador
lease.it.residential.guarantor.summary=Fiança facultativa até um montante máximo, com responsabilidade solidária; extensão para além do primeiro termo só se acordada.
lease.it.residential.data-protection.title=Proteção de dados
lease.it.residential.data-protection.summary=Dados pessoais tratados apenas para o arrendamento e as obrigações legais, nos termos do RGPD e do código italiano de proteção de dados.
lease.it.residential.disputes.title=Litígios
lease.it.residential.disputes.summary=Lei italiana; tribunal do lugar do imóvel; mediação obrigatória antes da maioria das ações de arrendamento.
lease.it.commercial.parties.title=Partes
lease.it.commercial.parties.summary=Identifica o senhorio e o arrendatário com os dados da sociedade, código fiscal, número de IVA, inscrição no registo das empresas e representante legal.
lease.it.commercial.premises.title=Locado
lease.it.commercial.premises.summary=Descreve o espaço com os dados cadastrais e o uso declarado; não para habitações nem arrendamentos sazonais.
lease.it.commercial.permitted-use.title=Fim do contrato
lease.it.commercial.permitted-use.summary=Atividade exercida e indicação de contacto direto com o público; licenças a cargo do arrendatário; regras sobre alteração do uso.
lease.it.commercial.term.title=Duração e renovação
lease.it.commercial.term.summary=Pelo menos 6 anos (9 para hotéis e teatros) com renovação tácita; recusa do senhorio só no primeiro termo pelos motivos legais, com 12 ou 18 meses de antecedência.
lease.it.commercial.rent.title=Renda
lease.it.commercial.rent.summary=Renda acordada pelas partes; são nulas as estipulações que atribuam ao senhorio vantagens contrárias à lei 392/1978.
lease.it.commercial.rent-adjustment.title=Atualização da renda
lease.it.commercial.rent-adjustment.summary=Atualização anual facultativa a pedido do senhorio; aumentos limitados a 75% da variação do índice ISTAT para contratos que não excedam a duração legal.
lease.it.commercial.service-costs.title=Encargos
lease.it.commercial.service-costs.summary=Repartição legal dos encargos salvo acordo em contrário; pagamento no prazo de 2 meses após o pedido, com direito a discriminação e documentos.
lease.it.commercial.vat.title=IVA
lease.it.commercial.vat.summary=Arrendamento isento de IVA salvo opção do senhorio pela tributação de imóveis afetos a atividade; opção e taxa indicadas.
lease.it.commercial.deposit.title=Caução
lease.it.commercial.deposit.summary=Caução facultativa de no máximo 3 meses de renda, com juros legais pagos anualmente; restituída no fim deduzidas as quantias devidas.
lease.it.commercial.payment.title=Pagamento
lease.it.commercial.payment.summary=Pagamento periódico por transferência bancária no dia acordado; recibo ou fatura; resolução só por incumprimento que não seja de escassa importância.
lease.it.commercial.maintenance.title=Manutenção e reparações
lease.it.commercial.maintenance.summary=O senhorio faz as reparações necessárias, o arrendatário a pequena manutenção salvo acordo em contrário; reparações urgentes, redução da renda por obras prolongadas.
lease.it.commercial.alterations.title=Obras e adaptação
lease.it.commercial.alterations.summary=Obras só com o consentimento escrito do senhorio; regras legais sobre indemnização por benfeitorias e remoção de acréscimos.
lease.it.commercial.assignment.title=Subarrendamento e cessão
lease.it.commercial.assignment.summary=Subarrendamento ou cessão sem consentimento juntamente com o estabelecimento, sujeito a oposição do senhorio por motivos graves em 30 dias; nos outros casos é necessário consentimento.
lease.it.commercial.pre-emption.title=Direito de preferência
lease.it.commercial.pre-emption.summary=Direito de preferência e de remição do arrendatário na venda e no novo arrendamento, exceto espaços sem contacto com o público e outros casos excluídos.
lease.it.commercial.goodwill-compensation.title=Indemnização pela perda de clientela
lease.it.commercial.goodwill-compensation.summary=18 meses de renda (21 para hotéis) quando o arrendamento cessa por causa diferente de incumprimento, denúncia, desistência ou processo de insolvência do arrendatário; não para espaços sem contacto com o público e outros casos excluídos.
lease.it.commercial.insurance.title=Seguro
lease.it.commercial.insurance.summary=O arrendatário responde pela perda e por danos de incêndio salvo causa não imputável; seguro de responsabilidade do arrendatário e seguro do edifício pelo senhorio.
lease.it.commercial.energy-certificate.title=Certificado energético
lease.it.commercial.energy-certificate.summary=O arrendatário declara ter recebido as informações e a documentação sobre o APE, com cópia anexa quando exigida; coimas legais em caso de omissão.
lease.it.commercial.registration.title=Registo e impostos
lease.it.commercial.registration.summary=Registo no prazo de 30 dias, custos repartidos em partes iguais; imposto de registo de 1% ou 2%; a cedolare secca não se aplica.
lease.it.commercial.handover-inspection.title=Entrega e restituição
lease.it.commercial.handover-inspection.summary=Auto de entrega no início; restituição no mesmo estado salvo desgaste normal; contrapartida acordada devida até à restituição em caso de mora.
lease.it.commercial.termination.title=Desistência e resolução
lease.it.commercial.termination.summary=O arrendatário pode desistir por motivos graves com 6 meses de pré-aviso e, se acordado, a todo o tempo com o mesmo pré-aviso; recusa do senhorio só no primeiro termo; resolução por incumprimento.
lease.it.commercial.notices.title=Comunicações
lease.it.commercial.notices.summary=Carta registada ou notificação por oficial de justiça quando a lei o exige; endereços e correio eletrónico certificado.
lease.it.commercial.guarantor.title=Garantia
lease.it.commercial.guarantor.summary=Garantia pessoal, bancária ou de seguro facultativa até um montante máximo; extensão para além do primeiro termo só se acordada.
lease.it.commercial.data-protection.title=Proteção de dados
lease.it.commercial.data-protection.summary=Dados pessoais das pessoas que atuam pelas partes tratados apenas para o arrendamento, nos termos do RGPD e do código italiano de proteção de dados.
lease.it.commercial.disputes.title=Litígios
lease.it.commercial.disputes.summary=Lei italiana; tribunal do lugar do imóvel; mediação obrigatória antes da maioria das ações de arrendamento.
# ===== end IT =====


