lease.no.residential.premises.title=Locado
lease.no.residential.premises.summary=A habitação arrendada, a aplicação da lei norueguesa do arrendamento e a sua proteção imperativa do arrendatário.
lease.no.residential.term.title=Duração
lease.no.residential.term.summary=Data de início; arrendamento por tempo indeterminado, ou com prazo certo com a duração mínima legal de 3 anos e as suas exceções.
lease.no.residential.rent.title=Renda
lease.no.residential.rent.summary=A renda fixa, a proibição de uma renda não razoável e a proibição de pagamentos além dos que a lei admite.
lease.no.residential.rent-adjustment.title=Atualização da renda
lease.no.residential.rent-adjustment.summary=Atualização anual segundo o índice de preços no consumidor com aviso escrito de 1 mês, e adaptação à renda corrente após 2 anos e 6 meses.
lease.no.residential.service-costs.title=Despesas de consumo
lease.no.residential.service-costs.summary=Pagamento separado apenas de eletricidade, combustível e água e saneamento medidos, com conta anual a pedido.
lease.no.residential.deposit.title=Caução
lease.no.residential.deposit.summary=Caução de no máximo 6 meses de renda numa conta separada em nome do arrendatário, ou uma garantia dentro do mesmo limite.
lease.no.residential.payment.title=Pagamento
lease.no.residential.payment.summary=Renda paga mensalmente e antecipadamente na conta do senhorio; sem pagamento antecipado por mais de 1 mês; juros de mora.
lease.no.residential.use.title=Uso do locado
lease.no.residential.use.summary=Uso apenas como habitação, diligência, regras de convivência, animais e as pessoas que o arrendatário pode acolher no agregado.
lease.no.residential.subletting.title=Subarrendamento
lease.no.residential.subletting.summary=Subarrendamento apenas com consentimento, salvo os direitos legais de subarrendar parte da habitação ou durante uma ausência até 2 anos.
lease.no.residential.maintenance.title=Conservação
lease.no.residential.maintenance.summary=Dever de conservação do senhorio, dever do arrendatário quanto a fechaduras, torneiras, detetores de fumo e semelhantes, aviso de danos e acesso.
lease.no.residential.energy-label.title=Certificado energético
lease.no.residential.energy-label.summary=O senhorio apresentou o certificado energético antes da celebração do contrato, salvo isenção.
lease.no.residential.handover-inspection.title=Entrega e restituição
lease.no.residential.handover-inspection.summary=Estado na entrega, auto de entrega conjunto, reclamação de defeitos e estado na restituição.
lease.no.residential.termination.title=Cessação
lease.no.residential.termination.summary=Pré-aviso de 3 meses; o senhorio apenas por fundamentos legais, por escrito, fundamentado e com informação sobre a oposição; resolução por incumprimento grave.
lease.no.residential.enforcement.title=Despejo coercivo
lease.no.residential.enforcement.summary=O arrendatário aceita o despejo coercivo por falta de pagamento, e no fim de um contrato com prazo certo, após 2 semanas de aviso escrito.
lease.no.residential.data-protection.title=Proteção de dados
lease.no.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário nos termos do RGPD e da lei norueguesa de dados pessoais.
lease.no.residential.disputes.title=Lei aplicável e litígios
lease.no.residential.disputes.summary=Direito norueguês; a comissão norueguesa de litígios de arrendamento antes do tribunal de comarca; comissões de avaliação para litígios sobre a renda.
lease.no.commercial.parties.title=Partes
lease.no.commercial.parties.summary=Identifica o senhorio e o arrendatário com os números de organização e representantes.
lease.no.commercial.premises.title=Locado
lease.no.commercial.premises.summary=O espaço comercial arrendado e a sua área; a lei norueguesa do arrendamento aplica-se e é em grande parte supletiva para espaços comerciais.
lease.no.commercial.permitted-use.title=Fim do arrendamento
lease.no.commercial.permitted-use.summary=A atividade acordada, atividades afins, o dever de abertura de lojas e estabelecimentos de restauração, e letreiros.
lease.no.commercial.term.title=Duração
lease.no.commercial.term.summary=Data de início; arrendamento por tempo indeterminado com eventual período sem denúncia, ou com prazo certo sem direito legal de renovação.
lease.no.commercial.rent.title=Renda
lease.no.commercial.rent.summary=A renda fixa acordada; não pode ser acordada uma renda não razoável, mesmo para espaços comerciais.
lease.no.commercial.rent-adjustment.title=Atualização da renda
lease.no.commercial.rent-adjustment.summary=Atualização anual até 100 % do índice de preços no consumidor, e se se aplica a adaptação à renda corrente.
lease.no.commercial.service-costs.title=Despesas de exploração
lease.no.commercial.service-costs.summary=Parte das despesas comuns e do consumo paga por conta, com conta anual.
lease.no.commercial.vat.title=IVA
lease.no.commercial.vat.summary=O arrendamento está isento de IVA; acresce IVA se o senhorio estiver registado voluntariamente para o arrendamento.
lease.no.commercial.deposit.title=Garantia
lease.no.commercial.deposit.summary=Caução ou outra garantia acordada; o limite legal de 6 meses de renda pode ser afastado para espaços comerciais.
lease.no.commercial.payment.title=Pagamento
lease.no.commercial.payment.summary=Renda paga antecipadamente na conta do senhorio; juros de mora em caso de atraso.
lease.no.commercial.maintenance.title=Conservação
lease.no.commercial.maintenance.summary=A repartição legal supletiva da conservação, a repartição acordada, o aviso de danos e o acesso.
lease.no.commercial.alterations.title=Obras e benfeitorias
lease.no.commercial.alterations.summary=Obras apenas com consentimento, reposição no fim do contrato e compensação por benfeitorias.
lease.no.commercial.assignment.title=Cessão
lease.no.commercial.assignment.summary=Cessão do arrendamento juntamente com o negócio com a aprovação do senhorio, salvo acordo em contrário.
lease.no.commercial.subletting.title=Subarrendamento
lease.no.commercial.subletting.summary=Subarrendamento apenas com o consentimento do senhorio ou ao abrigo de um direito acordado.
lease.no.commercial.insurance.title=Seguro
lease.no.commercial.insurance.summary=O senhorio segura o edifício; o arrendatário segura os seus bens e instalações e tem seguro de responsabilidade civil.
lease.no.commercial.energy-label.title=Certificado energético
lease.no.commercial.energy-label.summary=O senhorio apresentou o certificado energético antes da celebração do contrato, salvo isenção.
lease.no.commercial.handover-inspection.title=Entrega e restituição
lease.no.commercial.handover-inspection.summary=Estado na entrega, vistorias conjuntas com auto, estado na restituição e indemnização por restituição tardia.
lease.no.commercial.termination.title=Cessação
lease.no.commercial.termination.summary=Pré-aviso de 3 meses salvo acordo em contrário; regras imperativas de forma e oposição para a denúncia do senhorio; compensação pela clientela; resolução.
lease.no.commercial.enforcement.title=Despejo coercivo
lease.no.commercial.enforcement.summary=O arrendatário aceita o despejo coercivo por falta de pagamento, e no fim de um contrato com prazo certo, após 2 semanas de aviso escrito.
lease.no.commercial.data-protection.title=Proteção de dados
