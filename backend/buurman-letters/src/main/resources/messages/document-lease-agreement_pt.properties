lease.fi.residential.use.title=Uso da habitação
lease.fi.residential.use.summary=Apenas uso habitacional, comunicação de outros residentes, cuidado diligente e proibição legal de fumar.
lease.fi.residential.subletting.title=Subarrendamento e cessão
lease.fi.residential.subletting.summary=Subarrendamento até metade da habitação, cedência temporária até 2 anos, cessão apenas com autorização, exceto a um familiar nas condições legais.
lease.fi.residential.maintenance.title=Estado e manutenção
lease.fi.residential.maintenance.summary=Estado exigível, comunicação de defeitos, redução da renda, obras e acesso do senhorio.
lease.fi.residential.energy-certificate.title=Certificado energético
lease.fi.residential.energy-certificate.summary=O certificado energético é exibido na visita e entregue, com exceções legais.
lease.fi.residential.handover-inspection.title=Entrega e dia da mudança
