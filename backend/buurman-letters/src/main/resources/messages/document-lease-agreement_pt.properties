# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Partes
lease.at.residential.parties.summary=Identifica o senhorio e o(s) arrendatário(s), solidariamente responsáveis; o senhorio indica se é empresário.
lease.at.residential.premises.title=Locado
lease.at.residential.premises.summary=Descreve a habitação e regista o regime da MRG aplicável: aplicação integral, aplicação parcial ou exclusão total.
lease.at.residential.term.title=Duração
lease.at.residential.term.summary=Prazo indeterminado ou certo; segundo a MRG, por escrito e de pelo menos 5 anos (3 anos se o senhorio não for empresário).
lease.at.residential.rent.title=Renda
lease.at.residential.rent.summary=A renda principal e, em aplicação integral da MRG, os limites legais (valor de referência, montantes por categoria).
lease.at.residential.rent-adjustment.title=Atualização
lease.at.residential.rent-adjustment.summary=Atualização anual a 1 de abril segundo a MieWeG; a inflação acima de 3 por cento conta apenas metade.
lease.at.residential.service-costs.title=Encargos
lease.at.residential.service-costs.summary=Quota-parte dos custos de exploração e taxas públicas em prestações mensais; acerto até 30 de junho em aplicação integral da MRG.
lease.at.residential.deposit.title=Caução
lease.at.residential.deposit.summary=Caução sem limite legal, aplicada numa caderneta de poupança e restituída com juros sem demora.
lease.at.residential.payment.title=Pagamento
lease.at.residential.payment.summary=Renda paga mensalmente e antecipadamente até ao dia 5; juros legais de mora de 4 por cento ao ano.
lease.at.residential.use.title=Uso
lease.at.residential.use.summary=Uso exclusivamente habitacional, acesso por motivos importantes e procedimento de comunicação de alterações substanciais.
lease.at.residential.subletting.title=Subarrendamento
lease.at.residential.subletting.summary=Subarrendamento apenas com consentimento; em aplicação integral da MRG, recusa só por motivo importante.
lease.at.residential.maintenance.title=Conservação e defeitos
lease.at.residential.maintenance.summary=O senhorio mantém a habitação em condições de uso; isenção de renda por inaptidão; o arrendatário comunica os defeitos sem demora.
lease.at.residential.energy-certificate.title=Certificado energético
lease.at.residential.energy-certificate.summary=O senhorio apresenta e entrega o certificado energético (EAVG 2012).
lease.at.residential.registration.title=Registo de residência
lease.at.residential.registration.summary=O arrendatário regista-se junto da autoridade competente no prazo de 3 dias após a mudança.
lease.at.residential.handover-inspection.title=Entrega e restituição
lease.at.residential.handover-inspection.summary=Autos de entrega e de restituição, restituição no estado recebido e prazos para reclamações.
lease.at.residential.termination.title=Cessação
lease.at.residential.termination.summary=Segundo a MRG, o senhorio só denuncia judicialmente e por motivo importante; prazos de pré-aviso e resolução antecipada.
lease.at.residential.data-protection.title=Proteção de dados
lease.at.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário nos termos do RGPD.
lease.at.residential.disputes.title=Litígios e disposições finais
lease.at.residential.disputes.summary=Direito austríaco; tribunal de comarca do local da habitação; os arrendamentos habitacionais estão isentos da taxa de arrendamento.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Partes
lease.at.commercial.parties.summary=Identifica o senhorio e o arrendatário com número de registo comercial, número de IVA e representantes.
lease.at.commercial.premises.title=Locado
lease.at.commercial.premises.summary=Descreve o espaço comercial e regista o regime da MRG aplicável.
lease.at.commercial.permitted-use.title=Fim do arrendamento
lease.at.commercial.permitted-use.summary=A atividade acordada; alterações só com consentimento; a não utilização pode ser fundamento de denúncia.
lease.at.commercial.term.title=Duração
lease.at.commercial.term.summary=Prazo certo ou indeterminado; segundo a MRG, o prazo certo exige um acordo escrito sobre a caducidade.
lease.at.commercial.rent.title=Renda
lease.at.commercial.rent.summary=A renda principal; em aplicação integral da MRG, limitada ao montante adequado, que o arrendatário empresário só pode invocar se tiver reclamado a tempo.
lease.at.commercial.rent-adjustment.title=Atualização
lease.at.commercial.rent-adjustment.summary=Atualização pelo índice de preços no consumidor 2020 com um limiar a preencher, para cima e para baixo.
lease.at.commercial.service-costs.title=Encargos
lease.at.commercial.service-costs.summary=Quota-parte dos custos de exploração e taxas públicas em prestações mensais com acerto anual.
lease.at.commercial.vat.title=Opção pelo IVA
lease.at.commercial.vat.summary=O senhorio opta pelo IVA sobre a renda; o arrendatário usa o locado quase exclusivamente para operações tributáveis.
lease.at.commercial.deposit.title=Caução
lease.at.commercial.deposit.summary=Caução em dinheiro ou garantia bancária sem limite legal, restituída após o fim do contrato.
lease.at.commercial.payment.title=Pagamento
lease.at.commercial.payment.summary=Renda paga mensalmente e antecipadamente; juros de mora entre empresários de 9,2 pontos percentuais acima da taxa de base.
lease.at.commercial.maintenance.title=Conservação
lease.at.commercial.maintenance.summary=Em aplicação integral da MRG aplica-se o § 3 MRG; caso contrário, o senhorio conserva a estrutura e as partes comuns e o arrendatário o interior.
lease.at.commercial.alterations.title=Obras e adaptação
lease.at.commercial.alterations.summary=Obras e publicidade apenas com consentimento escrito; remoção no fim do contrato.
lease.at.commercial.subletting.title=Subarrendamento e trespasse
lease.at.commercial.subletting.summary=Subarrendamento sujeito a consentimento; direitos legais na venda ou cessão da exploração da empresa em aplicação integral da MRG.
lease.at.commercial.insurance.title=Seguros
lease.at.commercial.insurance.summary=O senhorio segura o edifício; o arrendatário o recheio e a responsabilidade civil da atividade.
lease.at.commercial.energy-certificate.title=Certificado energético
lease.at.commercial.energy-certificate.summary=O senhorio apresenta e entrega o certificado energético (EAVG 2012).
lease.at.commercial.contract-fee.title=Taxa de arrendamento
lease.at.commercial.contract-fee.summary=Taxa de 1 por cento do valor do contrato segundo a lei das taxas (GebG), calculada pelo senhorio e suportada pelo arrendatário.
lease.at.commercial.handover-inspection.title=Entrega e restituição
lease.at.commercial.handover-inspection.summary=Autos de entrega e de restituição, restituição do locado desocupado e prazos para reclamações.
lease.at.commercial.termination.title=Cessação
lease.at.commercial.termination.summary=Denúncia para o fim de um trimestre civil com 3 meses de antecedência; limites à denúncia pelo senhorio segundo a MRG.
lease.at.commercial.data-protection.title=Proteção de dados
lease.at.commercial.data-protection.summary=Tratamento dos dados pessoais de representantes e pessoas de contacto nos termos do RGPD.
lease.at.commercial.disputes.title=Litígios
lease.at.commercial.disputes.summary=Direito austríaco; é competente o tribunal de comarca do local do locado.
