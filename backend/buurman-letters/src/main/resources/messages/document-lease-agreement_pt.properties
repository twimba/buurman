lease.pl.commercial.rent-adjustment.title=Atualização da renda
lease.pl.commercial.rent-adjustment.summary=Atualização anual pelo índice de preços no consumidor ou outro indicador e aumento por denúncia nos termos do Código Civil.
lease.pl.commercial.service-costs.title=Encargos
lease.pl.commercial.service-costs.summary=Consumos e quota das despesas comuns a cargo do arrendatário, e o seu acerto.
lease.pl.commercial.vat.title=IVA
lease.pl.commercial.vat.summary=Renda e encargos são valores líquidos acrescidos de IVA à taxa normal de 23 %, salvo isenção do senhorio.
lease.pl.commercial.deposit.title=Caução
lease.pl.commercial.deposit.summary=Caução facultativa ou outra garantia livremente acordada pelas partes, com regras de reposição e restituição.
lease.pl.commercial.payment.title=Pagamento
lease.pl.commercial.payment.summary=Pagamento antecipado no dia acordado por transferência; juros legais de mora ou juros nos termos da lei das transações comerciais.
lease.pl.commercial.maintenance.title=Conservação e reparações
lease.pl.commercial.maintenance.summary=O senhorio mantém o locado apto para o uso; as pequenas despesas cabem ao arrendatário.
lease.pl.commercial.alterations.title=Obras e benfeitorias
lease.pl.commercial.alterations.summary=Obras só com consentimento escrito; acerto das benfeitorias no fim do arrendamento.
lease.pl.commercial.subletting.title=Subarrendamento e cessão
lease.pl.commercial.subletting.summary=Subarrendamento e cessão do arrendamento só com consentimento escrito do senhorio.
lease.pl.commercial.insurance.title=Seguros
lease.pl.commercial.insurance.summary=Seguro do edifício pelo senhorio, seguro de responsabilidade civil e de recheio pelo arrendatário.
lease.pl.commercial.energy-certificate.title=Certificado energético
lease.pl.commercial.energy-certificate.summary=É entregue uma cópia do certificado de desempenho energético na celebração; o arrendatário não pode renunciar a ela.
lease.pl.commercial.enforcement-submission.title=Sujeição à execução
lease.pl.commercial.enforcement-submission.summary=Escritura notarial em que o arrendatário se sujeita à execução quanto ao pagamento e à entrega do locado.
lease.pl.commercial.handover-inspection.title=Entrega e restituição
lease.pl.commercial.handover-inspection.summary=Auto de entrega e restituição do locado sem deterioração.
lease.pl.commercial.termination.title=Cessação
lease.pl.commercial.termination.summary=Prazos de pré-aviso e denúncia imediata por rendas em atraso após aviso escrito, uso indevido ou defeitos graves.
