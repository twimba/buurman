lease.fi.residential.termination.title=Denúncia e resolução
lease.fi.residential.termination.summary=Pré-aviso do senhorio de 4 ou 3 meses, do arrendatário de 1 mês, comunicação escrita comprovável, resolução.
lease.fi.residential.notices.title=Comunicações
lease.fi.residential.notices.summary=Comunicações por correio ou por um canal eletrónico acordado; denúncias comunicadas de forma comprovável.
lease.fi.residential.data-protection.title=Proteção de dados
lease.fi.residential.data-protection.summary=Tratamento de dados pessoais nos termos do RGPD e da lei finlandesa de proteção de dados.
lease.fi.residential.disputes.title=Litígios
lease.fi.residential.disputes.summary=Lei finlandesa, a comissão finlandesa de litígios de consumo, o tribunal distrital e o processo para pequenos litígios.
lease.fi.commercial.parties.title=Partes
lease.fi.commercial.parties.summary=Identifica o senhorio e o arrendatário com identificador de empresa, número de IVA e representantes.
lease.fi.commercial.premises.title=Locado
lease.fi.commercial.premises.summary=Descreve o espaço comercial e o direito do senhorio de o arrendar; aplica-se a lei finlandesa do arrendamento de espaços comerciais.
lease.fi.commercial.permitted-use.title=Fim do arrendamento
lease.fi.commercial.permitted-use.summary=Uso acordado do espaço; alterações exigem consentimento; o arrendatário obtém as licenças.
lease.fi.commercial.term.title=Duração
lease.fi.commercial.term.summary=Prazo certo ou duração indeterminada, por escrito; um contrato de prazo certo não pode, em regra, ser denunciado.
lease.fi.commercial.rent.title=Renda
lease.fi.commercial.rent.summary=A renda acordada, acrescida de IVA e encargos de consumo quando acordado.
lease.fi.commercial.rent-adjustment.title=Atualização da renda
lease.fi.commercial.rent-adjustment.summary=Base de atualização anual acordada, comunicada por escrito antes de produzir efeitos.
lease.fi.commercial.service-costs.title=Encargos de consumo
lease.fi.commercial.service-costs.summary=Água, eletricidade, aquecimento e outros encargos segundo bases acordadas.
lease.fi.commercial.vat.title=IVA
lease.fi.commercial.vat.summary=O arrendamento está isento de IVA salvo opção do senhorio pela sujeição; deveres de uso e comunicação do arrendatário.
lease.fi.commercial.deposit.title=Caução
lease.fi.commercial.deposit.summary=Caução razoável sem limite legal, restituída após o arrendamento deduzidos os créditos vencidos.
lease.fi.commercial.payment.title=Pagamento
lease.fi.commercial.payment.summary=Renda devida no dia acordado ou no dia 2 de cada período; renda antecipada e juros de mora.
lease.fi.commercial.maintenance.title=Manutenção
lease.fi.commercial.maintenance.summary=Repartição acordada de responsabilidades, estado, comunicação de defeitos, obras e acesso do senhorio.
lease.fi.commercial.alterations.title=Obras do arrendatário
lease.fi.commercial.alterations.summary=Obras do arrendatário apenas com autorização escrita; compensação por obras que valorizaram o locado no fim.
lease.fi.commercial.assignment.title=Cessão
lease.fi.commercial.assignment.summary=A cessão exige consentimento salvo na transmissão do estabelecimento, se não for excluída; comunicação 2 meses antes.
lease.fi.commercial.subletting.title=Subarrendamento
lease.fi.commercial.subletting.summary=Até metade do espaço pode ser subarrendada salvo acordo em contrário; o arrendatário continua responsável.
lease.fi.commercial.insurance.title=Seguros
lease.fi.commercial.insurance.summary=Seguro de responsabilidade civil e de bens do arrendatário; o senhorio segura o edifício.
lease.fi.commercial.energy-certificate.title=Certificado energético
lease.fi.commercial.energy-certificate.summary=O certificado energético é exibido na visita e entregue, com exceções legais.
lease.fi.commercial.handover-inspection.title=Entrega e dia da mudança
lease.fi.commercial.handover-inspection.summary=Vistoria conjunta; o dia da mudança é o dia útil seguinte ao fim do contrato; adiamento até 6 meses.
lease.fi.commercial.termination.title=Denúncia e resolução
lease.fi.commercial.termination.summary=Pré-aviso de 3 meses (senhorio) e 1 mês (arrendatário) salvo acordo; proteção, compensações e resolução.
lease.fi.commercial.notices.title=Comunicações
lease.fi.commercial.notices.summary=Comunicações por correio ou por um canal eletrónico acordado ou habitual; denúncias comunicadas de forma comprovável.
