lease.fi.residential.service-costs.summary=Encargos de água, eletricidade e outros com dados de consumo; água segundo o consumo medido.
lease.fi.residential.deposit.title=Caução
lease.fi.residential.deposit.summary=Caução de no máximo 3 meses de renda, restituída ou retenção comunicada no prazo de 14 dias após o fim.
lease.fi.residential.payment.title=Pagamento
