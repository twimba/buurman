# ===== SE lease clause titles and summaries (country pack) =====
lease.se.residential.parties.title=Partes
lease.se.residential.parties.summary=Identifica o senhorio e o arrendatário, a responsabilidade solidária dos coarrendatários e o dever do senhorio de afixar o seu nome e endereço.
lease.se.residential.premises.title=Locado
lease.se.residential.premises.summary=Descreve a habitação arrendada nos termos do capítulo 12 do jordabalken, com a declaração obrigatória do senhorio de que o arrendamento não está abrangido pela privatuthyrningslag.
lease.se.residential.term.title=Duração
lease.se.residential.term.summary=Data de início, duração indeterminada ou prazo certo, denúncia obrigatória após mais de 9 meses de arrendamento e prorrogação presumida.
lease.se.residential.rent.title=Renda
lease.se.residential.rent.summary=Renda em montante fixo, renda razoável aferida pelo valor de uso comparável (bruksvärde) e proibição de pagamentos especiais pelo contrato.
lease.se.residential.rent-adjustment.title=Alteração da renda
lease.se.residential.rent-adjustment.summary=Alteração da renda por acordo ou, após comunicação escrita, mediante pedido à comissão regional de arrendamento (hyresnämnden); sem cláusula de indexação.
lease.se.residential.service-costs.title=Aquecimento, eletricidade e água
lease.se.residential.service-costs.summary=O que a renda inclui e quando o aquecimento, a água quente, a eletricidade e a água podem ser cobrados além da renda fixa.
lease.se.residential.deposit.title=Caução
lease.se.residential.deposit.summary=Caução facultativa acordada entre as partes, condições de restituição e direito do garante ou fiador de pôr termo ao seu compromisso.
lease.se.residential.payment.title=Pagamento
lease.se.residential.payment.summary=Vencimento, regras legais sobre a data de pagamento da renda, pagamento através de um banco e juros de mora.
lease.se.residential.use.title=Uso e conservação
lease.se.residential.use.summary=Uso como habitação, dever de cuidado, boa conduta sem perturbações, pessoas alojadas e direito do arrendatário de pintar.
lease.se.residential.subletting.title=Subarrendamento e cessão
lease.se.residential.subletting.summary=Subarrendamento e cessão do arrendamento apenas com consentimento do senhorio ou autorização da comissão regional de arrendamento, salvo exceções legais.
lease.se.residential.maintenance.title=Conservação
lease.se.residential.maintenance.summary=Estado da habitação, dever de conservação do senhorio, direitos em caso de defeitos, comunicação de danos e acesso do senhorio.
lease.se.residential.energy-certificate.title=Certificado energético
lease.se.residential.energy-certificate.summary=Apresentação ao arrendatário do certificado de desempenho energético do edifício e entrega de uma cópia.
lease.se.residential.handover-inspection.title=Entrega e vistoria
lease.se.residential.handover-inspection.summary=Vistoria conjunta à entrada e à saída e desocupação da habitação até às 12 horas do dia seguinte ao termo do arrendamento.
lease.se.residential.termination.title=Cessação e proteção do arrendatário
lease.se.residential.termination.summary=Prazos de pré-aviso, denúncia escrita, direito do arrendatário à prorrogação, caducidade por incumprimento e recuperação do arrendamento após atraso no pagamento.
lease.se.residential.notices.title=Comunicações
lease.se.residential.notices.summary=Endereços para comunicações e comunicações legais consideradas feitas com o envio por carta registada.
lease.se.residential.data-protection.title=Proteção de dados
lease.se.residential.data-protection.summary=Tratamento dos dados pessoais do arrendatário nos termos do RGPD e direito de reclamação junto da autoridade sueca de proteção de dados (IMY).
lease.se.residential.disputes.title=Litígios
lease.se.residential.disputes.summary=Lei sueca, comissão regional de arrendamento (hyresnämnden), recurso para o Svea hovrätt e prazo de 2 anos para as pretensões.
