# ===== FI lease clause titles and summaries (country pack) =====
lease.fi.residential.parties.title=Partes
lease.fi.residential.parties.summary=Identifica o senhorio e o arrendatário; os coarrendatários e os cônjuges que vivem juntos respondem solidariamente.
lease.fi.residential.premises.title=Habitação
lease.fi.residential.premises.summary=Descreve a habitação e o direito do senhorio de a arrendar; aplica-se a lei finlandesa do arrendamento habitacional, exceto em Åland.
lease.fi.residential.term.title=Duração
lease.fi.residential.term.summary=Prazo certo ou duração indeterminada, por escrito; prazos curtos repetidos passam a duração indeterminada.
