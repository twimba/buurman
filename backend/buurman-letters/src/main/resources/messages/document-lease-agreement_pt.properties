lease.be.commercial.permitted-use.title=Fim do arrendamento
lease.be.commercial.permitted-use.summary=Comércio a retalho ou artesanato em contacto direto com o público; âmbito da lei e arrendamentos até 1 ano.
lease.be.commercial.term.title=Duração
lease.be.commercial.term.summary=Pelo menos 9 anos; o arrendatário pode pôr termo em cada triénio com pré-aviso de 6 meses, o senhorio apenas se estipulado.
lease.be.commercial.rent.title=Renda
lease.be.commercial.rent.summary=Renda sem encargos, despesas e impostos, fixada livremente.
lease.be.commercial.rent-adjustment.title=Indexação e revisão
lease.be.commercial.rent-adjustment.summary=Indexação acordada pelo índice de saúde 1 vez por ano e revisão judicial em cada triénio se o valor diferir pelo menos 15 %.
lease.be.commercial.service-costs.title=Encargos e despesas
lease.be.commercial.service-costs.summary=Lista exaustiva dos encargos, despesas e impostos a cargo do arrendatário, acertados pelo menos anualmente.
lease.be.commercial.vat.title=IVA
lease.be.commercial.vat.summary=Arrendamento em princípio isento de IVA, com a opção de um arrendamento de edifícios profissionais sujeito a IVA.
lease.be.commercial.deposit.title=Garantia locatícia
lease.be.commercial.deposit.summary=Garantia no montante e na forma acordados; sem limite legal para o arrendamento comercial.
lease.be.commercial.payment.title=Pagamento
lease.be.commercial.payment.summary=Pagamento por prestação por transferência no dia acordado; juros legais após interpelação.
lease.be.commercial.maintenance.title=Manutenção e reparações
lease.be.commercial.maintenance.summary=Reparações a cargo do senhorio e do arrendatário nos termos do antigo Código Civil belga, salvo acordo em contrário.
lease.be.commercial.alterations.title=Obras
lease.be.commercial.alterations.summary=Direito do arrendatário a obras até 3 anos de renda após aviso, oposição do senhorio em 30 dias e destino no final.
lease.be.commercial.assignment.title=Cessão e subarrendamento
lease.be.commercial.assignment.summary=Consentimento exigido, salvo cessão ou subarrendamento com o estabelecimento comercial, sem prejuízo da oposição do senhorio em 30 dias.
lease.be.commercial.insurance.title=Seguro
lease.be.commercial.insurance.summary=O arrendatário segura a sua responsabilidade e o recheio, o senhorio segura o edifício.
lease.be.commercial.energy-certificate.title=Certificado energético
lease.be.commercial.energy-certificate.summary=Certificado de desempenho energético quando as regras regionais o exigirem, com número, data e classe.
lease.be.commercial.registration.title=Registo
lease.be.commercial.registration.summary=Registo nos termos da legislação fiscal, que confere data certa ao contrato; parte que suporta os direitos.
lease.be.commercial.handover-inspection.title=Auto de vistoria
lease.be.commercial.handover-inspection.summary=Auto detalhado e contraditório, anexado e registado; restituição do imóvel no estado em que foi recebido.
lease.be.commercial.renewal.title=Renovação
lease.be.commercial.renewal.summary=Direito a 3 renovações de 9 anos, pedido 18 a 15 meses antes do termo, motivos de recusa e indemnização por despejo.
lease.be.commercial.transfer.title=Alienação do imóvel
lease.be.commercial.transfer.summary=O adquirente só pode despejar o arrendatário por motivos legais, com pré-aviso de 1 ano dado no prazo de 3 meses.
lease.be.commercial.termination.title=Cessação
lease.be.commercial.termination.summary=Fim num triénio, arrendamento de duração indeterminada após perda do direito de renovação, resolução judicial por incumprimento.
lease.be.commercial.data-protection.title=Proteção de dados
lease.be.commercial.data-protection.summary=Tratamento dos dados pessoais das partes e dos seus representantes nos termos do RGPD.
lease.be.commercial.disputes.title=Litígios
lease.be.commercial.disputes.summary=Direito belga e juiz de paz do lugar do imóvel; conciliação prévia possível.
