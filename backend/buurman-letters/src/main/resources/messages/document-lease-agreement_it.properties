# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Parti
lease.at.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori, obbligati in solido; il locatore indica se è imprenditore.
lease.at.residential.premises.title=Immobile locato
lease.at.residential.premises.summary=Descrive l'abitazione e indica il regime MRG applicabile: applicazione integrale, applicazione parziale o esclusione totale.
lease.at.residential.term.title=Durata
lease.at.residential.term.summary=Durata indeterminata o determinata; secondo la MRG per iscritto e di almeno 5 anni (3 anni se il locatore non è imprenditore).
lease.at.residential.rent.title=Canone
lease.at.residential.rent.summary=Il canone principale e, in applicazione integrale della MRG, i limiti di legge (valore di riferimento, importi per categoria).
lease.at.residential.rent-adjustment.title=Indicizzazione
lease.at.residential.rent-adjustment.summary=Indicizzazione annuale al 1 aprile secondo la MieWeG; l'inflazione oltre il 3 per cento conta solo per metà.
lease.at.residential.service-costs.title=Spese di esercizio
lease.at.residential.service-costs.summary=Quota delle spese di esercizio e dei tributi pubblici in rate mensili; rendiconto entro il 30 giugno in applicazione integrale della MRG.
lease.at.residential.deposit.title=Deposito cauzionale
lease.at.residential.deposit.summary=Deposito senza limite di legge, versato su un libretto di risparmio e restituito con gli interessi senza indugio.
lease.at.residential.payment.title=Pagamento
lease.at.residential.payment.summary=Canone pagato mensilmente in anticipo entro il giorno 5; interessi legali di mora del 4 per cento annuo.
lease.at.residential.use.title=Uso
lease.at.residential.use.summary=Uso esclusivamente abitativo, accesso per motivi importanti e procedura di comunicazione delle modifiche sostanziali.
lease.at.residential.subletting.title=Sublocazione
lease.at.residential.subletting.summary=Sublocazione solo con consenso; in applicazione integrale della MRG il rifiuto è ammesso solo per motivo importante.
lease.at.residential.maintenance.title=Manutenzione e difetti
lease.at.residential.maintenance.summary=Il locatore mantiene l'abitazione idonea all'uso; esonero dal canone in caso di inidoneità; il conduttore segnala i difetti senza indugio.
lease.at.residential.energy-certificate.title=Attestato di prestazione energetica
lease.at.residential.energy-certificate.summary=Il locatore esibisce e consegna l'attestato di prestazione energetica (EAVG 2012).
lease.at.residential.registration.title=Iscrizione anagrafica
lease.at.residential.registration.summary=Il conduttore si iscrive presso l'autorità anagrafica entro 3 giorni dall'ingresso.
lease.at.residential.handover-inspection.title=Consegna e restituzione
lease.at.residential.handover-inspection.summary=Verbali di consegna e di restituzione, restituzione nello stato ricevuto e termini per le pretese.
lease.at.residential.termination.title=Cessazione
lease.at.residential.termination.summary=Secondo la MRG il locatore disdice solo per via giudiziale e per motivi importanti; termini di preavviso e risoluzione anticipata.
lease.at.residential.data-protection.title=Protezione dei dati
lease.at.residential.data-protection.summary=Trattamento dei dati personali del conduttore ai sensi del GDPR.
lease.at.residential.disputes.title=Controversie e disposizioni finali
lease.at.residential.disputes.summary=Diritto austriaco; tribunale distrettuale del luogo dell'abitazione; i contratti di locazione abitativa sono esenti dall'imposta sul contratto.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Parti
lease.at.commercial.parties.summary=Identifica il locatore e il conduttore con numero di registro delle imprese, partita IVA e rappresentanti.
lease.at.commercial.premises.title=Immobile locato
lease.at.commercial.premises.summary=Descrive i locali commerciali e indica il regime MRG applicabile.
lease.at.commercial.permitted-use.title=Destinazione
lease.at.commercial.permitted-use.summary=L'attività convenuta; modifiche solo con consenso; il mancato utilizzo può essere motivo di disdetta.
lease.at.commercial.term.title=Durata
lease.at.commercial.term.summary=Durata determinata o indeterminata; secondo la MRG la durata determinata richiede un patto scritto di scadenza.
lease.at.commercial.rent.title=Canone
lease.at.commercial.rent.summary=Il canone principale; in applicazione integrale della MRG limitato all'importo congruo, che il conduttore imprenditore può far valere solo se ha contestato in tempo.
lease.at.commercial.rent-adjustment.title=Indicizzazione
lease.at.commercial.rent-adjustment.summary=Indicizzazione sull'indice dei prezzi al consumo 2020 con una soglia da compilare, in aumento e in diminuzione.
lease.at.commercial.service-costs.title=Spese di esercizio
lease.at.commercial.service-costs.summary=Quota delle spese di esercizio e dei tributi pubblici in rate mensili con rendiconto annuale.
lease.at.commercial.vat.title=Opzione IVA
lease.at.commercial.vat.summary=Il locatore opta per l'IVA sul canone; il conduttore usa i locali quasi esclusivamente per operazioni imponibili.
lease.at.commercial.deposit.title=Deposito cauzionale
lease.at.commercial.deposit.summary=Deposito in contanti o garanzia bancaria senza limite di legge, restituito dopo la fine del contratto.
lease.at.commercial.payment.title=Pagamento
lease.at.commercial.payment.summary=Canone pagato mensilmente in anticipo; interessi di mora tra imprenditori di 9,2 punti percentuali sopra il tasso di base.
lease.at.commercial.maintenance.title=Manutenzione
lease.at.commercial.maintenance.summary=In applicazione integrale della MRG vale il § 3 MRG; altrimenti il locatore mantiene la struttura e le parti comuni, il conduttore l'interno.
lease.at.commercial.alterations.title=Opere e allestimento
lease.at.commercial.alterations.summary=Opere e insegne solo con consenso scritto; rimozione alla fine del contratto.
lease.at.commercial.subletting.title=Sublocazione e cessione d'azienda
lease.at.commercial.subletting.summary=Sublocazione soggetta a consenso; diritti di legge in caso di cessione o affitto dell'azienda in applicazione integrale della MRG.
lease.at.commercial.insurance.title=Assicurazioni
lease.at.commercial.insurance.summary=Il locatore assicura l'edificio; il conduttore arredi e responsabilità civile d'impresa.
lease.at.commercial.energy-certificate.title=Attestato di prestazione energetica
lease.at.commercial.energy-certificate.summary=Il locatore esibisce e consegna l'attestato di prestazione energetica (EAVG 2012).
lease.at.commercial.contract-fee.title=Imposta sul contratto
lease.at.commercial.contract-fee.summary=Imposta dell'1 per cento del valore del contratto secondo la legge sulle imposte (GebG), calcolata dal locatore e a carico del conduttore.
lease.at.commercial.handover-inspection.title=Consegna e restituzione
lease.at.commercial.handover-inspection.summary=Verbali di consegna e di restituzione, restituzione dei locali sgomberati e termini per le pretese.
lease.at.commercial.termination.title=Cessazione
lease.at.commercial.termination.summary=Disdetta per la fine di un trimestre solare con 3 mesi di preavviso; limiti alla disdetta del locatore secondo la MRG.
lease.at.commercial.data-protection.title=Protezione dei dati
lease.at.commercial.data-protection.summary=Trattamento dei dati personali di rappresentanti e referenti ai sensi del GDPR.
lease.at.commercial.disputes.title=Controversie
lease.at.commercial.disputes.summary=Diritto austriaco; è competente il tribunale distrettuale del luogo dei locali.
# ===== end AT =====


