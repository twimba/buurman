lease.it.residential.term.summary=Almeno 4 anni (o la maggiore durata convenuta), rinnovati per altri 4 salvo diniego del locatore per i motivi di legge; alla seconda scadenza procedura di rinnovo con raccomandata almeno 6 mesi prima.
lease.it.residential.rent.title=Canone
lease.it.residential.rent.summary=Canone convenuto dalle parti; è nulla ogni pattuizione di un canone superiore a quello del contratto scritto e registrato.
lease.it.residential.rent-adjustment.title=Aggiornamento del canone
lease.it.residential.rent-adjustment.summary=Aggiornamento annuale facoltativo in una quota convenuta della variazione ISTAT; sospeso se il locatore opta per la cedolare secca.
lease.it.residential.service-costs.title=Oneri accessori
lease.it.residential.service-costs.summary=Ripartizione legale degli oneri a carico del conduttore salvo patto contrario; pagamento entro 2 mesi dalla richiesta, con diritto al rendiconto e ai documenti.
lease.it.residential.deposit.title=Deposito cauzionale
lease.it.residential.deposit.summary=Deposito facoltativo non superiore a 3 mensilità, produttivo di interessi legali annuali; restituito al termine detratte le somme dovute.
lease.it.residential.payment.title=Pagamento
lease.it.residential.payment.summary=Pagamento periodico con bonifico nel giorno convenuto; salva la sanatoria giudiziale dell'art. 55, il mancato pagamento del canone decorsi 20 giorni dalla scadenza è motivo di risoluzione.
lease.it.residential.use.title=Uso
lease.it.residential.use.summary=Uso esclusivo come abitazione con la dovuta diligenza; il locatore può chiedere la risoluzione entro 3 mesi dalla conoscenza del mutamento d'uso.
lease.it.residential.subletting.title=Sublocazione
lease.it.residential.subletting.summary=Vietate la sublocazione totale e la cessione senza consenso; sublocazione parziale consentita previa raccomandata, salvo patto contrario.
lease.it.residential.maintenance.title=Manutenzione e riparazioni
lease.it.residential.maintenance.summary=Riparazioni necessarie a carico del locatore, piccola manutenzione del conduttore; riparazioni urgenti, riduzione del canone per lavori prolungati; l'occupante è responsabile dell'impianto termico.
lease.it.residential.energy-certificate.title=Attestato di prestazione energetica
lease.it.residential.energy-certificate.summary=Il conduttore dichiara di aver ricevuto informazioni e documentazione sull'APE; codice e classe dell'attestato; sanzioni di legge in caso di omissione.
lease.it.residential.registration.title=Registrazione e imposte
lease.it.residential.registration.summary=Il locatore registra il contratto entro 30 giorni e ne informa il conduttore e l'amministratore; spese ripartite a metà; cedolare secca facoltativa.
lease.it.residential.succession.title=Successione
lease.it.residential.succession.summary=Coniuge, eredi, parenti e affini conviventi e conviventi di fatto possono succedere in caso di morte del conduttore; regole per separazione e divorzio.
lease.it.residential.handover-inspection.title=Consegna e riconsegna
lease.it.residential.handover-inspection.summary=Verbale di consegna all'inizio; riconsegna nello stesso stato salvo il normale deterioramento; corrispettivo dovuto fino alla riconsegna in caso di mora.
lease.it.residential.termination.title=Recesso e diniego del rinnovo
lease.it.residential.termination.summary=Il conduttore può recedere per gravi motivi con preavviso di 6 mesi; il locatore può negare il rinnovo alla prima scadenza solo per i motivi di legge.
lease.it.residential.notices.title=Comunicazioni
lease.it.residential.notices.summary=Raccomandata nei casi previsti dalla legge; indirizzi e indirizzi di posta elettronica certificata per le comunicazioni.
lease.it.residential.guarantor.title=Fideiussore
lease.it.residential.guarantor.summary=Fideiussione facoltativa fino a un importo massimo, con obbligazione solidale; estensione oltre la prima scadenza solo se convenuta.
lease.it.residential.data-protection.title=Protezione dei dati
lease.it.residential.data-protection.summary=Dati personali trattati solo per il contratto e gli obblighi di legge, secondo il GDPR e il Codice in materia di protezione dei dati personali.
lease.it.residential.disputes.title=Controversie
lease.it.residential.disputes.summary=Legge italiana; foro del luogo dell'immobile; mediazione obbligatoria prima della maggior parte delle azioni in materia di locazione.
lease.it.commercial.parties.title=Parti
lease.it.commercial.parties.summary=Identifica il locatore e il conduttore con i dati societari, il codice fiscale, la partita IVA, il numero del registro delle imprese e il legale rappresentante.
lease.it.commercial.premises.title=Immobile
lease.it.commercial.premises.summary=Descrive l'immobile con i dati catastali e la destinazione d'uso dichiarata; non per abitazioni o locazioni stagionali.
lease.it.commercial.permitted-use.title=Destinazione d'uso
lease.it.commercial.permitted-use.summary=Attività esercitata e indicazione dei contatti diretti con il pubblico; licenze a carico del conduttore; regole sul mutamento d'uso.
lease.it.commercial.term.title=Durata e rinnovazione
lease.it.commercial.term.summary=Almeno 6 anni (9 per alberghi e teatri) con rinnovazione tacita; diniego del locatore alla prima scadenza solo per i motivi di legge, con 12 o 18 mesi di anticipo.
lease.it.commercial.rent.title=Canone
lease.it.commercial.rent.summary=Canone convenuto dalle parti; sono nulle le pattuizioni che attribuiscono al locatore vantaggi in contrasto con la legge 392/1978.
lease.it.commercial.rent-adjustment.title=Aggiornamento del canone
lease.it.commercial.rent-adjustment.summary=Aggiornamento annuale facoltativo su richiesta del locatore; aumenti limitati al 75% della variazione ISTAT per i contratti di durata non superiore a quella legale.
lease.it.commercial.service-costs.title=Oneri accessori
lease.it.commercial.service-costs.summary=Ripartizione legale degli oneri salvo patto contrario; pagamento entro 2 mesi dalla richiesta, con diritto al rendiconto e ai documenti.
lease.it.commercial.vat.title=IVA
lease.it.commercial.vat.summary=Locazione esente da IVA salvo opzione del locatore per l'imposizione per i fabbricati strumentali; indicazione dell'opzione e dell'aliquota.
lease.it.commercial.deposit.title=Deposito cauzionale
lease.it.commercial.deposit.summary=Deposito facoltativo non superiore a 3 mensilità, produttivo di interessi legali annuali; restituito al termine detratte le somme dovute.
lease.it.commercial.payment.title=Pagamento
lease.it.commercial.payment.summary=Pagamento periodico con bonifico nel giorno convenuto; quietanza o fattura; risoluzione solo per inadempimento non di scarsa importanza.
lease.it.commercial.maintenance.title=Manutenzione e riparazioni
lease.it.commercial.maintenance.summary=Riparazioni necessarie a carico del locatore, piccola manutenzione del conduttore salvo patto diverso; riparazioni urgenti, riduzione del canone per lavori prolungati.
lease.it.commercial.alterations.title=Opere e allestimento
lease.it.commercial.alterations.summary=Opere solo con il consenso scritto del locatore; regole di legge sull'indennità per i miglioramenti e sulla rimozione delle addizioni.
lease.it.commercial.assignment.title=Sublocazione e cessione
lease.it.commercial.assignment.summary=Sublocazione o cessione senza consenso insieme all'azienda, salva opposizione del locatore per gravi motivi entro 30 giorni; negli altri casi serve il consenso.
lease.it.commercial.pre-emption.title=Prelazione
lease.it.commercial.pre-emption.summary=Diritto di prelazione e di riscatto del conduttore in caso di vendita e di nuova locazione, esclusi gli immobili senza contatti con il pubblico e gli altri casi previsti.
lease.it.commercial.goodwill-compensation.title=Indennità per la perdita dell'avviamento
lease.it.commercial.goodwill-compensation.summary=18 mensilità (21 per gli alberghi) se il rapporto cessa per cause diverse da inadempimento, disdetta, recesso o procedure concorsuali del conduttore; esclusi gli immobili senza contatti con il pubblico e gli altri casi previsti.
lease.it.commercial.insurance.title=Assicurazione
lease.it.commercial.insurance.summary=Il conduttore risponde della perdita e dei danni da incendio salvo causa non imputabile; assicurazione di responsabilità del conduttore e del fabbricato a cura del locatore.
lease.it.commercial.energy-certificate.title=Attestato di prestazione energetica
lease.it.commercial.energy-certificate.summary=Il conduttore dichiara di aver ricevuto informazioni e documentazione sull'APE, con copia allegata ove richiesto; sanzioni di legge in caso di omissione.
lease.it.commercial.registration.title=Registrazione e imposte
lease.it.commercial.registration.summary=Registrazione entro 30 giorni, spese ripartite a metà; imposta di registro dell'1% o del 2%; la cedolare secca non si applica.
lease.it.commercial.handover-inspection.title=Consegna e riconsegna
lease.it.commercial.handover-inspection.summary=Verbale di consegna all'inizio; riconsegna nello stesso stato salvo il normale deterioramento; corrispettivo dovuto fino alla riconsegna in caso di mora.
lease.it.commercial.termination.title=Recesso e risoluzione
lease.it.commercial.termination.summary=Il conduttore può recedere per gravi motivi con preavviso di 6 mesi e, se convenuto, in qualsiasi momento con lo stesso preavviso; diniego del locatore solo alla prima scadenza; risoluzione per inadempimento.
lease.it.commercial.notices.title=Comunicazioni
lease.it.commercial.notices.summary=Raccomandata o notificazione a mezzo di ufficiale giudiziario nei casi previsti dalla legge; indirizzi e posta elettronica certificata.
lease.it.commercial.guarantor.title=Garanzia
lease.it.commercial.guarantor.summary=Fideiussione personale, bancaria o assicurativa facoltativa fino a un importo massimo; estensione oltre la prima scadenza solo se convenuta.
lease.it.commercial.data-protection.title=Protezione dei dati
lease.it.commercial.data-protection.summary=Dati personali delle persone che agiscono per le parti trattati solo per il contratto, secondo il GDPR e il Codice in materia di protezione dei dati personali.
lease.it.commercial.disputes.title=Controversie
lease.it.commercial.disputes.summary=Legge italiana; foro del luogo dell'immobile; mediazione obbligatoria prima della maggior parte delle azioni in materia di locazione.
# ===== end IT =====


# ===== LU lease clause titles and summaries (country pack) =====
lease.lu.residential.parties.title=Parti
lease.lu.residential.parties.summary=Identità completa del locatore e di ogni conduttore; contratto in forma scritta a pena di nullità.
lease.lu.residential.premises.title=Immobile
lease.lu.residential.premises.summary=Descrizione dell'alloggio con riferimento catastale e tutti i locali e le parti locate.
lease.lu.residential.term.title=Durata
lease.lu.residential.term.summary=Durata determinata o indeterminata; alla scadenza il contratto è prorogato a tempo indeterminato salvo eccezioni di legge.
lease.lu.residential.rent.title=Canone
lease.lu.residential.rent.summary=Canone al netto degli oneri, non superiore al 5% annuo del capitale investito; spese di agenzia divise a metà.
lease.lu.residential.rent-adjustment.title=Adeguamento del canone
lease.lu.residential.rent-adjustment.summary=Canone adeguato al massimo ogni 2 anni; l'aumento non può superare il 10%.
lease.lu.residential.service-costs.title=Oneri accessori
lease.lu.residential.service-costs.summary=Spese ripetibili, acconti o forfait e la loro ripartizione annuale.
lease.lu.residential.deposit.title=Garanzia locativa
lease.lu.residential.deposit.summary=Garanzia non superiore a 2 mensilità, restituita in 2 fasi dopo la fine della locazione.
lease.lu.residential.payment.title=Pagamento
lease.lu.residential.payment.summary=Pagamento anticipato, scadenza e interessi legali in caso di ritardo.
lease.lu.residential.use.title=Uso
lease.lu.residential.use.summary=Uso abitativo diligente, modifiche e accesso all'alloggio.
lease.lu.residential.subletting.title=Cessione e sublocazione
lease.lu.residential.subletting.summary=Cessione ammessa salvo divieto espresso; sublocazione con consenso.
lease.lu.residential.shared-tenancy.title=Coabitazione
lease.lu.residential.shared-tenancy.summary=Regime facoltativo di coabitazione con patto, responsabilità solidale e regole di recesso proprie.
lease.lu.residential.maintenance.title=Manutenzione
lease.lu.residential.maintenance.summary=Ripartizione delle riparazioni tra locatore e conduttore, requisiti di abitabilità e rilevatori di fumo.
lease.lu.residential.energy-certificate.title=Attestato di prestazione energetica
lease.lu.residential.energy-certificate.summary=Copia conforme del certificato di prestazione energetica consegnata al conduttore.
lease.lu.residential.pre-emption.title=Diritto di prelazione
lease.lu.residential.pre-emption.summary=Diritto di prelazione del conduttore dopo una locazione di almeno 18 anni.
lease.lu.residential.succession.title=Prosecuzione della locazione
lease.lu.residential.succession.summary=Prosecuzione a favore di coniuge, partner o conviventi in caso di abbandono o morte.
lease.lu.residential.handover-inspection.title=Verbale di consegna
lease.lu.residential.handover-inspection.summary=Verbali in contraddittorio di ingresso e di uscita, obbligatori in presenza di garanzia.
lease.lu.residential.termination.title=Recesso
lease.lu.residential.termination.summary=Preavviso di 3 mesi per il conduttore nel contratto a tempo indeterminato; locatore solo per motivi di legge, 6 mesi per necessità personale.
lease.lu.residential.data-protection.title=Protezione dei dati
lease.lu.residential.data-protection.summary=Trattamento dei dati personali del conduttore secondo il GDPR.
lease.lu.residential.disputes.title=Controversie
lease.lu.residential.disputes.summary=Commissione degli affitti per le liti sul canone, giudice di pace per le altre controversie.
lease.lu.commercial.parties.title=Parti
lease.lu.commercial.parties.summary=Identificazione di locatore e conduttore con numero RCS, partita IVA, autorizzazione di stabilimento e rappresentanti.
lease.lu.commercial.premises.title=Immobile
lease.lu.commercial.premises.summary=Descrizione dei locali e ambito delle norme sulla locazione commerciale.
lease.lu.commercial.permitted-use.title=Destinazione d'uso
lease.lu.commercial.permitted-use.summary=Attività consentita nei locali e autorizzazioni del conduttore.
lease.lu.commercial.term.title=Durata
lease.lu.commercial.term.summary=Durata determinata o indeterminata, opponibile all'acquirente, rinnovo tacito a tempo indeterminato.
lease.lu.commercial.rent.title=Canone
lease.lu.commercial.rent.summary=Canone liberamente concordato; ogni supplemento pagato per la conclusione del contratto è nullo.
lease.lu.commercial.rent-adjustment.title=Indicizzazione
lease.lu.commercial.rent-adjustment.summary=Indicizzazione annuale all'indice nazionale dei prezzi al consumo (STATEC).
lease.lu.commercial.service-costs.title=Oneri accessori
lease.lu.commercial.service-costs.summary=Oneri e imposte a carico del conduttore, con acconti e conguaglio annuale.
lease.lu.commercial.vat.title=IVA
lease.lu.commercial.vat.summary=Locazione esente con opzione del locatore per l'applicazione dell'IVA.
lease.lu.commercial.deposit.title=Garanzia locativa
lease.lu.commercial.deposit.summary=Garanzia non superiore a 6 mensilità; una garanzia bancaria a prima richiesta non può essere rifiutata.
lease.lu.commercial.payment.title=Pagamento
lease.lu.commercial.payment.summary=Pagamento anticipato, scadenza e interessi legali in caso di ritardo.
lease.lu.commercial.maintenance.title=Manutenzione
lease.lu.commercial.maintenance.summary=Ripartizione delle riparazioni tra locatore e conduttore.
lease.lu.commercial.alterations.title=Opere e migliorie
lease.lu.commercial.alterations.summary=Opere solo con il consenso del locatore e sorte delle migliorie al termine.
lease.lu.commercial.assignment.title=Cessione e sublocazione
lease.lu.commercial.assignment.summary=La cessione o la sublocazione insieme all'azienda non può essere vietata se resta stabilita un'attività identica; notifica e gradimento.
lease.lu.commercial.insurance.title=Assicurazione
lease.lu.commercial.insurance.summary=Assicurazione di responsabilità e d'esercizio del conduttore.
lease.lu.commercial.energy-certificate.title=Attestato di prestazione energetica
lease.lu.commercial.energy-certificate.summary=Copia del certificato di prestazione energetica quando la normativa lo richiede.
lease.lu.commercial.handover-inspection.title=Verbale di consegna
lease.lu.commercial.handover-inspection.summary=Verbali in contraddittorio di ingresso e di uscita.
lease.lu.commercial.renewal.title=Rinnovo
lease.lu.commercial.renewal.summary=Il conduttore può chiedere il rinnovo almeno 6 mesi prima della scadenza; dopo 9 anni il locatore può porre fine al contratto con un'indennità.
lease.lu.commercial.pre-emption.title=Diritto di prelazione
lease.lu.commercial.pre-emption.summary=Diritto di prelazione del conduttore dopo una locazione di almeno 18 anni.
lease.lu.commercial.termination.title=Recesso
lease.lu.commercial.termination.summary=Preavviso di almeno 6 mesi con raccomandata; motivi del locatore e rinvio dello sfratto.
lease.lu.commercial.data-protection.title=Protezione dei dati
lease.lu.commercial.data-protection.summary=Trattamento dei dati personali delle parti secondo il GDPR.
lease.lu.commercial.disputes.title=Controversie
lease.lu.commercial.disputes.summary=Diritto lussemburghese e giudice di pace del luogo dei locali.
