# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Parti
lease.nl.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido.
lease.nl.residential.premises.title=Immobile locato
lease.nl.residential.premises.summary=Descrive l'abitazione locata e applica il diritto olandese della locazione abitativa.
lease.nl.residential.term.title=Durata
lease.nl.residential.term.summary=Data di decorrenza e se la locazione è a tempo indeterminato o determinato.
lease.nl.residential.rent.title=Canone
lease.nl.residential.rent.summary=Il canone base e il diritto del conduttore alla verifica da parte della commissione affitti.
lease.nl.residential.rent-adjustment.title=Adeguamento del canone
lease.nl.residential.rent-adjustment.summary=Adeguamento annuale del canone, mai superiore all'aumento massimo di legge.
lease.nl.residential.service-costs.title=Spese di servizio
lease.nl.residential.service-costs.summary=Acconti per utenze e servizi con un rendiconto annuale.
lease.nl.residential.deposit.title=Deposito cauzionale
lease.nl.residential.deposit.summary=Deposito di al massimo due canoni base, restituito entro il termine di legge.
lease.nl.residential.payment.title=Pagamento
lease.nl.residential.payment.summary=Quando e come si paga il canone, anticipatamente per ogni periodo.
lease.nl.residential.use.title=Uso
lease.nl.residential.use.summary=Uso esclusivo come abitazione, da buon conduttore, e modifiche all'immobile.
lease.nl.residential.subletting.title=Sublocazione
lease.nl.residential.subletting.summary=Sublocazione solo con consenso scritto del locatore, salvi i diritti di legge.
lease.nl.residential.maintenance.title=Manutenzione e riparazioni
lease.nl.residential.maintenance.summary=Il locatore elimina i difetti; il conduttore esegue le piccole riparazioni.
lease.nl.residential.energy-label.title=Attestato energetico
lease.nl.residential.energy-label.summary=Il locatore consegna copia dell'etichetta energetica valida dell'abitazione.
lease.nl.residential.handover-inspection.title=Verifica e riconsegna
lease.nl.residential.handover-inspection.summary=Verbale di stato iniziale, pre-ispezione e ispezione finale alla riconsegna.
lease.nl.residential.termination.title=Cessazione
lease.nl.residential.termination.summary=Termini di preavviso e motivi di legge per il recesso del locatore.
lease.nl.residential.data-protection.title=Protezione dei dati
lease.nl.residential.data-protection.summary=Trattamento dei dati personali del conduttore ai sensi del GDPR.
lease.nl.residential.disputes.title=Controversie
lease.nl.residential.disputes.summary=Si applica il diritto olandese; le controversie vanno alla commissione affitti o al giudice.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Parti
lease.de.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido.
lease.de.residential.premises.title=Immobile locato
lease.de.residential.premises.summary=Descrive l'abitazione locata e applica il diritto tedesco della locazione abitativa (BGB).
lease.de.residential.term.title=Durata
lease.de.residential.term.summary=Data di inizio; durata indeterminata, o determinata solo con un motivo di legge comunicato per iscritto.
lease.de.residential.rent.title=Canone
lease.de.residential.rent.summary=Il canone netto e il limite al canone iniziale nelle zone ad alta tensione abitativa.
lease.de.residential.rent-adjustment.title=Aumento del canone
lease.de.residential.rent-adjustment.summary=Aumenti di legge fino al canone comparativo locale, entro il limite massimo.
lease.de.residential.service-costs.title=Oneri accessori
lease.de.residential.service-costs.summary=Acconti sugli oneri accessori con rendiconto annuale entro il termine di legge.
lease.de.residential.deposit.title=Deposito cauzionale
lease.de.residential.deposit.summary=Deposito di al massimo 3 mensilità di canone netto, pagabile a rate e tenuto separato.
lease.de.residential.payment.title=Pagamento
lease.de.residential.payment.summary=Il canone si paga anticipatamente, entro il 3° giorno lavorativo di ciascun periodo.
lease.de.residential.use.title=Uso
lease.de.residential.use.summary=Uso esclusivamente abitativo, uso diligente e modifiche solo con il consenso del locatore.
lease.de.residential.subletting.title=Sublocazione
lease.de.residential.subletting.summary=Uso da parte di terzi solo con autorizzazione; diritto di legge del conduttore di sublocare parte dell'abitazione.
lease.de.residential.maintenance.title=Manutenzione e vizi
lease.de.residential.maintenance.summary=Il locatore mantiene l'abitazione; riduzione del canone per vizi; nessuna tinteggiatura a carico del conduttore.
lease.de.residential.minor-repairs.title=Piccole riparazioni
lease.de.residential.minor-repairs.summary=Il conduttore sostiene il costo delle piccole riparazioni fino a un importo per intervento e per anno da compilare.
lease.de.residential.energy-certificate.title=Attestato energetico
lease.de.residential.energy-certificate.summary=Il locatore esibisce e consegna l'attestato di prestazione energetica (GModG).
lease.de.residential.registration.title=Conferma di residenza
lease.de.residential.registration.summary=Il locatore conferma l'ingresso affinché il conduttore possa registrarsi presso l'autorità.
lease.de.residential.handover-inspection.title=Consegna e riconsegna
lease.de.residential.handover-inspection.summary=Verbali di consegna e riconsegna, restituzione dell'abitazione e prescrizione di 6 mesi.
lease.de.residential.termination.title=Disdetta
lease.de.residential.termination.summary=Disdetta scritta, termini di preavviso di legge e interesse legittimo richiesto al locatore.
lease.de.residential.data-protection.title=Protezione dei dati
lease.de.residential.data-protection.summary=Trattamento dei dati personali del conduttore in conformità al GDPR.
lease.de.residential.disputes.title=Controversie
lease.de.residential.disputes.summary=Si applica il diritto tedesco; è competente in via esclusiva il tribunale locale (Amtsgericht) del luogo dell'abitazione.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Parti
lease.de.commercial.parties.summary=Identifica il locatore e il conduttore con numero di registro, partita IVA e rappresentanti.
lease.de.commercial.premises.title=Immobile locato
lease.de.commercial.premises.summary=Descrive i locali commerciali e applica le norme del BGB sulla locazione di locali commerciali.
lease.de.commercial.permitted-use.title=Destinazione d'uso
lease.de.commercial.permitted-use.summary=L'attività convenuta; le modifiche richiedono il consenso; il conduttore ottiene le autorizzazioni.
lease.de.commercial.term.title=Durata
lease.de.commercial.term.summary=Durata determinata o indeterminata; oltre 1 anno serve la forma testuale, altrimenti vale a tempo indeterminato.
lease.de.commercial.rent.title=Canone
lease.de.commercial.rent.summary=Il canone netto liberamente convenuto, più IVA e acconti ove convenuto.
lease.de.commercial.rent-adjustment.title=Aggiornamento del canone
lease.de.commercial.rent-adjustment.summary=Clausola di indicizzazione all'indice dei prezzi al consumo, ammessa solo per contratti di lunga durata (PrKG).
lease.de.commercial.service-costs.title=Oneri accessori
lease.de.commercial.service-costs.summary=Oneri secondo la BetrKV e voci aggiuntive elencate, con acconti e rendiconto annuale.
lease.de.commercial.vat.title=Opzione IVA
lease.de.commercial.vat.summary=Il locatore opta per l'IVA sul canone; il conduttore usa i locali solo per operazioni con diritto alla detrazione.
lease.de.commercial.deposit.title=Garanzia
lease.de.commercial.deposit.summary=Deposito in contanti o fideiussione bancaria, senza limite di legge per i locali commerciali.
lease.de.commercial.payment.title=Pagamento
lease.de.commercial.payment.summary=Canone anticipato entro il 3° giorno lavorativo; limiti alla compensazione e interessi di mora commerciali.
lease.de.commercial.maintenance.title=Manutenzione e riparazioni
lease.de.commercial.maintenance.summary=Il locatore cura le strutture e le parti comuni; il conduttore cura l'interno dei locali.
lease.de.commercial.alterations.title=Modifiche e allestimento
lease.de.commercial.alterations.summary=Opere e insegne del conduttore solo con consenso in forma testuale; rimozione alla fine della locazione.
lease.de.commercial.subletting.title=Sublocazione
lease.de.commercial.subletting.summary=Uso da parte di terzi solo con autorizzazione; diritto speciale di recesso in caso di rifiuto.
lease.de.commercial.competition.title=Tutela dalla concorrenza
lease.de.commercial.competition.summary=Il locatore non loca a un concorrente con lo stesso assortimento principale.
lease.de.commercial.insurance.title=Assicurazioni
lease.de.commercial.insurance.summary=Il locatore assicura l'edificio; il conduttore assicura i propri beni e ha una RC professionale.
lease.de.commercial.energy-certificate.title=Attestato energetico
lease.de.commercial.energy-certificate.summary=Il locatore esibisce e consegna l'attestato di prestazione energetica (GModG).
lease.de.commercial.handover-inspection.title=Consegna e riconsegna
lease.de.commercial.handover-inspection.summary=Verbali di consegna e riconsegna, restituzione dei locali sgomberi e prescrizione di 6 mesi.
lease.de.commercial.termination.title=Disdetta
lease.de.commercial.termination.summary=Disdetta entro il 3° giorno lavorativo di un trimestre per la fine del trimestre successivo; recesso straordinario.
lease.de.commercial.data-protection.title=Protezione dei dati
lease.de.commercial.data-protection.summary=Trattamento dei dati personali di rappresentanti e referenti in conformità al GDPR.
lease.de.commercial.disputes.title=Controversie
lease.de.commercial.disputes.summary=Si applica il diritto tedesco; è competente in via esclusiva il tribunale del luogo dei locali.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Parti
lease.fr.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido nei limiti di legge.
lease.fr.residential.premises.title=Immobile locato
lease.fr.residential.premises.summary=Descrive l'alloggio non ammobiliato locato come residenza principale ai sensi della legge del 6 luglio 1989 e del contratto tipo.
lease.fr.residential.term.title=Durata
lease.fr.residential.term.summary=Data di decorrenza, durata minima di 3 o 6 anni secondo il locatore e rinnovo tacito.
lease.fr.residential.rent.title=Canone
lease.fr.residential.rent.summary=Il canone al netto degli oneri e i limiti applicabili nelle zone ad alta tensione abitativa e di controllo dei canoni.
lease.fr.residential.rent-adjustment.title=Revisione del canone
lease.fr.residential.rent-adjustment.summary=Revisione annuale entro l'indice di riferimento dei canoni (IRL); nessuna revisione nelle classi energetiche F e G.
lease.fr.residential.service-costs.title=Oneri accessori
lease.fr.residential.service-costs.summary=Oneri recuperabili pagati in acconto con conguaglio annuale e documenti giustificativi.
lease.fr.residential.deposit.title=Deposito cauzionale
lease.fr.residential.deposit.summary=Deposito cauzionale non superiore a 1 mensilità al netto degli oneri, restituito entro 1 o 2 mesi.
lease.fr.residential.payment.title=Pagamento
lease.fr.residential.payment.summary=Tempi e modalità di pagamento del canone; pagamento mensile su richiesta, quietanze gratuite e nessuna penale.
lease.fr.residential.use.title=Uso
lease.fr.residential.use.summary=Uso pacifico come residenza principale; modifiche solo con il consenso scritto del locatore.
lease.fr.residential.subletting.title=Sublocazione
lease.fr.residential.subletting.summary=Cessione e sublocazione solo con il consenso scritto del locatore, anche sul canone.
lease.fr.residential.maintenance.title=Manutenzione e riparazioni
lease.fr.residential.maintenance.summary=Obblighi del locatore di decoro abitativo e riparazione, manutenzione ordinaria del conduttore e accesso per i lavori.
lease.fr.residential.works.title=Lavori
lease.fr.residential.works.summary=Lavori eseguiti dall'ultimo contratto e lavori di miglioria concordati con l'eventuale aumento del canone.
lease.fr.residential.diagnostics.title=Diagnosi tecniche
lease.fr.residential.diagnostics.summary=Fascicolo delle diagnosi tecniche allegato al contratto, classe energetica e prestazione energetica minima.
lease.fr.residential.insurance.title=Assicurazione
lease.fr.residential.insurance.summary=Il conduttore assicura i rischi locativi e ne fornisce prova ogni anno su richiesta.
lease.fr.residential.handover-inspection.title=Verbale di stato
lease.fr.residential.handover-inspection.summary=Verbali di consegna e di riconsegna redatti in contraddittorio o da un ufficiale giudiziario.
lease.fr.residential.termination.title=Recesso e risoluzione
lease.fr.residential.termination.summary=Recesso del conduttore (3 o 1 mese) e disdetta del locatore (6 mesi, motivi di legge); clausola risolutiva.
lease.fr.residential.annexes.title=Allegati
lease.fr.residential.annexes.summary=Allegati obbligatori: nota informativa, fascicolo delle diagnosi, verbale di consegna ed estratti del regolamento di condominio.
lease.fr.residential.data-protection.title=Protezione dei dati
lease.fr.residential.data-protection.summary=Trattamento dei dati personali del conduttore in conformità al GDPR.
lease.fr.residential.disputes.title=Controversie
lease.fr.residential.disputes.summary=Si applica il diritto francese; commissione di conciliazione e giudice del contenzioso di tutela.
# FR commercial (bail commercial) clauses: title and one-line summary for the clause toggle UI.
lease.fr.commercial.parties.title=Parti
lease.fr.commercial.parties.summary=Identifica il locatore e il conduttore con numero di iscrizione, partita IVA e rappresentanti.
lease.fr.commercial.premises.title=Immobile locato
lease.fr.commercial.premises.summary=Descrive i locali e applica il regime legale delle locazioni commerciali.
lease.fr.commercial.permitted-use.title=Destinazione d'uso
lease.fr.commercial.permitted-use.summary=L'attività consentita nei locali e il diritto del conduttore di aggiungere attività connesse.
lease.fr.commercial.term.title=Durata
lease.fr.commercial.term.summary=Durata minima di 9 anni con facoltà di recesso del conduttore alla scadenza di ogni periodo di 3 anni.
lease.fr.commercial.rent.title=Canone
lease.fr.commercial.rent.summary=Il canone iniziale e il limite del canone al rinnovo.
lease.fr.commercial.rent-adjustment.title=Indicizzazione
lease.fr.commercial.rent-adjustment.summary=Indicizzazione annuale secondo l'indice ILC o ILAT e revisione legale del canone.
lease.fr.commercial.service-costs.title=Oneri e imposte
lease.fr.commercial.service-costs.summary=Inventario tassativo di oneri e imposte, spese non addebitabili e rendiconto annuale.
lease.fr.commercial.vat.title=IVA
lease.fr.commercial.vat.summary=Esenzione IVA dei locali non arredati e opzione del locatore per l'IVA.
lease.fr.commercial.deposit.title=Deposito cauzionale
lease.fr.commercial.deposit.summary=Deposito cauzionale, limitato a 1 trimestre di canone per commercio e artigianato, restituito entro 3 mesi.
lease.fr.commercial.payment.title=Pagamento
lease.fr.commercial.payment.summary=Pagamento anticipato del canone e diritto al pagamento mensile per commercio e artigianato.
lease.fr.commercial.maintenance.title=Manutenzione e riparazioni
lease.fr.commercial.maintenance.summary=Obblighi di riparazione del locatore, grandi riparazioni non addebitabili al conduttore, manutenzione ordinaria.
lease.fr.commercial.alterations.title=Lavori e allestimenti
lease.fr.commercial.alterations.summary=Lavori e allestimenti solo con il consenso preventivo e scritto del locatore.
lease.fr.commercial.assignment.title=Cessione
lease.fr.commercial.assignment.summary=Cessione del contratto con la vendita dell'azienda e limite di 3 anni della garanzia del cedente.
lease.fr.commercial.subletting.title=Sublocazione
lease.fr.commercial.subletting.summary=Sublocazione solo se consentita dal contratto o dal locatore, che interviene nell'atto.
lease.fr.commercial.insurance.title=Assicurazione
lease.fr.commercial.insurance.summary=Assicurazione dell'edificio da parte del locatore e dell'attività e della responsabilità da parte del conduttore.
lease.fr.commercial.diagnostics.title=Diagnosi
lease.fr.commercial.diagnostics.summary=Diagnosi di prestazione energetica, dichiarazione dei rischi, informazioni sull'amianto e allegato ambientale.
lease.fr.commercial.handover-inspection.title=Verbale di stato
lease.fr.commercial.handover-inspection.summary=Verbali di stato alla consegna, alle cessioni e alla riconsegna dei locali.
lease.fr.commercial.renewal.title=Rinnovo
lease.fr.commercial.renewal.summary=Diritto del conduttore al rinnovo, indennità di sfratto e disdetta con atto stragiudiziale.
lease.fr.commercial.pre-emption.title=Diritto di prelazione
lease.fr.commercial.pre-emption.summary=Diritto di prelazione del conduttore in caso di vendita di locali commerciali o artigianali.
lease.fr.commercial.termination.title=Risoluzione
lease.fr.commercial.termination.summary=Fine del contratto e clausola risolutiva 1 mese dopo un'intimazione rimasta senza esito.
lease.fr.commercial.data-protection.title=Protezione dei dati
lease.fr.commercial.data-protection.summary=Trattamento dei dati personali delle parti e dei loro referenti in conformità al GDPR.
lease.fr.commercial.disputes.title=Controversie
lease.fr.commercial.disputes.summary=Si applica il diritto francese; commissione di conciliazione e tribunale del luogo dell'immobile.
