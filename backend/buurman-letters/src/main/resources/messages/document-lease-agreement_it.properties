lease.pt.residential.subletting.summary=Cessione, sublocazione o comodato solo con autorizzazione del locatore, scritta per la sublocazione.
lease.pt.residential.maintenance.title=Manutenzione e lavori
lease.pt.residential.maintenance.summary=Lavori di conservazione a carico del locatore salvo patto contrario; lavori del conduttore solo con autorizzazione scritta.
