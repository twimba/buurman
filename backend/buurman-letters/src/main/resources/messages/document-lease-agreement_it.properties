# ===== GB lease clause titles and summaries (country pack) =====
lease.gb.residential.parties.title=Parti
lease.gb.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido; in Galles il conduttore è il contract-holder.
lease.gb.residential.premises.title=Immobile
lease.gb.residential.premises.summary=Descrive l'abitazione locata e il regime della nazione: assured tenancy (Inghilterra), standard occupation contract (Galles), private residential tenancy (Scozia) o private tenancy (Irlanda del Nord).
lease.gb.residential.term.title=Durata
lease.gb.residential.term.summary=Data di decorrenza; locazione periodica senza termine fisso in Inghilterra e in Scozia, periodica o a tempo determinato in Galles e in Irlanda del Nord.
lease.gb.residential.rent.title=Canone
lease.gb.residential.rent.summary=Il canone e il periodo di canone; in Inghilterra il periodo di canone non può superare 1 mese.
lease.gb.residential.rent-adjustment.title=Aumenti del canone
lease.gb.residential.rent-adjustment.summary=Aumento solo nei casi previsti dalla legge: in Inghilterra con avviso ai sensi della section 13 o decisione del tribunale; 2 mesi in Inghilterra e in Galles, 3 mesi in Scozia e in Irlanda del Nord, al massimo 1 aumento all'anno.
lease.gb.residential.service-costs.title=Utenze e imposta locale
lease.gb.residential.service-costs.summary=Utenze e council tax o domestic rates a carico del conduttore, ed eventuali spese da pagare al locatore.
lease.gb.residential.deposit.title=Deposito cauzionale
lease.gb.residential.deposit.summary=Deposito protetto in un sistema autorizzato; limitato a 5 o 6 settimane di canone in Inghilterra, 2 mesi di canone in Scozia e 1 mese di canone in Irlanda del Nord.
lease.gb.residential.payment.title=Pagamento
lease.gb.residential.payment.summary=Data e modalità di pagamento; in Inghilterra nessun canone prima del periodo di canone e interessi di mora limitati al 3% oltre il tasso di riferimento.
lease.gb.residential.fees.title=Spese e pagamenti consentiti
lease.gb.residential.fees.summary=Possono essere richiesti solo i pagamenti consentiti: Tenant Fees Act 2019 in Inghilterra, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 in Galles.
lease.gb.residential.use.title=Uso e animali
lease.gb.residential.use.summary=Uso come abitazione senza comportamenti antisociali; animali con il consenso del locatore, che non può essere negato senza un motivo ragionevole.
lease.gb.residential.subletting.title=Sublocazione e cessione
lease.gb.residential.subletting.summary=Cessione, sublocazione e ospiti paganti solo con il consenso del locatore.
lease.gb.residential.maintenance.title=Riparazioni e abitabilità
lease.gb.residential.maintenance.summary=Gli obblighi legali di riparazione e abitabilità del locatore in ciascuna nazione; il conduttore segnala i difetti e consente l'accesso con preavviso di 24 ore.
lease.gb.residential.safety.title=Sicurezza
lease.gb.residential.safety.summary=Controllo di sicurezza del gas ogni 12 mesi, verifica elettrica almeno ogni 5 anni, rilevatori di fumo e di monossido di carbonio.
lease.gb.residential.energy-certificate.title=Attestato di prestazione energetica
lease.gb.residential.energy-certificate.summary=Il locatore fornisce un attestato di prestazione energetica valido; in Inghilterra e in Galles l'abitazione deve avere almeno la classe E.
lease.gb.residential.registration.title=Registrazione e licenze
lease.gb.residential.registration.summary=Registrazione del locatore in Galles, in Scozia e in Irlanda del Nord ed eventuale licenza richiesta dall'autorità locale.
lease.gb.residential.right-to-rent.title=Diritto di locare
lease.gb.residential.right-to-rent.summary=Verifica del diritto di soggiorno (right to rent) degli occupanti adulti, applicabile solo in Inghilterra.
lease.gb.residential.statutory-information.title=Informazioni obbligatorie
lease.gb.residential.statutory-information.summary=La dichiarazione scritta, le condizioni o le informazioni che il locatore deve fornire secondo il diritto di ciascuna nazione, e un indirizzo per le comunicazioni.
lease.gb.residential.handover-inspection.title=Inventario e riconsegna
lease.gb.residential.handover-inspection.summary=Inventario e verbale dello stato all'inizio; riconsegna dell'abitazione alla fine, salvo il normale deterioramento.
lease.gb.residential.termination.title=Cessazione
lease.gb.residential.termination.summary=Il preavviso del conduttore e i motivi e gli avvisi legali del locatore in ciascuna nazione; nessuno sfratto ai sensi della section 21 in Inghilterra.
lease.gb.residential.notices.title=Comunicazioni
lease.gb.residential.notices.summary=Comunicazioni scritte consegnate a mano, per posta o, ove consentito, per posta elettronica.
lease.gb.residential.data-protection.title=Protezione dei dati
lease.gb.residential.data-protection.summary=Trattamento dei dati personali del conduttore secondo il UK GDPR e il Data Protection Act 2018.
