lease.pt.residential.pre-emption.summary=Diritto di prelazione del conduttore in caso di vendita dopo 2 anni di locazione e posizione dell'acquirente.
lease.pt.residential.succession.title=Successione nel contratto
lease.pt.residential.succession.summary=Persone a cui si trasmette la locazione alla morte del conduttore e comunicazione entro 3 mesi.
lease.pt.residential.handover-inspection.title=Consegna e riconsegna
lease.pt.residential.handover-inspection.summary=Descrizione dello stato dell'immobile, riconsegna al termine, visite e ritardo nella riconsegna.
lease.pt.residential.termination.title=Cessazione
lease.pt.residential.termination.summary=Recesso del conduttore e del locatore, cause legali di risoluzione per inadempimento e rilascio dell'immobile.
lease.pt.residential.notices.title=Comunicazioni
lease.pt.residential.notices.summary=Comunicazioni con raccomandata con avviso di ricevimento e indirizzi convenuti.
