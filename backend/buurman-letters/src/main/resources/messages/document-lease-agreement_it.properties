# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Parti
lease.nl.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido.
lease.nl.residential.premises.title=Immobile locato
lease.nl.residential.premises.summary=Descrive l'abitazione locata e applica il diritto olandese della locazione abitativa.
lease.nl.residential.term.title=Durata
lease.nl.residential.term.summary=Data di decorrenza e se la locazione è a tempo indeterminato o determinato.
lease.nl.residential.rent.title=Canone
lease.nl.residential.rent.summary=Il canone base e il diritto del conduttore alla verifica da parte della commissione affitti.
lease.nl.residential.rent-adjustment.title=Adeguamento del canone
lease.nl.residential.rent-adjustment.summary=Adeguamento annuale del canone, mai superiore all'aumento massimo di legge.
lease.nl.residential.service-costs.title=Spese di servizio
lease.nl.residential.service-costs.summary=Acconti per utenze e servizi con un rendiconto annuale.
lease.nl.residential.deposit.title=Deposito cauzionale
lease.nl.residential.deposit.summary=Deposito di al massimo due canoni base, restituito entro il termine di legge.
lease.nl.residential.payment.title=Pagamento
lease.nl.residential.payment.summary=Quando e come si paga il canone, anticipatamente per ogni periodo.
lease.nl.residential.use.title=Uso
lease.nl.residential.use.summary=Uso esclusivo come abitazione, da buon conduttore, e modifiche all'immobile.
lease.nl.residential.subletting.title=Sublocazione
lease.nl.residential.subletting.summary=Sublocazione solo con consenso scritto del locatore, salvi i diritti di legge.
lease.nl.residential.maintenance.title=Manutenzione e riparazioni
lease.nl.residential.maintenance.summary=Il locatore elimina i difetti; il conduttore esegue le piccole riparazioni.
lease.nl.residential.energy-label.title=Attestato energetico
lease.nl.residential.energy-label.summary=Il locatore consegna copia dell'etichetta energetica valida dell'abitazione.
lease.nl.residential.handover-inspection.title=Verifica e riconsegna
lease.nl.residential.handover-inspection.summary=Verbale di stato iniziale, pre-ispezione e ispezione finale alla riconsegna.
lease.nl.residential.termination.title=Cessazione
lease.nl.residential.termination.summary=Termini di preavviso e motivi di legge per il recesso del locatore.
lease.nl.residential.data-protection.title=Protezione dei dati
lease.nl.residential.data-protection.summary=Trattamento dei dati personali del conduttore ai sensi del GDPR.
lease.nl.residential.disputes.title=Controversie
lease.nl.residential.disputes.summary=Si applica il diritto olandese; le controversie vanno alla commissione affitti o al giudice.
