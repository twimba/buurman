lease.fr.residential.rent-adjustment.summary=Revisione annuale entro l'indice di riferimento dei canoni (IRL); nessuna revisione nelle classi energetiche F e G.
lease.fr.residential.service-costs.title=Oneri accessori
lease.fr.residential.service-costs.summary=Oneri recuperabili pagati in acconto con conguaglio annuale e documenti giustificativi.
lease.fr.residential.deposit.title=Deposito cauzionale
lease.fr.residential.deposit.summary=Deposito cauzionale non superiore a 1 mensilità al netto degli oneri, restituito entro 1 o 2 mesi.
lease.fr.residential.payment.title=Pagamento
lease.fr.residential.payment.summary=Tempi e modalità di pagamento del canone; pagamento mensile su richiesta, quietanze gratuite e nessuna penale.
lease.fr.residential.use.title=Uso
lease.fr.residential.use.summary=Uso pacifico come residenza principale; modifiche solo con il consenso scritto del locatore.
lease.fr.residential.subletting.title=Sublocazione
lease.fr.residential.subletting.summary=Cessione e sublocazione solo con il consenso scritto del locatore, anche sul canone.
lease.fr.residential.maintenance.title=Manutenzione e riparazioni
lease.fr.residential.maintenance.summary=Obblighi del locatore di decoro abitativo e riparazione, manutenzione ordinaria del conduttore e accesso per i lavori.
lease.fr.residential.works.title=Lavori
lease.fr.residential.works.summary=Lavori eseguiti dall'ultimo contratto e lavori di miglioria concordati con l'eventuale aumento del canone.
lease.fr.residential.diagnostics.title=Diagnosi tecniche
lease.fr.residential.diagnostics.summary=Fascicolo delle diagnosi tecniche allegato al contratto, classe energetica e prestazione energetica minima.
lease.fr.residential.insurance.title=Assicurazione
lease.fr.residential.insurance.summary=Il conduttore assicura i rischi locativi e ne fornisce prova ogni anno su richiesta.
lease.fr.residential.handover-inspection.title=Verbale di stato
lease.fr.residential.handover-inspection.summary=Verbali di consegna e di riconsegna redatti in contraddittorio o da un ufficiale giudiziario.
lease.fr.residential.termination.title=Recesso e risoluzione
lease.fr.residential.termination.summary=Recesso del conduttore (3 o 1 mese) e disdetta del locatore (6 mesi, motivi di legge); clausola risolutiva.
lease.fr.residential.annexes.title=Allegati
lease.fr.residential.annexes.summary=Allegati obbligatori: nota informativa, fascicolo delle diagnosi, verbale di consegna ed estratti del regolamento di condominio.
lease.fr.residential.data-protection.title=Protezione dei dati
lease.fr.residential.data-protection.summary=Trattamento dei dati personali del conduttore in conformità al GDPR.
lease.fr.residential.disputes.title=Controversie
lease.fr.residential.disputes.summary=Si applica il diritto francese; commissione di conciliazione e giudice del contenzioso di tutela.
