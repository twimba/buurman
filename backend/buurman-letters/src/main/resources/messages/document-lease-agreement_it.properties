lease.es.commercial.assignment.summary=Diritto legale di cedere o sublocare con aumento del canone, salvo patto contrario; eredi che proseguono l'attività.
lease.es.commercial.pre-emption.title=Diritti di prelazione
lease.es.commercial.pre-emption.summary=Diritti di prelazione e di riscatto (tanteo y retracto) del conduttore in caso di vendita, possibile rinuncia e posizione dell'acquirente.
lease.es.commercial.insurance.title=Assicurazione
lease.es.commercial.insurance.summary=Assicurazione di responsabilità civile e del contenuto del conduttore; assicurazione dell'edificio del locatore.
lease.es.commercial.energy-certificate.title=Certificato energetico
lease.es.commercial.energy-certificate.summary=Copia dell'etichetta di efficienza energetica allegata e consegna delle raccomandazioni d'uso.
lease.es.commercial.goodwill-compensation.title=Indennità per perdita di clientela
lease.es.commercial.goodwill-compensation.summary=Indennità per la perdita di clientela alla scadenza per le attività di vendita al pubblico, salvo esclusione espressa.
