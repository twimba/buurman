lease.es.commercial.handover-inspection.summary=Verbale dello stato alla consegna e restituzione dei locali nello stato in cui sono stati ricevuti.
lease.es.commercial.termination.title=Cessazione
lease.es.commercial.termination.summary=Risoluzione per inadempimento e cause legali di risoluzione di diritto.
lease.es.commercial.notices.title=Comunicazioni
lease.es.commercial.notices.summary=Indirizzi, comunicazioni elettroniche e notifica con prova, come il burofax.
lease.es.commercial.data-protection.title=Protezione dei dati
