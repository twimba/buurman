lease.be.commercial.premises.title=Immobile locato
lease.be.commercial.premises.summary=Indirizzo, superficie e descrizione, compresi i locali abitativi o accessori soggetti alla durata legale.
lease.be.commercial.permitted-use.title=Destinazione
lease.be.commercial.permitted-use.summary=Commercio al dettaglio o artigianato a contatto diretto con il pubblico; ambito della legge e locazioni fino a 1 anno.
lease.be.commercial.term.title=Durata
lease.be.commercial.term.summary=Almeno 9 anni; il conduttore può recedere a ogni triennio con preavviso di 6 mesi, il locatore solo se pattuito.
lease.be.commercial.rent.title=Canone
lease.be.commercial.rent.summary=Canone al netto di spese, oneri e imposte, fissato liberamente.
lease.be.commercial.rent-adjustment.title=Indicizzazione e revisione
lease.be.commercial.rent-adjustment.summary=Indicizzazione pattuita secondo l'indice sanitario 1 volta all'anno e revisione giudiziale a ogni triennio con uno scarto di almeno il 15 %.
lease.be.commercial.service-costs.title=Spese e oneri
lease.be.commercial.service-costs.summary=Elenco tassativo di spese, oneri e imposte a carico del conduttore, conguagliati almeno annualmente.
lease.be.commercial.vat.title=IVA
lease.be.commercial.vat.summary=Locazione in linea di principio esente da IVA, con l'opzione di una locazione di edifici professionali soggetta a IVA.
lease.be.commercial.deposit.title=Garanzia locativa
lease.be.commercial.deposit.summary=Garanzia nell'importo e nella forma convenuti; nessun limite legale per le locazioni commerciali.
lease.be.commercial.payment.title=Pagamento
lease.be.commercial.payment.summary=Pagamento a rate mediante bonifico nel giorno convenuto; interessi legali dopo la messa in mora.
lease.be.commercial.maintenance.title=Manutenzione e riparazioni
lease.be.commercial.maintenance.summary=Riparazioni del locatore e del conduttore secondo il previgente Codice civile belga, salvo patto contrario.
lease.be.commercial.alterations.title=Trasformazioni
lease.be.commercial.alterations.summary=Diritto del conduttore a trasformazioni fino a 3 annualità di canone previo avviso, opposizione del locatore entro 30 giorni e sorte alla fine.
lease.be.commercial.assignment.title=Cessione e sublocazione
lease.be.commercial.assignment.summary=Consenso necessario, salvo cessione o sublocazione insieme all'azienda, fatta salva l'opposizione del locatore entro 30 giorni.
lease.be.commercial.insurance.title=Assicurazione
lease.be.commercial.insurance.summary=Il conduttore assicura la propria responsabilità e il contenuto, il locatore assicura l'edificio.
lease.be.commercial.energy-certificate.title=Attestato di prestazione energetica
lease.be.commercial.energy-certificate.summary=Attestato di prestazione energetica quando le norme regionali lo richiedono, con numero, data e classe.
lease.be.commercial.registration.title=Registrazione
lease.be.commercial.registration.summary=Registrazione secondo la normativa fiscale, che conferisce data certa al contratto; parte che sostiene le imposte.
lease.be.commercial.handover-inspection.title=Stato dei luoghi
lease.be.commercial.handover-inspection.summary=Stato dei luoghi dettagliato in contraddittorio, allegato e registrato; restituzione nello stato ricevuto.
lease.be.commercial.renewal.title=Rinnovo
lease.be.commercial.renewal.summary=Diritto a 3 rinnovi di 9 anni, domanda da 18 a 15 mesi prima della scadenza, motivi di diniego e indennità di sfratto.
lease.be.commercial.transfer.title=Alienazione dell'immobile
lease.be.commercial.transfer.summary=L'acquirente può far rilasciare l'immobile solo per motivi legali, con preavviso di 1 anno dato entro 3 mesi.
lease.be.commercial.termination.title=Cessazione
lease.be.commercial.termination.summary=Fine a un triennio, locazione a tempo indeterminato dopo la decadenza dal diritto di rinnovo, risoluzione giudiziale per inadempimento.
lease.be.commercial.data-protection.title=Protezione dei dati
lease.be.commercial.data-protection.summary=Trattamento dei dati personali delle parti e dei loro rappresentanti secondo il GDPR.
lease.be.commercial.disputes.title=Controversie
lease.be.commercial.disputes.summary=Diritto belga e giudice di pace del luogo dell'immobile; conciliazione preventiva possibile.
