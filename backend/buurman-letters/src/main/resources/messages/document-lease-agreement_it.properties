# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Parti
lease.it.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori con codice fiscale e dati anagrafici; i coconduttori sono obbligati in solido; forma scritta obbligatoria.
lease.it.residential.premises.title=Immobile
lease.it.residential.premises.summary=Descrive l'abitazione con i dati catastali e le pertinenze; modello per il canone libero (4 + 4 anni), non per contratti concordati, transitori o per studenti.
