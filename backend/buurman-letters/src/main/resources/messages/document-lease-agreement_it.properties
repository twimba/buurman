lease.es.commercial.rent-adjustment.summary=Aggiornamento annuale secondo l'indice ufficiale pattuito, in aumento e in diminuzione.
lease.es.commercial.service-costs.title=Spese
lease.es.commercial.service-costs.summary=Spese dell'edificio, servizi a contatore e, se pattuita, l'imposta sugli immobili (IBI) a carico del conduttore.
lease.es.commercial.vat.title=IVA e ritenuta
lease.es.commercial.vat.summary=IVA addebitata sul canone e ritenuta d'acconto sull'imposta sul reddito da parte del conduttore quando prevista.
lease.es.commercial.deposit.title=Deposito cauzionale
lease.es.commercial.deposit.summary=Deposito cauzionale obbligatorio in denaro di 2 mensilità, garanzie aggiuntive, regole regionali di deposito.
lease.es.commercial.payment.title=Pagamento
lease.es.commercial.payment.summary=Pagamento anticipato con bonifico dietro fattura; interessi di mora.
lease.es.commercial.maintenance.title=Manutenzione
lease.es.commercial.maintenance.summary=Riparazioni e opere secondo le regole della LAU, salvo diverso accordo delle parti.
lease.es.commercial.alterations.title=Modifiche
lease.es.commercial.alterations.summary=Opere del conduttore solo con consenso scritto; destino delle opere alla fine della locazione.
