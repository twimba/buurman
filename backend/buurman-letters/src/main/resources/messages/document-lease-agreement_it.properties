# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Parti
lease.de.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido.
lease.de.residential.premises.title=Immobile locato
lease.de.residential.premises.summary=Descrive l'abitazione locata e applica il diritto tedesco della locazione abitativa (BGB).
lease.de.residential.term.title=Durata
lease.de.residential.term.summary=Data di inizio; durata indeterminata, o determinata solo con un motivo di legge comunicato per iscritto.
lease.de.residential.rent.title=Canone
lease.de.residential.rent.summary=Il canone netto e il limite al canone iniziale nelle zone ad alta tensione abitativa.
lease.de.residential.rent-adjustment.title=Aumento del canone
lease.de.residential.rent-adjustment.summary=Aumenti di legge fino al canone comparativo locale, entro il limite massimo.
lease.de.residential.service-costs.title=Oneri accessori
lease.de.residential.service-costs.summary=Acconti sugli oneri accessori con rendiconto annuale entro il termine di legge.
lease.de.residential.deposit.title=Deposito cauzionale
lease.de.residential.deposit.summary=Deposito di al massimo 3 mensilità di canone netto, pagabile a rate e tenuto separato.
lease.de.residential.payment.title=Pagamento
lease.de.residential.payment.summary=Il canone si paga anticipatamente, entro il 3° giorno lavorativo di ciascun periodo.
lease.de.residential.use.title=Uso
lease.de.residential.use.summary=Uso esclusivamente abitativo, uso diligente e modifiche solo con il consenso del locatore.
lease.de.residential.subletting.title=Sublocazione
lease.de.residential.subletting.summary=Uso da parte di terzi solo con autorizzazione; diritto di legge del conduttore di sublocare parte dell'abitazione.
lease.de.residential.maintenance.title=Manutenzione e vizi
lease.de.residential.maintenance.summary=Il locatore mantiene l'abitazione; riduzione del canone per vizi; nessuna tinteggiatura a carico del conduttore.
lease.de.residential.minor-repairs.title=Piccole riparazioni
lease.de.residential.minor-repairs.summary=Il conduttore sostiene il costo delle piccole riparazioni fino a un importo per intervento e per anno da compilare.
lease.de.residential.energy-certificate.title=Attestato energetico
lease.de.residential.energy-certificate.summary=Il locatore esibisce e consegna l'attestato di prestazione energetica (GModG).
lease.de.residential.registration.title=Conferma di residenza
lease.de.residential.registration.summary=Il locatore conferma l'ingresso affinché il conduttore possa registrarsi presso l'autorità.
lease.de.residential.handover-inspection.title=Consegna e riconsegna
lease.de.residential.handover-inspection.summary=Verbali di consegna e riconsegna, restituzione dell'abitazione e prescrizione di 6 mesi.
lease.de.residential.termination.title=Disdetta
lease.de.residential.termination.summary=Disdetta scritta, termini di preavviso di legge e interesse legittimo richiesto al locatore.
lease.de.residential.data-protection.title=Protezione dei dati
lease.de.residential.data-protection.summary=Trattamento dei dati personali del conduttore in conformità al GDPR.
lease.de.residential.disputes.title=Controversie
lease.de.residential.disputes.summary=Si applica il diritto tedesco; è competente in via esclusiva il tribunale locale (Amtsgericht) del luogo dell'abitazione.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Parti
lease.de.commercial.parties.summary=Identifica il locatore e il conduttore con numero di registro, partita IVA e rappresentanti.
lease.de.commercial.premises.title=Immobile locato
lease.de.commercial.premises.summary=Descrive i locali commerciali e applica le norme del BGB sulla locazione di locali commerciali.
lease.de.commercial.permitted-use.title=Destinazione d'uso
lease.de.commercial.permitted-use.summary=L'attività convenuta; le modifiche richiedono il consenso; il conduttore ottiene le autorizzazioni.
lease.de.commercial.term.title=Durata
lease.de.commercial.term.summary=Durata determinata o indeterminata; oltre 1 anno serve la forma testuale, altrimenti vale a tempo indeterminato.
lease.de.commercial.rent.title=Canone
lease.de.commercial.rent.summary=Il canone netto liberamente convenuto, più IVA e acconti ove convenuto.
lease.de.commercial.rent-adjustment.title=Aggiornamento del canone
lease.de.commercial.rent-adjustment.summary=Clausola di indicizzazione all'indice dei prezzi al consumo, ammessa solo per contratti di lunga durata (PrKG).
lease.de.commercial.service-costs.title=Oneri accessori
lease.de.commercial.service-costs.summary=Oneri secondo la BetrKV e voci aggiuntive elencate, con acconti e rendiconto annuale.
lease.de.commercial.vat.title=Opzione IVA
lease.de.commercial.vat.summary=Il locatore opta per l'IVA sul canone; il conduttore usa i locali solo per operazioni con diritto alla detrazione.
lease.de.commercial.deposit.title=Garanzia
lease.de.commercial.deposit.summary=Deposito in contanti o fideiussione bancaria, senza limite di legge per i locali commerciali.
lease.de.commercial.payment.title=Pagamento
lease.de.commercial.payment.summary=Canone anticipato entro il 3° giorno lavorativo; limiti alla compensazione e interessi di mora commerciali.
lease.de.commercial.maintenance.title=Manutenzione e riparazioni
lease.de.commercial.maintenance.summary=Il locatore cura le strutture e le parti comuni; il conduttore cura l'interno dei locali.
lease.de.commercial.alterations.title=Modifiche e allestimento
lease.de.commercial.alterations.summary=Opere e insegne del conduttore solo con consenso in forma testuale; rimozione alla fine della locazione.
lease.de.commercial.subletting.title=Sublocazione
lease.de.commercial.subletting.summary=Uso da parte di terzi solo con autorizzazione; diritto speciale di recesso in caso di rifiuto.
lease.de.commercial.competition.title=Tutela dalla concorrenza
lease.de.commercial.competition.summary=Il locatore non loca a un concorrente con lo stesso assortimento principale.
lease.de.commercial.insurance.title=Assicurazioni
lease.de.commercial.insurance.summary=Il locatore assicura l'edificio; il conduttore assicura i propri beni e ha una RC professionale.
lease.de.commercial.energy-certificate.title=Attestato energetico
lease.de.commercial.energy-certificate.summary=Il locatore esibisce e consegna l'attestato di prestazione energetica (GModG).
lease.de.commercial.handover-inspection.title=Consegna e riconsegna
lease.de.commercial.handover-inspection.summary=Verbali di consegna e riconsegna, restituzione dei locali sgomberi e prescrizione di 6 mesi.
lease.de.commercial.termination.title=Disdetta
lease.de.commercial.termination.summary=Disdetta entro il 3° giorno lavorativo di un trimestre per la fine del trimestre successivo; recesso straordinario.
lease.de.commercial.data-protection.title=Protezione dei dati
lease.de.commercial.data-protection.summary=Trattamento dei dati personali di rappresentanti e referenti in conformità al GDPR.
lease.de.commercial.disputes.title=Controversie
lease.de.commercial.disputes.summary=Si applica il diritto tedesco; è competente in via esclusiva il tribunale del luogo dei locali.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Parti
lease.fr.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori; i coconduttori rispondono in solido nei limiti di legge.
lease.fr.residential.premises.title=Immobile locato
lease.fr.residential.premises.summary=Descrive l'alloggio non ammobiliato locato come residenza principale ai sensi della legge del 6 luglio 1989 e del contratto tipo.
lease.fr.residential.term.title=Durata
lease.fr.residential.term.summary=Data di decorrenza, durata minima di 3 o 6 anni secondo il locatore e rinnovo tacito.
lease.fr.residential.rent.title=Canone
lease.fr.residential.rent.summary=Il canone al netto degli oneri e i limiti applicabili nelle zone ad alta tensione abitativa e di controllo dei canoni.
