# ===== CH lease clause titles and summaries (country pack) =====
lease.ch.residential.parties.title=Parti
lease.ch.residential.parties.summary=Identifica il locatore e il conduttore o i conduttori, la loro responsabilità solidale e se l'abitazione è l'abitazione familiare.
lease.ch.residential.premises.title=Ente locato
lease.ch.residential.premises.summary=Descrive l'abitazione e i locali accessori; si applicano il CO e l'OLAL, con le eccezioni per le abitazioni di lusso e gli appartamenti di vacanza.
lease.ch.residential.term.title=Durata
lease.ch.residential.term.summary=Inizio della locazione; locazione di durata indeterminata o determinata che termina senza disdetta e diventa indeterminata se continuata tacitamente.
lease.ch.residential.rent.title=Pigione
lease.ch.residential.rent.summary=Pigione netta e sue basi (tasso di riferimento, indice dei prezzi), contestazione della pigione iniziale entro 30 giorni e modulo ufficiale cantonale.
lease.ch.residential.rent-adjustment.title=Adeguamenti della pigione
lease.ch.residential.rent-adjustment.summary=Aumenti solo con modulo cantonale motivato, contestazione entro 30 giorni, domande di riduzione, pigioni indicizzate e scalari.
lease.ch.residential.service-costs.title=Spese accessorie
lease.ch.residential.service-costs.summary=Spese accessorie solo se pattuite in modo speciale, acconti con conteggio annuale o importo forfettario, consultazione dei giustificativi.
lease.ch.residential.deposit.title=Deposito di garanzia
lease.ch.residential.deposit.summary=Garanzia di al massimo 3 pigioni mensili su un conto bancario intestato al conduttore, devoluta con il consenso delle parti, in base a decisioni passate in giudicato o dopo 1 anno.
lease.ch.residential.payment.title=Pagamento
lease.ch.residential.payment.summary=Pigione alla scadenza convenuta, interesse moratorio del 5 per cento, termine di pagamento di almeno 30 giorni prima di una disdetta per mora.
lease.ch.residential.use.title=Uso
lease.ch.residential.use.summary=Solo a scopo d'abitazione, diligenza e riguardo verso i vicini, regolamento della casa e ispezioni annunciate tempestivamente.
lease.ch.residential.subletting.title=Sublocazione
lease.ch.residential.subletting.summary=Sublocazione con il consenso del locatore, che può essere negato solo per i motivi previsti dalla legge.
lease.ch.residential.maintenance.title=Manutenzione e difetti
lease.ch.residential.maintenance.summary=Il locatore mantiene l'abitazione, il conduttore esegue i piccoli lavori di pulitura e riparazione; riduzione e deposito della pigione in caso di difetti.
lease.ch.residential.handover-inspection.title=Consegna e restituzione
lease.ch.residential.handover-inspection.summary=Verbale di consegna, difetti notificati entro 14 giorni, restituzione nello stato conforme al contratto e notifica immediata dei difetti da parte del locatore.
lease.ch.residential.termination.title=Disdetta
lease.ch.residential.termination.summary=Disdetta scritta, da parte del locatore con modulo cantonale, 3 mesi per le scadenze pattuite o d'uso; contestazione e protrazione fino a 4 anni.
lease.ch.residential.data-protection.title=Protezione dei dati
lease.ch.residential.data-protection.summary=Trattamento dei dati personali del conduttore secondo la legge federale sulla protezione dei dati (LPD) e diritti del conduttore.
lease.ch.residential.disputes.title=Controversie
lease.ch.residential.disputes.summary=Diritto svizzero, autorità di conciliazione prima della procedura giudiziaria, giudice del luogo della cosa.
lease.ch.commercial.parties.title=Parti
lease.ch.commercial.parties.summary=Identifica il locatore e il conduttore con numero IDI, numero IVA e rappresentanti; responsabilità solidale.
lease.ch.commercial.premises.title=Ente locato
lease.ch.commercial.premises.summary=Descrive i locali commerciali e le superfici accessorie; si applicano anche la protezione dalle pigioni abusive e dalla disdetta.
lease.ch.commercial.permitted-use.title=Scopo d'uso
lease.ch.commercial.permitted-use.summary=Scopo commerciale pattuito, modifiche solo con consenso scritto, ripartizione delle autorizzazioni amministrative.
lease.ch.commercial.term.title=Durata
lease.ch.commercial.term.summary=Inizio della locazione; locazione di durata indeterminata o determinata che termina senza disdetta, ed eventuale opzione di proroga del conduttore.
lease.ch.commercial.rent.title=Pigione
lease.ch.commercial.rent.summary=Pigione netta e sue basi, contestazione della pigione iniziale entro 30 giorni ed eventuale modulo ufficiale cantonale.
lease.ch.commercial.rent-adjustment.title=Adeguamenti della pigione
lease.ch.commercial.rent-adjustment.summary=Pigione indicizzata (contratto di almeno 5 anni, indice dei prezzi al consumo) o scalare, altrimenti aumenti con modulo cantonale motivato.
lease.ch.commercial.service-costs.title=Spese accessorie
lease.ch.commercial.service-costs.summary=Spese accessorie solo se pattuite in modo speciale, acconti con conteggio annuale o importo forfettario, consultazione dei giustificativi.
lease.ch.commercial.vat.title=IVA
lease.ch.commercial.vat.summary=La locazione è esclusa dall'IVA, con eccezioni legali come i posteggi locati separatamente; il locatore può optare per l'imposizione, salvo uso esclusivamente abitativo.
lease.ch.commercial.deposit.title=Deposito di garanzia
lease.ch.commercial.deposit.summary=Garanzia senza importo massimo legale, depositata su un conto bancario intestato al conduttore o sostituita da una garanzia bancaria.
lease.ch.commercial.payment.title=Pagamento
lease.ch.commercial.payment.summary=Pigione alla scadenza convenuta, interesse moratorio del 5 per cento, termine di pagamento di almeno 30 giorni prima di una disdetta per mora.
lease.ch.commercial.maintenance.title=Manutenzione e difetti
lease.ch.commercial.maintenance.summary=Il locatore mantiene l'ente locato, il conduttore esegue i piccoli lavori di pulitura e riparazione; diritti in caso di difetti, lavori e ispezioni.
lease.ch.commercial.alterations.title=Modifiche da parte del conduttore
lease.ch.commercial.alterations.summary=Modifiche e insegne solo con consenso scritto; ripristino solo se pattuito per scritto; indennità per plusvalore considerevole.
lease.ch.commercial.subletting.title=Sublocazione
lease.ch.commercial.subletting.summary=Sublocazione con il consenso del locatore, che può essere negato solo per i motivi previsti dalla legge.
lease.ch.commercial.assignment.title=Trasferimento della locazione
lease.ch.commercial.assignment.summary=Trasferimento a un terzo con consenso scritto, negato solo per motivi gravi; responsabilità solidale al massimo per 2 anni.
lease.ch.commercial.retention-right.title=Diritto di ritenzione del locatore
lease.ch.commercial.retention-right.summary=Diritto di ritenzione sulle cose mobili nei locali per la pigione annuale scaduta e per quella del semestre in corso.
lease.ch.commercial.insurance.title=Assicurazioni
lease.ch.commercial.insurance.summary=Il locatore assicura l'edificio; il conduttore assicura installazioni e merci e stipula un'assicurazione di responsabilità civile aziendale.
lease.ch.commercial.handover-inspection.title=Consegna e restituzione
lease.ch.commercial.handover-inspection.summary=Verbale di consegna, restituzione sgomberata e nello stato conforme al contratto, notifica immediata dei difetti da parte del locatore.
lease.ch.commercial.termination.title=Disdetta
lease.ch.commercial.termination.summary=Disdetta scritta, da parte del locatore con modulo cantonale, 6 mesi per le scadenze pattuite o d'uso; contestazione e protrazione fino a 6 anni.
lease.ch.commercial.data-protection.title=Protezione dei dati
lease.ch.commercial.data-protection.summary=Trattamento dei dati personali delle parti e dei loro rappresentanti secondo la legge federale sulla protezione dei dati (LPD).
lease.ch.commercial.disputes.title=Controversie
lease.ch.commercial.disputes.summary=Diritto svizzero, autorità di conciliazione prima della procedura giudiziaria, giudice del luogo della cosa.
