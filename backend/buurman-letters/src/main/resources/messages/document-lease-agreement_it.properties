lease.es.commercial.vat.title=IVA e ritenuta
lease.es.commercial.vat.summary=IVA addebitata sul canone e ritenuta d'acconto sull'imposta sul reddito da parte del conduttore quando prevista.
lease.es.commercial.deposit.title=Deposito cauzionale
lease.es.commercial.deposit.summary=Deposito cauzionale obbligatorio in denaro di 2 mensilità, garanzie aggiuntive, regole regionali di deposito.
lease.es.commercial.payment.title=Pagamento
lease.es.commercial.payment.summary=Pagamento anticipato con bonifico dietro fattura; interessi di mora.
