legal.NL=Denne forlengelsen er underlagt nederlandsk leierett (huurrecht). Partene kan bringe tvister inn for Huurcommissie (leienemnda).
legal.DE=Denne forlengelsesavtalen inngås i samsvar med §557 BGB (Mietverhöhungsvereinbarung). Gjeldende regler om husleieregulering (Mietpreisbremse) kan komme til anvendelse.
legal.FR=Denne forlengelsen er underlagt fransk leierett. Bestemmelsene i Loi ALUR kan gjelde i regulerte områder (zones tendues). Leiejusteringer følger IRL-indeksen.
legal.BE=Denne forlengelsen er underlagt regional boliglovgivning. Leieindeksering skjer på grunnlag av Gezondheidsindex (helseindeksen).
legal.ES=Denne forlengelsen er underlagt LAU (Ley de Arrendamientos Urbanos). Bestemmelsene om minste leieperiode i art. 9-10 kan komme til anvendelse.
legal.PT=Denne forlengelsen er underlagt NRAU (Novo Regime do Arrendamento Urbano). Leiejusteringer følger INE-koeffisienten.
legal.AT=Denne forlengelsen er underlagt østerriksk leierett (MRG). Richtwertmietzins-systemet kan komme til anvendelse.
legal.GB=Denne forlengelsen er underlagt Housing Act 1988 (med senere endringer). Varslingskravene etter Section 13 kan gjelde ved leieøkninger.
legal.IT=Denne forlengelsen er underlagt italiensk leierett (Legge 431/1998). Justeringer etter ISTAT FOI-indeksen kan komme til anvendelse.
legal.SE=Denne forlengelsen er underlagt Hyreslagen. Leienivåene følger bruksvärdessystemet (bruksverdisystemet).
legal.DK=Denne forlengelsen er underlagt Lejeloven. Husleiereguleringen avhenger av byggets alder og leieforholdets type.
legal.IE=Denne forlengelsen er underlagt Residential Tenancies Act 2004. Begrensninger i Rent Pressure Zone (RPZ) kan komme til anvendelse.
legal.PL=Denne forlengelsen er underlagt den polske sivillovboken art. 6851-6852. Det gjelder krav om skriftlig varsel ved leieøkninger.
legal.FI=Denne forlengelsen er underlagt loven om boligleie (481/1995). Leiejusteringer følger kontraktens vilkår.
legal.NO=Denne forlengelsen er underlagt husleieloven. KPI-baserte leiejusteringer gjelder etter §4-2/§4-3.
legal.US=Denne forlengelsen er underlagt gjeldende delstatlig og lokal leierett. Husleieregulering kan komme til anvendelse i enkelte jurisdiksjoner.
legal.CA=Denne forlengelsen er underlagt gjeldende provinsiell leielovgivning. Årlige veiledende leieøkninger kan komme til anvendelse.
legal.HU=Denne forlengelsen er underlagt den ungarske sivillovboken. Vilkårene for leiejustering følger leieavtalen.
legal.CZ=Denne forlengelsen er underlagt den tsjekkiske sivillovboken §2249. Økninger til sammenlignbar markedsleie er begrenset til 20 % over 3 år.
legal.CH=Denne forlengelsen er underlagt sveitsisk leierett (Obligationenrecht art. 269-270). Justeringer er knyttet til referanserenten (Referenzzinssatz).

