deposit.legal.NL=Alankomaiden lain mukaan vakuus on palautettava kohtuullisessa ajassa vuokrasuhteen päättymisen jälkeen; riitaiset vähennykset voidaan saattaa Huurcommissie-lautakunnan tai tuomioistuimen ratkaistaviksi.
deposit.legal.DE=BGB:n § 551 mukaan vakuus on pidettävä erillään vuokranantajan varoista ja selvitettävä kohtuullisessa ajassa (yleensä enintään kuudessa kuukaudessa) vuokrasuhteen päättymisestä.
deposit.legal.FR=Lain 89-462 22 artiklan mukaan vakuus on palautettava kuukauden kuluessa (kaksi kuukautta, jos vähennyksiä tehdään) avainten palauttamisesta; viivästyksestä kertyy 10 % kuukausivuokrasta kutakin viivästyskuukautta kohden.
deposit.legal.BE=Vakuus on talletettu vuokralaisen nimissä olevalle suljetulle tilille alueellisen asuinhuoneiston vuokra-asetuksen edellyttämällä tavalla; vapauttaminen edellyttää molempien osapuolten suostumusta tai tuomioistuimen päätöstä.
deposit.legal.ES=LAU:n 36 artiklan mukaan vakuus on palautettava kuukauden kuluessa avainten palauttamisesta; sen jälkeen määrälle kertyy laillinen korko.
deposit.legal.PT=Portugalin siviililain mukaan vakuus (caução) on palautettava vuokrasuhteen päättyessä sen jälkeen, kun mahdolliset erääntyneet määrät on selvitetty.
deposit.legal.GB=Assured shorthold tenancy -vakuudet Englannissa ja Walesissa on suojattava viranomaisen hyväksymässä järjestelmässä; riidat voidaan saattaa järjestelmän maksuttoman riidanratkaisupalvelun käsiteltäviksi.
deposit.legal.IT=Lain 392/1978 11 artiklan mukaan vakuus (deposito cauzionale) ei saa ylittää kolmen kuukauden vuokraa, ja sille kertyy laillinen korko, joka maksetaan vuokralaiselle vuosittain.
