deposit.closing=Si no está de acuerdo con alguna deducción, contacte con nosotros en los 14 días siguientes a la fecha de esta liquidación.
deposit.disclaimer=Esta liquidación se emite conforme al contrato de arrendamiento. Los plazos legales y procedimientos de reclamación sobre fianzas varían según la jurisdicción y no se ven afectados por este documento.
deposit.legal.NL=Conforme al Derecho neerlandés, la fianza debe devolverse en un plazo razonable tras la finalización del arrendamiento; las deducciones controvertidas pueden someterse a la Huurcommissie o a los tribunales.
deposit.legal.DE=Conforme al § 551 BGB, la fianza debe mantenerse separada del patrimonio del arrendador y liquidarse en un plazo razonable (por lo general hasta seis meses) tras la finalización del arrendamiento.
deposit.legal.FR=Conforme al artículo 22 de la Ley 89-462, la fianza debe devolverse en el plazo de un mes (dos meses si se practican deducciones) desde la entrega de las llaves; el retraso devenga el 10% de la renta mensual por cada mes de demora.
deposit.legal.BE=La fianza se depositó en una cuenta bloqueada a nombre del arrendatario, según exige el decreto regional de arrendamiento de vivienda; su liberación requiere el acuerdo de ambas partes o una resolución judicial.
deposit.legal.ES=Conforme al artículo 36 de la LAU, la fianza debe restituirse en el plazo de un mes desde la entrega de llaves; transcurrido ese plazo devenga el interés legal.
deposit.legal.PT=Conforme al Código Civil portugués, la fianza (caução) debe devolverse al término del arrendamiento tras liquidar cualquier importe pendiente.
deposit.legal.GB=Las fianzas de los assured shorthold tenancies en Inglaterra y Gales deben protegerse en un sistema aprobado por el Estado; las controversias pueden someterse al servicio gratuito de resolución de conflictos de dicho sistema.
deposit.legal.IT=Conforme al artículo 11 de la Ley 392/1978, la fianza (deposito cauzionale) no puede exceder de tres mensualidades de renta y devenga intereses legales pagaderos anualmente al arrendatario.
