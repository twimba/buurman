deposit.disclaimer=This statement is issued under the lease agreement. Statutory deadlines and dispute procedures for deposits vary by jurisdiction and are not affected by this document.
deposit.legal.NL=Under Dutch law the deposit must be returned within a reasonable period after the end of the tenancy; the Huurcommissie or the courts may be asked to rule on disputed deductions.
deposit.legal.DE=Under § 551 BGB the deposit must be held separately from the landlord’s assets and settled within a reasonable period (typically up to six months) after the end of the tenancy.
deposit.legal.FR=Under Article 22 of Law 89-462 the deposit must be returned within one month (two months if deductions are made) of the return of the keys; late return accrues 10% of the monthly rent per month of delay.
deposit.legal.BE=The deposit was placed on a blocked account in the tenant’s name as required by the regional housing lease decree; release requires the agreement of both parties or a court decision.
deposit.legal.ES=Under Article 36 LAU the deposit must be returned within one month of the return of the keys; after that the amount accrues legal interest.
deposit.legal.PT=Under the Portuguese Civil Code the deposit (caução) must be returned at the end of the tenancy after settlement of any amounts due.
deposit.legal.GB=Assured shorthold tenancy deposits in England and Wales must be protected in a government-approved scheme; disputes may be referred to the scheme’s free dispute resolution service.
deposit.legal.IT=Under Article 11 of Law 392/1978 the deposit (deposito cauzionale) may not exceed three months’ rent and accrues legal interest to be paid to the tenant annually.
