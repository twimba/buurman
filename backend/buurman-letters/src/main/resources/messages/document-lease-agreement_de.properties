# ===== CH lease clause titles and summaries (country pack) =====
lease.ch.residential.parties.title=Parteien
lease.ch.residential.parties.summary=Bezeichnet Vermieter und Mieter, deren solidarische Haftung und ob die Wohnung eine Familienwohnung ist.
lease.ch.residential.premises.title=Mietobjekt
lease.ch.residential.premises.summary=Beschreibt Wohnung und Nebenräume; anwendbar sind OR und VMWG, mit den Ausnahmen für luxuriöse Wohnungen und Ferienwohnungen.
lease.ch.residential.term.title=Mietdauer
lease.ch.residential.term.summary=Mietbeginn; unbefristetes Mietverhältnis oder befristetes, das ohne Kündigung endet und bei stillschweigender Fortsetzung unbefristet wird.
lease.ch.residential.rent.title=Mietzins
lease.ch.residential.rent.summary=Nettomietzins und Mietzinsbasis (Referenzzinssatz, Landesindex), Anfechtung des Anfangsmietzinses innert 30 Tagen und kantonale Formularpflicht.
lease.ch.residential.rent-adjustment.title=Mietzinsanpassungen
lease.ch.residential.rent-adjustment.summary=Erhöhungen nur mit begründetem kantonalem Formular, Anfechtung innert 30 Tagen, Herabsetzungsbegehren, indexierte und gestaffelte Mietzinse.
lease.ch.residential.service-costs.title=Nebenkosten
lease.ch.residential.service-costs.summary=Nebenkosten nur bei besonderer Vereinbarung, Akontozahlungen mit jährlicher Abrechnung oder Pauschale, Einsicht in die Belege.
lease.ch.residential.deposit.title=Mietkaution
lease.ch.residential.deposit.summary=Sicherheit von höchstens 3 Monatszinsen auf einem Bankkonto auf den Namen des Mieters, Herausgabe mit Zustimmung beider Parteien, aufgrund rechtskräftiger Entscheide oder nach 1 Jahr.
lease.ch.residential.payment.title=Zahlung
lease.ch.residential.payment.summary=Mietzins auf den vereinbarten Termin, Verzugszins von 5 Prozent, Zahlungsfrist von mindestens 30 Tagen vor einer Kündigung wegen Zahlungsrückstands.
lease.ch.residential.use.title=Gebrauch
lease.ch.residential.use.summary=Nur Wohnzwecke, Sorgfalt und Rücksichtnahme, Hausordnung und rechtzeitig angezeigte Besichtigungen.
lease.ch.residential.subletting.title=Untermiete
lease.ch.residential.subletting.summary=Untermiete mit Zustimmung des Vermieters, die nur aus den gesetzlichen Gründen verweigert werden kann.
lease.ch.residential.maintenance.title=Unterhalt und Mängel
lease.ch.residential.maintenance.summary=Der Vermieter erhält die Wohnung, der Mieter besorgt kleine Reinigungen und Ausbesserungen; Herabsetzung und Hinterlegung des Mietzinses bei Mängeln.
lease.ch.residential.handover-inspection.title=Übergabe und Rückgabe
lease.ch.residential.handover-inspection.summary=Übergabeprotokoll, Mängelmeldung innert 14 Tagen, Rückgabe im vertragsgemässen Zustand und sofortige Mängelrüge des Vermieters.
lease.ch.residential.termination.title=Kündigung
lease.ch.residential.termination.summary=Schriftliche Kündigung, durch den Vermieter mit kantonalem Formular, 3 Monate auf die vereinbarten oder ortsüblichen Termine; Anfechtung und Erstreckung bis 4 Jahre.
lease.ch.residential.data-protection.title=Datenschutz
lease.ch.residential.data-protection.summary=Bearbeitung der Personendaten des Mieters nach dem Datenschutzgesetz (DSG) und Rechte des Mieters.
lease.ch.residential.disputes.title=Streitigkeiten
lease.ch.residential.disputes.summary=Schweizerisches Recht, Schlichtungsbehörde vor dem Gerichtsverfahren, Gericht am Ort der Mietsache.
lease.ch.commercial.parties.title=Parteien
lease.ch.commercial.parties.summary=Bezeichnet Vermieter und Mieter mit UID, Mehrwertsteuernummer und Vertretern; solidarische Haftung.
lease.ch.commercial.premises.title=Mietobjekt
lease.ch.commercial.premises.summary=Beschreibt Geschäftsräume und Nebenflächen; der Schutz vor missbräuchlichen Mietzinsen und der Kündigungsschutz gelten auch hier.
lease.ch.commercial.permitted-use.title=Verwendungszweck
lease.ch.commercial.permitted-use.summary=Vereinbarter Geschäftszweck, Änderungen nur mit schriftlicher Zustimmung, Aufteilung der behördlichen Bewilligungen.
lease.ch.commercial.term.title=Mietdauer
lease.ch.commercial.term.summary=Mietbeginn; unbefristetes oder befristetes Mietverhältnis, das ohne Kündigung endet, und eine allfällige Verlängerungsoption des Mieters.
lease.ch.commercial.rent.title=Mietzins
lease.ch.commercial.rent.summary=Nettomietzins und Mietzinsbasis, Anfechtung des Anfangsmietzinses innert 30 Tagen und allfällige kantonale Formularpflicht.
lease.ch.commercial.rent-adjustment.title=Mietzinsanpassungen
lease.ch.commercial.rent-adjustment.summary=Indexmiete (Vertrag von mindestens 5 Jahren, Landesindex) oder Staffelmiete, sonst Erhöhungen mit begründetem kantonalem Formular.
lease.ch.commercial.service-costs.title=Nebenkosten
lease.ch.commercial.service-costs.summary=Nebenkosten nur bei besonderer Vereinbarung, Akontozahlungen mit jährlicher Abrechnung oder Pauschale, Einsicht in die Belege.
lease.ch.commercial.vat.title=Mehrwertsteuer
lease.ch.commercial.vat.summary=Die Vermietung ist von der Mehrwertsteuer ausgenommen, mit gesetzlichen Ausnahmen wie gesondert vermieteten Abstellplätzen; der Vermieter kann optieren, ausser bei ausschliesslicher Nutzung zu Wohnzwecken.
lease.ch.commercial.deposit.title=Mietkaution
lease.ch.commercial.deposit.summary=Sicherheit ohne gesetzlichen Höchstbetrag, hinterlegt auf einem Bankkonto auf den Namen des Mieters oder ersetzt durch eine Bankgarantie.
lease.ch.commercial.payment.title=Zahlung
lease.ch.commercial.payment.summary=Mietzins auf den vereinbarten Termin, Verzugszins von 5 Prozent, Zahlungsfrist von mindestens 30 Tagen vor einer Kündigung wegen Zahlungsrückstands.
lease.ch.commercial.maintenance.title=Unterhalt und Mängel
lease.ch.commercial.maintenance.summary=Der Vermieter erhält das Mietobjekt, der Mieter besorgt kleine Reinigungen und Ausbesserungen; Rechte bei Mängeln, Arbeiten und Besichtigungen.
lease.ch.commercial.alterations.title=Änderungen durch den Mieter
lease.ch.commercial.alterations.summary=Änderungen und Reklamen nur mit schriftlicher Zustimmung; Wiederherstellung nur bei schriftlicher Vereinbarung; Entschädigung für erheblichen Mehrwert.
lease.ch.commercial.subletting.title=Untermiete
lease.ch.commercial.subletting.summary=Untermiete mit Zustimmung des Vermieters, die nur aus den gesetzlichen Gründen verweigert werden kann.
lease.ch.commercial.assignment.title=Übertragung der Miete
lease.ch.commercial.assignment.summary=Übertragung auf einen Dritten mit schriftlicher Zustimmung, die nur aus wichtigem Grund verweigert werden kann; Solidarhaftung höchstens 2 Jahre.
lease.ch.commercial.retention-right.title=Retentionsrecht des Vermieters
lease.ch.commercial.retention-right.summary=Retentionsrecht an den beweglichen Sachen in den Räumen für einen verfallenen Jahreszins und den laufenden Halbjahreszins.
lease.ch.commercial.insurance.title=Versicherung
lease.ch.commercial.insurance.summary=Der Vermieter versichert das Gebäude; der Mieter versichert Einrichtungen und Waren und unterhält eine Betriebshaftpflichtversicherung.
lease.ch.commercial.handover-inspection.title=Übergabe und Rückgabe
lease.ch.commercial.handover-inspection.summary=Übergabeprotokoll, Rückgabe geräumt und im vertragsgemässen Zustand, sofortige Mängelrüge des Vermieters.
lease.ch.commercial.termination.title=Kündigung
lease.ch.commercial.termination.summary=Schriftliche Kündigung, durch den Vermieter mit kantonalem Formular, 6 Monate auf die vereinbarten oder ortsüblichen Termine; Anfechtung und Erstreckung bis 6 Jahre.
lease.ch.commercial.data-protection.title=Datenschutz
lease.ch.commercial.data-protection.summary=Bearbeitung der Personendaten der Parteien und ihrer Vertreter nach dem Datenschutzgesetz (DSG).
lease.ch.commercial.disputes.title=Streitigkeiten
lease.ch.commercial.disputes.summary=Schweizerisches Recht, Schlichtungsbehörde vor dem Gerichtsverfahren, Gericht am Ort der Mietsache.
