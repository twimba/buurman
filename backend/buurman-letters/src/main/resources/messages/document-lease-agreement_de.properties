# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Parteien
lease.nl.residential.parties.summary=Benennt Vermieter und Mieter; Mitmieter haften gesamtschuldnerisch.
lease.nl.residential.premises.title=Mietsache
lease.nl.residential.premises.summary=Beschreibt die vermietete Wohnung und erklärt das niederländische Wohnraummietrecht für anwendbar.
lease.nl.residential.term.title=Mietdauer
lease.nl.residential.term.summary=Mietbeginn und ob der Vertrag unbefristet oder befristet geschlossen ist.
lease.nl.residential.rent.title=Miete
lease.nl.residential.rent.summary=Die Grundmiete und das Recht des Mieters auf Prüfung durch die Mietkommission.
lease.nl.residential.rent-adjustment.title=Mietanpassung
lease.nl.residential.rent-adjustment.summary=Jährliche Mietanpassung, nie höher als die gesetzlich zulässige Höchsterhöhung.
lease.nl.residential.service-costs.title=Nebenkosten
lease.nl.residential.service-costs.summary=Vorauszahlungen für Versorgung und Dienstleistungen mit jährlicher Abrechnung.
lease.nl.residential.deposit.title=Kaution
lease.nl.residential.deposit.summary=Kaution von höchstens zwei Grundmieten, Rückzahlung innerhalb der gesetzlichen Frist.
lease.nl.residential.payment.title=Zahlung
lease.nl.residential.payment.summary=Wann und wie die Miete im Voraus je Zahlungszeitraum gezahlt wird.
lease.nl.residential.use.title=Nutzung
lease.nl.residential.use.summary=Nutzung nur zu Wohnzwecken, als guter Mieter, und bauliche Veränderungen.
lease.nl.residential.subletting.title=Untervermietung
lease.nl.residential.subletting.summary=Untervermietung nur mit schriftlicher Zustimmung, vorbehaltlich gesetzlicher Rechte.
lease.nl.residential.maintenance.title=Instandhaltung und Reparaturen
lease.nl.residential.maintenance.summary=Der Vermieter beseitigt Mängel; der Mieter führt Kleinreparaturen aus.
lease.nl.residential.energy-label.title=Energieausweis
lease.nl.residential.energy-label.summary=Der Vermieter übergibt eine Kopie des gültigen Energieausweises der Wohnung.
lease.nl.residential.handover-inspection.title=Abnahme und Übergabe
lease.nl.residential.handover-inspection.summary=Zustandsprotokoll bei Beginn, Vorabnahme und Endabnahme bei Rückgabe.
lease.nl.residential.termination.title=Beendigung
lease.nl.residential.termination.summary=Kündigungsfristen und die gesetzlichen Gründe, aus denen der Vermieter kündigen kann.
lease.nl.residential.data-protection.title=Datenschutz
lease.nl.residential.data-protection.summary=Verarbeitung personenbezogener Daten des Mieters gemäß DSGVO.
lease.nl.residential.disputes.title=Streitigkeiten
lease.nl.residential.disputes.summary=Es gilt niederländisches Recht; Streitigkeiten gehen an die Mietkommission oder das Gericht.
# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Vertragsparteien
lease.de.residential.parties.summary=Benennt Vermieter und Mieter; mehrere Mieter haften als Gesamtschuldner.
lease.de.residential.premises.title=Mietsache
lease.de.residential.premises.summary=Beschreibt die vermietete Wohnung; es gilt das Wohnraummietrecht des BGB.
lease.de.residential.term.title=Mietdauer
lease.de.residential.term.summary=Mietbeginn; unbefristet oder befristet nur mit schriftlich mitgeteiltem gesetzlichem Befristungsgrund.
lease.de.residential.rent.title=Miete
lease.de.residential.rent.summary=Die Nettokaltmiete und die Mietpreisbremse in Gebieten mit angespanntem Wohnungsmarkt.
lease.de.residential.rent-adjustment.title=Mieterhöhung
lease.de.residential.rent-adjustment.summary=Gesetzliche Mieterhöhung bis zur ortsüblichen Vergleichsmiete im Rahmen der Kappungsgrenze.
lease.de.residential.service-costs.title=Betriebskosten
lease.de.residential.service-costs.summary=Vorauszahlungen auf die Betriebskosten mit jährlicher Abrechnung innerhalb der gesetzlichen Frist.
lease.de.residential.deposit.title=Mietkaution
lease.de.residential.deposit.summary=Kaution von höchstens 3 Nettokaltmieten, in Teilzahlungen zahlbar und getrennt angelegt.
lease.de.residential.payment.title=Zahlung
lease.de.residential.payment.summary=Die Miete ist im Voraus zu zahlen, spätestens bis zum 3. Werktag des Zahlungszeitraums.
lease.de.residential.use.title=Gebrauch der Mietsache
lease.de.residential.use.summary=Nutzung nur zu Wohnzwecken, pfleglicher Gebrauch, bauliche Veränderungen nur mit Zustimmung.
lease.de.residential.subletting.title=Untervermietung
lease.de.residential.subletting.summary=Gebrauchsüberlassung an Dritte nur mit Erlaubnis; Anspruch auf Erlaubnis für einen Teil des Wohnraums.
lease.de.residential.maintenance.title=Instandhaltung und Mängel
lease.de.residential.maintenance.summary=Der Vermieter erhält die Wohnung; Minderung bei Mängeln; keine Schönheitsreparaturen für den Mieter.
lease.de.residential.minor-repairs.title=Kleinreparaturen
lease.de.residential.minor-repairs.summary=Der Mieter trägt Kosten kleiner Reparaturen bis zu einzutragenden Beträgen je Fall und Jahr.
lease.de.residential.energy-certificate.title=Energieausweis
lease.de.residential.energy-certificate.summary=Der Vermieter legt den Energieausweis vor und übergibt ihn (GModG).
lease.de.residential.registration.title=Wohnungsgeberbestätigung
lease.de.residential.registration.summary=Der Vermieter bestätigt den Einzug für die Anmeldung bei der Meldebehörde.
lease.de.residential.handover-inspection.title=Übergabe und Rückgabe
lease.de.residential.handover-inspection.summary=Übergabe- und Rückgabeprotokoll, Rückgabe der Wohnung und Verjährung in 6 Monaten.
lease.de.residential.termination.title=Kündigung
lease.de.residential.termination.summary=Schriftform, gesetzliche Kündigungsfristen und das berechtigte Interesse des Vermieters.
lease.de.residential.data-protection.title=Datenschutz
lease.de.residential.data-protection.summary=Verarbeitung personenbezogener Daten des Mieters nach der DSGVO.
lease.de.residential.disputes.title=Gerichtsstand und Schlussbestimmungen
lease.de.residential.disputes.summary=Es gilt deutsches Recht; ausschließlich zuständig ist das Amtsgericht am Ort der Wohnung.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Vertragsparteien
lease.de.commercial.parties.summary=Benennt Vermieter und Mieter mit Registernummer, USt-IdNr. und Vertretern.
lease.de.commercial.premises.title=Mietsache
lease.de.commercial.premises.summary=Beschreibt die Geschäftsräume; es gilt das Gewerberaummietrecht des BGB.
lease.de.commercial.permitted-use.title=Mietzweck
lease.de.commercial.permitted-use.summary=Der vereinbarte Mietzweck; Änderungen nur mit Zustimmung; betriebliche Genehmigungen beschafft der Mieter.
lease.de.commercial.term.title=Mietdauer
lease.de.commercial.term.summary=Befristet oder unbefristet; über 1 Jahr nur in Textform, sonst gilt der Vertrag als unbefristet.
lease.de.commercial.rent.title=Miete
lease.de.commercial.rent.summary=Die frei vereinbarte Nettokaltmiete zuzüglich Umsatzsteuer und Vorauszahlungen, soweit vereinbart.
lease.de.commercial.rent-adjustment.title=Wertsicherung
lease.de.commercial.rent-adjustment.summary=Indexklausel nach dem Verbraucherpreisindex nur bei langfristigen Verträgen nach dem PrKG.
lease.de.commercial.service-costs.title=Betriebskosten
lease.de.commercial.service-costs.summary=Betriebskosten nach BetrKV und benannte weitere Kosten, mit Vorauszahlungen und jährlicher Abrechnung.
lease.de.commercial.vat.title=Umsatzsteuer
lease.de.commercial.vat.summary=Der Vermieter optiert zur Umsatzsteuer; der Mieter nutzt nur für vorsteuerunschädliche Umsätze.
lease.de.commercial.deposit.title=Mietsicherheit
lease.de.commercial.deposit.summary=Barkaution oder Bankbürgschaft, ohne gesetzliche Obergrenze für Geschäftsräume.
lease.de.commercial.payment.title=Zahlung
lease.de.commercial.payment.summary=Zahlung im Voraus bis zum 3. Werktag; Aufrechnungsbeschränkung und Verzugszinsen im Geschäftsverkehr.
lease.de.commercial.maintenance.title=Instandhaltung
lease.de.commercial.maintenance.summary=Der Vermieter erhält Dach und Fach und Gemeinschaftsflächen; der Mieter das Innere der Räume.
lease.de.commercial.alterations.title=Bauliche Veränderungen
lease.de.commercial.alterations.summary=Ein- und Umbauten sowie Werbeanlagen nur mit Zustimmung in Textform; Rückbau bei Mietende.
lease.de.commercial.subletting.title=Untervermietung
lease.de.commercial.subletting.summary=Gebrauchsüberlassung an Dritte nur mit Erlaubnis; Sonderkündigungsrecht bei Verweigerung.
lease.de.commercial.competition.title=Konkurrenzschutz
lease.de.commercial.competition.summary=Der Vermieter vermietet nicht an Wettbewerber mit demselben Hauptsortiment.
lease.de.commercial.insurance.title=Versicherungen
lease.de.commercial.insurance.summary=Der Vermieter versichert das Gebäude; der Mieter Einrichtung und Betriebshaftpflicht.
lease.de.commercial.energy-certificate.title=Energieausweis
lease.de.commercial.energy-certificate.summary=Der Vermieter legt den Energieausweis vor und übergibt ihn (GModG).
lease.de.commercial.handover-inspection.title=Übergabe und Rückgabe
lease.de.commercial.handover-inspection.summary=Übergabe- und Rückgabeprotokoll, geräumte Rückgabe und Verjährung in 6 Monaten.
lease.de.commercial.termination.title=Kündigung
lease.de.commercial.termination.summary=Ordentliche Kündigung bis zum 3. Werktag eines Quartals zum Ende des nächsten Quartals; außerordentliche Kündigung.
lease.de.commercial.data-protection.title=Datenschutz
lease.de.commercial.data-protection.summary=Verarbeitung personenbezogener Daten von Vertretern und Ansprechpartnern nach der DSGVO.
lease.de.commercial.disputes.title=Gerichtsstand und Schlussbestimmungen
lease.de.commercial.disputes.summary=Es gilt deutsches Recht; ausschließlich zuständig ist das Gericht am Ort der Mietsache.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Vertragsparteien
lease.fr.residential.parties.summary=Bezeichnet Vermieter und Mieter; Mitmieter haften in den gesetzlichen Grenzen als Gesamtschuldner.
lease.fr.residential.premises.title=Mietsache
lease.fr.residential.premises.summary=Beschreibt die unmöblierte Wohnung als Hauptwohnsitz nach dem Gesetz vom 6. Juli 1989 und dem Mustermietvertrag.
lease.fr.residential.term.title=Mietdauer
lease.fr.residential.term.summary=Mietbeginn, Mindestdauer von 3 oder 6 Jahren je nach Vermieter und stillschweigende Verlängerung.
lease.fr.residential.rent.title=Miete
lease.fr.residential.rent.summary=Die Miete ohne Nebenkosten und die Mietgrenzen in angespannten Gebieten und Gebieten mit Mietobergrenze.
lease.fr.residential.rent-adjustment.title=Mietanpassung
lease.fr.residential.rent-adjustment.summary=Jährliche Anpassung, begrenzt durch den Mietreferenzindex (IRL); keine Anpassung bei Energieklasse F und G.
lease.fr.residential.service-costs.title=Nebenkosten
lease.fr.residential.service-costs.summary=Umlagefähige Nebenkosten als Vorauszahlungen mit jährlicher Abrechnung und Belegen.
lease.fr.residential.deposit.title=Kaution
lease.fr.residential.deposit.summary=Kaution von höchstens 1 Monatsmiete ohne Nebenkosten, Rückzahlung innerhalb von 1 oder 2 Monaten.
lease.fr.residential.payment.title=Zahlung
lease.fr.residential.payment.summary=Wann und wie die Miete gezahlt wird; monatliche Zahlung auf Verlangen, kostenlose Quittungen und keine Vertragsstrafen.
lease.fr.residential.use.title=Gebrauch
lease.fr.residential.use.summary=Friedlicher Gebrauch als Hauptwohnsitz; Veränderungen nur mit schriftlicher Zustimmung des Vermieters.
lease.fr.residential.subletting.title=Untervermietung
lease.fr.residential.subletting.summary=Übertragung und Untervermietung nur mit schriftlicher Zustimmung des Vermieters, auch zur Miethöhe.
lease.fr.residential.maintenance.title=Instandhaltung
lease.fr.residential.maintenance.summary=Pflichten des Vermieters zu Mindeststandard und Reparaturen, laufende Pflege durch den Mieter und Zugang für Arbeiten.
lease.fr.residential.works.title=Arbeiten
lease.fr.residential.works.summary=Seit dem letzten Mietvertrag ausgeführte Arbeiten und vereinbarte Verbesserungsarbeiten mit etwaiger Mieterhöhung.
lease.fr.residential.diagnostics.title=Technische Gutachten
lease.fr.residential.diagnostics.summary=Dem Vertrag beigefügte technische Gutachten, Energieklasse und Mindestenergieeffizienz.
lease.fr.residential.insurance.title=Versicherung
lease.fr.residential.insurance.summary=Der Mieter versichert die Mieterrisiken und weist dies jährlich auf Verlangen nach.
lease.fr.residential.handover-inspection.title=Übergabeprotokoll
lease.fr.residential.handover-inspection.summary=Ein- und Auszugsprotokoll, gemeinsam oder durch einen Gerichtsvollzieher erstellt.
lease.fr.residential.termination.title=Kündigung
lease.fr.residential.termination.summary=Kündigung durch den Mieter (3 oder 1 Monat) und den Vermieter (6 Monate, gesetzliche Gründe); Auflösungsklausel.
lease.fr.residential.annexes.title=Anlagen
lease.fr.residential.annexes.summary=Pflichtanlagen: Informationsblatt, Gutachtenmappe, Übergabeprotokoll und Auszüge der Teilungserklärung.
lease.fr.residential.data-protection.title=Datenschutz
lease.fr.residential.data-protection.summary=Verarbeitung personenbezogener Daten des Mieters nach der DSGVO.
lease.fr.residential.disputes.title=Streitigkeiten
lease.fr.residential.disputes.summary=Es gilt französisches Recht; Schlichtungskommission und Richter für Schutzstreitigkeiten.
# FR commercial (bail commercial) clauses: title and one-line summary for the clause toggle UI.
lease.fr.commercial.parties.title=Vertragsparteien
lease.fr.commercial.parties.summary=Bezeichnet Vermieter und Mieter mit Registernummer, USt-IdNr. und Vertretern.
lease.fr.commercial.premises.title=Mietsache
lease.fr.commercial.premises.summary=Beschreibt die Mieträume und unterstellt den Vertrag dem gesetzlichen Gewerbemietstatut.
lease.fr.commercial.permitted-use.title=Mietzweck
lease.fr.commercial.permitted-use.summary=Die zulässige Tätigkeit in den Räumen und das Recht des Mieters, verwandte Tätigkeiten hinzuzufügen.
lease.fr.commercial.term.title=Mietdauer
