lease.fr.commercial.rent.title=Miete
lease.fr.commercial.rent.summary=Die Anfangsmiete und die Begrenzung der Miete bei der Verlängerung.
lease.fr.commercial.rent-adjustment.title=Indexierung
lease.fr.commercial.rent-adjustment.summary=Jährliche Indexierung nach dem ILC- oder ILAT-Index und gesetzliche Mietanpassung.
lease.fr.commercial.service-costs.title=Nebenkosten und Steuern
lease.fr.commercial.service-costs.summary=Abschließende Aufstellung der Nebenkosten und Steuern, nicht umlagefähige Kosten und jährliche Abrechnung.
lease.fr.commercial.vat.title=Umsatzsteuer
lease.fr.commercial.vat.summary=Umsatzsteuerbefreiung leerer Räume und Option des Vermieters zur Umsatzsteuer.
lease.fr.commercial.deposit.title=Kaution
lease.fr.commercial.deposit.summary=Kaution, bei Einzelhandel und Handwerk auf 1 Quartalsmiete begrenzt, Rückzahlung binnen 3 Monaten.
lease.fr.commercial.payment.title=Zahlung
lease.fr.commercial.payment.summary=Vorauszahlung der Miete und Recht auf monatliche Zahlung für Einzelhandel und Handwerk.
lease.fr.commercial.maintenance.title=Instandhaltung
lease.fr.commercial.maintenance.summary=Reparaturpflichten des Vermieters, große Reparaturen nicht zulasten des Mieters, laufende Pflege.
lease.fr.commercial.alterations.title=Bauliche Veränderungen
lease.fr.commercial.alterations.summary=Arbeiten und Ausbauten nur mit vorheriger schriftlicher Zustimmung des Vermieters.
lease.fr.commercial.assignment.title=Übertragung
lease.fr.commercial.assignment.summary=Übertragung des Mietvertrags beim Verkauf des Geschäfts und die Grenze von 3 Jahren für die Haftung des Veräußerers.
lease.fr.commercial.subletting.title=Untervermietung
lease.fr.commercial.subletting.summary=Untervermietung nur bei Erlaubnis im Vertrag oder durch den Vermieter, der am Vertrag mitwirkt.
lease.fr.commercial.insurance.title=Versicherung
lease.fr.commercial.insurance.summary=Gebäudeversicherung durch den Vermieter, Inventar- und Haftpflichtversicherung durch den Mieter.
lease.fr.commercial.diagnostics.title=Gutachten
lease.fr.commercial.diagnostics.summary=Energieausweis, Risikoerklärung, Asbestinformationen und Umweltanhang.
lease.fr.commercial.handover-inspection.title=Übergabeprotokoll
lease.fr.commercial.handover-inspection.summary=Zustandsprotokolle bei Übernahme, bei Übertragung und bei Rückgabe der Räume.
lease.fr.commercial.renewal.title=Verlängerung
lease.fr.commercial.renewal.summary=Das Verlängerungsrecht des Mieters, die Räumungsentschädigung und die Kündigung durch Gerichtsvollzieherakt.
lease.fr.commercial.pre-emption.title=Vorkaufsrecht
lease.fr.commercial.pre-emption.summary=Das Vorkaufsrecht des Mieters beim Verkauf von Einzelhandels- oder Handwerksräumen.
lease.fr.commercial.termination.title=Beendigung
lease.fr.commercial.termination.summary=Ende des Mietverhältnisses und Auflösungsklausel 1 Monat nach erfolgloser Aufforderung.
lease.fr.commercial.data-protection.title=Datenschutz
lease.fr.commercial.data-protection.summary=Verarbeitung personenbezogener Daten der Parteien und ihrer Ansprechpartner nach der DSGVO.
lease.fr.commercial.disputes.title=Streitigkeiten
lease.fr.commercial.disputes.summary=Es gilt französisches Recht; Schlichtungskommission und das Gericht am Ort des Gebäudes.
lease.es.residential.parties.title=Vertragsparteien
lease.es.residential.parties.summary=Bezeichnet Vermieter und Mieter mit Steuernummer; mehrere Mieter haften gesamtschuldnerisch.
lease.es.residential.premises.title=Wohnung
lease.es.residential.premises.summary=Beschreibt die als ständige Wohnung des Mieters vermietete Wohnung und das zwingende Regime der LAU.
lease.es.residential.term.title=Mietdauer
lease.es.residential.term.summary=Vereinbarte Dauer mit gesetzlicher jährlicher Verlängerung bis 5 Jahre (7 bei einer juristischen Person als Vermieter) und stillschweigender Verlängerung um bis zu 3 weitere Jahre.
lease.es.residential.rent.title=Miete
lease.es.residential.rent.summary=Frei vereinbarte Anfangsmiete mit den Grenzen und Pflichtangaben in angespannten Wohnungsmärkten.
lease.es.residential.rent-adjustment.title=Mietanpassung
lease.es.residential.rent-adjustment.summary=Jährliche Anpassung nur bei ausdrücklicher Vereinbarung, begrenzt durch den Verbraucherpreisindex und den Referenzindex des INE (IRAV).
lease.es.residential.service-costs.title=Nebenkosten
lease.es.residential.service-costs.summary=Allgemeine Gebäudekosten trägt der Mieter nur bei schriftlicher Vereinbarung mit Jahresbetrag; Leistungen mit Zähler.
lease.es.residential.deposit.title=Kaution
lease.es.residential.deposit.summary=Pflichtkaution in Geld von 1 Monatsmiete, zusätzliche Sicherheit höchstens 2 Monatsmieten, regionale Hinterlegungsregeln.
lease.es.residential.payment.title=Zahlung
lease.es.residential.payment.summary=Monatliche Zahlung auf elektronischem Weg, höchstens 1 Monat im Voraus, gegen Quittung.
lease.es.residential.use.title=Gebrauch
lease.es.residential.use.summary=Nutzung als ständige Wohnung des Mieters und Einhaltung der Regeln der Eigentümergemeinschaft.
lease.es.residential.subletting.title=Abtretung und Untervermietung
lease.es.residential.subletting.summary=Abtretung nur mit schriftlicher Zustimmung; Untervermietung nur teilweise und mit vorheriger schriftlicher Zustimmung.
lease.es.residential.maintenance.title=Instandhaltung und Arbeiten
lease.es.residential.maintenance.summary=Notwendige Reparaturen durch den Vermieter, kleine Reparaturen durch den Mieter, Modernisierungsarbeiten und Arbeiten des Mieters.
lease.es.residential.energy-certificate.title=Energieausweis
lease.es.residential.energy-certificate.summary=Kopie des Energieeffizienzlabels als Anlage, Nutzungsempfehlungen und vorvertragliche Informationen.
lease.es.residential.pre-emption.title=Vorkaufsrechte
lease.es.residential.pre-emption.summary=Vorkaufs- und Eintrittsrecht (tanteo y retracto) des Mieters bei Verkauf, möglicher Verzicht und Stellung des Erwerbers.
lease.es.residential.subrogation.title=Eintritt in den Mietvertrag
lease.es.residential.subrogation.summary=Personen, die das Mietverhältnis beim Tod des Mieters fortsetzen können, und die schriftliche Mitteilung binnen 3 Monaten.
lease.es.residential.handover-inspection.title=Übergabe und Rückgabe
lease.es.residential.handover-inspection.summary=Inventar bei der Übergabe und Rückgabe der Wohnung im übernommenen Zustand.
lease.es.residential.termination.title=Beendigung
lease.es.residential.termination.summary=Rücktritt des Mieters nach 6 Monaten mit einer Frist von 30 Tagen, gesetzliche Auflösungsgründe und Räumungsregeln.
lease.es.residential.notices.title=Mitteilungen
lease.es.residential.notices.summary=Anschriften, elektronische Mitteilungen und nachweisbare Zustellung wie Burofax.
