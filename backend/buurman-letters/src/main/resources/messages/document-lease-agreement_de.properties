# ===== AT lease clause titles and summaries (country pack) =====
# AT residential (Mietvertrag über eine Wohnung) clauses: title and one-line summary for the clause toggle UI.
lease.at.residential.parties.title=Vertragsparteien
lease.at.residential.parties.summary=Benennt Vermieter und Mieter; mehrere Mieter haften zur ungeteilten Hand; Angabe, ob der Vermieter Unternehmer ist.
lease.at.residential.premises.title=Mietgegenstand
lease.at.residential.premises.summary=Beschreibt die Wohnung und hält den Anwendungsbereich des MRG fest: Vollanwendung, Teilanwendung oder Vollausnahme.
lease.at.residential.term.title=Mietdauer
lease.at.residential.term.summary=Unbefristet oder befristet; nach dem MRG schriftlich und mindestens 5 Jahre (3 Jahre bei Vermietern ohne Unternehmereigenschaft).
lease.at.residential.rent.title=Hauptmietzins
lease.at.residential.rent.summary=Der Hauptmietzins und im Vollanwendungsbereich die Mietzinsgrenzen des MRG (Richtwert, Kategoriebeträge).
lease.at.residential.rent-adjustment.title=Wertsicherung
lease.at.residential.rent-adjustment.summary=Jährliche Wertsicherung zum 1. April nach dem MieWeG; Inflation über 3 Prozent zählt nur zur Hälfte.
lease.at.residential.service-costs.title=Betriebskosten
lease.at.residential.service-costs.summary=Anteil an Betriebskosten und öffentlichen Abgaben in monatlichen Teilbeträgen; im Vollanwendungsbereich Abrechnung bis 30. Juni.
lease.at.residential.deposit.title=Kaution
lease.at.residential.deposit.summary=Kaution ohne gesetzliche Obergrenze, auf einem Sparbuch veranlagt und samt Zinsen unverzüglich zurückzustellen.
lease.at.residential.payment.title=Zahlung
lease.at.residential.payment.summary=Mietzins monatlich im Vorhinein bis zum 5.; gesetzliche Verzugszinsen von 4 Prozent pro Jahr.
lease.at.residential.use.title=Verwendung
lease.at.residential.use.summary=Nur Wohnzwecke, Betreten aus wichtigen Gründen und das Anzeigeverfahren für wesentliche Veränderungen.
lease.at.residential.subletting.title=Untervermietung
lease.at.residential.subletting.summary=Untervermietung nur mit Zustimmung; im Vollanwendungsbereich Verweigerung nur aus wichtigem Grund.
lease.at.residential.maintenance.title=Erhaltung und Mängel
lease.at.residential.maintenance.summary=Der Vermieter erhält die Wohnung brauchbar; Zinsbefreiung bei Unbrauchbarkeit; der Mieter zeigt Mängel ohne Verzug an.
lease.at.residential.energy-certificate.title=Energieausweis
lease.at.residential.energy-certificate.summary=Der Vermieter legt den Energieausweis vor und händigt ihn aus (EAVG 2012).
lease.at.residential.registration.title=Meldepflicht
lease.at.residential.registration.summary=Der Mieter meldet sich binnen 3 Tagen nach dem Einzug bei der Meldebehörde an.
lease.at.residential.handover-inspection.title=Übergabe und Rückstellung
lease.at.residential.handover-inspection.summary=Übergabe- und Rückstellungsprotokoll, Rückstellung im übernommenen Zustand und Fristen für Ersatzansprüche.
lease.at.residential.termination.title=Kündigung
lease.at.residential.termination.summary=Nach dem MRG kündigt der Vermieter nur gerichtlich und aus wichtigen Gründen; Kündigungsfristen und vorzeitige Auflösung.
lease.at.residential.data-protection.title=Datenschutz
lease.at.residential.data-protection.summary=Verarbeitung personenbezogener Daten des Mieters nach der DSGVO.
lease.at.residential.disputes.title=Gerichtsstand und Schlussbestimmungen
lease.at.residential.disputes.summary=Österreichisches Recht; Bezirksgericht am Ort der Wohnung; Wohnungsmietverträge sind gebührenfrei.
# AT commercial (Mietvertrag über eine Geschäftsräumlichkeit) clauses: title and one-line summary for the clause toggle UI.
lease.at.commercial.parties.title=Vertragsparteien
lease.at.commercial.parties.summary=Benennt Vermieter und Mieter mit Firmenbuchnummer, UID-Nummer und Vertretern.
lease.at.commercial.premises.title=Mietgegenstand
lease.at.commercial.premises.summary=Beschreibt die Geschäftsräumlichkeit und hält den Anwendungsbereich des MRG fest.
lease.at.commercial.permitted-use.title=Geschäftszweck
lease.at.commercial.permitted-use.summary=Der vereinbarte Geschäftszweck; Änderungen nur mit Zustimmung; Nichtverwendung kann ein Kündigungsgrund sein.
lease.at.commercial.term.title=Mietdauer
lease.at.commercial.term.summary=Befristet oder unbefristet; nach dem MRG ist für die Befristung eine schriftliche Ablaufvereinbarung nötig.
lease.at.commercial.rent.title=Hauptmietzins
lease.at.commercial.rent.summary=Der Hauptmietzins; im Vollanwendungsbereich mit dem angemessenen Betrag begrenzt, worauf sich ein Unternehmer als Mieter nur nach rechtzeitiger Rüge berufen kann.
lease.at.commercial.rent-adjustment.title=Wertsicherung
lease.at.commercial.rent-adjustment.summary=Wertsicherung nach dem Verbraucherpreisindex 2020 mit einzutragendem Schwellenwert, nach oben wie nach unten.
lease.at.commercial.service-costs.title=Betriebskosten
lease.at.commercial.service-costs.summary=Anteil an Betriebskosten und öffentlichen Abgaben in monatlichen Teilbeträgen mit jährlicher Abrechnung.
lease.at.commercial.vat.title=Umsatzsteuer
lease.at.commercial.vat.summary=Der Vermieter optiert zur Umsatzsteuer; der Mieter verwendet den Mietgegenstand nahezu ausschließlich für vorsteuerunschädliche Umsätze.
lease.at.commercial.deposit.title=Kaution
lease.at.commercial.deposit.summary=Barkaution oder Bankgarantie ohne gesetzliche Obergrenze, Rückstellung nach Vertragsende.
lease.at.commercial.payment.title=Zahlung
lease.at.commercial.payment.summary=Mietzins monatlich im Vorhinein; Verzugszinsen zwischen Unternehmern von 9,2 Prozentpunkten über dem Basiszinssatz.
lease.at.commercial.maintenance.title=Erhaltung
lease.at.commercial.maintenance.summary=Im Vollanwendungsbereich gilt § 3 MRG; sonst erhält der Vermieter Bausubstanz und allgemeine Teile, der Mieter das Innere.
lease.at.commercial.alterations.title=Bauliche Veränderungen
lease.at.commercial.alterations.summary=Ein- und Umbauten sowie Werbeanlagen nur mit schriftlicher Zustimmung; Rückbau bei Vertragsende.
lease.at.commercial.subletting.title=Untervermietung und Unternehmensveräußerung
lease.at.commercial.subletting.summary=Untervermietung nur mit Zustimmung; gesetzliche Rechte bei Veräußerung oder Verpachtung des Unternehmens im Vollanwendungsbereich.
lease.at.commercial.insurance.title=Versicherungen
lease.at.commercial.insurance.summary=Der Vermieter versichert das Gebäude; der Mieter Einrichtung und Betriebshaftpflicht.
lease.at.commercial.energy-certificate.title=Energieausweis
lease.at.commercial.energy-certificate.summary=Der Vermieter legt den Energieausweis vor und händigt ihn aus (EAVG 2012).
lease.at.commercial.contract-fee.title=Vertragsgebühr
lease.at.commercial.contract-fee.summary=Gebühr von 1 Prozent des Vertragswerts nach dem Gebührengesetz, vom Vermieter berechnet und vom Mieter getragen.
lease.at.commercial.handover-inspection.title=Übergabe und Rückstellung
lease.at.commercial.handover-inspection.summary=Übergabe- und Rückstellungsprotokoll, geräumte Rückstellung und Fristen für Ersatzansprüche.
lease.at.commercial.termination.title=Kündigung
lease.at.commercial.termination.summary=Kündigung zum Quartalsende mit 3 Monaten Frist; Kündigungsbeschränkungen für den Vermieter nach dem MRG.
lease.at.commercial.data-protection.title=Datenschutz
lease.at.commercial.data-protection.summary=Verarbeitung personenbezogener Daten von Vertretern und Ansprechpartnern nach der DSGVO.
lease.at.commercial.disputes.title=Gerichtsstand
lease.at.commercial.disputes.summary=Österreichisches Recht; zuständig ist das Bezirksgericht am Ort des Mietgegenstandes.
# ===== end AT =====


