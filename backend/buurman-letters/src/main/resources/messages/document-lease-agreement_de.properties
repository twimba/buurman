lease.gb.residential.term.summary=Mietbeginn; periodisches Mietverhältnis ohne feste Laufzeit in England und Schottland, periodisch oder befristet in Wales und Nordirland.
lease.gb.residential.rent.title=Miete
lease.gb.residential.rent.summary=Die Miete und die Mietperiode; in England darf die Mietperiode 1 Monat nicht überschreiten.
lease.gb.residential.rent-adjustment.title=Mieterhöhungen
lease.gb.residential.rent-adjustment.summary=Mieterhöhung nur, soweit das Gesetz sie zulässt: in England durch Mitteilung nach section 13 oder Entscheidung des Tribunals; 2 Monate in England und Wales, 3 Monate in Schottland und Nordirland, höchstens 1 Erhöhung pro Jahr.
lease.gb.residential.service-costs.title=Versorgung und Gemeindesteuer
lease.gb.residential.service-costs.summary=Versorgungsleistungen und council tax oder domestic rates zulasten des Mieters sowie etwaige an den Vermieter zu zahlende Kosten.
lease.gb.residential.deposit.title=Kaution
lease.gb.residential.deposit.summary=Kaution in einem zugelassenen Sicherungssystem; höchstens 5 oder 6 Wochenmieten in England, 2 Monatsmieten in Schottland und 1 Monatsmiete in Nordirland.
lease.gb.residential.payment.title=Zahlung
lease.gb.residential.payment.summary=Zahlungstermin und Zahlungsweise; in England keine Miete vor der Mietperiode und Verzugszinsen höchstens 3 % über dem Basiszinssatz.
lease.gb.residential.fees.title=Gebühren und zulässige Zahlungen
lease.gb.residential.fees.summary=Nur zulässige Zahlungen dürfen verlangt werden: Tenant Fees Act 2019 in England, Renting Homes (Fees, Discrimination etc.) (Wales) Act 2019 in Wales.
lease.gb.residential.use.title=Gebrauch und Haustiere
lease.gb.residential.use.summary=Nutzung als Wohnung ohne Belästigung anderer; Haustiere mit Zustimmung des Vermieters, die nicht unbillig verweigert wird.
lease.gb.residential.subletting.title=Untervermietung und Übertragung
lease.gb.residential.subletting.summary=Übertragung, Untervermietung und Aufnahme von Untermietern nur mit Zustimmung des Vermieters.
lease.gb.residential.maintenance.title=Instandhaltung und Bewohnbarkeit
lease.gb.residential.maintenance.summary=Die gesetzlichen Instandhaltungs- und Bewohnbarkeitspflichten des Vermieters je Landesteil; der Mieter meldet Mängel und gewährt Zutritt nach 24 Stunden Ankündigung.
lease.gb.residential.safety.title=Sicherheit
lease.gb.residential.safety.summary=Gassicherheitsprüfung alle 12 Monate, Elektroprüfung mindestens alle 5 Jahre, Rauch- und Kohlenmonoxidmelder.
lease.gb.residential.energy-certificate.title=Energieausweis
lease.gb.residential.energy-certificate.summary=Der Vermieter stellt einen gültigen Energieausweis bereit; in England und Wales muss die Wohnung mindestens Klasse E erreichen.
lease.gb.residential.registration.title=Registrierung und Lizenzen
lease.gb.residential.registration.summary=Registrierung des Vermieters in Wales, Schottland und Nordirland sowie eine etwa erforderliche Lizenz der Kommune.
lease.gb.residential.right-to-rent.title=Aufenthaltsrechtliche Prüfung
lease.gb.residential.right-to-rent.summary=Prüfung des Aufenthaltsrechts (right to rent) volljähriger Bewohner nach Einwanderungsrecht, die nur in England gilt.
lease.gb.residential.statutory-information.title=Gesetzliche Informationen
lease.gb.residential.statutory-information.summary=Die schriftliche Erklärung, Bedingungen oder Mietinformationen, die der Vermieter nach dem Recht des jeweiligen Landesteils erteilen muss, und eine Zustellanschrift.
lease.gb.residential.handover-inspection.title=Inventar und Rückgabe
lease.gb.residential.handover-inspection.summary=Inventarliste und Zustandsprotokoll zu Beginn; Rückgabe der Wohnung am Ende, ausgenommen gewöhnliche Abnutzung.
lease.gb.residential.termination.title=Beendigung
lease.gb.residential.termination.summary=Kündigung durch den Mieter sowie die gesetzlichen Gründe und Mitteilungen des Vermieters je Landesteil; keine Räumung nach section 21 in England.
lease.gb.residential.notices.title=Mitteilungen
lease.gb.residential.notices.summary=Schriftliche Mitteilungen durch Boten, per Post oder, soweit zulässig, per E-Mail.
lease.gb.residential.data-protection.title=Datenschutz
lease.gb.residential.data-protection.summary=Verarbeitung personenbezogener Daten des Mieters nach der UK GDPR und dem Data Protection Act 2018.
lease.gb.residential.disputes.title=Anwendbares Recht und Streitigkeiten
lease.gb.residential.disputes.summary=Das Recht und die Gerichte oder Tribunale des Landesteils, in dem die Wohnung liegt.
lease.gb.commercial.parties.title=Vertragsparteien
lease.gb.commercial.parties.summary=Nennt Vermieter und Mieter mit Handelsregisternummer, eingetragenem Sitz und Umsatzsteuer-Identifikationsnummer.
lease.gb.commercial.premises.title=Mietsache
lease.gb.commercial.premises.summary=Beschreibt die Geschäftsräume, ihre Fläche und die eingeräumten Rechte.
lease.gb.commercial.permitted-use.title=Mietzweck
lease.gb.commercial.permitted-use.summary=Die zulässige gewerbliche Nutzung; der Mieter beschafft Baugenehmigungen und sonstige Erlaubnisse.
lease.gb.commercial.term.title=Mietdauer
lease.gb.commercial.term.summary=Mietbeginn, feste Laufzeit oder periodisches Mietverhältnis; Eintragung von Mietverträgen über mehr als 7 Jahre und Grunderwerbsteuer.
lease.gb.commercial.security-of-tenure.title=Bestandsschutz
lease.gb.commercial.security-of-tenure.summary=Verlängerungsrechte nach dem Landlord and Tenant Act 1954 (England und Wales) oder der Order von 1996 (Nordirland), deren Ausschluss und stillschweigende Verlängerung (tacit relocation) in Schottland.
lease.gb.commercial.rent.title=Miete
lease.gb.commercial.rent.summary=Die Miete ohne Umsatzsteuer, Nebenkosten und Versicherungsbeitrag.
lease.gb.commercial.rent-adjustment.title=Mietanpassung
lease.gb.commercial.rent-adjustment.summary=Anpassung an die Marktmiete oder nach einem Index, nach oben oder unten, mit Festsetzung durch einen unabhängigen Sachverständigen.
lease.gb.commercial.service-costs.title=Nebenkosten
lease.gb.commercial.service-costs.summary=Ein angemessener Anteil an den Betriebskosten des Gebäudes mit Budget und jährlicher Abrechnung.
lease.gb.commercial.vat.title=Umsatzsteuer
lease.gb.commercial.vat.summary=Alle Beträge verstehen sich ohne Umsatzsteuer; Umsatzsteuer ist geschuldet, wenn der Vermieter zur Steuerpflicht optiert hat.
lease.gb.commercial.deposit.title=Mietsicherheit
lease.gb.commercial.deposit.summary=Mietsicherheit auf einem gesonderten verzinslichen Konto mit Regeln zu Wiederauffüllung und Rückzahlung.
lease.gb.commercial.payment.title=Zahlung
lease.gb.commercial.payment.summary=Miete im Voraus ohne Aufrechnung, Verzugszinsen und das Verfahren zur Beitreibung gewerblicher Mietrückstände in England und Wales.
lease.gb.commercial.maintenance.title=Instandhaltung
lease.gb.commercial.maintenance.summary=Vollständige oder innere Instandhaltungspflicht, begrenzt durch ein etwaiges Zustandsprotokoll.
lease.gb.commercial.alterations.title=Bauliche Veränderungen
lease.gb.commercial.alterations.summary=Keine baulichen Eingriffe in die Struktur; andere Veränderungen mit Zustimmung; Rückbau am Mietende.
lease.gb.commercial.assignment.title=Übertragung und Untervermietung
lease.gb.commercial.assignment.summary=Übertragung und Untervermietung mit Zustimmung, die nicht unbillig verweigert wird; Regeln zu Haftungsbefreiung und Garantie in England und Wales.
lease.gb.commercial.insurance.title=Versicherung
lease.gb.commercial.insurance.summary=Der Vermieter versichert das Gebäude und legt die Prämie um; der Mieter versichert Inventar und Haftpflicht; Mietaussetzung nach versichertem Schaden.
lease.gb.commercial.energy-certificate.title=Energieeffizienz
lease.gb.commercial.energy-certificate.summary=Energieausweis für die Mietsache; Mindestklasse E für Nichtwohngebäude in England und Wales.
lease.gb.commercial.break-option.title=Sonderkündigungsrecht
lease.gb.commercial.break-option.summary=Recht, den Mietvertrag zu einem Stichtag vorzeitig zu beenden, mit Frist und Bedingungen.
lease.gb.commercial.handover-inspection.title=Zustand und Rückgabe
lease.gb.commercial.handover-inspection.summary=Zustandsprotokoll, geräumte Rückgabe und die Begrenzung des Schadensersatzes wegen unterlassener Instandhaltung.
lease.gb.commercial.termination.title=Beendigung und Verwirkung
lease.gb.commercial.termination.summary=Verwirkung (forfeiture oder irritancy) bei Zahlungsverzug, Vertragsverletzung oder Insolvenz, vorbehaltlich gesetzlicher Mitteilung und Rechtsschutz.
lease.gb.commercial.notices.title=Mitteilungen
lease.gb.commercial.notices.summary=Schriftliche Mitteilungen durch Boten oder per Einschreiben an den eingetragenen Sitz.
lease.gb.commercial.guarantor.title=Bürge
lease.gb.commercial.guarantor.summary=Garantie der Pflichten des Mieters durch einen Bürgen.
lease.gb.commercial.data-protection.title=Datenschutz
lease.gb.commercial.data-protection.summary=Verarbeitung personenbezogener Daten der Vertreter der Parteien nach der UK GDPR.
lease.gb.commercial.disputes.title=Anwendbares Recht und Streitigkeiten
lease.gb.commercial.disputes.summary=Das Recht und die Gerichte des Rechtsgebiets, in dem die Mietsache liegt; salvatorische Klausel.
# ===== end GB =====


# ===== GR lease clause titles and summaries (country pack) =====
lease.gr.residential.parties.title=Vertragsparteien
lease.gr.residential.parties.summary=Bezeichnet Vermieter und Mieter mit Steuernummer und Identitätsangaben; Mitmieter haften gesamtschuldnerisch.
lease.gr.residential.premises.title=Mietsache
lease.gr.residential.premises.summary=Beschreibt die als Hauptwohnsitz des Mieters vermietete Wohnung, das Zubehör und die Katasternummer.
lease.gr.residential.term.title=Mietdauer
lease.gr.residential.term.summary=Befristet oder unbefristet; gesetzliche Mindestdauer von 3 Jahren für einen Hauptwohnsitz, verkürzbar nur durch spätere notarielle Vereinbarung.
lease.gr.residential.rent.title=Miete
lease.gr.residential.rent.summary=Frei vereinbarte Miete; keine Befreiung von der Miete aus Gründen in der Person des Mieters.
lease.gr.residential.rent-adjustment.title=Mietanpassung
lease.gr.residential.rent-adjustment.summary=Frei vereinbarte Anpassung; gesetzliche Regel von 75% des Lebenshaltungskostenindex bei einer Dauer unter 3 Jahren ohne Anpassungsklausel.
lease.gr.residential.service-costs.title=Versorgung und Gemeinschaftskosten
lease.gr.residential.service-costs.summary=Verbrauch und Gemeinschaftskosten der Nutzung trägt der Mieter; Steuern und außerordentliche Gebäudekosten trägt der Vermieter.
lease.gr.residential.deposit.title=Kaution
lease.gr.residential.deposit.summary=Freiwillige Kaution, nicht mit der Miete verrechenbar, am Ende abzüglich geschuldeter Beträge zurückzuzahlen.
lease.gr.residential.payment.title=Zahlung
lease.gr.residential.payment.summary=Zahlungstermin und Überweisung; ab dem Stichtag Zahlung auf ein der AADE gemeldetes Bankkonto des Vermieters.
lease.gr.residential.use.title=Gebrauch
lease.gr.residential.use.summary=Sorgfältiger Gebrauch als Hauptwohnsitz, Hausordnung und Besuche des Vermieters bis zu 1 Mal alle 3 Monate.
lease.gr.residential.subletting.title=Untervermietung
lease.gr.residential.subletting.summary=Untervermietung und Kurzzeitvermietung nur mit schriftlicher Zustimmung des Vermieters; Haftung für den Dritten.
lease.gr.residential.maintenance.title=Instandhaltung und Mängel
lease.gr.residential.maintenance.summary=Der Vermieter erhält die Mietsache gebrauchstauglich; Mietminderung bei Mängeln, Aufwendungen und Anzeigepflicht des Mieters.
lease.gr.residential.energy-certificate.title=Energieausweis
lease.gr.residential.energy-certificate.summary=Pflichtausweis, der einem neuen Mieter vorgelegt und übergeben wird, mit seiner Nummer in der Mietvertragsmeldung.
lease.gr.residential.registration.title=Mietvertragsmeldung an die AADE
lease.gr.residential.registration.summary=Elektronische Meldung des Mietvertrags an die Steuerbehörde und Annahme durch den Mieter innerhalb von 30 Tagen.
lease.gr.residential.sale-of-premises.title=Veräußerung der Mietsache
lease.gr.residential.sale-of-premises.summary=Stellung des neuen Eigentümers bei einem Mietvertrag mit sicherem Datum und sein Kündigungsrecht in anderen Fällen.
lease.gr.residential.handover-inspection.title=Übergabe und Rückgabe
lease.gr.residential.handover-inspection.summary=Übergabeprotokoll, Rückgabe im übernommenen Zustand, Vorenthaltung und Verjährungsfristen von 6 Monaten.
lease.gr.residential.termination.title=Beendigung
lease.gr.residential.termination.summary=Mindestdauer, Kündigung unbefristeter Verträge, Kündigung wegen Zahlungsrückstands, Gründe des Mieters, Familienwohnung und Räumungsanordnung.
lease.gr.residential.data-protection.title=Datenschutz
lease.gr.residential.data-protection.summary=Verarbeitung der personenbezogenen Daten des Mieters nach der DSGVO und dem Gesetz 4624/2019.
lease.gr.residential.disputes.title=Anwendbares Recht und Streitigkeiten
lease.gr.residential.disputes.summary=Griechisches Recht und das Gericht am Ort der Immobilie im besonderen Verfahren für Mietstreitigkeiten.
lease.gr.commercial.parties.title=Vertragsparteien
lease.gr.commercial.parties.summary=Bezeichnet Vermieter und Mieter mit Steuernummer, Handelsregisternummer und gesetzlichen Vertretern.
lease.gr.commercial.premises.title=Mietsache
lease.gr.commercial.premises.summary=Beschreibt die Geschäftsräume, das Zubehör und die Eignung für den vereinbarten Gebrauch.
lease.gr.commercial.permitted-use.title=Mietzweck
lease.gr.commercial.permitted-use.summary=Tätigkeit des Mieters, Anwendungsbereich des Präsidialdekrets 34/1995, Genehmigungen und sorgfältiger Gebrauch.
lease.gr.commercial.term.title=Mietdauer
lease.gr.commercial.term.summary=Befristet oder unbefristet; Mindestdauer von 3 Jahren für Mietverträge nach dem Präsidialdekret 34/1995 und keine gesetzliche Entschädigung für den Kundenstamm.
lease.gr.commercial.rent.title=Miete
lease.gr.commercial.rent.summary=Von den Parteien frei festgelegte Miete zuzüglich der Steuer auf die Miete.
lease.gr.commercial.rent-adjustment.title=Mietanpassung
lease.gr.commercial.rent-adjustment.summary=Vereinbarte Anpassung, gesetzliche Auffangregeln und die Obergrenze von 3% für Anpassungen im Jahr 2026.
lease.gr.commercial.service-costs.title=Versorgung und Gemeinschaftskosten
lease.gr.commercial.service-costs.summary=Verbrauch und Gemeinschaftskosten trägt der Mieter; Steuern auf die Mietsache trägt der Vermieter, sofern nichts anderes vereinbart ist.
lease.gr.commercial.vat.title=Umsatzsteuer und digitale Transaktionsabgabe
lease.gr.commercial.vat.summary=Umsatzsteuer bei Option, sonst die digitale Transaktionsabgabe von 3,60%, erklärt vom Vermieter oder in den gesetzlichen Fällen vom Mieter.
lease.gr.commercial.deposit.title=Kaution
lease.gr.commercial.deposit.summary=Freiwillige Barkaution oder Bankbürgschaft, bei Mietanpassungen aufgestockt und am Ende zurückzuzahlen.
lease.gr.commercial.payment.title=Zahlung
lease.gr.commercial.payment.summary=Zahlungstermin, Überweisung und Steuerbelege; Zahlung auf ein der AADE gemeldetes Konto des Vermieters, wenn die Miete keine Betriebsausgabe ist.
lease.gr.commercial.maintenance.title=Instandhaltung und Mängel
lease.gr.commercial.maintenance.summary=Der Vermieter erhält die Mietsache gebrauchstauglich; Aufteilung von laufender Instandhaltung und Reparaturen an der Bausubstanz.
lease.gr.commercial.alterations.title=Ausbau und bauliche Veränderungen
lease.gr.commercial.alterations.summary=Ausbauarbeiten auf Kosten des Mieters mit schriftlicher Zustimmung; Aufwendungen und Schicksal der Arbeiten am Ende.
lease.gr.commercial.assignment.title=Übertragung und Untervermietung
lease.gr.commercial.assignment.summary=Gebrauchsüberlassung nur soweit gesetzlich erlaubt oder mit Zustimmung; Ausnahme für Gesellschaften nach 3 Jahren und Übertragung bei Krankheit oder Tod.
lease.gr.commercial.insurance.title=Versicherung
lease.gr.commercial.insurance.summary=Gebäudeversicherung durch den Vermieter; Versicherung von Einrichtung, Waren und Haftpflicht durch den Mieter.
lease.gr.commercial.energy-certificate.title=Energieausweis
lease.gr.commercial.energy-certificate.summary=Pflichtausweis, der einem neuen Mieter vorgelegt und übergeben wird, mit seiner Nummer in der Mietvertragsmeldung.
lease.gr.commercial.registration.title=Mietvertragsmeldung an die AADE
lease.gr.commercial.registration.summary=Elektronische Meldung des Mietvertrags an die Steuerbehörde und Annahme durch den Mieter innerhalb von 30 Tagen.
lease.gr.commercial.sale-of-premises.title=Veräußerung der Mietsache
lease.gr.commercial.sale-of-premises.summary=Stellung des neuen Eigentümers bei einem Mietvertrag mit sicherem Datum und sein Kündigungsrecht in anderen Fällen.
lease.gr.commercial.handover-inspection.title=Übergabe und Rückgabe
lease.gr.commercial.handover-inspection.summary=Übergabeprotokoll, Rückgabe im übernommenen Zustand, Vorenthaltung, Verjährungsfristen und Besichtigungen.
lease.gr.commercial.termination.title=Beendigung
lease.gr.commercial.termination.summary=Kündigungsregeln, Kündigung wegen Zahlungsrückstands, Gründe des Mieters und Räumungsanordnung; vorzeitige Kündigung nur nach Vereinbarung.
lease.gr.commercial.data-protection.title=Datenschutz
lease.gr.commercial.data-protection.summary=Verarbeitung der personenbezogenen Daten der für die Parteien handelnden Personen nach der DSGVO.
lease.gr.commercial.disputes.title=Anwendbares Recht und Streitigkeiten
lease.gr.commercial.disputes.summary=Griechisches Recht, das Gericht am Ort der Immobilie und Nichtigkeit von Verzichten nach dem Präsidialdekret 34/1995.
# ===== end GR =====


# ===== IE lease clause titles and summaries (country pack) =====
lease.ie.residential.parties.title=Vertragsparteien
lease.ie.residential.parties.summary=Vermieter und Mieter, gesamtschuldnerische Haftung der Mitmieter sowie Bevollmächtigter und Kontaktdaten des Vermieters.
lease.ie.residential.premises.title=Wohnung
lease.ie.residential.premises.summary=Die vermietete Wohnung und die Anwendung des Residential Tenancies Act 2004 auf ab dem 1. März 2026 begründete Mietverhältnisse.
lease.ie.residential.term.title=Mietdauer und Bestandsschutz
lease.ie.residential.term.summary=Mietbeginn, befristete oder periodische Miete, Part-4-Mietverhältnis nach 6 Monaten und Mindestlaufzeiten von 6 Jahren.
lease.ie.residential.rent.title=Miete
lease.ie.residential.rent.summary=Miethöhe, die Marktmiete als Obergrenze und die landesweite Grenze von 2 % pro Jahr oder des niedrigeren CPI-Anstiegs.
lease.ie.residential.rent-information.title=Mietinformationen zu Beginn
lease.ie.residential.rent-information.summary=Vorherige Miete und 3 Vergleichsmieten, zu Beginn dem Mieter und binnen 1 Monat dem RTB mitgeteilt.
lease.ie.residential.rent-adjustment.title=Mietanpassung
lease.ie.residential.rent-adjustment.summary=Mietüberprüfung höchstens 1 Mal in 12 Monaten, nicht in den ersten 12 Monaten, mit 90 Tagen Ankündigung im vorgeschriebenen Formular.
lease.ie.residential.service-costs.title=Versorgung und Nebenkosten
lease.ie.residential.service-costs.summary=Versorgungsleistungen und sonstige Kosten des Mieters; Servicegebühren der Verwaltungsgesellschaft trägt der Vermieter, soweit nicht anders vereinbart.
lease.ie.residential.deposit.title=Kaution
lease.ie.residential.deposit.summary=Kaution von höchstens 1 Monatsmiete, am Ende umgehend zurückgezahlt abzüglich Mietrückständen oder Schadenskosten.
lease.ie.residential.payment.title=Zahlung
lease.ie.residential.payment.summary=Zahlung der Miete am Fälligkeitstag per Überweisung, Vorauszahlung auf 1 Monat begrenzt, und ein Mietbuch.
lease.ie.residential.use.title=Gebrauch der Wohnung
lease.ie.residential.use.summary=Nutzung nur zu Wohnzwecken, kein antisoziales Verhalten, Mitteilung der Bewohner und Haustiere nur mit Zustimmung.
lease.ie.residential.subletting.title=Abtretung und Untervermietung
lease.ie.residential.subletting.summary=Abtretung oder Untervermietung nur mit schriftlicher Zustimmung; bei Verweigerung darf der Mieter kündigen.
lease.ie.residential.maintenance.title=Reparaturen und Instandhaltung
lease.ie.residential.maintenance.summary=Vermieter repariert Bausubstanz und Innenräume und erfüllt die Mietwohnungsstandards; Mieter meldet Mängel und gewährt Zutritt.
lease.ie.residential.energy-certificate.title=Energieausweis (BER)
lease.ie.residential.energy-certificate.summary=BER-Zertifikat der Wohnung, dem Mieter zur Verfügung gestellt, soweit vorgeschrieben.
lease.ie.residential.registration.title=Registrierung beim RTB
lease.ie.residential.registration.summary=Registrierung des Mietverhältnisses beim RTB binnen 1 Monat nach Beginn und nach jedem Jahrestag.
lease.ie.residential.insurance.title=Versicherung
lease.ie.residential.insurance.summary=Gebäudeversicherung des Vermieters mit Haftpflichtdeckung von mindestens EUR 250.000; der Mieter darf sie nicht gefährden.
lease.ie.residential.handover-inspection.title=Inventar und Übergabe
lease.ie.residential.handover-inspection.summary=Unterzeichnetes Inventar zu Beginn und Rückgabe der Wohnung am Ende, normale Abnutzung ausgenommen.
lease.ie.residential.termination.title=Beendigung
lease.ie.residential.termination.summary=Kündigungen, gesetzliche Kündigungsfristen und die beschränkten Gründe für die Beendigung eines Part-4-Mietverhältnisses.
lease.ie.residential.notices.title=Mitteilungen
lease.ie.residential.notices.summary=Schriftliche Mitteilungen, Zustellung nach dem Gesetz auch per E-Mail und Zustellanschriften.
lease.ie.residential.data-protection.title=Datenschutz
lease.ie.residential.data-protection.summary=Verarbeitung personenbezogener Daten nach der DSGVO und dem Data Protection Act 2018.
lease.ie.residential.disputes.title=Streitigkeiten
lease.ie.residential.disputes.summary=Irisches Recht; Streitigkeiten nach dem Gesetz gehen an das RTB, andere an die irischen Gerichte.
lease.ie.commercial.parties.title=Vertragsparteien
lease.ie.commercial.parties.summary=Vermieter und Mieter mit Registernummer, Sitz, Umsatzsteuer-Identifikationsnummer und Vertreter.
lease.ie.commercial.premises.title=Mietobjekt
lease.ie.commercial.premises.summary=Die vermieteten Geschäftsräume, Fläche und Rechte; der Residential Tenancies Act 2004 gilt nicht.
lease.ie.commercial.permitted-use.title=Nutzungszweck
lease.ie.commercial.permitted-use.summary=Zulässige gewerbliche Nutzung; Zustimmung zu einer Nutzungsänderung nicht unbillig verweigert; Genehmigungen auf Risiko des Mieters.
lease.ie.commercial.term.title=Mietdauer
lease.ie.commercial.term.summary=Mietbeginn und feste Laufzeit oder periodisches Mietverhältnis, das durch Kündigung endet.
lease.ie.commercial.renewal.title=Verlängerungsrecht
lease.ie.commercial.renewal.summary=Gesetzlicher Anspruch auf ein neues Mietverhältnis nach 5 Jahren gewerblicher Nutzung und Möglichkeit des Verzichts nach Rechtsberatung.
lease.ie.commercial.rent.title=Miete
lease.ie.commercial.rent.summary=Miethöhe ohne Umsatzsteuer, Nebenkosten und Versicherung sowie etwaige vereinbarte Mietanreize.
lease.ie.commercial.rent-adjustment.title=Mietanpassung
lease.ie.commercial.rent-adjustment.summary=Anpassung an die Marktmiete; bei Mietverträgen seit dem 28. Februar 2010 kann die Miete auch sinken.
lease.ie.commercial.service-costs.title=Nebenkosten und Abgaben
lease.ie.commercial.service-costs.summary=Nebenkosten nach Anteil mit jährlicher Abrechnung; der Mieter trägt Gewerbeabgaben (rates) und Versorgung.
lease.ie.commercial.vat.title=Umsatzsteuer
lease.ie.commercial.vat.summary=Vermietungen sind umsatzsteuerfrei, sofern der Vermieter nicht zur Steuerpflicht optiert.
lease.ie.commercial.deposit.title=Mietsicherheit
lease.ie.commercial.deposit.summary=Mietkaution ohne gesetzliche Obergrenze auf einem bestimmten Konto, Rückzahlung binnen 30 Tagen.
lease.ie.commercial.payment.title=Zahlung
lease.ie.commercial.payment.summary=Zahlung der Miete ohne Aufrechnung per Überweisung, mit Zinsen bei Zahlungsverzug.
lease.ie.commercial.maintenance.title=Instandhaltung
lease.ie.commercial.maintenance.summary=Volle oder innere Instandhaltungspflicht und die gesetzliche Begrenzung des Schadensersatzes bei Mängeln.
lease.ie.commercial.alterations.title=Bauliche Veränderungen
lease.ie.commercial.alterations.summary=Veränderungen nur mit Zustimmung, bei Verbesserungen nicht unbillig verweigert, und Rückbau am Ende.
lease.ie.commercial.assignment.title=Übertragung und Untervermietung
lease.ie.commercial.assignment.summary=Übertragung oder Untervermietung mit Zustimmung des Vermieters, die nicht unbillig verweigert werden darf.
lease.ie.commercial.insurance.title=Versicherung
lease.ie.commercial.insurance.summary=Vermieter versichert das Gebäude auf Kosten des Mieters; Mieter versichert Inventar und Haftpflicht; Mietaussetzung nach Schäden.
lease.ie.commercial.energy-certificate.title=Energieausweis (BER)
lease.ie.commercial.energy-certificate.summary=BER-Zertifikat des Mietobjekts, dem Mieter zur Verfügung gestellt, soweit vorgeschrieben.
lease.ie.commercial.registration.title=Stempelsteuer und Mietregister
lease.ie.commercial.registration.summary=Stempelsteuer auf den Mietvertrag und Meldungen des Vertrags, jeder Mietanpassung und des Auszugs des Mieters an die Commercial Leases Database der PSRA.
lease.ie.commercial.break-option.title=Sonderkündigungsrecht
lease.ie.commercial.break-option.summary=Optionale Kündigungstermine, Frist und Bedingungen; eine Kündigung des Mieters kann das Verlängerungsrecht beenden.
lease.ie.commercial.handover-inspection.title=Zustandsprotokoll und Rückgabe
lease.ie.commercial.handover-inspection.summary=Zustandsprotokoll zu Beginn und geräumte Rückgabe am Ende.
lease.ie.commercial.termination.title=Verwirkung und Beendigung
lease.ie.commercial.termination.summary=Wiederinbesitznahme bei Mietrückstand oder Vertragsverletzung, vorherige Abmahnung und gerichtlicher Schutz sowie weitere Beendigungsgründe.
lease.ie.commercial.notices.title=Mitteilungen
lease.ie.commercial.notices.summary=Schriftliche Mitteilungen per Boten oder Einschreiben und Zustellanschriften.
lease.ie.commercial.guarantor.title=Bürge
lease.ie.commercial.guarantor.summary=Garantie der Pflichten des Mieters durch einen Bürgen als Hauptschuldner.
lease.ie.commercial.data-protection.title=Datenschutz
lease.ie.commercial.data-protection.summary=Verarbeitung personenbezogener Daten von Ansprechpartnern und Bürgen nach der DSGVO.
lease.ie.commercial.disputes.title=Streitigkeiten
lease.ie.commercial.disputes.summary=Irisches Recht und irische Gerichte; Anträge auf ein neues Mietverhältnis vor Gericht nach dem Gesetz von 1980.
# ===== end IE =====


# ===== IT lease clause titles and summaries (country pack) =====
lease.it.residential.parties.title=Vertragsparteien
lease.it.residential.parties.summary=Bezeichnet Vermieter und Mieter mit Steuernummer und Personalien; Mitmieter haften gesamtschuldnerisch; Schriftform ist vorgeschrieben.
lease.it.residential.premises.title=Mietsache
lease.it.residential.premises.summary=Beschreibt die Wohnung mit Katasterdaten und Nebenräumen; Muster für frei vereinbarte Miete (4 + 4 Jahre), nicht für vereinbarte, vorübergehende oder Studentenmietverträge.
lease.it.residential.term.title=Mietdauer
lease.it.residential.term.summary=Mindestens 4 Jahre (oder eine vereinbarte längere Dauer), Verlängerung um weitere 4 Jahre, sofern der Vermieter sie nicht aus gesetzlichen Gründen verweigert; zum zweiten Ablauf Erneuerungsverfahren per Einschreiben mindestens 6 Monate vorher.
lease.it.residential.rent.title=Miete
lease.it.residential.rent.summary=Von den Parteien vereinbarte Miete; jede Abrede einer höheren Miete als im schriftlichen und registrierten Vertrag ist nichtig.
lease.it.residential.rent-adjustment.title=Mietanpassung
lease.it.residential.rent-adjustment.summary=Freiwillige jährliche Anpassung um einen vereinbarten Anteil der ISTAT-Indexänderung; ausgesetzt, wenn der Vermieter die cedolare secca wählt.
lease.it.residential.service-costs.title=Nebenkosten
lease.it.residential.service-costs.summary=Gesetzliche Verteilung der Nebenkosten zulasten des Mieters, sofern nichts anderes vereinbart ist; Zahlung binnen 2 Monaten nach Anforderung mit Recht auf Aufstellung und Belege.
lease.it.residential.deposit.title=Kaution
lease.it.residential.deposit.summary=Freiwillige Kaution von höchstens 3 Monatsmieten mit jährlich auszuzahlenden gesetzlichen Zinsen; am Ende abzüglich geschuldeter Beträge zurückgezahlt.
lease.it.residential.payment.title=Zahlung
lease.it.residential.payment.summary=Regelmäßige Zahlung per Überweisung am vereinbarten Tag; vorbehaltlich der gerichtlichen Heilungsfrist nach Artikel 55 ist 20 Tage nach Fälligkeit unbezahlte Miete ein Auflösungsgrund.
lease.it.residential.use.title=Nutzung
lease.it.residential.use.summary=Nutzung ausschließlich als Wohnung mit gebotener Sorgfalt; der Vermieter kann binnen 3 Monaten ab Kenntnis einer Nutzungsänderung die Auflösung verlangen.
lease.it.residential.subletting.title=Untervermietung
lease.it.residential.subletting.summary=Keine vollständige Untervermietung oder Übertragung ohne Zustimmung; teilweise Untervermietung nach Mitteilung per Einschreiben zulässig, sofern nichts anderes vereinbart ist.
lease.it.residential.maintenance.title=Instandhaltung und Reparaturen
lease.it.residential.maintenance.summary=Der Vermieter führt notwendige Reparaturen aus, der Mieter Kleinreparaturen; dringende Reparaturen, Mietminderung bei langen Arbeiten; der Nutzer ist für die Heizungsanlage verantwortlich.
lease.it.residential.energy-certificate.title=Energieausweis
lease.it.residential.energy-certificate.summary=Der Mieter bestätigt den Erhalt der Informationen und Unterlagen zum APE; Kennnummer und Klasse des Ausweises; gesetzliche Geldbußen bei Unterlassung.
lease.it.residential.registration.title=Registrierung und Steuern
lease.it.residential.registration.summary=Der Vermieter registriert den Vertrag binnen 30 Tagen und unterrichtet Mieter und Verwalter; Kosten je zur Hälfte; wahlweise cedolare secca.
lease.it.residential.succession.title=Eintritt in den Vertrag
lease.it.residential.succession.summary=Ehegatte, Erben, zusammenlebende Angehörige und Partner können beim Tod des Mieters eintreten; Regeln bei Trennung und Scheidung.
lease.it.residential.handover-inspection.title=Übergabe und Rückgabe
lease.it.residential.handover-inspection.summary=Übergabeprotokoll zu Beginn; Rückgabe im gleichen Zustand bis auf normale Abnutzung; vereinbartes Entgelt bis zur Rückgabe geschuldet bei Verzug.
lease.it.residential.termination.title=Rücktritt und Verweigerung der Verlängerung
lease.it.residential.termination.summary=Der Mieter kann aus schwerwiegenden Gründen mit 6 Monaten Frist zurücktreten; der Vermieter kann die Verlängerung zum ersten Ablauf nur aus gesetzlichen Gründen verweigern.
lease.it.residential.notices.title=Mitteilungen
lease.it.residential.notices.summary=Einschreiben, wo das Gesetz es verlangt; Anschriften und zertifizierte E-Mail-Adressen für Mitteilungen.
lease.it.residential.guarantor.title=Bürge
lease.it.residential.guarantor.summary=Freiwillige Bürgschaft bis zu einem Höchstbetrag, gesamtschuldnerisch; Erstreckung über den ersten Ablauf hinaus nur bei Vereinbarung.
lease.it.residential.data-protection.title=Datenschutz
lease.it.residential.data-protection.summary=Personenbezogene Daten nur für das Mietverhältnis und gesetzliche Pflichten verarbeitet, nach der DSGVO und dem italienischen Datenschutzgesetzbuch.
lease.it.residential.disputes.title=Streitigkeiten
lease.it.residential.disputes.summary=Italienisches Recht; Gericht am Ort der Mietsache; Mediation vor den meisten Mietklagen vorgeschrieben.
lease.it.commercial.parties.title=Vertragsparteien
lease.it.commercial.parties.summary=Bezeichnet Vermieter und Mieter mit Firmen-, Steuer- und Umsatzsteuerdaten, Handelsregisternummer und gesetzlichem Vertreter.
lease.it.commercial.premises.title=Mietsache
lease.it.commercial.premises.summary=Beschreibt die Räume mit Katasterdaten und der angegebenen Nutzungsart; nicht für Wohnungen oder Saisonmieten.
lease.it.commercial.permitted-use.title=Zulässige Nutzung
lease.it.commercial.permitted-use.summary=Ausgeübte Tätigkeit und Angabe, ob unmittelbarer Publikumsverkehr besteht; Genehmigungen auf Kosten des Mieters; Regeln zur Nutzungsänderung.
lease.it.commercial.term.title=Mietdauer und Erneuerung
lease.it.commercial.term.summary=Mindestens 6 Jahre (9 für Hotels und Theater) mit stillschweigender Erneuerung; Verweigerung durch den Vermieter nur zum ersten Ablauf aus gesetzlichen Gründen, 12 oder 18 Monate vorher.
lease.it.commercial.rent.title=Miete
lease.it.commercial.rent.summary=Von den Parteien vereinbarte Miete; Abreden, die dem Vermieter gegen Gesetz 392/1978 verstoßende Vorteile verschaffen, sind nichtig.
lease.it.commercial.rent-adjustment.title=Mietanpassung
lease.it.commercial.rent-adjustment.summary=Freiwillige jährliche Anpassung auf Verlangen des Vermieters; Erhöhungen auf 75% der ISTAT-Indexänderung begrenzt bei Verträgen, die die gesetzliche Dauer nicht überschreiten.
lease.it.commercial.service-costs.title=Nebenkosten
lease.it.commercial.service-costs.summary=Gesetzliche Verteilung der Nebenkosten, sofern nichts anderes vereinbart ist; Zahlung binnen 2 Monaten nach Anforderung mit Recht auf Aufstellung und Belege.
lease.it.commercial.vat.title=Umsatzsteuer
lease.it.commercial.vat.summary=Vermietung umsatzsteuerfrei, sofern der Vermieter für Betriebsgebäude nicht zur Besteuerung optiert; Option und Steuersatz angegeben.
lease.it.commercial.deposit.title=Kaution
lease.it.commercial.deposit.summary=Freiwillige Kaution von höchstens 3 Monatsmieten mit jährlich auszuzahlenden gesetzlichen Zinsen; am Ende abzüglich geschuldeter Beträge zurückgezahlt.
lease.it.commercial.payment.title=Zahlung
lease.it.commercial.payment.summary=Regelmäßige Zahlung per Überweisung am vereinbarten Tag; Quittung oder Rechnung; Auflösung nur bei nicht unerheblicher Pflichtverletzung.
lease.it.commercial.maintenance.title=Instandhaltung und Reparaturen
lease.it.commercial.maintenance.summary=Der Vermieter führt notwendige Reparaturen aus, der Mieter Kleinreparaturen, sofern nichts anderes vereinbart ist; dringende Reparaturen, Mietminderung bei langen Arbeiten.
lease.it.commercial.alterations.title=Umbauten und Ausbau
lease.it.commercial.alterations.summary=Arbeiten nur mit schriftlicher Zustimmung des Vermieters; gesetzliche Regeln zur Entschädigung für Verbesserungen und zur Wegnahme von Einrichtungen.
lease.it.commercial.assignment.title=Untervermietung und Übertragung
lease.it.commercial.assignment.summary=Untervermietung oder Übertragung ohne Zustimmung zusammen mit dem Betrieb, vorbehaltlich Widerspruch des Vermieters aus wichtigem Grund binnen 30 Tagen; sonst Zustimmung erforderlich.
lease.it.commercial.pre-emption.title=Vorkaufsrecht
lease.it.commercial.pre-emption.summary=Vorkaufs- und Rückkaufsrecht des Mieters bei Verkauf und Neuvermietung, außer bei Räumen ohne Publikumsverkehr und anderen ausgenommenen Fällen.
lease.it.commercial.goodwill-compensation.title=Entschädigung für den Verlust des Kundenstamms
lease.it.commercial.goodwill-compensation.summary=18 Monatsmieten (21 für Hotels), wenn das Mietverhältnis nicht durch Pflichtverletzung, Kündigung, Rücktritt oder Insolvenzverfahren des Mieters endet; nicht bei Räumen ohne Publikumsverkehr und anderen ausgenommenen Fällen.
lease.it.commercial.insurance.title=Versicherung
lease.it.commercial.insurance.summary=Der Mieter haftet für Verlust und Brandschäden, sofern er sie nicht zu vertreten hat; Haftpflichtversicherung des Mieters und Gebäudeversicherung des Vermieters.
lease.it.commercial.energy-certificate.title=Energieausweis
lease.it.commercial.energy-certificate.summary=Der Mieter bestätigt den Erhalt der Informationen und Unterlagen zum APE, mit beigefügter Kopie, wo vorgeschrieben; gesetzliche Geldbußen bei Unterlassung.
lease.it.commercial.registration.title=Registrierung und Steuern
lease.it.commercial.registration.summary=Registrierung binnen 30 Tagen, Kosten je zur Hälfte; Registersteuer von 1% oder 2%; die cedolare secca gilt nicht.
lease.it.commercial.handover-inspection.title=Übergabe und Rückgabe
lease.it.commercial.handover-inspection.summary=Übergabeprotokoll zu Beginn; Rückgabe im gleichen Zustand bis auf normale Abnutzung; vereinbartes Entgelt bis zur Rückgabe geschuldet bei Verzug.
lease.it.commercial.termination.title=Rücktritt und Auflösung
lease.it.commercial.termination.summary=Der Mieter kann aus schwerwiegenden Gründen mit 6 Monaten Frist und, wenn vereinbart, jederzeit mit derselben Frist zurücktreten; Verweigerung durch den Vermieter nur zum ersten Ablauf; Auflösung wegen Pflichtverletzung.
lease.it.commercial.notices.title=Mitteilungen
lease.it.commercial.notices.summary=Einschreiben oder Zustellung durch Gerichtsvollzieher, wo das Gesetz es verlangt; Anschriften und zertifizierte E-Mail-Adressen.
lease.it.commercial.guarantor.title=Sicherheit
lease.it.commercial.guarantor.summary=Freiwillige Personal-, Bank- oder Versicherungsbürgschaft bis zu einem Höchstbetrag; Erstreckung über den ersten Ablauf hinaus nur bei Vereinbarung.
lease.it.commercial.data-protection.title=Datenschutz
lease.it.commercial.data-protection.summary=Personenbezogene Daten der für die Parteien handelnden Personen nur für das Mietverhältnis verarbeitet, nach der DSGVO und dem italienischen Datenschutzgesetzbuch.
lease.it.commercial.disputes.title=Streitigkeiten
lease.it.commercial.disputes.summary=Italienisches Recht; Gericht am Ort der Mietsache; Mediation vor den meisten Mietklagen vorgeschrieben.
# ===== end IT =====


# ===== LU lease clause titles and summaries (country pack) =====
lease.lu.residential.parties.title=Parteien
lease.lu.residential.parties.summary=Vollständige Identität des Vermieters und jedes Mieters; der Mietvertrag bedarf bei sonstiger Nichtigkeit der Schriftform.
lease.lu.residential.premises.title=Mietsache
lease.lu.residential.premises.summary=Beschreibung der Wohnung mit Katasterbezeichnung und allen vermieteten Räumen und Teilen.
lease.lu.residential.term.title=Mietdauer
lease.lu.residential.term.summary=Bestimmte oder unbestimmte Dauer; bei Ablauf verlängert sich der Vertrag auf unbestimmte Zeit, außer in den gesetzlichen Fällen.
lease.lu.residential.rent.title=Miete
lease.lu.residential.rent.summary=Miete ohne Nebenkosten, begrenzt auf 5 % jährlich des investierten Kapitals; Maklerkosten werden geteilt.
lease.lu.residential.rent-adjustment.title=Mietanpassung
lease.lu.residential.rent-adjustment.summary=Anpassung der Miete höchstens alle 2 Jahre; eine Erhöhung ist auf 10 % begrenzt.
lease.lu.residential.service-costs.title=Nebenkosten
lease.lu.residential.service-costs.summary=Umlagefähige Kosten, Vorauszahlungen oder Pauschale und ihre jährliche Verteilung.
lease.lu.residential.deposit.title=Mietkaution
lease.lu.residential.deposit.summary=Sicherheit von höchstens 2 Monatsmieten, nach Mietende in 2 Schritten zurückgezahlt.
lease.lu.residential.payment.title=Zahlung
lease.lu.residential.payment.summary=Zahlung im Voraus, Fälligkeit und gesetzliche Zinsen bei Zahlungsverzug.
lease.lu.residential.use.title=Gebrauch
lease.lu.residential.use.summary=Sorgfältige Nutzung zu Wohnzwecken, Veränderungen und Zugang zur Wohnung.
lease.lu.residential.subletting.title=Abtretung und Untervermietung
lease.lu.residential.subletting.summary=Abtretung ist zulässig, sofern nicht ausdrücklich verboten; Untervermietung nur mit Zustimmung.
lease.lu.residential.shared-tenancy.title=Wohngemeinschaft
lease.lu.residential.shared-tenancy.summary=Wahlweise Regelung der Wohngemeinschaft mit Pakt, gesamtschuldnerischer Haftung und eigenen Kündigungsregeln.
lease.lu.residential.maintenance.title=Instandhaltung
lease.lu.residential.maintenance.summary=Aufteilung der Reparaturen zwischen Vermieter und Mieter, Wohnstandards und Rauchmelder.
lease.lu.residential.energy-certificate.title=Energiepass
lease.lu.residential.energy-certificate.summary=Beglaubigte Kopie des Energiepasses für den Mieter.
lease.lu.residential.pre-emption.title=Vorkaufsrecht
lease.lu.residential.pre-emption.summary=Vorkaufsrecht des Mieters nach einer Mietdauer von mindestens 18 Jahren.
lease.lu.residential.succession.title=Fortsetzung des Mietvertrags
lease.lu.residential.succession.summary=Fortsetzung zugunsten von Ehegatte, Partner oder Haushaltsangehörigen bei Auszug oder Tod des Mieters.
lease.lu.residential.handover-inspection.title=Übergabeprotokoll
lease.lu.residential.handover-inspection.summary=Gemeinsame Ein- und Auszugsprotokolle, Pflicht bei vereinbarter Mietkaution.
lease.lu.residential.termination.title=Kündigung
lease.lu.residential.termination.summary=Kündigungsfrist von 3 Monaten für den Mieter bei unbefristetem Vertrag; Vermieter nur aus gesetzlichen Gründen, 6 Monate bei Eigenbedarf.
lease.lu.residential.data-protection.title=Datenschutz
lease.lu.residential.data-protection.summary=Verarbeitung personenbezogener Daten des Mieters nach der DSGVO.
lease.lu.residential.disputes.title=Streitigkeiten
lease.lu.residential.disputes.summary=Mietkommission bei Streit über die Miete, Friedensrichter bei sonstigen Streitigkeiten.
lease.lu.commercial.parties.title=Parteien
lease.lu.commercial.parties.summary=Angaben zu Vermieter und Mieter mit RCS-Nummer, USt-IdNr., Niederlassungsgenehmigung und Vertretern.
lease.lu.commercial.premises.title=Mietsache
lease.lu.commercial.premises.summary=Beschreibung der Mieträume und Anwendungsbereich der Vorschriften über die Geschäftsraummiete.
lease.lu.commercial.permitted-use.title=Nutzungszweck
lease.lu.commercial.permitted-use.summary=Die in den Mieträumen erlaubte Tätigkeit und die Genehmigungen des Mieters.
lease.lu.commercial.term.title=Mietdauer
lease.lu.commercial.term.summary=Bestimmte oder unbestimmte Dauer, bindend für einen Erwerber, stillschweigende Verlängerung auf unbestimmte Zeit.
lease.lu.commercial.rent.title=Miete
lease.lu.commercial.rent.summary=Frei vereinbarte Miete; jeder Zuschlag für den Vertragsabschluss ist nichtig.
lease.lu.commercial.rent-adjustment.title=Indexierung
lease.lu.commercial.rent-adjustment.summary=Jährliche Indexierung nach dem nationalen Verbraucherpreisindex (STATEC).
lease.lu.commercial.service-costs.title=Nebenkosten
lease.lu.commercial.service-costs.summary=Vom Mieter getragene Nebenkosten und Abgaben mit Vorauszahlungen und jährlicher Abrechnung.
lease.lu.commercial.vat.title=Mehrwertsteuer
lease.lu.commercial.vat.summary=Steuerfreie Vermietung mit Option des Vermieters zur Mehrwertsteuer.
lease.lu.commercial.deposit.title=Mietkaution
lease.lu.commercial.deposit.summary=Sicherheit von höchstens 6 Monatsmieten; eine Bankgarantie auf erstes Anfordern darf nicht abgelehnt werden.
lease.lu.commercial.payment.title=Zahlung
lease.lu.commercial.payment.summary=Zahlung im Voraus, Fälligkeit und gesetzliche Zinsen bei Zahlungsverzug.
lease.lu.commercial.maintenance.title=Instandhaltung
lease.lu.commercial.maintenance.summary=Aufteilung der Reparaturen zwischen Vermieter und Mieter.
lease.lu.commercial.alterations.title=Bauliche Veränderungen
lease.lu.commercial.alterations.summary=Arbeiten nur mit Zustimmung des Vermieters und Verbleib der Einbauten bei Mietende.
lease.lu.commercial.assignment.title=Abtretung und Untervermietung
lease.lu.commercial.assignment.summary=Abtretung oder Untervermietung zusammen mit dem Geschäftsbetrieb kann nicht verboten werden, wenn eine identische Tätigkeit fortgeführt wird; Mitteilung und Zustimmung.
lease.lu.commercial.insurance.title=Versicherung
lease.lu.commercial.insurance.summary=Haftpflicht- und Betriebsversicherung des Mieters.
lease.lu.commercial.energy-certificate.title=Energiepass
lease.lu.commercial.energy-certificate.summary=Kopie des Energiepasses, soweit die Vorschriften dies verlangen.
lease.lu.commercial.handover-inspection.title=Übergabeprotokoll
lease.lu.commercial.handover-inspection.summary=Gemeinsame Ein- und Auszugsprotokolle.
lease.lu.commercial.renewal.title=Erneuerung
lease.lu.commercial.renewal.summary=Der Mieter kann mindestens 6 Monate vor Ablauf die Erneuerung verlangen; nach 9 Jahren kann der Vermieter gegen eine Räumungsentschädigung beenden.
lease.lu.commercial.pre-emption.title=Vorkaufsrecht
lease.lu.commercial.pre-emption.summary=Vorkaufsrecht des Mieters nach einer Mietdauer von mindestens 18 Jahren.
lease.lu.commercial.termination.title=Kündigung
lease.lu.commercial.termination.summary=Kündigungsfrist von mindestens 6 Monaten per Einschreiben; Gründe des Vermieters und Räumungsaufschub.
lease.lu.commercial.data-protection.title=Datenschutz
lease.lu.commercial.data-protection.summary=Verarbeitung personenbezogener Daten der Parteien nach der DSGVO.
lease.lu.commercial.disputes.title=Streitigkeiten
lease.lu.commercial.disputes.summary=Luxemburgisches Recht und der Friedensrichter am Ort der Mieträume.
# ===== end LU =====


# ===== NL-COMMERCIAL lease clause titles and summaries (country pack) =====
lease.nl.commercial.parties.title=Parteien
lease.nl.commercial.parties.summary=Bezeichnet Vermieter und Mieter mit Handelskammernummer, Umsatzsteuer-Identifikationsnummer und Vertretern.
lease.nl.commercial.premises.title=Mietsache
lease.nl.commercial.premises.summary=Beschreibt die Geschäftsräume und hält fest, ob Artikel 7:290 BW oder Artikel 7:230a BW anwendbar ist.
lease.nl.commercial.permitted-use.title=Mietzweck
lease.nl.commercial.permitted-use.summary=Der vereinbarte Mietzweck und die Genehmigungen für den Betrieb des Mieters, einschließlich des brandsicheren Gebrauchs.
lease.nl.commercial.term.title=Mietdauer
lease.nl.commercial.term.summary=Mietbeginn und Dauer: gesetzlich 5 plus 5 Jahre für Räume nach Artikel 7:290, frei vereinbar für andere Geschäftsräume.
lease.nl.commercial.rent.title=Miete
lease.nl.commercial.rent.summary=Frei vereinbarte Miete zuzüglich Umsatzsteuer; für Geschäftsräume gilt keine gesetzliche Höchstmiete.
lease.nl.commercial.rent-adjustment.title=Mietanpassung
lease.nl.commercial.rent-adjustment.summary=Jährliche Indexierung nach dem Verbraucherpreisindex und für Räume nach Artikel 7:290 die gerichtliche Neufestsetzung nach Artikel 7:303 BW.
lease.nl.commercial.service-costs.title=Nebenkosten
lease.nl.commercial.service-costs.summary=Vorauszahlungen auf die Nebenkosten und eine jährliche Abrechnung der tatsächlichen Kosten.
lease.nl.commercial.vat.title=Umsatzsteuer
lease.nl.commercial.vat.summary=Option zur umsatzsteuerpflichtigen Vermietung, wenn der Mieter zum vollen oder nahezu vollen Vorsteuerabzug berechtigt ist.
lease.nl.commercial.deposit.title=Sicherheit
lease.nl.commercial.deposit.summary=Kaution oder Bankbürgschaft ohne gesetzliche Obergrenze, nach der Rückgabe zurückzugeben.
lease.nl.commercial.payment.title=Zahlung
lease.nl.commercial.payment.summary=Zahlungstermin, keine Aufrechnung außer dem gesetzlichen Abzug von Reparaturkosten, gesetzliche Zinsen und Inkassokosten.
lease.nl.commercial.maintenance.title=Instandhaltung und Reparaturen
lease.nl.commercial.maintenance.summary=Große Instandhaltung durch den Vermieter, kleine Reparaturen und Instandhaltung im Inneren durch den Mieter, dringende Arbeiten.
lease.nl.commercial.alterations.title=Bauliche Veränderungen
