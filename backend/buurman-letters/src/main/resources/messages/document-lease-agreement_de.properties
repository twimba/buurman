lease.rentComponent.UTILITIES_ADVANCE=Nebenkostenvorschuss
lease.rentComponent.SERVICE_COSTS=Servicekosten
lease.rentComponent.HOA_FEES=Hausgeld
lease.rentComponent.FURNITURE_RENTAL=Möbelmiete
lease.rentComponent.PARKING=Stellplatz
lease.rentComponent.STORAGE=Lagerraum
