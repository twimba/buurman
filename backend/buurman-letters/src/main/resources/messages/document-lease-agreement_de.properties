lease.be.residential.deposit.summary=Mietsicherheit von höchstens 3 Monatsmieten in Flandern oder 2 Monatsmieten in Wallonien und Brüssel, in einer gesetzlichen Form.
lease.be.residential.payment.title=Zahlung
lease.be.residential.payment.summary=Zahlung pro Termin per Überweisung am vereinbarten Tag; gesetzliche Zinsen nach Mahnung.
lease.be.residential.use.title=Nutzung der Wohnung
lease.be.residential.use.summary=Sorgfältige Nutzung als Hauptwohnsitz, ungestörter Gebrauch und in Brüssel die Regeln zu Wohnsitzanmeldung und Haustieren.
lease.be.residential.subletting.title=Abtretung und Untervermietung
lease.be.residential.subletting.summary=Abtretung nur mit vorheriger schriftlicher Zustimmung; teilweise Untervermietung nur mit Zustimmung, wenn die Wohnung Hauptwohnsitz bleibt.
lease.be.residential.maintenance.title=Instandhaltung und Reparaturen
lease.be.residential.maintenance.summary=Reparaturen des Vermieters, kleine Reparaturen des Mieters und dringende Reparaturen während der Mietzeit, je nach Region.
lease.be.residential.insurance.title=Brandversicherung
lease.be.residential.insurance.summary=Haftung des Mieters für Brand (und Wasserschäden) und die Pflichtversicherung, je nach Region.
lease.be.residential.energy-certificate.title=Energieausweis
lease.be.residential.energy-certificate.summary=Von der Region verlangter Energieausweis (EPC/PEB) mit Nummer, Datum und Klasse.
lease.be.residential.registration.title=Registrierung
lease.be.residential.registration.summary=Der Vermieter registriert den Mietvertrag und das Übergabeprotokoll binnen 2 Monaten; Folgen der Nichtregistrierung, je nach Region.
lease.be.residential.handover-inspection.title=Übergabeprotokoll
lease.be.residential.handover-inspection.summary=Gemeinsames ausführliches Einzugsprotokoll, beigefügt und registriert, sowie Auszugsprotokoll, je nach Region.
lease.be.residential.transfer.title=Veräußerung der Wohnung
lease.be.residential.transfer.summary=Der Erwerber tritt in die Rechte des Vermieters ein; in Brüssel die Informationspflicht und das Vorzugsrecht des Mieters.
lease.be.residential.termination.title=Beendigung
lease.be.residential.termination.summary=Kündigung durch den Mieter und gesetzliche Kündigungsgründe des Vermieters, Entschädigungen und Regeln für kurze Verträge, je nach Region.
lease.be.residential.annexes.title=Anlagen
lease.be.residential.annexes.summary=Die regionale erläuternde Anlage oder Erläuterung und das Einzugsprotokoll.
lease.be.residential.data-protection.title=Datenschutz
lease.be.residential.data-protection.summary=Verarbeitung der personenbezogenen Daten des Mieters nach der DSGVO und regionale Grenzen für die angeforderten Daten.
lease.be.residential.disputes.title=Streitigkeiten
lease.be.residential.disputes.summary=Belgisches Recht und Friedensrichter am Ort der Wohnung; im Voraus vereinbarte Schiedsklauseln sind unwirksam.
lease.be.commercial.parties.title=Parteien
lease.be.commercial.parties.summary=Angaben zu den Unternehmen, ihren Vertretern und USt-Nummern sowie das belgische Geschäftsmietgesetz.
lease.be.commercial.premises.title=Mietobjekt
lease.be.commercial.premises.summary=Anschrift, Fläche und Beschreibung, einschließlich Wohn- oder Nebenräumen, für die die gesetzliche Mietdauer gilt.
lease.be.commercial.permitted-use.title=Nutzungszweck
lease.be.commercial.permitted-use.summary=Einzelhandel oder Handwerk in direktem Kontakt mit der Öffentlichkeit; Anwendungsbereich des Gesetzes und Verträge bis zu 1 Jahr.
lease.be.commercial.term.title=Laufzeit
lease.be.commercial.term.summary=Mindestens 9 Jahre; der Mieter kann zu jedem 3-Jahres-Zeitraum mit 6 Monaten Frist kündigen, der Vermieter nur bei Vereinbarung.
lease.be.commercial.rent.title=Miete
lease.be.commercial.rent.summary=Miete ohne Kosten, Lasten und Steuern, frei vereinbart.
lease.be.commercial.rent-adjustment.title=Indexierung und Mietanpassung
lease.be.commercial.rent-adjustment.summary=Vereinbarte Indexierung nach dem Gesundheitsindex 1 Mal pro Jahr und gerichtliche Anpassung zu jedem 3-Jahres-Zeitraum bei mindestens 15 % Abweichung.
lease.be.commercial.service-costs.title=Nebenkosten
lease.be.commercial.service-costs.summary=Abschließende Liste der vom Mieter zu tragenden Kosten, Lasten und Steuern, mindestens jährlich abgerechnet.
lease.be.commercial.vat.title=Umsatzsteuer
lease.be.commercial.vat.summary=Vermietung grundsätzlich von der Umsatzsteuer befreit, mit der Option einer steuerpflichtigen Vermietung von Geschäftsgebäuden.
lease.be.commercial.deposit.title=Mietsicherheit
lease.be.commercial.deposit.summary=Mietsicherheit in vereinbarter Höhe und Form; keine gesetzliche Obergrenze für Geschäftsmietverträge.
lease.be.commercial.payment.title=Zahlung
lease.be.commercial.payment.summary=Zahlung pro Termin per Überweisung am vereinbarten Tag; gesetzliche Zinsen nach Mahnung.
lease.be.commercial.maintenance.title=Instandhaltung und Reparaturen
lease.be.commercial.maintenance.summary=Reparaturen des Vermieters und Mieterreparaturen nach dem früheren belgischen Zivilgesetzbuch, sofern nichts anderes vereinbart ist.
lease.be.commercial.alterations.title=Umbauten
lease.be.commercial.alterations.summary=Recht des Mieters auf Umbauten bis zu 3 Jahresmieten nach Anzeige, Widerspruch des Vermieters binnen 30 Tagen und Behandlung bei Vertragsende.
lease.be.commercial.assignment.title=Abtretung und Untervermietung
lease.be.commercial.assignment.summary=Zustimmung erforderlich, außer bei Abtretung oder Untervermietung zusammen mit dem Geschäft, vorbehaltlich eines Widerspruchs binnen 30 Tagen.
lease.be.commercial.insurance.title=Versicherung
lease.be.commercial.insurance.summary=Der Mieter versichert seine Haftung und den Inhalt, der Vermieter das Gebäude.
lease.be.commercial.energy-certificate.title=Energieausweis
lease.be.commercial.energy-certificate.summary=Energieausweis, soweit die regionalen Vorschriften ihn verlangen, mit Nummer, Datum und Klasse.
lease.be.commercial.registration.title=Registrierung
lease.be.commercial.registration.summary=Registrierung nach dem Steuerrecht, die dem Vertrag ein sicheres Datum verleiht; Partei, die die Registrierungsgebühren trägt.
lease.be.commercial.handover-inspection.title=Übergabeprotokoll
lease.be.commercial.handover-inspection.summary=Gemeinsames ausführliches Protokoll, beigefügt und registriert; Rückgabe im übernommenen Zustand.
lease.be.commercial.renewal.title=Verlängerung
lease.be.commercial.renewal.summary=Recht auf 3 Verlängerungen um 9 Jahre, Antrag 18 bis 15 Monate vor Ablauf, Ablehnungsgründe und Räumungsentschädigung.
lease.be.commercial.transfer.title=Veräußerung des Objekts
lease.be.commercial.transfer.summary=Der Erwerber kann den Mieter nur aus gesetzlichen Gründen mit 1 Jahr Frist, binnen 3 Monaten erklärt, räumen lassen.
lease.be.commercial.termination.title=Beendigung
lease.be.commercial.termination.summary=Ende zu einem 3-Jahres-Zeitraum, unbefristeter Vertrag nach Verlust des Verlängerungsrechts, gerichtliche Auflösung wegen Vertragsverletzung.
lease.be.commercial.data-protection.title=Datenschutz
lease.be.commercial.data-protection.summary=Verarbeitung personenbezogener Daten der Parteien und ihrer Vertreter nach der DSGVO.
lease.be.commercial.disputes.title=Streitigkeiten
lease.be.commercial.disputes.summary=Belgisches Recht und Friedensrichter am Ort des Objekts; vorheriger Schlichtungsversuch möglich.
# ===== end BE =====


