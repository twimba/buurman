lease.se.commercial.vat.title=Umsatzsteuer
lease.se.commercial.vat.summary=Steuerbefreiung der Vermietung und freiwillige Besteuerung, wenn der Geschäftsbetrieb des Mieters die Voraussetzungen erfüllt.
lease.se.commercial.deposit.title=Sicherheit
lease.se.commercial.deposit.summary=Optionale Kaution, Bankgarantie oder Bürgschaft und neue Sicherheit bei Verschlechterung der Sicherheit.
lease.se.commercial.payment.title=Zahlung
lease.se.commercial.payment.summary=Vorauszahlung, Verzugszinsen, Verwirkung bei mehr als 2 Werktagen Verzug und die Frist von 2 Wochen zur Wiedererlangung.
lease.se.commercial.maintenance.title=Instandhaltung
lease.se.commercial.maintenance.summary=Zustand der Räume, die vereinbarte Verteilung der Instandhaltung und die erweiterte Haftung des Mieters.
lease.se.commercial.alterations.title=Bauliche Veränderungen
lease.se.commercial.alterations.summary=Veränderungen nur mit Zustimmung des Vermieters, Rückbau am Ende und Auswirkung auf die Entschädigung.
lease.se.commercial.assignment.title=Übertragung
lease.se.commercial.assignment.summary=Übertragung mit Zustimmung des Vermieters oder, bei Übergabe des Geschäfts, mit Genehmigung der regionalen Mietschlichtungsbehörde.
lease.se.commercial.subletting.title=Untervermietung
lease.se.commercial.subletting.summary=Untervermietung mit Zustimmung oder Genehmigung und Verwirkung bei unerlaubter, nicht unverzüglich behobener Untervermietung.
lease.se.commercial.insurance.title=Versicherung
lease.se.commercial.insurance.summary=Betriebs- und Haftpflichtversicherung des Mieters und Gebäudeversicherung des Vermieters.
lease.se.commercial.energy-certificate.title=Energieausweis
lease.se.commercial.energy-certificate.summary=Vorlage des Energieausweises des Gebäudes gegenüber dem Mieter und Übergabe einer Kopie.
lease.se.commercial.handover-inspection.title=Übergabe und Abnahme
lease.se.commercial.handover-inspection.summary=Gemeinsame Besichtigung bei Einzug und Auszug und Räumung der Räume bis 12 Uhr am Tag nach Mietende.
lease.se.commercial.renewal.title=Bestandsschutz
lease.se.commercial.renewal.summary=Indirekter Bestandsschutz: Entschädigung mindestens in Höhe der Jahresmiete, Räumungsaufschub und Vereinbarungen über den Verzicht auf den Schutz.
lease.se.commercial.termination.title=Beendigung
lease.se.commercial.termination.summary=Kündigungsfristen, schriftliche und zugestellte Kündigung, Anforderungen an die Kündigung des Vermieters und Schlichtung binnen 2 Monaten.
lease.se.commercial.notices.title=Mitteilungen
lease.se.commercial.notices.summary=Anschriften für Mitteilungen und die gesetzlichen Mitteilungen, die mit Absendung per Einschreiben als erfolgt gelten.
lease.se.commercial.data-protection.title=Datenschutz
lease.se.commercial.data-protection.summary=Verarbeitung personenbezogener Daten der Vertreter und Ansprechpartner der Parteien nach der DSGVO.
lease.se.commercial.disputes.title=Streitigkeiten
lease.se.commercial.disputes.summary=Schwedisches Recht, die regionale Mietschlichtungsbehörde (hyresnämnden), die ordentlichen Gerichte und die Frist von 2 Jahren für Ansprüche.
