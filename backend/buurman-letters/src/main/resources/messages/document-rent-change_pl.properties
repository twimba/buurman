rentchange.legal.NL=Niniejsza zmiana czynszu podlega niderlandzkiemu prawu najmu (art. 7:252-253 BW). Spory mogą być kierowane do Huurcommissie.
rentchange.legal.DE=Niniejsza zmiana czynszu następuje zgodnie z §558 BGB (Mieterhöhung bis zur ortsüblichen Vergleichsmiete). Zastosowanie może mieć Kappungsgrenze (limit 20%/15% w okresie 3 lat).
rentchange.legal.FR=Niniejsza zmiana czynszu podlega indeksowi IRL (Indice de Référence des Loyers). W strefach regulowanych zastosowanie mogą mieć przepisy o regulacji czynszu (décret encadrement).
rentchange.legal.BE=Niniejsza zmiana czynszu wynika z Gezondheidsindex (indeksu zdrowia) właściwego dla danego regionu. Zastosowanie mają regionalne przepisy mieszkaniowe.
rentchange.legal.ES=Niniejsza zmiana czynszu podlega art. 18 LAU (actualización de renta). Zastosowanie mogą mieć tymczasowe limity podwyżek czynszu.
rentchange.legal.PT=Niniejsza zmiana czynszu wynika z INE coeficiente de atualização. Zastosowanie mają przepisy art. 24 NRAU.
rentchange.legal.AT=Niniejsza zmiana czynszu podlega §16 MRG (angemessener Mietzins). Zastosowanie ma system Richtwertmietzins lub odniesienie do VPI/CPI.
rentchange.legal.GB=Niniejsza zmiana czynszu podlega wymogom zawiadomienia z Section 13 Housing Act 1988. Zastosowanie ma porównanie z czynszem rynkowym.
rentchange.legal.IT=Niniejsza zmiana czynszu wynika z indeksu ISTAT FOI. Zastosowanie mają przepisy Legge 392/1978 lub 431/1998.
rentchange.legal.SE=Niniejsza zmiana czynszu wynika z bruksvärdessystemet (systemu wartości użytkowej). Zastosowanie mają wymogi negocjacji z Hyresgästföreningen.
rentchange.legal.DK=Niniejsza zmiana czynszu podlega Lejeloven. W zależności od klasyfikacji budynku zastosowanie mają zasady kosztowe lub rynkowe.
rentchange.legal.IE=Niniejsza zmiana czynszu podlega Residential Tenancies Act 2004. Zastosowanie może mieć roczny limit RPZ w wysokości 2%.
rentchange.legal.PL=Niniejsza zmiana czynszu podlega art. 6851 Kodeksu cywilnego. Wymagane jest pisemne wypowiedzenie z 3-miesięcznym wyprzedzeniem.
rentchange.legal.FI=Niniejsza zmiana czynszu podlega ustawie o najmie lokali mieszkalnych (481/1995). Zmiany regulują warunki umowy.
rentchange.legal.NO=Niniejsza zmiana czynszu wynika z Husleieloven §4-2/§4-3. Zastosowanie mają zasady korekty o wskaźnik CPI.
rentchange.legal.US=Niniejsza zmiana czynszu podlega właściwym przepisom stanowym i lokalnym. W niektórych jurysdykcjach zastosowanie mogą mieć przepisy o regulacji czynszu.
rentchange.legal.CA=Niniejsza zmiana czynszu wynika z właściwych prowincjonalnych przepisów najmu. Zastosowanie mogą mieć roczne wytyczne dotyczące limitów podwyżek.
rentchange.legal.HU=Niniejsza zmiana czynszu wynika z przepisów węgierskiego Kodeksu cywilnego dotyczących czynszu. Zmiany regulują warunki umowy.
rentchange.legal.CZ=Niniejsza zmiana czynszu podlega §2249 Kodeksu cywilnego. Podwyżki do porównywalnego czynszu są ograniczone do 20% w okresie 3 lat.
rentchange.legal.CH=Niniejsza zmiana czynszu podlega Obligationenrecht art. 269a. Korekty są powiązane z referencyjną stopą procentową (Referenzzinssatz).
