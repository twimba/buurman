# Country-specific legal references (extension addendum)
legal.NL=This extension is governed by Dutch tenancy law (huurrecht). Parties may refer disputes to the Huurcommissie (Rent Tribunal).
legal.DE=This extension agreement is made in accordance with \u00a7557 BGB (Mietverh\u00f6hungsvereinbarung). Applicable rent control regulations (Mietpreisbremse) may apply.
legal.FR=This extension is subject to French tenancy law. The Loi ALUR provisions may apply in regulated zones (zones tendues). Rent adjustments are subject to the IRL index.
legal.BE=This extension is governed by regional housing legislation. Rent indexation is based on the Gezondheidsindex (Health Index).
legal.ES=This extension is governed by the LAU (Ley de Arrendamientos Urbanos). Minimum lease term provisions of Art. 9-10 may apply.
legal.PT=This extension is governed by the NRAU (Novo Regime do Arrendamento Urbano). Rent updates follow the INE coefficient.
legal.AT=This extension is governed by Austrian tenancy law (MRG). The Richtwertmietzins system may apply.
legal.GB=This extension is subject to the Housing Act 1988 (as amended). Section 13 notice requirements may apply for rent increases.
legal.IT=This extension is governed by Italian tenancy law (Legge 431/1998). ISTAT FOI index adjustments may apply.
legal.SE=This extension is subject to the Hyreslagen. Rent levels follow the bruksv\u00e4rdessystemet (utility value system).
legal.DK=This extension is subject to the Lejeloven. Rent regulation depends on building age and rental type.
legal.IE=This extension is governed by the Residential Tenancies Act 2004. Rent Pressure Zone (RPZ) restrictions may apply.
legal.PL=This extension is subject to Polish Civil Code Art. 6851-6852. Written notice requirements apply for rent increases.
legal.FI=This extension is governed by the Act on Residential Leases (481/1995). Rent adjustments follow contract terms.
legal.NO=This extension is subject to the Husleieloven. CPI-based rent adjustments apply under \u00a74-2/\u00a74-3.
legal.US=This extension is subject to applicable state and local tenancy law. Rent control regulations may apply in certain jurisdictions.
legal.CA=This extension is governed by applicable provincial tenancy legislation. Annual guideline rent increases may apply.
legal.HU=This extension is governed by the Hungarian Civil Code. Rent adjustment terms follow the lease agreement.
legal.CZ=This extension is subject to Czech Civil Code \u00a72249. Rent increases to comparable market rent are limited to 20% over 3 years.
legal.CH=This extension is governed by Swiss tenancy law (Obligationenrecht Art. 269-270). Adjustments are tied to the reference interest rate (Referenzzinssatz).

# BUUR-105 per-country addenda: rent-increase-letter structured clauses (Task 1's
# CountryLetterClauseCatalog). Example content grounded in the ticket's own stated
# requirements, not independently researched legal text -- verify against current
# local requirements before relying on this for a real notice.
legal.NL.basis.title=Legal Basis
legal.NL.basis.body=This rent increase is made in accordance with Dutch tenancy law (huurrecht) and the applicable rent indexation rules. You may refer disputes over this increase to the Huurcommissie (Rent Tribunal) within the statutory period.
legal.DE.section558.title=Section 558 BGB Justification
legal.DE.section558.body=This rent increase is made in accordance with §558 BGB (Mieterhöhung bis zur ortsüblichen Vergleichsmiete). The new rent does not exceed the locally customary comparative rent (ortsübliche Vergleichsmiete) for comparable dwellings.
legal.DE.comparisonMethod.title=Comparison Method
legal.DE.comparisonMethod.body=The comparative rent has been determined with reference to the local rent index (Mietspiegel) where available. Applicable statutory caps (Kappungsgrenze) on the rate of increase within the relevant period have been observed.
