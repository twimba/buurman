rentchange.legal.NL=Denne leiejusteringen er underlagt nederlandsk leierett (art. 7:252-253 BW). Tvister kan bringes inn for Huurcommissie.
rentchange.legal.DE=Denne leiejusteringen skjer i samsvar med §558 BGB (Mieterhöhung bis zur ortsüblichen Vergleichsmiete). Kappungsgrenze (tak på 20 %/15 % over 3 år) kan komme til anvendelse.
rentchange.legal.FR=Denne leiejusteringen er underlagt IRL (Indice de Référence des Loyers). Regler om husleieregulering (décret encadrement) kan gjelde i regulerte områder.
rentchange.legal.BE=Denne leiejusteringen følger Gezondheidsindex (helseindeksen) for den aktuelle regionen. Regionale boligregler kommer til anvendelse.
rentchange.legal.ES=Denne leiejusteringen er underlagt LAU art. 18 (actualización de renta). Midlertidige tak på leieøkninger kan komme til anvendelse.
rentchange.legal.PT=Denne leiejusteringen følger INE coeficiente de atualização. Bestemmelsene i NRAU art. 24 kommer til anvendelse.
rentchange.legal.AT=Denne leiejusteringen er underlagt MRG §16 (angemessener Mietzins). Richtwertmietzins eller VPI/CPI-referansen kommer til anvendelse.
rentchange.legal.GB=Denne leiejusteringen er underlagt varslingskravene i Section 13 i Housing Act 1988. Sammenligning med markedsleie kommer til anvendelse.
rentchange.legal.IT=Denne leiejusteringen følger ISTAT FOI-indeksen. Bestemmelsene i Legge 392/1978 eller 431/1998 kommer til anvendelse.
rentchange.legal.SE=Denne leiejusteringen følger bruksvärdessystemet (bruksverdisystemet). Kravene om forhandling med Hyresgästföreningen kommer til anvendelse.
rentchange.legal.DK=Denne leiejusteringen er underlagt Lejeloven. Kostnadsbaserte eller markedsbaserte regler gjelder avhengig av byggets klassifisering.
rentchange.legal.IE=Denne leiejusteringen er underlagt Residential Tenancies Act 2004. RPZ-taket på 2 % årlig kan komme til anvendelse.
rentchange.legal.PL=Denne leiejusteringen er underlagt den polske sivillovboken art. 6851. Det kreves skriftlig varsel med 3 måneders frist.
rentchange.legal.FI=Denne leiejusteringen er underlagt loven om boligleie (481/1995). Kontraktens vilkår er avgjørende for justeringen.
rentchange.legal.NO=Denne leiejusteringen følger husleieloven §4-2/§4-3. Reglene om KPI-justering kommer til anvendelse.
rentchange.legal.US=Denne leiejusteringen er underlagt gjeldende delstatlige og lokale regler. Husleieregulering kan komme til anvendelse i enkelte jurisdiksjoner.
rentchange.legal.CA=Denne leiejusteringen følger gjeldende provinsiell leielovgivning. Årlige veiledende tak på økninger kan komme til anvendelse.
rentchange.legal.HU=Denne leiejusteringen følger den ungarske sivillovbokens bestemmelser om leie. Kontraktens vilkår er avgjørende for justeringen.
rentchange.legal.CZ=Denne leiejusteringen er underlagt sivillovboken §2249. Økninger til sammenlignbar leie er begrenset til 20 % over 3 år.
rentchange.legal.CH=Denne leiejusteringen er underlagt Obligationenrecht art. 269a. Justeringer er knyttet til referanserenten (Referenzzinssatz).
