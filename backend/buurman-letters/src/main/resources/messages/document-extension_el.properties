letter.closing=Για οποιεσδήποτε ερωτήσεις σχετικά με αυτή την αναπροσαρμογή, μη διστάσετε να επικοινωνήσετε μαζί μας.
letter.disclaimer=Το παρόν έγγραφο είναι ενημερωτικό και δεν αποτελεί νομικά δεσμευτική συμφωνία. Η αναπροσαρμογή ενοικίου υπόκειται στους όρους και τις προϋποθέσεις της υφιστάμενης σύμβασης μίσθωσης και στην ισχύουσα τοπική νομοθεσία.
legal.NL=Η παρούσα παράταση διέπεται από το ολλανδικό μισθωτικό δίκαιο (huurrecht). Τα μέρη μπορούν να παραπέμψουν διαφορές στην Huurcommissie (Επιτροπή Μισθωμάτων).
legal.DE=Η παρούσα συμφωνία παράτασης συνάπτεται σύμφωνα με το §557 BGB (Mietverhöhungsvereinbarung). Ενδέχεται να ισχύουν οι εφαρμοστέες ρυθμίσεις ελέγχου μισθωμάτων (Mietpreisbremse).
legal.FR=Η παρούσα παράταση υπόκειται στο γαλλικό μισθωτικό δίκαιο. Οι διατάξεις του Loi ALUR ενδέχεται να ισχύουν σε ρυθμιζόμενες ζώνες (zones tendues). Οι αναπροσαρμογές μισθώματος υπόκεινται στον δείκτη IRL.
legal.BE=Η παρούσα παράταση διέπεται από την περιφερειακή στεγαστική νομοθεσία. Η τιμαριθμική αναπροσαρμογή βασίζεται στον Gezondheidsindex (Δείκτη Υγείας).
legal.ES=Η παρούσα παράταση διέπεται από τον LAU (Ley de Arrendamientos Urbanos). Ενδέχεται να ισχύουν οι διατάξεις περί ελάχιστης διάρκειας μίσθωσης των άρθρων 9-10.
legal.PT=Η παρούσα παράταση διέπεται από το NRAU (Novo Regime do Arrendamento Urbano). Οι αναπροσαρμογές μισθώματος ακολουθούν τον συντελεστή INE.
legal.AT=Η παρούσα παράταση διέπεται από το αυστριακό μισθωτικό δίκαιο (MRG). Ενδέχεται να ισχύει το σύστημα Richtwertmietzins.
legal.GB=Η παρούσα παράταση υπόκειται στον Housing Act 1988 (όπως έχει τροποποιηθεί). Οι απαιτήσεις κοινοποίησης του Section 13 ενδέχεται να ισχύουν για αυξήσεις μισθώματος.
legal.IT=Η παρούσα παράταση διέπεται από το ιταλικό μισθωτικό δίκαιο (Legge 431/1998). Ενδέχεται να ισχύουν αναπροσαρμογές βάσει του δείκτη ISTAT FOI.
legal.SE=Η παρούσα παράταση υπόκειται στον Hyreslagen. Τα επίπεδα μισθωμάτων ακολουθούν το bruksvärdessystemet (σύστημα αξίας χρήσης).
legal.DK=Η παρούσα παράταση υπόκειται στον Lejeloven. Η ρύθμιση του μισθώματος εξαρτάται από την ηλικία του κτιρίου και τον τύπο της μίσθωσης.
legal.IE=Η παρούσα παράταση διέπεται από τον Residential Tenancies Act 2004. Ενδέχεται να ισχύουν περιορισμοί Rent Pressure Zone (RPZ).
legal.PL=Η παρούσα παράταση υπόκειται στα άρθρα 6851-6852 του πολωνικού Αστικού Κώδικα. Για τις αυξήσεις μισθώματος ισχύουν απαιτήσεις έγγραφης ειδοποίησης.
legal.FI=Η παρούσα παράταση διέπεται από τον νόμο περί μισθώσεων κατοικιών (481/1995). Οι αναπροσαρμογές μισθώματος ακολουθούν τους όρους της σύμβασης.
legal.NO=Η παρούσα παράταση υπόκειται στον Husleieloven. Οι αναπροσαρμογές βάσει ΔΤΚ ισχύουν σύμφωνα με τα §4-2/§4-3.
legal.US=Η παρούσα παράταση υπόκειται στην εφαρμοστέα πολιτειακή και τοπική μισθωτική νομοθεσία. Σε ορισμένες δικαιοδοσίες ενδέχεται να ισχύουν ρυθμίσεις ελέγχου μισθωμάτων.
legal.CA=Η παρούσα παράταση διέπεται από την εφαρμοστέα επαρχιακή μισθωτική νομοθεσία. Ενδέχεται να ισχύουν ετήσια καθοδηγητικά όρια αύξησης μισθώματος.
legal.HU=Η παρούσα παράταση διέπεται από τον ουγγρικό Αστικό Κώδικα. Οι όροι αναπροσαρμογής μισθώματος ακολουθούν τη σύμβαση μίσθωσης.
legal.CZ=Η παρούσα παράταση υπόκειται στο §2249 του τσεχικού Αστικού Κώδικα. Οι αυξήσεις προς συγκρίσιμο μίσθωμα αγοράς περιορίζονται στο 20% σε 3 έτη.
legal.CH=Η παρούσα παράταση διέπεται από το ελβετικό μισθωτικό δίκαιο (Obligationenrecht άρθρα 269-270). Οι αναπροσαρμογές συνδέονται με το επιτόκιο αναφοράς (Referenzzinssatz).
