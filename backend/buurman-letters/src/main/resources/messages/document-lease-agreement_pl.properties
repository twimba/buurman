lease.nl.residential.term.summary=Data rozpoczęcia oraz czy umowa jest na czas nieoznaczony czy oznaczony.
lease.nl.residential.rent.title=Czynsz
lease.nl.residential.rent.summary=Czynsz podstawowy i prawo najemcy do jego oceny przez komisję czynszową.
