lease.fr.commercial.alterations.title=Prace i adaptacje
lease.fr.commercial.alterations.summary=Prace i adaptacje tylko za uprzednią pisemną zgodą wynajmującego.
lease.fr.commercial.assignment.title=Cesja
lease.fr.commercial.assignment.summary=Przeniesienie najmu przy zbyciu przedsiębiorstwa i limit 3 lat dla gwarancji zbywcy.
