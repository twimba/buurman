lease.nl.residential.rent-adjustment.summary=Coroczna zmiana czynszu, nigdy powyżej ustawowej maksymalnej podwyżki.
lease.nl.residential.service-costs.title=Koszty usług
lease.nl.residential.service-costs.summary=Zaliczki na media i usługi z rocznym rozliczeniem.
lease.nl.residential.deposit.title=Kaucja
lease.nl.residential.deposit.summary=Kaucja w wysokości najwyżej dwóch czynszów podstawowych, zwracana w ustawowym terminie.
lease.nl.residential.payment.title=Płatność
lease.nl.residential.payment.summary=Kiedy i jak czynsz jest płacony, z góry za każdy okres.
lease.nl.residential.use.title=Korzystanie
