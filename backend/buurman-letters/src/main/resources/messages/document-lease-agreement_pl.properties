lease.de.residential.rent-adjustment.summary=Ustawowe podwyżki do poziomu lokalnego czynszu porównawczego, w granicach limitu.
lease.de.residential.service-costs.title=Koszty eksploatacji
lease.de.residential.service-costs.summary=Zaliczki na koszty eksploatacji z rocznym rozliczeniem w terminie ustawowym.
lease.de.residential.deposit.title=Kaucja
lease.de.residential.deposit.summary=Kaucja w wysokości najwyżej 3 miesięcznych czynszów netto, płatna w ratach i lokowana oddzielnie.
lease.de.residential.payment.title=Płatność
lease.de.residential.payment.summary=Czynsz płatny z góry, najpóźniej do 3. dnia roboczego każdego okresu płatności.
lease.de.residential.use.title=Używanie
lease.de.residential.use.summary=Wyłącznie cele mieszkalne, staranne używanie i zmiany tylko za zgodą wynajmującego.
lease.de.residential.subletting.title=Podnajem
lease.de.residential.subletting.summary=Oddanie osobie trzeciej tylko za zgodą; ustawowe prawo najemcy do podnajmu części lokalu.
