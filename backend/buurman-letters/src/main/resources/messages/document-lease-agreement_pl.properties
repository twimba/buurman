# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Strony
lease.de.residential.parties.summary=Wskazuje wynajmującego i najemcę lub najemców; współnajemcy odpowiadają solidarnie.
