# DE residential (Mietvertrag über Wohnraum) clauses: title and one-line summary for the clause toggle UI.
lease.de.residential.parties.title=Strony
lease.de.residential.parties.summary=Wskazuje wynajmującego i najemcę lub najemców; współnajemcy odpowiadają solidarnie.
lease.de.residential.premises.title=Przedmiot najmu
lease.de.residential.premises.summary=Opisuje wynajmowany lokal mieszkalny i stosuje niemieckie prawo najmu mieszkań (BGB).
lease.de.residential.term.title=Okres najmu
lease.de.residential.term.summary=Data rozpoczęcia; czas nieoznaczony lub oznaczony tylko z ustawowego powodu podanego na piśmie.
lease.de.residential.rent.title=Czynsz
lease.de.residential.rent.summary=Czynsz netto i ograniczenie czynszu początkowego na obszarach o napiętym rynku mieszkaniowym.
lease.de.residential.rent-adjustment.title=Podwyżka czynszu
lease.de.residential.rent-adjustment.summary=Ustawowe podwyżki do poziomu lokalnego czynszu porównawczego, w granicach limitu.
lease.de.residential.service-costs.title=Koszty eksploatacji
lease.de.residential.service-costs.summary=Zaliczki na koszty eksploatacji z rocznym rozliczeniem w terminie ustawowym.
lease.de.residential.deposit.title=Kaucja
lease.de.residential.deposit.summary=Kaucja w wysokości najwyżej 3 miesięcznych czynszów netto, płatna w ratach i lokowana oddzielnie.
lease.de.residential.payment.title=Płatność
lease.de.residential.payment.summary=Czynsz płatny z góry, najpóźniej do 3. dnia roboczego każdego okresu płatności.
lease.de.residential.use.title=Używanie
lease.de.residential.use.summary=Wyłącznie cele mieszkalne, staranne używanie i zmiany tylko za zgodą wynajmującego.
lease.de.residential.subletting.title=Podnajem
lease.de.residential.subletting.summary=Oddanie osobie trzeciej tylko za zgodą; ustawowe prawo najemcy do podnajmu części lokalu.
lease.de.residential.maintenance.title=Utrzymanie i wady
lease.de.residential.maintenance.summary=Wynajmujący utrzymuje lokal; obniżenie czynszu z powodu wad; bez remontów kosmetycznych po stronie najemcy.
lease.de.residential.minor-repairs.title=Drobne naprawy
lease.de.residential.minor-repairs.summary=Najemca ponosi koszt drobnych napraw do kwoty na naprawę i na rok do uzupełnienia.
lease.de.residential.energy-certificate.title=Świadectwo energetyczne
lease.de.residential.energy-certificate.summary=Wynajmujący okazuje i przekazuje świadectwo charakterystyki energetycznej (GModG).
lease.de.residential.registration.title=Potwierdzenie zameldowania
lease.de.residential.registration.summary=Wynajmujący potwierdza wprowadzenie się, aby najemca mógł się zameldować.
lease.de.residential.handover-inspection.title=Wydanie i zwrot
lease.de.residential.handover-inspection.summary=Protokoły wydania i zwrotu, zwrot lokalu i 6-miesięczny termin przedawnienia.
lease.de.residential.termination.title=Wypowiedzenie
lease.de.residential.termination.summary=Forma pisemna, ustawowe okresy wypowiedzenia i wymagany uzasadniony interes wynajmującego.
lease.de.residential.data-protection.title=Ochrona danych
lease.de.residential.data-protection.summary=Przetwarzanie danych osobowych najemcy zgodnie z RODO.
lease.de.residential.disputes.title=Spory
lease.de.residential.disputes.summary=Obowiązuje prawo niemieckie; wyłącznie właściwy jest sąd rejonowy (Amtsgericht) miejsca położenia lokalu.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Strony
lease.de.commercial.parties.summary=Wskazuje wynajmującego i najemcę z numerem rejestrowym, numerem VAT i reprezentantami.
lease.de.commercial.premises.title=Przedmiot najmu
lease.de.commercial.premises.summary=Opisuje lokal użytkowy i stosuje przepisy BGB o najmie lokali użytkowych.
lease.de.commercial.permitted-use.title=Cel najmu
lease.de.commercial.permitted-use.summary=Uzgodnione przeznaczenie; zmiana wymaga zgody; najemca uzyskuje zezwolenia.
lease.de.commercial.term.title=Okres najmu
lease.de.commercial.term.summary=Czas oznaczony lub nieoznaczony; powyżej 1 roku wymagana forma dokumentowa, inaczej czas nieoznaczony.
lease.de.commercial.rent.title=Czynsz
lease.de.commercial.rent.summary=Swobodnie uzgodniony czynsz netto, powiększony o VAT i zaliczki, jeśli tak uzgodniono.
lease.de.commercial.rent-adjustment.title=Waloryzacja
lease.de.commercial.rent-adjustment.summary=Klauzula indeksacyjna według wskaźnika cen konsumpcyjnych, dopuszczalna tylko przy umowach długoterminowych (PrKG).
lease.de.commercial.service-costs.title=Koszty eksploatacji
lease.de.commercial.service-costs.summary=Koszty według BetrKV i wymienione dodatkowe pozycje, z zaliczkami i rocznym rozliczeniem.
lease.de.commercial.vat.title=Opcja VAT
lease.de.commercial.vat.summary=Wynajmujący wybiera opodatkowanie czynszu VAT; najemca używa lokalu tylko do czynności dających prawo do odliczenia.
lease.de.commercial.deposit.title=Zabezpieczenie
lease.de.commercial.deposit.summary=Kaucja pieniężna lub gwarancja bankowa, bez ustawowego limitu dla lokali użytkowych.
lease.de.commercial.payment.title=Płatność
lease.de.commercial.payment.summary=Czynsz płatny z góry do 3. dnia roboczego; ograniczenie potrącenia i odsetki handlowe.
lease.de.commercial.maintenance.title=Utrzymanie i naprawy
lease.de.commercial.maintenance.summary=Wynajmujący utrzymuje konstrukcję i części wspólne; najemca wnętrze lokalu.
lease.de.commercial.alterations.title=Zmiany i adaptacja
lease.de.commercial.alterations.summary=Prace i reklamy najemcy tylko za zgodą w formie dokumentowej; usunięcie po zakończeniu najmu.
lease.de.commercial.subletting.title=Podnajem
lease.de.commercial.subletting.summary=Oddanie osobie trzeciej tylko za zgodą; szczególne prawo wypowiedzenia w razie odmowy.
lease.de.commercial.competition.title=Ochrona przed konkurencją
lease.de.commercial.competition.summary=Wynajmujący nie wynajmuje konkurentowi o tym samym asortymencie głównym.
lease.de.commercial.insurance.title=Ubezpieczenia
lease.de.commercial.insurance.summary=Wynajmujący ubezpiecza budynek; najemca swoje mienie i odpowiedzialność cywilną z tytułu działalności.
lease.de.commercial.energy-certificate.title=Świadectwo energetyczne
lease.de.commercial.energy-certificate.summary=Wynajmujący okazuje i przekazuje świadectwo charakterystyki energetycznej (GModG).
lease.de.commercial.handover-inspection.title=Wydanie i zwrot
lease.de.commercial.handover-inspection.summary=Protokoły wydania i zwrotu, zwrot opróżnionego lokalu i 6-miesięczny termin przedawnienia.
lease.de.commercial.termination.title=Wypowiedzenie
lease.de.commercial.termination.summary=Wypowiedzenie do 3. dnia roboczego kwartału na koniec następnego kwartału; wypowiedzenie nadzwyczajne.
lease.de.commercial.data-protection.title=Ochrona danych
lease.de.commercial.data-protection.summary=Przetwarzanie danych osobowych przedstawicieli i osób kontaktowych zgodnie z RODO.
lease.de.commercial.disputes.title=Spory
lease.de.commercial.disputes.summary=Obowiązuje prawo niemieckie; wyłącznie właściwy jest sąd miejsca położenia lokalu.
# FR residential (bail d'habitation, logement nu) clauses: title and one-line summary for the clause toggle UI.
lease.fr.residential.parties.title=Strony
lease.fr.residential.parties.summary=Wskazuje wynajmującego i najemcę lub najemców; współnajemcy odpowiadają solidarnie w granicach ustawowych.
lease.fr.residential.premises.title=Przedmiot najmu
lease.fr.residential.premises.summary=Opisuje nieumeblowany lokal mieszkalny wynajmowany jako główne miejsce zamieszkania zgodnie z ustawą z 6 lipca 1989 r. i umową wzorcową.
lease.fr.residential.term.title=Okres najmu
lease.fr.residential.term.summary=Data rozpoczęcia, minimalny okres 3 lub 6 lat zależnie od wynajmującego oraz milczące przedłużenie.
lease.fr.residential.rent.title=Czynsz
lease.fr.residential.rent.summary=Czynsz bez opłat dodatkowych oraz limity czynszu na obszarach o wysokim popycie i kontroli czynszów.
lease.fr.residential.rent-adjustment.title=Waloryzacja czynszu
lease.fr.residential.rent-adjustment.summary=Coroczna waloryzacja ograniczona wskaźnikiem referencyjnym czynszów (IRL); brak waloryzacji w klasach energetycznych F i G.
lease.fr.residential.service-costs.title=Opłaty
lease.fr.residential.service-costs.summary=Opłaty podlegające zwrotowi w formie zaliczek z rocznym rozliczeniem i dokumentami.
lease.fr.residential.deposit.title=Kaucja
lease.fr.residential.deposit.summary=Kaucja w wysokości najwyżej 1 miesięcznego czynszu bez opłat, zwracana w ciągu 1 lub 2 miesięcy.
lease.fr.residential.payment.title=Płatność
lease.fr.residential.payment.summary=Kiedy i jak płacony jest czynsz; płatność miesięczna na żądanie, bezpłatne pokwitowania i brak kar umownych.
lease.fr.residential.use.title=Korzystanie z lokalu
lease.fr.residential.use.summary=Spokojne korzystanie jako główne miejsce zamieszkania; zmiany tylko za pisemną zgodą wynajmującego.
lease.fr.residential.subletting.title=Podnajem
lease.fr.residential.subletting.summary=Przeniesienie najmu i podnajem tylko za pisemną zgodą wynajmującego, również co do czynszu.
lease.fr.residential.maintenance.title=Utrzymanie i naprawy
lease.fr.residential.maintenance.summary=Obowiązki wynajmującego co do przyzwoitego stanu i napraw, bieżące utrzymanie przez najemcę i dostęp w celu prac.
lease.fr.residential.works.title=Prace
lease.fr.residential.works.summary=Prace wykonane od poprzedniej umowy oraz uzgodnione prace ulepszające z ewentualną podwyżką czynszu.
lease.fr.residential.diagnostics.title=Diagnozy techniczne
lease.fr.residential.diagnostics.summary=Dokumentacja diagnoz technicznych załączona do umowy, klasa energetyczna i minimalna charakterystyka energetyczna.
lease.fr.residential.insurance.title=Ubezpieczenie
lease.fr.residential.insurance.summary=Najemca ubezpiecza ryzyka najemcy i co roku na żądanie przedstawia dowód.
lease.fr.residential.handover-inspection.title=Protokół stanu
lease.fr.residential.handover-inspection.summary=Protokoły zdawczo-odbiorcze przy wydaniu i zwrocie, sporządzane wspólnie lub przez komornika.
lease.fr.residential.termination.title=Wypowiedzenie
lease.fr.residential.termination.summary=Wypowiedzenie przez najemcę (3 lub 1 miesiąc) i wynajmującego (6 miesięcy, przyczyny ustawowe); klauzula rozwiązująca.
lease.fr.residential.annexes.title=Załączniki
lease.fr.residential.annexes.summary=Obowiązkowe załączniki: nota informacyjna, dokumentacja diagnoz, protokół stanu i wyciągi z regulaminu wspólnoty.
lease.fr.residential.data-protection.title=Ochrona danych
lease.fr.residential.data-protection.summary=Przetwarzanie danych osobowych najemcy zgodnie z RODO.
lease.fr.residential.disputes.title=Spory
lease.fr.residential.disputes.summary=Obowiązuje prawo francuskie; komisja pojednawcza i sędzia do spraw ochrony.
# FR commercial (bail commercial) clauses: title and one-line summary for the clause toggle UI.
lease.fr.commercial.parties.title=Strony
lease.fr.commercial.parties.summary=Wskazuje wynajmującego i najemcę z numerem rejestrowym, numerem VAT i reprezentantami.
lease.fr.commercial.premises.title=Przedmiot najmu
lease.fr.commercial.premises.summary=Opisuje lokal i poddaje umowę ustawowemu reżimowi najmu handlowego.
