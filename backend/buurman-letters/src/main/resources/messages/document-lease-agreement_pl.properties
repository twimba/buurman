# NL residential (huur woonruimte) clauses: title and one-line summary for the clause toggle UI.
lease.nl.residential.parties.title=Strony
lease.nl.residential.parties.summary=Wskazuje wynajmującego i najemcę; współnajemcy odpowiadają solidarnie.
lease.nl.residential.premises.title=Przedmiot najmu
