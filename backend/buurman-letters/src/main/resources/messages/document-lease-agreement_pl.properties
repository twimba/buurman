lease.nl.residential.deposit.title=Kaucja
lease.nl.residential.deposit.summary=Kaucja w wysokości najwyżej dwóch czynszów podstawowych, zwracana w ustawowym terminie.
lease.nl.residential.payment.title=Płatność
