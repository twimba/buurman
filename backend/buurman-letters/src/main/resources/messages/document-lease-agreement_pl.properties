lease.fr.residential.data-protection.summary=Przetwarzanie danych osobowych najemcy zgodnie z RODO.
lease.fr.residential.disputes.title=Spory
lease.fr.residential.disputes.summary=Obowiązuje prawo francuskie; komisja pojednawcza i sędzia do spraw ochrony.
