lease.de.residential.data-protection.summary=Przetwarzanie danych osobowych najemcy zgodnie z RODO.
lease.de.residential.disputes.title=Spory
lease.de.residential.disputes.summary=Obowiązuje prawo niemieckie; wyłącznie właściwy jest sąd rejonowy (Amtsgericht) miejsca położenia lokalu.
# DE commercial (Mietvertrag über Geschäftsräume) clauses: title and one-line summary for the clause toggle UI.
lease.de.commercial.parties.title=Strony
lease.de.commercial.parties.summary=Wskazuje wynajmującego i najemcę z numerem rejestrowym, numerem VAT i reprezentantami.
lease.de.commercial.premises.title=Przedmiot najmu
lease.de.commercial.premises.summary=Opisuje lokal użytkowy i stosuje przepisy BGB o najmie lokali użytkowych.
lease.de.commercial.permitted-use.title=Cel najmu
lease.de.commercial.permitted-use.summary=Uzgodnione przeznaczenie; zmiana wymaga zgody; najemca uzyskuje zezwolenia.
