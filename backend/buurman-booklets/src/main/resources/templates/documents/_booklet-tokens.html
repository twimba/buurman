<!--/*
  Shared design-system foundation for booklets & summary cards.
  Mirrors frontend/packages/ui/src/styles/theme.css so the PDF and the app share one visual language.
  Target renderer is headless Chromium (Gotenberg) — modern CSS (grid/flex/custom-props) is fair game.
  Usage:  <th:block th:replace="~{documents/_booklet-tokens :: styles}" />
  Fonts (Satoshi + Noto Sans/Greek) are installed in the custom Gotenberg image and resolved by family.
*/-->
<th:block th:fragment="styles">
<style>
  :root {
    /* Brand */
    --c-primary-50:#f0f9ff; --c-primary-100:#e0f2fe; --c-primary-500:#0284c7;
    --c-primary-600:#0369a1; --c-primary-700:#075985; --c-primary-800:#0c4a6e; --c-primary-900:#082f49;
    /* The one-highlight accent (amber) */
    --c-accent-50:#fffbeb; --c-accent-200:#fde68a; --c-accent-500:#f59e0b; --c-accent-600:#d97706;
    /* Stone neutrals */
    --c-n-0:#ffffff; --c-n-25:#fafaf9; --c-n-50:#f5f5f4; --c-n-100:#e7e5e4; --c-n-200:#d6d3d1;
    --c-n-300:#a8a29e; --c-n-400:#78716c; --c-n-500:#57534e; --c-n-600:#44403c; --c-n-700:#292524; --c-n-900:#171412;
    /* Semantic */
    --c-success:#059669; --c-success-bg:#f0fdf4; --c-warning:#d97706; --c-warning-bg:#fffbeb;
    --c-error:#dc2626; --c-error-bg:#fef2f2; --c-info:#0284c7;
    --radius:10px; --radius-sm:6px;
    --ink:var(--c-n-700); --muted:var(--c-n-400); --hairline:var(--c-n-100);
    --font:'Satoshi','Noto Sans','Helvetica Neue',Arial,sans-serif;
  }

  * { box-sizing:border-box; }
  html { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { margin:0; padding:0; font-family:var(--font); color:var(--ink);
         font-size:12px; line-height:1.5; font-feature-settings:'tnum' 0; }
  .num { font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }

  /* ── Brand bands ─────────────────────────────────────────── */
  .brand-band { background:var(--c-primary-800); color:#fff; display:flex; align-items:center;
                justify-content:space-between; padding:0 24px; }
  .brand-band .wordmark { font-weight:800; letter-spacing:.5px; font-size:16px; }
  .brand-band .kicker { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--c-primary-200, #bae6fd); }
  .brand-footer { background:var(--c-primary-800); color:#fff; display:flex; align-items:center;
                  justify-content:space-between; padding:0 24px; font-size:9px; letter-spacing:.4px; }
  .brand-footer .tagline { font-weight:600; }

  /* ── Hierarchy ───────────────────────────────────────────── */
  .display { font-weight:800; letter-spacing:-.5px; color:var(--c-primary-800); line-height:1.05; }
  .display-40 { font-size:34px; } .display-32 { font-size:28px; }
  .hero { font-weight:800; letter-spacing:-1px; line-height:1; }
  .hero-l { font-size:60px; } .hero-m { font-size:46px; } .hero-s { font-size:34px; }
  .sub { font-size:13px; color:var(--muted); }
  .label { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--c-primary-600); }

  /* ── Status badge ────────────────────────────────────────── */
  .badge { display:inline-block; padding:5px 14px; border-radius:999px; font-size:11px;
           font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
  .s-active,.s-occupied,.s-paid       { background:var(--c-success-bg); color:var(--c-success); }
  .s-pending,.s-pending_signature,.s-maintenance,.s-partially_paid { background:var(--c-warning-bg); color:var(--c-warning); }
  .s-expired,.s-terminated,.s-overdue { background:var(--c-error-bg); color:var(--c-error); }
  .s-draft,.s-vacant,.s-cancelled,.s-unavailable { background:var(--c-n-50); color:var(--c-n-500); }

  /* ── KPI tiles ───────────────────────────────────────────── */
  .kpi-row { display:flex; gap:12px; }
  .kpi { flex:1; background:var(--c-primary-50); border-radius:var(--radius);
         border-left:3px solid var(--c-primary-500); padding:16px 16px; min-height:82px;
         display:flex; flex-direction:column; justify-content:center; }
  .kpi .label { color:var(--c-primary-600); }
  .kpi .val { font-size:25px; font-weight:800; color:var(--c-n-900); margin-top:5px; line-height:1.1;
              white-space:nowrap; }
  .kpi .val .unit { font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; }
  /* The single amber highlight — at most one per page */
  .kpi.highlight { background:var(--c-accent-50); border-left-color:var(--c-accent-500);
                   box-shadow:0 0 0 1px var(--c-accent-200) inset; }
  .kpi.highlight .label { color:var(--c-accent-600); }
  .kpi.danger { background:var(--c-error-bg); border-left-color:var(--c-error); }
  .kpi.danger .label { color:var(--c-error); }

  /* ── Micro / stacked bars (only data-viz primitive) ──────── */
  .bar { height:6px; border-radius:3px; background:var(--c-n-100); overflow:hidden; display:flex; margin-top:8px; }
  .bar > span { display:block; height:100%; }
  .seg-paid{ background:var(--c-success);} .seg-pending{ background:var(--c-warning);} .seg-overdue{ background:var(--c-error);}

  /* ── Landscape summary-card shell (shared by the 3 summary cards) ─── */
  .card { display:flex; flex-direction:column; height:209mm; }
  .body { flex:1; display:flex; gap:24px; padding:30px 32px; }
  .main { flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:18px; }
  .ident { display:flex; align-items:flex-start; justify-content:space-between; }

  /* ── QR / Sid perforation rail ───────────────────────────── */
  .rail { position:relative; border-left:2px dashed var(--c-n-200); padding-left:20px; display:flex;
          flex-direction:column; align-items:center; justify-content:center; }
  .rail .qr { width:120px; height:120px; }
  .rail .sid { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
               font-family:'Noto Sans',monospace; font-size:12px; font-weight:700; letter-spacing:2px;
               color:var(--c-n-500); writing-mode:vertical-rl; text-orientation:mixed; }

  /* ── Detail rows (label stacked above value — i18n-safe) ─── */
  .field { margin-bottom:10px; }
  .field .v { font-size:13px; color:var(--c-n-700); }
  .row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--c-n-600); padding:3px 0; }
  .row .ico { color:var(--c-primary-500); flex:0 0 auto; }
</style>
</th:block>
