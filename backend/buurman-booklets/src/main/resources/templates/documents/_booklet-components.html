<!--/*
  Reusable Thymeleaf fragments for booklets & summary cards.
  Keep presentation here; exporters pass pre-formatted, already-localized values (BookletFormatter /
  EnumLabelResolver) so templates never format money/dates/enums themselves.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org">

  <!--/* Top brand band: white wordmark + right-aligned kicker. */-->
  <div th:fragment="brandHeader(kicker)" class="brand-band" style="height:56px;">
    <span class="wordmark">buurman</span>
    <span class="kicker" th:text="${kicker}">SUMMARY</span>
  </div>

  <!--/* Bottom brand band: tagline + generated-on meta. */-->
  <div th:fragment="brandFooter(tagline,meta)" class="brand-footer" style="height:40px;">
    <span class="tagline" th:text="${tagline}">Your portfolio, in focus.</span>
    <span th:text="${meta}">Generated</span>
  </div>

  <!--/* One KPI tile. variant: '' | 'highlight' (amber) | 'danger' (red). */-->
  <div th:fragment="kpi(label,value,unit,variant)" class="kpi" th:classappend="${variant}">
    <div class="label" th:text="${label}">LABEL</div>
    <div class="val num"><span th:text="${value}">0</span><span class="unit" th:if="${unit}" th:text="' ' + ${unit}"></span></div>
  </div>

  <!--/* Status badge: code drives the colour class (active/vacant/overdue/...). */-->
  <span th:fragment="badge(code,text)" class="badge" th:classappend="'s-' + ${#strings.toLowerCase(code)}" th:text="${text}">STATUS</span>

</th:block>
