# Display labels for domain enums, shared by booklets and summary cards.
# Key convention: <lowerCamelEnumSimpleName>.<ENUM_CONSTANT> (resolved by EnumLabelResolver).
# This is the English base bundle and the fallback for every locale. Add document-enum-labels_<locale>.properties
# to translate; missing keys cascade to this file, so output is never blank or a raw enum name.

