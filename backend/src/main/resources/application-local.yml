# =============================================================================
# Local Development Profile
# =============================================================================
# Infrastructure services run in Docker behind Traefik reverse proxy (HTTPS).
# Backend and app run on the host machine.
#
# Start infra:  docker compose up postgres keycloak seaweedfs mailpit traefik
# Start backend: mvn spring-boot:run
# Start app: cd app && yarn dev
#
# Hostnames (all resolve to 127.0.0.1 via DNS, HTTPS via Traefik + mkcert):
#   https://keycloak.local.buurman.io    → Keycloak
#   https://seaweedfs.local.buurman.io   → S3
#   https://mailpit.local.buurman.io     → MailHog Web UI
#   postgresql.local.buurman.io:5432     → PostgreSQL (TCP direct)
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://postgresql.local.buurman.io:5432/buurman

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.local.buurman.io/realms/buurman
          jwk-set-uri: https://keycloak.local.buurman.io/realms/buurman/protocol/openid-connect/certs
          backoffice:
            issuer-uri: https://keycloak.local.buurman.io/realms/buurman-backoffice
            jwk-set-uri: https://keycloak.local.buurman.io/realms/buurman-backoffice/protocol/openid-connect/certs
  web:
    error:
      include-message: always

keycloak:
  admin:
    server-url: https://keycloak.local.buurman.io

aws:
  s3:
    endpoint: https://seaweedfs.local.buurman.io
    public-endpoint: https://seaweedfs.local.buurman.io
    use-presigned-urls: false

flagsmith:
  api-url: https://flagsmith.local.buurman.io/api/v1/
  environment-refresh-interval-seconds: 15

spring.mail:
  host: localhost
  port: 1025

app:
  public-url: https://app.local.buurman.io
  api:
    base-url: https://api.local.buurman.io
  email:
    base-url: https://app.local.buurman.io
