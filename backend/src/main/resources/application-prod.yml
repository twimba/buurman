# =============================================================================
# Production Profile
# =============================================================================
# Deployed on Dokploy. All secrets injected via environment variables.
# Activate with: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri must match the public URL (iss claim in JWT tokens)
          issuer-uri: https://keycloak.buurman.io/realms/buurman
          # jwk-set-uri can use internal URL to avoid TLS issues
          jwk-set-uri: ${KEYCLOAK_JWK_BASE_URL:https://keycloak.buurman.io}/realms/buurman/protocol/openid-connect/certs
          backoffice:
            issuer-uri: https://keycloak.buurman.io/realms/buurman-backoffice
            jwk-set-uri: ${KEYCLOAK_JWK_BASE_URL:https://keycloak.buurman.io}/realms/buurman-backoffice/protocol/openid-connect/certs
  web:
    error:
      include-message: never

keycloak:
  admin:
    server-url: https://keycloak.buurman.io

aws:
  s3:
    use-presigned-urls: true

buurman:
  demo:
    cron: "23 */2 */12 * * ?"

flagsmith:
  environment-name: Production

app:
  public-url: https://app.buurman.io
  api:
    base-url: https://api.buurman.io
  email:
    base-url: https://app.buurman.io
  cors:
    allowed-origins: https://app.buurman.io
    backoffice-allowed-origins: https://backoffice.buurman.io

management:
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
