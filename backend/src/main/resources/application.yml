spring:
  application:
    name: buurman-backend

  profiles:
    default: local

  datasource:
    username: ${DB_USERNAME:buurman}
    password: ${DB_PASSWORD:buurman}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jooq:
    sql-dialect: postgres

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # Quartz Scheduler Configuration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # Flyway manages schema
    properties:
      org.quartz.scheduler.instanceName: BuurmanScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.threadPool.threadCount: 5

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Keycloak Admin API Configuration
keycloak:
  admin:
    realm: master
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  realm: buurman

# AWS S3 Configuration
aws:
  s3:
    region: ${AWS_S3_REGION:eu-west-1}
    bucket-name: ${AWS_S3_BUCKET:buurman-documents}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

# Email Configuration
spring.mail:
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false

# Demo Data Configuration
buurman:
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}
    api-key: ${DEMO_DATA_API_KEY:demo-secret-key}
    auto-regenerate: ${DEMO_DATA_AUTO_REGENERATE:true}
    cron: "0 0 */12 * * *"

# Application Configuration
app:
  version: @project.version@
  documents:
    max-file-size: 52428800
    allowed-mime-types: application/pdf,image/jpeg,image/png,image/gif
  email:
    from: ${EMAIL_FROM:noreply@buurman.com}
    from-name: ${EMAIL_FROM_NAME:Buurman}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: buurman
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: 30s
    distribution:
      percentiles-histogram:
        http.server.requests: true
        buurman.s3.operation.seconds: true
        buurman.export.generation.seconds: true
        buurman.email.send.seconds: true
      percentiles:
        http.server.requests: 0.5,0.75,0.95,0.99
        buurman.s3.operation.seconds: 0.5,0.95,0.99
        buurman.export.generation.seconds: 0.5,0.95,0.99

# Server Configuration
server:
  port: 8081

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs/openapi
  swagger-ui:
    enabled: true
    path: /api-docs
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
