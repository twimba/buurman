spring:
  application:
    name: buurman-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/buurman
    username: buurman
    password: buurman
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jooq:
    sql-dialect: postgres

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/buurman
          jwk-set-uri: http://localhost:8080/realms/buurman/protocol/openid-connect/certs

# Keycloak Admin API Configuration
keycloak:
  admin:
    server-url: http://localhost:8080
    realm: master
    client-id: admin-cli
    username: admin
    password: admin
  realm: buurman

# AWS S3 Configuration
aws:
  s3:
    endpoint: http://localhost:4566
    region: eu-west-1
    bucket-name: buurman-documents
    access-key: test
    secret-key: test

# Application Configuration
app:
  version: @project.version@
  documents:
    max-file-size: 52428800
    allowed-mime-types: application/pdf,image/jpeg,image/png,image/gif

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Server Configuration
server:
  port: 8081
  error:
    include-message: always

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
