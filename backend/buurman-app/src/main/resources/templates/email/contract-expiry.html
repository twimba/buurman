<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contract Expiring Soon</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{email/_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Contract Expiring Soon</h1>

            <p style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                Hi <span th:text="${userName}">User</span>,
            </p>

            <p style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                A rental contract is expiring soon and may need your attention.
            </p>

            <div style="background: #fef3c7; border-radius: 6px; padding: 20px; margin: 0 0 24px 0; border-left: 4px solid #f59e0b;">
                <p style="color: #92400e; margin: 0 0 8px 0;"><strong>Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #92400e; margin: 0 0 8px 0;"><strong>Expires in:</strong> <span th:text="${daysUntilExpiry}">0</span> days</p>
                <p style="color: #92400e; margin: 0;"><strong>Expiry Date:</strong> <span th:text="${expiryDate}">Date</span></p>
            </div>

            <p style="color: #292524; line-height: 1.6; margin: 0 0 24px 0;">
                Consider renewing the contract or arranging for the move-out.
            </p>

            <a th:href="${baseUrl}" style="display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500;">
                View Contract
            </a>
        </div>

        <div th:replace="~{email/_email-base :: footer}"></div>
    </div>
</body>
</html>
