<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contract Created</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.contract-created.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">New Contract Created</h1>

            <p th:text="#{email.contract-created.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                A new contract has been created.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-created.label.property}">Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-created.label.contact}">Contact:</strong> <span th:text="${contactName}">Contact Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-created.label.rent}">Rent:</strong> <span th:text="${rentAmount}">Amount</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-created.label.startDate}">Start Date:</strong> <span th:text="${startDate}">Date</span></p>
                <p th:if="${endDate}" style="color: #292524; margin: 0;"><strong th:text="#{email.contract-created.label.endDate}">End Date:</strong> <span th:text="${endDate}">Date</span></p>
            </div>

            <a th:href="${baseUrl}" th:text="#{email.contract-created.cta}" style="display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500;">
                View Contract
            </a>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
