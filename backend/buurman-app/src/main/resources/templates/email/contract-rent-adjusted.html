<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contract Rent Adjusted</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.contract-rent-adjusted.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Contract Rent Adjusted</h1>

            <p th:text="#{email.contract-rent-adjusted.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                The rent amount for a contract has been adjusted.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-rent-adjusted.label.property}">Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-rent-adjusted.label.contact}">Contact:</strong> <span th:text="${contactName}">Contact Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-rent-adjusted.label.previousRent}">Previous Rent:</strong> <span th:text="${oldRentAmount}">Old Rent</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-rent-adjusted.label.newRent}">New Rent:</strong> <span th:text="${newRentAmount}">New Rent</span></p>
                <p style="color: #292524; margin: 0;"><strong th:text="#{email.contract-rent-adjusted.label.effectiveFrom}">Effective From:</strong> <span th:text="${effectiveFrom}">Date</span></p>
            </div>

            <div th:replace="~{_email-base :: actions(${primaryUrl}, #{email.contract-rent-adjusted.cta}, ${secondaryUrl}, #{email.contract-rent-adjusted.cta.secondary})}"></div>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
