<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Reminder</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.payment-reminder.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Payment Reminder</h1>

            <p th:text="#{email.payment-reminder.greeting(${userName})}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                Hi User,
            </p>

            <p th:text="#{email.payment-reminder.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                This is a reminder that a payment is due soon for your property.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.payment-reminder.label.property}">Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.payment-reminder.label.amount}">Amount:</strong> <span th:text="${amount}">€0.00</span></p>
                <p style="color: #292524; margin: 0;"><strong th:text="#{email.payment-reminder.label.dueDate}">Due Date:</strong> <span th:text="${dueDate}">Date</span></p>
            </div>

            <a th:href="${baseUrl}" th:text="#{email.payment-reminder.cta}" style="display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500;">
                View Payment Details
            </a>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
