<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contract Extension Pending Confirmation</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.contract-extension-pending.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Extension Awaiting Confirmation</h1>
            <p th:text="#{email.contract-extension-pending.greeting(${recipientName})}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                Hi User,
            </p>
            <p th:text="#{email.contract-extension-pending.body1(${extensionNumber},${propertyName})}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                An automatic extension (#1) has been created for the contract at Property Name and requires confirmation before activation.
            </p>
            <div style="background: #fef3c7; border-radius: 6px; padding: 20px; margin: 0 0 24px 0; border-left: 4px solid #f59e0b;">
                <p th:text="#{email.contract-extension-pending.detailsHeading}" style="color: #92400e; margin: 0 0 8px 0; font-weight: 600;">Proposed Extension</p>
                <p style="color: #92400e; margin: 0 0 8px 0;"><strong th:text="#{email.contract-extension-pending.label.currentEndDate}">Current End Date:</strong> <span th:text="${previousEndDate}">Date</span></p>
                <p style="color: #92400e; margin: 0 0 8px 0;"><strong th:text="#{email.contract-extension-pending.label.proposedEndDate}">Proposed End Date:</strong> <span th:text="${newEndDate}">Date</span></p>
                <p style="color: #92400e; margin: 0 0 8px 0;"><strong th:text="#{email.contract-extension-pending.label.currentRent}">Current Rent:</strong> <span th:text="${previousRentFormatted}">EUR 1,000.00</span></p>
                <p style="color: #92400e; margin: 0;"><strong th:text="#{email.contract-extension-pending.label.proposedRent}">Proposed Rent:</strong> <span th:text="${newRentFormatted}">EUR 1,025.00</span></p>
            </div>
            <div th:replace="~{_email-base :: actions(${primaryUrl}, #{email.contract-extension-pending.cta}, ${secondaryUrl}, #{email.contract-extension-pending.cta.secondary})}"></div>
        </div>
        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
