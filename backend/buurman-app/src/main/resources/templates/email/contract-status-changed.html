<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contract Status Changed</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.contract-status-changed.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Contract Status Changed</h1>

            <p th:text="#{email.contract-status-changed.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                A contract status has been updated.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-status-changed.label.property}">Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-status-changed.label.contact}">Contact:</strong> <span th:text="${contactName}">Contact Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.contract-status-changed.label.previousStatus}">Previous Status:</strong> <span th:text="${oldStatus}">Old Status</span></p>
                <p style="color: #292524; margin: 0;"><strong th:text="#{email.contract-status-changed.label.newStatus}">New Status:</strong> <span th:text="${newStatus}">New Status</span></p>
            </div>

            <div th:replace="~{_email-base :: actions(${primaryUrl}, #{email.contract-status-changed.cta}, ${secondaryUrl}, #{email.contract-status-changed.cta.secondary})}"></div>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
