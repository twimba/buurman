<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expense Created</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.expense-created.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">New Expense Recorded</h1>

            <p th:text="#{email.expense-created.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                A new expense has been recorded for one of your properties.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.expense-created.label.property}">Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.expense-created.label.category}">Category:</strong> <span th:text="${category}">Category</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.expense-created.label.amount}">Amount:</strong> <span th:text="${amount}">Amount</span></p>
                <p th:if="${description}" style="color: #292524; margin: 0;"><strong th:text="#{email.expense-created.label.description}">Description:</strong> <span th:text="${description}">Description</span></p>
            </div>

            <div th:replace="~{_email-base :: actions(${primaryUrl}, #{email.expense-created.cta}, ${secondaryUrl}, #{email.expense-created.cta.secondary})}"></div>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
