<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signature Declined</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.signature-declined.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Signature Declined</h1>

            <p th:text="#{email.signature-declined.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                A signer declined to sign a document you sent for signature.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong th:text="#{email.signature-declined.label.document}">Document:</strong> <span th:text="${documentName}">Document Name</span></p>
                <p style="color: #292524; margin: 0;"><strong th:text="#{email.signature-declined.label.signer}">Declined by:</strong> <span th:text="${signerEmail}">signer@example.com</span></p>
            </div>

            <p th:text="#{email.signature-declined.body2}" style="color: #292524; line-height: 1.6; margin: 0 0 24px 0;">
                The original document is unchanged and can be sent for signature again.
            </p>

            <div th:replace="~{_email-base :: actions(${primaryUrl}, #{email.signature-declined.cta}, null, null)}"></div>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
