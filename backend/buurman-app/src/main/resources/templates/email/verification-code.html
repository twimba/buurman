<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your email</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 th:text="#{email.verification-code.heading}" style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Verify your email</h1>

            <p th:text="#{email.verification-code.greeting(${userName})}" style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                Hi User,
            </p>

            <p th:text="#{email.verification-code.body1}" style="color: #292524; line-height: 1.6; margin: 0 0 24px 0;">
                Click the button below to verify your email address:
            </p>

            <div style="text-align: center; margin: 0 0 24px 0;">
                <a th:href="${verifyUrl}" th:text="#{email.verification-code.cta}" style="display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 16px;">Verify Email</a>
            </div>

            <p th:text="#{email.verification-code.manual}" style="color: #57534e; font-size: 14px; line-height: 1.6; margin: 0 0 16px 0;">
                Or enter this code manually:
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 8px; padding: 24px; text-align: center; margin: 0 0 24px 0;">
                <span th:text="${verificationCode}" style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #292524; font-family: monospace;">123456</span>
            </div>

            <p th:text="#{email.verification-code.expiry(${expiresMinutes})}" style="color: #57534e; font-size: 14px; margin: 0 0 16px 0;">
                This link and code expire in 15 minutes.
            </p>

            <p th:text="#{email.verification-code.ignore}" style="color: #57534e; font-size: 14px; margin: 0;">
                If you didn't create an account with Buurman, you can safely ignore this email.
            </p>
        </div>

        <div th:replace="~{_email-base :: footer}"></div>
    </div>
</body>
</html>
