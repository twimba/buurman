spring:
  application:
    name: buurman-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  profiles:
    default: local

  datasource:
    username: ${DB_USERNAME:buurman}
    password: ${DB_PASSWORD:buurman}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jooq:
    sql-dialect: postgres

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # Quartz Scheduler Configuration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # Flyway manages schema
    properties:
      org.quartz.scheduler.instanceName: BuurmanScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.threadPool.threadCount: 5

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Keycloak Admin API Configuration
keycloak:
  admin:
    realm: master
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  realm: buurman
  backoffice-realm: buurman-backoffice

# AWS S3 Configuration
aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    region: ${AWS_S3_REGION:eu-west-1}
    bucket-name: ${AWS_S3_BUCKET:buurman-documents}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

# Email Configuration
spring.mail:
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false

# Demo Data Configuration
buurman:
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}
    cron: "23 1 * * * ?"

# Google Maps Configuration
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

# Flagsmith Feature Flags
flagsmith:
  api-url: ${FLAGSMITH_API_URL:http://flagsmith:8000/api/v1/}
  admin-email: ${FLAGSMITH_ADMIN_EMAIL:}
  admin-password: ${FLAGSMITH_ADMIN_PASSWORD:}
  api-token: ${FLAGSMITH_API_TOKEN:}
  project-name: Buurman
  environment-name: Local
  enable-analytics: true
  environment-refresh-interval-seconds: 300

# Application Configuration
app:
  version: @project.version@
  public-url: ${APP_BASE_URL:https://app.local.buurman.io}
  api:
    base-url: ${API_BASE_URL:https://api.local.buurman.io}
  documents:
    max-file-size: 52428800
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/gif
  email:
    from: ${EMAIL_FROM:noreply@buurman.io}
    from-name: ${EMAIL_FROM_NAME:Buurman}
    base-url: ${app.public-url} # Derived from app.public-url — do not override independently
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://app.local.buurman.io}
    backoffice-allowed-origins: ${CORS_BACKOFFICE_ALLOWED_ORIGINS:http://localhost:5174,https://backoffice.local.buurman.io}

# SendGrid Configuration
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:noreply@buurman.io}
  from-name: ${SENDGRID_FROM_NAME:Buurman}
  webhook-verification-key: ${SENDGRID_WEBHOOK_VERIFICATION_KEY:}

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}

# Notification Configuration
notification:
  outbox:
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
    max-retries: ${NOTIFICATION_OUTBOX_MAX_RETRIES:5}
  consolidation:
    enabled: true
    email:
      enabled: true
      min-group-size: 2
      max-items-per-digest: 100
    sms:
      enabled: false
      threshold: 3

# Scheduling Configuration
scheduling:
  notifications:
    outbox-push-cron: "*/30 * * * * ?"
  payment-generation:
    cron: "0 0 * * * ?"
  notification-reminders:
    contract-expiry-cron: "0 0 0 * * ?"
    payment-reminder-cron: "0 0 0 * * ?"
    contact-follow-up-cron: "0 0 8 * * ?"
  metrics:
    metrics-push-cron: "0 */15 * * * ?"
  thumbnail-backfill:
    cron: "0 */5 * * * ?"

# Impersonation Configuration
impersonation:
  jwt-secret: ${IMPERSONATION_JWT_SECRET:change-me-in-production-use-at-least-32-chars}
  max-timeout: 60m
  default-timeout: 15m
  app-base-url: ${APP_PUBLIC_URL:https://app.local.buurman.io}

# Actuator Configuration
management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
  metrics:
    tags:
      application: buurman
    distribution:
      percentiles-histogram:
        http.server.requests: true
        buurman.s3.operation.seconds: true
        buurman.export.generation.seconds: true
        buurman.notification.send.seconds: true
      percentiles:
        http.server.requests: 0.5,0.75,0.95,0.99
        buurman.s3.operation.seconds: 0.5,0.95,0.99
        buurman.export.generation.seconds: 0.5,0.95,0.99
  prometheus:
    metrics:
      export:
        step: 30s
        descriptions: true
        enabled: true

# Server Configuration
server:
  port: 8081
  forward-headers-strategy: framework

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs/openapi
  swagger-ui:
    enabled: true
    path: /api-docs
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    disable-swagger-default-url: true
    urls-primary-name: app
  group-configs:
    - group: app
      paths-to-exclude: /backoffice/**
  