spring:
  application:
    name: buurman-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  profiles:
    default: local

  # Java 25: request handling and @Async work run on virtual threads. The
  # workload is I/O-bound almost end to end -- JDBC through JOOQ plus outbound
  # calls to Keycloak, S3, Gotenberg, Mailgun and Twilio -- so carrier threads
  # are released during every wait instead of a platform thread blocking.
  # JEP 491 (JDK 24) removed synchronized pinning, and this codebase has no
  # synchronized blocks or custom ThreadLocals, so there is nothing to pin.
  # The Hikari pool below still bounds database concurrency.
  threads:
    virtual:
      enabled: true

  datasource:
    username: ${DB_USERNAME:buurman}
    password: ${DB_PASSWORD:buurman}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jooq:
    sql-dialect: postgres

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # Quartz Scheduler Configuration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # Flyway manages schema
    properties:
      org.quartz.scheduler.instanceName: BuurmanScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.threadPool.threadCount: 5

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Keycloak Admin API Configuration
keycloak:
  admin:
    realm: master
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  realm: buurman
  backoffice-realm: buurman-backoffice

# AWS S3 Configuration
aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    region: ${AWS_S3_REGION:eu-west-1}
    bucket-name: ${AWS_S3_BUCKET:buurman-documents}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

# Email Configuration
spring.mail:
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false

# Demo Data Configuration
buurman:
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}
    cron: "23 1 * * * ?"

# Booklet / PDF rendering: all PDFs are rendered by the Gotenberg (headless-Chromium) sidecar.
# Local host-run backend reaches it at localhost:3000; in Docker/Dokploy it is http://gotenberg:3000.
booklet:
  gotenberg:
    url: ${GOTENBERG_URL:http://localhost:3000}
    connect-timeout: ${GOTENBERG_CONNECT_TIMEOUT:5s}
    read-timeout: ${GOTENBERG_READ_TIMEOUT:30s}

# Google Maps Configuration
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

# Application Configuration
app:
  version: @project.version@
  public-url: ${APP_BASE_URL:https://app.local.buurman.io}
  api:
    base-url: ${API_BASE_URL:https://api.local.buurman.io}
  documents:
    max-file-size: 52428800
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/gif
  email:
    from: ${EMAIL_FROM:noreply@buurman.io}
    from-name: ${EMAIL_FROM_NAME:Buurman}
    base-url: ${app.public-url} # Derived from app.public-url — do not override independently
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://app.local.buurman.io}
    backoffice-allowed-origins: ${CORS_BACKOFFICE_ALLOWED_ORIGINS:http://localhost:5174,https://backoffice.local.buurman.io}

# Mailgun Configuration
mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:}
  from-email: ${MAILGUN_FROM_EMAIL:noreply@app.buurman.io}
  from-name: ${MAILGUN_FROM_NAME:Buurman}
  webhook-signing-key: ${MAILGUN_WEBHOOK_SIGNING_KEY:}
  eu-region: ${MAILGUN_EU_REGION:true}

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}

# Documenso Configuration (self-hosted e-signature sidecar; see docker-compose.yml)
documenso:
  base-url: ${DOCUMENSO_BASE_URL:http://localhost:3001}
  api-key: ${DOCUMENSO_API_KEY:}
  webhook-secret: ${DOCUMENSO_WEBHOOK_SECRET:}

# Notification Configuration
notification:
  outbox:
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:500}
    max-retries: ${NOTIFICATION_OUTBOX_MAX_RETRIES:5}
  consolidation:
    enabled: true
    email:
      enabled: true
      min-group-size: 2
      max-items-per-digest: 100
    sms:
      enabled: false
      threshold: 3

# Scheduling Configuration
scheduling:
  notifications:
    outbox-push-cron: "*/30 * * * * ?"
  payment-generation:
    cron: "0 0 * * * ?"
  payment-dunning:
    cron: "0 30 8 * * ?"
  late-fees:
    cron: "0 15 6 * * ?"
  notification-reminders:
    contract-expiry-cron: "0 0 0 * * ?"
    payment-reminder-cron: "0 0 0 * * ?"
    contact-follow-up-cron: "0 0 8 * * ?"
  metrics:
    metrics-push-cron: "0 */15 * * * ?"
  thumbnail-backfill:
    cron: "0 */5 * * * ?"
  cost:
    snapshot-cron: "0 0 6 * * ?"

# Impersonation Configuration
impersonation:
  jwt-secret: ${IMPERSONATION_JWT_SECRET:change-me-in-production-use-at-least-32-chars}
  max-timeout: 60m
  default-timeout: 15m
  app-base-url: ${APP_PUBLIC_URL:https://app.local.buurman.io}

# Actuator Configuration
management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
  metrics:
    tags:
      application: buurman
    distribution:
      percentiles-histogram:
        http.server.requests: true
        buurman.s3.operation.seconds: true
        buurman.export.generation.seconds: true
        buurman.notification.send.seconds: true
      percentiles:
        http.server.requests: 0.5,0.75,0.95,0.99
        buurman.s3.operation.seconds: 0.5,0.95,0.99
        buurman.export.generation.seconds: 0.5,0.95,0.99
  prometheus:
    metrics:
      export:
        step: 30s
        descriptions: true
        enabled: true

# Backoffice mission-control dashboard
backoffice:
  dashboard:
    metrics:
      # Prometheus query endpoint. Empty => latency/error-rate/p95 panels show PREVIEW.
      # Cluster-wide aggregation (sum by le) makes this correct on multi-node setups.
      prometheus-url: ${PROMETHEUS_URL:}
      # Label matcher scoping queries to this app across all nodes.
      selector: 'application="buurman"'
      window: 5m
  cost:
    base-currency: EUR
    # Live FX source (frankfurter.app, ECB data, no key) refreshed before each snapshot.
    fx-api-url: ${COST_FX_API_URL:https://api.frankfurter.dev}
    hetzner:
      token: ${HETZNER_BEARER_TOKEN:}
    cloudflare:
      token: ${CLOUDFLARE_API_TOKEN:}
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    # Mailgun plan fee / per-email rate (cost_config) and flat provider amounts like BetterStack
    # (cost_manual_amount) are managed in the DB via the backoffice Costs page — no env/yml seed.
    # Absent config defaults to 0, i.e. unset until an admin enters the figures.

# Server Configuration
server:
  port: 8081
  forward-headers-strategy: framework

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs/openapi
  swagger-ui:
    enabled: true
    path: /api-docs
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    disable-swagger-default-url: true
    urls-primary-name: app
  group-configs:
    - group: app
      paths-to-exclude: /backoffice/**
  