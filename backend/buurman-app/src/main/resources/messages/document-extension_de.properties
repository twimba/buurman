# L\u00e4nderspezifische rechtliche Hinweise
legal.NL=Diese Verl\u00e4ngerung unterliegt dem niederl\u00e4ndischen Mietrecht (huurrecht). Parteien k\u00f6nnen Streitigkeiten an die Huurcommissie (Mietkommission) verweisen.
legal.DE=Diese Verl\u00e4ngerungsvereinbarung wurde gem\u00e4\u00df \u00a7557 BGB (Mietverh\u00f6hungsvereinbarung) getroffen. Die Mietpreisbremse kann Anwendung finden.
legal.FR=Diese Verl\u00e4ngerung unterliegt dem franz\u00f6sischen Mietrecht. Die Bestimmungen des Loi ALUR k\u00f6nnen in regulierten Zonen (zones tendues) gelten. Mietanpassungen unterliegen dem IRL-Index.
legal.BE=Diese Verl\u00e4ngerung unterliegt der regionalen Wohnungsgesetzgebung. Die Mietindexierung basiert auf dem Gezondheidsindex (Gesundheitsindex).
legal.ES=Diese Verl\u00e4ngerung unterliegt dem LAU (Ley de Arrendamientos Urbanos). Die Mindestmietdauerbestimmungen der Art. 9-10 k\u00f6nnen gelten.
legal.PT=Diese Verl\u00e4ngerung unterliegt dem NRAU (Novo Regime do Arrendamento Urbano). Mietaktualisierungen folgen dem INE-Koeffizienten.
legal.AT=Diese Verl\u00e4ngerung unterliegt dem \u00f6sterreichischen Mietrechtsgesetz (MRG). Das Richtwertmietzinssystem kann Anwendung finden.
legal.GB=Diese Verl\u00e4ngerung unterliegt dem Housing Act 1988 (in ge\u00e4nderter Fassung). Die Mitteilungspflichten nach Section 13 k\u00f6nnen f\u00fcr Mieterh\u00f6hungen gelten.
legal.IT=Diese Verl\u00e4ngerung unterliegt dem italienischen Mietrecht (Legge 431/1998). ISTAT FOI-Indexanpassungen k\u00f6nnen gelten.
legal.SE=Diese Verl\u00e4ngerung unterliegt dem Hyreslagen. Mietniveaus folgen dem Bruksv\u00e4rdessystem (Gebrauchswertsystem).
legal.DK=Diese Verl\u00e4ngerung unterliegt dem Lejeloven. Die Mietregulierung h\u00e4ngt vom Geb\u00e4udealter und der Vermietungsart ab.
legal.IE=Diese Verl\u00e4ngerung unterliegt dem Residential Tenancies Act 2004. Rent Pressure Zone (RPZ) Beschr\u00e4nkungen k\u00f6nnen gelten.
legal.PL=Diese Verl\u00e4ngerung unterliegt dem polnischen Zivilgesetzbuch Art. 6851-6852. Schriftliche Mitteilungspflichten gelten f\u00fcr Mieterh\u00f6hungen.
legal.FI=Diese Verl\u00e4ngerung unterliegt dem Gesetz \u00fcber Wohnraummietverh\u00e4ltnisse (481/1995). Mietanpassungen folgen den Vertragsbedingungen.
legal.NO=Diese Verl\u00e4ngerung unterliegt dem Husleieloven. CPI-basierte Mietanpassungen gelten gem\u00e4\u00df \u00a74-2/\u00a74-3.
legal.US=Diese Verl\u00e4ngerung unterliegt dem geltenden bundesstaatlichen und lokalen Mietrecht. Mietpreisregulierungen k\u00f6nnen in bestimmten Rechtsgebieten gelten.
legal.CA=Diese Verl\u00e4ngerung unterliegt der geltenden provinziellen Mietgesetzgebung. J\u00e4hrliche Richtlinienmieterh\u00f6hungen k\u00f6nnen gelten.
legal.HU=Diese Verl\u00e4ngerung unterliegt dem ungarischen B\u00fcrgerlichen Gesetzbuch. Mietanpassungsbedingungen folgen dem Mietvertrag.
legal.CZ=Diese Verl\u00e4ngerung unterliegt dem tschechischen B\u00fcrgerlichen Gesetzbuch \u00a72249. Mieterh\u00f6hungen auf vergleichbare Marktmiete sind auf 20% \u00fcber 3 Jahre begrenzt.
legal.CH=Diese Verl\u00e4ngerung unterliegt dem Schweizer Mietrecht (Obligationenrecht Art. 269-270). Anpassungen sind an den Referenzzinssatz gekoppelt.
