# Landspecifieke juridische referenties
legal.NL=Deze verlenging valt onder het Nederlandse huurrecht. Partijen kunnen geschillen voorleggen aan de Huurcommissie.
legal.DE=Deze verlengingsovereenkomst is opgesteld conform \u00a7557 BGB (Mietverh\u00f6hungsvereinbarung). Toepasselijke huurprijsregulering (Mietpreisbremse) kan van toepassing zijn.
legal.FR=Deze verlenging valt onder het Franse huurrecht. De bepalingen van de Loi ALUR kunnen van toepassing zijn in gereguleerde zones (zones tendues). Huuraanpassingen zijn onderworpen aan de IRL-index.
legal.BE=Deze verlenging valt onder de regionale woningwetgeving. Huurindexatie is gebaseerd op de Gezondheidsindex.
legal.ES=Deze verlenging valt onder de LAU (Ley de Arrendamientos Urbanos). Minimale huurterminbepalingen van Art. 9-10 kunnen van toepassing zijn.
legal.PT=Deze verlenging valt onder de NRAU (Novo Regime do Arrendamento Urbano). Huurupdates volgen de INE-co\u00ebffici\u00ebnt.
legal.AT=Deze verlenging valt onder het Oostenrijkse huurrecht (MRG). Het Richtwertmietzins-systeem kan van toepassing zijn.
legal.GB=Deze verlenging valt onder de Housing Act 1988 (zoals gewijzigd). Section 13-kennisgevingsvereisten kunnen van toepassing zijn voor huurverhogingen.
legal.IT=Deze verlenging valt onder het Italiaanse huurrecht (Legge 431/1998). ISTAT FOI-indexaanpassingen kunnen van toepassing zijn.
legal.SE=Deze verlenging valt onder de Hyreslagen. Huurniveaus volgen het bruksv\u00e4rdessystem (gebruikswaardensysteem).
legal.DK=Deze verlenging valt onder de Lejeloven. Huurregulering hangt af van de leeftijd van het gebouw en het type verhuur.
legal.IE=Deze verlenging valt onder de Residential Tenancies Act 2004. Rent Pressure Zone (RPZ) beperkingen kunnen van toepassing zijn.
legal.PL=Deze verlenging valt onder het Poolse Burgerlijk Wetboek Art. 6851-6852. Schriftelijke kennisgevingsvereisten gelden voor huurverhogingen.
legal.FI=Deze verlenging valt onder de Wet op Residenti\u00eble Huurovereenkomsten (481/1995). Huuraanpassingen volgen de contractvoorwaarden.
legal.NO=Deze verlenging valt onder de Husleieloven. CPI-gebaseerde huuraanpassingen gelden onder \u00a74-2/\u00a74-3.
legal.US=Deze verlenging valt onder toepasselijk staats- en lokaal huurrecht. Huurprijsregulering kan van toepassing zijn in bepaalde rechtsgebieden.
legal.CA=Deze verlenging valt onder toepasselijke provinciale huurwetgeving. Jaarlijkse richtlijnhuurverhogingen kunnen van toepassing zijn.
legal.HU=Deze verlenging valt onder het Hongaarse Burgerlijk Wetboek. Huuraanpassingsvoorwaarden volgen de huurovereenkomst.
legal.CZ=Deze verlenging valt onder het Tsjechische Burgerlijk Wetboek \u00a72249. Huurverhogingen tot vergelijkbare markthuur zijn beperkt tot 20% over 3 jaar.
legal.CH=Deze verlenging valt onder het Zwitserse huurrecht (Obligationenrecht Art. 269-270). Aanpassingen zijn gekoppeld aan de referentierente (Referenzzinssatz).
