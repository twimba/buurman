# =============================================================================
# Docker Profile
# =============================================================================
# All services run inside Docker Compose behind Traefik reverse proxy (HTTPS).
# Service-to-service calls use container hostnames (internal network, HTTP).
# Browser-visible URLs use https://*.local.buurman.io (via Traefik).
#
# Start everything: docker compose up
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/buurman

  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer URI must match the browser-visible URL (embedded in JWT tokens)
          issuer-uri: https://keycloak.local.buurman.io/realms/buurman
          # JWK set URI uses container hostname (backend-to-keycloak internal call)
          jwk-set-uri: http://keycloak:8080/realms/buurman/protocol/openid-connect/certs
          backoffice:
            issuer-uri: https://keycloak.local.buurman.io/realms/buurman-backoffice
            jwk-set-uri: http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/certs
  web:
    error:
      include-message: never

keycloak:
  admin:
    server-url: http://keycloak:8080

aws:
  s3:
    endpoint: http://awrust:4566
    # Browser accesses S3 via Traefik hostname (HTTPS)
    public-endpoint: https://awrust.local.buurman.io
    use-presigned-urls: false

spring.mail:
  host: mailpit

# Gotenberg runs as a sibling container; reach it over the internal network.
booklet:
  gotenberg:
    url: http://gotenberg:3000

# Documenso runs as a sibling container; reach it over the internal network.
documenso:
  base-url: http://documenso:3000
  # Signing links are opened by signers in a browser, never over the internal docker host.
  public-url: ${DOCUMENSO_PUBLIC_URL:${DOCUMENSO_WEBAPP_URL:https://documenso.local.buurman.io}}

app:
  public-url: https://app.local.buurman.io
  api:
    base-url: http://backend:8081
