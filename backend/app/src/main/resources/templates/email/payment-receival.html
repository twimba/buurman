<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Receival</title>
</head>
<body style="font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fafaf9;">
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
        <div th:replace="~{email/_email-base :: header}"></div>
        <div style="background: #ffffff; border: 1px solid #e7e5e4; border-top: none; border-radius: 0 0 8px 8px; padding: 40px;">
            <h1 style="color: #292524; margin: 0 0 24px 0; font-size: 24px;">Payment Receival Registered</h1>

            <p style="color: #292524; line-height: 1.6; margin: 0 0 16px 0;">
                A payment receival has been recorded.
            </p>

            <div style="background: #fafaf9; border: 1px solid #e7e5e4; border-radius: 6px; padding: 20px; margin: 0 0 24px 0;">
                <p style="color: #292524; margin: 0 0 8px 0;"><strong>Property:</strong> <span th:text="${propertyName}">Property Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong>Tenant:</strong> <span th:text="${tenantName}">Tenant Name</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong>Receival Amount:</strong> <span th:text="${receivalAmount}">Amount</span></p>
                <p style="color: #292524; margin: 0 0 8px 0;"><strong>Total Payment:</strong> <span th:text="${amount}">Total</span></p>
                <p style="color: #292524; margin: 0;"><strong>Remaining Balance:</strong> <span th:text="${remainingBalance}">Balance</span></p>
            </div>

            <a th:href="${baseUrl}" style="display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500;">
                View Payment
            </a>
        </div>

        <div th:replace="~{email/_email-base :: footer}"></div>
    </div>
</body>
</html>
