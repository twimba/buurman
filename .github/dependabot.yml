# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
registries:
  ghcr:
    type: docker-registry
    url: https://ghcr.io
    username: ${{ secrets.GHCR_USERNAME }}
    password: ${{ secrets.GHCR_TOKEN }}
  dockerhub:
    type: docker-registry
    url: https://index.docker.io/v1/
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_PASSWORD }}
updates:
  - package-ecosystem: "maven"
    directories:
      - "/backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    groups:
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      jooq:
        patterns:
          - "org.jooq:*"
      flyway:
        patterns:
          - "org.flywaydb:*"
      mapstruct:
        patterns:
          - "org.mapstruct:*"
      itext:
        patterns:
          - "com.itextpdf:*"
      testcontainers:
        patterns:
          - "org.testcontainers:*"
      maven-plugins:
        patterns:
          - "*-maven-plugin"
          - "org.openapitools:*"
          - "io.github.git-commit-id:*"

  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/frontend/packages/ui"
      - "/frontend/app"
      - "/frontend/backoffice"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-is"
          - "@types/react-is"
      react-router:
        patterns:
          - "react-router-dom"
          - "react-router"
      tanstack:
        patterns:
          - "@tanstack/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      floating-ui:
        patterns:
          - "@floating-ui/*"
      keycloak:
        patterns:
          - "keycloak-js"
          - "@react-keycloak/*"
      dompurify:
        patterns:
          - "dompurify"
          - "@types/dompurify"
      lucide:
        patterns:
          - "lucide-react"

  - package-ecosystem: "docker"
    directories:
      - "/frontend/app"
      - "/grafana"
      - "/backend"
      - "/frontend/backoffice"
      - "/prometheus"
      - "/keycloak"
    registries:
      - ghcr
      - dockerhub
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
    registries:
      - ghcr
      - dockerhub
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
