name: Build Images

on:
  workflow_dispatch:
  push:
    tags: [prod]

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build & Publish Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR
        id: jar
        working-directory: backend
        run: |
          mvn clean package -DskipTests -B
          JAR=$(ls target/buurman-backend-*.jar)
          echo "size=$(du -h "$JAR" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        working-directory: backend
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/backend:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/backend:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backend Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/backend\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |
          | **JAR** | \`${{ steps.jar.outputs.name }}\` (${{ steps.jar.outputs.size }}) |

          EOF

  build-frontend:
    name: Build & Publish Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        working-directory: frontend
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/frontend:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/frontend:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Frontend Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/frontend\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  summary:
    name: Build Summary
    needs: [build-backend, build-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build Overview

          | | |
          |---|---|
          | **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Ref** | \`${{ github.ref_name }}\` |
          | **Triggered by** | ${{ github.actor }} via \`${{ github.event_name }}\` |
          | **Backend** | ${{ needs.build-backend.result == 'success' && '✅' || '❌' }} ${{ needs.build-backend.result }} |
          | **Frontend** | ${{ needs.build-frontend.result == 'success' && '✅' || '❌' }} ${{ needs.build-frontend.result }} |

          ### How to pull

          1. Create a [Personal Access Token](https://github.com/settings/tokens) with \`read:packages\` scope
          2. Log in to GHCR:
          \`\`\`bash
          echo "YOUR_PAT" | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin
          \`\`\`
          3. Pull the images:
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/backend:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/frontend:latest
          \`\`\`

          EOF
