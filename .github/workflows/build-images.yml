name: Build & PROD Deploy

on:
  workflow_dispatch:
    inputs:
      build-backend:
        description: "Build Backend"
        type: boolean
        default: true
      build-app:
        description: "Build App"
        type: boolean
        default: true
      build-backoffice:
        description: "Build Backoffice"
        type: boolean
        default: true
      build-keycloak:
        description: "Build Keycloak"
        type: boolean
        default: false
      build-grafana:
        description: "Build Grafana"
        type: boolean
        default: false
      deploy-backend:
        description: "Deploy Backend"
        type: boolean
        default: true
      deploy-app:
        description: "Deploy App"
        type: boolean
        default: true
      deploy-backoffice:
        description: "Deploy Backoffice"
        type: boolean
        default: true
      deploy-keycloak:
        description: "Deploy Keycloak"
        type: boolean
        default: false
      deploy-grafana:
        description: "Deploy Grafana"
        type: boolean
        default: false
  push:
    tags: [prod]

env:
  REGISTRY: ghcr.io
  DOCKER_API_VERSION: "1.44"

jobs:
  build-backend:
    name: Build & Publish Backend
    if: github.event_name != 'workflow_dispatch' || inputs.build-backend != false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Docker API version for Testcontainers
        run: echo 'api.version=1.44' > ~/.docker-java.properties

      - name: Build JAR
        id: jar
        working-directory: backend
        run: |
          mvn clean package -DskipTests -B
          JAR=$(ls target/buurman-backend-*.jar)
          echo "size=$(du -h "$JAR" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        working-directory: backend
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backend Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |
          | **JAR** | \`${{ steps.jar.outputs.name }}\` (${{ steps.jar.outputs.size }}) |

          EOF

  build-app:
    name: Build & Publish App
    if: github.event_name != 'workflow_dispatch' || inputs.build-app != false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        working-directory: app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## App Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  build-backoffice:
    name: Build & Publish Backoffice
    if: github.event_name != 'workflow_dispatch' || inputs.build-backoffice != false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        working-directory: backoffice
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backoffice/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backoffice Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  build-keycloak:
    name: Build & Publish Keycloak
    if: github.event_name != 'workflow_dispatch' || inputs.build-keycloak == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=26.5.2
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Keycloak Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  build-grafana:
    name: Build & Publish Grafana
    if: github.event_name != 'workflow_dispatch' || inputs.build-grafana == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=12.3.2
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./grafana
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Grafana Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  deploy:
    name: Deploy to Dokploy
    needs: [build-backend, build-app, build-backoffice, build-keycloak, build-grafana]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend
        if: contains(fromJSON('["success","skipped"]'), needs.build-backend.result) && (inputs.deploy-backend != false || (github.event_name != 'workflow_dispatch'))
        run: curl -sSf -X POST "https://dokploy.buurman.io/api/deploy/-DQP8uFDI8BFmuos34Ied" --max-time 10 || echo "⚠️ Backend deploy webhook failed"

      - name: Deploy App
        if: contains(fromJSON('["success","skipped"]'), needs.build-app.result) && (inputs.deploy-app != false || (github.event_name != 'workflow_dispatch'))
        run: curl -sSf -X POST "https://dokploy.buurman.io/api/deploy/MGAIvuOi9NBTmD3EAAdzW" --max-time 10 || echo "⚠️ App deploy webhook failed"

      - name: Deploy Backoffice
        if: contains(fromJSON('["success","skipped"]'), needs.build-backoffice.result) && (inputs.deploy-backoffice != false || (github.event_name != 'workflow_dispatch'))
        run: curl -sSf -X POST "https://dokploy.buurman.io/api/deploy/D_uQNdmaTZS8yURK7dcf5" --max-time 10 || echo "⚠️ Backoffice deploy webhook failed"

      - name: Deploy Keycloak
        if: contains(fromJSON('["success","skipped"]'), needs.build-keycloak.result) && inputs.deploy-keycloak == true
        run: curl -sSf -X POST "https://dokploy.buurman.io/api/deploy/Jwi7QTE3W-wYtKkqs1HKR" --max-time 10 || echo "⚠️ Keycloak deploy webhook failed"

      - name: Deploy Grafana
        if: contains(fromJSON('["success","skipped"]'), needs.build-grafana.result) && inputs.deploy-grafana == true
        run: curl -sSf -X POST "https://dokploy.buurman.io/api/deploy/sCbejyhnQklHc5JK5Le3b" --max-time 10 || echo "⚠️ Grafana deploy webhook failed"

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy

          | Service | Deployed |
          |---------|----------|
          | Backend | ${{ (inputs.deploy-backend != false || github.event_name != 'workflow_dispatch') && contains(fromJSON('["success","skipped"]'), needs.build-backend.result) && '🚀 Yes' || '⏭️ Skipped' }} |
          | App | ${{ (inputs.deploy-app != false || github.event_name != 'workflow_dispatch') && contains(fromJSON('["success","skipped"]'), needs.build-app.result) && '🚀 Yes' || '⏭️ Skipped' }} |
          | Backoffice | ${{ (inputs.deploy-backoffice != false || github.event_name != 'workflow_dispatch') && contains(fromJSON('["success","skipped"]'), needs.build-backoffice.result) && '🚀 Yes' || '⏭️ Skipped' }} |
          | Keycloak | ${{ inputs.deploy-keycloak == true && needs.build-keycloak.result == 'success' && '🚀 Yes' || '⏭️ Skipped' }} |
          | Grafana | ${{ inputs.deploy-grafana == true && needs.build-grafana.result == 'success' && '🚀 Yes' || '⏭️ Skipped' }} |
          EOF

  summary:
    name: Build & Deploy Summary
    needs: [build-backend, build-app, build-backoffice, build-keycloak, build-grafana, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build Overview

          | | |
          |---|---|
          | **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Ref** | \`${{ github.ref_name }}\` |
          | **Triggered by** | ${{ github.actor }} via \`${{ github.event_name }}\` |
          | **Backend** | ${{ needs.build-backend.result == 'success' && '✅' || needs.build-backend.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-backend.result }} |
          | **App** | ${{ needs.build-app.result == 'success' && '✅' || needs.build-app.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-app.result }} |
          | **Backoffice** | ${{ needs.build-backoffice.result == 'success' && '✅' || needs.build-backoffice.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-backoffice.result }} |
          | **Keycloak** | ${{ needs.build-keycloak.result == 'success' && '✅' || needs.build-keycloak.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-keycloak.result }} |
          | **Grafana** | ${{ needs.build-grafana.result == 'success' && '✅' || needs.build-grafana.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-grafana.result }} |
          | **Deploy** | ${{ needs.deploy.result == 'success' && '🚀' || needs.deploy.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.deploy.result }} |

          ### How to pull

          1. Create a [Personal Access Token](https://github.com/settings/tokens) with \`read:packages\` scope
          2. Log in to GHCR:
          \`\`\`bash
          echo "YOUR_PAT" | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin
          \`\`\`
          3. Pull the images:
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak:latest
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana:latest
          \`\`\`

          EOF
