name: Build & PROD Deploy

on:
  workflow_dispatch:
    inputs:
      build-backend:
        description: "Build Backend"
        type: boolean
        default: true
      build-app:
        description: "Build App"
        type: boolean
        default: true
      build-backoffice:
        description: "Build Backoffice"
        type: boolean
        default: true
      build-keycloak:
        description: "Build Keycloak"
        type: boolean
        default: false
      build-grafana:
        description: "Build Grafana"
        type: boolean
        default: false
      deploy-backend:
        description: "Deploy Backend"
        type: boolean
        default: true
      deploy-app:
        description: "Deploy App"
        type: boolean
        default: true
      deploy-backoffice:
        description: "Deploy Backoffice"
        type: boolean
        default: true
      deploy-keycloak:
        description: "Deploy Keycloak"
        type: boolean
        default: false
      deploy-grafana:
        description: "Deploy Grafana"
        type: boolean
        default: false
  push:
    tags: [prod]

env:
  REGISTRY: ghcr.io
  DOCKER_API_VERSION: "1.44"

jobs:
  build-backend:
    name: Build & Publish Backend
    if: github.event_name != 'workflow_dispatch' || inputs.build-backend != false
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Docker API version for Testcontainers
        run: echo 'api.version=1.44' > ~/.docker-java.properties

      - name: Build JAR
        id: jar
        working-directory: backend
        run: |
          mvn clean package -DskipTests -B
          JAR=$(ls target/buurman-backend-*.jar)
          echo "size=$(du -h "$JAR" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        working-directory: backend
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backend Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |
          | **JAR** | \`${{ steps.jar.outputs.name }}\` (${{ steps.jar.outputs.size }}) |

          EOF

  build-app:
    name: Build & Publish App
    if: github.event_name != 'workflow_dispatch' || inputs.build-app != false
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        working-directory: app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## App Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  build-backoffice:
    name: Build & Publish Backoffice
    if: github.event_name != 'workflow_dispatch' || inputs.build-backoffice != false
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        working-directory: backoffice
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backoffice/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backoffice Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  build-keycloak:
    name: Build & Publish Keycloak
    if: github.event_name != 'workflow_dispatch' || inputs.build-keycloak == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=26.5.2
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Keycloak Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  build-grafana:
    name: Build & Publish Grafana
    if: github.event_name != 'workflow_dispatch' || inputs.build-grafana == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=12.3.2
          SHA=${GITHUB_SHA::7}
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./grafana
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana:latest

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Grafana Image

          | | |
          |---|---|
          | **Status** | ${{ steps.build.outcome == 'success' && '✅ Published' || '❌ Failed' }} |
          | **Image** | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana\` |
          | **Tag** | \`${{ steps.version.outputs.tag }}\` |
          | **Digest** | \`${{ steps.build.outputs.digest }}\` |

          EOF

  deploy:
    name: Deploy to Dokploy
    needs: [build-backend, build-app, build-backoffice, build-keycloak, build-grafana]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DOKPLOY_API: https://dokploy.buurman.io/api
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/buurman
    steps:
      - name: Deploy Backend
        if: needs.build-backend.result == 'success' && (inputs.deploy-backend != false || github.event_name != 'workflow_dispatch')
        env:
          APP_ID: "-DQP8uFDI8BFmuos34Ied"
          IMAGE: ghcr.io/${{ github.repository_owner }}/buurman/backend:${{ needs.build-backend.outputs.tag }}
        run: |
          curl -sSf -X POST "$DOKPLOY_API/application.update" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE\"}" --max-time 10
          curl -sSf -X POST "$DOKPLOY_API/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}" --max-time 10
          echo "Deployed backend → $IMAGE"

      - name: Deploy App
        if: needs.build-app.result == 'success' && (inputs.deploy-app != false || github.event_name != 'workflow_dispatch')
        env:
          APP_ID: "MGAIvuOi9NBTmD3EAAdzW"
          IMAGE: ghcr.io/${{ github.repository_owner }}/buurman/app:${{ needs.build-app.outputs.tag }}
        run: |
          curl -sSf -X POST "$DOKPLOY_API/application.update" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE\"}" --max-time 10
          curl -sSf -X POST "$DOKPLOY_API/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}" --max-time 10
          echo "Deployed app → $IMAGE"

      - name: Deploy Backoffice
        if: needs.build-backoffice.result == 'success' && (inputs.deploy-backoffice != false || github.event_name != 'workflow_dispatch')
        env:
          APP_ID: "D_uQNdmaTZS8yURK7dcf5"
          IMAGE: ghcr.io/${{ github.repository_owner }}/buurman/backoffice:${{ needs.build-backoffice.outputs.tag }}
        run: |
          curl -sSf -X POST "$DOKPLOY_API/application.update" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE\"}" --max-time 10
          curl -sSf -X POST "$DOKPLOY_API/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}" --max-time 10
          echo "Deployed backoffice → $IMAGE"

      - name: Deploy Keycloak
        if: needs.build-keycloak.result == 'success' && inputs.deploy-keycloak == true
        env:
          APP_ID: "Jwi7QTE3W-wYtKkqs1HKR"
          IMAGE: ghcr.io/${{ github.repository_owner }}/buurman/keycloak:${{ needs.build-keycloak.outputs.tag }}
        run: |
          curl -sSf -X POST "$DOKPLOY_API/application.update" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE\"}" --max-time 10
          curl -sSf -X POST "$DOKPLOY_API/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}" --max-time 10
          echo "Deployed keycloak → $IMAGE"

      - name: Deploy Grafana
        if: needs.build-grafana.result == 'success' && inputs.deploy-grafana == true
        env:
          APP_ID: "sCbejyhnQklHc5JK5Le3b"
          IMAGE: ghcr.io/${{ github.repository_owner }}/buurman/grafana:${{ needs.build-grafana.outputs.tag }}
        run: |
          curl -sSf -X POST "$DOKPLOY_API/application.update" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\",\"dockerImage\":\"$IMAGE\"}" --max-time 10
          curl -sSf -X POST "$DOKPLOY_API/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}" --max-time 10
          echo "Deployed grafana → $IMAGE"

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy

          | Service | Tag | Status |
          |---------|-----|--------|
          | Backend | \`${{ needs.build-backend.outputs.tag || '—' }}\` | ${{ needs.build-backend.result == 'success' && (inputs.deploy-backend != false || github.event_name != 'workflow_dispatch') && '🚀 Deployed' || '⏭️ Skipped' }} |
          | App | \`${{ needs.build-app.outputs.tag || '—' }}\` | ${{ needs.build-app.result == 'success' && (inputs.deploy-app != false || github.event_name != 'workflow_dispatch') && '🚀 Deployed' || '⏭️ Skipped' }} |
          | Backoffice | \`${{ needs.build-backoffice.outputs.tag || '—' }}\` | ${{ needs.build-backoffice.result == 'success' && (inputs.deploy-backoffice != false || github.event_name != 'workflow_dispatch') && '🚀 Deployed' || '⏭️ Skipped' }} |
          | Keycloak | \`${{ needs.build-keycloak.outputs.tag || '—' }}\` | ${{ inputs.deploy-keycloak == true && needs.build-keycloak.result == 'success' && '🚀 Deployed' || '⏭️ Skipped' }} |
          | Grafana | \`${{ needs.build-grafana.outputs.tag || '—' }}\` | ${{ inputs.deploy-grafana == true && needs.build-grafana.result == 'success' && '🚀 Deployed' || '⏭️ Skipped' }} |
          EOF

  summary:
    name: Build & Deploy Summary
    needs: [build-backend, build-app, build-backoffice, build-keycloak, build-grafana, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]] || [[ -z "$BEFORE" ]]; then
            LOG=$(git log --oneline -20)
            RANGE="Last 20 commits"
          else
            LOG=$(git log --oneline "${BEFORE}..HEAD")
            RANGE="${BEFORE::7}..${GITHUB_SHA::7}"
          fi
          {
            echo "log<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
            echo "range=$RANGE"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build Overview

          | | |
          |---|---|
          | **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Ref** | \`${{ github.ref_name }}\` |
          | **Triggered by** | ${{ github.actor }} via \`${{ github.event_name }}\` |
          | **Backend** | ${{ needs.build-backend.result == 'success' && '✅' || needs.build-backend.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-backend.result }} |
          | **App** | ${{ needs.build-app.result == 'success' && '✅' || needs.build-app.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-app.result }} |
          | **Backoffice** | ${{ needs.build-backoffice.result == 'success' && '✅' || needs.build-backoffice.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-backoffice.result }} |
          | **Keycloak** | ${{ needs.build-keycloak.result == 'success' && '✅' || needs.build-keycloak.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-keycloak.result }} |
          | **Grafana** | ${{ needs.build-grafana.result == 'success' && '✅' || needs.build-grafana.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.build-grafana.result }} |
          | **Deploy** | ${{ needs.deploy.result == 'success' && '🚀' || needs.deploy.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.deploy.result }} |

          ### Changes (${{ steps.changelog.outputs.range }})

          \`\`\`
          ${{ steps.changelog.outputs.log }}
          \`\`\`

          ### How to pull

          1. Create a [Personal Access Token](https://github.com/settings/tokens) with \`read:packages\` scope
          2. Log in to GHCR:
          \`\`\`bash
          echo "YOUR_PAT" | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin
          \`\`\`
          3. Pull the images:
          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backend:${{ needs.build-backend.outputs.tag || 'latest' }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/app:${{ needs.build-app.outputs.tag || 'latest' }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/backoffice:${{ needs.build-backoffice.outputs.tag || 'latest' }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/keycloak:${{ needs.build-keycloak.outputs.tag || 'latest' }}
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/buurman/grafana:${{ needs.build-grafana.outputs.tag || 'latest' }}
          \`\`\`

          EOF
