name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

env:
  DOCKER_API_VERSION: "1.44"

jobs:
  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests with coverage
        working-directory: backend
        run: |
          mvn verify -pl common,buurman,buurman-notifications,buurman-booklets,coverage-report \
            -am -Pquick -B -Dmaven.build.cache.enabled=false

      - name: Generate coverage summary
        if: always()
        working-directory: backend
        run: |
          echo "## Backend Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Instructions | Branches | Lines | Methods |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------|----------|-------|---------|" >> "$GITHUB_STEP_SUMMARY"

          TOTAL_INST_MISSED=0
          TOTAL_INST_COVERED=0
          TOTAL_BRANCH_MISSED=0
          TOTAL_BRANCH_COVERED=0
          TOTAL_LINE_MISSED=0
          TOTAL_LINE_COVERED=0
          TOTAL_METHOD_MISSED=0
          TOTAL_METHOD_COVERED=0

          for MODULE in common buurman buurman-notifications buurman-booklets; do
            CSV="${MODULE}/target/site/jacoco/jacoco.csv"
            if [ -f "$CSV" ]; then
              # Sum all rows (skip header)
              INST_MISSED=0; INST_COVERED=0
              BRANCH_MISSED=0; BRANCH_COVERED=0
              LINE_MISSED=0; LINE_COVERED=0
              METHOD_MISSED=0; METHOD_COVERED=0

              while IFS=',' read -r GROUP PACKAGE CLASS INST_M INST_C BRANCH_M BRANCH_C LINE_M LINE_C COMPL_M COMPL_C METHOD_M METHOD_C; do
                INST_MISSED=$((INST_MISSED + INST_M))
                INST_COVERED=$((INST_COVERED + INST_C))
                BRANCH_MISSED=$((BRANCH_MISSED + BRANCH_M))
                BRANCH_COVERED=$((BRANCH_COVERED + BRANCH_C))
                LINE_MISSED=$((LINE_MISSED + LINE_M))
                LINE_COVERED=$((LINE_COVERED + LINE_C))
                METHOD_MISSED=$((METHOD_MISSED + METHOD_M))
                METHOD_COVERED=$((METHOD_COVERED + METHOD_C))
              done < <(tail -n +2 "$CSV")

              TOTAL_INST_MISSED=$((TOTAL_INST_MISSED + INST_MISSED))
              TOTAL_INST_COVERED=$((TOTAL_INST_COVERED + INST_COVERED))
              TOTAL_BRANCH_MISSED=$((TOTAL_BRANCH_MISSED + BRANCH_MISSED))
              TOTAL_BRANCH_COVERED=$((TOTAL_BRANCH_COVERED + BRANCH_COVERED))
              TOTAL_LINE_MISSED=$((TOTAL_LINE_MISSED + LINE_MISSED))
              TOTAL_LINE_COVERED=$((TOTAL_LINE_COVERED + LINE_COVERED))
              TOTAL_METHOD_MISSED=$((TOTAL_METHOD_MISSED + METHOD_MISSED))
              TOTAL_METHOD_COVERED=$((TOTAL_METHOD_COVERED + METHOD_COVERED))

              calc_pct() {
                local missed=$1 covered=$2
                local total=$((missed + covered))
                if [ "$total" -eq 0 ]; then echo "N/A"; else echo "$((covered * 100 / total))%"; fi
              }

              INST_PCT=$(calc_pct $INST_MISSED $INST_COVERED)
              BRANCH_PCT=$(calc_pct $BRANCH_MISSED $BRANCH_COVERED)
              LINE_PCT=$(calc_pct $LINE_MISSED $LINE_COVERED)
              METHOD_PCT=$(calc_pct $METHOD_MISSED $METHOD_COVERED)

              echo "| \`${MODULE}\` | ${INST_PCT} | ${BRANCH_PCT} | ${LINE_PCT} | ${METHOD_PCT} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`${MODULE}\` | — | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Aggregated totals from coverage-report module
          AGG_CSV="coverage-report/target/site/jacoco-aggregate/jacoco.csv"
          if [ -f "$AGG_CSV" ]; then
            AGG_INST_MISSED=0; AGG_INST_COVERED=0
            AGG_BRANCH_MISSED=0; AGG_BRANCH_COVERED=0
            AGG_LINE_MISSED=0; AGG_LINE_COVERED=0
            AGG_METHOD_MISSED=0; AGG_METHOD_COVERED=0

            while IFS=',' read -r GROUP PACKAGE CLASS INST_M INST_C BRANCH_M BRANCH_C LINE_M LINE_C COMPL_M COMPL_C METHOD_M METHOD_C; do
              AGG_INST_MISSED=$((AGG_INST_MISSED + INST_M))
              AGG_INST_COVERED=$((AGG_INST_COVERED + INST_C))
              AGG_BRANCH_MISSED=$((AGG_BRANCH_MISSED + BRANCH_M))
              AGG_BRANCH_COVERED=$((AGG_BRANCH_COVERED + BRANCH_C))
              AGG_LINE_MISSED=$((AGG_LINE_MISSED + LINE_M))
              AGG_LINE_COVERED=$((AGG_LINE_COVERED + LINE_C))
              AGG_METHOD_MISSED=$((AGG_METHOD_MISSED + METHOD_M))
              AGG_METHOD_COVERED=$((AGG_METHOD_COVERED + METHOD_C))
            done < <(tail -n +2 "$AGG_CSV")

            calc_pct() {
              local missed=$1 covered=$2
              local total=$((missed + covered))
              if [ "$total" -eq 0 ]; then echo "N/A"; else echo "$((covered * 100 / total))%"; fi
            }

            AGG_INST_PCT=$(calc_pct $AGG_INST_MISSED $AGG_INST_COVERED)
            AGG_BRANCH_PCT=$(calc_pct $AGG_BRANCH_MISSED $AGG_BRANCH_COVERED)
            AGG_LINE_PCT=$(calc_pct $AGG_LINE_MISSED $AGG_LINE_COVERED)
            AGG_METHOD_PCT=$(calc_pct $AGG_METHOD_MISSED $AGG_METHOD_COVERED)

            echo "| **Total** | **${AGG_INST_PCT}** | **${AGG_BRANCH_PCT}** | **${AGG_LINE_PCT}** | **${AGG_METHOD_PCT}** |" >> "$GITHUB_STEP_SUMMARY"
          fi
