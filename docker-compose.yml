version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: buurman-postgres
    environment:
      POSTGRES_DB: buurman
      POSTGRES_USER: buurman
      POSTGRES_PASSWORD: buurman_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buurman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buurman-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.5
    container_name: buurman-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: buurman
      KC_DB_PASSWORD: buurman_dev
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buurman-network

  localstack:
    image: localstack/localstack:latest
    container_name: buurman-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: eu-west-1
      DATA_DIR: /tmp/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
      - localstack_data:/tmp/localstack
    networks:
      - buurman-network

volumes:
  postgres_data:
  localstack_data:

networks:
  buurman-network:
    driver: bridge
