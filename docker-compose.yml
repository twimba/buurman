services:
  traefik:
    image: traefik:v3.7.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.postgres.address=:5432"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME:-buurman}_buurman-network"
      - "--providers.docker.constraints=Label(`buurman.workspace`,`${COMPOSE_PROJECT_NAME:-buurman}`)"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accesslog"
      - "--metrics.prometheus.entryPoint=websecure"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PG_HOST_PORT:-5432}:5432"  # PostgreSQL TCP passthrough
      - "${TRAEFIK_DASHBOARD_PORT:-8082}:8080"  # Traefik dashboard API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.rule=Host(`${HOSTNAME_PREFIX:-}traefik.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.service=api@internal"
    networks:
      - buurman-network

  postgres:
    image: postgres:18.3-alpine3.23
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.tcp.routers.${HOSTNAME_PREFIX:-}postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.${HOSTNAME_PREFIX:-}postgres.entrypoints=postgres"
      - "traefik.tcp.services.${HOSTNAME_PREFIX:-}postgres.loadbalancer.server.port=5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-buurman}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buurman-network

  keycloak:
    build:
      context: ./keycloak
    image: buurman-keycloak:26.5.4
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_KEYCLOAK_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${DB_KEYCLOAK_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: start-dev --import-realm --metrics-enabled=true --health-enabled=true
    volumes:
      - ./keycloak/buurman-realm.json:/opt/keycloak/data/import/buurman-realm.json
      - ./keycloak/buurman-backoffice-realm.json:/opt/keycloak/data/import/buurman-backoffice-realm.json
      - ./keycloak/themes:/opt/keycloak/themes
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.rule=Host(`${HOSTNAME_PREFIX:-}keycloak.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.middlewares=${HOSTNAME_PREFIX:-}keycloak-headers"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}keycloak.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}keycloak-headers.headers.customResponseHeaders.Content-Security-Policy=frame-src 'self'; frame-ancestors 'self' https://*.local.buurman.io https://*.local.buurman.io:* https://*.buurman.io; object-src 'none'"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}keycloak-headers.headers.customResponseHeaders.X-Frame-Options="
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buurman-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.22
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
      - seaweedfs-data:/data
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      # S3 API (used by backend + browser for public file URLs)
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-s3.rule=Host(`${HOSTNAME_PREFIX:-}seaweedfs.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-s3.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-s3.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-s3.service=${HOSTNAME_PREFIX:-}seaweedfs-s3"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-s3.middlewares=${HOSTNAME_PREFIX:-}seaweedfs-cors"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}seaweedfs-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=${APP_BASE_URL:-https://app.local.buurman.io}"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}seaweedfs-s3.loadbalancer.server.port=8333"
      # Filer UI (file browser, embedded in backoffice)
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-filer.rule=Host(`${HOSTNAME_PREFIX:-}seaweedfs-ui.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-filer.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-filer.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}seaweedfs-filer.service=${HOSTNAME_PREFIX:-}seaweedfs-filer"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}seaweedfs-filer.loadbalancer.server.port=8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buurman-network

  seaweedfs-init:
    image: amazon/aws-cli:2.34.45
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-s3.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION:-eu-west-1}
    volumes:
      - ./docker/seaweedfs/init-s3.sh:/init-s3.sh:ro
    networks:
      - buurman-network

  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - "${SMTP_HOST_PORT:-1025}:1025"  # SMTP — direct port mapping (no Traefik)
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}mailpit.rule=Host(`${HOSTNAME_PREFIX:-}mailpit.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}mailpit.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}mailpit.tls=true"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}mailpit.loadbalancer.server.port=8025"
    networks:
      - buurman-network

  prometheus:
    build:
      context: ./prometheus
    image: prom/prometheus:v3.11.3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # host.docker.internal works for both make dev (backend on host) and make up (backend
      # in Docker with port 8081 exposed). Prod overrides via Dokploy env vars.
      BACKEND_METRICS_TARGET: ${BACKEND_METRICS_TARGET:-host.docker.internal:8081}
      POSTGRES_EXPORTER_TARGET: ${POSTGRES_EXPORTER_TARGET:-postgres-exporter:9187}
      HETZNER_BEARER_TOKEN: ${HETZNER_BEARER_TOKEN:-}
    volumes:
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}prometheus.rule=Host(`${HOSTNAME_PREFIX:-}prometheus.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}prometheus.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}prometheus.tls=true"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-buurman}:${DB_PASSWORD:-buurman}@postgres:5432/buurman?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - buurman-network

  grafana:
    build:
      context: ./grafana
    image: grafana/grafana:13.0.1
    environment:
      # --- Server ---
      GF_SERVER_ROOT_URL: "https://${HOSTNAME_PREFIX:-}grafana.local.buurman.io"
      PROMETHEUS_URL: http://prometheus:9090
      # --- Theme & Embedding ---
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors https://${HOSTNAME_PREFIX:-}backoffice.local.buurman.io;"
      # --- Keycloak OAuth (buurman-backoffice realm) ---
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_CLIENT_SECRET:-grafana-secret}"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://${HOSTNAME_PREFIX:-}keycloak.local.buurman.io/realms/buurman-backoffice/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile roles"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'BACKOFFICE_ADMIN') && 'GrafanaAdmin' || contains(roles[*], 'MONITORING_ACCESS') && 'Editor' || 'None'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "https://${HOSTNAME_PREFIX:-}keycloak.local.buurman.io/realms/buurman-backoffice/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2F${HOSTNAME_PREFIX:-}grafana.local.buurman.io%2Flogin&client_id=grafana"
      # --- SSO-only login (no built-in login form) ---
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.rule=Host(`${HOSTNAME_PREFIX:-}grafana.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.middlewares=${HOSTNAME_PREFIX:-}grafana-cors"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=https://${HOSTNAME_PREFIX:-}backoffice.local.buurman.io"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Methods=GET, OPTIONS"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Headers=Content-Type, Accept"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}grafana.loadbalancer.server.port=3000"
    depends_on:
      prometheus:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - buurman-network


  # --------------------------------------------------------------------------
  # Application services — included by default with `docker compose up -d`
  # For local dev, exclude these with `make dev` and run on the host instead.
  # Traefik routes to host via docker/traefik/dynamic/local-dev.yml (priority 10)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    user: "0:991"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
      - "${BACKEND_MGMT_HOST_PORT:-8082}:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.rule=Host(`${HOSTNAME_PREFIX:-}api.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.priority=100"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.rule=Host(`${HOSTNAME_PREFIX:-}app.local.buurman.io`) && PathPrefix(`/calendar/`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.priority=200"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.service=${HOSTNAME_PREFIX:-}backend"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}backend.loadbalancer.server.port=8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - buurman-network

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        TARGET_APP: app
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-buurman}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-buurman-web}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}app.rule=Host(`${HOSTNAME_PREFIX:-}app.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}app.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}app.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}app.priority=100"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}app.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  backoffice:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        TARGET_APP: backoffice
        VITE_BACKOFFICE_KEYCLOAK_URL: ${VITE_BACKOFFICE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_BACKOFFICE_KEYCLOAK_REALM: ${VITE_BACKOFFICE_KEYCLOAK_REALM:-buurman-backoffice}
        VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID: ${VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID:-buurman-backoffice-web}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    environment:
      VITE_BACKOFFICE_KEYCLOAK_URL: ${VITE_BACKOFFICE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
      VITE_BACKOFFICE_KEYCLOAK_REALM: ${VITE_BACKOFFICE_KEYCLOAK_REALM:-buurman-backoffice}
      VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID: ${VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID:-buurman-backoffice-web}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backoffice.rule=Host(`${HOSTNAME_PREFIX:-}backoffice.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backoffice.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backoffice.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backoffice.priority=100"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}backoffice.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

volumes:
  postgres_data:
  seaweedfs-data:
  prometheus_data:
  grafana_data:

networks:
  buurman-network:
    driver: bridge
