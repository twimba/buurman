services:
  traefik:
    image: traefik:v3.6.10
    container_name: buurman-traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "5432:5432"  # PostgreSQL TCP passthrough
      - "8082:8080"  # Traefik dashboard API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.local.buurman.io`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
    networks:
      - buurman-network

  postgres:
    image: postgres:18.3-alpine3.23
    container_name: buurman-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.postgres.entrypoints=postgres"
      - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-buurman}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buurman-network

  keycloak:
    build:
      context: ./keycloak
    image: buurman-keycloak:26.5.4
    container_name: buurman-keycloak
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_KEYCLOAK_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${DB_KEYCLOAK_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: start-dev --import-realm --metrics-enabled=true --health-enabled=true
    volumes:
      - ./keycloak/buurman-realm.json:/opt/keycloak/data/import/buurman-realm.json
      - ./keycloak/buurman-backoffice-realm.json:/opt/keycloak/data/import/buurman-backoffice-realm.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.local.buurman.io`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.middlewares=keycloak-headers"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.keycloak-headers.headers.customResponseHeaders.Content-Security-Policy=frame-src 'self'; frame-ancestors 'self' https://*.local.buurman.io https://*.buurman.io; object-src 'none'"
      - "traefik.http.middlewares.keycloak-headers.headers.customResponseHeaders.X-Frame-Options="
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buurman-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.15
    container_name: buurman-seaweedfs
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
      - seaweedfs-data:/data
    labels:
      - "traefik.enable=true"
      # S3 API (used by backend + browser for public file URLs)
      - "traefik.http.routers.seaweedfs-s3.rule=Host(`seaweedfs.local.buurman.io`)"
      - "traefik.http.routers.seaweedfs-s3.entrypoints=websecure"
      - "traefik.http.routers.seaweedfs-s3.tls=true"
      - "traefik.http.routers.seaweedfs-s3.service=seaweedfs-s3"
      - "traefik.http.routers.seaweedfs-s3.middlewares=seaweedfs-cors"
      - "traefik.http.middlewares.seaweedfs-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=https://app.local.buurman.io"
      - "traefik.http.services.seaweedfs-s3.loadbalancer.server.port=8333"
      # Filer UI (file browser, embedded in backoffice)
      - "traefik.http.routers.seaweedfs-filer.rule=Host(`seaweedfs-ui.local.buurman.io`)"
      - "traefik.http.routers.seaweedfs-filer.entrypoints=websecure"
      - "traefik.http.routers.seaweedfs-filer.tls=true"
      - "traefik.http.routers.seaweedfs-filer.service=seaweedfs-filer"
      - "traefik.http.services.seaweedfs-filer.loadbalancer.server.port=8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buurman-network

  seaweedfs-init:
    image: amazon/aws-cli:2.34.2
    container_name: buurman-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-s3.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION:-eu-west-1}
    volumes:
      - ./docker/seaweedfs/init-s3.sh:/init-s3.sh:ro
    networks:
      - buurman-network

  flagsmith:
    image: flagsmith/flagsmith:2.220.0
    container_name: buurman-flagsmith
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_FLAGSMITH_USERNAME:-flagsmith}:${DB_FLAGSMITH_PASSWORD:-flagsmith}@postgres:5432/flagsmith
      DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY:-change-me-in-production}
      TASK_RUN_METHOD: TASK_PROCESSOR
      PROMETHEUS_ENABLED: "true"
      USE_POSTGRES_FOR_ANALYTICS: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: app.settings.dev_local
      ALLOW_REGISTRATION_WITHOUT_INVITE: "true"
    volumes:
      - ./docker/flagsmith/dev_settings.py:/app/app/settings/dev_local.py:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flagsmith.rule=Host(`flagsmith.local.buurman.io`)"
      - "traefik.http.routers.flagsmith.entrypoints=websecure"
      - "traefik.http.routers.flagsmith.tls=true"
      - "traefik.http.routers.flagsmith.middlewares=flagsmith-headers"
      - "traefik.http.services.flagsmith.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.flagsmith-headers.headers.customResponseHeaders.Content-Security-Policy=frame-src 'self'; frame-ancestors 'self' https://*.local.buurman.io https://*.buurman.io; object-src 'none'"
      - "traefik.http.middlewares.flagsmith-headers.headers.customResponseHeaders.X-Frame-Options="
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - buurman-network

  flagsmith-processor:
    image: flagsmith/flagsmith:2.220.0
    container_name: buurman-flagsmith-processor
    command: run-task-processor
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_FLAGSMITH_USERNAME:-flagsmith}:${DB_FLAGSMITH_PASSWORD:-flagsmith}@postgres:5432/flagsmith
      DJANGO_SECRET_KEY: ${FLAGSMITH_SECRET_KEY:-change-me-in-production}
    depends_on:
      flagsmith:
        condition: service_healthy
    networks:
      - buurman-network

  flagsmith-setup:
    image: python:3-alpine
    container_name: buurman-flagsmith-setup
    entrypoint: ["python3", "/setup.py"]
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000
      FLAGSMITH_ADMIN_EMAIL: ${FLAGSMITH_ADMIN_EMAIL:-buurmy@buurman.io}
      FLAGSMITH_ADMIN_PASSWORD: ${FLAGSMITH_ADMIN_PASSWORD:-buurmy}
    volumes:
      - ./docker/flagsmith/setup.sh:/setup.py:ro
      - ./backend/src/main/java/com/buurman/util/FeatureFlags.java:/FeatureFlags.java:ro
    depends_on:
      flagsmith:
        condition: service_healthy
    restart: "no"
    networks:
      - buurman-network

  mailpit:
    image: axllent/mailpit:v1.29.2
    container_name: buurman-mailpit
    ports:
      - "1025:1025"  # SMTP — direct port mapping (no Traefik)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.local.buurman.io`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - buurman-network

  prometheus:
    build:
      context: ./prometheus
    image: prom/prometheus:v3.10.0
    container_name: buurman-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # host.docker.internal works for both make dev (backend on host) and make up (backend
      # in Docker with port 8081 exposed). Prod overrides via Dokploy env vars.
      BACKEND_METRICS_TARGET: ${BACKEND_METRICS_TARGET:-host.docker.internal:8081}
      POSTGRES_EXPORTER_TARGET: ${POSTGRES_EXPORTER_TARGET:-postgres-exporter:9187}
      HETZNER_BEARER_TOKEN: ${HETZNER_BEARER_TOKEN:-}
    volumes:
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.local.buurman.io`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: buurman-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-buurman}:${DB_PASSWORD:-buurman}@postgres:5432/buurman?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - buurman-network

  grafana:
    build:
      context: ./grafana
    image: grafana/grafana:12.4.0
    container_name: buurman-grafana
    environment:
      # --- Server ---
      GF_SERVER_ROOT_URL: "https://grafana.local.buurman.io"
      PROMETHEUS_URL: http://prometheus:9090
      # --- Theme & Embedding ---
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors https://backoffice.local.buurman.io;"
      # --- Keycloak OAuth (buurman-backoffice realm) ---
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_CLIENT_SECRET:-grafana-secret}"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://keycloak.local.buurman.io/realms/buurman-backoffice/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile roles"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'BACKOFFICE_ADMIN') && 'GrafanaAdmin' || contains(roles[*], 'MONITORING_ACCESS') && 'Editor' || 'None'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "https://keycloak.local.buurman.io/realms/buurman-backoffice/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.local.buurman.io%2Flogin&client_id=grafana"
      # --- SSO-only login (no built-in login form) ---
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.local.buurman.io`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=grafana-cors"
      - "traefik.http.middlewares.grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=https://backoffice.local.buurman.io"
      - "traefik.http.middlewares.grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Methods=GET, OPTIONS"
      - "traefik.http.middlewares.grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Headers=Content-Type, Accept"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      prometheus:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - buurman-network


  # --------------------------------------------------------------------------
  # Application services — included by default with `docker compose up -d`
  # For local dev, exclude these with `make dev` and run on the host instead.
  # Traefik routes to host via docker/traefik/dynamic/local-dev.yml (priority 10)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: buurman-backend
    user: "0:991"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.local.buurman.io`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.routers.backend-calendar.rule=Host(`app.local.buurman.io`) && PathPrefix(`/calendar/`)"
      - "traefik.http.routers.backend-calendar.entrypoints=websecure"
      - "traefik.http.routers.backend-calendar.tls=true"
      - "traefik.http.routers.backend-calendar.priority=200"
      - "traefik.http.routers.backend-calendar.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
      flagsmith-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - buurman-network

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-buurman}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-buurman-web}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    container_name: buurman-app
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.local.buurman.io`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.priority=100"
      - "traefik.http.services.app.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  backoffice:
    build:
      context: .
      dockerfile: backoffice/Dockerfile
      args:
        VITE_BACKOFFICE_KEYCLOAK_URL: ${VITE_BACKOFFICE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_BACKOFFICE_KEYCLOAK_REALM: ${VITE_BACKOFFICE_KEYCLOAK_REALM:-buurman-backoffice}
        VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID: ${VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID:-buurman-backoffice-web}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    container_name: buurman-backoffice
    environment:
      VITE_BACKOFFICE_KEYCLOAK_URL: ${VITE_BACKOFFICE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
      VITE_BACKOFFICE_KEYCLOAK_REALM: ${VITE_BACKOFFICE_KEYCLOAK_REALM:-buurman-backoffice}
      VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID: ${VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID:-buurman-backoffice-web}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.local.buurman.io`)"
      - "traefik.http.routers.backoffice.entrypoints=websecure"
      - "traefik.http.routers.backoffice.tls=true"
      - "traefik.http.routers.backoffice.priority=100"
      - "traefik.http.services.backoffice.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

volumes:
  postgres_data:
  seaweedfs-data:
  prometheus_data:
  grafana_data:

networks:
  buurman-network:
    driver: bridge
