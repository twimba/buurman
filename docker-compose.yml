services:
  traefik:
    image: traefik:v3.6.7
    container_name: buurman-traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "5432:5432"  # PostgreSQL TCP passthrough
      - "8082:8080"  # Traefik dashboard API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.local.buurman.io`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
    networks:
      - buurman-network

  postgres:
    image: postgres:18.1-alpine3.23
    container_name: buurman-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.postgres.entrypoints=postgres"
      - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-buurman}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buurman-network

  keycloak:
    image: keycloak/keycloak:26.5.2
    container_name: buurman-keycloak
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_KEYCLOAK_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${DB_KEYCLOAK_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: start-dev --import-realm --metrics-enabled=true --health-enabled=true
    volumes:
      - ./docker/keycloak/buurman-realm.json:/opt/keycloak/data/import/buurman-realm.json
      - ./docker/keycloak/buurman-backoffice-realm.json:/opt/keycloak/data/import/buurman-backoffice-realm.json
      - ./docker/keycloak/themes:/opt/keycloak/themes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.local.buurman.io`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.middlewares=keycloak-headers"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.keycloak-headers.headers.customResponseHeaders.Content-Security-Policy=frame-src 'self'; frame-ancestors 'self' https://*.local.buurman.io https://*.buurman.io; object-src 'none'"
      - "traefik.http.middlewares.keycloak-headers.headers.customResponseHeaders.X-Frame-Options="
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buurman-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: buurman-seaweedfs
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
      - seaweedfs-data:/data
    labels:
      - "traefik.enable=true"
      # S3 API (used by backend + browser for public file URLs)
      - "traefik.http.routers.seaweedfs-s3.rule=Host(`seaweedfs.local.buurman.io`)"
      - "traefik.http.routers.seaweedfs-s3.entrypoints=websecure"
      - "traefik.http.routers.seaweedfs-s3.tls=true"
      - "traefik.http.routers.seaweedfs-s3.service=seaweedfs-s3"
      - "traefik.http.routers.seaweedfs-s3.middlewares=seaweedfs-cors"
      - "traefik.http.middlewares.seaweedfs-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=https://app.local.buurman.io"
      - "traefik.http.services.seaweedfs-s3.loadbalancer.server.port=8333"
      # Filer UI (file browser, embedded in backoffice)
      - "traefik.http.routers.seaweedfs-filer.rule=Host(`seaweedfs-ui.local.buurman.io`)"
      - "traefik.http.routers.seaweedfs-filer.entrypoints=websecure"
      - "traefik.http.routers.seaweedfs-filer.tls=true"
      - "traefik.http.routers.seaweedfs-filer.service=seaweedfs-filer"
      - "traefik.http.services.seaweedfs-filer.loadbalancer.server.port=8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buurman-network

  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: buurman-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-s3.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION:-eu-west-1}
    volumes:
      - ./docker/seaweedfs/init-s3.sh:/init-s3.sh:ro
    networks:
      - buurman-network

  mailpit:
    image: axllent/mailpit:v1.29.0
    container_name: buurman-mailpit
    ports:
      - "1025:1025"  # SMTP — direct port mapping (no Traefik)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.local.buurman.io`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - buurman-network

  # --------------------------------------------------------------------------
  # Application services — included by default with `docker compose up -d`
  # For local dev, exclude these with `make dev` and run on the host instead.
  # Traefik routes to host via docker/traefik/dynamic/local-dev.yml (priority 10)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: buurman-backend
    user: "0:991"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.local.buurman.io`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - buurman-network

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-buurman}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-buurman-web}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: buurman-app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.local.buurman.io`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.priority=100"
      - "traefik.http.services.app.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  backoffice:
    build:
      context: .
      dockerfile: backoffice/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_KEYCLOAK_REALM: ${VITE_BACKOFFICE_KEYCLOAK_REALM:-buurman-backoffice}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_BACKOFFICE_KEYCLOAK_CLIENT_ID:-buurman-backoffice-web}
    container_name: buurman-backoffice
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.local.buurman.io`)"
      - "traefik.http.routers.backoffice.entrypoints=websecure"
      - "traefik.http.routers.backoffice.tls=true"
      - "traefik.http.routers.backoffice.priority=100"
      - "traefik.http.services.backoffice.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: buurman-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.local.buurman.io`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.0
    container_name: buurman-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-buurman}:${DB_PASSWORD:-buurman}@postgres:5432/buurman?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - buurman-network

  grafana:
    image: grafana/grafana:12.3.2
    container_name: buurman-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors https://backoffice.local.buurman.io;"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.local.buurman.io`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=grafana-cors"
      - "traefik.http.middlewares.grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=https://backoffice.local.buurman.io"
      - "traefik.http.middlewares.grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Methods=GET, OPTIONS"
      - "traefik.http.middlewares.grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Headers=Content-Type, Accept"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - buurman-network

volumes:
  postgres_data:
  seaweedfs-data:
  prometheus_data:
  grafana_data:

networks:
  buurman-network:
    driver: bridge
