services:
  traefik:
    image: traefik:v3.7.13
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.postgres.address=:5432"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME:-buurman}_buurman-network"
      - "--providers.docker.constraints=Label(`buurman.workspace`,`${COMPOSE_PROJECT_NAME:-buurman}`)"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accesslog"
      - "--metrics.prometheus.entryPoint=websecure"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PG_HOST_PORT:-5432}:5432"  # PostgreSQL TCP passthrough
      - "${TRAEFIK_DASHBOARD_PORT:-8082}:8080"  # Traefik dashboard API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.rule=Host(`${HOSTNAME_PREFIX:-}traefik.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}traefik.service=api@internal"
    networks:
      - buurman-network

  postgres:
    image: postgres:18.6-alpine3.23
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.tcp.routers.${HOSTNAME_PREFIX:-}postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.${HOSTNAME_PREFIX:-}postgres.entrypoints=postgres"
      - "traefik.tcp.services.${HOSTNAME_PREFIX:-}postgres.loadbalancer.server.port=5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-buurman}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buurman-network

  keycloak:
    build:
      context: ./keycloak
    image: buurman-keycloak:26.5.4
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_KEYCLOAK_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${DB_KEYCLOAK_PASSWORD:-keycloak}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: start-dev --import-realm --metrics-enabled=true --health-enabled=true
    volumes:
      - ./keycloak/buurman-realm.json:/opt/keycloak/data/import/buurman-realm.json
      - ./keycloak/buurman-backoffice-realm.json:/opt/keycloak/data/import/buurman-backoffice-realm.json
      - ./keycloak/themes:/opt/keycloak/themes
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.rule=Host(`${HOSTNAME_PREFIX:-}keycloak.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}keycloak.middlewares=${HOSTNAME_PREFIX:-}keycloak-headers"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}keycloak.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}keycloak-headers.headers.customResponseHeaders.Content-Security-Policy=frame-src 'self'; frame-ancestors 'self' https://*.local.buurman.io https://*.local.buurman.io:* https://*.buurman.io; object-src 'none'"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}keycloak-headers.headers.customResponseHeaders.X-Frame-Options="
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buurman-network

  awrust:
    image: ghcr.io/awrust/awrust:1.0.0
    environment:
      AWRUST_SERVICES: s3
      AWRUST_S3_STORE: fs
      AWRUST_S3_DATA_DIR: /data
    volumes:
      - ./docker/awrust/init:/etc/awrust/init/ready.d:ro
      - awrust-data:/data
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      # S3 API (used by backend + browser for public file URLs)
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}awrust-s3.rule=Host(`${HOSTNAME_PREFIX:-}awrust.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}awrust-s3.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}awrust-s3.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}awrust-s3.service=${HOSTNAME_PREFIX:-}awrust-s3"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}awrust-s3.middlewares=${HOSTNAME_PREFIX:-}awrust-cors"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}awrust-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=${APP_BASE_URL:-https://app.local.buurman.io}"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}awrust-s3.loadbalancer.server.port=4566"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4566/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - buurman-network

  gotenberg:
    build:
      context: ./docker/gotenberg
    image: buurman-gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=60s"
    # Chromium is the sole PDF engine and is memory-hungry; cap it and auto-restart on crash/OOM.
    restart: unless-stopped
    mem_limit: 1g
    ports:
      # Host port so a host-run backend (`make dev`) can reach it at http://localhost:3000.
      # Containerised backend (`make up`) and prod reach it as http://gotenberg:3000.
      - "${GOTENBERG_HOST_PORT:-3000}:3000"
    labels:
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  mailpit:
    image: axllent/mailpit:v1.31.3
    env_file: .env
    ports:
      - "${SMTP_HOST_PORT:-1025}:1025"  # SMTP — direct port mapping (no Traefik)
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}mailpit.rule=Host(`${HOSTNAME_PREFIX:-}mailpit.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}mailpit.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}mailpit.tls=true"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}mailpit.loadbalancer.server.port=8025"
    networks:
      - buurman-network

  documenso:
    image: documenso/documenso:v2.19.0
    depends_on:
      postgres:
        condition: service_healthy
    # Documenso POSTs its webhooks at host.docker.internal:8081 in the `local` profile (backend on
    # the host). Docker Desktop resolves that name implicitly; Linux Docker Engine does not — same
    # reason `prometheus` below carries this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3000
      - NEXTAUTH_SECRET=${DOCUMENSO_NEXTAUTH_SECRET:-dev-nextauth-secret-not-for-production}
      - NEXT_PRIVATE_ENCRYPTION_KEY=${DOCUMENSO_ENCRYPTION_KEY:-dev-encryption-key-32-chars-long}
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:-dev-secondary-key-is-32-chars-ok}
      - NEXT_PUBLIC_WEBAPP_URL=${DOCUMENSO_WEBAPP_URL:-https://documenso.local.buurman.io}
      # Documenso's background-job system POSTs to itself (NEXT_PRIVATE_INTERNAL_WEBAPP_URL,
      # defaulting to NEXT_PUBLIC_WEBAPP_URL) to actually run a job — including sending every
      # signing-request/reminder email. The *.local.buurman.io hostnames only resolve via the
      # host's dnsmasq, not from inside this container, so left at the default the self-call
      # fails outright (silently — see jobs/client/local.js's submitJobToEndpoint, which has no
      # error handling) and these emails are never sent. Loop back to the container's own port
      # instead; the public URL above is unaffected (still used for links inside the ones that
      # do send, and the browser-facing app).
      - NEXT_PRIVATE_INTERNAL_WEBAPP_URL=http://localhost:3000
      # Documenso's own outgoing-webhook delivery refuses any URL that resolves to a private/
      # loopback address (SSRF guard — see server-only/webhooks/assert-webhook-url.js), and
      # host.docker.internal resolves to a Docker-internal private IP, so our own webhook
      # (seeded pointing at the host-run backend, see docker/documenso/seed.sql) would otherwise
      # be silently rejected before the request is even sent. "backend" covers the containerized
      # backend under `make up`.
      - NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS=host.docker.internal,backend
      - NEXT_PRIVATE_DATABASE_URL=postgres://${DB_DOCUMENSO_USERNAME:-documenso}:${DB_DOCUMENSO_PASSWORD:-documenso}@postgres:5432/documenso
      # Prisma's schema requires a separate "direct" (non-pooled) connection for migrations; we
      # have no pooler in front of Postgres here, so it's the same URL as NEXT_PRIVATE_DATABASE_URL.
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgres://${DB_DOCUMENSO_USERNAME:-documenso}:${DB_DOCUMENSO_PASSWORD:-documenso}@postgres:5432/documenso
      - NEXT_PRIVATE_SMTP_TRANSPORT=smtp-auth
      - NEXT_PRIVATE_SMTP_HOST=mailpit
      - NEXT_PRIVATE_SMTP_PORT=1025
      - NEXT_PRIVATE_SMTP_FROM_NAME=Buurman Signing (Dev)
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=signing@local.buurman.io
      - NEXT_PRIVATE_SIGNING_TRANSPORT=local
      - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=/opt/documenso/cert.p12
      - NEXT_PRIVATE_SIGNING_PASSPHRASE=buurman-dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./docker/documenso/cert.p12:/opt/documenso/cert.p12:ro
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}documenso.rule=Host(`${HOSTNAME_PREFIX:-}documenso.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}documenso.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}documenso.tls=true"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}documenso.loadbalancer.server.port=3000"
    networks:
      - buurman-network

  # One-shot: seeds a fixed dev user/org/team/API-token into Documenso's schema once its own
  # `prisma migrate deploy` (run by the documenso service itself) has created the tables — see
  # docker/documenso/seed.sql. Exits after running; `make up`/`make dev` end up with a working
  # DOCUMENSO_API_KEY with no interactive signup step.
  documenso-seed:
    image: postgres:18.6-alpine3.23
    depends_on:
      documenso:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_DOCUMENSO_PASSWORD:-documenso}
    volumes:
      - ./docker/documenso/seed.sql:/seed.sql:ro
    entrypoint:
      - psql
      - -v
      - ON_ERROR_STOP=1
      # The webhook seed.sql registers targets the host-run backend (the `local`/`make dev`
      # profile) at its workspace-specific port — see scripts/setup-workspace.sh, which writes
      # BACKEND_HOST_PORT into the generated .env this reads.
      - -v
      - backend_webhook_port=${BACKEND_HOST_PORT:-8081}
      - -v
      - webhook_secret=${DOCUMENSO_WEBHOOK_SECRET:-buurman-dev-webhook-secret-insecure}
      - -h
      - postgres
      - -U
      - ${DB_DOCUMENSO_USERNAME:-documenso}
      - -d
      - documenso
      - -f
      - /seed.sql
    labels:
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
    networks:
      - buurman-network

  prometheus:
    build:
      context: ./prometheus
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # host.docker.internal works for both make dev (backend on host) and make up (backend
      # in Docker with port 8081 exposed). Prod overrides via Dokploy env vars.
      BACKEND_METRICS_TARGET: ${BACKEND_METRICS_TARGET:-host.docker.internal:8082}
      POSTGRES_EXPORTER_TARGET: ${POSTGRES_EXPORTER_TARGET:-postgres-exporter:9187}
      HETZNER_BEARER_TOKEN: ${HETZNER_BEARER_TOKEN:-}
    volumes:
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}prometheus.rule=Host(`${HOSTNAME_PREFIX:-}prometheus.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}prometheus.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}prometheus.tls=true"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - buurman-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-buurman}:${DB_PASSWORD:-buurman}@postgres:5432/buurman?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - buurman-network

  grafana:
    build:
      context: ./grafana
    image: grafana/grafana:13.2.2
    env_file: .env
    environment:
      # --- Server ---
      GF_SERVER_ROOT_URL: "https://${HOSTNAME_PREFIX:-}grafana.local.buurman.io:${HTTPS_PORT:-443}"
      PROMETHEUS_URL: http://prometheus:9090
      # --- Theme & Embedding ---
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors https://${HOSTNAME_PREFIX:-}backoffice.local.buurman.io;"
      # --- Keycloak OAuth (buurman-backoffice realm) ---
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_CLIENT_SECRET:-grafana-secret}"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://${HOSTNAME_PREFIX:-}keycloak.local.buurman.io:${HTTPS_PORT:-443}/realms/buurman-backoffice/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/buurman-backoffice/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile roles"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'BACKOFFICE_ADMIN') && 'GrafanaAdmin' || contains(roles[*], 'MONITORING_ACCESS') && 'Editor' || 'None'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "https://${HOSTNAME_PREFIX:-}keycloak.local.buurman.io/realms/buurman-backoffice/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2F${HOSTNAME_PREFIX:-}grafana.local.buurman.io:${HTTPS_PORT:-443}%2Flogin&client_id=grafana"
      # --- SSO-only login (no built-in login form) ---
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.rule=Host(`${HOSTNAME_PREFIX:-}grafana.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}grafana.middlewares=${HOSTNAME_PREFIX:-}grafana-cors"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Origin=https://${HOSTNAME_PREFIX:-}backoffice.local.buurman.io"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Methods=GET, OPTIONS"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}grafana-cors.headers.customResponseHeaders.Access-Control-Allow-Headers=Content-Type, Accept"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}grafana.loadbalancer.server.port=3000"
    depends_on:
      prometheus:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - buurman-network

  # --------------------------------------------------------------------------
  # Application services — included by default with `docker compose up -d`
  # For local dev, exclude these with `make dev` and run on the host instead.
  # Traefik routes to host via docker/traefik/dynamic/local-dev.yml (priority 10)
  # --------------------------------------------------------------------------
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    user: "0:991"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Cluster-wide dashboard metrics (error rate / p95 / latency heatmap).
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
      - "${BACKEND_MGMT_HOST_PORT:-8082}:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "buurman.workspace=${COMPOSE_PROJECT_NAME:-buurman}"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.rule=Host(`${HOSTNAME_PREFIX:-}api.local.buurman.io`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.priority=100"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend.middlewares=${HOSTNAME_PREFIX:-}backend-upload-buffer"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}backend-upload-buffer.buffering.maxRequestBodyBytes=52428800"
      - "traefik.http.middlewares.${HOSTNAME_PREFIX:-}backend-upload-buffer.buffering.memRequestBodyBytes=10485760"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.rule=Host(`${HOSTNAME_PREFIX:-}app.local.buurman.io`) && PathPrefix(`/calendar/`)"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.entrypoints=websecure"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.tls=true"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.priority=200"
      - "traefik.http.routers.${HOSTNAME_PREFIX:-}backend-calendar.service=${HOSTNAME_PREFIX:-}backend"
      - "traefik.http.services.${HOSTNAME_PREFIX:-}backend.loadbalancer.server.port=8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      awrust:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - buurman-network

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        TARGET_APP: app
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://keycloak.local.buurman.io}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-buurman}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-buurman-web}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    environment:
