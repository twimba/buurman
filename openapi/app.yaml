      type: object
      properties:
        globalEmailEnabled:
          type: boolean
        globalSmsEnabled:
          type: boolean
        smsAvailable:
          type: boolean
        emailAvailable:
          type: boolean
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
      required:
        - emailAvailable
        - globalEmailEnabled
        - globalSmsEnabled
        - preferences
        - smsAvailable
