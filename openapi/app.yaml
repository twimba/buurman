  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: Paginated list of all team notifications (Admin only)
      operationId: getNotifications
      parameters:
        - name: type
          in: query
          description: Filter by notification type
          required: false
          schema:
            type: string
            description: Type of notification event that triggers delivery
            enum:
              - WELCOME
              - VERIFICATION_CODE
              - PHONE_VERIFICATION_CODE
              - TEAM_INVITATION
              - INVITATION_ACCEPTED
              - PASSWORD_CHANGED
              - PAYMENT_REMINDER
              - CONTRACT_EXPIRY
              - PROPERTY_CREATED
              - CONTRACT_CREATED
              - CONTRACT_STATUS_CHANGED
              - CONTRACT_REOPENED
              - CONTRACT_RENT_ADJUSTED
              - PAYMENT_PAID
              - PAYMENT_RECEIVAL
              - EXPENSE_CREATED
        - name: channel
          in: query
          description: Filter by channel
          required: false
          schema:
            type: string
            description: Delivery channel for notifications
            enum:
              - EMAIL
              - SMS
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            description: Delivery status of a notification
            enum:
              - PENDING
              - QUEUED
              - SENT
              - DELIVERED
              - FAILED
              - BOUNCED
              - REJECTED
              - DEMO_BLOCKED
        - name: recipientEmail
          in: query
          description: Filter by recipient email
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          description: Start date filter (inclusive)
          required: false
          schema:
            type: string
          example: "2026-01-01"
        - name: dateTo
          in: query
          description: End date filter (inclusive)
          required: false
          schema:
            type: string
          example: "2026-12-31"
        - name: page
          in: query
          description: Page number (0-based)
          required: false
          schema:
            type: integer
            format: int32
            default: 0
          example: 0
        - name: size
          in: query
          description: Page size
          required: false
