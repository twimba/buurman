        description:
          type: string
        maxRequests:
          type: integer
          format: int32
        periodSeconds:
          type: integer
          format: int32
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
        - displayName
        - enabled
        - key
        - maxRequests
        - periodSeconds
    UpdatePhoneNumberPolicyRequest:
      type: object
      properties:
        policyMatrix:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        maxCodesPerHour:
          type: integer
          format: int32
          maximum: 20
          minimum: 1
        verificationCodeExpiryMinutes:
          type: integer
          format: int32
          maximum: 60
          minimum: 1
      required:
        - maxCodesPerHour
        - policyMatrix
        - verificationCodeExpiryMinutes
