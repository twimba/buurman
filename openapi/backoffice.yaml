        evictionCount:
          type: integer
          format: int64
        lastInvalidatedAt:
          type: string
          format: date-time
          nullable: true
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CacheEntryResponse"
      required:
        - name
        - type
        - description
        - maxSize
        - ttlSeconds
        - refreshPolicy
        - entryCount
        - hitCount
        - missCount
        - hitRate
        - loadCount
        - averageLoadTimeMs
        - evictionCount
        - entries
