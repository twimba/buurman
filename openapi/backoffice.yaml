            - is_owner
            - role
            - email
            - email_verified
            - property_count
            - member_count
            - team_age_days
            - contract_count
            - contact_count
            - photo_count
            - document_count
            - expense_count
            - payment_count
            - calendar_feed_count
            - is_team
            - is_user
        operator:
          type: string
          enum:
