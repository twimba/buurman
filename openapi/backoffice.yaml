      type: object
      properties:
        maxRequests:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        periodSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 10
        enabled:
          type: boolean
      required:
        - enabled
        - maxRequests
        - periodSeconds
