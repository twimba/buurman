        maxCodesPerHour:
          type: integer
          format: int32
        verificationCodeExpiryMinutes:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
        - maxCodesPerHour
        - policyMatrix
        - verificationCodeExpiryMinutes
