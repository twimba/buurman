      security:
        - bearer-jwt: []
    put:
      tags:
        - Backoffice - Teams
      summary: Update team name
      description: Update the name of a team
      operationId: updateTeamName
      parameters:
        - name: identifier
          in: path
          description: Team identifier
          required: true
          schema:
            $ref: "#/components/schemas/TeamIdentifier"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamNameRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackofficeTeamResponse"
        "400":
          description: Bad request - validation error or malformed input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
