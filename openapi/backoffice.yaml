        conditions:
          type: array
          items:
            $ref: "#/components/schemas/SegmentConditionRequest"
    UpdateSegmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
        priority:
          type: integer
          default: 0
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/SegmentConditionRequest"
    SegmentConditionRequest:
      type: object
      required:
