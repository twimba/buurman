openapi: 3.1.0
info:
  title: Buurman Backoffice API
  description: Internal administration API for Buurman platform management
  contact:
    name: Buurman Team
    email: info@buurman.io
  version: 0.1.0
servers:
  - url: http://api.local.buurman.io
    description: Generated server url
security:
  - bearer-jwt: []
tags:
  - name: Backoffice - Teams
    description: Platform-wide team management
  - name: Backoffice - Settings
    description: Platform settings management
  - name: Backoffice - Dashboard
    description: Platform-wide dashboard statistics
  - name: Backoffice - Notifications
    description: Platform-wide notification management
  - name: Backoffice - Scheduler
    description: Job and scheduler management
  - name: Backoffice - System
    description: System information and health checks
  - name: Backoffice - Buurmies
    description: Keycloak user management for buurman realm
  - name: Backoffice - Loggers
    description: Runtime log level management
  - name: Backoffice - Registration Invitations
    description: Manage registration invitation codes
  - name: Backoffice - Users
    description: Platform-wide user management
  - name: Backoffice - Feature Flags
    description: Feature flag management
  - name: Backoffice - Rent Regulations
    description: Rent regulation reference data management
  - name: Backoffice - Impersonation
    description: User impersonation session management
  - name: Backoffice - Broadcasts
    description: Broadcast message management
  - name: Backoffice - Caches
    description: Cache inspection and management
  - name: Backoffice - Segments
    description: Segment management for feature flag targeting
  - name: Backoffice - Rate Limits
    description: Rate limit bucket inspection and management
