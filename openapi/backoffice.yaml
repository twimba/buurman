        type:
          type: string
        description:
          type: string
        maxSize:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          format: int32
        refreshPolicy:
          type: string
        entryCount:
          type: integer
          format: int64
        hitCount:
          type: integer
          format: int64
        missCount:
          type: integer
          format: int64
        hitRate:
          type: number
          format: double
        loadCount:
          type: integer
          format: int64
        averageLoadTimeMs:
          type: number
