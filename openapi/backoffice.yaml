components:
  schemas:
    BroadcastMessageIdentifier:
      type: string
      description: Broadcast message identifier
    ImpersonationSessionIdentifier:
      type: string
      description: Impersonation session identifier
    RejoinImpersonationRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: Admin password for step-up authentication
      required:
        - password
    NotificationIdentifier:
      type: string
      description: Notification identifier
    RegistrationInvitationIdentifier:
      type: string
      description: Registration invitation identifier
    TeamIdentifier:
      type: string
      description: Team identifier
    UserIdentifier:
      type: string
      description: User identifier
    UpdateTeamNameRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
      required:
        - name
    BackofficeTeamResponse:
      type: object
      properties:
        identifier:
          type: string
        teamName:
          type: string
        demo:
          type: boolean
        memberCount:
          type: integer
          format: int64
        propertyCount:
          type: integer
          format: int64
        unitCount:
          type: integer
          format: int64
        ownerEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - demo
        - identifier
        - memberCount
        - propertyCount
        - teamName
        - unitCount
    UpdateRateLimitConfigRequest:
      type: object
      properties:
        maxRequests:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        periodSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 10
        enabled:
          type: boolean
      required:
        - enabled
        - maxRequests
        - periodSeconds
    RateLimitConfigResponse:
      type: object
      properties:
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
        maxRequests:
          type: integer
          format: int32
        periodSeconds:
          type: integer
          format: int32
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
        - displayName
        - enabled
        - key
        - maxRequests
        - periodSeconds
    PhonePolicyMetadataResponse:
      type: object
      properties:
        countryGroups:
          type: array
          items:
            $ref: "#/components/schemas/CountryGroupResponse"
        numberTypes:
          type: array
          items:
            type: string
      required:
        - countryGroups
        - numberTypes
    CountryGroupResponse:
      type: object
      properties:
        groupId:
          type: string
        groupName:
          type: string
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryEntry"
      required:
        - countries
        - groupId
        - groupName
    CountryEntry:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name
    NotificationStatsResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        byStatus:
          type: object
          additionalProperties:
            type: integer
            format: int64
        byChannel:
          type: object
          additionalProperties:
            type: integer
            format: int64
      required:
        - byChannel
        - byStatus
        - total
    FeatureFlagState:
      type: object
      properties:
        enabled:
          type: boolean
        value:
          nullable: true
      required:
        - enabled
    FeatureFlagAdminStatusResponse:
      type: object
      properties:
        adminConfigured:
          type: boolean
        authMethod:
          type: string
      required:
        - adminConfigured
        - authMethod
    CacheInfoResponse:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        maxSize:
          type: integer
          format: int64
        ttlSeconds:
          type: integer
          format: int32
        refreshPolicy:
          type: string
        entryCount:
          type: integer
          format: int64
        hitCount:
          type: integer
          format: int64
        missCount:
          type: integer
          format: int64
        hitRate:
          type: number
          format: double
        loadCount:
          type: integer
          format: int64
        averageLoadTimeMs:
          type: number
          format: double
        evictionCount:
          type: integer
          format: int64
        lastInvalidatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - name
        - type
        - description
        - maxSize
        - ttlSeconds
        - refreshPolicy
        - entryCount
        - hitCount
        - missCount
        - hitRate
        - loadCount
        - averageLoadTimeMs
        - evictionCount
