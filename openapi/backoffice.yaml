components:
  schemas:
    NotificationIdentifier:
      type: string
      description: Notification identifier
    RegistrationInvitationIdentifier:
      type: string
      description: Registration invitation identifier
    TeamIdentifier:
      type: string
      description: Team identifier
    UserIdentifier:
      type: string
      description: User identifier
    UpdateTeamNameRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
      required:
        - name
    BackofficeTeamResponse:
      type: object
      properties:
        identifier:
          type: string
        teamName:
          type: string
        demo:
          type: boolean
        memberCount:
          type: integer
          format: int64
        ownerEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - demo
        - identifier
        - memberCount
        - teamName
    UpdateRateLimitConfigRequest:
      type: object
      properties:
        maxRequests:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        periodSeconds:
          type: integer
          format: int32
          maximum: 86400
          minimum: 10
        enabled:
          type: boolean
      required:
        - enabled
        - maxRequests
        - periodSeconds
    RateLimitConfigResponse:
      type: object
      properties:
        key:
          type: string
        displayName:
          type: string
        description:
          type: string
        maxRequests:
          type: integer
          format: int32
        periodSeconds:
          type: integer
          format: int32
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
        - displayName
        - enabled
        - key
        - maxRequests
        - periodSeconds
    UpdatePhoneNumberPolicyRequest:
      type: object
      properties:
        policyMatrix:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        maxCodesPerHour:
          type: integer
          format: int32
          maximum: 20
          minimum: 1
        verificationCodeExpiryMinutes:
          type: integer
          format: int32
          maximum: 60
          minimum: 1
      required:
        - maxCodesPerHour
        - policyMatrix
        - verificationCodeExpiryMinutes
    BackofficePhoneNumberPolicyResponse:
      type: object
      properties:
        policyMatrix:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        maxCodesPerHour:
          type: integer
          format: int32
        verificationCodeExpiryMinutes:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
        - maxCodesPerHour
        - policyMatrix
        - verificationCodeExpiryMinutes
    UpdateRegistrationInvitationNoteRequest:
      type: object
      properties:
        note:
          type: string
      required:
        - note
    RegistrationInvitationDetailResponse:
      type: object
      properties:
        identifier:
          type: string
        code:
          type: string
        maxUsages:
          type: integer
          format: int32
        usageCount:
          type: integer
          format: int32
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        revokedBy:
          type: string
        revokedAt:
          type: string
          format: date-time
        status:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        note:
          type: string
        usages:
          type: array
          items:
            $ref: "#/components/schemas/UsageRecord"
      required:
        - code
        - createdAt
        - createdBy
        - identifier
        - revoked
        - status
        - usageCount
        - usages
    UsageRecord:
      type: object
      properties:
        userEmail:
          type: string
        userName:
          type: string
        usedAt:
          type: string
          format: date-time
      required:
        - usedAt
        - userEmail
    UpdateFeatureFlagRequest:
      type: object
      properties:
        enabled:
          type: boolean
        value:
          type: string
    FeatureFlagUpdateResponse:
      type: object
      properties:
        flagName:
          type: string
        enabled:
          type: boolean
        value: {}
    RescheduleRequest:
      type: object
      properties:
        cronExpression:
          type: string
    CreateRegistrationInvitationRequest:
      type: object
      properties:
        code:
          type: string
        maxUsages:
