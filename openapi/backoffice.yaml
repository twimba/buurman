  - name: Backoffice - Settings
    description: Platform settings management
  - name: Backoffice - Dashboard
    description: Platform-wide dashboard statistics
  - name: Backoffice - Notifications
    description: Platform-wide notification management
  - name: Backoffice - Scheduler
    description: Job and scheduler management
  - name: Backoffice - System
    description: System information and health checks
  - name: Backoffice - Buurmies
    description: Keycloak user management for buurman realm
  - name: Backoffice - Loggers
    description: Runtime log level management
  - name: Backoffice - Registration Invitations
    description: Manage registration invitation codes
  - name: Backoffice - Users
    description: Platform-wide user management
  - name: Backoffice - Feature Flags
