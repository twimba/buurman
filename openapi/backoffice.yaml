openapi: 3.1.0
info:
  title: Buurman Backoffice API
  description: Internal administration API for Buurman platform management
  contact:
    name: Buurman Team
    email: info@buurman.io
  version: 0.1.0
servers:
  - url: http://api.local.buurman.io
    description: Generated server url
security:
  - bearer-jwt: []
