      type: object
      properties:
        identifier:
          type: string
        teamName:
          type: string
        demo:
          type: boolean
        memberCount:
          type: integer
          format: int64
        ownerEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - demo
        - identifier
        - memberCount
        - teamName
