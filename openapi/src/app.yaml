components:
  schemas:
    AmenityIdentifier:
      type: string
      description: Amenity identifier
    CalendarFeedIdentifier:
      type: string
      description: Calendar feed identifier
    ContractIdentifier:
      type: string
      description: Contract identifier
    ContractPartyIdentifier:
      type: string
      description: Contract party identifier
    ContractPaymentInstructionIdentifier:
      type: string
      description: Contract payment instruction identifier
    ContractRentPeriodIdentifier:
      type: string
      description: Contract rent period identifier
    DataImportIdentifier:
      type: string
      description: Data import identifier
    DocumentIdentifier:
      type: string
      description: Document identifier
    ExpenseIdentifier:
      type: string
      description: Expense identifier
    FinancingPaymentIdentifier:
      type: string
      description: Financing payment identifier
    NotificationIdentifier:
      type: string
      description: Notification identifier
    OccupancyPeriodIdentifier:
      type: string
      description: Occupancy period identifier
    PaymentIdentifier:
      type: string
      description: Payment identifier
    PaymentInstructionIdentifier:
      type: string
      description: Payment instruction identifier
    PaymentReceivalIdentifier:
      type: string
      description: Payment receival identifier
    PhotoIdentifier:
      type: string
      description: Photo identifier
    PropertyFeeIdentifier:
      type: string
      description: Property fee identifier
    PropertyFinancingIdentifier:
      type: string
      description: Property financing identifier
    PropertyIdentifier:
      type: string
      description: Property identifier
    PropertyInsuranceIdentifier:
      type: string
      description: Property insurance identifier
    PropertyOutdoorAreaIdentifier:
      type: string
      description: Property outdoor area identifier
    PropertyTaxIdentifier:
      type: string
      description: Property tax identifier
    PropertyValuationIdentifier:
      type: string
      description: Property valuation identifier
    TeamIdentifier:
      type: string
      description: Team identifier
    ContactAddressIdentifier:
      type: string
      description: Contact address identifier
    ContactIdentifier:
      type: string
      description: Contact identifier
    ContactNoteIdentifier:
      type: string
      description: Contact note identifier
    ContactRelationshipIdentifier:
      type: string
      description: Contact relationship identifier
    UserIdentifier:
      type: string
      description: User identifier
    WwsCalculationIdentifier:
      type: string
      description: WWS calculation identifier
      example: "wws_01JGRM5N7GWRR8PQZRVP8T4M1H"
    NotificationTypePreferenceRequestEntry:
      type: object
      properties:
        notificationType:
          type: string
        emailEnabled:
          type: boolean
        smsEnabled:
          type: boolean
      required:
        - emailEnabled
        - notificationType
        - smsEnabled
    NotificationTypePreferenceResponseEntry:
      type: object
      description: Notification-type preference as returned by the API (includes display label)
      properties:
        notificationType:
          type: string
        displayName:
          type: string
        emailEnabled:
          type: boolean
        smsEnabled:
          type: boolean
      required:
        - displayName
        - emailEnabled
        - notificationType
        - smsEnabled
    UpdateNotificationTypePreferencesRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTypePreferenceRequestEntry"
      required:
        - preferences
    NotificationTypePreferencesResponse:
      type: object
      properties:
        globalEmailEnabled:
          type: boolean
        globalSmsEnabled:
          type: boolean
        smsAvailable:
          type: boolean
        smsFeatureEnabled:
          type: boolean
        emailAvailable:
          type: boolean
        phoneVerified:
          type: boolean
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTypePreferenceResponseEntry"
      required:
        - emailAvailable
        - globalEmailEnabled
        - globalSmsEnabled
        - phoneVerified
        - preferences
        - smsAvailable
        - smsFeatureEnabled
    UpdateUserProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          minLength: 1
        lastName:
          type: string
          maxLength: 100
          minLength: 1
        phone:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
      required:
        - firstName
        - lastName
    UserProfileResponse:
      type: object
      description: Authenticated user profile with contact and verification details
      properties:
        identifier:
          type: string
          description: Unique user identifier
          example: usr_01HZQX7V8B3K5M2N4P6R9T0W
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        phoneVerified:
          type: boolean
      required:
        - email
        - firstName
        - identifier
        - lastName
        - phoneVerified
    SetDefaultTeamRequest:
      type: object
      properties:
        teamIdentifier:
          type: string
      required:
        - teamIdentifier
    UserTeamResponse:
      type: object
      properties:
        identifier:
          type: string
        teamName:
          type: string
        role:
          type: string
        isOwner:
          type: boolean
        isDefault:
          type: boolean
        isActive:
          type: boolean
        memberCount:
          type: integer
          format: int32
        joinedAt:
          type: string
          format: date-time
      required:
        - identifier
        - isActive
        - isDefault
        - isOwner
        - joinedAt
        - memberCount
        - role
        - teamName
    UpdateContactAddressRequest:
      type: object
      properties:
        street:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        postalCode:
          type: string
        countryCode:
          type: string
          minLength: 1
        addressType:
          type: string
          description: Purpose or classification of the contact address
          enum:
            - CURRENT
            - MAILING
            - RELATIVE
            - WORK
            - HISTORIC
        status:
          type: string
          description: Whether the address is currently in use
          enum:
            - ACTIVE
            - INACTIVE
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        geocodeAccuracy:
          type: string
      required:
        - addressType
        - city
        - countryCode
        - status
        - street
    ContactAddressResponse:
      type: object
      properties:
        identifier:
          type: string
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
        addressType:
          type: string
          description: Purpose or classification of the contact address
          enum:
            - CURRENT
            - MAILING
            - RELATIVE
            - WORK
            - HISTORIC
        status:
          type: string
          description: Whether the address is currently in use
          enum:
            - ACTIVE
            - INACTIVE
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        geocodeAccuracy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - addressType
        - city
        - countryCode
        - createdAt
        - identifier
        - postalCode
        - status
        - street
    UpdateContactRequest:
      type: object
      required:
        - contactType
      properties:
        contactType:
          $ref: '#/components/schemas/ContactType'
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
        taxNumber:
          type: string
        idNumber:
          type: string
        additionalInfo:
          type: string
        companyName:
          type: string
        tradeName:
          type: string
        industry:
          type: string
        invoiceEmail:
          type: string
        paymentRemindersEnabled:
          type: boolean
          description: Consent to receive tenant-facing payment reminder emails (off by default)
        website:
          type: string
        dateOfBirth:
          type: string
          format: date
        idExpiryDate:
          type: string
          format: date
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactTag'
    PropertySummary:
      type: object
      properties:
        identifier:
          type: string
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        propertyCategory:
          type: string
          description: High-level property classification
          enum:
            - RESIDENTIAL
            - COMMERCIAL
            - INDUSTRIAL
            - AGRICULTURAL
            - MIXED_USE
        propertyType:
          type: string
          description: Specific property type within a category
          enum:
            - APARTMENT
            - HOUSE
            - STUDIO
            - ROOM
            - VILLA
            - TOWNHOUSE
            - OTHER_RESIDENTIAL
            - OFFICE
            - RETAIL
            - RESTAURANT
            - HOTEL
            - SHOWROOM
            - AUTO_DEALERSHIP
            - SNACKBAR
            - CAFE
            - MOTEL
            - BAR
            - BED_AND_BREAKFAST
            - OTHER_COMMERCIAL
            - WAREHOUSE
            - WORKSHOP
            - FACTORY
            - DATA_CENTER
            - COLD_STORAGE
            - GARAGE
            - OTHER_INDUSTRIAL
            - FARMLAND
            - RANCH
            - GREENHOUSE
            - ORCHARD
            - VINEYARD
            - OTHER_AGRICULTURAL
            - MIXED_USE
            - COMMERCIAL
        status:
          type: string
          description: Current occupancy or availability status of the property
          enum:
            - VACANT
            - OCCUPIED
            - SELF_OCCUPIED
            - MAINTENANCE
            - UNAVAILABLE
            - UNDER_RENOVATION
            - FALLOW
            - LISTED
      required:
        - city
        - identifier
        - postalCode
        - propertyCategory
        - propertyType
        - status
        - street
    BalanceStatus:
      type: string
      description: Balance status indicator for a contact
      enum:
        - NONE
        - ALL_PAID
        - PENDING
        - OVERDUE
    ContactBalanceSummary:
      type: object
      description: Outstanding payment balance summary for a contact
      properties:
        outstandingAmount:
          type: number
          description: Total outstanding amount in major currency units
        currency:
          type: string
          description: ISO 4217 currency code
          example: EUR
        status:
          $ref: '#/components/schemas/BalanceStatus'
        outstandingPaymentCount:
          type: integer
          format: int32
          description: Number of outstanding payments
        guaranteedAmount:
          type: number
          description: Total amount this contact guarantees (as GUARANTOR on contracts)
        guaranteedPaymentCount:
          type: integer
          format: int32
          description: Number of payments this contact guarantees
      required:
        - currency
        - outstandingAmount
        - outstandingPaymentCount
        - status
    ContactPropertyAssignment:
      type: object
      properties:
        property:
          $ref: "#/components/schemas/PropertySummary"
        role:
          type: string
      required:
        - property
    ContactListItemResponse:
      type: object
      description: Lightweight contact summary for list views with active contract count
      properties:
        identifier:
          type: string
          description: Unique contact identifier
          example: cnt_01HZQX7V8B3K5M2N4P6R9T0W
        contactType:
          $ref: '#/components/schemas/ContactType'
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        companyName:
          type: string
        mainPhotoThumbnailUrl:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactTag'
        activeContractCount:
          type: integer
          format: int32
          description: Number of active contracts this contact is party to
        balanceSummary:
          $ref: '#/components/schemas/ContactBalanceSummary'
        dataRetentionStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - activeContractCount
        - contactType
        - createdAt
        - displayName
        - identifier
    ContactResponse:
      type: object
      description: Contact details including contact information and active property assignments
      properties:
        identifier:
          type: string
          description: Unique contact identifier
          example: cnt_01HZQX7V8B3K5M2N4P6R9T0W
        contactType:
          $ref: '#/components/schemas/ContactType'
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        taxNumber:
          type: string
        idNumber:
          type: string
        additionalInfo:
          type: string
        companyName:
          type: string
        tradeName:
          type: string
        industry:
          type: string
        invoiceEmail:
          type: string
        paymentRemindersEnabled:
          type: boolean
          description: Consent to receive tenant-facing payment reminder emails (off by default)
          format: email
        website:
          type: string
        dateOfBirth:
          type: string
          format: date
        idExpiryDate:
          type: string
          format: date
        notes:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactTag'
        dataRetentionStatus:
          $ref: '#/components/schemas/DataRetentionStatus'
        mainPhotoUrl:
          type: string
        mainPhotoThumbnailUrl:
          type: string
        activeProperties:
          type: array
          items:
            $ref: "#/components/schemas/ContactPropertyAssignment"
        balanceSummary:
          $ref: '#/components/schemas/ContactBalanceSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - activeProperties
        - contactType
        - createdAt
        - dataRetentionStatus
        - displayName
        - identifier
    PhotoResponse:
      type: object
      properties:
        identifier:
          type: string
        entityType:
          type: string
        entityIdentifier:
          type: string
        fileKey:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        mimeType:
          type: string
        title:
          type: string
        notes:
          type: string
        isMainPhoto:
          type: boolean
        uploadedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
        thumbnailUrl:
          type: string
      required:
        - entityIdentifier
        - entityType
        - fileKey
        - fileName
        - fileSize
        - identifier
        - isMainPhoto
        - mimeType
        - uploadedAt
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 2
      required:
        - name
    TeamResponse:
      type: object
      description: Team summary with member count
      properties:
        identifier:
          type: string
          description: Unique team identifier
          example: team_01HZQX7V8B3K5M2N4P6R9T0W
        teamName:
          type: string
        memberCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
      required:
        - createdAt
        - identifier
        - memberCount
        - teamName
    PaymentSettings:
      type: object
      properties:
        paymentsAheadCount:
          type: integer
          format: int32
          maximum: 12
          minimum: 1
        autoGenerationEnabled:
          type: boolean
      required:
        - autoGenerationEnabled
        - paymentsAheadCount
    RegionalSettings:
      type: object
      properties:
        defaultCurrency:
          type: string
          maxLength: 3
          minLength: 3
        defaultCountry:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 50
        dateFormat:
          type: string
          maxLength: 20
        fiscalYearStartMonth:
          type: string
          maxLength: 2
          minLength: 2
        defaultLanguage:
          type: string
          description: Default language for the team
          enum:
            - en
            - nl
            - pt
            - es
            - fr
            - de
            - it
            - sv
            - fi
            - el
            - pl
            - da
            - nb
    UpdateTeamSettingsRequest:
      type: object
      properties:
        payments:
          $ref: "#/components/schemas/PaymentSettings"
        regional:
          $ref: "#/components/schemas/RegionalSettings"
    TeamPreferencesResponse:
      type: object
      properties:
        payments:
          $ref: "#/components/schemas/PaymentSettings"
        regional:
          $ref: "#/components/schemas/RegionalSettings"
      required:
        - payments
        - regional
    UpdateMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
          description: Role assigned to a team member determining access level
          enum:
            - TEAM_ADMIN
            - TEAM_EDITOR
            - TEAM_VIEWER
      required:
        - role
    TeamMemberResponse:
      type: object
      properties:
        userIdentifier:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        isOwner:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        isCurrentUser:
          type: boolean
      required:
        - email
        - isCurrentUser
        - isOwner
        - joinedAt
        - name
        - role
        - userIdentifier
    PropertyOutdoorAreaRequest:
      type: object
      properties:
        type:
          type: string
          minLength: 1
        areaValue:
          type: number
        areaUnit:
          type: string
      required:
        - type
    PropertyOutdoorAreaResponse:
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
        areaValue:
          type: number
        areaUnit:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - identifier
        - type
    UpdateOccupancyPeriodRequest:
      type: object
      properties:
        startDate:
          type: string
          format: date
        type:
          type: string
          description: Nature of the self-occupancy period
          enum:
            - PERSONAL
            - FAMILY
            - BUSINESS
        endDate:
          type: string
          format: date
        occupantName:
          type: string
          maxLength: 255
        monthlyImputedRent:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 500
    OccupancyPeriodResponse:
      type: object
      properties:
        identifier:
          type: string
        propertyIdentifier:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        type:
          type: string
          description: Nature of the self-occupancy period
          enum:
            - PERSONAL
            - FAMILY
            - BUSINESS
        occupantName:
          type: string
        monthlyImputedRent:
          type: number
        endReason:
          type: string
          description: Reason for ending the self-occupancy period
          enum:
            - CONVERTING_TO_RENTAL
            - SELLING
            - RENOVATION
            - OTHER
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - createdAt
        - identifier
        - propertyIdentifier
        - startDate
        - type
    UpdatePropertyValuationRequest:
      type: object
      properties:
        valuationType:
          type: string
          description: Method or source of the property valuation
          enum:
            - MARKET
            - APPRAISAL
            - TAX_ASSESSED
            - PURCHASE
            - INSURANCE
            - USER_ESTIMATE
        valuationDate:
          type: string
          format: date
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
        source:
          type: string
        notes:
          type: string
    PropertyValuationResponse:
      type: object
      properties:
        identifier:
          type: string
        valuationType:
          type: string
          description: Method or source of the property valuation
          enum:
            - MARKET
            - APPRAISAL
            - TAX_ASSESSED
            - PURCHASE
            - INSURANCE
            - USER_ESTIMATE
        valuationDate:
          type: string
          format: date
        amount:
          type: number
        currency:
          type: string
        source:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - amount
