  - name: Reference
    description: Technical reference data for integrators and developers
  - name: Property Taxes
    description: Property tax obligations
  - name: Calendar Feeds
    description: iCalendar feed management and serving
  - name: Teams
    description: Team management
  - name: Property Outdoor Areas
    description: Manage outdoor areas for properties
  - name: Properties
    description: Property management
  - name: Property Acquisitions
    description: Property acquisition data (1:1 per property)
  - name: Property Valuations
    description: Property valuation history (time-series)
  - name: Expenses
    description: Property expense tracking and management
  - name: Contract Rent Periods
    description: Rent timeline management for contracts
  - name: Property Insurances
    description: Property insurance policies
  - name: Contacts
    description: Contact management
  - name: Users
    description: User team management
  - name: Property Financings
    description: Financing instruments and payments (mortgages, loans, etc.)
  - name: Reports
    description: Financial reporting and analytics
  - name: Occupancy Periods
    description: Self-occupancy period management
  - name: Notifications
    description: Notification center and management
  - name: Contract Payment Instructions
    description: Per-contract payment instructions with history
  - name: Photos
    description: Photo management endpoints
  - name: Audit Logs
    description: Activity log management
  - name: Portfolio Dashboard
    description: Portfolio-level investment analytics
  - name: Property Dashboard
    description: Property-level investment analytics
  - name: Amenities
    description: Reference amenity data
  - name: Booklets
    description: Entity booklet PDF exports
  - name: Payments
    description: Rent payment tracking and management
  - name: Property Fees
    description: Recurring property fees (HOA, management, etc.)
  - name: User Preferences
    description: User preferences and notification channel settings
  - name: Health
    description: Health and info endpoints
  - name: Geocoding
    description: Address geocoding
  - name: Webhooks
    description: Provider status callbacks
  - name: Contracts
    description: Rental agreement management
  - name: Contract Extensions
    description: Contract extension lifecycle management
  - name: Data Imports
    description: Data import management for bulk operations
  - name: Dashboard
    description: Dashboard statistics and recent activities
  - name: Registration
    description: Public registration endpoints
  - name: Property Amenities
    description: Manage amenities for properties
  - name: Payment Instructions
    description: Team-level payment instruction templates
  - name: Authentication
    description: User registration and profile management
  - name: Property Financials
    description: Aggregated property financial overview
  - name: Documents
    description: Document management endpoints
  - name: Invitations
    description: Team invitation management
  - name: Feature Flags
    description: Feature flag configuration
  - name: Onboarding
    description: Team onboarding wizard
  - name: Currency
    description: Currency and country-currency mappings
  - name: Jurisdiction Defaults
    description: Country-specific renewal default values
  - name: Rent Regulations
    description: Rent regulation data by country and region
  - name: Rent Increases
    description: Annual rent increase preview and application
  - name: Impersonation
    description: Impersonation session management for support staff
  - name: Data Takeout
    description: Data export and takeout management
  - name: Broadcasts
    description: Broadcast messages for users
