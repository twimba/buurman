          type: integer
          format: int32
          description: Inclusive lower bound on building year (e.g. AT post-1953 = 1953).
        buildYearMax:
          type: integer
          format: int32
          description: Inclusive upper bound on building year (e.g. DK pre-1992 = 1991).
        epcClassMin:
          type: string
          description: EPC class lower bound (A best, G worst).
        epcClassMax:
          type: string
          description: EPC class upper bound (e.g. FR DPE freeze applies F-G).
        contractSignedAfter:
          type: string
          format: date
          description: Rule applies to contracts signed on/after this date (e.g. ES Ley 12/2023 → 2023-05-26).
        contractSignedBefore:
          type: string
          format: date
          description: Rule applies to contracts signed before this date.
        landlordMinProperties:
          type: integer
          format: int32
          description: Minimum number of properties owned for the rule to apply (e.g. ES gran tenedor = 5+ in Catalan zona tensionada).
        areaCode:
          type: string
          description: Region-internal area sub-code (e.g. FR DOM, FR CORSE).
