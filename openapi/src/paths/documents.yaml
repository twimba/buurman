    summary: Export contacts list to Excel
    description: Download all contacts for the team as an XLSX file
    operationId: exportContactsXlsx
    responses:
      "200":
        description: OK
        content:
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":
