booklets-contacts-google-sheet:
  post:
    tags:
      - Booklets
    summary: Export contacts list to Google Sheets
    description: |
      Creates a new Google Sheet in the user's Drive (under "Buurman exports") containing all
      contacts for the team, formatted with rich styling. Requires a user-supplied OAuth access
      token with the drive.file scope.
    operationId: exportContactsGoogleSheet
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GoogleSheetExportRequest'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSheetExportResponse'
      "400":
        description: Bad request - missing/invalid Google access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - feature flag disabled
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "502":
        description: Bad Gateway - Google API error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

