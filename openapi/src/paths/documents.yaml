photos:
  get:
    tags:
      - Photos
    summary: Search and list all photos
    description: Search across all photos with optional filters and pagination
    operationId: getAllPhotos
    parameters:
      - name: search
        in: query
        description: Search term
        required: false
        schema:
          type: string
      - name: entityType
        in: query
        description: Filter by entity type
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
        example: 25
      - name: sort
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
        example: createdAt
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          default: DESC
          description: Sort order direction for paginated queries
          enum:
            - ASC
            - DESC
        example: DESC
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageResponsePhotoResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
