booklets-contact-item:
  get:
    tags:
      - Booklets
    summary: Export contact booklet to PDF
    description: Download detailed contact booklet as PDF
    operationId: exportContactBooklet
    parameters:
      - name: contactIdentifier
        in: path
        description: Contact identifier
        required: true
        schema:
          $ref: '#/components/schemas/ContactIdentifier'
      - name: lang
        in: query
        description: Locale for booklet content (falls back to English if unsupported)
        required: false
        schema:
          type: string
          default: en
          enum: [en, nl, de, es, fr, pt, it, sv, fi, el, pl, da, nb]
    responses:
      "200":
        description: OK
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

