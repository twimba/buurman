ical-item:
  get:
    tags:
      - Calendar Feeds
    summary: Get iCalendar feed
    description: Public endpoint serving iCal feed content
    operationId: getCalendarFeed
    parameters:
      - name: feedToken
        in: path
        description: Calendar feed access token
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          text/calendar;charset=utf-8:
            schema:
              type: string
          text/calendar; charset=utf-8:
            schema:
              type: string
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
