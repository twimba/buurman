  post:
    tags:
      - Units
    summary: Bulk-create units
    description: Split a property into several labeled units in one batch (Admin/Editor). Promotes the property's implicit stand-in unit in place as the first of the batch.
    operationId: bulkCreateUnits
    parameters:
      - name: propertyIdentifier
