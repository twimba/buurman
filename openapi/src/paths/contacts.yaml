activity:
  get:
    tags:
      - Contacts
    summary: Get activity feed
    description: Get activity feed for a contact with pagination
    operationId: getContactActivity
    parameters:
      - name: contactIdentifier
        in: path
        description: Contact identifier
        required: true
        schema:
          $ref: '#/components/schemas/ContactIdentifier'
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
        example: 25
      - name: sort
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
        example: createdAt
