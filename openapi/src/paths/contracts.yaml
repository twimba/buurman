collection:
  get:
    tags:
      - Contracts
    summary: List contracts
    description: Get all contracts with optional filters and pagination
    operationId: getContracts
    parameters:
      - name: status
        in: query
        description: Filter by status
        required: false
        schema:
          type: string
          description: Current lifecycle status of the contract
          enum:
            - DRAFT
            - ACTIVE
            - EXPIRED
            - TERMINATED
            - PENDING_SIGNATURE
      - name: propertyIdentifier
        in: query
        description: Property identifier
        required: false
        schema:
          type: string
      - name: contactIdentifier
        in: query
        description: Contact identifier
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: Free-text search across contact name, property address/city, and contract identifier
        required: false
        schema:
          type: string
      - name: endingWithinDays
        in: query
        description: Only contracts whose effective end date falls within this many days from today
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
        example: 25
      - name: sort
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
        example: createdAt
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          default: DESC
          description: Sort order direction for paginated queries
          enum:
            - ASC
            - DESC
        example: DESC
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageResponseContractResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
