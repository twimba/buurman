item:
  get:
    tags:
      - Contracts
    summary: Get contract details
    description: Get details of a specific contract
    operationId: getContract
    parameters:
      - name: identifier
        in: path
        description: Contract identifier
        required: true
        schema:
          $ref: '#/components/schemas/ContractIdentifier'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  put:
    tags:
      - Contracts
    summary: Update contract
    description: Update contract information (Admin/Editor)
    operationId: updateContract
    parameters:
      - name: identifier
        in: path
        description: Contract identifier
        required: true
        schema:
          $ref: '#/components/schemas/ContractIdentifier'
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateContractRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
