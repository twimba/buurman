            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  post:
    tags:
      - Contracts
    summary: Create contract
    description: Create a new rental agreement (Admin/Editor)
    operationId: createContract
    requestBody:
      content:
        application/json:
          schema:
