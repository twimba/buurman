addresses-item:
  get:
    tags:
      - Tenants
    summary: Get address
    description: Get a specific address by identifier
    operationId: getAddress
    parameters:
      - name: tenantIdentifier
        in: path
        description: Tenant identifier
        required: true
        schema:
          $ref: '#/components/schemas/TenantIdentifier'
      - name: addressIdentifier
        in: path
        description: Address identifier
        required: true
        schema:
          $ref: '#/components/schemas/TenantAddressIdentifier'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAddressResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
