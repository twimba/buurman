    tags:
      - Tenants
    summary: Update address
    description: Update an existing address (Admin/Editor)
    operationId: updateAddress
    parameters:
      - name: tenantIdentifier
        in: path
        description: Tenant identifier
        required: true
        schema:
          $ref: '#/components/schemas/TenantIdentifier'
