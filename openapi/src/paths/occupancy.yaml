occupancy-periods-item:
  get:
    tags:
      - Occupancy Periods
    summary: Get occupancy period
    description: Get details of a specific self-occupancy period
    operationId: get
    parameters:
      - name: propertyIdentifier
        in: path
        description: Property identifier
        required: true
        schema:
          $ref: '#/components/schemas/PropertyIdentifier'
      - name: identifier
        in: path
        description: Occupancy period identifier
        required: true
        schema:
          $ref: '#/components/schemas/OccupancyPeriodIdentifier'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupancyPeriodResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  put:
    tags:
      - Occupancy Periods
    summary: Update occupancy period
    description: Update self-occupancy period details (Admin/Editor)
    operationId: update
    parameters:
      - name: propertyIdentifier
        in: path
        description: Property identifier
        required: true
        schema:
          $ref: '#/components/schemas/PropertyIdentifier'
      - name: identifier
        in: path
        description: Occupancy period identifier
        required: true
        schema:
          $ref: '#/components/schemas/OccupancyPeriodIdentifier'
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateOccupancyPeriodRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupancyPeriodResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  delete:
    tags:
      - Occupancy Periods
    summary: Delete occupancy period
    description: Soft delete a self-occupancy period (Admin only)
    operationId: delete
    parameters:
      - name: propertyIdentifier
        in: path
        description: Property identifier
        required: true
        schema:
          $ref: '#/components/schemas/PropertyIdentifier'
      - name: identifier
        in: path
        description: Occupancy period identifier
        required: true
        schema:
          $ref: '#/components/schemas/OccupancyPeriodIdentifier'
    responses:
      "204":
        description: No Content
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

