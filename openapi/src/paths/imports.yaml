upload:
  post:
    tags:
      - Data Imports
    summary: Upload import file
    description: Upload a CSV or XLSX file for contact import. Returns parsed column headers and preview rows.
    operationId: uploadImportFile
    parameters:
      - name: headerRow
        in: query
        description: Whether the first row contains column headers. When false, synthetic column names (Column A, Column B, ...) are generated.
        required: false
        schema:
          type: boolean
          default: true
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: CSV or XLSX file to import
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadResponse'
      "400":
        description: Bad request (unsupported format, empty file, etc.)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden (XLSX requires excel_export feature flag)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

preview:
  post:
    tags:
      - Data Imports
    summary: Preview import
    description: Submit column mapping and get a dry-run preview of what will be created, skipped, or errored.
    operationId: previewImport
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImportPreviewRequest'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewResponse'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

execute:
  post:
    tags:
      - Data Imports
    summary: Execute import
    description: Confirm and execute the import, creating contacts from the uploaded file with the given column mapping.
    operationId: executeImport
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImportExecuteRequest'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExecuteResponse'
      "400":
        description: Bad request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

collection:
  get:
    tags:
      - Data Imports
    summary: List imports
    description: Get paginated list of data imports for the current team
    operationId: listImports
    parameters:
      - name: page
        in: query
        description: Page number (zero-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageResponseDataImportResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

item:
  get:
    tags:
      - Data Imports
    summary: Get import details
    description: Get details of a specific data import including imported items
    operationId: getImport
    parameters:
      - name: identifier
        in: path
        description: Data import identifier
        required: true
        schema:
          $ref: '#/components/schemas/DataImportIdentifier'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataImportDetailResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

revert:
  post:
    tags:
      - Data Imports
    summary: Revert import
    description: Revert a data import, deleting all contacts and related entities created by the import.
    operationId: revertImport
    parameters:
      - name: identifier
        in: path
        description: Data import identifier
        required: true
        schema:
          $ref: '#/components/schemas/DataImportIdentifier'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRevertResponse'
      "400":
        description: Bad request (import already reverted or too old)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

error-report:
  get:
    tags:
      - Data Imports
    summary: Download error report
    description: Download CSV error report for a data import
    operationId: downloadImportErrorReport
    parameters:
      - name: identifier
        in: path
        description: Data import identifier
        required: true
        schema:
          $ref: '#/components/schemas/DataImportIdentifier'
    responses:
      "200":
        description: OK
        content:
          text/csv:
            schema:
              type: string
              format: binary
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
