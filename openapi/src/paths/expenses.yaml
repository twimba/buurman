collection:
  get:
    tags:
      - Expenses
    summary: List expenses
    description: Get all expenses with optional filters and pagination
    operationId: getExpenses
    parameters:
      - name: category
        in: query
        description: Filter by category
        required: false
        schema:
          type: string
          description: Category of the property-related expense
          enum:
            - MAINTENANCE
            - REPAIR
            - UTILITY
            - TAX
            - INSURANCE
            - LEGAL
            - MARKETING
            - CLEANING
            - LANDSCAPING
            - PROPERTY_MANAGEMENT
            - FEES
            - PROPERTY_TAX
            - OTHER
      - name: propertyIdentifier
        in: query
        description: Property identifier
        required: false
        schema:
          type: string
      - name: contactIdentifier
        in: query
        description: Filter by contact identifier
        required: false
        schema:
          type: string
      - name: dateFrom
        in: query
        description: Start date filter (inclusive)
        required: false
        schema:
          type: string
          format: date
        example: "2026-01-01"
      - name: dateTo
        in: query
        description: End date filter (inclusive)
        required: false
        schema:
          type: string
          format: date
        example: "2026-12-31"
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 25
        example: 25
      - name: sort
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
        example: createdAt
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          default: DESC
          description: Sort order direction for paginated queries
          enum:
            - ASC
            - DESC
        example: DESC
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageResponseExpenseResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  post:
    tags:
      - Expenses
    summary: Create expense
    description: Record a new property expense (Admin/Editor)
    operationId: createExpense
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateExpenseRequest'
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
