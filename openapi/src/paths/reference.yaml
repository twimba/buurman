webhooks-twilio-status:
  post:
    tags:
      - Webhooks
    summary: Twilio status callback
    description: Receives SMS delivery status from Twilio
    operationId: handleTwilioStatus
    parameters:
      - name: params
        in: query
        description: Twilio status callback form parameters
        required: true
        schema:
          type: object
          additionalProperties:
            type: string
      - name: X-Twilio-Signature
        in: header
        description: Twilio request signature
        required: false
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          "*/*":
            schema:
              type: string
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'

