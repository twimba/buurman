resend:
  post:
    tags:
      - Notifications
    summary: Resend notification
    description: Resend a failed notification (Admin only)
    operationId: resendNotification
    parameters:
      - name: identifier
        in: path
        description: Notification identifier
        required: true
        schema:
          $ref: '#/components/schemas/NotificationIdentifier'
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

