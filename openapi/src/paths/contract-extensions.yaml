extensions-addendum:
  get:
    tags:
      - Letters
    summary: Download extension addendum PDF
    description: Download the addendum document for a contract extension as PDF
    operationId: getExtensionAddendum
    parameters:
      - name: contractIdentifier
        in: path
        description: Contract identifier
        required: true
        schema:
          type: string
      - name: extensionIdentifier
        in: path
        description: Extension identifier
        required: true
        schema:
          type: string
      - name: lang
        in: query
        description: Document language (ISO 639-1 code)
        required: false
        schema:
          type: string
          default: en
          example: nl
    responses:
      "200":
        description: PDF addendum
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
