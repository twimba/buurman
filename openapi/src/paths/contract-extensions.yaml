extensions:
  get:
    tags:
      - Contract Extensions
    summary: List contract extensions
    description: List all extensions for a contract with pagination
    operationId: listContractExtensions
    parameters:
      - name: contractIdentifier
        in: path
        description: Contract identifier
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (zero-based)
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        description: Page size
        schema:
          type: integer
          default: 20
    responses:
      "200":
        description: Extensions list
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageResponseContractExtensionResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  post:
    tags:
      - Contract Extensions
    summary: Create a draft contract extension
    description: Create a new extension in DRAFT status for a contract
    operationId: createContractExtension
    parameters:
      - name: contractIdentifier
        in: path
        description: Contract identifier
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateContractExtensionRequest'
    responses:
      "201":
        description: Extension created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractExtensionResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

extensions-item:
  get:
    tags:
      - Contract Extensions
    summary: Get contract extension details
    description: Get details of a specific contract extension
    operationId: getContractExtension
    parameters:
      - name: contractIdentifier
        in: path
        description: Contract identifier
        required: true
        schema:
          type: string
      - name: extensionIdentifier
        in: path
        description: Extension identifier
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Extension detail
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractExtensionResponse'
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []
  delete:
    tags:
      - Contract Extensions
    summary: Cancel (soft delete) a draft extension
    description: Cancel a draft extension, marking it as soft-deleted. Optionally delete generated documents.
    operationId: cancelContractExtension
    parameters:
      - name: contractIdentifier
        in: path
        description: Contract identifier
        required: true
        schema:
          type: string
      - name: extensionIdentifier
        in: path
        description: Extension identifier
        required: true
        schema:
          type: string
      - name: deleteDocuments
        in: query
        description: Also delete generated documents for this extension
        required: false
        schema:
          type: boolean
          default: false
    responses:
      "204":
        description: Extension cancelled
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "403":
        description: Forbidden - insufficient permissions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "404":
        description: Resource not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "409":
        description: Conflict - business rule violation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
    security:
      - bearer-jwt: []

