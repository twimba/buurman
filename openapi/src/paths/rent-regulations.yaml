countries-rules:
  get:
    tags:
      - Rent Regulations
    summary: Get rules by year for country
    description: Get rent regulation rules for a country filtered by year
    operationId: getRentRegulationRulesByYear
    parameters:
      - name: code
        in: path
        description: Country code (ISO 3166-1 alpha-2 or alpha-3)
        required: true
        schema:
          type: string
      - name: year
        in: query
        description: Year to filter rules
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1900
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RentRegulationRuleResponse'
      "400":
        description: Bad request - validation error or malformed input
