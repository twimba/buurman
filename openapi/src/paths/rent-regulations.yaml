    security:
      - bearer-jwt: []

country-requests:
  post:
    tags:
      - Rent Regulations
    summary: Request country regulation data
    description: Submit a request for regulation data for a country not yet available
    operationId: requestCountryRegulation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCountryRegulationRequestRequest'
    responses:
      "204":
        description: Request submitted (or already exists)
      "400":
        description: Bad request - validation error or malformed input
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDetail'
      "401":
        description: Unauthorized - missing or invalid JWT token
