[project]
name = "buurman-bdd"
version = "0.1.0"
description = "BDD behavior tests for Buurman property management system"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-bdd>=8.0",
    "pytest-html>=4.0",
    "pytest-xdist>=3.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["step_defs"]
bdd_features_base_dir = "features/"
markers = [
    "smoke: Quick smoke tests for local development",
    "critical: Critical path scenarios that must always pass",
    "properties: Property management scenarios",
    "contacts: Contact management scenarios",
    "contracts: Contract lifecycle scenarios",
    "payments: Payment tracking scenarios",
    "multi_tenancy: Multi-tenant data isolation scenarios",
    "access_control: Role-based access control scenarios",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
