  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Surfaces */
      --surface-page: #fafaf9;
      --surface-card: #ffffff;
      --surface-inset: #f5f5f4;

      /* Text */
      --text-primary: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #78716c;
      --text-disabled: #a8a29e;
      --text-link: #6366f1;

      /* Borders */
      --border-default: #e7e5e4;
      --border-subtle: #f5f5f4;
      --border-strong: #d6d3d1;

      /* Primary (indigo) */
      --primary-50: #eef2ff;
      --primary-100: #e0e7ff;
      --primary-500: #6366f1;
      --primary-600: #4f46e5;
      --primary-700: #4338ca;
      --primary-900: #312e81;

      /* Semantic */
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --info: #0284c7;
      --info-bg: #f0f9ff;

      /* Category colors */
      --cat-app-bg: #eef2ff;
      --cat-app-border: #c7d2fe;
      --cat-app-text: #4338ca;
      --cat-backend-bg: #f5f3ff;
      --cat-backend-border: #ddd6fe;
      --cat-backend-text: #6d28d9;
      --cat-auth-bg: #fffbeb;
      --cat-auth-border: #fde68a;
      --cat-auth-text: #b45309;
      --cat-devtools-bg: #fff1f2;
      --cat-devtools-border: #fecdd3;
      --cat-devtools-text: #be123c;
      --cat-monitoring-bg: #ecfdf5;
      --cat-monitoring-border: #a7f3d0;
      --cat-monitoring-text: #047857;

      /* Shadows (warm stone tint) */
      --shadow-xs: 0 1px 2px rgba(28, 25, 23, 0.04);
      --shadow-sm: 0 1px 3px rgba(28, 25, 23, 0.06), 0 1px 2px rgba(28, 25, 23, 0.04);
      --shadow-md: 0 4px 8px -2px rgba(28, 25, 23, 0.06), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
      --shadow-lg: 0 12px 24px -4px rgba(28, 25, 23, 0.08), 0 4px 8px -4px rgba(28, 25, 23, 0.03);
      --shadow-ring: 0 0 0 3px rgba(99, 102, 241, 0.15);

      /* Typography */
      --font-body: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }

    body {
      font-family: var(--font-body);
      background: var(--surface-page);
      color: var(--text-primary);
      line-height: 1.55;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }

    .hub {
      max-width: 880px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-default);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .workspace-count {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--primary-700);
      background: var(--primary-50);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid var(--primary-100);
    }

    .refresh-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-strong);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .refresh-dot.pulse {
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
      animation: dot-fade 1.2s ease-out forwards;
    }
    @keyframes dot-fade {
      0% { box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2); }
      100% { box-shadow: 0 0 0 0px rgba(5, 150, 105, 0); background: var(--border-strong); }
    }

    /* ─── Workspace Cards ─── */
    .workspaces {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .ws-card {
      background: var(--surface-card);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 1.15rem 1.35rem 1.1rem;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
      opacity: 0;
      transform: translateY(6px);
      animation: card-in 0.3s ease forwards;
    }
    .ws-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }
    @keyframes card-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.15rem;
      flex-wrap: wrap;
    }

    .ws-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--primary-700);
      background: var(--primary-50);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(99, 102, 241, 0.12);
    }

    .ws-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .ws-branch {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface-inset);
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .ws-path {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-disabled);
      margin-bottom: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ─── Service Chips ─── */
    .services {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .svc {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.28rem 0.6rem;
      border-radius: 4px;
      font-size: 0.73rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .svc:hover {
      box-shadow: var(--shadow-sm);
      filter: brightness(0.97);
      transform: translateY(-0.5px);
    }
    .svc:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* Category-specific styling */
    .svc[data-cat="app"] {
      background: var(--cat-app-bg);
      color: var(--cat-app-text);
      border-color: var(--cat-app-border);
    }
    .svc[data-cat="backend"] {
      background: var(--cat-backend-bg);
      color: var(--cat-backend-text);
      border-color: var(--cat-backend-border);
    }
    .svc[data-cat="auth"] {
      background: var(--cat-auth-bg);
      color: var(--cat-auth-text);
      border-color: var(--cat-auth-border);
    }
    .svc[data-cat="devtools"] {
      background: var(--cat-devtools-bg);
      color: var(--cat-devtools-text);
      border-color: var(--cat-devtools-border);
    }
    .svc[data-cat="monitoring"] {
      background: var(--cat-monitoring-bg);
      color: var(--cat-monitoring-text);
      border-color: var(--cat-monitoring-border);
    }

    /* Status dots */
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.docker {
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }
    .dot.host {
      background: var(--warning);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.12);
    }
    .dot.unknown {
      background: var(--text-disabled);
    }

    /* ─── Empty / Error States ─── */
    .state-box {
      text-align: center;
      padding: 4rem 2rem;
      opacity: 0;
      animation: card-in 0.35s ease 0.1s forwards;
    }
    .state-box h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .state-box p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .state-box code {
      font-family: var(--font-mono);
      background: var(--surface-inset);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.78rem;
      border: 1px solid var(--border-default);
      color: var(--text-primary);
    }

    /* ─── Quick Links ─── */
    .quick-links-section {
      margin-bottom: 1.25rem;
    }

    .section-label {
      font-size: 0.67rem;
      font-weight: 700;
      color: var(--text-disabled);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.45rem;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .qlink {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.38rem 0.7rem 0.38rem 0.55rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-secondary);
      background: var(--surface-card);
      border: 1px solid var(--border-default);
      box-shadow: var(--shadow-xs);
      transition: all 0.15s ease;
    }
    .qlink:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .qlink:active {
      transform: translateY(0);
      box-shadow: var(--shadow-xs);
    }

    .qlink-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .qlink-arrow {
      width: 10px;
      height: 10px;
      opacity: 0.3;
      flex-shrink: 0;
      margin-left: 0.1rem;
    }

    /* ─── Footer Legend ─── */
    .legend {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.25rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-default);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-disabled);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .legend-refresh {
      margin-left: auto;
      font-size: 0.65rem;
      color: var(--text-disabled);
    }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      body { padding: 1rem 0.75rem; }
      .header { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
      .header-right { align-self: flex-end; margin-top: -1.6rem; }
      .ws-card { padding: 1rem 1rem 0.9rem; }
      .ws-branch { max-width: 200px; }
      .card-top { gap: 0.4rem; }
    }
  </style>
</head>

    function renderQuickLinks() {
      const links = QUICK_LINKS.map(l =>
        `<a class="qlink" href="${l.url}" target="_blank" rel="noopener">${l.icon}${l.label}${ARROW_SVG}</a>`
      ).join("");
      return `
        <div class="quick-links-section">
          <div class="section-label">Quick Links</div>
          <div class="quick-links">${links}</div>
        </div>`;
    }

    function renderCard(ws, idx) {
      const branch = ws.branch
        ? `<span class="ws-branch" title="${esc(ws.branch)}">${esc(ws.branch)}</span>`
        : "";

      const chips = ws.services.map(s => {
        const tip = s.status === "docker" ? "Running in Docker"
                  : s.status === "host" ? "Running on host"
                  : "Status unknown";
        return `<a class="svc" href="${s.url}" target="_blank" rel="noopener"
                   data-cat="${s.category}" title="${tip}">
                  <span class="dot ${s.status}"></span>${s.label}</a>`;
      }).join("");

      return `
        <div class="ws-card" style="animation-delay:${idx * 0.05}s">
          <div class="card-top">
            <span class="ws-badge">W${ws.number}</span>
            <span class="ws-name">${esc(ws.name)}</span>
            ${branch}
          </div>
          <div class="ws-path">${esc(ws.path)}</div>
          <div class="services">${chips}</div>
        </div>`;
    }

    function render(workspaces) {
      const hub = document.getElementById("hub");

      if (workspaces === null) {
        hub.innerHTML = renderHeader(0) + renderQuickLinks() + `
          <div class="state-box">
            <h2>Unable to fetch workspace data</h2>
            <p>Check that the hub server is running.</p>
          </div>`;
        return;
      }

      const n = workspaces.length;
      let html = renderHeader(n) + renderQuickLinks();

      if (n === 0) {
        html += `
          <div class="state-box">
            <h2>No active workspaces</h2>
            <p>Set up a workspace to get started:<br><code>make workspace-setup WS=1</code></p>
          </div>`;
      } else {
        html += '<div class="workspaces">';
        workspaces.forEach((ws, i) => { html += renderCard(ws, i); });
        html += "</div>";
        html += `
          <div class="legend">
            <span class="legend-item"><span class="dot docker"></span> Docker</span>
            <span class="legend-item"><span class="dot host"></span> Host</span>
            <span class="legend-item"><span class="dot unknown"></span> Unknown</span>
            <span class="legend-refresh">Refreshes every 30s</span>
          </div>`;
      }

      hub.innerHTML = html;
    }

    async function refresh() {
      try {
        const res = await fetch("/api/workspaces");
        render(await res.json());
      } catch {
        render(null);
      }
      const dot = document.getElementById("rdot");
      if (dot) {
        dot.classList.remove("pulse");
        void dot.offsetWidth;
        dot.classList.add("pulse");
      }
    }

    refresh();
    setInterval(refresh, INTERVAL);

  <!-- ═══════════════════════════════════════════════════════════════════════
       KONAMI CODE EASTER EGG: ENTER THE MATRIX
       ↑ ↑ ↓ ↓ ← → ← → B A
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
  (function() {
    'use strict';

    /* ──────────────────────────────────────────
       KONAMI CODE DETECTION
       ────────────────────────────────────────── */
    const KONAMI = [38,38,40,40,37,39,37,39,66,65];
    let pos = 0;
    let matrixActive = false;

    document.addEventListener('keydown', e => {
      if (matrixActive) { return; }
      if (e.keyCode === KONAMI[pos]) {
        pos++;
        // Subtle green flash on each correct key
        if (pos > 0 && pos < KONAMI.length) {
          const flash = document.createElement('div');
          flash.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,255,65,0.03);z-index:99998;pointer-events:none;';
          document.body.appendChild(flash);
          setTimeout(() => flash.remove(), 150);
        }
        if (pos === KONAMI.length) {
          pos = 0;
          enterTheMatrix();
        }
      } else {
        pos = 0;
      }
    });

    /* ──────────────────────────────────────────
       AUDIO ENGINE (Web Audio API)
       ────────────────────────────────────────── */
    let audioCtx, masterGain, droneNodes = [];

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(audioCtx.destination);
    }

    function startDrone() {
      if (!audioCtx) { return; }
      // Eerie layered ambient drone
      const layers = [
        { freq: 40,   type: 'sawtooth', gain: 0.06, filterFreq: 120 },
        { freq: 60,   type: 'sine',     gain: 0.04, filterFreq: 180 },
        { freq: 80,   type: 'triangle', gain: 0.03, filterFreq: 200 },
        { freq: 120,  type: 'sine',     gain: 0.025, filterFreq: 250 },
        { freq: 160,  type: 'sine',     gain: 0.015, filterFreq: 300 },
      ];
      layers.forEach(l => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = l.type;
        osc.frequency.value = l.freq;
        // Add slow LFO for movement
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 0.1 + Math.random() * 0.3;
        lfoGain.gain.value = l.freq * 0.02;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        filter.type = 'lowpass';
        filter.frequency.value = l.filterFreq;
        filter.Q.value = 1.5;
        gain.gain.value = l.gain;
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start();
        droneNodes.push({ osc, gain, filter, lfo, lfoGain });
      });
      // Add noise layer for texture
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.value = 0.008;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 800;
      noiseFilter.Q.value = 0.5;
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(masterGain);
      noise.start();
      droneNodes.push({ osc: noise, gain: noiseGain, filter: noiseFilter });
      masterGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 4);
    }

    function stopDrone() {
      if (!audioCtx || !masterGain) { return; }
      masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
      setTimeout(() => {
        droneNodes.forEach(n => {
          try { n.osc.stop(); } catch(e) {}
          try { if (n.lfo) { n.lfo.stop(); } } catch(e) {}
        });
        droneNodes = [];
      }, 2000);
    }

    function playKeystroke() {
      if (!audioCtx) { return; }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 600 + Math.random() * 600;
      gain.gain.value = 0.04;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    function playGlitchSound() {
      if (!audioCtx) { return; }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 100 + Math.random() * 2000;
      gain.gain.value = 0.06;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    /* ──────────────────────────────────────────
       DIGITAL RAIN (Canvas)
       ────────────────────────────────────────── */
    let rainCanvas, rainCtx, rainAnim;
    const MATRIX_CHARS = '\u30A2\u30A4\u30A6\u30A8\u30AA\u30AB\u30AD\u30AF\u30B1\u30B3\u30B5\u30B7\u30B9\u30BB\u30BD\u30BF\u30C1\u30C4\u30C6\u30C8\u30CA\u30CB\u30CC\u30CD\u30CE\u30CF\u30D2\u30D5\u30D8\u30DB\u30DE\u30DF\u30E0\u30E1\u30E2\u30E4\u30E6\u30E8\u30E9\u30EA\u30EB\u30EC\u30ED\u30EF\u30F2\u30F30123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]|/\\!@#$%^&*()+=~';

    function createRain() {
      rainCanvas = document.createElement('canvas');
      rainCanvas.id = 'matrix-rain';
      rainCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0;transition:opacity 2s;';
      document.body.appendChild(rainCanvas);
      rainCtx = rainCanvas.getContext('2d');

      const fontSize = 14;
      let columns, drops, speeds, brightness, trails;

      function initColumns() {
        rainCanvas.width = window.innerWidth * window.devicePixelRatio;
        rainCanvas.height = window.innerHeight * window.devicePixelRatio;
        rainCanvas.style.width = window.innerWidth + 'px';
        rainCanvas.style.height = window.innerHeight + 'px';
        rainCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        columns = Math.floor(window.innerWidth / fontSize);
        drops = new Array(columns).fill(0).map(() => Math.random() * -100);
        speeds = new Array(columns).fill(0).map(() => 0.3 + Math.random() * 1.2);
        brightness = new Array(columns).fill(0).map(() => 0.5 + Math.random() * 0.5);
        trails = new Array(columns).fill(0).map(() => 15 + Math.floor(Math.random() * 25));
      }
      initColumns();

      function draw() {
        // Fade effect - creates the trail
        rainCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        rainCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        rainCtx.font = fontSize + 'px monospace';

        for (let i = 0; i < columns; i++) {
          const char = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
          const y = drops[i] * fontSize;
          const b = brightness[i];

          // Head character (bright white-green)
          const headAlpha = 0.9 + b * 0.1;
          rainCtx.fillStyle = `rgba(${200 + b * 55}, 255, ${200 + b * 55}, ${headAlpha})`;
          rainCtx.fillText(char, i * fontSize, y);

          // Secondary bright char just behind head
          if (drops[i] > 1) {
            const char2 = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
            rainCtx.fillStyle = `rgba(0, ${200 + b * 55}, 0, ${0.7 + b * 0.2})`;
            rainCtx.fillText(char2, i * fontSize, y - fontSize);
          }

          // Random mid-trail flicker
          if (Math.random() > 0.97 && drops[i] > 5) {
            const flickerY = y - (2 + Math.random() * trails[i]) * fontSize;
            const flickerChar = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
            rainCtx.fillStyle = `rgba(0, ${180 + Math.random() * 75}, 0, ${0.4 + Math.random() * 0.3})`;
            rainCtx.fillText(flickerChar, i * fontSize, flickerY);
          }

          // Reset when off screen
          if (y > window.innerHeight + 100 && Math.random() > 0.98) {
            drops[i] = Math.random() * -20;
            speeds[i] = 0.3 + Math.random() * 1.2;
            brightness[i] = 0.5 + Math.random() * 0.5;
          }
          drops[i] += speeds[i];
        }
        rainAnim = requestAnimationFrame(draw);
      }

      window.addEventListener('resize', initColumns);
      draw();
      setTimeout(() => { rainCanvas.style.opacity = '0.5'; }, 100);
    }

    function destroyRain() {
      if (rainAnim) { cancelAnimationFrame(rainAnim); rainAnim = null; }
      if (rainCanvas) {
        rainCanvas.style.opacity = '0';
        setTimeout(() => { if (rainCanvas) { rainCanvas.remove(); rainCanvas = null; } }, 2000);
      }
    }

    /* ──────────────────────────────────────────
       CRT OVERLAY + SCANLINES
       ────────────────────────────────────────── */
    function createCRT() {
      const crt = document.createElement('div');

    /* ──────────────────────────────────────────
       RANDOM GLITCH EFFECTS
       ────────────────────────────────────────── */
    let glitchInterval;
    function startGlitchEffects() {
      glitchInterval = setInterval(() => {
        if (!matrixActive) { return; }
        if (Math.random() > 0.7) {
          const hub = document.getElementById('hub');
          if (!hub) { return; }
          // Screen tear effect
          const tear = document.createElement('div');
          const tearY = Math.random() * 100;
          const tearH = 2 + Math.random() * 8;
          tear.style.cssText = `position:fixed;top:${tearY}%;left:0;width:100vw;height:${tearH}px;background:rgba(0,255,65,${0.1 + Math.random()*0.2});z-index:9999;pointer-events:none;transform:translateX(${-5 + Math.random()*10}px);mix-blend-mode:screen;`;
          document.body.appendChild(tear);
          playGlitchSound();
          setTimeout(() => tear.remove(), 50 + Math.random() * 100);

          // Occasionally RGB split the whole page
          if (Math.random() > 0.6) {
            hub.style.textShadow = `${-2 + Math.random()*4}px 0 rgba(255,0,0,0.4), ${-2 + Math.random()*4}px 0 rgba(0,0,255,0.4)`;
            setTimeout(() => { hub.style.textShadow = ''; }, 80 + Math.random() * 120);
          }
        }
      }, 3000 + Math.random() * 5000);
    }

    function stopGlitchEffects() {
      if (glitchInterval) { clearInterval(glitchInterval); glitchInterval = null; }
    }

    /* ──────────────────────────────────────────
       BOOT SEQUENCE — "Wake up, Neo..."
       ────────────────────────────────────────── */
    function bootSequence() {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.id = 'matrix-boot';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:1;';
        const terminal = document.createElement('div');
        terminal.style.cssText = 'font-family:"Courier New",monospace;color:#00ff41;font-size:clamp(0.9rem,2.5vw,1.4rem);text-align:left;max-width:650px;width:90%;padding:2rem;line-height:2;';
        overlay.appendChild(terminal);
        document.body.appendChild(overlay);

        // Blinking cursor element
        const cursor = document.createElement('span');
        cursor.textContent = '█';
        cursor.style.cssText = 'animation:blink-cursor 0.7s step-end infinite;';

        const lines = [
          { text: 'Wake up, Neo...', pause: 2000, clear: true },
          { text: 'The Matrix has you...', pause: 2000, clear: true },
          { text: 'Follow the white rabbit.', pause: 1800, clear: true },
          { text: '', pause: 800, clear: false },
          { text: 'Knock, knock, Neo.', pause: 1500, clear: false },
        ];

        let lineIdx = 0;
        let currentLine = null;

        function typeLine() {
          if (lineIdx >= lines.length) {
            // DRAMATIC EXIT — green flash, then black, then resolve
            setTimeout(() => {
              // First flash: bright green
              overlay.style.transition = 'background 0.08s';
              overlay.style.background = '#00ff41';
              playGlitchSound();
              setTimeout(() => {
                overlay.style.background = '#000';
                setTimeout(() => {
                  // Second flash
                  overlay.style.background = 'rgba(0,255,65,0.3)';
                  playGlitchSound();
                  setTimeout(() => {
                    overlay.style.background = '#000';
                    setTimeout(() => {
                      // Fade out
                      overlay.style.transition = 'opacity 0.8s';
                      overlay.style.opacity = '0';
                      setTimeout(() => {
                        overlay.remove();
                        resolve();
                      }, 800);
                    }, 200);
                  }, 80);
                }, 150);
              }, 80);
            }, 600);
            return;
          }

          const line = lines[lineIdx];
          if (line.text === '') {
            lineIdx++;
            setTimeout(typeLine, line.pause);
            return;
          }

          currentLine = document.createElement('div');
          currentLine.style.cssText = 'text-shadow:0 0 10px #00ff41,0 0 20px rgba(0,255,65,0.3);min-height:1.8em;';
          terminal.appendChild(currentLine);

          let charIdx = 0;
          function typeChar() {
            if (charIdx < line.text.length) {
              // Remove cursor, add char, re-add cursor
              if (cursor.parentNode) { cursor.remove(); }
              currentLine.textContent += line.text[charIdx];
              currentLine.appendChild(cursor);
              charIdx++;
              playKeystroke();
              setTimeout(typeChar, 40 + Math.random() * 70);
            } else {
              // Done typing this line
              if (cursor.parentNode) { cursor.remove(); }
              lineIdx++;
              if (line.clear) {
                setTimeout(() => {
                  currentLine.style.transition = 'opacity 0.5s';
                  currentLine.style.opacity = '0';
                  setTimeout(() => { currentLine.remove(); typeLine(); }, 500);
                }, line.pause);
              } else {
                setTimeout(typeLine, line.pause);
              }
            }
          }
          typeChar();
        }

        // Start with a brief darkness + cursor blink
        setTimeout(typeLine, 1200);
      });
    }

          cursor: pointer !important;
          box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 0 0 40px rgba(59, 130, 246, 0.1);
          transition: all 0.3s ease;
          text-transform: uppercase;
          opacity: 0;
          transform: translateY(20px);
          animation: pill-glow 3s ease-in-out infinite, pill-appear 0.6s 0.5s ease forwards;
        }
        @keyframes pill-glow {
          0%, 100% { background-position: 0% 50%; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
          50% { background-position: 100% 50%; box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), 0 0 60px rgba(59, 130, 246, 0.2); }
        }
        @keyframes pill-appear {
          to { opacity: 1; transform: translateY(0); }
        }
        #matrix-exit:hover {
          background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #2563eb 100%);
          color: #fff;
          box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), 0 0 60px rgba(59, 130, 246, 0.3);
          transform: translateY(-2px) scale(1.05);
        }
        #matrix-exit:active {
          transform: translateY(0) scale(0.98);
        }

        /* ═══ Ambient particle layer ═══ */
        #matrix-particles {
          position: fixed;
          top: 0; left: 0;
          width: 100vw; height: 100vh;
          z-index: 1;
          pointer-events: none;
          opacity: 0;
          transition: opacity 2s;
        }

        /* ═══ Matrix mode reveal animation ═══ */
        body.matrix-mode .hub {
          animation: hub-reveal 1s ease-out forwards;
        }
        @keyframes hub-reveal {
          0% { opacity: 0; transform: perspective(1000px) rotateX(5deg) translateY(30px); filter: blur(5px); }
          100% { opacity: 1; transform: perspective(1000px) rotateX(0) translateY(0); filter: blur(0); }
        }

        /* ═══ "There is no spoon" tooltip ═══ */
        body.matrix-mode .logo {
          position: relative;
        }
        body.matrix-mode .header-left {
          position: relative;
        }
        body.matrix-mode .header-left::after {
          content: 'There is no spoon.';
          position: absolute;
          bottom: -20px;
          left: 0;
          font-family: 'Courier New', monospace;
          font-size: 0.6rem;
          color: rgba(0, 255, 65, 0);
          transition: color 0.3s;
          pointer-events: none;
          white-space: nowrap;
          text-shadow: 0 0 5px rgba(0, 255, 65, 0.3);
        }
        body.matrix-mode .header-left:hover::after {
          color: rgba(0, 255, 65, 0.5);
        }

        /* ═══ Animated border gradient on cards ═══ */
        body.matrix-mode .ws-card::after {
          content: '';
          position: absolute;
          top: -1px; left: -1px; right: -1px; bottom: -1px;
          border-radius: 9px;
          background: linear-gradient(
            var(--border-angle, 0deg),
            transparent 0%,
            rgba(0, 255, 65, 0.4) 25%,
            transparent 50%,
            rgba(0, 255, 65, 0.2) 75%,
            transparent 100%
          );
          z-index: -1;
          opacity: 0;
          transition: opacity 0.3s;
          animation: border-rotate 8s linear infinite;
        }
        body.matrix-mode .ws-card:hover::after {
          opacity: 1;
        }
        @property --border-angle {
          syntax: '<angle>';
          initial-value: 0deg;
          inherits: false;
        }
        @keyframes border-rotate {
          to { --border-angle: 360deg; }
        }

        /* ═══ Selection color ═══ */
        body.matrix-mode ::selection {
          background: rgba(0, 255, 65, 0.3);
          color: #fff;
        }

        /* ═══ Link hover glow ═══ */
        body.matrix-mode a:hover {
          text-shadow: 0 0 12px rgba(0, 255, 65, 0.7) !important;
        }
      `;
      document.head.appendChild(style);
    }

    /* ──────────────────────────────────────────
       FLOATING PARTICLES
       ────────────────────────────────────────── */
    let particleCanvas, particleCtx, particleAnim;

    function createParticles() {
      particleCanvas = document.createElement('canvas');
      particleCanvas.id = 'matrix-particles';
      document.body.appendChild(particleCanvas);

      particleCtx = particleCanvas.getContext('2d');
      const particles = [];
      const PARTICLE_COUNT = 50;

      function resize() {
        particleCanvas.width = window.innerWidth * window.devicePixelRatio;
        particleCanvas.height = window.innerHeight * window.devicePixelRatio;
        particleCanvas.style.width = window.innerWidth + 'px';
        particleCanvas.style.height = window.innerHeight + 'px';
        particleCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      resize();
      window.addEventListener('resize', resize);

      // Initialize particles
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.1 - Math.random() * 0.4,
          size: 1 + Math.random() * 2,
          alpha: 0.1 + Math.random() * 0.3,
          char: MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)],
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.02,
        });
      }

      function draw() {
        particleCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        particleCtx.font = '10px monospace';

        particles.forEach(p => {
          particleCtx.save();
          particleCtx.translate(p.x, p.y);
          particleCtx.rotate(p.rotation);
          particleCtx.fillStyle = `rgba(0, 255, 65, ${p.alpha})`;
          particleCtx.fillText(p.char, 0, 0);
          particleCtx.restore();

          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.rotSpeed;

          // Wrap around
          if (p.y < -10) { p.y = window.innerHeight + 10; p.x = Math.random() * window.innerWidth; }
          if (p.x < -10) { p.x = window.innerWidth + 10; }
          if (p.x > window.innerWidth + 10) { p.x = -10; }

          // Randomly change character
          if (Math.random() > 0.99) {
            p.char = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
          }
        });

        particleAnim = requestAnimationFrame(draw);
      }

      draw();
      setTimeout(() => { particleCanvas.style.opacity = '0.6'; }, 500);
    }

    function destroyParticles() {
      if (particleAnim) { cancelAnimationFrame(particleAnim); particleAnim = null; }
      if (particleCanvas) {
        particleCanvas.style.opacity = '0';
        setTimeout(() => { if (particleCanvas) { particleCanvas.remove(); particleCanvas = null; } }, 2000);
      }
    }

    /* ──────────────────────────────────────────
       EXIT BUTTON (Blue Pill)
       ────────────────────────────────────────── */
    function createExitButton() {
      const btn = document.createElement('button');
      btn.id = 'matrix-exit';
      btn.innerHTML = '\u{1F48A} Take the Blue Pill';
      btn.onclick = exitTheMatrix;
      document.body.appendChild(btn);
    }

    /* ──────────────────────────────────────────
       ENTER THE MATRIX
       ────────────────────────────────────────── */
    async function enterTheMatrix() {
      if (matrixActive) { return; }
      matrixActive = true;

      // Inject styles first (needed for boot sequence cursor animation)
      injectMatrixStyles();

      // Init audio (may fail if no user gesture — that's OK)
      try { initAudio(); } catch(e) {}
      try { startDrone(); } catch(e) {}

      // Boot sequence
      await bootSequence();

      // Apply matrix theme
      document.body.classList.add('matrix-mode');

      // Start visual effects
      createRain();
      createParticles();
      createCRT();
      createExitButton();
      startGlitchEffects();
    }

    /* ──────────────────────────────────────────
       EXIT THE MATRIX (Blue Pill)
       ────────────────────────────────────────── */
    function exitTheMatrix() {
      matrixActive = false;

      // Flash white (waking up)
      const flash = document.createElement('div');
      flash.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#fff;z-index:99999;opacity:0;transition:opacity 0.15s;pointer-events:none;';
      document.body.appendChild(flash);
      requestAnimationFrame(() => { flash.style.opacity = '1'; });

      setTimeout(() => {
        // Remove matrix class
        document.body.classList.remove('matrix-mode');

        // Remove injected styles
        const style = document.getElementById('matrix-theme');
        if (style) { style.remove(); }

        // Stop all effects
        destroyRain();
        destroyParticles();
        stopGlitchEffects();
        stopDrone();

        // Remove CRT
        const crt = document.getElementById('matrix-crt');
        if (crt) { crt.style.opacity = '0'; setTimeout(() => crt.remove(), 500); }

        // Remove exit button
        const btn = document.getElementById('matrix-exit');
        if (btn) { btn.remove(); }

        // Remove hub text shadow if glitch left it
        const hub = document.getElementById('hub');
        if (hub) { hub.style.textShadow = ''; }

        // Fade out white flash
        flash.style.transition = 'opacity 0.5s';
        flash.style.opacity = '0';
        setTimeout(() => flash.remove(), 500);
      }, 200);
    }
  })();
  </script>
</body>
